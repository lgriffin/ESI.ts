<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1480 860" font-family="Helvetica, Arial, sans-serif" font-size="13" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <title>ESI.ts value stream map, era 1: one maintainer with local agents (July to mid-September 2026)</title>
  <defs>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#333"/></marker>
    <marker id="arrb" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1f5fa8"/></marker>
  </defs>
  <rect width="1480" height="860" fill="#ffffff"/>
  <text x="30" y="36" font-size="22" font-weight="bold" fill="#111">Era 1 · One maintainer at the keyboard with local agents</text>
  <text x="30" y="58" fill="#555">Late June (v6) to 15 September (v9.9.0). 109 of my PRs merged. I worked in Claude Code on my own machine, opened each PR myself and merged it myself.</text>

  <!-- customer -->
  <g transform="translate(1250,80)">
    <path d="M0,70 L0,20 L40,0 L40,20 L80,0 L80,20 L120,0 L120,20 L160,0 L160,70 Z" fill="#fff4d6" stroke="#333" stroke-width="1.5"/>
    <text x="80" y="46" text-anchor="middle" font-weight="bold">npm consumers</text>
    <text x="80" y="62" text-anchor="middle" font-size="11">EVE tool builders</text>
  </g>
  <!-- supplier -->
  <g transform="translate(30,80)">
    <path d="M0,70 L0,20 L40,0 L40,20 L80,0 L80,20 L120,0 L120,20 L160,0 L160,70 Z" fill="#eef4fb" stroke="#333" stroke-width="1.5"/>
    <text x="80" y="46" text-anchor="middle" font-weight="bold">CCP / ESI spec</text>
    <text x="80" y="62" text-anchor="middle" font-size="11">OpenAPI 3.1, live API</text>
  </g>
  <g transform="translate(560,84)">
    <rect width="320" height="66" fill="#eef4fb" stroke="#1f5fa8" stroke-width="1.5"/>
    <text x="160" y="26" text-anchor="middle" font-weight="bold" fill="#1f5fa8">Me (production control and operator)</text>
    <text x="160" y="46" text-anchor="middle" font-size="12">plans, prompts, reviews, merges, releases</text>
  </g>
  <path d="M190,110 C350,110 450,115 558,115" fill="none" stroke="#1f5fa8" stroke-width="1.5" marker-end="url(#arrb)"/>
  <text x="300" y="100" fill="#1f5fa8" font-size="12">spec changes, weekly then nightly drift checks</text>
  <path d="M1250,120 C1100,115 1000,115 882,117" fill="none" stroke="#1f5fa8" stroke-width="1.5" stroke-dasharray="6 4" marker-end="url(#arrb)"/>
  <text x="960" y="104" fill="#1f5fa8" font-size="12">issues (46 open by Sep)</text>

  <g font-size="12">
    <g transform="translate(30,250)">
      <rect width="190" height="54" fill="#f2f2f2" stroke="#333" stroke-width="1.5"/>
      <text x="95" y="24" text-anchor="middle" font-weight="bold">1 · Build with a</text>
      <text x="95" y="41" text-anchor="middle" font-weight="bold">local agent session</text>
      <rect y="54" width="190" height="92" fill="#fff" stroke="#333"/>
      <text x="8" y="74">C/T  hours (not recorded)</text>
      <text x="8" y="92">me present throughout</text>
      <text x="8" y="110">tests run locally</text>
      <text x="8" y="128">one to many concerns per PR</text>
    </g>
    <g transform="translate(290,250)">
      <rect width="190" height="54" fill="#f2f2f2" stroke="#333" stroke-width="1.5"/>
      <text x="95" y="24" text-anchor="middle" font-weight="bold">2 · PR CI</text>
      <text x="95" y="41" text-anchor="middle" font-size="11">grew from lint+unit to many tiers</text>
      <rect y="54" width="190" height="92" fill="#fff" stroke="#333"/>
      <text x="8" y="74">slow tiers moved off the path:</text>
      <text x="8" y="92">mutation to nightly (#168)</text>
      <text x="8" y="110">Schemathesis nightly (#234)</text>
      <text x="8" y="128">audit diff-aware (#248)</text>
    </g>
    <g transform="translate(550,250)">
      <rect width="190" height="54" fill="#e8f4ea" stroke="#2d7a3a" stroke-width="2"/>
      <text x="95" y="24" text-anchor="middle" font-weight="bold">3 · Self-merge</text>
      <text x="95" y="41" text-anchor="middle" font-size="11">me, at the keyboard</text>
      <rect y="54" width="190" height="92" fill="#fff" stroke="#2d7a3a"/>
      <text x="8" y="74">PR open → merged, median:</text>
      <text x="8" y="92">7 min (late Jun to 8 Jul)</text>
      <text x="8" y="110">33 min (8 Jul to 5 Aug)</text>
      <text x="8" y="128">16 min (5 Aug to 15 Sep)</text>
    </g>
    <g transform="translate(810,250)">
      <rect width="190" height="54" fill="#fbe9e9" stroke="#b33" stroke-width="2"/>
      <text x="95" y="24" text-anchor="middle" font-weight="bold">4 · Release</text>
      <text x="95" y="41" text-anchor="middle" font-size="11">version bump, later release-please</text>
      <rect y="54" width="190" height="92" fill="#fff" stroke="#b33"/>
      <text x="8" y="74">4 majors in 10 weeks</text>
      <text x="8" y="92">(7.0, 8.0, 9.0, 10.0)</text>
      <text x="8" y="110">version sources drifted:</text>
      <text x="8" y="128">UA said 9.2.0 on 9.6.1</text>
    </g>
    <g transform="translate(1070,250)">
      <rect width="190" height="54" fill="#f2f2f2" stroke="#333" stroke-width="1.5"/>
      <text x="95" y="24" text-anchor="middle" font-weight="bold">5 · Publish</text>
      <text x="95" y="41" text-anchor="middle" font-size="11">npm, both registries</text>
      <rect y="54" width="190" height="92" fill="#fff" stroke="#333"/>
      <text x="8" y="74">provenance, SHA pins (#193)</text>
      <text x="8" y="92">cosign + checksums (#199)</text>
      <text x="8" y="110">9.6.1 and 9.6.2 bumped</text>
      <text x="8" y="128">but never published</text>
    </g>
  </g>
  <g stroke="#333" stroke-width="1.5">
    <line x1="222" y1="277" x2="286" y2="277" marker-end="url(#arr)"/>
    <line x1="482" y1="277" x2="546" y2="277" marker-end="url(#arr)"/>
    <line x1="742" y1="277" x2="806" y2="277" marker-end="url(#arr)"/>
    <line x1="1002" y1="277" x2="1066" y2="277" marker-end="url(#arr)"/>
    <path d="M1262,277 C1320,277 1330,200 1330,152" fill="none" marker-end="url(#arr)"/>
  </g>

  <!-- side stream: Dependabot -->
  <g transform="translate(290,470)">
    <rect width="190" height="54" fill="#f2f2f2" stroke="#333" stroke-width="1.5" stroke-dasharray="5 3"/>
    <text x="95" y="24" text-anchor="middle" font-weight="bold">Dependabot</text>
    <text x="95" y="41" text-anchor="middle" font-size="11">side stream, pushed at me</text>
    <rect y="54" width="190" height="74" fill="#fff" stroke="#333" stroke-dasharray="5 3"/>
    <text x="8" y="74">73 PRs since June</text>
    <text x="8" y="92">45 closed unmerged (62%)</text>
    <text x="8" y="110">one PR per sub-action</text>
  </g>
  <g transform="translate(560,470)">
    <path d="M18,0 L36,32 L0,32 Z" fill="#fff4d6" stroke="#333"/><text x="18" y="27" text-anchor="middle" font-weight="bold" font-size="11">I</text>
  </g>
  <text x="604" y="484" font-size="12">bot PRs waited: median 91 h in July,</text>
  <text x="604" y="500" font-size="12">48 h Aug to mid-Sep, before merge or close</text>
  <path d="M482,520 C540,520 540,520 556,500" fill="none" stroke="#333" stroke-width="1.5" marker-end="url(#arr)"/>

  <!-- nightly loop -->
  <g transform="translate(900,470)">
    <rect width="360" height="92" fill="#f7f7f7" stroke="#333"/>
    <text x="10" y="22" font-weight="bold">Nightly loop (built in this era)</text>
    <text x="10" y="42">spec drift files an issue, not a red PR (#160)</text>
    <text x="10" y="60">mutation, fuzz, recorded payloads, security audit</text>
    <text x="10" y="78">finds problems without blocking my next change</text>
  </g>

  <!-- kaizen -->
  <g font-size="12">
    <g transform="translate(30,610)"><path d="M0,20 L14,14 L10,0 L26,10 L36,-4 L42,12 L58,8 L50,22 L64,32 L46,34 L50,50 L34,40 L24,54 L20,38 L2,42 L12,30 Z" fill="#ffe36e" stroke="#333"/></g>
    <text x="100" y="628" font-weight="bold">What worked: I was the whole line, so there was no queue at merge.</text>
    <text x="100" y="646">Lead time from PR to master was minutes. The cost was that nothing moved when I stopped.</text>
    <g transform="translate(30,680)"><path d="M0,20 L14,14 L10,0 L26,10 L36,-4 L42,12 L58,8 L50,22 L64,32 L46,34 L50,50 L34,40 L24,54 L20,38 L2,42 L12,30 Z" fill="#ffe36e" stroke="#333"/></g>
    <text x="100" y="698" font-weight="bold">What did not: releases and bots produced more than anyone pulled.</text>
    <text x="100" y="716">Four majors in ten weeks, version sources out of step, and a bot stream that was mostly thrown away.</text>
  </g>
  <text x="30" y="800" font-size="11" fill="#555">Source: data/all-prs.csv (GitHub, 300 PRs), CHANGELOG.md, git tags. PR lead time starts when the PR opened; the local build time before it is not in the record.</text>
</svg>
