<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1480 860" font-family="Helvetica, Arial, sans-serif" font-size="13" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <title>ESI.ts value stream map, era 2: the parallel ramp-up (15 to 22 September 2026)</title>
  <defs>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#333"/></marker>
    <marker id="arrb" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1f5fa8"/></marker>
  </defs>
  <rect width="1480" height="860" fill="#ffffff"/>
  <text x="30" y="36" font-size="22" font-weight="bold" fill="#111">Era 2 · The parallel ramp-up</text>
  <text x="30" y="58" fill="#555">15 to 22 September. Agents working the phases of the "Hermes-grade" ramp-up in parallel. 66 PRs merged in a week; 262 commits on 16 and 17 September alone.</text>

  <g transform="translate(1250,80)">
    <path d="M0,70 L0,20 L40,0 L40,20 L80,0 L80,20 L120,0 L120,20 L160,0 L160,70 Z" fill="#fff4d6" stroke="#333" stroke-width="1.5"/>
    <text x="80" y="46" text-anchor="middle" font-weight="bold">npm consumers</text>
    <text x="80" y="62" text-anchor="middle" font-size="11">received 5 releases in 3 days</text>
  </g>
  <g transform="translate(560,84)">
    <rect width="320" height="66" fill="#eef4fb" stroke="#1f5fa8" stroke-width="1.5"/>
    <text x="160" y="26" text-anchor="middle" font-weight="bold" fill="#1f5fa8">Me, plus the charter and Beads</text>
    <text x="160" y="46" text-anchor="middle" font-size="12">phases as epics; the charter as the standard</text>
  </g>
  <path d="M560,130 C380,160 250,190 180,232" fill="none" stroke="#1f5fa8" stroke-width="1.5" stroke-dasharray="6 4" marker-end="url(#arrb)"/>
  <text x="240" y="176" fill="#1f5fa8" font-size="12" stroke="#fff" stroke-width="4" paint-order="stroke">agents work the phases in parallel</text>

  <g font-size="12">
    <g transform="translate(30,240)">
      <rect width="190" height="54" fill="#f2f2f2" stroke="#333" stroke-width="1.5"/>
      <text x="95" y="24" text-anchor="middle" font-weight="bold">1 · Parallel agents</text>
      <text x="95" y="41" text-anchor="middle" font-size="11">several phases at once</text>
      <rect y="54" width="190" height="92" fill="#fff" stroke="#333"/>
      <text x="8" y="74">ramp-up phases 1 to 6</text>
      <text x="8" y="92">one concern per PR</text>
      <text x="8" y="110">EARS rule first</text>
      <text x="8" y="128">check:local (#352)</text>
    </g>
    <g transform="translate(290,240)">
      <rect width="190" height="54" fill="#f2f2f2" stroke="#333" stroke-width="1.5"/>
      <text x="95" y="24" text-anchor="middle" font-weight="bold">2 · PR CI</text>
      <text x="95" y="41" text-anchor="middle" font-size="11">9 test tiers, ratchets, lints</text>
      <rect y="54" width="190" height="92" fill="#fff" stroke="#333"/>
      <text x="8" y="74">mutation on changed files,</text>
      <text x="8" y="92">per directory (#344)</text>
      <text x="8" y="110">floors held from nightly (#371)</text>
      <text x="8" y="128">determinism, suite-health lint</text>
    </g>
    <g transform="translate(550,240)">
      <rect width="190" height="54" fill="#fbe9e9" stroke="#b33" stroke-width="2"/>
      <text x="95" y="24" text-anchor="middle" font-weight="bold">3 · Merge</text>
      <text x="95" y="41" text-anchor="middle" font-size="11">me, one at a time</text>
      <rect y="54" width="190" height="92" fill="#fff" stroke="#b33"/>
      <text x="8" y="74">open → merged median 37 min</text>
      <text x="8" y="92" font-weight="bold" fill="#b33">p85 6 h 22 min</text>
      <text x="8" y="110">a queue appears at the</text>
      <text x="8" y="128">one step I still did by hand</text>
    </g>
    <g transform="translate(810,240)">
      <rect width="190" height="54" fill="#fbe9e9" stroke="#b33" stroke-width="2"/>
      <text x="95" y="24" text-anchor="middle" font-weight="bold">4 · Release</text>
      <text x="95" y="41" text-anchor="middle" font-size="11">release-please, every fix</text>
      <rect y="54" width="190" height="92" fill="#fff" stroke="#b33"/>
      <text x="8" y="74">10.0.0, 10.1.0, 10.1.1,</text>
      <text x="8" y="92">10.2.0, 10.2.1 in 3 days</text>
      <text x="8" y="110">npm publish needs a</text>
      <text x="8" y="128">manual dispatch (#378, #383)</text>
    </g>
    <g transform="translate(1070,240)">
      <rect width="190" height="54" fill="#f2f2f2" stroke="#333" stroke-width="1.5"/>
      <text x="95" y="24" text-anchor="middle" font-weight="bold">5 · Publish and verify</text>
      <text x="95" y="41" text-anchor="middle" font-size="11">jidoka at the shipping dock</text>
      <rect y="54" width="190" height="92" fill="#fff" stroke="#333"/>
      <text x="8" y="74">publish the tested tarball</text>
      <text x="8" y="92">verify what npm serves</text>
      <text x="8" y="110">signed SBOM (#372)</text>
      <text x="8" y="128">post-publish canary</text>
    </g>
  </g>
  <g stroke="#333" stroke-width="1.5">
    <line x1="222" y1="267" x2="286" y2="267" marker-end="url(#arr)"/>
    <line x1="482" y1="267" x2="546" y2="267" marker-end="url(#arr)"/>
    <line x1="742" y1="267" x2="806" y2="267" marker-end="url(#arr)"/>
    <line x1="1002" y1="267" x2="1066" y2="267" marker-end="url(#arr)"/>
    <path d="M1262,267 C1320,267 1330,200 1330,152" fill="none" marker-end="url(#arr)"/>
  </g>
  <g transform="translate(505,400)"><path d="M18,0 L36,32 L0,32 Z" fill="#fff4d6" stroke="#333"/><text x="18" y="27" text-anchor="middle" font-weight="bold" font-size="11">I</text></g>
  <text x="523" y="448" font-size="11" text-anchor="middle">stacked PRs</text>
  <g transform="translate(765,400)"><path d="M18,0 L36,32 L0,32 Z" fill="#fff4d6" stroke="#333"/><text x="18" y="27" text-anchor="middle" font-weight="bold" font-size="11">I</text></g>
  <text x="783" y="448" font-size="11" text-anchor="middle">release PRs</text>

  <g transform="translate(30,480)">
    <rect width="1230" height="100" fill="#f7f7f7" stroke="#333"/>
    <text x="12" y="24" font-weight="bold">What the new tiers found in their first week (quality built in, not inspected in)</text>
    <text x="12" y="46">5 pipeline races found by the composition tier (#339) · 5 defects found by model-based properties (#340) · an in-flight read served after a write changed it (#360)</text>
    <text x="12" y="66">publishing a tarball other than the one tested and signed (#365) · zod missing under --omit=dev (#390)</text>
    <text x="12" y="86">None of these reached a consumer as a bug report. All were found by the line itself.</text>
  </g>

  <g font-size="12">
    <g transform="translate(30,620)"><path d="M0,20 L14,14 L10,0 L26,10 L36,-4 L42,12 L58,8 L50,22 L64,32 L46,34 L50,50 L34,40 L24,54 L20,38 L2,42 L12,30 Z" fill="#ffe36e" stroke="#333"/></g>
    <text x="100" y="638" font-weight="bold">Throughput jumped fivefold; the merge and the release did not.</text>
    <text x="100" y="656">Weekly merged PRs went from 5 to 12 to 63. My merge step and release-please's per-fix cadence became the queues.</text>
    <g transform="translate(30,690)"><path d="M0,20 L14,14 L10,0 L26,10 L36,-4 L42,12 L58,8 L50,22 L64,32 L46,34 L50,50 L34,40 L24,54 L20,38 L2,42 L12,30 Z" fill="#ffe36e" stroke="#333"/></g>
    <text x="100" y="708" font-weight="bold">Mura: a burst, then quiet.</text>
    <text x="100" y="726">262 commits in two days, then a handful a day. Uneven load is its own waste, for people and for agents.</text>
  </g>
  <text x="30" y="800" font-size="11" fill="#555">Source: data/all-prs.csv, git log, CHANGELOG.md 10.0.0 to 10.2.1. </text>
</svg>
