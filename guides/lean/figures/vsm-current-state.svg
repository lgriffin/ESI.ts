<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1480 900" font-family="Helvetica, Arial, sans-serif" font-size="13" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <title>ESI.ts 11.0 value stream map, current state (26 to 27 September 2026)</title>
  <defs>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#333"/>
    </marker>
    <marker id="arrb" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#1f5fa8"/>
    </marker>
    <pattern id="push" width="12" height="12" patternUnits="userSpaceOnUse">
      <rect width="12" height="12" fill="#fff"/><path d="M0,12 L12,0" stroke="#333" stroke-width="1.5"/>
    </pattern>
  </defs>
  <rect width="1480" height="900" fill="#ffffff"/>

  <!-- Title -->
  <text x="30" y="36" font-size="22" font-weight="bold" fill="#111">Era 3 · Cloud threads, merging by hand (26 to 27 Sep)</text>
  <text x="30" y="58" fill="#555">Era 3: one change, from my ask to a commit on master. Medians over 24 PRs merged 26 Sep 09:39 to 27 Sep 11:42 UTC, before merge authority moved to the threads.</text>

  <!-- Customer (Leigh) -->
  <g transform="translate(1250,80)">
    <path d="M0,70 L0,20 L40,0 L40,20 L80,0 L80,20 L120,0 L120,20 L160,0 L160,70 Z" fill="#fff4d6" stroke="#333" stroke-width="1.5"/>
    <text x="80" y="46" text-anchor="middle" font-weight="bold">Me (Leigh)</text>
    <text x="80" y="62" text-anchor="middle" font-size="11">maintainer and customer</text>
    <text x="80" y="92" text-anchor="middle" font-size="11">~30 asks and answers over 31 h</text>
    <text x="80" y="107" text-anchor="middle" font-size="11">mostly from a phone</text>
  </g>

  <!-- Production control (Coordinator) -->
  <g transform="translate(560,90)">
    <rect width="300" height="74" fill="#eef4fb" stroke="#1f5fa8" stroke-width="1.5"/>
    <text x="150" y="26" text-anchor="middle" font-weight="bold" fill="#1f5fa8">Coordinator Claude (production control)</text>
    <text x="150" y="46" text-anchor="middle" font-size="12">routes each ask to a thread in &lt;10 s</text>
    <text x="150" y="63" text-anchor="middle" font-size="12">project memory = standard work</text>
  </g>
  <!-- info flows -->
  <path d="M1250,120 C1050,110 960,120 862,125" fill="none" stroke="#1f5fa8" stroke-width="1.5" marker-end="url(#arrb)"/>
  <text x="1000" y="106" fill="#1f5fa8" font-size="12" stroke="#fff" stroke-width="4" paint-order="stroke">asks (electronic, any hour)</text>
  <path d="M560,140 C400,150 250,170 150,245" fill="none" stroke="#1f5fa8" stroke-width="1.5" stroke-dasharray="6 4" marker-end="url(#arrb)"/>
  <text x="170" y="200" fill="#1f5fa8" font-size="12" stroke="#fff" stroke-width="4" paint-order="stroke">brief + user's words</text>
  <path d="M1290,195 C1240,235 1080,235 1040,262" fill="none" stroke="#b33" stroke-width="1.5" stroke-dasharray="3 3" marker-end="url(#arr)"/>
  <text x="1150" y="226" fill="#b33" font-size="12" stroke="#fff" stroke-width="4" paint-order="stroke">merge by hand</text>
  <path d="M1250,165 C1000,175 700,185 600,262" fill="none" stroke="#b33" stroke-width="1.5" stroke-dasharray="3 3" marker-end="url(#arr)"/>
  <text x="640" y="232" fill="#b33" font-size="12" stroke="#fff" stroke-width="4" paint-order="stroke">decision cards (6), median 131 min to answer</text>

  <!-- Process boxes -->
  <g font-size="12">
    <!-- P1 -->
    <g transform="translate(30,265)">
      <rect width="160" height="54" fill="#f2f2f2" stroke="#333" stroke-width="1.5"/>
      <text x="80" y="24" text-anchor="middle" font-weight="bold">1 · Route and</text>
      <text x="80" y="41" text-anchor="middle" font-weight="bold">spin up thread</text>
      <rect y="54" width="160" height="92" fill="#fff" stroke="#333"/>
      <text x="8" y="74">C/T  ~1 min</text>
      <text x="8" y="92">attach repo, read memory</text>
      <text x="8" y="110">FPY  ~100%</text>
      <text x="8" y="128">staff  1 agent per ask</text>
    </g>
    <!-- P2 -->
    <g transform="translate(250,265)">
      <rect width="170" height="54" fill="#f2f2f2" stroke="#333" stroke-width="1.5"/>
      <text x="85" y="24" text-anchor="middle" font-weight="bold">2 · Specify and build</text>
      <text x="85" y="41" text-anchor="middle" font-size="11">EARS rule, RED, code</text>
      <rect y="54" width="170" height="92" fill="#fff" stroke="#333"/>
      <text x="8" y="74">C/T  8 min (ask→PR)</text>
      <text x="8" y="92">p85 17 min</text>
      <text x="8" y="110">local Jest: blocked</text>
      <text x="8" y="128">(npm registry denied)</text>
    </g>
    <!-- P3 -->
    <g transform="translate(480,265)">
      <rect width="170" height="54" fill="#f2f2f2" stroke="#333" stroke-width="1.5"/>
      <text x="85" y="24" text-anchor="middle" font-weight="bold">3 · CI verification</text>
      <text x="85" y="41" text-anchor="middle" font-size="11">35 checks · jidoka</text>
      <rect y="54" width="170" height="92" fill="#fff" stroke="#333"/>
      <text x="8" y="74">C/T  6.7 min median</text>
      <text x="8" y="92">p90 9 min · mutation ≤30</text>
      <text x="8" y="110">FPY  56% (35 of 62 runs)</text>
      <text x="8" y="128">first test run for 44%</text>
    </g>
    <!-- P4 -->
    <g transform="translate(710,265)">
      <rect width="170" height="54" fill="#f2f2f2" stroke="#333" stroke-width="1.5"/>
      <text x="85" y="24" text-anchor="middle" font-weight="bold">4 · Review and rework</text>
      <text x="85" y="41" text-anchor="middle" font-size="11">Qodo bot · agent fixes</text>
      <rect y="54" width="170" height="92" fill="#fff" stroke="#333"/>
      <text x="8" y="74">C/T  ~2–10 min a finding</text>
      <text x="8" y="92">FPY  14 of 30 PRs green</text>
      <text x="8" y="110">on first push</text>
      <text x="8" y="128">loops back to 3</text>
    </g>
    <!-- P5 -->
    <g transform="translate(940,265)">
      <rect width="170" height="54" fill="#fbe9e9" stroke="#b33" stroke-width="2"/>
      <text x="85" y="24" text-anchor="middle" font-weight="bold">5 · Merge approval</text>
      <text x="85" y="41" text-anchor="middle" font-size="11">me, by hand</text>
      <rect y="54" width="170" height="92" fill="#fff" stroke="#b33"/>
      <text x="8" y="74">C/T  &lt;1 min</text>
      <text x="8" y="92">availability: phone, awake</text>
      <text x="8" y="110">works in batches of 2–6</text>
      <text x="8" y="128">merged 24 of 30</text>
    </g>
    <!-- P6 -->
    <g transform="translate(1170,265)">
      <rect width="170" height="54" fill="#f2f2f2" stroke="#333" stroke-width="1.5"/>
      <text x="85" y="24" text-anchor="middle" font-weight="bold">6 · Release</text>
      <text x="85" y="41" text-anchor="middle" font-size="11">release-please PR #405</text>
      <rect y="54" width="170" height="92" fill="#fff" stroke="#333"/>
      <text x="8" y="74">held by the 11.0 gate</text>
      <text x="8" y="92">13 gate rows, 0 hold</text>
      <text x="8" y="110">npm publish: manual</text>
      <text x="8" y="128">dispatch (#378/#383)</text>
    </g>
  </g>

  <!-- push arrows between boxes -->
  <g stroke="#333" stroke-width="1.5">
    <line x1="192" y1="292" x2="246" y2="292" marker-end="url(#arr)"/>
    <line x1="422" y1="292" x2="476" y2="292" marker-end="url(#arr)"/>
    <line x1="652" y1="292" x2="706" y2="292" marker-end="url(#arr)"/>
    <line x1="882" y1="292" x2="936" y2="292" marker-end="url(#arr)"/>
    <line x1="1112" y1="292" x2="1166" y2="292" marker-end="url(#arr)"/>
  </g>
  <!-- rework loop 4 -> 3 -->
  <path d="M795,420 C795,450 565,450 565,414" fill="none" stroke="#b33" stroke-width="1.5" marker-end="url(#arr)"/>
  <text x="600" y="466" fill="#b33" font-size="12">rework loop: 16 of 30 PRs needed ≥1 extra push</text>

  <!-- inventory triangles -->
  <g font-size="11">
    <g transform="translate(891,330)">
      <path d="M18,0 L36,32 L0,32 Z" fill="#fff4d6" stroke="#333"/>
      <text x="18" y="27" text-anchor="middle" font-weight="bold">I</text>
    </g>
    <text x="909" y="382" font-size="11" text-anchor="middle">up to 6</text><text x="909" y="396" font-size="11" text-anchor="middle">green PRs</text>
    <g transform="translate(1392,276)">
      <path d="M18,0 L36,32 L0,32 Z" fill="#fff4d6" stroke="#333"/>
      <text x="18" y="27" text-anchor="middle" font-weight="bold">I</text>
    </g>
    <text x="1410" y="326" font-size="11" text-anchor="middle">30 merged</text><text x="1410" y="340" font-size="11" text-anchor="middle">changes,</text><text x="1410" y="354" font-size="11" text-anchor="middle">unshipped</text><line x1="1342" y1="292" x2="1388" y2="292" stroke="#333" stroke-width="1.5" marker-end="url(#arr)"/>
  </g>

  <!-- Kaizen bursts on current state -->
  <g font-size="11" font-weight="bold">
    <g transform="translate(300,480)">
      <path d="M0,20 L14,14 L10,0 L26,10 L36,-4 L42,12 L58,8 L50,22 L64,32 L46,34 L50,50 L34,40 L24,54 L20,38 L2,42 L12,30 Z" fill="#ffe36e" stroke="#333"/>
    </g>
    <text x="370" y="500" fill="#333">Defects found at the end: the sandbox cannot run Jest</text>
    <g transform="translate(940,480)">
      <path d="M0,20 L14,14 L10,0 L26,10 L36,-4 L42,12 L58,8 L50,22 L64,32 L46,34 L50,50 L34,40 L24,54 L20,38 L2,42 L12,30 Z" fill="#ffe36e" stroke="#333"/>
    </g>
    <text x="1010" y="500" fill="#333">Approval is a batch step with one person</text>
  </g>

  <!-- Timeline ladder -->
  <g transform="translate(30,580)">
    <text x="0" y="0" font-weight="bold" font-size="14">Timeline ladder (median PR, minutes)</text>
    <polyline fill="none" stroke="#333" stroke-width="2"
      points="0,30 60,30 60,70 170,70 170,30 260,30 260,70 400,70 400,30 470,30 470,70 560,70 560,30 760,30 760,70 830,70 830,30 1110,30 1110,70 1180,70"/>
    <!-- wait labels (top) -->
    <text x="30" y="22" text-anchor="middle" font-size="12">0</text>
    <text x="215" y="22" text-anchor="middle" font-size="12">0</text>
    <text x="435" y="22" text-anchor="middle" font-size="12">0</text>
    <text x="660" y="22" text-anchor="middle" font-size="12">~30 (reruns, queues, stalls)</text>
    <text x="970" y="22" text-anchor="middle" font-size="12" fill="#b33" font-weight="bold">42 (waiting for merge)</text>
    <!-- process labels (bottom) -->
    <text x="115" y="88" text-anchor="middle" font-size="12">1</text>
    <text x="330" y="88" text-anchor="middle" font-size="12">8</text>
    <text x="515" y="88" text-anchor="middle" font-size="12">7</text>
    <text x="795" y="88" text-anchor="middle" font-size="12">≈5</text>
    <text x="1145" y="88" text-anchor="middle" font-size="12">&lt;1</text>
    <!-- totals box -->
    <g transform="translate(1210,10)">
      <rect width="236" height="92" fill="#f7f7f7" stroke="#333"/>
      <text x="10" y="22">Lead time (median)  121 min</text>
      <text x="10" y="42">Process time  ≈ 21 min</text>
      <text x="10" y="62" font-weight="bold">Flow efficiency  ≈ 17%</text>
      <text x="10" y="82" font-size="11">wait at merge = 50% of all lead time</text>
    </g>
    <text x="0" y="130" font-size="11" fill="#555">Upper line: waiting. Lower line: work. The wait segments are medians of each queue, so they do not sum exactly to the median lead time; the totals box uses the measured medians. Source: data/pr-flow.csv, data/event-log.csv, GitHub PR and Actions timestamps.</text>
    <text x="0" y="148" font-size="11" fill="#555">Outside the ladder: 6 decision cards took 812 min in all (median 131), and 4 usage-limit stalls stopped agents for 382 min.</text>
  </g>
</svg>
