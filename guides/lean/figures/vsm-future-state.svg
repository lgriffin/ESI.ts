<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1480 820" font-family="Helvetica, Arial, sans-serif" font-size="13" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <title>ESI.ts value stream map, future state</title>
  <defs>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#333"/>
    </marker>
    <marker id="arrb" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#1f5fa8"/>
    </marker>
    <marker id="arrg" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#2d7a3a"/>
    </marker>
  </defs>
  <rect width="1480" height="820" fill="#ffffff"/>
  <text x="30" y="36" font-size="22" font-weight="bold" fill="#111">Era 4 and beyond · Future-state value stream map</text>
  <text x="30" y="58" fill="#555">Merge at green is already in place (from 27 Sep 11:42 UTC). The other kaizen bursts are proposals. Target: one-piece flow with the person deciding only what a person must decide.</text>

  <!-- Customer -->
  <g transform="translate(1250,80)">
    <path d="M0,70 L0,20 L40,0 L40,20 L80,0 L80,20 L120,0 L120,20 L160,0 L160,70 Z" fill="#fff4d6" stroke="#333" stroke-width="1.5"/>
    <text x="80" y="46" text-anchor="middle" font-weight="bold">Me (Leigh)</text>
    <text x="80" y="62" text-anchor="middle" font-size="11">sets intent, decides forks</text>
  </g>
  <g transform="translate(560,90)">
    <rect width="300" height="74" fill="#eef4fb" stroke="#1f5fa8" stroke-width="1.5"/>
    <text x="150" y="26" text-anchor="middle" font-weight="bold" fill="#1f5fa8">Coordinator Claude</text>
    <text x="150" y="46" text-anchor="middle" font-size="12">routes asks; levels agent load</text>
    <text x="150" y="63" text-anchor="middle" font-size="12">across the usage window (heijunka)</text>
  </g>
  <path d="M1250,120 C1050,110 960,120 862,125" fill="none" stroke="#1f5fa8" stroke-width="1.5" marker-end="url(#arrb)"/>
  <text x="990" y="106" fill="#1f5fa8" font-size="12" stroke="#fff" stroke-width="4" paint-order="stroke">intent, standing policies</text>
  <path d="M560,140 C400,150 250,170 150,245" fill="none" stroke="#1f5fa8" stroke-width="1.5" stroke-dasharray="6 4" marker-end="url(#arrb)"/>
  <path d="M1300,152 C1300,200 1270,230 1260,262" fill="none" stroke="#2d7a3a" stroke-width="1.5" stroke-dasharray="3 3" marker-end="url(#arrg)"/>
  <text x="905" y="222" fill="#2d7a3a" font-size="12" stroke="#fff" stroke-width="4" paint-order="stroke">only one-way doors reach me (breaking changes, release)</text>

  <g font-size="12">
    <g transform="translate(30,265)">
      <rect width="160" height="54" fill="#f2f2f2" stroke="#333" stroke-width="1.5"/>
      <text x="80" y="24" text-anchor="middle" font-weight="bold">1 · Route and</text>
      <text x="80" y="41" text-anchor="middle" font-weight="bold">spin up thread</text>
      <rect y="54" width="160" height="72" fill="#fff" stroke="#333"/>
      <text x="8" y="74">C/T  ~1 min</text>
      <text x="8" y="92">memory = standard work</text>
      <text x="8" y="110">FPY  ~100%</text>
    </g>
    <g transform="translate(250,265)">
      <rect width="170" height="54" fill="#f2f2f2" stroke="#333" stroke-width="1.5"/>
      <text x="85" y="24" text-anchor="middle" font-weight="bold">2 · Specify, build,</text>
      <text x="85" y="41" text-anchor="middle" font-weight="bold">test locally</text>
      <rect y="54" width="170" height="72" fill="#fff" stroke="#333"/>
      <text x="8" y="74">C/T  ~10 min</text>
      <text x="8" y="92">unit + BDD + mutation</text>
      <text x="8" y="110">on changed files, pre-push</text>
    </g>
    <g transform="translate(480,265)">
      <rect width="170" height="54" fill="#f2f2f2" stroke="#333" stroke-width="1.5"/>
      <text x="85" y="24" text-anchor="middle" font-weight="bold">3 · CI confirms</text>
      <text x="85" y="41" text-anchor="middle" font-size="11">35 checks</text>
      <rect y="54" width="170" height="72" fill="#fff" stroke="#333"/>
      <text x="8" y="74">C/T  ~7 min</text>
      <text x="8" y="92">FPY target ≥ 85%</text>
      <text x="8" y="110">CI stops surprising</text>
    </g>
    <g transform="translate(710,265)">
      <rect width="170" height="54" fill="#f2f2f2" stroke="#333" stroke-width="1.5"/>
      <text x="85" y="24" text-anchor="middle" font-weight="bold">4 · Review</text>
      <text x="85" y="41" text-anchor="middle" font-size="11">bot findings fixed in flow</text>
      <rect y="54" width="170" height="72" fill="#fff" stroke="#333"/>
      <text x="8" y="74">C/T  ~3 min</text>
      <text x="8" y="92">runs in parallel with 3</text>
      <text x="8" y="110">answer + resolve each thread</text>
    </g>
    <g transform="translate(940,265)">
      <rect width="170" height="54" fill="#e8f4ea" stroke="#2d7a3a" stroke-width="2"/>
      <text x="85" y="24" text-anchor="middle" font-weight="bold">5 · Merge at green</text>
      <text x="85" y="41" text-anchor="middle" font-size="11">thread merges, one at a time</text>
      <rect y="54" width="170" height="72" fill="#fff" stroke="#2d7a3a"/>
      <text x="8" y="74">C/T  &lt;1 min</text>
      <text x="8" y="92">wait  0 (measured)</text>
      <text x="8" y="110">no batch, no conflicts</text>
    </g>
    <g transform="translate(1170,265)">
      <rect width="170" height="54" fill="#f2f2f2" stroke="#333" stroke-width="1.5"/>
      <text x="85" y="24" text-anchor="middle" font-weight="bold">6 · Release</text>
      <text x="85" y="41" text-anchor="middle" font-size="11">tag triggers publish</text>
      <rect y="54" width="170" height="72" fill="#fff" stroke="#333"/>
      <text x="8" y="74">#378/#383 closed</text>
      <text x="8" y="92">prerelease channel for</text>
      <text x="8" y="110">early 11.0 feedback</text>
    </g>
  </g>
  <g stroke="#333" stroke-width="1.5">
