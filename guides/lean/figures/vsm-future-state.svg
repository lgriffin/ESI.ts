    <text x="20" y="22" text-anchor="middle" font-size="12">0</text>
    <text x="170" y="22" text-anchor="middle" font-size="12">0</text>
    <text x="350" y="22" text-anchor="middle" font-size="12">~2</text>
    <text x="480" y="22" text-anchor="middle" font-size="12">0</text>
    <text x="610" y="22" text-anchor="middle" font-size="12" fill="#2d7a3a" font-weight="bold">0</text>
    <text x="95" y="88" text-anchor="middle" font-size="12">1</text>
    <text x="260" y="88" text-anchor="middle" font-size="12">10</text>
    <text x="415" y="88" text-anchor="middle" font-size="12">7</text>
    <text x="545" y="88" text-anchor="middle" font-size="12">3</text>
    <text x="665" y="88" text-anchor="middle" font-size="12">&lt;1</text>
