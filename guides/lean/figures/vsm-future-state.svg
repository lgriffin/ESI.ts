    <g transform="translate(250,490)"><path d="M0,20 L14,14 L10,0 L26,10 L36,-4 L42,12 L58,8 L50,22 L64,32 L46,34 L50,50 L34,40 L24,54 L20,38 L2,42 L12,30 Z" fill="#ffe36e" stroke="#333"/></g>
    <text x="320" y="510" font-weight="bold">K2 · Merge at green (done 27 Sep 11:42)</text>
    <text x="320" y="528">ready→merge median fell from 42 min to 0</text>

    <g transform="translate(830,420)"><path d="M0,20 L14,14 L10,0 L26,10 L36,-4 L42,12 L58,8 L50,22 L64,32 L46,34 L50,50 L34,40 L24,54 L20,38 L2,42 L12,30 Z" fill="#ffe36e" stroke="#333"/></g>
    <text x="900" y="440" font-weight="bold">K3 · Level agent load across the usage window</text>
    <text x="900" y="458">4 stalls cost 382 agent-minutes; pace, don't burst</text>

    <g transform="translate(830,490)"><path d="M0,20 L14,14 L10,0 L26,10 L36,-4 L42,12 L58,8 L50,22 L64,32 L46,34 L50,50 L34,40 L24,54 L20,38 L2,42 L12,30 Z" fill="#ffe36e" stroke="#333"/></g>
    <text x="900" y="510" font-weight="bold">K4 · Fix release mechanics (#378/#383)</text>
    <text x="900" y="528">remove the last manual dispatch from the stream</text>
  </g>

  <g transform="translate(30,590)">
