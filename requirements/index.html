s, then the Mercenary client shall return an empty mercenary_dens list.","line":31,"pattern":"unwanted-behaviour","exclusion":false,"verdict":"verified","evidence":"","charter":[],"tags":[],"scenarios":[{"title":"Character with no dens receives an empty mercenary_dens list","line":36,"tags":[]}],"source":"  Rule: If a character owns no mercenary dens, then the Mercenary client shall return an empty mercenary_dens list.\n    Owning no dens is the default state for a character who has never deployed\n    one, so ESI reports it as { mercenary_dens: [] } rather than an error, and\n    callers branch on the list's length.\n\n    Scenario: Character with no dens receives an empty mercenary_dens list\n      Given no dens exist in the area\n      When the client requests dens\n      Then the client shall return an empty mercenary_dens list","sourceStart":31,"findings":[]},{"id":"0024-mercenary#R3","title":"When the mercenary tactical operations of a character are requested, the Mercenary client shall return the response's operations list, each entry with its UUID operation id and its mercenary_den_id.","line":43,"pattern":"event-driven","exclusion":false,"verdict":"verified","evidence":"","charter":[],"tags":[],"scenarios":[{"title":"Two operations return their UUIDs and parent den ids","line":49,"tags":[]}],"source":"  Rule: When the mercenary tactical operations of a character are requested, the Mercenary client shall return the response's operations list, each entry with its UUID operation id and its mercenary_den_id.\n    ESI wraps the list in an object ({ operations: [...] }), and the client\n    returns that object as sent. An operation is identified by a UUID string\n    rather than a numeric ID. State, dungeon type and expiry come from the\n    per-operation detail endpoint.\n\n    Scenario: Two operations return their UUIDs and parent den ids\n      Given MTOs are active\n      When the client requests operations\n      Then the client shall return the operations list with UUIDs and den ids","sourceStart":43,"findings":[]},{"id":"0024-mercenary#R4","title":"When dens and tactical operations are fetched together, the Mercenary client shall return on each operation the mercenary_den_id that equals the id of the den it spawned from.","line":54,"pattern":"event-driven","exclusion":false,"verdict":"verified","evidence":"","charter":[],"tags":[],"scenarios":[{"title":"Operation mercenary_den_id matches the parent den fetched alongside it","line":60,"tags":[]}],"source":"  Rule: When dens and tactical operations are fetched together, the Mercenary client shall return on each operation the mercenary_den_id that equals the id of the den it spawned from.\n    The mercenary_den_id is the only link between the two endpoints. Without it\n    a caller could list both sides but could not attribute an operation to the\n    structure that produced it, which is the whole point of surveying them\n    together.\n\n    Scenario: Operation mercenary_den_id matches the parent den fetched alongside it\n      Given dens and MTOs exist\n      When the client fetches both\n      Then the client shall correlate operations to their parent dens","sourceStart":54,"findings":[]},{"id":"0024-mercenary#R5","title":"When a mercenary den detail is requested by den ID, the Mercenary client shall return the den state, its infomorph amount, its skyhook, and its development and anarchy evolution, each as an amount and a named level.","line":67,"pattern":"event-driven","exclusion":false,"verdict":"verified","evidence":"","charter":[],"tags":[],"scenarios":[{"title":"Running den reports its evolution levels, infomorphs, and skyhook","line":74,"tags":[]}],"source":"  Rule: When a mercenary den detail is requested by den ID, the Mercenary client shall return the den state, its infomorph amount, its skyhook, and its development and anarchy evolution, each as an amount and a named level.\n    The detail view is where evolution progress and the attached skyhook\n    appear — none of it is in the list payload. Each evolution axis reports a\n    numeric amount and a level from Level0 to Level4. Infomorph stock is what\n    the den consumes to keep running, so it belongs with the state rather than\n    behind a further call.\n\n    Scenario: Running den reports its evolution levels, infomorphs, and skyhook\n      Given a mercenary den exists with detail data\n      When the client requests den detail\n      Then the client shall return the den evolution and infomorph data","sourceStart":67,"findings":[]},{"id":"0024-mercenary#R6","title":"When a tactical operation detail is requested by operation ID, the Mercenary client shall return the operation state, its dungeon_type_id, and its expiry timestamp.","line":79,"pattern":"event-driven","exclusion":false,"verdict":"verified","evidence":"","charter":[],"tags":[],"scenarios":[{"title":"Available operation reports its dungeon type and expiry time","line":84,"tags":[]}],"source":"  Rule: When a tactical operation detail is requested by operation ID, the Mercenary client shall return the operation state, its dungeon_type_id, and its expiry timestamp.\n    Operations are identified by a UUID rather than a numeric ID, and they\n    expire. The expiry timestamp and the dungeon type are what decide whether\n    the site is still worth travelling to.\n\n    Scenario: Available operation reports its dungeon type and expiry time\n      Given an MTO exists with detail data\n      When the client requests operation detail\n      Then the client shall return the operation state and expiry","sourceStart":79,"findings":[]},{"id":"0024-mercenary#R7","title":"If the ESI API answers every attempt at a mercenary request with an error status and no usable cached entry exists, then the Mercenary client shall raise an EsiError.","line":91,"pattern":"unwanted-behaviour","exclusion":false,"verdict":"verified","evidence":"","charter":[],"tags":[],"scenarios":[{"title":"Den request during an ESI outage is rejected with 503","line":96,"tags":[]}],"source":"  Rule: If the ESI API answers every attempt at a mercenary request with an error status and no usable cached entry exists, then the Mercenary client shall raise an EsiError.\n    Mercenary endpoints are recent additions and are taken offline during\n    deployments more often than the older surfaces, so callers see an\n    upstream 503 as the same EsiError type used everywhere else.\n\n    Scenario: Den request during an ESI outage is rejected with 503\n      Given the ESI service is down\n      When the client requests mercenary data\n      Then the client shall return a 503 error","sourceStart":91,"findings":[]}],"noUnwantedBehaviour":false,"orphanScenarios":0},{"file":"tests/bdd/features/core/0025-meta.feature","area":"core","name":"Meta API Management","tags":["@TEST-10"],"charter":["TEST-10"],"description":"The Meta client exposes ESI's own description of itself: the OpenAPI specification, served in a JSON form and a YAML form of the same document, and the health of each ESI route. Callers use it to discover endpoints, check the spec version pinned by a build, or drive code generation, which is how this library's own generated types and endpoint metadata are produced.\n\nThe two formats are alternative encodings of one document, so the client parses the JSON and hands back the YAML untouched.\n\nRetry, stale-on-error, circuit breaking and request deduplication apply to these calls as to every other; 0050-etag-caching.feature and 0051-resilience.feature specify them once. A failure Rule below states the outcome after they have run, which is why it names every attempt and the absence of a usable cached entry.","boundBy":["tests/bdd/specs/core/0025-meta.spec.ts"],"rules":[{"id":"0025-meta#R1","title":"When the OpenAPI specification is requested in JSON form, the Meta client shall return a parsed document carrying its openapi version, info block, paths, and components.","line":21,"pattern":"event-driven","exclusion":false,"verdict":"verified","evidence":"","charter":[],"tags":[],"scenarios":[{"title":"JSON specification returns version 3.1.0 with paths and components","line":26,"tags":[]}],"source":"  Rule: When the OpenAPI specification is requested in JSON form, the Meta client shall return a parsed document carrying its openapi version, info block, paths, and components.\n    JSON is the machine-readable path — a caller reads paths and components\n    directly off the returned object. The openapi version and info block are\n    what identify which revision of the spec is in hand.\n\n    Scenario: JSON specification returns version 3.1.0 with paths and components\n      Given the ESI API is available\n      When the client requests the OpenAPI JSON specification\n      Then the client shall return a valid OpenAPI JSON document","sourceStart":21,"findings":[]},{"id":"0025-meta#R2","title":"When the OpenAPI specification is requested in YAML form, the Meta client shall return the document as an unparsed string.","line":31,"pattern":"event-driven","exclusion":false,"verdict":"verified","evidence":"","charter":[],"tags":[],"scenarios":[{"title":"YAML specification returns the raw document text","line":36,"tags":[]}],"source":"  Rule: When the OpenAPI specification is requested in YAML form, the Meta client shall return the document as an unparsed string.\n    YAML is the human-readable path, usually written to a file or diffed\n    against a checked-in copy. Parsing it would add a dependency and lose the\n    formatting a diff depends on, so the text is handed back verbatim.\n\n    Scenario: YAML specification returns the raw document text\n      Given the ESI API is available for YAML\n      When the client requests the OpenAPI YAML specification\n      Then the client shall return a valid OpenAPI YAML document","sourceStart":31,"findings":[]},{"id":"0025-meta#R3","title":"If a YAML specification request is answered with a retryable server error, then the Meta client shall retry it and return the document from the attempt that succeeds.","line":41,"pattern":"unwanted-behaviour","exclusion":false,"verdict":"verified","evidence":"","charter":[],"tags":[],"scenarios":[{"title":"A 503 followed by the document returns the document","line":46,"tags":[]}],"source":"  Rule: If a YAML specification request is answered with a retryable server error, then the Meta client shall retry it and return the document from the attempt that succeeds.\n    The YAML download goes through the same request pipeline as every JSON\n    call, so a brief 503 during a build does not fail the spec download when\n    the next attempt would succeed.\n\n    Scenario: A 503 followed by the document returns the document\n      Given the YAML specification endpoint fails once with 503 and then recovers\n      When the client requests the OpenAPI YAML specification\n      Then the client shall return the YAML document from the second request","sourceStart":41,"findings":[]},{"id":"0025-meta#R4","title":"When both specification formats are fetched together, the Meta client shall report the same openapi version, title, and path entries in each format.","line":51,"pattern":"event-driven","exclusion":false,"verdict":"verified","evidence":"","charter":[],"tags":[],"scenarios":[{"title":"JSON and YAML fetched in parallel describe the same alliances path","line":56,"tags":[]}],"source":"  Rule: When both specification formats are fetched together, the Meta client shall report the same openapi version, title, and path entries in each format.\n    The two encodings describe one document, so a caller can pick either\n    without changing what they learn. This scenario pins that equivalence at\n    the three points a consumer keys off: version, title, and the path set.\n\n    Scenario: JSON and YAML fetched in parallel describe the same alliances path\n      Given both JSON and YAML specifications are available\n      When the client retrieves both formats\n      Then they shall contain equivalent information","sourceStart":51,"findings":[]},{"id":"0025-meta#R5","title":"When the route status of ESI is requested, the Meta client shall return one entry per route carrying its method, path, and status.","line":63,"pattern":"event-driven","exclusion":false,"verdict":"verified","evidence":"","charter":[],"tags":[],"scenarios":[{"title":"One healthy route and one degraded route","line":69,"tags":[]}],"source":"  Rule: When the route status of ESI is requested, the Meta client shall return one entry per route carrying its method, path, and status.\n    ESI reports health per route rather than as one flag, so a caller can tell\n    that market reads are degraded while everything else is fine. The body is\n    { routes: [...] } (MetaStatus), each entry naming the HTTP method, the\n    route path, and a status such as OK, Degraded or Down.\n\n    Scenario: One healthy route and one degraded route\n      Given ESI reports the status of its routes\n      When the client requests the route status\n      Then the client shall return the status of each route","sourceStart":63,"findings":[]},{"id":"0025-meta#R6","title":"When the changelog is requested, the Meta client shall return the per-date change entries under a changelog key, as ESI sends them.","line":76,"pattern":"event-driven","exclusion":false,"verdict":"verified","evidence":"","charter":[],"tags":[],"scenarios":[{"title":"One breaking change on one compatibility date","line":82,"tags":[]}],"source":"  Rule: When the changelog is requested, the Meta client shall return the per-date change entries under a changelog key, as ESI sends them.\n    ESI wraps the changelog as { changelog: { \u003cdate>: [...] } } (MetaChangelog),\n    each date holding the routes that changed on it. The client used to expect\n    the per-date map at the top level, so every real call failed validation.\n    Returning ESI's shape keeps this method in line with the other meta calls.\n\n    Scenario: One breaking change on one compatibility date\n      Given ESI publishes a changelog with one entry\n      When the client requests the changelog\n      Then the client shall return the entry under its compatibility date","sourceStart":76,"findings":[]},{"id":"0025-meta#R7","title":"If the ESI API answers every attempt at a specification request with an error status and no usable cached entry exists, then the Meta client shall raise an error whose message carries the ESI status text.","line":89,"pattern":"unwanted-behaviour","exclusion":false,"verdict":"verified","evidence":"","charter":[],"tags":[],"scenarios":[{"title":"Specification request during an outage reports Service Unavailable","line":94,"tags":[]}],"source":"  Rule: If the ESI API answers every attempt at a specification request with an error status and no usable cached entry exists, then the Meta client shall raise an error whose message carries the ESI status text.\n    The spec endpoint sits behind the same infrastructure as the data\n    endpoints and goes down with it. Carrying the status text through the\n    message is what lets a build script log why generation failed.\n\n    Scenario: Specification request during an outage reports Service Unavailable\n      Given the OpenAPI specification endpoint is unavailable\n      When the client requests the OpenAPI specification\n      Then the client shall return a service unavailable error","sourceStart":89,"findings":[]}],"noUnwantedBehaviour":false,"orphanScenarios":0},{"file":"tests/bdd/features/core/0026-military-campaigns.feature","area":"core","name":"Military Campaigns","tags":["@TEST-10"],"charter":["TEST-10"],"description":"The MilitaryCampaigns client covers the campaign endpoints: the list of campaigns, the detail of one campaign, the objectives inside it, and a character's own participation in those objectives. Campaigns and objectives are identified by UUID rather than a numeric ID, and both carry a state and a progress value that advance over the campaign's lifetime. ESI serves these routes from compatibility date 2026-08-18 and wraps each list in an object: `{ campaigns: [...] }` and `{ objectives: [...], cursor }`.\n\nThe character-scoped objective view is the only authenticated surface here; campaign and objective data is public.","boundBy":["tests/bdd/step-definitions/core/military-campaigns.steps.ts"],"rules":[{"id":"0026-military-campaigns#R1","title":"When the military campaign listing is requested, the MilitaryCampaigns client shall return a campaigns array holding each campaign's id, state, and progress, and the finished time of an ended campaign when present.","line":16,"pattern":"event-driven","exclusion":false,"verdict":"verified","evidence":"","charter":[],"tags":[],"scenarios":[{"title":"Active and completed campaigns return state and progress","line":23,"tags":[]}],"source":"  Rule: When the military campaign listing is requested, the MilitaryCampaigns client shall return a campaigns array holding each campaign's id, state, and progress, and the finished time of an ended campaign when present.\n    The listing mixes running and finished campaigns. State and progress are\n    what separate them, and finished appears only once a campaign has ended,\n    so a caller reads its presence as the end of the campaign's lifetime\n    rather than inferring it from progress. The array sits under a campaigns\n    key, which is the body ESI sends.\n\n    Scenario: Active and completed campaigns return state and progress\n      Given active and completed military campaigns exist\n      When the client requests the campaigns listing\n      Then the client shall return campaigns with state and progress","sourceStart":16,"findings":[]},{"id":"0026-military-campaigns#R2","title":"If no military campaigns exist, then the MilitaryCampaigns client shall return an empty campaigns array.","line":28,"pattern":"unwanted-behaviour","exclusion":false,"verdict":"verified","evidence":"","charter":[],"tags":[],"scenarios":[{"title":"No campaigns in progress returns an empty array","line":33,"tags":[]}],"source":"  Rule: If no military campaigns exist, then the MilitaryCampaigns client shall return an empty campaigns array.\n    Between campaign cycles the listing is legitimately empty. That is\n    reported as an empty array rather than an error, so a caller polling for\n    the next campaign branches on its length.\n\n    Scenario: No campaigns in progress returns an empty array\n      Given no military campaigns exist\n      When the client requests the empty campaigns listing\n      Then the client shall return an empty campaigns array","sourceStart":28,"findings":[]},{"id":"0026-military-campaigns#R3","title":"When a campaign is requested by UUID, the MilitaryCampaigns client shall return that campaign's id, state, and progress, and its started time when present.","line":40,"pattern":"event-driven","exclusion":false,"verdict":"verified","evidence":"","charter":[],"tags":[],"scenarios":[{"title":"Campaign fetched by UUID returns its start time and progress","line":45,"tags":[]}],"source":"  Rule: When a campaign is requested by UUID, the MilitaryCampaigns client shall return that campaign's id, state, and progress, and its started time when present.\n    The detail endpoint is how a caller refreshes one campaign it is already\n    tracking without re-pulling the whole listing. The start time anchors the\n    progress value to a real elapsed duration.\n\n    Scenario: Campaign fetched by UUID returns its start time and progress\n      Given a valid campaign UUID\n      When the client requests the campaign details\n      Then the client shall return the full campaign information","sourceStart":40,"findings":[]},{"id":"0026-military-campaigns#R4","title":"When the objectives of a campaign are requested, the MilitaryCampaigns client shall return an objectives array holding each objective's id, state, progress, and its total, committed, and contributor participant counts.","line":50,"pattern":"event-driven","exclusion":false,"verdict":"verified","evidence":"","charter":[],"tags":[],"scenarios":[{"title":"Two objectives return their participant totals and commitments","line":56,"tags":[]}],"source":"  Rule: When the objectives of a campaign are requested, the MilitaryCampaigns client shall return an objectives array holding each objective's id, state, progress, and its total, committed, and contributor participant counts.\n    Objectives are where a campaign's progress actually comes from. The three\n    participant counts are distinct measures — signed up, committed, and\n    actually contributing — so collapsing them into one number would hide\n    which objectives are under-crewed.\n\n    Scenario: Two objectives return their participant totals and commitments\n      Given a campaign with objectives\n      When the client requests the campaign objectives\n      Then the client shall return objectives with participant counts","sourceStart":50,"findings":[]},{"id":"0026-military-campaigns#R5","title":"When a page cursor or limit is supplied for an objectives listing, the MilitaryCampaigns client shall send each supplied value as a query parameter of the same name.","line":61,"pattern":"event-driven","exclusion":false,"verdict":"verified","evidence":"","charter":[],"tags":[],"scenarios":[{"title":"Next page of a campaign's objectives is requested with the after cursor","line":67,"tags":[]},{"title":"Earlier page of a character's objectives is requested with the before cursor","line":72,"tags":[]}],"source":"  Rule: When a page cursor or limit is supplied for an objectives listing, the MilitaryCampaigns client shall send each supplied value as a query parameter of the same name.\n    Both objective listings are cursor-paginated: ESI returns before and after\n    tokens in the body and serves the next page only when a token comes back\n    as a query parameter. Without forwarding them a caller could read only the\n    first page.\n\n    Scenario: Next page of a campaign's objectives is requested with the after cursor\n      Given a campaign whose objectives continue on a later page\n      When the client requests the objectives after that cursor with a limit of 50\n      Then the request shall carry the after cursor and the limit\n\n    Scenario: Earlier page of a character's objectives is requested with the before cursor\n      Given a character whose objectives continue on an earlier page\n      When the client requests the character objectives before that cursor\n      Then the request shall carry the before cursor","sourceStart":61,"findings":[]},{"id":"0026-military-campaigns#R6","title":"When the campaign objectives of a character are requested, the MilitaryCampaigns client shall return an objectives array holding each objective's id with that character's is_committed flag and contributed value.","line":79,"pattern":"event-driven","exclusion":false,"verdict":"verified","evidence":"","charter":[],"tags":[],"scenarios":[{"title":"Character objective returns the commitment flag and contribution","line":84,"tags":[]}],"source":"  Rule: When the campaign objectives of a character are requested, the MilitaryCampaigns client shall return an objectives array holding each objective's id with that character's is_committed flag and contributed value.\n    This is the personal view of the same objectives: whether the character\n    has committed to one, and how much they have contributed to it. Both are\n    per-character values that the public objective payload cannot carry.\n\n    Scenario: Character objective returns the commitment flag and contribution\n      Given an authenticated character with campaign participation\n      When the client requests their campaign objectives\n      Then the client shall return the character participation data","sourceStart":79,"findings":[]},{"id":"0026-military-campaigns#R7","title":"If a requested campaign UUID does not resolve to a campaign, then the MilitaryCampaigns client shall raise an EsiError.","line":91,"pattern":"unwanted-behaviour","exclusion":false,"verdict":"verified","evidence":"","charter":[],"tags":[],"scenarios":[{"title":"Unknown campaign UUID is rejected with 404","line":96,"tags":[]}],"source":"  Rule: If a requested campaign UUID does not resolve to a campaign, then the MilitaryCampaigns client shall raise an EsiError.\n    Campaign UUIDs are opaque and are often carried over from a previous\n    cycle, so an unknown ID is a routine caller mistake. ESI answers 404 and\n    the client surfaces it as the same error type used across the library.\n\n    Scenario: Unknown campaign UUID is rejected with 404\n      Given an invalid campaign UUID\n      When the client requests details for the invalid campaign\n      Then the client shall return a 404 error for the campaign","sourceStart":91,"findings":[]}],"noUnwantedBehaviour":false,"orphanScenarios":0},{"file":"tests/bdd/features/core/0027-paragon-hub.feature","area":"core","name":"Paragon Hub SKINR Marketplace","tags":["@TEST-10"],"charter":["TEST-10"],"description":"The ParagonHub client covers the player-to-player marketplace for SKINR designs. Listings are readable three ways: the public board, the listings a single character has posted, and the listings targeted at an alliance. Each view returns the same listing shape wrapped in a cursor-paginated envelope.\n\nPrices are denominated in either ISK or PLEX, and a listing carries a target that decides who can see it, so both the payment and the visibility model differ from the regular market endpoints.\n\nRetry, stale-on-error, circuit breaking and request deduplication apply to these calls as to every other; 0050-etag-caching.feature and 0051-resilience.feature specify them once. A failure Rule below states the outcome after they have run, which is why it names every attempt and the absence of a usable cached entry.","boundBy":["tests/bdd/step-definitions/core/paragon-hub.steps.ts"],"rules":[{"id":"0027-paragon-hub#R1","title":"When public SKINR listings are requested, the ParagonHub client shall return each listing with its skinr_id and a price denominated in either ISK or PLEX, alongside the page cursor when present.","line":20,"pattern":"event-driven","exclusion":false,"verdict":"verified","evidence":"","charter":[],"tags":[],"scenarios":[{"title":"Public board returns ISK-priced and PLEX-priced listings with a cursor","line":26,"tags":[]}],"source":"  Rule: When public SKINR listings are requested, the ParagonHub client shall return each listing with its skinr_id and a price denominated in either ISK or PLEX, alongside the page cursor when present.\n    The public board is the default view of the marketplace. Price is a tagged\n    value rather than a number plus a currency field, so a caller reads the\n    key to learn the denomination — collapsing the two into one figure would\n    lose that distinction between real-money and in-game payment.\n\n    Scenario: Public board returns ISK-priced and PLEX-priced listings with a cursor\n      Given public SKINR listings exist\n      When the client requests public listings\n      Then the client shall return listings with cursor data","sourceStart":20,"findings":[]},{"id":"0027-paragon-hub#R2","title":"When the Paragon Hub listings of a character are requested, the ParagonHub client shall return each listing with that character as its seller_id and with its target visibility.","line":31,"pattern":"event-driven","exclusion":false,"verdict":"verified","evidence":"","charter":[],"tags":[],"scenarios":[{"title":"Character listing reports the seller ID and public target","line":36,"tags":[]}],"source":"  Rule: When the Paragon Hub listings of a character are requested, the ParagonHub client shall return each listing with that character as its seller_id and with its target visibility.\n    This is the seller's own view of what they have posted. The target field\n    says whether a listing is on the public board or restricted, and it\n    appears here because it is the seller who sets it.\n\n    Scenario: Character listing reports the seller ID and public target\n      Given the character has listed SKINR designs\n      When the client requests character listings\n      Then the client shall return listings with target visibility","sourceStart":31,"findings":[]},{"id":"0027-paragon-hub#R3","title":"When the listings targeted at an alliance are requested, the ParagonHub client shall return the listings collection for that alliance.","line":41,"pattern":"event-driven","exclusion":false,"verdict":"verified","evidence":"","charter":[],"tags":[],"scenarios":[{"title":"Alliance endpoint returns the designs targeted at that alliance","line":47,"tags":[]}],"source":"  Rule: When the listings targeted at an alliance are requested, the ParagonHub client shall return the listings collection for that alliance.\n    Alliance-targeted listings are invisible on the public board, so the\n    alliance endpoint is the only way its members reach them. The payload\n    shape matches the public view so a caller can render either through the\n    same path.\n\n    Scenario: Alliance endpoint returns the designs targeted at that alliance\n      Given alliance-targeted SKINR listings exist\n      When the client requests alliance listings\n      Then the client shall return listings targeted at the alliance","sourceStart":41,"findings":[]},{"id":"0027-paragon-hub#R4","title":"When a cursor is supplied with a public listings request, the ParagonHub client shall return the page it identifies together with the after and before cursors of the adjacent pages when present.","line":54,"pattern":"event-driven","exclusion":false,"verdict":"verified","evidence":"","charter":[],"tags":[],"scenarios":[{"title":"Cursor request returns the page with its forward and backward cursors","line":60,"tags":[]}],"source":"  Rule: When a cursor is supplied with a public listings request, the ParagonHub client shall return the page it identifies together with the after and before cursors of the adjacent pages when present.\n    Paragon Hub uses cursor paging rather than page numbers, because listings\n    are created and expire while a caller is walking the board. Returning\n    both adjacent cursors is what allows movement in either direction from\n    any page.\n\n    Scenario: Cursor request returns the page with its forward and backward cursors\n      Given multiple pages of listings exist\n      When the client requests the next page using a cursor\n      Then the client shall return the next page of results","sourceStart":54,"findings":[]},{"id":"0027-paragon-hub#R5","title":"If the ESI API answers every attempt at a Paragon Hub request with an error status and no usable cached entry exists, then the ParagonHub client shall raise an EsiError.","line":67,"pattern":"unwanted-behaviour","exclusion":false,"verdict":"verified","evidence":"","charter":[],"tags":[],"scenarios":[{"title":"Listing request during an ESI outage is rejected with 503","line":72,"tags":[]}],"source":"  Rule: If the ESI API answers every attempt at a Paragon Hub request with an error status and no usable cached entry exists, then the ParagonHub client shall raise an EsiError.\n    The marketplace endpoints sit behind the same infrastructure as the rest\n    of ESI, so an upstream outage surfaces as the standard error type instead\n    of an empty listings page that a caller could mistake for a quiet board.\n\n    Scenario: Listing request during an ESI outage is rejected with 503\n      Given the ESI service is down\n      When the client requests Paragon Hub data\n      Then the client shall return a 503 error","sourceStart":67,"findings":[]}],"noUnwantedBehaviour":false,"orphanScenarios":0},{"file":"tests/bdd/features/core/0028-pi.feature","area":"core","name":"Planetary Interaction Management","tags":["@TEST-10"],"charter":["TEST-10"],"description":"The PI client covers planetary industry: the colonies a character owns, the pin-link-route layout inside each colony, the schematics those pins run, and the customs offices a corporation operates to tax what comes off the planet.\n\nColony listings are deliberately shallow — a caller discovers planet IDs there and then fetches each layout separately — so the two endpoints are designed to be used one after the other.\n\nRetry, stale-on-error, circuit breaking and request deduplication apply to these calls as to every other; 0050-etag-caching.feature and 0051-resilience.feature specify them once. A failure Rule below states the outcome after they have run, which is why it names every attempt and the absence of a usable cached entry.","boundBy":["tests/bdd/step-definitions/core/pi.steps.ts"],"rules":[{"id":"0028-pi#R1","title":"When the planetary colonies of a character are requested, the PI client shall return each colony with its planet_id, planet_type, and upgrade_level.","line":19,"pattern":"event-driven","exclusion":false,"verdict":"verified","evidence":"","charter":[],"tags":[],"scenarios":[{"title":"Two colonies return their planet type and upgrade level","line":25,"tags":[]}],"source":"  Rule: When the planetary colonies of a character are requested, the PI client shall return each colony with its planet_id, planet_type, and upgrade_level.\n    The listing is a survey view. Planet type decides which resources the\n    colony can extract and upgrade level caps what can be built on it, so\n    those two fields are enough to triage a set of colonies without opening\n    each layout.\n\n    Scenario: Two colonies return their planet type and upgrade level\n      Given a valid character ID for PI\n      When the client requests planetary colonies\n      Then the client shall return a list of colonies","sourceStart":19,"findings":[]},{"id":"0028-pi#R2","title":"If a character owns no planetary colonies, then the PI client shall return an empty array.","line":30,"pattern":"unwanted-behaviour","exclusion":false,"verdict":"verified","evidence":"","charter":[],"tags":[],"scenarios":[{"title":"Character with no colonies receives an empty array","line":35,"tags":[]}],"source":"  Rule: If a character owns no planetary colonies, then the PI client shall return an empty array.\n    Planetary industry is optional, so no colonies is a normal state. It is\n    reported as an empty array rather than an error and the caller branches\n    on length.\n\n    Scenario: Character with no colonies receives an empty array\n      Given a character with no PI colonies\n      When the client requests colonies\n      Then the client shall return an empty colony array","sourceStart":30,"findings":[]},{"id":"0028-pi#R3","title":"When the layout of a colony is requested, the PI client shall return its pins, its links with their source and destination pin IDs, and its routes.","line":42,"pattern":"event-driven","exclusion":false,"verdict":"verified","evidence":"","charter":[],"tags":[],"scenarios":[{"title":"Two-pin colony returns the link joining its pins","line":48,"tags":[]}],"source":"  Rule: When the layout of a colony is requested, the PI client shall return its pins, its links with their source and destination pin IDs, and its routes.\n    A colony is a graph: pins are the nodes, links are the physical\n    connections, and routes are the commodity flows layered on top. The link\n    endpoints are what let a caller reconstruct that graph, so both pin IDs\n    are carried on every link.\n\n    Scenario: Two-pin colony returns the link joining its pins\n      Given a character ID and planet ID\n      When the client requests the colony layout\n      Then the client shall return pins, links, and routes","sourceStart":42,"findings":[]},{"id":"0028-pi#R4","title":"If a colony contains no structures, then the PI client shall return empty pins, links, and routes arrays.","line":53,"pattern":"unwanted-behaviour","exclusion":false,"verdict":"verified","evidence":"","charter":[],"tags":[],"scenarios":[{"title":"Colony with nothing built returns three empty arrays","line":58,"tags":[]}],"source":"  Rule: If a colony contains no structures, then the PI client shall return empty pins, links, and routes arrays.\n    A planet can be occupied with nothing built on it yet. All three\n    collections come back empty rather than absent, so a caller can iterate\n    them without an existence check per field.\n\n    Scenario: Colony with nothing built returns three empty arrays\n      Given a colony with no structures\n      When the client requests the layout\n      Then the client shall return empty arrays","sourceStart":53,"findings":[]},{"id":"0028-pi#R5","title":"When a colony layout is fetched using a planet_id taken from the colony listing, the PI client shall request that layout for the same character and planet.","line":63,"pattern":"event-driven","exclusion":false,"verdict":"verified","evidence":"","charter":[],"tags":[],"scenarios":[{"title":"Planet ID from the colony listing drives the follow-up layout request","line":68,"tags":[]}],"source":"  Rule: When a colony layout is fetched using a planet_id taken from the colony listing, the PI client shall request that layout for the same character and planet.\n    Listing then drilling down is the intended access pattern for planetary\n    industry, and it only works if the planet_id read out of the listing is\n    the one the layout call goes on to use.\n\n    Scenario: Planet ID from the colony listing drives the follow-up layout request\n      Given a character with colonies for workflow\n      When the client retrieves colonies and then their layouts\n      Then the client shall have complete PI data","sourceStart":63,"findings":[]},{"id":"0028-pi#R6","title":"When a planetary schematic is requested by ID, the PI client shall return its schematic_name and cycle_time.","line":75,"pattern":"event-driven","exclusion":false,"verdict":"verified","evidence":"","charter":[],"tags":[],"scenarios":[{"title":"Bacteria schematic returns its name and cycle time","line":80,"tags":[]}],"source":"  Rule: When a planetary schematic is requested by ID, the PI client shall return its schematic_name and cycle_time.\n    Pins reference schematics by ID alone, so this endpoint is how a caller\n    turns a layout into something readable. Cycle time is what converts a\n    factory pin into an output rate.\n\n    Scenario: Bacteria schematic returns its name and cycle time\n      Given a valid schematic ID\n      When the client requests the schematic\n      Then the client shall return schematic details","sourceStart":75,"findings":[]},{"id":"0028-pi#R7","title":"When the customs offices of a corporation are requested, the PI client shall return each office with its office_id and system_id.","line":87,"pattern":"event-driven","exclusion":false,"verdict":"verified","evidence":"","charter":[],"tags":[],"scenarios":[{"title":"Two customs offices return their office and system IDs","line":91,"tags":[]}],"source":"  Rule: When the customs offices of a corporation are requested, the PI client shall return each office with its office_id and system_id.\n    Customs offices are corporation assets rather than character ones, and\n    the system they sit in is what ties an office to the planets it taxes.\n\n    Scenario: Two customs offices return their office and system IDs\n      Given a valid corporation ID for customs offices\n      When the client requests customs offices\n      Then the client shall return a list of customs offices","sourceStart":87,"findings":[]},{"id":"0028-pi#R8","title":"If every attempt at a planetary interaction request is answered with an error status and no usable cached entry exists, then the PI client shall raise an EsiError.","line":98,"pattern":"unwanted-behaviour","exclusion":false,"verdict":"verified","evidence":"","charter":[],"tags":[],"scenarios":[{"title":"Unknown schematic ID is rejected with 404","line":104,"tags":[]},{"title":"Customs office request without the corporation role is rejected with 403","line":109,"tags":[]}],"source":"  Rule: If every attempt at a planetary interaction request is answered with an error status and no usable cached entry exists, then the PI client shall raise an EsiError.\n    The public schematic lookup and the authenticated corporation endpoint\n    fail in different ways — an unknown ID versus a missing role — but both\n    surface as one error type so a caller wraps the whole domain in a single\n    try/catch.\n\n    Scenario: Unknown schematic ID is rejected with 404\n      Given an invalid schematic ID\n      When the client requests the invalid schematic\n      Then the client shall return a 404 error\n\n    Scenario: Customs office request without the corporation role is rejected with 403\n      Given insufficient permissions for customs offices\n      When the client requests customs offices without permissions\n      Then the client shall return a 403 error","sourceStart":98,"findings":[]}],"noUnwantedBehaviour":false,"orphanScenarios":0},{"file":"tests/bdd/features/core/0029-route.feature","area":"core","name":"Route Navigation Management","tags":["@TEST-10"],"charter":["TEST-10"],"description":"The Route client wraps ESI's single routing endpoint, which computes a path through the stargate network between two solar systems. The result is a flat ordered array of system IDs rather than an object graph, so the position of an entry is what encodes the jump order.\n\nRouting takes options: a security preference that trades jumps against risk, and a set of systems to route around. Both change the path returned for the same origin and destination pair.","boundBy":["tests/bdd/specs/core/0029-route.spec.ts"],"rules":[{"id":"0029-route#R1","title":"The Route client shall return a route as an ordered array of system IDs beginning with the origin and ending with the destination.","line":14,"pattern":"ubiquitous","exclusion":false,"verdict":"verified","evidence":"","charter":[],"tags":[],"scenarios":[{"title":"Five-system route between two known systems","line":19,"tags":[]},{"title":"Fifteen-hop route across the map returns numeric system IDs","line":24,"tags":[]}],"source":"  Rule: The Route client shall return a route as an ordered array of system IDs beginning with the origin and ending with the destination.\n    Every consumer of this endpoint walks the array in order to count jumps or\n    set waypoints, so the ordering and the two endpoints are the whole\n    contract. Nothing else in the payload identifies which end is which.\n\n    Scenario: Five-system route between two known systems\n      Given two solar system IDs\n      When the client requests the shortest route\n      Then the client shall return an ordered list of system IDs\n\n    Scenario: Fifteen-hop route across the map returns numeric system IDs\n      Given distant systems\n      When the client requests a route between distant systems\n      Then the client shall return a multi-hop path","sourceStart":14,"findings":[]},{"id":"0029-route#R2","title":"When a route is requested between an identical origin and destination, the Route client shall return an array containing that system alone.","line":29,"pattern":"event-driven","exclusion":false,"verdict":"verified","evidence":"","charter":[],"tags":[],"scenarios":[{"title":"Route from a system to itself contains that system alone","line":34,"tags":[]}],"source":"  Rule: When a route is requested between an identical origin and destination, the Route client shall return an array containing that system alone.\n    A zero-jump route is still a route. Returning the single system rather\n    than an empty array keeps the \"first entry is the origin, last is the\n    destination\" invariant true in the degenerate case.\n\n    Scenario: Route from a system to itself contains that system alone\n      Given the same origin and destination\n      When the client requests a route to itself\n      Then the client shall return an array containing only the origin","sourceStart":29,"findings":[]},{"id":"0029-route#R3","title":"Where a routing preference is supplied, the Route client shall return the path ESI computes under that preference between the same origin and destination.","line":41,"pattern":"optional-feature","exclusion":false,"verdict":"verified","evidence":"","charter":[],"tags":[],"scenarios":[{"title":"Safer preference returns a longer high-security path","line":46,"tags":[]},{"title":"LessSecure preference returns a three-system path","line":51,"tags":[]}],"source":"  Rule: Where a routing preference is supplied, the Route client shall return the path ESI computes under that preference between the same origin and destination.\n    The Safer preference keeps the path in high-security space at the cost of\n    extra jumps; LessSecure accepts low and null security for a shorter path. The preference changes the interior of the array, never its two\n    endpoints, which is what these two scenarios pin down.\n\n    Scenario: Safer preference returns a longer high-security path\n      Given two systems for secure routing\n      When the client requests a secure route\n      Then the client shall return a route through high-sec space\n\n    Scenario: LessSecure preference returns a three-system path\n      Given two systems for insecure routing\n      When the client requests an insecure route\n      Then the client shall return a shorter route through low/null-sec","sourceStart":41,"findings":[]},{"id":"0029-route#R4","title":"Where systems to avoid are supplied, the Route client shall return a path that contains none of those systems.","line":56,"pattern":"optional-feature","exclusion":false,"verdict":"verified","evidence":"","charter":[],"tags":[],"scenarios":[{"title":"Route avoiding two systems omits both from the path","line":62,"tags":[]}],"source":"  Rule: Where systems to avoid are supplied, the Route client shall return a path that contains none of those systems.\n    Avoidance is how a caller routes around a known camp or a system they are\n    not welcome in. An avoided system appearing anywhere in the returned array\n    would defeat the option, so exclusion covers the whole path rather than\n    the interior hops alone.\n\n    Scenario: Route avoiding two systems omits both from the path\n      Given systems to avoid\n      When the client requests a route avoiding systems\n      Then the client shall return a route that does not include avoided systems","sourceStart":56,"findings":[]},{"id":"0029-route#R5","title":"If no path exists between the origin and the destination, then the Route client shall raise an EsiError.","line":69,"pattern":"unwanted-behaviour","exclusion":false,"verdict":"verified","evidence":"","charter":[],"tags":[],"scenarios":[{"title":"Unreachable destination is rejected with 404","line":75,"tags":[]}],"source":"  Rule: If no path exists between the origin and the destination, then the Route client shall raise an EsiError.\n    An unknown system ID or a destination cut off from the stargate network\n    has no route to return. ESI answers 404 and the client raises rather than\n    returning an empty array, which a caller could otherwise read as a\n    zero-jump trip.\n\n    Scenario: Unreachable destination is rejected with 404\n      Given an unreachable destination\n      When the client requests a route to unreachable destination\n      Then the client shall return a 404 error for the route","sourceStart":69,"findings":[]}],"noUnwantedBehaviour":false,"orphanScenarios":0},{"file":"tests/bdd/features/core/0030-search.feature","area":"core","name":"Search Management","tags":["@TEST-10"],"charter":["TEST-10"],"description":"The Search client wraps ESI's character-scoped search: a query string plus a list of categories to search in, answered with the IDs that matched. It is the standard way to turn a name a player typed into the numeric ID every other endpoint expects.\n\nThe response is an object keyed by category rather than a flat list, and only the categories that matched appear in it, so the shape of the result varies with the query.\n\nRetry, stale-on-error, circuit breaking and request deduplication apply to these calls as to every other; 0050-etag-caching.feature and 0051-resilience.feature specify them once. A failure Rule below states the outcome after they have run, which is why it names every attempt and the absence of a usable cached entry.","boundBy":["tests/bdd/step-definitions/core/search.steps.ts"],"rules":[{"id":"0030-search#R1","title":"When a character-scoped search is performed, the Search client shall return the matched IDs grouped under the key of the category each match belongs to.","line":20,"pattern":"event-driven","exclusion":false,"verdict":"verified","evidence":"","charter":[],"tags":[],"scenarios":[{"title":"Character name query returns three character IDs","line":26,"tags":[]},{"title":"Jita query returns systems, stations, characters, and corporations","line":31,"tags":[]},{"title":"Amarr query returns three solar system IDs","line":36,"tags":[]},{"title":"Goonswarm query returns one alliance ID","line":41,"tags":[]}],"source":"  Rule: When a character-scoped search is performed, the Search client shall return the matched IDs grouped under the key of the category each match belongs to.\n    One query can hit several categories at once — \"Jita\" is a system, a set\n    of stations, and a character name — so results are grouped rather than\n    merged. Keying by category is what lets a caller take the IDs it can use\n    and ignore the rest without a second lookup to work out what each ID is.\n\n    Scenario: Character name query returns three character IDs\n      Given a valid character ID and search string\n      When the client searches for characters\n      Then the client shall return matching character results\n\n    Scenario: Jita query returns systems, stations, characters, and corporations\n      Given a broad search query\n      When the client searches across categories\n      Then the client shall return results in multiple categories\n\n    Scenario: Amarr query returns three solar system IDs\n      Given a search for a solar system name\n      When the client searches for solar systems\n      Then the client shall return matching system IDs\n\n    Scenario: Goonswarm query returns one alliance ID\n      Given a search for an alliance name\n      When the client searches for alliances\n      Then the client shall return matching alliance IDs","sourceStart":20,"findings":[]},{"id":"0030-search#R2","title":"When a search is performed with a two-character query string, the Search client shall return the matches ESI reports for that query.","line":46,"pattern":"event-driven","exclusion":false,"verdict":"verified","evidence":"","charter":[],"tags":[],"scenarios":[{"title":"Two-character query returns system and character matches","line":51,"tags":[]}],"source":"  Rule: When a search is performed with a two-character query string, the Search client shall return the matches ESI reports for that query.\n    Short prefixes are what an autocomplete field sends on the second\n    keystroke. The client imposes no minimum length of its own, so a\n    two-character query reaches ESI and its matches come back like any other.\n\n    Scenario: Two-character query returns system and character matches\n      Given a very short search string\n      When the client searches with a short query\n      Then I shall still receive valid results","sourceStart":46,"findings":[]},{"id":"0030-search#R3","title":"If a search matches nothing in a category, then the Search client shall omit that category key from the result.","line":58,"pattern":"unwanted-behaviour","exclusion":false,"verdict":"verified","evidence":"","charter":[],"tags":[],"scenarios":[{"title":"Query matching nothing returns an object with no category keys","line":64,"tags":[]}],"source":"  Rule: If a search matches nothing in a category, then the Search client shall omit that category key from the result.\n    ESI reports an unmatched category by leaving it out rather than sending an\n    empty array, and the client passes that through. A caller therefore reads\n    an absent key as \"no matches\" and has to guard each category before\n    iterating it.\n\n    Scenario: Query matching nothing returns an object with no category keys\n      Given a search query with no matches\n      When the client searches for nonexistent items\n      Then the client shall return undefined or empty category arrays","sourceStart":58,"findings":[]},{"id":"0030-search#R4","title":"If every attempt at a search request is answered with an error status and no usable cached entry exists, then the Search client shall raise an EsiError.","line":71,"pattern":"unwanted-behaviour","exclusion":false,"verdict":"verified","evidence":"","charter":[],"tags":[],"scenarios":[{"title":"Search without the search scope is rejected with 403","line":77,"tags":[]}],"source":"  Rule: If every attempt at a search request is answered with an error status and no usable cached entry exists, then the Search client shall raise an EsiError.\n    Search is authenticated and requires its own scope, so a token missing\n    that scope is the common failure. It surfaces as the standard error type\n    rather than as an empty result set, which a caller could otherwise read\n    as a query that simply matched nothing.\n\n    Scenario: Search without the search scope is rejected with 403\n      Given insufficient search permissions\n      When the client searches without permissions\n      Then the client shall return a 403 search error","sourceStart":71,"findings":[]}],"noUnwantedBehaviour":false,"orphanScenarios":0},{"file":"tests/bdd/features/core/0031-skills.feature","area":"core","name":"Character Skills","tags":["@TEST-10"],"charter":["TEST-10"],"description":"The Skills client covers the three authenticated character skill endpoints: the trained skill list with its total and unallocated skill points, the ordered training queue, and the five neural attributes with their remap allowance. All three are character-scoped and token-gated, so the client has to surface both the payload shape and the authorisation failure that comes back when the token no longer grants the scope.","boundBy":["tests/bdd/step-definitions/core/skills.steps.ts"],"rules":[{"id":"0031-skills#R1","title":"When character skills are requested, the Skills client shall return the trained skill entries together with the total skill point count, and the unallocated skill point count when present.","line":12,"pattern":"event-driven","exclusion":false,"verdict":"verified","evidence":"","charter":[],"tags":[],"scenarios":[{"title":"Two-skill character returns per-skill levels and total SP","line":19,"tags":[]},{"title":"Veteran character returns every skill entry and unallocated SP","line":24,"tags":[]}],"source":"  Rule: When character skills are requested, the Skills client shall return the trained skill entries together with the total skill point count, and the unallocated skill point count when present.\n    A skill list is only meaningful alongside its totals: the per-skill entries\n    give trained level and skillpoints in skill, while total_sp and\n    unallocated_sp describe the character as a whole. Both a two-skill starter\n    character and an eighty-million-SP veteran are exercised, because the\n    payload shape does not change with size.\n\n    Scenario: Two-skill character returns per-skill levels and total SP\n      Given a valid character ID for skills\n      When the client requests character skills\n      Then the client shall return the skills list with total SP\n\n    Scenario: Veteran character returns every skill entry and unallocated SP\n      Given a veteran character\n      When the client requests their skills\n      Then the client shall return a large skill set with high total SP","sourceStart":12,"findings":[]},{"id":"0031-skills#R2","title":"When the character skill queue is requested, the Skills client shall return an array of queue entries in ascending queue position order.","line":31,"pattern":"event-driven","exclusion":false,"verdict":"verified","evidence":"","charter":[],"tags":[],"scenarios":[{"title":"Three queued skills keep ascending queue positions","line":37,"tags":[]},{"title":"Idle character returns an empty queue array","line":42,"tags":[]}],"source":"  Rule: When the character skill queue is requested, the Skills client shall return an array of queue entries in ascending queue position order.\n    ESI returns the queue already ordered by queue_position, and callers rely\n    on that ordering to render \"training now\" versus \"next up\". An idle\n    character has no queue at all, which the endpoint expresses as an empty\n    array rather than an error or a null body.\n\n    Scenario: Three queued skills keep ascending queue positions\n      Given a character with skills in training\n      When the client requests the skill queue\n      Then the client shall return an ordered queue\n\n    Scenario: Idle character returns an empty queue array\n      Given a character with no skills in training\n      When the client requests the skill queue for idle character\n      Then the client shall return an empty queue array","sourceStart":31,"findings":[]},{"id":"0031-skills#R3","title":"When character attributes are requested, the Skills client shall return the intelligence, memory, perception, willpower, and charisma values, along with the remaining bonus remap count when present.","line":49,"pattern":"event-driven","exclusion":false,"verdict":"verified","evidence":"","charter":[],"tags":[],"scenarios":[{"title":"Default attribute spread returns all five values and remaps","line":56,"tags":[]},{"title":"Perception-weighted remap returns the reallocated values","line":61,"tags":[]}],"source":"  Rule: When character attributes are requested, the Skills client shall return the intelligence, memory, perception, willpower, and charisma values, along with the remaining bonus remap count when present.\n    Training speed is a function of two attributes per skill, so all five\n    values are needed to compute it, and bonus_remaps tells the caller how many\n    further reallocations the character still has. A default spread and a\n    perception-weighted remap are both covered to show the values track\n    whatever the character last chose.\n\n    Scenario: Default attribute spread returns all five values and remaps\n      Given a valid character ID for attributes\n      When the client requests attributes\n      Then the client shall return all five attributes and remap info\n\n    Scenario: Perception-weighted remap returns the reallocated values\n      Given a character with a perception-focused remap\n      When the client requests remapped attributes\n      Then the client shall report elevated perception","sourceStart":49,"findings":[]},{"id":"0031-skills#R4","title":"If the access token does not grant the skills scope, then the Skills client shall reject the request with an EsiError.","line":68,"pattern":"unwanted-behaviour","exclusion":false,"verdict":"verified","evidence":"","charter":[],"tags":[],"scenarios":[{"title":"Expired token rejects the skills request with an EsiError","line":73,"tags":[]}],"source":"  Rule: If the access token does not grant the skills scope, then the Skills client shall reject the request with an EsiError.\n    Every skills endpoint is authenticated. A missing or expired token produces\n    a 403 from ESI, and the client converts that into a typed EsiError rather\n    than a bare response object so callers can branch on the error class.\n\n    Scenario: Expired token rejects the skills request with an EsiError\n      Given an invalid or expired token\n      When the client requests skills without authorization\n      Then the client shall return a 403 skills error","sourceStart":68,"findings":[]},{"id":"0031-skills#R5","title":"The Skills client shall return the skills, queue, and attributes payloads independently when all three are requested concurrently.","line":78,"pattern":"ubiquitous","exclusion":false,"verdict":"verified","evidence":"","charter":[],"tags":[],"scenarios":[{"title":"Concurrent skills, queue, and attributes calls each resolve independently","line":83,"tags":[]}],"source":"  Rule: The Skills client shall return the skills, queue, and attributes payloads independently when all three are requested concurrently.\n    A character sheet view fetches all three at once. The client holds no\n    per-instance request state, so three in-flight calls resolve to their own\n    payloads without interfering with each other.\n\n    Scenario: Concurrent skills, queue, and attributes calls each resolve independently\n      Given a valid character for concurrent fetch\n      When the client fetches skills, queue, and attributes concurrently\n      Then all three shall return valid data","sourceStart":78,"findings":[]}],"noUnwantedBehaviour":false,"orphanScenarios":0},{"file":"tests/bdd/features/core/0032-skyhooks.feature","area":"core","name":"Skyhooks and Sovereignty Hubs","tags":["@TEST-10"],"charter":["TEST-10"],"description":"The Skyhooks client covers the Equinox structures a corporation plants on planets and in sovereign systems: orbital skyhooks with their reagent stock, sovereignty hubs with their installed upgrades and resource pools, and the New Eden wide list of skyhooks currently open to raiding. The corporation listings only locate each structure; its state lives on a separate detail endpoint, so both are specified here.\n\nRetry, stale-on-error, circuit breaking and request deduplication apply to these calls as to every other; 0050-etag-caching.feature and 0051-resilience.feature specify them once. A failure Rule below states the outcome after they have run, which is why it names every attempt and the absence of a usable cached entry.","boundBy":["tests/bdd/step-definitions/core/skyhooks.steps.ts"],"rules":[{"id":"0032-skyhooks#R1","title":"When the sovereignty hubs of a corporation are requested, the Skyhooks client shall return the response's sovereignty_hubs list, each entry with its hub id and solar system.","line":18,"pattern":"event-driven","exclusion":false,"verdict":"verified","evidence":"","charter":[],"tags":[],"scenarios":[{"title":"Hub listing gives each hub's id and solar system","line":24,"tags":[]}],"source":"  Rule: When the sovereignty hubs of a corporation are requested, the Skyhooks client shall return the response's sovereignty_hubs list, each entry with its hub id and solar system.\n    ESI wraps the list in an object ({ sovereignty_hubs: [...] }), and the\n    client returns that object as sent. The listing only locates each hub: its\n    id and solar_system_id. Upgrades, reagents and resource pools come from the\n    per-hub detail endpoint, which the id is the key to.\n\n    Scenario: Hub listing gives each hub's id and solar system\n      Given sovereignty hubs exist\n      When the client requests hubs\n      Then the client shall return the sovereignty_hubs list with ids and solar systems","sourceStart":18,"findings":[]},{"id":"0032-skyhooks#R2","title":"When the orbital skyhooks of a corporation are requested, the Skyhooks client shall return the response's skyhooks list, each entry with its skyhook id and planet.","line":29,"pattern":"event-driven","exclusion":false,"verdict":"verified","evidence":"","charter":[],"tags":[],"scenarios":[{"title":"Skyhook listing gives each skyhook's id and planet","line":35,"tags":[]}],"source":"  Rule: When the orbital skyhooks of a corporation are requested, the Skyhooks client shall return the response's skyhooks list, each entry with its skyhook id and planet.\n    ESI wraps the list in an object ({ skyhooks: [...] }), and the client\n    returns that object as sent. Each entry gives the skyhook's id and the\n    planet_id it orbits; reagent stock and structure state come from the\n    per-skyhook detail endpoint.\n\n    Scenario: Skyhook listing gives each skyhook's id and planet\n      Given orbital skyhooks are deployed\n      When the client requests skyhooks\n      Then the client shall return the skyhooks list with ids and planets","sourceStart":29,"findings":[]},{"id":"0032-skyhooks#R3","title":"When raidable skyhooks are requested, the Skyhooks client shall return the response's skyhooks list, each entry with its planet, solar system and theft vulnerability window.","line":40,"pattern":"event-driven","exclusion":false,"verdict":"verified","evidence":"","charter":[],"tags":[],"scenarios":[{"title":"Raidable listing gives each skyhook's planet and theft window","line":49,"tags":[]},{"title":"No skyhook is open to raids","line":54,"tags":[]}],"source":"  Rule: When raidable skyhooks are requested, the Skyhooks client shall return the response's skyhooks list, each entry with its planet, solar system and theft vulnerability window.\n    This endpoint is cluster-wide and unauthenticated, so it lists skyhooks\n    belonging to any corporation. ESI wraps the list in an object\n    ({ skyhooks: [...] }), and the client returns that object as sent, the same\n    shape withMetadata and withSafeMode return. Each skyhook gives its\n    planet_id, solar_system_id and the start and end of its theft\n    vulnerability window. Upcoming windows are listed too, so a caller can plan\n    ahead from the start time.\n\n    Scenario: Raidable listing gives each skyhook's planet and theft window\n      Given raidable skyhooks exist across New Eden\n      When the client requests raidable skyhooks\n      Then the client shall return the raidable list\n\n    Scenario: No skyhook is open to raids\n      Given no skyhook is open to raids\n      When the client requests raidable skyhooks\n      Then the client shall return an empty raidable list","sourceStart":40,"findings":[]},{"id":"0032-skyhooks#R4","title":"When the detail of a single skyhook is requested, the Skyhooks client shall return its structure state, and its per-reagent stock entries and theft vulnerability window when present.","line":61,"pattern":"event-driven","exclusion":false,"verdict":"verified","evidence":"","charter":[],"tags":[],"scenarios":[{"title":"Skyhook detail returns shield state, reagent stock, and theft window","line":66,"tags":[]}],"source":"  Rule: When the detail of a single skyhook is requested, the Skyhooks client shall return its structure state, and its per-reagent stock entries and theft vulnerability window when present.\n    The detail endpoint is the only place the reagent breakdown and the theft\n    window appear. Both are needed to decide whether a skyhook is worth raiding\n    and when, which the listing endpoint deliberately does not expose.\n\n    Scenario: Skyhook detail returns shield state, reagent stock, and theft window\n      Given a skyhook exists with detail data\n      When the client requests skyhook detail\n      Then the client shall return reagents and state information","sourceStart":61,"findings":[]},{"id":"0032-skyhooks#R5","title":"When the detail of a single sovereignty hub is requested, the Skyhooks client shall return its installed upgrades, its reagent bay with each reagent's hourly burn rate, its power and workforce pools as available and allocated amounts, its workforce transport configuration and state, and its vulnerability window when present.","line":71,"pattern":"event-driven","exclusion":false,"verdict":"verified","evidence":"","charter":[],"tags":[],"scenarios":[{"title":"Hub detail returns upgrade power state, reagent burn rate, resource pools, and workforce transport","line":78,"tags":[]}],"source":"  Rule: When the detail of a single sovereignty hub is requested, the Skyhooks client shall return its installed upgrades, its reagent bay with each reagent's hourly burn rate, its power and workforce pools as available and allocated amounts, its workforce transport configuration and state, and its vulnerability window when present.\n    A hub is a resource machine: upgrades consume power and workforce, and the\n    reagent bay burns down at the stated burning_per_hour rate. Each pool\n    reports what is available against what is allocated. The workforce\n    transport carries a configuration and a state, each one of import, export\n    or transit. Together they let a caller project when the hub runs dry.\n\n    Scenario: Hub detail returns upgrade power state, reagent burn rate, resource pools, and workforce transport\n      Given a sovereignty hub exists with detail data\n      When the client requests sovereignty hub detail\n      Then the client shall return upgrades and resource information","sourceStart":71,"findings":[]},{"id":"0032-skyhooks#R6","title":"If ESI answers every attempt at a skyhooks request with a 503 status and no usable cached entry exists, then the Skyhooks client shall reject the request with an EsiError.","line":85,"pattern":"unwanted-behaviour","exclusion":false,"verdict":"verified","evidence":"","charter":[],"tags":[],"scenarios":[{"title":"ESI outage rejects the hub request with an EsiError","line":90,"tags":[]}],"source":"  Rule: If ESI answers every attempt at a skyhooks request with a 503 status and no usable cached entry exists, then the Skyhooks client shall reject the request with an EsiError.\n    Equinox endpoints go offline during downtime and deployments. The client\n    turns the upstream 503 into a typed EsiError so a caller can distinguish an\n    outage from an empty structure list.\n\n    Scenario: ESI outage rejects the hub request with an EsiError\n      Given the ESI service is down for skyhooks\n      When the client requests skyhook data\n      Then the client shall return a 503 skyhooks error","sourceStart":85,"findings":[]}],"noUnwantedBehaviour":false,"orphanScenarios":0},{"file":"tests/bdd/features/core/0033-sovereignty.feature","area":"core","name":"Sovereignty","tags":["@TEST-10"],"charter":["TEST-10"],"description":"The Sovereignty client covers null-security space ownership: the campaigns currently being contested over TCUs and IHubs, and the combined systems endpoint that reports who holds each solar system along with its development indices and sovereignty hub vulnerability window. The combined endpoint folds together what used to be the separate map and structures payloads, so one call answers both occupancy and structure questions.\n\nRetry, stale-on-error, circuit breaking and request deduplication apply to these calls as to every other; 0050-etag-caching.feature and 0051-resilience.feature specify them once. A failure Rule below states the outcome after they have run, which is why it names every attempt and the absence of a usable cached entry.","boundBy":["tests/bdd/step-definitions/core/sovereignty.steps.ts"],"rules":[{"id":"0033-sovereignty#R1","title":"When sovereignty campaigns are requested, the Sovereignty client shall return one entry per contest carrying its event type and structure, and its attacker score and defender score when present.","line":18,"pattern":"event-driven","exclusion":false,"verdict":"verified","evidence":"","charter":[],"tags":[],"scenarios":[{"title":"Active contests return event type and both contest scores","line":25,"tags":[]},{"title":"Cluster with no contests returns an empty campaign array","line":30,"tags":[]}],"source":"  Rule: When sovereignty campaigns are requested, the Sovereignty client shall return one entry per contest carrying its event type and structure, and its attacker score and defender score when present.\n    The two scores are the live state of a contest and are what a caller\n    renders as the capture bar. Event type distinguishes a TCU defense from an\n    IHub defense, which have different timers. Between contests ESI returns an\n    empty array rather than a 404, so an idle cluster is a normal response and\n    not an error.\n\n    Scenario: Active contests return event type and both contest scores\n      Given active sovereignty contests exist\n      When the client requests campaigns\n      Then the client shall return campaign details with scores\n\n    Scenario: Cluster with no contests returns an empty campaign array\n      Given no active campaigns exist\n      When the client requests campaigns\n      Then the client shall return an empty array","sourceStart":18,"findings":[]},{"id":"0033-sovereignty#R2","title":"If ESI answers every attempt at a sovereignty request with a 503 status and no usable cached entry exists, then the Sovereignty client shall reject the request with an EsiError.","line":35,"pattern":"unwanted-behaviour","exclusion":false,"verdict":"verified","evidence":"","charter":[],"tags":[],"scenarios":[{"title":"ESI outage rejects the campaign request with an EsiError","line":40,"tags":[]}],"source":"  Rule: If ESI answers every attempt at a sovereignty request with a 503 status and no usable cached entry exists, then the Sovereignty client shall reject the request with an EsiError.\n    Sovereignty data goes unavailable during downtime. Surfacing the outage as\n    a typed EsiError keeps it distinguishable from the empty-array response\n    that means there are genuinely no campaigns running.\n\n    Scenario: ESI outage rejects the campaign request with an EsiError\n      Given the ESI service is down\n      When the client requests sovereignty data\n      Then the client shall return a 503 error","sourceStart":35,"findings":[]},{"id":"0033-sovereignty#R3","title":"When sovereignty systems are requested, the Sovereignty client shall return one entry per solar system carrying its claim, with the holding alliance and its military, industrial, and strategic development levels when present.","line":47,"pattern":"event-driven","exclusion":false,"verdict":"verified","evidence":"","charter":[],"tags":[],"scenarios":[{"title":"Two claimed systems return separate military, industrial, and strategic levels","line":53,"tags":[]},{"title":"Combined payload carries claim, development, and hub vulnerability window together","line":58,"tags":[]}],"source":"  Rule: When sovereignty systems are requested, the Sovereignty client shall return one entry per solar system carrying its claim, with the holding alliance and its military, industrial, and strategic development levels when present.\n    The three development levels are tracked independently under Equinox, each\n    driving different upgrades, so they are reported as distinct fields rather\n    than folded into a single index. The claim block also carries the holding\n    alliance and corporation and the date the claim was taken.\n\n    Scenario: Two claimed systems return separate military, industrial, and strategic levels\n      Given the combined systems endpoint is available\n      When the client requests sovereignty systems\n      Then the client shall return occupancy, structures, and separate ADM indices\n\n    Scenario: Combined payload carries claim, development, and hub vulnerability window together\n      Given the combined systems endpoint exists\n      When the client fetches systems\n      Then it shall contain data from both map and structures","sourceStart":47,"findings":[]},{"id":"0033-sovereignty#R4","title":"The Sovereignty client shall return the campaign and system payloads independently when both are requested concurrently.","line":65,"pattern":"ubiquitous","exclusion":false,"verdict":"verified","evidence":"","charter":[],"tags":[],"scenarios":[{"title":"Concurrent campaign and system calls resolve to joinable payloads","line":71,"tags":[]}],"source":"  Rule: The Sovereignty client shall return the campaign and system payloads independently when both are requested concurrently.\n    A sovereignty dashboard fetches contests and occupancy together and then\n    joins them on solar_system_id. The client keeps no per-instance request\n    state, so the two in-flight calls resolve to their own payloads and the\n    join holds.\n\n    Scenario: Concurrent campaign and system calls resolve to joinable payloads\n      Given all sovereignty endpoints are available\n      When the client fetches all data concurrently\n      Then both shall return valid data","sourceStart":65,"findings":[]}],"noUnwantedBehaviour":false,"orphanScenarios":0},{"file":"tests/bdd/features/core/0034-status.feature","area":"core","name":"Server Status","tags":["@TEST-10"],"charter":["TEST-10"],"description":"The Status client wraps the single unauthenticated status endpoint, which reports whether Tranquility is up and what it is doing: how many pilots are logged in, which build is running, when the node came up, and whether the cluster is in VIP mode. It is the endpoint callers poll to decide whether to attempt anything else, so both its success payload and its outage behaviour are specified here.\n\nRetry, stale-on-error, circuit breaking and request deduplication apply to these calls as to every other; 0050-etag-caching.feature and 0051-resilience.feature specify them once. A failure Rule below states the outcome after they have run, which is why it names every attempt and the absence of a usable cached entry.","boundBy":["tests/bdd/step-definitions/core/status.steps.ts"],"rules":[{"id":"0034-status#R1","title":"When server status is requested, the Status client shall return the player count as a number, the server version, the start time as a parseable ISO 8601 timestamp, and the VIP flag.","line":18,"pattern":"event-driven","exclusion":false,"verdict":"verified","evidence":"","charter":[],"tags":[],"scenarios":[{"title":"Online server returns all four status fields","line":25,"tags":[]},{"title":"Player count is a non-negative number","line":30,"tags":[]},{"title":"Start time parses as a calendar date","line":35,"tags":[]}],"source":"  Rule: When server status is requested, the Status client shall return the player count as a number, the server version, the start time as a parseable ISO 8601 timestamp, and the VIP flag.\n    These four fields are the whole payload, and the ESI spec marks all four\n    required. Callers treat players as a\n    number they can compare and start_time as a date they can subtract from\n    now to get cluster uptime, so both are exercised for type as well as\n    presence.\n\n    Scenario: Online server returns all four status fields\n      Given the Tranquility server is online\n      When the client requests the server status\n      Then the client shall return current status information\n\n    Scenario: Player count is a non-negative number\n      Given the server is online with a typical player count\n      When the client checks the player count\n      Then the player count shall be within expected bounds\n\n    Scenario: Start time parses as a calendar date\n      Given the server is online\n      When the client checks the start time\n      Then the start time shall be a valid ISO timestamp","sourceStart":18,"findings":[]},{"id":"0034-status#R2","title":"When server status is requested, the Status client shall report the VIP flag as a boolean reflecting whether login is restricted.","line":42,"pattern":"event-driven","exclusion":false,"verdict":"verified","evidence":"","charter":[],"tags":[],"scenarios":[{"title":"Restricted login reports the VIP flag set with a low player count","line":48,"tags":[]},{"title":"Open login reports the VIP flag clear with a full player count","line":53,"tags":[]}],"source":"  Rule: When server status is requested, the Status client shall report the VIP flag as a boolean reflecting whether login is restricted.\n    VIP mode follows downtime and after emergency restarts, when only\n    privileged accounts can log in. The flag is what tells an application to\n    hold off reconnecting, and the low player count that accompanies it is a\n    consequence rather than an independent signal.\n\n    Scenario: Restricted login reports the VIP flag set with a low player count\n      Given the server is in VIP mode\n      When the client requests the status\n      Then the VIP flag should be true and player cou
