ts with an ETag\n      And ESI accepts a new contact for the character\n      And ESI reports the character's contacts holding the new contact\n      When the reader reads the character's contacts twice\n      And the writer adds a contact for the character\n      And the reader reads the character's contacts\n      Then the runtime shall have sent 3 requests\n      And the contacts read last shall hold the new contact","sourceStart":18,"findings":[]},{"id":"0065-shared-cache-store#R2","title":"If an EsiClient writes to a path over a cache store that carries invalidations, then every other EsiClient on that store shall not send a request for a fresh entry it cached under another path.","line":35,"pattern":"unwanted-behaviour","exclusion":true,"verdict":"verified","evidence":"","charter":["TEST-11"],"tags":["@TEST-11"],"scenarios":[{"title":"The server status cached by the reader is served after the writer adds a contact","line":39,"tags":[]}],"source":"  @TEST-11\n  Rule: If an EsiClient writes to a path over a cache store that carries invalidations, then every other EsiClient on that store shall not send a request for a fresh entry it cached under another path.\n    An invalidation names the written path, so a write to a character's\n    contacts leaves everything else the readers cached in place.\n\n    Scenario: The server status cached by the reader is served after the writer adds a contact\n      Given two EsiClients sharing a cache store that carries invalidations\n      And ESI reports the server status with an ETag\n      And ESI accepts a new contact for the character\n      When the reader requests the server status\n      And the writer adds a contact for the character\n      And the reader requests the server status\n      Then the runtime shall have sent 2 requests","sourceStart":34,"findings":[]},{"id":"0065-shared-cache-store#R3","title":"Where a cache store lacks the invalidation hooks, the EsiClient shall send its next read of a path it wrote to ESI.","line":50,"pattern":"optional-feature","exclusion":false,"verdict":"verified","evidence":"","charter":[],"tags":[],"scenarios":[{"title":"The writer's own cached contacts are fetched again after it adds a contact","line":55,"tags":[]}],"source":"  Rule: Where a cache store lacks the invalidation hooks, the EsiClient shall send its next read of a path it wrote to ESI.\n    The pair is optional: a store with only the five required calls still\n    serves as the cache, and a client still drops the entries it wrote under a\n    path it writes to.\n\n    Scenario: The writer's own cached contacts are fetched again after it adds a contact\n      Given two EsiClients sharing a cache store without the invalidation hooks\n      And ESI reports the character's contacts with an ETag\n      And ESI accepts a new contact for the character\n      And ESI reports the character's contacts holding the new contact\n      When the writer reads the character's contacts\n      And the writer adds a contact for the character\n      And the writer reads the character's contacts\n      Then the runtime shall have sent 3 requests\n      And the contacts read last shall hold the new contact","sourceStart":50,"findings":[]},{"id":"0065-shared-cache-store#R4","title":"If a cache store lacks the invalidation hooks, then the EsiClient shall serve a fresh entry it cached under a path another EsiClient on that store wrote to without a request.","line":66,"pattern":"unwanted-behaviour","exclusion":false,"verdict":"verified","evidence":"","charter":[],"tags":[],"scenarios":[{"title":"The reader keeps serving its cached contacts after the writer adds a contact","line":71,"tags":[]}],"source":"  Rule: If a cache store lacks the invalidation hooks, then the EsiClient shall serve a fresh entry it cached under a path another EsiClient on that store wrote to without a request.\n    Without the pair nothing tells the reader about the writer's write, so the\n    reader keeps its entry until the entry's freshness runs out. This is the\n    documented limit of such a store, pinned so that a change to it is seen.\n\n    Scenario: The reader keeps serving its cached contacts after the writer adds a contact\n      Given two EsiClients sharing a cache store without the invalidation hooks\n      And ESI reports the character's contacts with an ETag\n      And ESI accepts a new contact for the character\n      When the reader reads the character's contacts\n      And the writer adds a contact for the character\n      And the reader reads the character's contacts\n      Then the runtime shall have sent 2 requests\n      And the contacts read last shall not hold the new contact","sourceStart":66,"findings":[]}],"noUnwantedBehaviour":false,"orphanScenarios":0},{"file":"tests/bdd/features/integration/0001-integration-workflows.feature","area":"integration","name":"Integration Workflows","tags":["@TEST-10"],"charter":["TEST-10"],"description":"Real applications rarely call one ESI route. Building a character sheet, a trading view or a fleet roster means fanning out across several domain clients on one EsiClient instance and joining the results by the identifiers they share. This file covers those cross-client workflows: that the joins hold, that collections arrive whole enough to aggregate over, that one failed leg does not take the others down, and that independent legs run in parallel.\n\nEach scenario drives more than one domain client from a single EsiClient, so what is under test is the composition rather than any individual route.","boundBy":["tests/bdd/step-definitions/integration/integration-workflows.steps.ts"],"rules":[{"id":"0001-integration-workflows#R1","title":"When a workflow reads related records from more than one domain client, the EsiClient shall return each record with the identifier fields that link it to the others.","line":15,"pattern":"event-driven","exclusion":false,"verdict":"verified","evidence":"","charter":[],"tags":[],"scenarios":[{"title":"Character profile joins character, corporation, and alliance by identifier","line":21,"tags":[]},{"title":"Fleet overview joins the boss, members, and wings of one fleet","line":26,"tags":[]}],"source":"  Rule: When a workflow reads related records from more than one domain client, the EsiClient shall return each record with the identifier fields that link it to the others.\n    A character record carries corporation_id and alliance_id; a fleet member\n    carries character_id, ship_type_id and solar_system_id. Those keys are the\n    only thing making a join possible, so dropping or renaming one breaks every\n    composed view even though each individual call still succeeds.\n\n    Scenario: Character profile joins character, corporation, and alliance by identifier\n      Given a character ID for profile assembly\n      When the client assembles a complete profile\n      Then the client shall gather all related character data\n\n    Scenario: Fleet overview joins the boss, members, and wings of one fleet\n      Given fleet commander permissions\n      When the client manages fleet operations\n      Then the client shall coordinate fleet activities","sourceStart":15,"findings":[]},{"id":"0001-integration-workflows#R2","title":"When a workflow aggregates over a collection returned by a domain client, the EsiClient shall return every element of that collection with its numeric fields unaltered.","line":33,"pattern":"event-driven","exclusion":false,"verdict":"verified","evidence":"","charter":[],"tags":[],"scenarios":[{"title":"Market analysis derives best bid, best ask, and spread from returned orders","line":40,"tags":[]},{"title":"Corporation overview sums wallet balances across two divisions","line":45,"tags":[]},{"title":"Manufacturing setup sums remaining runs across returned blueprints","line":50,"tags":[]}],"source":"  Rule: When a workflow aggregates over a collection returned by a domain client, the EsiClient shall return every element of that collection with its numeric fields unaltered.\n    Derived figures — a bid-ask spread, a corporation's total wallet balance, a\n    blueprint's remaining runs — are computed by the caller from the elements\n    handed back. A dropped element or a coerced number changes the answer\n    without producing an error anywhere, so these three scenarios check the\n    derived totals rather than the raw payloads.\n\n    Scenario: Market analysis derives best bid, best ask, and spread from returned orders\n      Given a trading opportunity exists\n      When the client performs market analysis\n      Then the client shall gather comprehensive market data\n\n    Scenario: Corporation overview sums wallet balances across two divisions\n      Given a corporation director role\n      When the client manages corporation overview\n      Then the client shall access all corporation data\n\n    Scenario: Manufacturing setup sums remaining runs across returned blueprints\n      Given manufacturing requirements exist\n      When the client sets up production\n      Then the client shall coordinate all manufacturing aspects","sourceStart":33,"findings":[]},{"id":"0001-integration-workflows#R3","title":"If one call in a concurrently issued group rejects with an EsiError, then the EsiClient shall settle the remaining calls in that group with their own results.","line":57,"pattern":"unwanted-behaviour","exclusion":false,"verdict":"verified","evidence":"","charter":[],"tags":[],"scenarios":[{"title":"Portrait outage leaves the character and corporation lookups fulfilled","line":63,"tags":[]}],"source":"  Rule: If one call in a concurrently issued group rejects with an EsiError, then the EsiClient shall settle the remaining calls in that group with their own results.\n    ESI routes fail independently — the image server can be down while the\n    character route is healthy. Failures are per call and carry no shared\n    state, so a caller using Promise.allSettled keeps whatever succeeded and\n    can render a partial view instead of an error page.\n\n    Scenario: Portrait outage leaves the character and corporation lookups fulfilled\n      Given some services are unavailable\n      When the client performs integration workflow with partial failures\n      Then the client shall handle partial failures gracefully","sourceStart":57,"findings":[]},{"id":"0001-integration-workflows#R4","title":"When one lookup is awaited and the five lookups that depend on it are then issued together, the EsiClient shall complete the whole workflow within 400 milliseconds.","line":70,"pattern":"event-driven","exclusion":false,"verdict":"verified","evidence":"","charter":[],"tags":[],"scenarios":[{"title":"Profile fan-out behind the initial character lookup","line":78,"tags":[]}],"source":"  Rule: When one lookup is awaited and the five lookups that depend on it are then issued together, the EsiClient shall complete the whole workflow within 400 milliseconds.\n    The character lookup has 100 milliseconds of transport latency and the five\n    dependent legs 90, 80, 60, 50 and 40. Run one after another the six take\n    at least 420 milliseconds on any machine, so a regression that serialises\n    the fan-out fails here; run in parallel behind the first lookup the\n    workflow settles near 200. The bound says nothing about pipeline speed,\n    which the benchmark tier measures.\n\n    Scenario: Profile fan-out behind the initial character lookup\n      Given a complex data requirement\n      When the client optimizes data gathering\n      Then the client shall minimize API calls and response time","sourceStart":70,"findings":[]}],"noUnwantedBehaviour":false,"orphanScenarios":0},{"file":"tests/bdd/features/performance/0001-performance.feature","area":"performance","name":"Performance Characteristics","tags":["@TEST-10"],"charter":["TEST-10"],"description":"These scenarios are smoke checks of the behaviour that performance depends on: a response is waited for rather than answered early, concurrent calls overlap instead of queueing, and large or repeated payloads come back complete and in order. They state no latency or throughput budget. How fast each path is, and whether a change made it slower, is measured by the benchmark tier (tests/benchmark, npm run bench:ab), which compares a change with its base statistically on one machine instead of against a wall-clock limit a slow runner can miss.\n\nResponses are queued at the HTTP transport, several with a simulated network delay, so every scenario runs the real request pipeline: rate limiter, fetch, JSON parsing, the ETag cache, pagination and Zod validation. The only time bounds below are the ones that separate overlapping requests from requests sent one after another, and each sits at or above half of the serial figure, far from the pipeline's own cost.\n\nThe concurrency Rules hold only with the rate limiter's minimum request spacing set to zero. Its default of 50 milliseconds staggers dispatch on purpose.","boundBy":["tests/bdd/step-definitions/performance/performance.steps.ts"],"rules":[{"id":"0001-performance#R1","title":"When five single-endpoint requests are issued one after another, the EsiClient shall return each body as ESI sent it, no sooner than its transport delay.","line":25,"pattern":"event-driven","exclusion":false,"verdict":"verified","evidence":"","charter":[],"tags":[],"scenarios":[{"title":"Five sequential single-endpoint requests with stubbed latencies of 100 to 300 milliseconds","line":33,"tags":[]}],"source":"  Rule: When five single-endpoint requests are issued one after another, the EsiClient shall return each body as ESI sent it, no sooner than its transport delay.\n    The alliance, character, corporation, market price and solar system calls\n    wait 200, 150, 180, 300 and 100 milliseconds at the transport. Each result\n    is compared with the body ESI sent, one request goes out per call, and each\n    call takes at least its delay less a 5 millisecond timer tolerance, which\n    catches a response that never waited on the transport. There is no upper\n    bound: a slow runner is not a fault.\n\n    Scenario: Five sequential single-endpoint requests with stubbed latencies of 100 to 300 milliseconds\n      Given normal system load\n      When the client makes API requests and measure response times\n      Then each response shall match the body ESI sent","sourceStart":25,"findings":[]},{"id":"0001-performance#R2","title":"When the transport delays a response by up to 1000 milliseconds, the EsiClient shall wait for that response and return its body.","line":38,"pattern":"event-driven","exclusion":false,"verdict":"verified","evidence":"","charter":[],"tags":[],"scenarios":[{"title":"Stubbed latencies of 50, 200, 500, and 1000 milliseconds","line":44,"tags":[]}],"source":"  Rule: When the transport delays a response by up to 1000 milliseconds, the EsiClient shall wait for that response and return its body.\n    The scenario sweeps transport delays of 50, 200, 500 and 1000 milliseconds,\n    one character lookup each, and requires each call to take at least its\n    delay less the timer tolerance, so a long wait is neither cut short nor\n    answered from somewhere other than the transport.\n\n    Scenario: Stubbed latencies of 50, 200, 500, and 1000 milliseconds\n      Given different network latencies\n      When the client makes requests under different conditions\n      Then the client shall wait for each delayed response","sourceStart":38,"findings":[]},{"id":"0001-performance#R3","title":"Where minimum request spacing is disabled, when 50 requests are issued concurrently, the EsiClient shall return all 50 responses within 2500 milliseconds.","line":51,"pattern":"complex","exclusion":false,"verdict":"verified","evidence":"","charter":[],"tags":[],"scenarios":[{"title":"Fifty concurrent character lookups each stubbed at 100 milliseconds","line":58,"tags":[]}],"source":"  Rule: Where minimum request spacing is disabled, when 50 requests are issued concurrently, the EsiClient shall return all 50 responses within 2500 milliseconds.\n    Each of the 50 character lookups waits 100 milliseconds at the transport,\n    so sending them one after another would take 5000. The bound is half that:\n    it fails when requests queue behind one another, or when no more than two\n    are allowed in flight, and leaves the overlapping case, about 110\n    milliseconds, more than twenty times its own duration in headroom.\n\n    Scenario: Fifty concurrent character lookups each stubbed at 100 milliseconds\n      Given high concurrent load\n      When the client makes simultaneous requests\n      Then the requests shall overlap rather than run one after another","sourceStart":51,"findings":[]},{"id":"0001-performance#R4","title":"Where minimum request spacing is disabled, when five requests spanning five domain clients are issued concurrently, the EsiClient shall return all five responses within 650 milliseconds.","line":63,"pattern":"complex","exclusion":false,"verdict":"verified","evidence":"","charter":[],"tags":[],"scenarios":[{"title":"Alliance, character, corporation, system, and market calls issued together","line":70,"tags":[]}],"source":"  Rule: Where minimum request spacing is disabled, when five requests spanning five domain clients are issued concurrently, the EsiClient shall return all five responses within 650 milliseconds.\n    Alliance, character, corporation, universe and market calls wait 120, 100,\n    150, 80 and 200 milliseconds at the transport, 650 in total, so sent one\n    after another they cannot finish sooner than 650. Overlapping, they settle\n    near the slowest leg, about 210, so concurrency has to hold across\n    different domain clients and not only across repeated calls to one.\n\n    Scenario: Alliance, character, corporation, system, and market calls issued together\n      Given mixed API types for concurrent requests\n      When the client makes concurrent requests across different APIs\n      Then all mixed requests shall complete successfully","sourceStart":63,"findings":[]},{"id":"0001-performance#R5","title":"When a region order book of 10000 orders is returned across 10 pages, the EsiClient shall request each page once, in order, and return all 10000 orders in the order ESI sent them.","line":77,"pattern":"event-driven","exclusion":false,"verdict":"verified","evidence":"","charter":[],"tags":[],"scenarios":[{"title":"Ten thousand market orders filtered and aggregated","line":83,"tags":[]}],"source":"  Rule: When a region order book of 10000 orders is returned across 10 pages, the EsiClient shall request each page once, in order, and return all 10000 orders in the order ESI sent them.\n    A Jita region order book is this size, served 1000 orders a page. The\n    scenario checks the page sequence, the order identifiers and the caller's\n    aggregates over the whole book. The cost of fetching, parsing and\n    validating a page is a benchmark (pipeline/GET 1000 region market orders).\n\n    Scenario: Ten thousand market orders filtered and aggregated\n      Given large market data\n      When the client processes the market dataset\n      Then every page shall be fetched once and every order returned","sourceStart":77,"findings":[]},{"id":"0001-performance#R6","title":"When a 5000-entry member list and a 100-entry roles list are requested together, the EsiClient shall return both lists as ESI sent them, each over an authenticated request.","line":88,"pattern":"event-driven","exclusion":false,"verdict":"verified","evidence":"","charter":[],"tags":[],"scenarios":[{"title":"Five thousand member identifiers with one hundred role records","line":93,"tags":[]}],"source":"  Rule: When a 5000-entry member list and a 100-entry roles list are requested together, the EsiClient shall return both lists as ESI sent them, each over an authenticated request.\n    Member identifiers come back as a bare number array, the cheapest shape\n    ESI returns, alongside role records; the scenario counts members by role\n    over the result.\n\n    Scenario: Five thousand member identifiers with one hundred role records\n      Given a large corporation\n      When the client processes member data\n      Then both lists shall be returned complete","sourceStart":88,"findings":[]},{"id":"0001-performance#R7","title":"When a 1000-order response without an ETag is read 100 times in sequence, the EsiClient shall send 100 requests and return the same 1000 orders on the last read as on the first.","line":98,"pattern":"event-driven","exclusion":false,"verdict":"verified","evidence":"","charter":[],"tags":[],"scenarios":[{"title":"One hundred sequential reads of a thousand-order dataset","line":105,"tags":[]}],"source":"  Rule: When a 1000-order response without an ETag is read 100 times in sequence, the EsiClient shall send 100 requests and return the same 1000 orders on the last read as on the first.\n    Without an ETag nothing is cached, so every read is a full fetch, parse and\n    validation. The scenario compares the first and last iteration's order\n    count and average price, which would diverge if state accumulated between\n    reads. Whether memory stays flat over a long run is the heap soak's\n    question (npm run soak), not this scenario's.\n\n    Scenario: One hundred sequential reads of a thousand-order dataset\n      Given memory-intensive operations\n      When the client processes large amounts of data iteratively\n      Then every read shall return the same complete dataset","sourceStart":98,"findings":[]},{"id":"0001-performance#R8","title":"Where minimum request spacing is disabled, if requests within a concurrent group of 20 reject with a 500 error, then the EsiClient shall settle every request in that group within 1000 milliseconds.","line":112,"pattern":"complex","exclusion":false,"verdict":"verified","evidence":"","charter":[],"tags":[],"scenarios":[{"title":"Six of twenty concurrent lookups reject with a 500 error","line":120,"tags":[]}],"source":"  Rule: Where minimum request spacing is disabled, if requests within a concurrent group of 20 reject with a 500 error, then the EsiClient shall settle every request in that group within 1000 milliseconds.\n    ESI answers six of the 20 character lookups with a 500 and the other 14\n    with a character record, each after 100 milliseconds. A 500 is not\n    retried, so each lookup is exactly one request. Sent one after another the\n    group would take 2000 milliseconds; the bound is half that, so rejections\n    have to overlap like successes do. Each rejection reaches the caller as an\n    EsiError carrying status 500.\n\n    Scenario: Six of twenty concurrent lookups reject with a 500 error\n      Given error conditions exist\n      When errors occur during requests\n      Then failed requests shall settle alongside successful ones","sourceStart":112,"findings":[]}],"noUnwantedBehaviour":true,"orphanScenarios":0},{"file":"tests/bdd/features/sde/0001-static-data-lookup.feature","area":"sde","name":"Static Data Lookup","tags":["@TEST-10"],"charter":["TEST-10"],"description":"The SDE provider serves EVE's Static Data Export from an in-memory data set, answering point lookups by primary key and name searches over loaded types. Every record is keyed by the same ID the ESI API uses, so a caller can join live API responses to static data without a translation layer.\n\nRecords also reference one another by ID — a type names its group, a group its category, a region its constellations — and the provider exposes those links as further lookups rather than embedding nested objects.","boundBy":["tests/bdd/specs/sde/0001-static-data-lookup.spec.ts"],"rules":[{"id":"0001-static-data-lookup#R1","title":"When a type ID present in the loaded data set is looked up, the SDE provider shall return the type record carrying its type ID, name, group ID, and published flag.","line":14,"pattern":"event-driven","exclusion":false,"verdict":"verified","evidence":"","charter":[],"tags":[],"scenarios":[{"title":"Type ID 34 resolves to the Tritanium record","line":20,"tags":[]}],"source":"  Rule: When a type ID present in the loaded data set is looked up, the SDE provider shall return the type record carrying its type ID, name, group ID, and published flag.\n    A type is the atom of the SDE: almost every other lookup starts from one.\n    The four fields asserted here are the ones the rest of the library relies\n    on, so a record missing any of them is not usable even if the lookup\n    itself succeeded.\n\n    Scenario: Type ID 34 resolves to the Tritanium record\n      Given an SDE provider with Tritanium loaded\n      When the user looks up type ID 34\n      Then the provider shall return Tritanium with correct attributes","sourceStart":14,"findings":[]},{"id":"0001-static-data-lookup#R2","title":"If a type ID is absent from the loaded data set, then the SDE provider shall return null.","line":25,"pattern":"unwanted-behaviour","exclusion":false,"verdict":"verified","evidence":"","charter":[],"tags":[],"scenarios":[{"title":"Unknown type ID 999999 resolves to null","line":30,"tags":[]}],"source":"  Rule: If a type ID is absent from the loaded data set, then the SDE provider shall return null.\n    A missing record is an ordinary outcome, not a fault — the data set may be\n    a partial extract, and EVE retires type IDs over time. Returning null\n    rather than throwing keeps the caller's control flow simple.\n\n    Scenario: Unknown type ID 999999 resolves to null\n      Given an SDE provider with test data\n      When the user looks up a non-existent type ID\n      Then the provider shall return null","sourceStart":25,"findings":[]},{"id":"0001-static-data-lookup#R3","title":"When a name fragment is searched for, the SDE provider shall return every loaded type whose name contains that fragment, ignoring letter case.","line":37,"pattern":"event-driven","exclusion":false,"verdict":"verified","evidence":"","charter":[],"tags":[],"scenarios":[{"title":"Fragment Trit matches every loaded type containing it","line":42,"tags":[]}],"source":"  Rule: When a name fragment is searched for, the SDE provider shall return every loaded type whose name contains that fragment, ignoring letter case.\n    Callers translate user input — a partial item name typed into a search\n    box — into type IDs. Matching on a case-insensitive substring is what\n    makes that usable without the caller knowing EVE's exact capitalisation.\n\n    Scenario: Fragment Trit matches every loaded type containing it\n      Given an SDE provider with multiple types loaded\n      When the user searches for types matching \"Trit\"\n      Then the provider shall return types whose names contain \"Trit\"","sourceStart":37,"findings":[]},{"id":"0001-static-data-lookup#R4","title":"When a type's group ID and that group's category ID are looked up in turn, the SDE provider shall return the group record and the category record those IDs identify.","line":49,"pattern":"event-driven","exclusion":false,"verdict":"verified","evidence":"","charter":[],"tags":[],"scenarios":[{"title":"Tritanium resolves through group Mineral to category Material","line":54,"tags":[]}],"source":"  Rule: When a type's group ID and that group's category ID are looked up in turn, the SDE provider shall return the group record and the category record those IDs identify.\n    The type-group-category chain is how the SDE classifies every item in the\n    game. Each step is a separate lookup by ID, so the chain holds only if\n    the foreign keys on each record point at records the provider can find.\n\n    Scenario: Tritanium resolves through group Mineral to category Material\n      Given an SDE provider with a complete type hierarchy\n      When the user looks up a type and navigates to its group and category\n      Then the provider shall return the correct group and category","sourceStart":49,"findings":[]},{"id":"0001-static-data-lookup#R5","title":"When the universe hierarchy is traversed downward from a region ID, the SDE provider shall return the constellations of that region and the solar systems of each of those constellations.","line":59,"pattern":"event-driven","exclusion":false,"verdict":"verified","evidence":"","charter":[],"tags":[],"scenarios":[{"title":"The Forge descends to Kimotoro constellation and Jita solar system","line":65,"tags":[]}],"source":"  Rule: When the universe hierarchy is traversed downward from a region ID, the SDE provider shall return the constellations of that region and the solar systems of each of those constellations.\n    Geography is stored as three levels of containment rather than as nested\n    documents, so a caller walks it one level at a time. The Forge exercises\n    the full descent because its contents are well known: Kimotoro holds\n    Jita.\n\n    Scenario: The Forge descends to Kimotoro constellation and Jita solar system\n      Given an SDE provider with The Forge region data loaded\n      When the user looks up the region and navigates through constellations and systems\n      Then the provider shall return Kimotoro constellation and Jita solar system","sourceStart":59,"findings":[]},{"id":"0001-static-data-lookup#R6","title":"When a solar system ID is looked up, the SDE provider shall return the stargates of that system, each carrying a destination solar system ID and a destination stargate ID.","line":70,"pattern":"event-driven","exclusion":false,"verdict":"verified","evidence":"","charter":[],"tags":[],"scenarios":[{"title":"Jita stargates carry a destination system and stargate ID","line":75,"tags":[]}],"source":"  Rule: When a solar system ID is looked up, the SDE provider shall return the stargates of that system, each carrying a destination solar system ID and a destination stargate ID.\n    Stargates are the edges of EVE's travel graph. A stargate is only useful\n    if both ends of the edge are present, which is why the destination pair\n    is asserted rather than the stargate record alone.\n\n    Scenario: Jita stargates carry a destination system and stargate ID\n      Given an SDE provider with stargate data for Jita\n      When the user looks up stargates for Jita\n      Then the provider shall return at least one stargate with a destination","sourceStart":70,"findings":[]}],"noUnwantedBehaviour":false,"orphanScenarios":0},{"file":"tests/bdd/features/sde/0002-sde-universe-hierarchy.feature","area":"sde","name":"Extended Universe Hierarchy Navigation","tags":["@TEST-10"],"charter":["TEST-10"],"description":"Below the region-constellation-system chain, the SDE describes what each solar system physically contains: one star, its planets, the moons orbiting those planets, and the asteroid belts. The SDE provider exposes each of these as a lookup keyed by solar system ID.\n\nThese are the records industry and exploration tooling joins against — moon mining targets, planetary interaction sites, belt ore sources — so the contained bodies must carry the system ID they belong to.","boundBy":["tests/bdd/specs/sde/0002-sde-universe-hierarchy.spec.ts"],"rules":[{"id":"0002-sde-universe-hierarchy#R1","title":"When a solar system ID is looked up, the SDE provider shall return the star of that system carrying its type ID and its spectral class.","line":14,"pattern":"event-driven","exclusion":false,"verdict":"verified","evidence":"","charter":[],"tags":[],"scenarios":[{"title":"Star of system 30000142 is a K7 V","line":19,"tags":[]}],"source":"  Rule: When a solar system ID is looked up, the SDE provider shall return the star of that system carrying its type ID and its spectral class.\n    A system has exactly one star, so this lookup returns a single record\n    rather than a list. Spectral class drives in-game effects such as solar\n    panel output, which is why it is asserted alongside the type ID.\n\n    Scenario: Star of system 30000142 is a K7 V\n      Given a static data provider with hierarchical test data\n      When I look up the star for system 30000142\n      Then the star should have a type ID\n      And the star should have spectral class \"K7 V\"","sourceStart":14,"findings":[]},{"id":"0002-sde-universe-hierarchy#R2","title":"When a solar system ID is looked up, the SDE provider shall return the planets, the moons, and the asteroid belts recorded as belonging to that system.","line":27,"pattern":"event-driven","exclusion":false,"verdict":"verified","evidence":"","charter":[],"tags":[],"scenarios":[{"title":"Planets of system 30000142 all reference that system","line":33,"tags":[]},{"title":"Moons of system 30000142 all reference that system","line":39,"tags":[]},{"title":"Asteroid belts are returned for system 30000142","line":45,"tags":[]}],"source":"  Rule: When a solar system ID is looked up, the SDE provider shall return the planets, the moons, and the asteroid belts recorded as belonging to that system.\n    The three body types are separate collections but share one access\n    pattern, so they are stated as one requirement and exercised from three\n    angles below. Each returned body carries the parent system ID, which is\n    what lets a caller verify it did not receive a body from elsewhere.\n\n    Scenario: Planets of system 30000142 all reference that system\n      Given a static data provider with hierarchical test data\n      When I look up planets for system 30000142\n      Then the result should contain at least 1 planet\n      And each planet should belong to system 30000142\n\n    Scenario: Moons of system 30000142 all reference that system\n      Given a static data provider with hierarchical test data\n      When I look up moons for system 30000142\n      Then the result should contain at least 1 moon\n      And each moon should belong to system 30000142\n\n    Scenario: Asteroid belts are returned for system 30000142\n      Given a static data provider with hierarchical test data\n      When I look up asteroid belts for system 30000142\n      Then the result should contain at least 1 asteroid belt","sourceStart":27,"findings":[]}],"noUnwantedBehaviour":true,"orphanScenarios":0},{"file":"tests/bdd/features/sde/0003-sde-market-hierarchy.feature","area":"sde","name":"Market Group Hierarchy Navigation","tags":["@TEST-10"],"charter":["TEST-10"],"description":"EVE's market browser is a tree of market groups, and the SDE stores that tree as a flat table where each group names its parent. The SDE provider turns the flat table back into a navigable tree with two lookups: fetch the roots, then fetch the children of any group.\n\nCallers use this to render a market browser or to resolve a type to the branch of the tree it is sold under, which needs the parent link to be reliable in both directions.","boundBy":["tests/bdd/specs/sde/0003-sde-market-hierarchy.spec.ts"],"rules":[{"id":"0003-sde-market-hierarchy#R1","title":"When the root market groups are requested, the SDE provider shall return only the market groups whose parent group ID is null.","line":14,"pattern":"event-driven","exclusion":false,"verdict":"verified","evidence":"","charter":[],"tags":[],"scenarios":[{"title":"Every root market group has a null parent","line":19,"tags":[]}],"source":"  Rule: When the root market groups are requested, the SDE provider shall return only the market groups whose parent group ID is null.\n    A null parent is what marks a group as a top-level branch of the market\n    tree. Any group with a parent appearing in this result would give a\n    caller a duplicated branch when it later expands that parent.\n\n    Scenario: Every root market group has a null parent\n      Given a static data provider with hierarchical test data\n      When I look up root market groups\n      Then each market group should have null parent group ID","sourceStart":14,"findings":[]},{"id":"0003-sde-market-hierarchy#R2","title":"When a market group ID is supplied as a parent, the SDE provider shall return the market groups that record that ID as their parent group.","line":26,"pattern":"event-driven","exclusion":false,"verdict":"verified","evidence":"","charter":[],"tags":[],"scenarios":[{"title":"Parent group 1031 yields the Minerals child group","line":31,"tags":[]}],"source":"  Rule: When a market group ID is supplied as a parent, the SDE provider shall return the market groups that record that ID as their parent group.\n    This is the expansion step of the tree walk. Group 1031 is the root\n    Manufacture & Research branch, whose children include Minerals, so a\n    caller descending from it reaches the groups that hold tradeable types.\n\n    Scenario: Parent group 1031 yields the Minerals child group\n      Given a static data provider with hierarchical test data\n      When I look up market groups with parent 1031\n      Then the result should contain at least 1 market group\n      And the first group name should be \"Minerals\"","sourceStart":26,"findings":[]}],"noUnwantedBehaviour":true,"orphanScenarios":0},{"file":"tests/bdd/features/sde/0004-sde-dogma-industry.feature","area":"sde","name":"Dogma and Industry Data","tags":["@TEST-10"],"charter":["TEST-10"],"description":"Dogma is EVE's attribute system: every ship and module carries numbered attributes whose meaning lives in the dogma attribute table. Industry data covers the recipes — blueprints for manufacturing and planetary schematics for planetary interaction.\n\nThese three tables are what a fitting tool, a manufacturing calculator, or a planetary industry planner reads, so the SDE provider exposes each as a lookup by its own primary key.","boundBy":["tests/bdd/specs/sde/0004-sde-dogma-industry.spec.ts"],"rules":[{"id":"0004-sde-dogma-industry#R1","title":"When a dogma attribute ID is looked up, the SDE provider shall return the attribute record carrying its name and its high-is-good flag.","line":14,"pattern":"event-driven","exclusion":false,"verdict":"verified","evidence":"","charter":[],"tags":[],"scenarios":[{"title":"Attribute 9 is named hp and is flagged high-is-good","line":19,"tags":[]}],"source":"  Rule: When a dogma attribute ID is looked up, the SDE provider shall return the attribute record carrying its name and its high-is-good flag.\n    An attribute value means nothing without its definition: the name gives\n    the caller the field to display, and the high-is-good flag says which\n    direction of change is an improvement when comparing two fittings.\n\n    Scenario: Attribute 9 is named hp and is flagged high-is-good\n      Given a static data provider with hierarchical test data\n      When I look up dogma attribute 9\n      Then the attribute name should be \"hp\"\n      And the attribute should be marked as high is good","sourceStart":14,"findings":[]},{"id":"0004-sde-dogma-industry#R2","title":"When a blueprint type ID is looked up, the SDE provider shall return the blueprint record carrying a manufacturing activity with its material list and its manufacturing time.","line":27,"pattern":"event-driven","exclusion":false,"verdict":"verified","evidence":"","charter":[],"tags":[],"scenarios":[{"title":"Blueprint 787 manufactures from a material list in 6000 seconds","line":33,"tags":[]}],"source":"  Rule: When a blueprint type ID is looked up, the SDE provider shall return the blueprint record carrying a manufacturing activity with its material list and its manufacturing time.\n    A blueprint holds several activities — manufacturing, invention, copying\n    — keyed by name. Manufacturing is the one every industry calculation\n    starts from, and it is usable only when both the input materials and the\n    job duration are present.\n\n    Scenario: Blueprint 787 manufactures from a material list in 6000 seconds\n      Given a static data provider with hierarchical test data\n      When I look up blueprint 787\n      Then the blueprint should have manufacturing activity\n      And the manufacturing should have materials\n      And the manufacturing time should be 6000","sourceStart":27,"findings":[]},{"id":"0004-sde-dogma-industry#R3","title":"When a planet schematic ID is looked up, the SDE provider shall return the schematic record carrying its name and its cycle time.","line":42,"pattern":"event-driven","exclusion":false,"verdict":"verified","evidence":"","charter":[],"tags":[],"scenarios":[{"title":"Schematic 65 is Bacteria on a 1800 second cycle","line":47,"tags":[]}],"source":"  Rule: When a planet schematic ID is looked up, the SDE provider shall return the schematic record carrying its name and its cycle time.\n    Planetary interaction runs on fixed-length production cycles, so the\n    cycle time is what a planner multiplies out to reach hourly throughput.\n    The name identifies the commodity the schematic produces.\n\n    Scenario: Schematic 65 is Bacteria on a 1800 second cycle\n      Given a static data provider with hierarchical test data\n      When I look up planet schematic 65\n      Then the schematic name should be \"Bacteria\"\n      And the schematic cycle time should be 1800","sourceStart":42,"findings":[]}],"noUnwantedBehaviour":true,"orphanScenarios":0},{"file":"tests/bdd/features/sde/0005-sde-character-lore.feature","area":"sde","name":"Character and Lore Data Lookup","tags":["@TEST-10"],"charter":["TEST-10"],"description":"Character creation in EVE is a chain of choices — race, then bloodline, then ancestry — and the SDE stores each level as its own table linked by ID. Factions sit above races, and NPC stations are the empire-owned infrastructure those factions operate.\n\nThese tables are what a caller joins against to turn the numeric IDs in an ESI character or station response into names, owners, and the station properties that affect gameplay.","boundBy":["tests/bdd/specs/sde/0005-sde-character-lore.spec.ts"],"rules":[{"id":"0005-sde-character-lore#R1","title":"When a faction ID is looked up, the SDE provider shall return the faction record carrying its name and its list of member races.","line":14,"pattern":"event-driven","exclusion":false,"verdict":"verified","evidence":"","charter":[],"tags":[],"scenarios":[{"title":"Faction 500001 is the Caldari State and lists member races","line":19,"tags":[]}],"source":"  Rule: When a faction ID is looked up, the SDE provider shall return the faction record carrying its name and its list of member races.\n    A faction is the top of the lore hierarchy, and its member race list is\n    the link down into character data. An empty list would leave a caller\n    unable to connect a faction to any character that belongs to it.\n\n    Scenario: Faction 500001 is the Caldari State and lists member races\n      Given a static data provider with hierarchical test data\n      When I look up faction 500001\n      Then the faction name should be \"Caldari State\"\n      And the faction should have member races","sourceStart":14,"findings":[]},{"id":"0005-sde-character-lore#R2","title":"When the character origin chain is traversed from a race ID, the SDE provider shall return the race record, the bloodlines of that race, and the ancestries of each of those bloodlines.","line":27,"pattern":"event-driven","exclusion":false,"verdict":"verified","evidence":"","charter":[],"tags":[],"scenarios":[{"title":"Race 1 Caldari descends to bloodlines and ancestries","line":33,"tags":[]}],"source":"  Rule: When the character origin chain is traversed from a race ID, the SDE provider shall return the race record, the bloodlines of that race, and the ancestries of each of those bloodlines.\n    Each level is a separate lookup keyed by the level above it, mirroring the\n    order of the in-game character creator. The chain holds only if every\n    link resolves, so one scenario walks all three levels in sequence rather\n    than testing each in isolation.\n\n    Scenario: Race 1 Caldari descends to bloodlines and ancestries\n      Given a static data provider with hierarchical test data\n      When I look up race 1\n      Then the race name should be \"Caldari\"\n      When I look up bloodlines for race 1\n      Then the result should contain at least 1 bloodline\n      When I look up ancestries for bloodline 1\n      Then the result should contain at least 1 ancestry","sourceStart":27,"findings":[]},{"id":"0005-sde-character-lore#R3","title":"When an NPC station ID is looked up, the SDE provider shall return the station record carrying its owner ID and its reprocessing efficiency.","line":44,"pattern":"event-driven","exclusion":false,"verdict":"verified","evidence":"","charter":[],"tags":[],"scenarios":[{"title":"NPC station 60003760 reports an owner and a reprocessing efficiency","line":50,"tags":[]}],"source":"  Rule: When an NPC station ID is looked up, the SDE provider shall return the station record carrying its owner ID and its reprocessing efficiency.\n    NPC stations are fixed infrastructure, unlike player structures, so their\n    properties live in static data rather than behind an ESI call. The owner\n    ID resolves to the operating corporation and the reprocessing efficiency\n    determines the yield a refining calculation produces.\n\n    Scenario: NPC station 60003760 reports an owner and a reprocessing efficiency\n      Given a static data provider with hierarchical test data\n      When I look up NPC station 60003760\n      Then the station should have an owner\n      And the station should have reprocessing efficiency","sourceStart":44,"findings":[]}],"noUnwantedBehaviour":true,"orphanScenarios":0},{"file":"tests/bdd/features/sde/0006-sde-version-management.feature","area":"sde","name":"SDE Version Management","tags":["@TEST-10"],"charter":["TEST-10"],"description":"The Static Data Export is republished whenever CCP patches the game, so a loaded data set is only meaningful alongside the release it came from. The MemorySdeProvider carries that provenance as a version record: the SDE version string, the date CCP built it, the date this process imported it, and an optional checksum of the source.\n\nCallers read this to decide whether cached derivations are still valid and to report which data set an answer came from.","boundBy":["tests/bdd/specs/sde/0006-sde-version-management.spec.ts"],"rules":[{"id":"0006-sde-version-management#R1","title":"When the SDE version is queried, the MemorySdeProvider shall return the version string, build date, import date, and checksum recorded in the loaded data set.","line":14,"pattern":"event-driven","exclusion":false,"verdict":"verified","evidence":"","charter":[],"tags":[],"scenarios":[{"title":"Version record reports the values supplied with the data set","line":19,"tags":[]}],"source":"  Rule: When the SDE version is queried, the MemorySdeProvider shall return the version string, build date, import date, and checksum recorded in the loaded data set.\n    All four values come straight from the data set the provider was\n    constructed with, so a caller can distinguish two imports of the same CCP\n    release and can compare checksums to detect a substituted source.\n\n    Scenario: Version record reports the values supplied with the data set\n      Given an SDE provider with version metadata\n      When the user queries the SDE version\n      Then the provider shall return version, build date, and import date","sourceStart":14,"findings":[]},{"id":"0006-sde-version-management#R2","title":"If a MemorySdeProvider is constructed with no version metadata, then the MemorySdeProvider shall return a version record whose version string, build date, and import date are all defined.","line":26,"pattern":"unwanted-behaviour","exclusion":false,"verdict":"verified","evidence":"","charter":[],"tags":[],"scenarios":[{"title":"Empty provider reports placeholder version fields","line":32,"tags":[]}],"source":"  Rule: If a MemorySdeProvider is constructed with no version metadata, then the MemorySdeProvider shall return a version record whose version string, build date, and import date are all defined.\n    An empty provider is a legitimate starting state — a test fixture, or a\n    provider populated later — and querying its version must not yield\n    undefined fields that a caller would then have to guard against. The\n    constructor substitutes placeholder values instead.\n\n    Scenario: Empty provider reports placeholder version fields\n      Given an SDE provider with no version configuration\n      When the user queries the SDE version\n      Then the provider shall return default version information","sourceStart":26,"findings":[]}],"noUnwantedBehaviour":false,"orphanScenarios":0},{"file":"tests/bdd/features/sde/0007-sde-error-handling.feature","area":"sde","name":"SDE Error Handling","tags":["@ARCH-11"],"charter":["ARCH-11"],"description":"The SDE layer raises a small family of errors that all descend from SdeError: SdeDatabaseError for storage faults, SdeValidationError for records that fail their Zod schema, and SdeVersionMismatchError for a data set that does not match the version a caller expected.\n\nEach class carries the context of the failure as structured fields as well as in its message, and each has a type guard so a caller can branch on the failure without reaching for instanceof against an imported class.","boundBy":["tests/bdd/specs/sde/0007-sde-error-handling.spec.ts"],"rules":[{"id":"0007-sde-error-handling#R1","title":"When an SdeValidationError is constructed for an entity type and an entity ID, the SdeValidationError shall expose both values as fields and name both in its message.","line":14,"pattern":"event-driven","exclusion":false,"verdict":"verified","evidence":"","charter":[],"tags":[],"scenarios":[{"title":"Validation failure on an EveType records the type name and ID 34","line":20,"tags":[]}],"source":"  Rule: When an SdeValidationError is constructed for an entity type and an entity ID, the SdeValidationError shall expose both values as fields and name both in its message.\n    A schema failure on a single record must say which record: the entity\n    type alone narrows it to a table, and the entity ID pinpoints the row.\n    The message repeats them so an unhandled error is still diagnosable from\n    a log line.\n\n    Scenario: Validation failure on an EveType records the type name and ID 34\n      Given invalid SDE data for an EveType\n      When the data is validated against the EveType schema\n      Then the SdeValidationError shall carry the entity type and entity ID","sourceStart":14,"findings":[]},{"id":"0007-sde-error-handling#R2","title":"If an SdeValidationError is constructed without an entity ID, then the SdeValidationError shall name the entity type in its message with no ID after it.","line":25,"pattern":"unwanted-behaviour","exclusion":false,"verdict":"verified","evidence":"","charter":[],"tags":[],"scenarios":[{"title":"Validation failure on an EveType with no ID names only the type","line":30,"tags":[]}],"source":"  Rule: If an SdeValidationError is constructed without an entity ID, then the SdeValidationError shall name the entity type in its message with no ID after it.\n    A failure found before a record's ID is known, such as a whole file that\n    does not parse, still names the table. The message leaves the ID out\n    rather than printing a placeholder for it.\n\n    Scenario: Validation failure on an EveType with no ID names only the type\n      Given invalid SDE data for an EveType\n      When the data is validated against the EveType schema without an entity ID\n      Then the SdeValidationError message shall be \"SDE validation failed for EveType\"","sourceStart":25,"findings":[]},{"id":"0007-sde-error-handling#R3","title":"When an SdeVersionMismatchError is constructed from an expected version and an actual version, the SdeVersionMismatchError shall expose both versions as fields and include both in its message.","line":35,"pattern":"event-driven","exclusion":false,"verdict":"verified","evidence":"","charter":[],"tags":[],"scenarios":[{"title":"Mismatch between expected 2.0 and actual 1.0 reports both versions","line":39,"tags":[]}],"source":"  Rule: When an SdeVersionMismatchError is constructed from an expected version and an actual version, the SdeVersionMismatchError shall expose both versions as fields and include both in its message.\n    A version mismatch is only actionable when the caller can see the gap it\n    has to close, so reporting one side without the other is not enough.\n\n    Scenario: Mismatch between expected 2.0 and actual 1.0 reports both versions\n      Given an expected SDE version of \"2.0\" and an actual version of \"1.0\"\n      When an SDE version mismatch error is created\n      Then the error shall contain both the expected and actual versions","sourceStart":35,"findings":[]},{"id":"0007-sde-error-handling#R4","title":"The SDE error type guards shall return true for an error of their own class or of a subclass of it, and false for an error of any other class.","line":46,"pattern":"ubiquitous","exclusion":false,"verdict":"verified","evidence":"","charter":[],"tags":[],"scenarios":[{"title":"Guards separate base, database, validation, and mismatch errors","line":53,"tags":[]}],"source":"  Rule: The SDE error type guards shall return true for an error of their own class or of a subclass of it, and false for an error of any other class.\n    The guards exist so consuming code can narrow an unknown caught value\n    without importing the classes. Because the classes form an inheritance\n    chain, isSdeError accepts every SDE error while the narrower guards\n    accept only their own branch, and a plain Error is rejected by all of\n    them.\n\n    Scenario: Guards separate base, database, validation, and mismatch errors\n      Given various SDE error instances\n      When the type guards are applied\n      Then each guard shall correctly identify its matching error type","sourceStart":46,"findings":[]}],"noUnwantedBehaviour":false,"orphanScenarios":0},{"file":"tests/bdd/features/sde/0008-sde-type-classification.feature","area":"sde","name":"Type Classification","tags":["@TEST-10"],"charter":["TEST-10"],"description":"Every item in EVE sits in exactly one group, and every group in exactly one category; the SDE stores the two links as foreign keys on the type and the group. Beside the point lookups of 0001, the SDE provider answers the reverse questions: which types a group holds, which groups a category holds, and what the full set of categories is.\n\nThese are the lookups a market browser or a fitting tool walks downward, so a parent with nothing beneath it is an ordinary answer — an empty list — rather than a missing record.","boundBy":["tests/bdd/specs/sde/0008-sde-type-classification.spec.ts"],"rules":[{"id":"0008-sde-type-classification#R1","title":"When a group ID is looked up for its types, the SDE provider shall return every loaded type whose group ID is that group.","line":15,"pattern":"event-driven","exclusion":false,"verdict":"verified","evidence":"","charter":[],"tags":[],"scenarios":[{"title":"Group 18 holds the three loaded minerals","line":21,"tags":[]},{"title":"Group 25 exists but holds no loaded types","line":27,"tags":[]}],"source":"  Rule: When a group ID is looked up for its types, the SDE provider shall return every loaded type whose group ID is that group.\n    The group is the level a caller filters on when it wants \"all minerals\"\n    or \"all frigates\". Each returned type carries the group ID it was matched\n    on, which is what lets the caller confirm nothing from another group\n    leaked in.\n\n    Scenario: Group 18 holds the three loaded minerals\n      Given a static data provider with the extended universe data set\n      When I look up types in group 18\n      Then the result should contain exactly 3 records\n      And each type should belong to group 18\n\n    Scenario: Group 25 exists but holds no loaded types\n      Given a static data provider with the extended universe data set\n      When I look up types in group 25\n      Then the provider shall return an empty list","sourceStart":15,"findings":[]},{"id":"0008-sde-type-classification#R2","title":"When a category ID is looked up for its groups, the SDE provider shall return every loaded group whose category ID is that category.","line":34,"pattern":"event-driven","exclusion":false,"verdict":"verified","evidence":"","charter":[],"tags":[],"scenarios":[{"title":"Category 4 holds the Mineral group","line":39,"tags":[]},{"title":"Category 2 exists but holds no loaded groups","line":45,"tags":[]}],"source":"  Rule: When a category ID is looked up for its groups, the SDE provider shall return every loaded group whose category ID is that category.\n    Categories are coarse — Ship, Module, Material — so a caller expanding\n    one expects the groups beneath it and nothing else. A category with no\n    groups loaded is still a category, and answers with an empty list.\n\n    Scenario: Category 4 holds the Mineral group\n      Given a static data provider with the extended universe data set\n      When I look up groups in category 4\n      Then the result should contain exactly 1 records\n      And each group should belong to category 4\n\n    Scenario: Category 2 exists but holds no loaded groups\n      Given a static data provider with the extended universe data set\n      When I look up groups in category 2\n      Then the provider shall return an empty list","sourceStart":34,"findings":[]},{"id":"0008-sde-type-classification#R3","title":"When every category is requested, the SDE provider shall return one record for each loaded category.","line":52,"pattern":"event-driven","exclusion":false,"verdict":"verified","evidence":"","charter":[],"tags":[],"scenarios":[{"title":"The three loaded categories are all returned","line":57,"tags":[]}],"source":"  Rule: When every category is requested, the SDE provider shall return one record for each loaded category.\n    The category list is small and fixed, so callers read it whole to build\n    a top-level menu. Each loaded category appears once; the count and the\n    names together show that none was dropped or duplicated.\n\n    Scenario: The three loaded categories are all returned\n      Given a static data provider with the extended universe data set\n      When I look up every category\n      Then the result should contain exactly 3 records\n      And the result shall be the records named \"Celestial, Material, Ship\"","sourceStart":52,"findings":[]},{"id":"0008-sde-type-classification#R4","title":"When a table or the records of a parent are read, the SDE provider shall return them ordered by ID ascending.","line":65,"pattern":"event-driven","exclusion":false,"verdict":"verified","evidence":"","charter":[],"tags":[],"scenarios":[{"title":"Categories loaded in descending order come back ascending","line":72,"tags":[]},{"title":"The types of a group loaded in descending order come back ascending","line":77,"tags":[]}],"source":"  Rule: When a table or the records of a parent are read, the SDE provider shall return them ordered by ID ascending.\n    CCP's export lists records in no promised order, and the two providers\n    used to keep whichever order they loaded. A caller paging a table or\n    diffing two builds needs one order it can rely on, so both providers sort\n    each table by ID once at load time and every whole-table and foreign-key\n    answer reads in that order.\n\n    Scenario: Categories loaded in descending order come back ascending\n      Given a static data provider whose categories and types were loaded in descending ID order\n      When I look up every category\n      Then the returned records shall be ordered by \"categoryId\" ascending\n\n    Scenario: The types of a group loaded in descending order come back ascending\n      Given a static data provider whose categories and types were loaded in descending ID order\n      When I look up types in group 18\n      Then the returned records shall be ordered by \"typeId\" ascending","sourceStart":65,"findings":[]}],"noUnwantedBehaviour":true,"orphanScenarios":0},{"file":"tests/bdd/features/sde/0009-sde-universe-geography.feature","area":"sde","name":"Universe Geography","tags":["@TEST-10"],"charter":["TEST-10"],"description":"Regions, constellations, solar systems and stargates are the map of New Eden. Feature 0001 walks the map downward from a region; this feature covers the direct lookups each level answers by its own ID, the full list of regions, and finding a system by name.\n\nRoute planners and market tools hold IDs from live API responses — a system ID on a market order, a stargate ID on a route — and turn them into named records through these lookups.","boundBy":["tests/bdd/specs/sde/0009-sde-universe-geography.spec.ts"],"rules":[{"id":"0009-sde-universe-geography#R1","title":"When every region is requested, the SDE provider shall return one record for each loaded region.","line":14,"pattern":"event-driven","exclusion":false,"verdict":"verified","evidence":"","charter":[],"tags":[],"scenarios":[{"title":"The two loaded regions are both returned","line":19,"tags":[]}],"source":"  Rule: When every region is requested, the SDE provider shall return one record for each loaded region.\n    The region list is the top of the map and is read whole, to populate a\n    region picker or to iterate the market region by region. Each loaded\n    region appears once, whether or not it has constellations loaded.\n\n    Scenario: The two loaded regions are both returned\n      Given a static data provider with the extended universe data set\n      When I look up every region\n      Then the result should contain exactly 2 records\n      And the result shall be the records named \"Domain, The Forge\"","sourceStart":14,"findings":[]},{"id":"0009-sde-universe-geography#R2","title":"When a constellation ID present in the loaded data set is looked up, the SDE provider shall return the constellation record carrying its name and its region ID.","line":27,"pattern":"event-driven","exclusion":false,"verdict":"verified","evidence":"","charter":[],"tags":[],"scenarios":[{"title":"Constellation 20000020 resolves to Kimotoro","line":32,"tags":[]}],"source":"  Rule: When a constellation ID present in the loaded data set is looked up, the SDE provider shall return the constellation record carrying its name and its region ID.\n    A constellation is the middle level of the map. The region ID on the\n    record is what lets a caller walk back up from a system to its region\n    without a search.\n\n    Scenario: Constellation 20000020 resolves to Kimotoro\n      Given a static data provider with the extended universe data set\n      When I look up constellation 20000020\n      Then the provider shall return the constellation named \"Kimotoro\"\n      And the returned record shall carry region 10000002","sourceStart":27,"findings":[]},{"id":"0009-sde-universe-geography#R3","title":"When a solar system ID present in the loaded data set is looked up, the SDE provider shall return the solar system record carrying its name and its constellation ID.","line":38,"pattern":"event-driven","exclusion":false,"verdict":"verified","evidence":"","charter":[],"tags":[],"scenarios":[{"title":"Solar system 30000142 resolves to Jita","line":43,"tags":[]}],"source":"  Rule: When a solar system ID present in the loaded data set is looked up, the SDE provider shall return the solar system record carrying its name and its constellation ID.\n    The solar system is the ID most live API responses carry — on orders,\n    killmails, and locations — so this is the lookup callers make most. The\n    constellation ID links the system into the map.\n\n    Scenario: Solar system 30000142 resolves to Jita\n      Given a static data provider with the extended universe data set\n      When I look up solar system 30000142\n      Then the provider shall return the solar system named \"Jita\"\n      And the returned record shall carry constellation 20000020","sourceStart":38,"findings":[]},{"id":"0009-sde-universe-geography#R4","title":"When a stargate ID present in the loaded data set is looked up, the SDE provider shall return the stargate record carrying its solar system ID and its destination.","line":49,"pattern":"event-driven","exclusion":false,"verdict":"verified","evidence":"","charter":[],"tags":[],"scenarios":[{"title":"Stargate 50001248 sits in Jita and leads to Perimeter","line":55,"tags":[]}],"source":"  Rule: When a stargate ID present in the loaded data set is looked up, the SDE provider shall return the stargate record carrying its solar system ID and its destination.\n    Feature 0001 lists the stargates of a system; this lookup answers for one\n    stargate by its own ID, which is what a route step carries. The record is\n    useful only with both ends of the edge, so the system and the destination\n    are asserted together.\n\n    Scenario: Stargate 50001248 sits in Jita and leads to Perimeter\n      Given a static data provider with the extended universe data set\n      When I look up stargate 50001248\n      Then the returned stargate shall have ID 50001248\n      And the returned record shall belong to system 30000142\n      And the stargate destination shall be system 30000144","sourceStart":49,"findings":[]},{"id":"0009-sde-universe-geography#R5","title":"If a constellation, solar system or stargate ID is absent from the loaded data set, then the SDE provider shall return null.","line":62,"pattern":"unwanted-behaviour","exclusion":false,"verdict":"verified","evidence":"","charter":[],"tags":[],"scenarios":[{"title":"Unknown constellation 29999999 resolves to null","line":67,"tags":[]},{"title":"Unknown solar system 39999999 resolves to null","line":72,"tags":[]},{"title":"Unknown stargate 59999999 resolves to null","line":77,"tags":[]}],"source":"  Rule: If a constellation, solar system or stargate ID is absent from the loaded data set, then the SDE provider shall return null.\n    As for types in 0001: a partial extract or a retired ID is an ordinary\n    outcome, and null keeps the caller's control flow simple. The three\n    lookups share one rule because they share one answer.\n\n    Scenario: Unknown constellation 29999999 resolves to null\n      Given a static data provider with the extended universe data set\n      When I look up constellation 29999999\n      Then the provider shall return null\n\n    Scenario: Unknown solar system 39999999 resolves to null\n      Given a static data provider with the extended universe data set\n      When I look up solar system 39999999\n      Then the provider shall return null\n\n    Scenario: Unknown stargate 59999999 resolves to null\n      Given a static data provider with the extended universe data set\n      When I look up stargate 59999999\n      Then the provider shall return null","sourceStart":62,"findings":[]},{"id":"0009-sde-universe-geography#R6","title":"When a name fragment is searched for among solar systems, the SDE provider shall return the loaded solar systems whose names contain that fragment, ignoring letter case, up to the requested limit.","line":84,"pattern":"event-driven","exclusion":false,"verdict":"verified","evidence":"","charter":[],"tags":[],"scenarios":[{"title":"Fragment jit matches Jita alone","line":89,"tags":[]},{"title":"Fragment a matches two systems but a limit of 1 returns one","line":95,"tags":[]}],"source":"  Rule: When a name fragment is searched for among solar systems, the SDE provider shall return the loaded solar systems whose names contain that fragment, ignoring letter case, up to the requested limit.\n    Players type system names, not IDs. A case-insensitive substring match\n    turns \"jit\" into Jita, and the limit — 25 when the caller gives none —\n    keeps a one-letter fragment from returning the whole map.\n\n    Scenario: Fragment jit matches Jita alone\n      Given a static data provider with the extended universe data set\n      When the user searches for solar systems matching \"jit\"\n      Then the provider shall return solar systems whose names contain \"jit\"\n      And the result should contain exactly 1 records\n\n    Scenario: Fragment a matches two systems but a limit of 1 returns one\n      Given a static data provider with the extended universe data set\n      When the user searches for solar systems matching \"a\" with a limit of 1\n      Then the provider shall return solar systems whose names contain \"a\"\n      And the result should contain exactly 1 records","sourceStart":84,"findings":[]}],"noUnwantedBehaviour":false,"orphanScenarios":0},{"file":"tests/bdd/features/sde/0010-sde-celestial-bodies.feature","area":"sde","name":"Celestial Bodies by Identifier","tags":["@TEST-10"],"charter":["TEST-10"],"description":"Feature 0002 lists the star, planets, moons and asteroid belts of a solar system. Each of those bodies also has an ID of its own — the ID a planetary interaction colony, a moon mining extraction or an anomaly refers to — and the SDE provider answers a lookup by that ID directly.\n\nEvery body carries the ID of the solar system it sits in, so a caller that starts from a body ID can place it on the map with one further lookup.","boundBy":["tests/bdd/specs/sde/0010-sde-celestial-bodies.spec.ts"],"rules":[{"id":"0010-sde-celestial-bodies#R1","title":"When a star, planet, moon or asteroid belt ID present in the loaded data set is looked up, the SDE provider shall return the record carrying that ID and its solar system ID.","line":13,"pattern":"event-driven","exclusion":false,"verdict":"verified","evidence":"","charter":[],"tags":[],"scenarios":[{"title":"Star 40009082 sits in Jita","line":18,"tags":[]},{"title":"Planet 40009077 sits in Jita","line":24,"tags":[]},{"title":"Moon 40009078 sits in Jita","line":30,"tags":[]},{"title":"Asteroid belt 40009079 sits in Jita","line":36,"tags":[]}],"source":"  Rule: When a star, planet, moon or asteroid belt ID present in the loaded data set is looked up, the SDE provider shall return the record carrying that ID and its solar system ID.\n    The four body types are separate tables with one access pattern, so they\n    are stated once and exercised from four angles. The solar system ID is\n    asserted because it is the join back to the map.\n\n    Scenario: Star 40009082 sits in Jita\n      Given a static data provider with the extended universe data set\n      When I look up star 40009082\n      Then the returned star shall have ID 40009082\n      And the returned record shall belong to system 30000142\n\n    Scenario: Planet 40009077 sits in Jita\n      Given a static data provider with the extended universe data set\n      When I look up planet 40009077\n      Then the returned planet shall have ID 40009077\n      And the returned record shall belong to system 30000142\n\n    Scenario: Moon 40009078 sits in Jita\n      Given a static data provider with the extended universe data set\n      When I look up moon 40009078\n      Then the returned moon shall have ID 40009078\n      And the returned record shall belong to system 30000142\n\n    Scenario: Asteroid belt 40009079 sits in Jita\n      Given a static data provider with the extended universe data set\n      When I look up asteroid belt 40009079\n      Then the returned asteroid belt shall have ID 40009079\n      And the returned record shall belong to system 30000142","sourceStart":13,"findings":[]},{"id":"0010-sde-celestial-bodies#R2","title":"If a star, planet, moon or asteroid belt ID is absent from the loaded data set, then the SDE provider shall return null.","line":42,"pattern":"unwanted-behaviour","exclusion":false,"verdict":"verified","evidence":"","charter":[],"tags":[],"scenarios":[{"title":"Unknown star 49999991 resolves to null","line":46,"tags":[]},{"title":"Unknown planet 49999992 resolves to null","line":51,"tags":[]},{"title":"Unknown moon 49999993 resolves to null","line":56,"tags":[]},{"title":"Unknown asteroid belt 49999994 resolves to null","line":61,"tags":[]}],"source":"  Rule: If a star, planet, moon or asteroid belt ID is absent from the loaded data set, then the SDE provider shall return null.\n    Body IDs come from live data that may be newer than the loaded extract,\n    so a miss is expected and answered with null rather than an error.\n\n    Scenario: Unknown star 49999991 resolves to null\n      Given a static data provider with the extended universe data set\n      When I look up star 49999991\n      Then the provider shall return null\n\n    Scenario: Unknown planet 49999992 resolves to null\n      Given a static data provider with the extended universe data set\n      When I look up planet 49999992\n      Then the provider shall return null\n\n    Scenario: Unknown moon 49999993 resolves to null\n      Given a static data provider with the extended universe data set\n      When I look up moon 49999993\n      Then the provider shall return null\n\n    Scenario: Unknown asteroid belt 49999994 resolves to null\n      Given a static data provider with the extended universe data set\n      When I look up asteroid belt 49999994\n      Then the provider shall return null","sourceStart":42,"findings":[]}],"noUnwantedBehaviour":false,"orphanScenarios":0},{"file":"tests/bdd/features/sde/0011-sde-market-groups.feature","area":"sde","name":"Market Groups by Identifier and Name","tags":["@TEST-10"],"charter":["TEST-10"],"description":"Feature 0003 walks the market tree from its roots. This feature covers the other ways into it: a market group by its own ID, the types a group sells, and finding a group by name.\n\nA type names its market group by ID, so a caller holding a type from a market order reaches the branch it is sold under with one lookup, and a caller rendering a branch lists the types beneath it with another.","boundBy":["tests/bdd/specs/sde/0011-sde-market-groups.spec.ts"],"rules":[{"id":"0011-sde-market-groups#R1","title":"When a market group ID present in the loaded data set is looked up, the SDE provider shall return the market group record carrying its name and its parent group ID.","line":13,"pattern":"event-driven","exclusion":false,"verdict":"verified","evidence":"","charter":[],"tags":[],"scenarios":[{"title":"Market group 1857 resolves to Minerals under group 1031","line":18,"tags":[]}],"source":"  Rule: When a market group ID present in the loaded data set is looked up, the SDE provider shall return the market group record carrying its name and its parent group ID.\n    The name is what a caller displays; the parent group ID is what lets it\n    walk back up to the root, which is how a breadcrumb over the market tree\n    is built.\n\n    Scenario: Market group 1857 resolves to Minerals under group 1031\n      Given a static data provider with the extended universe data set\n      When I look up market group 1857\n      Then the provider shall return the market group named \"Minerals\"\n      And the returned record shall carry parent group 1031","sourceStart":13,"findings":[]},{"id":"0011-sde-market-groups#R2","title":"If a market group ID is absent from the loaded data set, then the SDE provider shall return null.","line":24,"pattern":"unwanted-behaviour","exclusion":false,"verdict":"verified","evidence":"","charter":[],"tags":[],"scenarios":[{"title":"Unknown market group 99999 resolves to null","line":28,"tags":[]}],"source":"  Rule: If a market group ID is absent from the loaded data set, then the SDE provider shall return null.\n    A type whose market group is not in the loaded extract is still a valid\n    type, so the miss is an ordinary outcome answered with null.\n\n    Scenario: Unknown market group 99999 resolves to null\n      Given a static data provider with the extended universe data set\n      When I look up market group 99999\n      Then the provider shall return null","sourceStart":24,"findings":[]},{"id":"0011-sde-market-groups#R3","title":"When a market group ID is looked up for its types, the SDE provider shall return every loaded type whose market group ID is that group.","line":35,"pattern":"event-driven","exclusion":false,"verdict":"verified","evidence":"","charter":[],"tags":[],"scenarios":[{"title":"Market group 1857 sells the three loaded minerals","line":40,"tags":[]},{"title":"Root market group 1031 exists but sells no types","line":46,"tags":[]}],"source":"  Rule: When a market group ID is looked up for its types, the SDE provider shall return every loaded type whose market group ID is that group.\n    Leaf groups hold the tradeable types; branch groups hold only other\n    groups. Both are market groups, so a branch answers with an empty list\n    rather than a missing record.\n\n    Scenario: Market group 1857 sells the three loaded minerals\n      Given a static data provider with the extended universe data set\n      When I look up types in market group 1857\n      Then the result should contain exactly 3 records\n      And each type should belong to market group 1857\n\n    Scenario: Root market group 1031 exists but sells no types\n      Given a static data provider with the extended universe data set\n      When I look up types in market group 1031\n      Then the provider shall return an empty list","sourceStart":35,"findings":[]},{"id":"0011-sde-market-groups#R4","title":"When a name fragment is searched for among market groups, the SDE provider shall return the loaded market groups whose names contain that fragment, ignoring letter case, up to the requested limit.","line":53,"pattern":"event-driven","exclusion":false,"verdict":"verified","evidence":"","charter":[],"tags":[],"scenarios":[{"title":"Fragment MINER matches the Minerals group","line":58,"tags":[]}],"source":"  Rule: When a name fragment is searched for among market groups, the SDE provider shall return the loaded market groups whose names contain that fragment, ignoring letter case, up to the requested limit.\n    A market search box matches on what the user typed, in whatever case.\n    The limit — 25 when the caller gives none — bounds the answer for a\n    short fragment.\n\n    Scenario: Fragment MINER matches the Minerals group\n      Given a static data provider with the extended universe data set\n      When the user searches for market groups matching \"MINER\"\n      Then the provider shall return market groups whose names contain \"MINER\"\n      And the result should contain exactly 1 records","sourceStart":53,"findings":[]}],"noUnwantedBehaviour":false,"orphanScenarios":0},{"file":"tests/bdd/features/sde/0012-sde-dogma-definitions.feature","area":"sde","name":"Dogma Definitions","tags":["@TEST-10"],"charter":["TEST-10"],"description":"Feature 0004 looks up one dogma attribute by ID. The dogma tables also define effects — what a module does when activated — and two reference tables the attributes point at: the attribute category an attribute is grouped under, and the unit its value is expressed in. This feature covers those lookups and the name searches over attributes and effects.\n\nA fitting tool reads the reference tables whole to label and group what it displays, and searches by name when a user types an attribute rather than picking one.","boundBy":["tests/bdd/specs/sde/0012-sde-dogma-definitions.spec.ts"],"rules":[{"id":"0012-sde-dogma-definitions#R1","title":"When a name fragment is searched for among dogma attributes, the SDE provider shall return the loaded dogma attributes whose names contain that fragment, ignoring letter case, up to the requested limit.","line":15,"pattern":"event-driven","exclusion":false,"verdict":"verified","evidence":"","charter":[],"tags":[],"scenarios":[{"title":"Fragment HP matches the hp attribute","line":21,"tags":[]}],"source":"  Rule: When a name fragment is searched for among dogma attributes, the SDE provider shall return the loaded dogma attributes whose names contain that fragment, ignoring letter case, up to the requested limit.\n    Dogma attribute names are camel-cased identifiers such as hp or\n    shieldCapacity, so a case-insensitive substr
