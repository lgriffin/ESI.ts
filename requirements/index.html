<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>ESI.ts EARS Dashboard</title>
<link rel="icon" href="https://lgriffin.github.io/ESI.ts/favicon.ico">
<style>
:root {
  --bg: #f6f6f3; --panel: #ffffff; --ink: #1d1d1b; --muted: #5d5d58; --line: #deddd6; --accent: #2f5bd3;
  --ok: #1f7a4d; --ok-bg: #e3f3ea; --warn: #8a5a00; --warn-bg: #fbf0d9; --bad: #b42318; --bad-bg: #fde8e6;
  --code-bg: #f1f0ec; --kw: #7a3eb1; --tag: #a15c00; --comment: #7c7c75; --str: #1f7a4d;
  --p-event-driven: #2f5bd3; --p-unwanted-behaviour: #b42318; --p-state-driven: #0f7c84;
  --p-optional-feature: #8a4fbf; --p-ubiquitous: #5b6b7a; --p-complex: #a15c00;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #161615; --panel: #1f1f1d; --ink: #ecebe6; --muted: #a8a79f; --line: #34342f; --accent: #8aa8ff;
    --ok: #6fd3a0; --ok-bg: #173527; --warn: #f0c26b; --warn-bg: #3a2e14; --bad: #ff8f84; --bad-bg: #3d1a17;
    --code-bg: #262623; --kw: #c79bf2; --tag: #f0b45c; --comment: #8d8c85; --str: #6fd3a0;
    --p-event-driven: #8aa8ff; --p-unwanted-behaviour: #ff8f84; --p-state-driven: #5fd0d8;
    --p-optional-feature: #c79bf2; --p-ubiquitous: #9aaabb; --p-complex: #f0b45c;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #161615; --panel: #1f1f1d; --ink: #ecebe6; --muted: #a8a79f; --line: #34342f; --accent: #8aa8ff;
  --ok: #6fd3a0; --ok-bg: #173527; --warn: #f0c26b; --warn-bg: #3a2e14; --bad: #ff8f84; --bad-bg: #3d1a17;
  --code-bg: #262623; --kw: #c79bf2; --tag: #f0b45c; --comment: #8d8c85; --str: #6fd3a0;
  --p-event-driven: #8aa8ff; --p-unwanted-behaviour: #ff8f84; --p-state-driven: #5fd0d8;
  --p-optional-feature: #c79bf2; --p-ubiquitous: #9aaabb; --p-complex: #f0b45c;
  color-scheme: dark;
}
* { box-sizing: border-box; }
body { margin: 0; background: var(--bg); color: var(--ink); font: 15px/1.55 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; }
a { color: var(--accent); }
code, pre, .mono { font-family: ui-monospace, "SF Mono", Menlo, Consolas, monospace; font-size: 13px; }
header, main { max-width: 1180px; margin: 0 auto; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }
header { padding-top: 24px; }
header h1 { margin: 0 0 4px; font-size: 24px; display: flex; align-items: center; gap: 10px; }
header h1 img.logo { border-radius: 6px; flex: none; }
header p { margin: 0; color: var(--muted); }
header p.home { font-size: 13px; margin-bottom: 4px; }
nav { display: flex; gap: 4px; margin-top: 18px; border-bottom: 1px solid var(--line); overflow-x: auto; }
nav button { background: none; border: 0; border-bottom: 3px solid transparent; padding: 10px 14px; font: inherit; color: var(--muted); cursor: pointer; white-space: nowrap; }
nav button[aria-selected="true"] { color: var(--ink); border-bottom-color: var(--accent); font-weight: 600; }
main { padding-top: 20px; padding-bottom: 64px; }
button:focus-visible, a:focus-visible, summary:focus-visible, input:focus-visible, select:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
section[hidden] { display: none; }
h2 { font-size: 19px; margin: 28px 0 10px; }
h2:first-child { margin-top: 4px; }
h3 { font-size: 16px; margin: 0 0 6px; }
.tiles { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 12px; }
.tile { background: var(--panel); border: 1px solid var(--line); border-radius: 10px; padding: 14px; }
.tile .n { font-size: 28px; font-weight: 700; line-height: 1.1; font-variant-numeric: tabular-nums; }
.tile .l { color: var(--muted); font-size: 13px; }
.tile.ok .n { color: var(--ok); } .tile.bad .n { color: var(--bad); } .tile.warn .n { color: var(--warn); }
.card { background: var(--panel); border: 1px solid var(--line); border-radius: 10px; padding: 16px; margin-bottom: 12px; }
.card > p:first-child { margin-top: 0; }
.card > p:last-child { margin-bottom: 0; }
.bars { display: grid; gap: 8px; }
.bar { display: grid; grid-template-columns: 150px 1fr 44px; align-items: center; gap: 10px; }
.bar .track { background: var(--code-bg); border-radius: 4px; height: 14px; overflow: hidden; }
.bar .fill { height: 100%; border-radius: 4px; }
.bar .v { text-align: right; font-variant-numeric: tabular-nums; }
table { border-collapse: collapse; width: 100%; }
th, td { text-align: left; padding: 7px 10px; border-bottom: 1px solid var(--line); vertical-align: top; }
th { font-size: 13px; color: var(--muted); font-weight: 600; }
td.num, th.num { text-align: right; font-variant-numeric: tabular-nums; }
.scroll { overflow-x: auto; }
.pill { display: inline-block; padding: 1px 8px; border-radius: 999px; font-size: 12px; font-weight: 600; white-space: nowrap; }
.pill.verified { background: var(--ok-bg); color: var(--ok); }
.pill.unverified, .pill.finding { background: var(--warn-bg); color: var(--warn); }
.pill.failing { background: var(--bad-bg); color: var(--bad); }
.pill.unknown, .pill.excl { background: var(--code-bg); color: var(--muted); border: 1px solid var(--line); }
.pill.change { background: var(--code-bg); color: var(--accent); border: 1px solid var(--accent); }
.pattern { display: inline-block; padding: 1px 8px; border-radius: 4px; font-size: 12px; font-weight: 600; color: var(--panel); white-space: nowrap; }
.rid { font-weight: 700; font-variant-numeric: tabular-nums; }
.controls { display: flex; flex-wrap: wrap; gap: 8px; margin-bottom: 14px; align-items: center; }
.controls input[type=search] { flex: 1 1 260px; min-width: 0; }
.controls input, .controls select, .controls button { font: inherit; padding: 7px 10px; border: 1px solid var(--line); border-radius: 8px; background: var(--panel); color: var(--ink); max-width: 100%; }
.controls label { display: inline-flex; gap: 6px; align-items: center; color: var(--muted); }
.count { color: var(--muted); font-size: 13px; margin-bottom: 8px; }
details.feature { background: var(--panel); border: 1px solid var(--line); border-radius: 10px; margin-bottom: 10px; }
details.feature > summary { padding: 12px 14px; cursor: pointer; list-style: none; display: flex; flex-wrap: wrap; gap: 8px; align-items: baseline; }
details.feature > summary::-webkit-details-marker { display: none; }
details.feature > summary::before { content: "▸"; color: var(--muted); }
details.feature[open] > summary::before { content: "▾"; }
.fname { font-weight: 650; }
.fpath { color: var(--muted); font-size: 12px; overflow-wrap: anywhere; }
.fbody { padding: 0 14px 14px; }
.desc { white-space: pre-wrap; color: var(--muted); margin: 0 0 10px; }
.meta { font-size: 13px; color: var(--muted); margin: 0 0 10px; }
details.rule { border-top: 1px solid var(--line); }
details.rule > summary { padding: 10px 2px; cursor: pointer; display: grid; grid-template-columns: 1fr; gap: 4px; list-style: none; }
details.rule > summary::-webkit-details-marker { display: none; }
.rhead { display: flex; flex-wrap: wrap; gap: 6px; align-items: center; }
.rbody { padding: 0 2px 12px; }
pre.src { background: var(--code-bg); border-radius: 8px; padding: 10px 0; overflow-x: auto; margin: 6px 0 10px; line-height: 1.5; }
pre.src .ln { display: inline-block; width: 46px; padding-right: 10px; text-align: right; color: var(--comment); user-select: none; }
pre.src .ln a { color: inherit; text-decoration: none; }
pre.src .row { display: block; padding-right: 12px; white-space: pre; }
.k { color: var(--kw); font-weight: 600; }
.t { color: var(--tag); }
.c { color: var(--comment); font-style: italic; }
.s { color: var(--str); }
ul.plain { margin: 4px 0 10px; padding-left: 20px; }
ul.plain li { margin: 2px 0; }
.v-bad { color: var(--bad); }
.v-warn { color: var(--warn); }
.grid2 { display: grid; grid-template-columns: repeat(auto-fit, minmax(300px, 1fr)); gap: 12px; }
.anatomy { display: grid; grid-template-columns: minmax(0, 1.3fr) minmax(0, 1fr); gap: 16px; align-items: start; }
@media (max-width: 760px) { .anatomy { grid-template-columns: 1fr; } .bar { grid-template-columns: 120px 1fr 36px; } }
.callout { border-left: 3px solid var(--accent); padding: 4px 12px; margin: 8px 0; }
ol.steps li { margin: 4px 0; }
.chips { display: flex; flex-wrap: wrap; gap: 6px; }
.chip { background: var(--code-bg); border-radius: 6px; padding: 1px 8px; font-size: 13px; }
a.chip { text-decoration: none; color: var(--ink); }
.empty { color: var(--muted); padding: 24px; text-align: center; }
</style>
</head>
<body>

<header>
  <h1><img class="logo" src="https://lgriffin.github.io/ESI.ts/logo-mark.png" alt="" width="32" height="32">ESI.ts EARS requirements</h1>
  <p class="home"><a href="https://lgriffin.github.io/ESI.ts/">ESI.ts documentation</a> · <a href="https://github.com/lgriffin/ESI.ts">GitHub</a></p>
  <p id="sub"></p>
  <nav role="tablist">

</header>
<main>
  <section id="overview"></section>

    <div class="controls">
      <input type="search" id="q" placeholder="Search requirements, scenarios, ids, files" aria-label="Search">
      <select id="f-pattern" aria-label="Pattern"></select>
      <select id="f-area" aria-label="Area"></select>
      <select id="f-verdict" aria-label="Verdict"></select>

      <label id="changed-wrap" hidden><input type="checkbox" id="f-changed"> <span id="changed-label">Changed only</span></label>
      <button id="expand">Expand all</button>

    <div class="count" id="count"></div>
    <div id="list"></div>
  </section>
  <section id="guide" hidden></section>
</main>

<script type="application/json" id="data">{"generatedAt":"2026-10-28T13:49:37.725Z","repoUrl":"https://github.com/lgriffin/ESI.ts","ref":"e72df98d3e30b4a8ca12205fb51c301cbf825541","reportFrom":"2026-10-28T13:49:18.362Z","audit":"failed","since":null,"removed":[],"patterns":["event-driven","unwanted-behaviour","state-driven","optional-feature","ubiquitous","complex"],"patternGuide":{"event-driven":{"use":"A discrete thing happens: a request is made, a response arrives, a method is called. Most requirements of a client wrapper are this.","template":"When \u003ctrigger>, the \u003csystem> shall \u003cresponse>."},"unwanted-behaviour":{"use":"Something goes wrong: a non-2xx status, a timeout, a malformed payload, a missing field. Check this first. With \"shall not\" it states an exclusion, something the client deliberately does not do.","template":"If \u003ccondition>, then the \u003csystem> shall \u003cresponse>."},"state-driven":{"use":"A condition that lasts: \"how long does it last?\" has a sensible answer, such as while the circuit breaker is open.","template":"While \u003cstate>, the \u003csystem> shall \u003cresponse>."},"optional-feature":{"use":"Behaviour that applies only when a client option is set, such as enableETagCache or validateResponse.","template":"Where \u003cfeature is enabled>, the \u003csystem> shall \u003cresponse>."},"ubiquitous":{"use":"Always true, with no trigger. Use sparingly: an unconditional requirement is usually one whose condition was left implicit.","template":"The \u003csystem> shall \u003cresponse>."},"complex":{"use":"Two clauses before \"shall\", such as a state and a trigger. Classified by the report; prefer splitting into simpler Rules where the meaning allows.","template":"While \u003cstate>, when \u003ctrigger>, the \u003csystem> shall \u003cresponse>."}},"examples":{"event-driven":{"feature":39,"rule":18},"unwanted-behaviour":{"feature":44,"rule":1},"state-driven":{"feature":15,"rule":1},"ubiquitous":{"feature":78,"rule":1},"optional-feature":{"feature":45,"rule":26},"complex":{"feature":43,"rule":7}},"vagueTerms":{"vague adverb":["quickly","slowly","efficiently","properly","reasonably","approximately","usually","typically","generally","soon","eventually","immediately","gracefully","correctly","appropriately"],"unmeasurable adjective":["user-friendly","flexible","intuitive","robust","scalable","efficient","seamless","responsive","reliable","powerful","smart","easy-to-use","graceful"],"vague quantifier":["various","some","many","few","several","most","a lot"],"escape clause":["as appropriate","if possible","as needed","where practical","to the extent feasible","if necessary","when applicable"],"continuation term":["etc.","and so on","and/or","such as"],"indefinite temporal term":["timely","in a timely manner","in real time","promptly","without delay","as soon as possible","periodic"]},"wrongObligations":["should","may","will","must"],"pronouns":["it","they","he","she","we","you"],"features":[{"file":"tests/bdd/features/core/0001-alliance.feature","area":"core","name":"Alliance Management","tags":["@TEST-10"],"charter":["TEST-10"],"description":"The Alliance client covers the public alliance endpoints of ESI: the alliance record itself, the alliance contact list, and the corporations that belong to the alliance. These are the endpoints most integrations reach for first, so the shape of a successful payload, the shape of an empty collection, and the shape of a failure are all pinned down here rather than rediscovered per domain.","boundBy":["tests/bdd/specs/core/0001-alliance.spec.ts"],"rules":[{"id":"0001-alliance#R1","title":"When alliance details are requested for an alliance ID, the Alliance client shall return a record carrying name, ticker, and creator_id, and alliance_id when present.","line":12,"pattern":"event-driven","exclusion":false,"verdict":"verified","evidence":"","charter":[],"tags":[],"scenarios":[{"title":"Alliance record for a known alliance ID","line":18,"tags":[]}],"source":"  Rule: When alliance details are requested for an alliance ID, the Alliance client shall return a record carrying name, ticker, and creator_id, and alliance_id when present.\n    The alliance record is the anchor object for the domain — every other\n    alliance lookup is keyed off the same ID. Those four fields are the ones\n    ESI marks required on the payload, so a caller can depend on them being\n    present without a null check.\n\n    Scenario: Alliance record for a known alliance ID\n      Given a valid alliance ID\n      When the client requests alliance details\n      Then the client shall return complete alliance information","sourceStart":12,"findings":[]},{"id":"0001-alliance#R2","title":"When alliance details, contacts, and member corporations are requested together, the Alliance client shall resolve all three calls and return the member corporations as an array of numeric corporation IDs.","line":23,"pattern":"event-driven","exclusion":false,"verdict":"verified","evidence":"","charter":[],"tags":[],"scenarios":[{"title":"Concurrent fetch of record, contacts, and member corporations","line":28,"tags":[]}],"source":"  Rule: When alliance details, contacts, and member corporations are requested together, the Alliance client shall resolve all three calls and return the member corporations as an array of numeric corporation IDs.\n    Profile assembly fans out across three endpoints at once. The member\n    corporation endpoint is the odd one out because it returns bare IDs rather\n    than objects, so this is where that contract is stated.\n\n    Scenario: Concurrent fetch of record, contacts, and member corporations\n      Given a valid alliance ID for information gathering\n      When the client gathers complete alliance information\n      Then the client shall successfully retrieve all related data","sourceStart":23,"findings":[]},{"id":"0001-alliance#R3","title":"When an alliance contact list is requested, the Alliance client shall return an array whose entries each carry contact_id, contact_type, and standing.","line":35,"pattern":"event-driven","exclusion":false,"verdict":"verified","evidence":"","charter":[],"tags":[],"scenarios":[{"title":"Contact list holding a character entry and a corporation entry","line":40,"tags":[]}],"source":"  Rule: When an alliance contact list is requested, the Alliance client shall return an array whose entries each carry contact_id, contact_type, and standing.\n    Contacts drive standings-based logic in consuming applications, so the\n    entry triple of who, what kind, and what standing is the minimum a caller\n    needs. Entries arrive as a flat array with no envelope.\n\n    Scenario: Contact list holding a character entry and a corporation entry\n      Given a valid alliance with contacts\n      When the client requests contact list\n      Then the client shall return an array of contacts","sourceStart":35,"findings":[]},{"id":"0001-alliance#R4","title":"If an alliance holds no contacts, then the Alliance client shall return an empty array.","line":45,"pattern":"unwanted-behaviour","exclusion":false,"verdict":"verified","evidence":"","charter":[],"tags":[],"scenarios":[{"title":"Alliance holding no contacts","line":50,"tags":[]}],"source":"  Rule: If an alliance holds no contacts, then the Alliance client shall return an empty array.\n    An alliance with no contacts is an ordinary state, not an error. Returning\n    an empty array rather than null or a rejection keeps the call site free of\n    a special case.\n\n    Scenario: Alliance holding no contacts\n      Given an alliance with no contacts\n      When the client requests contact list for the alliance\n      Then the client shall return an empty alliance contact array","sourceStart":45,"findings":[]},{"id":"0001-alliance#R5","title":"If an alliance request fails, then the Alliance client shall reject with an EsiError.","line":57,"pattern":"unwanted-behaviour","exclusion":false,"verdict":"verified","evidence":"","charter":[],"tags":[],"scenarios":[{"title":"Unknown alliance ID rejects the request","line":64,"tags":[]},{"title":"Transport failure rejects the request","line":69,"tags":[]},{"title":"Rate limited response rejects the request","line":74,"tags":[]}],"source":"  Rule: If an alliance request fails, then the Alliance client shall reject with an EsiError.\n    Every failure mode is funnelled into one error type so callers write a\n    single catch rather than branching on transport versus HTTP status. The\n    three scenarios below cover the distinct origins of failure that reach\n    this surface: an HTTP 404 from ESI, a transport-level failure with no HTTP\n    status at all, and an HTTP 429 from the error limiter.\n\n    Scenario: Unknown alliance ID rejects the request\n      Given an invalid alliance ID\n      When the client requests alliance details for the invalid ID\n      Then the client shall return a not found error\n\n    Scenario: Transport failure rejects the request\n      Given network connectivity problems\n      When the client requests alliance details during network issues\n      Then the client shall return a network error\n\n    Scenario: Rate limited response rejects the request\n      Given API rate limiting is active\n      When the client makes a rate limited request\n      Then the client shall return appropriate rate limit errors","sourceStart":57,"findings":[]},{"id":"0001-alliance#R6","title":"When alliance details are requested, the Alliance client shall resolve the call in under 5000 milliseconds.","line":81,"pattern":"event-driven","exclusion":false,"verdict":"verified","evidence":"","charter":[],"tags":[],"scenarios":[{"title":"Alliance details resolve inside the latency budget","line":86,"tags":[]}],"source":"  Rule: When alliance details are requested, the Alliance client shall resolve the call in under 5000 milliseconds.\n    The client wraps each call in retry, rate limiting, and cache lookup\n    middleware. This bound guards against a change to that pipeline adding a\n    stall — a blocking sleep or an unbounded backoff — on the happy path.\n\n    Scenario: Alliance details resolve inside the latency budget\n      Given normal API conditions\n      When the client requests alliance data\n      Then the response shall be within acceptable time limits","sourceStart":81,"findings":[]}],"noUnwantedBehaviour":false,"orphanScenarios":0},{"file":"tests/bdd/features/core/0002-character.feature","area":"core","name":"Character Management","tags":["@TEST-10"],"charter":["TEST-10"],"description":"The Characters client covers the per-character endpoints of ESI, split between data anyone can read — the public profile, the portrait set, and the employment history — and data that needs a scoped token, such as corporation roles, medals, and notifications. Each endpoint returns a differently shaped payload, so the required fields of each are stated separately below, along with the single error type every failure is funnelled into.","boundBy":["tests/bdd/step-definitions/core/character.steps.ts"],"rules":[{"id":"0002-character#R1","title":"When the public profile is requested for a character ID, the Characters client shall return a record carrying name, corporation_id, and birthday, and alliance_id when present.","line":12,"pattern":"event-driven","exclusion":false,"verdict":"verified","evidence":"","charter":[],"tags":[],"scenarios":[{"title":"Public profile for a known character ID","line":17,"tags":[]}],"source":"  Rule: When the public profile is requested for a character ID, the Characters client shall return a record carrying name, corporation_id, and birthday, and alliance_id when present.\n    The public profile is the anchor record for the domain and needs no token.\n    Corporation and alliance membership are the fields callers most often join\n    against, and birthday is what dates a character for age-based filtering.\n\n    Scenario: Public profile for a known character ID\n      Given a valid character ID\n      When the client requests public information\n      Then the client shall return complete character profile","sourceStart":12,"findings":[]},{"id":"0002-character#R2","title":"When the portrait set is requested for a character ID, the Characters client shall return image URLs at the 64, 128, 256, and 512 pixel sizes.","line":22,"pattern":"event-driven","exclusion":false,"verdict":"verified","evidence":"","charter":[],"tags":[],"scenarios":[{"title":"Portrait URLs at four pixel sizes","line":27,"tags":[]}],"source":"  Rule: When the portrait set is requested for a character ID, the Characters client shall return image URLs at the 64, 128, 256, and 512 pixel sizes.\n    ESI serves portraits as four fixed renditions rather than a single\n    resizable image. A caller picking a size for a given surface needs all\n    four keys present, so the absence of any one of them is a defect.\n\n    Scenario: Portrait URLs at four pixel sizes\n      Given a valid character ID for portrait\n      When the client requests portraits\n      Then the client shall return image URLs in different sizes","sourceStart":22,"findings":[]},{"id":"0002-character#R3","title":"When corporation history is requested for a character ID, the Characters client shall return an array whose entries each carry corporation_id, start_date, and record_id.","line":32,"pattern":"event-driven","exclusion":false,"verdict":"verified","evidence":"","charter":[],"tags":[],"scenarios":[{"title":"Employment history entries for a character","line":37,"tags":[]}],"source":"  Rule: When corporation history is requested for a character ID, the Characters client shall return an array whose entries each carry corporation_id, start_date, and record_id.\n    Employment history is public and is the usual way to establish how long a\n    character has been where. The record_id orders the entries, and start_date\n    dates each membership span.\n\n    Scenario: Employment history entries for a character\n      Given a character ID for history\n      When the client requests corporation history\n      Then the client shall return employment history","sourceStart":32,"findings":[]},{"id":"0002-character#R4","title":"When corporation roles are requested for a character ID, the Characters client shall return a record whose roles field, when present, is an array of role names.","line":44,"pattern":"event-driven","exclusion":false,"verdict":"verified","evidence":"","charter":[],"tags":[],"scenarios":[{"title":"Role assignments for an authenticated character","line":50,"tags":[]}],"source":"  Rule: When corporation roles are requested for a character ID, the Characters client shall return a record whose roles field, when present, is an array of role names.\n    Roles gate access to the corporation endpoints, so a consuming application\n    reads them to decide which calls are worth attempting. The payload also\n    carries base, HQ, and other-location variants, but the plain roles array\n    is the one every caller reads.\n\n    Scenario: Role assignments for an authenticated character\n      Given an authenticated character\n      When the client requests roles\n      Then the client shall return role information","sourceStart":44,"findings":[]},{"id":"0002-character#R5","title":"When medals are requested for a character ID, the Characters client shall return an array whose entries each carry medal_id, title, description, and date.","line":55,"pattern":"event-driven","exclusion":false,"verdict":"verified","evidence":"","charter":[],"tags":[],"scenarios":[{"title":"Medal entries awarded to a character","line":60,"tags":[]}],"source":"  Rule: When medals are requested for a character ID, the Characters client shall return an array whose entries each carry medal_id, title, description, and date.\n    Medals are awarded by a corporation and carry free text supplied by the\n    issuer. The four fields named here are the ones a display surface needs to\n    render an award without a second lookup.\n\n    Scenario: Medal entries awarded to a character\n      Given a character ID for medals\n      When the client requests medals\n      Then the client shall return medal information","sourceStart":55,"findings":[]},{"id":"0002-character#R6","title":"When notifications are requested for a character ID, the Characters client shall return an array whose entries each carry notification_id, sender_id, type, and timestamp.","line":65,"pattern":"event-driven","exclusion":false,"verdict":"verified","evidence":"","charter":[],"tags":[],"scenarios":[{"title":"Notification entries for an authenticated character","line":70,"tags":[]}],"source":"  Rule: When notifications are requested for a character ID, the Characters client shall return an array whose entries each carry notification_id, sender_id, type, and timestamp.\n    Notifications are the in-game message feed. The type field discriminates\n    dozens of message kinds, and the timestamp orders them, so both are needed\n    before an entry can be interpreted at all.\n\n    Scenario: Notification entries for an authenticated character\n      Given an authenticated character for notifications\n      When the client requests notifications\n      Then the client shall return notification list","sourceStart":65,"findings":[]},{"id":"0002-character#R7","title":"If a character request fails, then the Characters client shall reject with an EsiError.","line":77,"pattern":"unwanted-behaviour","exclusion":false,"verdict":"verified","evidence":"","charter":[],"tags":[],"scenarios":[{"title":"Unknown character ID rejects the request","line":83,"tags":[]},{"title":"Missing authorization on the roles endpoint rejects the request","line":88,"tags":[]},{"title":"Expired token on the notifications endpoint rejects the request","line":93,"tags":[]}],"source":"  Rule: If a character request fails, then the Characters client shall reject with an EsiError.\n    One error type across the domain keeps the call site to a single catch.\n    The three scenarios below cover the distinct origins that reach this\n    surface: an HTTP 404 for an unknown character, an HTTP 403 where the token\n    lacks the scope, and an HTTP 401 where the token has expired.\n\n    Scenario: Unknown character ID rejects the request\n      Given an invalid character ID\n      When the client requests public information for the invalid character\n      Then the client shall return a not found error\n\n    Scenario: Missing authorization on the roles endpoint rejects the request\n      Given an unauthenticated request\n      When the client accesses private data without authorization\n      Then the client shall return an authorization error\n\n    Scenario: Expired token on the notifications endpoint rejects the request\n      Given an expired token\n      When the client accesses private data with expired token\n      Then the client shall return an authentication error","sourceStart":77,"findings":[]},{"id":"0002-character#R8","title":"When public profiles for distinct character IDs are requested concurrently, the Characters client shall resolve each call with the record belonging to its own character ID.","line":100,"pattern":"event-driven","exclusion":false,"verdict":"verified","evidence":"","charter":[],"tags":[],"scenarios":[{"title":"Three character profiles fetched at once","line":105,"tags":[]}],"source":"  Rule: When public profiles for distinct character IDs are requested concurrently, the Characters client shall resolve each call with the record belonging to its own character ID.\n    Nothing in the request pipeline may let one in-flight call answer another.\n    Request deduplication coalesces identical GETs, so this pins down that\n    calls differing only by path parameter stay distinct.\n\n    Scenario: Three character profiles fetched at once\n      Given multiple concurrent character requests\n      When the client makes them simultaneously\n      Then all requests shall complete successfully","sourceStart":100,"findings":[]},{"id":"0002-character#R9","title":"When the public profile, portrait, roles, and notifications are requested together, the Characters client shall resolve all four calls.","line":110,"pattern":"event-driven","exclusion":false,"verdict":"verified","evidence":"","charter":[],"tags":[],"scenarios":[{"title":"Concurrent fetch of profile, portrait, roles, and notifications","line":115,"tags":[]}],"source":"  Rule: When the public profile, portrait, roles, and notifications are requested together, the Characters client shall resolve all four calls.\n    Profile assembly fans out across four endpoints, two of which need a\n    token. A caller building a character sheet issues these as one batch, so\n    they need to be safe to await together.\n\n    Scenario: Concurrent fetch of profile, portrait, roles, and notifications\n      Given a character ID for profile assembly\n      When the client gathers complete profile data\n      Then the client shall successfully retrieve all available character information","sourceStart":110,"findings":[]},{"id":"0002-character#R10","title":"When a character public profile is requested, the Characters client shall resolve the call in under 5000 milliseconds.","line":120,"pattern":"event-driven","exclusion":false,"verdict":"verified","evidence":"","charter":[],"tags":[],"scenarios":[{"title":"Character profile resolves inside the latency budget","line":125,"tags":[]}],"source":"  Rule: When a character public profile is requested, the Characters client shall resolve the call in under 5000 milliseconds.\n    Each call passes through retry, rate limiting, and cache lookup middleware.\n    This bound guards against a change to that pipeline introducing a stall on\n    the happy path.\n\n    Scenario: Character profile resolves inside the latency budget\n      Given normal API conditions for character\n      When the client requests character data\n      Then the response shall be within acceptable limits","sourceStart":120,"findings":[]}],"noUnwantedBehaviour":false,"orphanScenarios":0},{"file":"tests/bdd/features/core/0003-corporation.feature","area":"core","name":"Corporation Management","tags":["@TEST-10"],"charter":["TEST-10"],"description":"The Corporations client covers the corporation endpoints of ESI: the public corporation record, the member list and the roles held by those members, and the director-only views over blueprints, structures, and standings. Most of this domain is role-gated, so the failure surface matters as much as the success payloads and is stated here alongside them.","boundBy":["tests/bdd/step-definitions/core/corporation.steps.ts"],"rules":[{"id":"0003-corporation#R1","title":"When public information is requested for a corporation ID, the Corporations client shall return a record carrying name, ticker, ceo_id, and member_count, and alliance_id when present.","line":11,"pattern":"event-driven","exclusion":false,"verdict":"verified","evidence":"","charter":[],"tags":[],"scenarios":[{"title":"Public profile for a known corporation ID","line":16,"tags":[]}],"source":"  Rule: When public information is requested for a corporation ID, the Corporations client shall return a record carrying name, ticker, ceo_id, and member_count, and alliance_id when present.\n    The corporation record is the anchor object for the domain and needs no\n    token. Ticker and member count are what most display surfaces show next to\n    the name, and alliance_id is the join key up to the alliance domain.\n\n    Scenario: Public profile for a known corporation ID\n      Given a valid corporation ID\n      When the client requests public information\n      Then the client shall return complete corporation profile","sourceStart":11,"findings":[]},{"id":"0003-corporation#R2","title":"When public information for distinct corporation IDs is requested concurrently, the Corporations client shall resolve each call with the record belonging to its own corporation ID.","line":21,"pattern":"event-driven","exclusion":false,"verdict":"verified","evidence":"","charter":[],"tags":[],"scenarios":[{"title":"Three corporation profiles fetched at once","line":26,"tags":[]}],"source":"  Rule: When public information for distinct corporation IDs is requested concurrently, the Corporations client shall resolve each call with the record belonging to its own corporation ID.\n    Request deduplication coalesces identical GETs in flight. This pins down\n    that calls differing by path parameter stay distinct and never answer one\n    another.\n\n    Scenario: Three corporation profiles fetched at once\n      Given multiple concurrent corporation data requests\n      When the client makes them simultaneously\n      Then all requests shall complete successfully","sourceStart":21,"findings":[]},{"id":"0003-corporation#R3","title":"When the member list is requested for a corporation ID, the Corporations client shall return an array of numeric character IDs.","line":33,"pattern":"event-driven","exclusion":false,"verdict":"verified","evidence":"","charter":[],"tags":[],"scenarios":[{"title":"Member character IDs for an authenticated director","line":38,"tags":[]}],"source":"  Rule: When the member list is requested for a corporation ID, the Corporations client shall return an array of numeric character IDs.\n    The member endpoint returns bare IDs rather than objects, so a caller\n    wanting names has to fan out to the character domain. Stating the element\n    type here is what makes that fan-out safe to write.\n\n    Scenario: Member character IDs for an authenticated director\n      Given an authenticated corporation director\n      When the client requests member list\n      Then the client shall return member character IDs","sourceStart":33,"findings":[]},{"id":"0003-corporation#R4","title":"When member roles are requested for a corporation ID, the Corporations client shall return an array whose entries each carry character_id, and a roles array when present.","line":43,"pattern":"event-driven","exclusion":false,"verdict":"verified","evidence":"","charter":[],"tags":[],"scenarios":[{"title":"Role assignments for a corporation member","line":48,"tags":[]}],"source":"  Rule: When member roles are requested for a corporation ID, the Corporations client shall return an array whose entries each carry character_id, and a roles array when present.\n    Role assignments are per member, so the character_id is what ties an entry\n    back to the member list. The roles array is the field that decides which\n    director-only endpoints that member can reach.\n\n    Scenario: Role assignments for a corporation member\n      Given an authenticated corporation director for roles\n      When the client requests member roles\n      Then the client shall return role assignments","sourceStart":43,"findings":[]},{"id":"0003-corporation#R5","title":"When a member list of 10000 entries is returned, the Corporations client shall deliver every entry to the caller in under 1000 milliseconds.","line":53,"pattern":"event-driven","exclusion":false,"verdict":"verified","evidence":"","charter":[],"tags":[],"scenarios":[{"title":"Member list of ten thousand IDs","line":58,"tags":[]}],"source":"  Rule: When a member list of 10000 entries is returned, the Corporations client shall deliver every entry to the caller in under 1000 milliseconds.\n    Large alliances run corporations with member counts in the thousands. The\n    response passes through schema validation on the way out, so this bound\n    guards against validation cost scaling badly with array length.\n\n    Scenario: Member list of ten thousand IDs\n      Given a large corporation with many members\n      When the client requests member data\n      Then the client shall handle large data sets efficiently","sourceStart":53,"findings":[]},{"id":"0003-corporation#R6","title":"When blueprints are requested for a corporation ID, the Corporations client shall return an array whose entries each carry item_id, type_id, quantity, and location_flag.","line":65,"pattern":"event-driven","exclusion":false,"verdict":"verified","evidence":"","charter":[],"tags":[],"scenarios":[{"title":"Blueprint inventory entries for an authenticated member","line":70,"tags":[]}],"source":"  Rule: When blueprints are requested for a corporation ID, the Corporations client shall return an array whose entries each carry item_id, type_id, quantity, and location_flag.\n    The location_flag distinguishes corporate hangar divisions, which is what\n    lets a caller tell one division's holdings from another's without a\n    separate lookup.\n\n    Scenario: Blueprint inventory entries for an authenticated member\n      Given an authenticated corporation member\n      When the client requests corporation blueprints\n      Then the client shall return corporation inventory","sourceStart":65,"findings":[]},{"id":"0003-corporation#R7","title":"When structures are requested for a corporation ID, the Corporations client shall return an array whose entries each carry structure_id, type_id, system_id, and state.","line":75,"pattern":"event-driven","exclusion":false,"verdict":"verified","evidence":"","charter":[],"tags":[],"scenarios":[{"title":"Structure entries carrying a vulnerability state","line":80,"tags":[]}],"source":"  Rule: When structures are requested for a corporation ID, the Corporations client shall return an array whose entries each carry structure_id, type_id, system_id, and state.\n    The state field drives structure timers, which is the reason most callers\n    poll this endpoint at all. System and type place the structure on the map\n    and identify what it is.\n\n    Scenario: Structure entries carrying a vulnerability state\n      Given an authenticated corporation director for structures\n      When the client requests structures\n      Then the client shall return structure information","sourceStart":75,"findings":[]},{"id":"0003-corporation#R8","title":"When the configuration of a starbase is requested, the Corporations client shall return a record carrying anchor, online, fuel_bay_take, use_alliance_standings, and attack_if_at_war.","line":85,"pattern":"event-driven","exclusion":false,"verdict":"verified","evidence":"","charter":[],"tags":[],"scenarios":[{"title":"Configuration of a tower that fires on war targets","line":91,"tags":[]}],"source":"  Rule: When the configuration of a starbase is requested, the Corporations client shall return a record carrying anchor, online, fuel_bay_take, use_alliance_standings, and attack_if_at_war.\n    A control tower's configuration says who may anchor, online and take fuel\n    from it, and when it opens fire. ESI always sends these settings\n    (CorporationsCorporationIdStarbasesStarbaseIdGet) and sends no state\n    here; the state is on the starbase list.\n\n    Scenario: Configuration of a tower that fires on war targets\n      Given an authenticated director with a starbase\n      When the client requests the starbase configuration\n      Then the client shall return the tower access and defence settings","sourceStart":85,"findings":[]},{"id":"0003-corporation#R9","title":"When medals are requested for a corporation ID, the Corporations client shall return an array whose entries each carry medal_id, title, creator_id, and created_at.","line":98,"pattern":"event-driven","exclusion":false,"verdict":"verified","evidence":"","charter":[],"tags":[],"scenarios":[{"title":"Medal designed by a director","line":102,"tags":[]}],"source":"  Rule: When medals are requested for a corporation ID, the Corporations client shall return an array whose entries each carry medal_id, title, creator_id, and created_at.\n    The medal list describes the decorations a corporation has designed. ESI\n    stamps each with created_at (CorporationsCorporationIdMedalsGet).\n\n    Scenario: Medal designed by a director\n      Given a corporation with a designed medal\n      When the client requests corporation medals\n      Then the client shall return the medal designs","sourceStart":98,"findings":[]},{"id":"0003-corporation#R10","title":"When issued medals are requested for a corporation ID, the Corporations client shall return an array whose entries each carry medal_id, character_id, issuer_id, reason, status, and issued_at.","line":107,"pattern":"event-driven","exclusion":false,"verdict":"verified","evidence":"","charter":[],"tags":[],"scenarios":[{"title":"Medal awarded to a member","line":112,"tags":[]}],"source":"  Rule: When issued medals are requested for a corporation ID, the Corporations client shall return an array whose entries each carry medal_id, character_id, issuer_id, reason, status, and issued_at.\n    An issued medal links a design to the pilot who received it. ESI sends no\n    title or description on it (CorporationsCorporationIdMedalsIssuedGet): a\n    caller joins on medal_id to the medal list for those.\n\n    Scenario: Medal awarded to a member\n      Given a corporation that has awarded a medal\n      When the client requests issued corporation medals\n      Then the client shall return the awards","sourceStart":107,"findings":[]},{"id":"0003-corporation#R11","title":"When the member role history is requested for a corporation ID, the Corporations client shall return an array whose entries each carry character_id, role_type, old_roles, and new_roles.","line":117,"pattern":"event-driven","exclusion":false,"verdict":"verified","evidence":"","charter":[],"tags":[],"scenarios":[{"title":"Station manager role granted to a member","line":123,"tags":[]}],"source":"  Rule: When the member role history is requested for a corporation ID, the Corporations client shall return an array whose entries each carry character_id, role_type, old_roles, and new_roles.\n    The role history is the audit trail of who changed whose roles. Each entry\n    lists the full role set before and after the change\n    (CorporationsCorporationIdRolesHistoryGet), so a caller diffs the two to\n    see what was granted or revoked.\n\n    Scenario: Station manager role granted to a member\n      Given a corporation whose director granted a role\n      When the client requests the member role history\n      Then the client shall return the role change","sourceStart":117,"findings":[]},{"id":"0003-corporation#R12","title":"When a corporation endpoint returns an array of records, the Corporations client shall deliver each entry to the caller with its fields unmodified.","line":128,"pattern":"event-driven","exclusion":false,"verdict":"verified","evidence":"","charter":[],"tags":[],"scenarios":[{"title":"Wallet division records returned by the standings call","line":135,"tags":[]},{"title":"Wallet journal records returned by the standings call","line":140,"tags":[]}],"source":"  Rule: When a corporation endpoint returns an array of records, the Corporations client shall deliver each entry to the caller with its fields unmodified.\n    Zod schemas in this library are loose objects, so fields ESI adds beyond\n    the declared shape survive the round trip rather than being stripped. Both\n    scenarios below drive the standings call and read back record shapes the\n    caller supplied, which is what makes them a check on passthrough rather\n    than on any one endpoint's payload.\n\n    Scenario: Wallet division records returned by the standings call\n      Given an authenticated corporation accountant\n      When the client requests corporation standings returning wallet divisions\n      Then the client shall return wallet divisions\n\n    Scenario: Wallet journal records returned by the standings call\n      Given an authenticated corporation accountant for journal\n      When the client requests corporation standings returning journal entries\n      Then the client shall return transaction history","sourceStart":128,"findings":[]},{"id":"0003-corporation#R13","title":"When public information, members, standings, and structures are requested together, the Corporations client shall resolve all four calls.","line":145,"pattern":"event-driven","exclusion":false,"verdict":"verified","evidence":"","charter":[],"tags":[],"scenarios":[{"title":"Concurrent fetch of profile, members, standings, and structures","line":150,"tags":[]}],"source":"  Rule: When public information, members, standings, and structures are requested together, the Corporations client shall resolve all four calls.\n    Building a corporation dashboard means fanning out across four endpoints\n    at once, three of which are role-gated. A caller issues these as one batch,\n    so they need to be safe to await together.\n\n    Scenario: Concurrent fetch of profile, members, standings, and structures\n      Given a corporation ID for profile assembly\n      When the client gathers complete corporation data\n      Then the client shall successfully retrieve all corporation information","sourceStart":145,"findings":[]},{"id":"0003-corporation#R14","title":"If a corporation request fails, then the Corporations client shall reject with an EsiError.","line":157,"pattern":"unwanted-behaviour","exclusion":false,"verdict":"verified","evidence":"","charter":[],"tags":[],"scenarios":[{"title":"Unknown corporation ID rejects the request","line":163,"tags":[]},{"title":"Missing director role on the member list rejects the request","line":168,"tags":[]},{"title":"Invalid token on the blueprints endpoint rejects the request","line":173,"tags":[]}],"source":"  Rule: If a corporation request fails, then the Corporations client shall reject with an EsiError.\n    One error type across the domain keeps the call site to a single catch.\n    The three scenarios cover the distinct origins that reach this surface: an\n    HTTP 404 for an unknown corporation, an HTTP 403 where the caller holds no\n    director role, and an HTTP 401 where the token is rejected outright.\n\n    Scenario: Unknown corporation ID rejects the request\n      Given an invalid corporation ID\n      When the client requests public information for the invalid corporation\n      Then the client shall return a not found error\n\n    Scenario: Missing director role on the member list rejects the request\n      Given a member without director roles\n      When the client accesses restricted data\n      Then the client shall return a forbidden error\n\n    Scenario: Invalid token on the blueprints endpoint rejects the request\n      Given invalid authentication credentials\n      When the client accesses corporation data\n      Then the client shall return an authentication error","sourceStart":157,"findings":[]}],"noUnwantedBehaviour":false,"orphanScenarios":0},{"file":"tests/bdd/features/core/0004-corporation-projects.feature","area":"core","name":"Corporation Projects Management","tags":["@TEST-10"],"charter":["TEST-10"],"description":"The Corporation Projects client covers the project endpoints a corporation uses to set collective goals and track who worked towards them. It reads the project list, one project in detail, the contributor roll for a project, and a single character's contribution to it. Progress and contribution figures are what consuming applications rank and reward on, so their presence and type are pinned down here.\n\nESI identifies a project by a UUID string, and both lists are cursor paginated: each page is an object holding its entries next to an optional cursor, not a bare array.","boundBy":["tests/bdd/specs/core/0004-corporation-projects.spec.ts"],"rules":[{"id":"0004-corporation-projects#R1","title":"When the project list is requested for a corporation ID, the Corporation Projects client shall return a page whose projects entries each carry id, name, state, last_modified, and progress, and the page cursor when present.","line":16,"pattern":"event-driven","exclusion":false,"verdict":"verified","evidence":"","charter":[],"tags":[],"scenarios":[{"title":"Project list page holding an active project and a completed project","line":23,"tags":[]}],"source":"  Rule: When the project list is requested for a corporation ID, the Corporation Projects client shall return a page whose projects entries each carry id, name, state, last_modified, and progress, and the page cursor when present.\n    The list view is what a corporation dashboard renders. The id is the UUID\n    every other project call takes, state separates active work from finished\n    work, and progress holds the current and desired figures a completion bar\n    is drawn from. The cursor is what a caller passes back to read the next\n    page.\n\n    Scenario: Project list page holding an active project and a completed project\n      Given a corporation with an active project and a completed project\n      When the client requests the corporation project list\n      Then the client shall return both projects with their progress and the page cursor","sourceStart":16,"findings":[]},{"id":"0004-corporation-projects#R2","title":"When one project is requested by corporation ID and project UUID, the Corporation Projects client shall return a record carrying id, name, state, progress, creator, details, and configuration.","line":28,"pattern":"event-driven","exclusion":false,"verdict":"verified","evidence":"","charter":[],"tags":[],"scenarios":[{"title":"Detail record for an active project identified by its UUID","line":34,"tags":[]}],"source":"  Rule: When one project is requested by corporation ID and project UUID, the Corporation Projects client shall return a record carrying id, name, state, progress, creator, details, and configuration.\n    The detail view adds who created the project, its description, career and\n    creation time, and the configuration that says what counts as a\n    contribution, which is what lets a caller explain a project rather than\n    show a bare progress figure.\n\n    Scenario: Detail record for an active project identified by its UUID\n      Given an active corporation project with a manual configuration\n      When the client requests the corporation project details\n      Then the client shall return the project creator, details and configuration","sourceStart":28,"findings":[]},{"id":"0004-corporation-projects#R3","title":"When contributors are requested for a project, the Corporation Projects client shall return a page whose contributors entries each carry a numeric id, a name, and a numeric contributed figure, and the page cursor when present.","line":41,"pattern":"event-driven","exclusion":false,"verdict":"verified","evidence":"","charter":[],"tags":[],"scenarios":[{"title":"Contributor roll for a project with two participants","line":46,"tags":[]}],"source":"  Rule: When contributors are requested for a project, the Corporation Projects client shall return a page whose contributors entries each carry a numeric id, a name, and a numeric contributed figure, and the page cursor when present.\n    The contributor roll is what corporations pay out against, so the\n    contributed figure has to be a number a caller can sum and sort without\n    parsing. The entry order carries no ranking of its own.\n\n    Scenario: Contributor roll for a project with two participants\n      Given a corporation project with two contributors\n      When the client requests the project contributor roll\n      Then the client shall return each contributor with a numeric contributed figure","sourceStart":41,"findings":[]},{"id":"0004-corporation-projects#R4","title":"When the project list or a contributor roll is requested with a cursor token, the Corporation Projects client shall send that token to ESI unchanged in the request query string.","line":51,"pattern":"event-driven","exclusion":false,"verdict":"verified","evidence":"","charter":[],"tags":[],"scenarios":[{"title":"Project list page requested after a cursor token","line":56,"tags":[]},{"title":"Contributor roll page requested after a cursor token","line":61,"tags":[]}],"source":"  Rule: When the project list or a contributor roll is requested with a cursor token, the Corporation Projects client shall send that token to ESI unchanged in the request query string.\n    Cursor tokens are opaque. The client neither parses nor rewrites them; a\n    caller walks forward through a list by passing the after token of one page\n    into the request for the next.\n\n    Scenario: Project list page requested after a cursor token\n      Given a corporation whose project list continues after a cursor token\n      When the client requests the corporation project list after that token\n      Then the request shall carry the cursor token as the after query parameter\n\n    Scenario: Contributor roll page requested after a cursor token\n      Given a corporation project whose contributor roll continues after a cursor token\n      When the client requests the project contributor roll after that token\n      Then the request shall carry the cursor token as the after query parameter","sourceStart":51,"findings":[]},{"id":"0004-corporation-projects#R5","title":"When the contribution of one character to one project is requested, the Corporation Projects client shall return a record carrying the contributed figure, and last_modified when present.","line":66,"pattern":"event-driven","exclusion":false,"verdict":"verified","evidence":"","charter":[],"tags":[],"scenarios":[{"title":"Contribution looked up by character ID","line":72,"tags":[]},{"title":"Contribution with no modification time","line":77,"tags":[]}],"source":"  Rule: When the contribution of one character to one project is requested, the Corporation Projects client shall return a record carrying the contributed figure, and last_modified when present.\n    Fetching a single contributor avoids pulling the whole roll to answer\n    \"what did this member do\", which matters for corporations with large\n    membership. The ESI spec marks the modification time optional, so a\n    record without one is still a valid answer.\n\n    Scenario: Contribution looked up by character ID\n      Given a character who contributed to a corporation project\n      When the client requests the project contribution of that character\n      Then the client shall return the contributed figure and its modification time\n\n    Scenario: Contribution with no modification time\n      Given a project contribution recorded without a modification time\n      When the client requests the project contribution of that character\n      Then the client shall return the contributed figure without a modification time","sourceStart":66,"findings":[]},{"id":"0004-corporation-projects#R6","title":"If a project request fails, then the Corporation Projects client shall reject with an EsiError.","line":84,"pattern":"unwanted-behaviour","exclusion":false,"verdict":"verified","evidence":"","charter":[],"tags":[],"scenarios":[{"title":"Unknown project ID rejects the request","line":90,"tags":[]}],"source":"  Rule: If a project request fails, then the Corporation Projects client shall reject with an EsiError.\n    Projects are created and retired continuously, so a stale project ID is an\n    ordinary occurrence for a caller holding a cached list. Rejecting with the\n    domain error type keeps that case on the same handling path as any other\n    failure.\n\n    Scenario: Unknown project ID rejects the request\n      Given an unknown corporation project ID\n      When the client requests details for the unknown corporation project\n      Then the client shall reject the project request with a not found EsiError","sourceStart":84,"findings":[]}],"noUnwantedBehaviour":false,"orphanScenarios":0},{"file":"tests/bdd/features/core/0005-assets.feature","area":"core","name":"Asset Management","tags":["@TEST-10"],"charter":["TEST-10"],"description":"The Assets client covers the character and corporation inventory endpoints of ESI, plus the two POST lookups that resolve a batch of item IDs to the names their owner gave them and to their coordinates in space. An asset listing carries no names and no positions of its own, so auditing a hangar always means the listing call followed by the two batch lookups.","boundBy":["tests/bdd/step-definitions/core/assets.steps.ts"],"rules":[{"id":"0005-assets#R1","title":"When character assets are requested for a character ID, the Assets client shall return an array whose entries each carry item_id, type_id, quantity, location_id, location_flag, and location_type.","line":11,"pattern":"event-driven","exclusion":false,"verdict":"verified","evidence":"","charter":[],"tags":[],"scenarios":[{"title":"Asset listing for a character holding two stacks","line":17,"tags":[]}],"source":"  Rule: When character assets are requested for a character ID, the Assets client shall return an array whose entries each carry item_id, type_id, quantity, location_id, location_flag, and location_type.\n    An asset row is only interpretable with all six fields: the type says what\n    it is, the quantity how much, and the location triple says where it sits\n    and in which container slot. Missing any one of them forces the caller\n    into a second lookup.\n\n    Scenario: Asset listing for a character holding two stacks\n      Given a valid character ID with assets\n      When the client requests character assets\n      Then the client shall return a list of assets","sourceStart":11,"findings":[]},{"id":"0005-assets#R2","title":"If a character holds no assets, then the Assets client shall return an empty array.","line":22,"pattern":"unwanted-behaviour","exclusion":false,"verdict":"verified","evidence":"","charter":[],"tags":[],"scenarios":[{"title":"Character holding an empty hangar","line":27,"tags":[]}],"source":"  Rule: If a character holds no assets, then the Assets client shall return an empty array.\n    A character with an empty hangar is an ordinary state, not an error.\n    Returning an empty array rather than null keeps the call site free of a\n    special case before iterating.\n\n    Scenario: Character holding an empty hangar\n      Given a character with no assets\n      When the client requests character assets for the empty inventory\n      Then the client shall return an empty array","sourceStart":22,"findings":[]},{"id":"0005-assets#R3","title":"When corporation assets are requested for a corporation ID, the Assets client shall return an array of asset entries carrying the corporate hangar division in location_flag.","line":32,"pattern":"event-driven","exclusion":false,"verdict":"verified","evidence":"","charter":[],"tags":[],"scenarios":[{"title":"Asset listing for a corporation hangar division","line":37,"tags":[]}],"source":"  Rule: When corporation assets are requested for a corporation ID, the Assets client shall return an array of asset entries carrying the corporate hangar division in location_flag.\n    Corporation holdings are split across hangar divisions, and the division\n    is only visible in location_flag. That field is what lets a caller\n    attribute stock to the division that owns it.\n\n    Scenario: Asset listing for a corporation hangar division\n      Given a valid corporation ID with assets\n      When the client requests corporation assets\n      Then the client shall return the corporation asset list","sourceStart":32,"findings":[]},{"id":"0005-assets#R4","title":"When character assets and corporation assets are requested concurrently, the Assets client shall resolve each call with the listing belonging to its own owner.","line":42,"pattern":"event-driven","exclusion":false,"verdict":"verified","evidence":"","charter":[],"tags":[],"scenarios":[{"title":"Character listing and corporation listing fetched at once","line":47,"tags":[]}],"source":"  Rule: When character assets and corporation assets are requested concurrently, the Assets client shall resolve each call with the listing belonging to its own owner.\n    The two listings share an entry shape but not a scope. Awaiting them\n    together is the normal way to build a combined stock view, so neither call\n    may answer the other.\n\n    Scenario: Character listing and corporation listing fetched at once\n      Given a character and their corporation\n      When the client fetches both asset sets concurrently\n      Then the client shall return both results independently","sourceStart":42,"findings":[]},{"id":"0005-assets#R5","title":"When asset names are requested for a list of item IDs, the Assets client shall return one entry per item ID carrying that item_id and its name.","line":54,"pattern":"event-driven","exclusion":false,"verdict":"verified","evidence":"","charter":[],"tags":[],"scenarios":[{"title":"Name lookup for two named items","line":59,"tags":[]}],"source":"  Rule: When asset names are requested for a list of item IDs, the Assets client shall return one entry per item ID carrying that item_id and its name.\n    Player-assigned names live behind a separate POST endpoint because they\n    exist only for named items. Pairing each name back to its item_id is what\n    lets the caller merge the result into the listing it already holds.\n\n    Scenario: Name lookup for two named items\n      Given a character with named assets\n      When the client requests asset names by item IDs\n      Then the client shall return the names for those assets","sourceStart":54,"findings":[]},{"id":"0005-assets#R6","title":"When asset locations are requested for a list of item IDs, the Assets client shall return one entry per item ID carrying that item_id and its position.","line":64,"pattern":"event-driven","exclusion":false,"verdict":"verified","evidence":"","charter":[],"tags":[],"scenarios":[{"title":"Position lookup for one item in space","line":69,"tags":[]}],"source":"  Rule: When asset locations are requested for a list of item IDs, the Assets client shall return one entry per item ID carrying that item_id and its position.\n    Coordinates apply to items in space rather than in a station hangar, so\n    they are a separate batch call. The item_id on each entry is again the\n    join key back to the listing.\n\n    Scenario: Position lookup for one item in space\n      Given a character with located assets\n      When the client requests asset locations by item IDs\n      Then the client shall return position data","sourceStart":64,"findings":[]},{"id":"0005-assets#R7","title":"When an asset listing is followed by name and location lookups for the item IDs it returned, the Assets client shall resolve every call in the sequence.","line":74,"pattern":"event-driven","exclusion":false,"verdict":"verified","evidence":"","charter":[],"tags":[],"scenarios":[{"title":"Listing feeding name and location lookups for its own item IDs","line":79,"tags":[]}],"source":"  Rule: When an asset listing is followed by name and location lookups for the item IDs it returned, the Assets client shall resolve every call in the sequence.\n    This is the full audit path a stock-tracking application runs: list, then\n    enrich. The item IDs feeding the two batch calls come from the listing\n    response itself, so the sequence is ordered rather than a plain fan-out.\n\n    Scenario: Listing feeding name and location lookups for its own item IDs\n      Given a character with assets for audit\n      When the client retrieves assets then look up their names and locations\n      Then the client shall have a complete asset inventory","sourceStart":74,"findings":[]},{"id":"0005-assets#R8","title":"If an asset request is rejected for lack of authorization, then the Assets client shall reject with an EsiError.","line":86,"pattern":"unwanted-behaviour","exclusion":false,"verdict":"verified","evidence":"","charter":[],"tags":[],"scenarios":[{"title":"Expired token on the character assets endpoint rejects the request","line":91,"tags":[]}],"source":"  Rule: If an asset request is rejected for lack of authorization, then the Assets client shall reject with an EsiError.\n    Asset endpoints are token-scoped, and tokens expire mid-session. Surfacing\n    the refusal as the domain error type puts it on the same handling path as\n    any other failure rather than as a silent empty listing.\n\n    Scenario: Expired token on the character assets endpoint rejects the request\n      Given an invalid or expired token for assets\n      When the client requests character assets without authorization\n      Then the client shall return a 403 forbidden error","sourceStart":86,"findings":[]}],"noUnwantedBehaviour":false,"orphanScenarios":0},{"file":"tests/bdd/features/core/0006-calendar.feature","area":"core","name":"Calendar Management","tags":["@TEST-10"],"charter":["TEST-10"],"description":"The Calendar client covers the in-game event calendar: the list of a character's upcoming events, the detail record for one event, the attendee roll with each attendee's answer, and the call that submits the character's own answer. Everything here is token-scoped to a single character, and the response value is the one piece of state this domain writes rather than reads.","boundBy":["tests/bdd/step-definitions/core/calendar.steps.ts"],"rules":[{"id":"0006-calendar#R1","title":"When calendar events are requested for a character ID, the Calendar client shall return an array whose entries each carry event_id, title, event_date, event_response, and importance when present.","line":12,"pattern":"event-driven","exclusion":false,"verdict":"verified","evidence":"","charter":[],"tags":[],"scenarios":[{"title":"Event list holding an accepted event and an unanswered event","line":19,"tags":[]}],"source":"  Rule: When calendar events are requested for a character ID, the Calendar client shall return an array whose entries each carry event_id, title, event_date, event_response, and importance when present.\n    The list view is what a calendar surface renders. The event_response on\n    each entry is what marks an invitation as still needing an answer, and\n    importance is what separates a routine event from one a corporation flags\n    as mandatory. ESI marks every field of an entry optional\n    (CharactersCharacterIdCalendarGet).\n\n    Scenario: Event list holding an accepted event and an unanswered event\n      Given a character with upcoming events\n      When the client requests calendar events\n      Then the client shall return a list of events","sourceStart":12,"findings":[]},{"id":"0006-calendar#R2","title":"If a character has no upcoming events, then the Calendar client shall return an empty array.","line":24,"pattern":"unwanted-behaviour","exclusion":false,"verdict":"verified","evidence":"","charter":[],"tags":[],"scenarios":[{"title":"Character with an empty calendar","line":29,"tags":[]}],"source":"  Rule: If a character has no upcoming events, then the Calendar client shall return an empty array.\n    An empty calendar is an ordinary state, not an error. Returning an empty\n    array rather than null keeps the call site free of a special case before\n    iterating.\n\n    Scenario: Character with an empty calendar\n      Given a character with no upcoming events\n      When the client requests calendar events for the empty calendar\n      Then the client shall return an empty array","sourceStart":24,"findings":[]},{"id":"0006-calendar#R3","title":"When one event is requested by character ID and event ID, the Calendar client shall return a record carrying event_id, title, text, duration, owner_id, and owner_type.","line":34,"pattern":"event-driven","exclusion":false,"verdict":"verified","evidence":"","charter":[],"tags":[],"scenarios":[{"title":"Detail record for a corporation-owned fleet operation","line":40,"tags":[]}],"source":"  Rule: When one event is requested by character ID and event ID, the Calendar client shall return a record carrying event_id, title, text, duration, owner_id, and owner_type.\n    The detail record adds the event body and its duration over the list view,\n    along with the owner that issued it. The owner_type distinguishes a\n    corporation-issued event from an alliance or character one, which is what\n    decides how a caller attributes it.\n\n    Scenario: Detail record for a corporation-owned fleet operation\n      Given a valid event ID\n      When the client requests event details\n      Then the client shall return complete event information","sourceStart":34,"findings":[]},{"id":"0006-calendar#R4","title":"When the attendee list is requested for an event, the Calendar client shall return an array whose entries each carry character_id and event_response when present.","line":45,"pattern":"event-driven","exclusion":false,"verdict":"verified","evidence":"","charter":[],"tags":[],"scenarios":[{"title":"Attendee list spanning accepted, tentative, and declined responses","line":50,"tags":[]}],"source":"  Rule: When the attendee list is requested for an event, the Calendar client shall return an array whose entries each carry character_id and event_response when present.\n    The attendee roll is how an event owner counts who is coming. Each answer\n    is one of the response values, so the pair of who and what answer is the\n    whole content of an entry.\n\n    Scenario: Attendee list spanning accepted, tentative, and declined responses\n      Given an event with attendees\n      When the client requests the attendee list\n      Then the client shall return attendees with their response statuses","sourceStart":45,"findings":[]},{"id":"0006-calendar#R5","title":"When an invitation response is submitted, the Calendar client shall pass the character ID, the event ID, and the response value through to the response call unchanged.","line":57,"pattern":"event-driven","exclusion":false,"verdict":"verified","evidence":"","charter":[],"tags":[],"scenarios":[{"title":"Accepting an invitation","line":63,"tags":[]},{"title":"Declining an invitation","line":68,"tags":[]}],"source":"  Rule: When an invitation response is submitted, the Calendar client shall pass the character ID, the event ID, and the response value through to the response call unchanged.\n    This is the one write in the domain, and it carries no response body — the\n    only observable is what was sent. The two scenarios below cover the two\n    answers a caller sends most, which travel the same path and differ only in\n    the value forwarded.\n\n    Scenario: Accepting an invitation\n      Given a pending event invitation to accept\n      When the client accepts the event\n      Then the acceptance response shall be recorded successfully\n\n    Scenario: Declining an invitation\n      Given a pending event invitation to decline\n      When the client declines the event\n      Then the decline response shall be recorded","sourceStart":57,"findings":[]},{"id":"0006-calendar#R6","title":"When an event detail read is followed by a response submission and an attendee read, the Calendar client shall resolve every call in the sequence.","line":73,"pattern":"event-driven","exclusion":false,"verdict":"verified","evidence":"","charter":[],"tags":[],"scenarios":[{"title":"Detail read, response, and attendee read for one event","line":79,"tags":[]}],"source":"  Rule: When an event detail read is followed by a response submission and an attendee read, the Calendar client shall resolve every call in the sequence.\n    This is the ordinary path through the domain: look at what was invited,\n    answer it, then see who else is coming. The calls are ordered rather than\n    concurrent because the attendee read is meant to observe the state after\n    the answer.\n\n    Scenario: Detail read, response, and attendee read for one event\n      Given an upcoming event for lifecycle test\n      When the client views details then respond and check attendees\n      Then the client shall complete the full event interaction","sourceStart":73,"findings":[]},{"id":"0006-calendar#R7","title":"If a calendar request fails, then the Calendar client shall reject with an EsiError.","line":86,"pattern":"unwanted-behaviour","exclusion":false,"verdict":"verified","evidence":"","charter":[],"tags":[],"scenarios":[{"title":"Expired token on the events endpoint rejects the request","line":92,"tags":[]},{"title":"Unknown event ID rejects the request","line":97,"tags":[]}],"source":"  Rule: If a calendar request fails, then the Calendar client shall reject with an EsiError.\n    One error type across the domain keeps the call site to a single catch.\n    The two scenarios cover the distinct origins that reach this surface: an\n    HTTP 403 where the token no longer carries the calendar scope, and an HTTP\n    404 for an event that has been removed.\n\n    Scenario: Expired token on the events endpoint rejects the request\n      Given an invalid or expired token for calendar\n      When the client requests calendar events without authorization\n      Then the client shall return a 403 forbidden error\n\n    Scenario: Unknown event ID rejects the request\n      Given an invalid event ID\n      When the client requests event details for the invalid event\n      Then the client shall return a 404 not found error","sourceStart":86,"findings":[]}],"noUnwantedBehaviour":false,"orphanScenarios":0},{"file":"tests/bdd/features/core/0007-clones.feature","area":"core","name":"Clone Management","tags":["@TEST-10"],"charter":["TEST-10"],"description":"The Clones client covers the two token-scoped endpoints describing where a character can wake up and what is plugged into their head: the clone record, which holds the home station and the jump clones with the implants installed in each, and the implant endpoint, which lists the implants active in the body the character is flying right now. The two are separate reads because they answer different questions, and a caller assembling a clone sheet needs both.","boundBy":["tests/bdd/specs/core/0007-clones.spec.ts"],"rules":[{"id":"0007-clones#R1","title":"When clone information is requested for a character ID, the Clones client shall return a record carrying one entry per jump clone, and the home location when present.","line":13,"pattern":"event-driven","exclusion":false,"verdict":"verified","evidence":"","charter":[],"tags":[],"scenarios":[{"title":"Clone record with a home station and two jump clones","line":18,"tags":[]}],"source":"  Rule: When clone information is requested for a character ID, the Clones client shall return a record carrying one entry per jump clone, and the home location when present.\n    The home location is where a pod death returns the character, and the jump\n    clone entries are the alternative bodies they can jump to. Both are needed\n    before a caller can show where a character is able to end up.\n\n    Scenario: Clone record with a home station and two jump clones\n      Given a valid character ID for clones\n      When the client requests clone information\n      Then the client shall return clone details","sourceStart":13,"findings":[]},{"id":"0007-clones#R2","title":"When implants are requested for a character ID, the Clones client shall return an array of numeric implant type IDs.","line":25,"pattern":"event-driven","exclusion":false,"verdict":"verified","evidence":"","charter":[],"tags":[],"scenarios":[{"title":"Implant list for a character wearing five implants","line":31,"tags":[]}],"source":"  Rule: When implants are requested for a character ID, the Clones client shall return an array of numeric implant type IDs.\n    The endpoint returns bare type IDs rather than objects, so a caller wanting\n    names or attribute bonuses joins them against the universe or dogma\n    domain. Stating the element type here is what makes that join safe to\n    write.\n\n    Scenario: Implant list for a character wearing five implants\n      Given a valid character ID for implants\n      When the client requests implant information\n      Then the client shall return a list of implant type IDs","sourceStart":25,"findings":[]},{"id":"0007-clones#R3","title":"If a character has no active implants, then the Clones client shall return an empty array.","line":36,"pattern":"unwanted-behaviour","exclusion":false,"verdict":"verified","evidence":"","charter":[],"tags":[],"scenarios":[{"title":"Character wearing no implants","line":41,"tags":[]}],"source":"  Rule: If a character has no active implants, then the Clones client shall return an empty array.\n    An empty head is an ordinary state — a character who has just been podded\n    has no implants at all. Returning an empty array rather than null keeps\n    the call site free of a special case.\n\n    Scenario: Character wearing no implants\n      Given a character with no active implants\n      When the client requests implant information for the character\n      Then the client shall return an empty array for implants","sourceStart":36,"findings":[]},{"id":"0007-clones#R4","title":"When clone information and implants are both requested for a character ID, the Clones client shall return the implants stored on each jump clone separately from the implants active in the current body.","line":46,"pattern":"event-driven","exclusion":false,"verdict":"verified","evidence":"","charter":[],"tags":[],"scenarios":[{"title":"Jump clone implants read alongside the active implant set","line":51,"tags":[]}],"source":"  Rule: When clone information and implants are both requested for a character ID, the Clones client shall return the implants stored on each jump clone separately from the implants active in the current body.\n    These are two distinct sets and confusing them misstates what a character\n    is actually flying with. The clone record lists what sits waiting in each\n    stored body; the implant endpoint lists what is plugged in now.\n\n    Scenario: Jump clone implants read alongside the active implant set\n      Given a character with clones\n      When the client retrieves clone info and implants\n      Then the client shall have complete clone data","sourceStart":46,"findings":[]},{"id":"0007-clones#R5","title":"If a clone request is rejected, then the C
