when present, carries no before token at the start of the listing.","line":112,"pattern":"event-driven","exclusion":false,"verdict":"verified","evidence":"","charter":[],"tags":[],"scenarios":[{"title":"Following the before token back to page one","line":117,"tags":[]}],"source":"  Rule: When the client supplies a before token, the Freelance Jobs client shall return the preceding page, whose cursor, when present, carries no before token at the start of the listing.\n    Paging backwards from page two lands on page one, and page one has nothing\n    behind it — the absent before token is the end-of-listing marker in that\n    direction.\n\n    Scenario: Following the before token back to page one\n      Given a second page with a before cursor\n      When the client requests the previous page using the before token\n      Then the client shall return the first page of results","sourceStart":112,"findings":[]},{"id":"0015-freelance-jobs#R10","title":"If a freelance job request is answered with HTTP 404 or HTTP 403, then the Freelance Jobs client shall reject with an EsiError.","line":124,"pattern":"unwanted-behaviour","exclusion":false,"verdict":"verified","evidence":"","charter":[],"tags":[],"scenarios":[{"title":"Unknown job ID","line":130,"tags":[]},{"title":"Character jobs with an invalid token","line":135,"tags":[]}],"source":"  Rule: If a freelance job request is answered with HTTP 404 or HTTP 403, then the Freelance Jobs client shall reject with an EsiError.\n    Jobs expire and are removed, so an ID held from an earlier listing can miss\n    with a 404; the authenticated owner views refuse a wrong-scope token with a\n    403. Both arrive as the same typed rejection, so callers branch on error\n    class rather than on message text.\n\n    Scenario: Unknown job ID\n      Given an invalid job ID\n      When the client requests details for the invalid job\n      Then the client shall return a 404 error for the job\n\n    Scenario: Character jobs with an invalid token\n      Given an invalid token for freelance jobs\n      When the client requests character freelance jobs with invalid token\n      Then the client shall return a 403 forbidden error for freelance jobs","sourceStart":124,"findings":[]}],"noUnwantedBehaviour":false,"orphanScenarios":0},{"file":"tests/bdd/features/core/0016-incursions.feature","area":"core","name":"Incursion Management","tags":["@TEST-10"],"charter":["TEST-10"],"description":"An incursion is a Sansha invasion occupying one constellation at a time. ESI publishes a single unauthenticated endpoint listing every active incursion, and the Incursions client wraps it. Each entry names the constellation and staging system under attack, the systems infested within it, the invading faction, whether the Sansha commander is present, and a progress state that moves from established through mobilizing to withdrawing.\n\nBecause the list is a live snapshot of a game event, both the empty case and server-side failures are ordinary outcomes worth specifying.\n\nRetry, stale-on-error, circuit breaking and request deduplication apply to these calls as to every other; 0050-etag-caching.feature and 0051-resilience.feature specify them once. A failure Rule below states the outcome after they have run, which is why it names every attempt and the absence of a usable cached entry.","boundBy":["tests/bdd/step-definitions/core/incursions.steps.ts"],"rules":[{"id":"0016-incursions#R1","title":"When the client requests the incursion list, the Incursions client shall return each active incursion with its state, influence, boss flag, faction, constellation, staging system, and infested system list.","line":21,"pattern":"event-driven","exclusion":false,"verdict":"verified","evidence":"","charter":[],"tags":[],"scenarios":[{"title":"Established and mobilizing incursions side by side","line":28,"tags":[]},{"title":"Withdrawing incursion has zero influence and no boss","line":33,"tags":[]},{"title":"Three concurrent incursions in distinct constellations","line":38,"tags":[]}],"source":"  Rule: When the client requests the incursion list, the Incursions client shall return each active incursion with its state, influence, boss flag, faction, constellation, staging system, and infested system list.\n    Every field in that set drives a decision for a player: state and influence\n    say how far the invasion has progressed, has_boss says whether the final\n    site is up, and the constellation, staging and infested systems say where\n    to go. The three scenarios below exercise the same shape across the\n    lifecycle states and across multiple simultaneous incursions.\n\n    Scenario: Established and mobilizing incursions side by side\n      Given active incursions exist in the universe\n      When the client requests the incursion list\n      Then the client shall return complete incursion details\n\n    Scenario: Withdrawing incursion has zero influence and no boss\n      Given an incursion in the withdrawing state\n      When the client requests the incursion list for withdrawing state\n      Then the incursion shall show zero influence and no boss\n\n    Scenario: Three concurrent incursions in distinct constellations\n      Given multiple incursions in different regions\n      When the client requests the list of multiple incursions\n      Then each shall have unique constellation and staging system IDs","sourceStart":21,"findings":[]},{"id":"0016-incursions#R2","title":"While no incursion is active, the Incursions client shall return an empty array.","line":43,"pattern":"state-driven","exclusion":false,"verdict":"verified","evidence":"","charter":[],"tags":[],"scenarios":[{"title":"No incursion active anywhere","line":48,"tags":[]}],"source":"  Rule: While no incursion is active, the Incursions client shall return an empty array.\n    Quiet periods between spawns are normal. The endpoint answers 200 with an\n    empty list rather than a 404, and the client passes that through, so\n    callers can iterate the result without a null check.\n\n    Scenario: No incursion active anywhere\n      Given no incursions are active in the universe\n      When the client requests the incursion list for empty state\n      Then the client shall return an empty array","sourceStart":43,"findings":[]},{"id":"0016-incursions#R3","title":"The Incursions client shall report incursion influence as a value within the inclusive range 0 to 1.","line":53,"pattern":"ubiquitous","exclusion":false,"verdict":"verified","evidence":"","charter":[],"tags":[],"scenarios":[{"title":"Influence at both range endpoints","line":58,"tags":[]}],"source":"  Rule: The Incursions client shall report incursion influence as a value within the inclusive range 0 to 1.\n    Influence is a normalised fraction, not a percentage — a caller multiplying\n    by 100 for display depends on that. The endpoint's own bounds are 0 for a\n    fully suppressed invasion and 1 for an unopposed one.\n\n    Scenario: Influence at both range endpoints\n      Given active incursions with varying influence\n      When the client examines the incursion results\n      Then all influence values shall be between 0 and 1","sourceStart":53,"findings":[]},{"id":"0016-incursions#R4","title":"If every attempt at the incursion list request is answered with HTTP 503 and no usable cached entry exists, then the Incursions client shall reject with an EsiError.","line":65,"pattern":"unwanted-behaviour","exclusion":false,"verdict":"verified","evidence":"","charter":[],"tags":[],"scenarios":[{"title":"ESI answering 503 during downtime","line":70,"tags":[]}],"source":"  Rule: If every attempt at the incursion list request is answered with HTTP 503 and no usable cached entry exists, then the Incursions client shall reject with an EsiError.\n    ESI returns 503 through the daily downtime window and during Sansha event\n    reloads. Surfacing it as a typed rejection lets a polling caller back off\n    rather than treat the outage as \"no incursions\".\n\n    Scenario: ESI answering 503 during downtime\n      Given the ESI service is experiencing downtime\n      When the client requests incursions during downtime\n      Then the client shall return a 503 service unavailable error","sourceStart":65,"findings":[]},{"id":"0016-incursions#R5","title":"If the incursion list request is answered with HTTP 500 and no usable cached entry exists, then the Incursions client shall reject with an EsiError whose statusCode is 500 and whose isServerError predicate returns true.","line":75,"pattern":"unwanted-behaviour","exclusion":false,"verdict":"verified","evidence":"","charter":[],"tags":[],"scenarios":[{"title":"ESI answering 500","line":81,"tags":[]}],"source":"  Rule: If the incursion list request is answered with HTTP 500 and no usable cached entry exists, then the Incursions client shall reject with an EsiError whose statusCode is 500 and whose isServerError predicate returns true.\n    The isServerError predicate lets a caller classify a failure as the\n    server's fault without hard-coding status code ranges. It is not what the\n    client's own retry strategy consults: that reads EsiError.retryable, which\n    excludes 500, so a 500 is rejected after a single request.\n\n    Scenario: ESI answering 500\n      Given an internal server error occurs\n      When the client requests incursions and a server error happens\n      Then the error shall indicate a server-side issue","sourceStart":75,"findings":[]}],"noUnwantedBehaviour":false,"orphanScenarios":0},{"file":"tests/bdd/features/core/0017-industry.feature","area":"core","name":"Industry Management","tags":["@TEST-10"],"charter":["TEST-10"],"description":"Industry in EVE spans manufacturing, research, invention and mining, and ESI splits that across several endpoints. The Industry client covers all of them: the job queues of a character and of a corporation, the public facility list and per-system cost indices that determine what a job costs to install, and the mining ledgers — a character's own extraction history and a corporation's structure-mounted mining observers.\n\nThe job and ledger endpoints are authenticated, and the corporation ones additionally require an in-game role, so refusal is a specified outcome.","boundBy":["tests/bdd/step-definitions/core/industry.steps.ts"],"rules":[{"id":"0017-industry#R1","title":"When the client requests the industry jobs of a character, the Industry client shall return one entry per job carrying job_id, activity_id, status, blueprint_type_id, runs, start_date, and end_date.","line":15,"pattern":"event-driven","exclusion":false,"verdict":"verified","evidence":"","charter":[],"tags":[],"scenarios":[{"title":"Manufacturing and invention jobs with blueprint and run counts","line":21,"tags":[]}],"source":"  Rule: When the client requests the industry jobs of a character, the Industry client shall return one entry per job carrying job_id, activity_id, status, blueprint_type_id, runs, start_date, and end_date.\n    A job queue entry has to answer \"what is being built, from what, how many,\n    and when does it finish\" without a second lookup. activity_id distinguishes\n    manufacturing from research and invention, and status separates a running\n    job from one already delivered.\n\n    Scenario: Manufacturing and invention jobs with blueprint and run counts\n      Given a character with active industry jobs\n      When the client requests their industry jobs\n      Then the client shall return job details including status and blueprint info","sourceStart":15,"findings":[]},{"id":"0017-industry#R2","title":"While a character has no industry jobs, the Industry client shall return an empty array.","line":26,"pattern":"state-driven","exclusion":false,"verdict":"verified","evidence":"","charter":[],"tags":[],"scenarios":[{"title":"Character with no jobs installed","line":31,"tags":[]}],"source":"  Rule: While a character has no industry jobs, the Industry client shall return an empty array.\n    An idle industrialist is an ordinary state rather than an error, so the\n    endpoint answers with a zero-length list and the caller can iterate\n    unconditionally.\n\n    Scenario: Character with no jobs installed\n      Given a character with no industry jobs\n      When the client requests their industry jobs\n      Then the client shall return an empty array","sourceStart":26,"findings":[]},{"id":"0017-industry#R3","title":"When the client requests the industry jobs of a corporation, the Industry client shall return every member's job carrying installer_id, facility_id, and location_id.","line":36,"pattern":"event-driven","exclusion":false,"verdict":"verified","evidence":"","charter":[],"tags":[],"scenarios":[{"title":"Corporation jobs across three installers","line":42,"tags":[]}],"source":"  Rule: When the client requests the industry jobs of a corporation, the Industry client shall return every member's job carrying installer_id, facility_id, and location_id.\n    The corporation view is the union of its members' queues, so an entry is\n    only actionable if it says who installed it and where. ESI places a\n    corporation job by location_id (CorporationsCorporationIdIndustryJobsGet),\n    where the character view uses station_id.\n\n    Scenario: Corporation jobs across three installers\n      Given a corporation with running industry jobs\n      When the client requests the corporation industry jobs\n      Then the client shall return the full list of corporation jobs","sourceStart":36,"findings":[]},{"id":"0017-industry#R4","title":"When the client requests industry facilities, the Industry client shall return each facility with its owner, region, solar system, and type, and its tax rate when present.","line":49,"pattern":"event-driven","exclusion":false,"verdict":"verified","evidence":"","charter":[],"tags":[],"scenarios":[{"title":"Facilities report their owner, location, and tax","line":54,"tags":[]}],"source":"  Rule: When the client requests industry facilities, the Industry client shall return each facility with its owner, region, solar system, and type, and its tax rate when present.\n    Choosing where to install a job is a cost decision, and tax is half of it.\n    The location fields let a caller filter to reachable space before comparing\n    rates.\n\n    Scenario: Facilities report their owner, location, and tax\n      Given industry facilities exist in the universe\n      When the client requests the facility list\n      Then the client shall return facilities with location and tax info","sourceStart":49,"findings":[]},{"id":"0017-industry#R5","title":"When the client requests industry systems, the Industry client shall return each solar system with a cost index per industrial activity.","line":59,"pattern":"event-driven","exclusion":false,"verdict":"verified","evidence":"","charter":[],"tags":[],"scenarios":[{"title":"Cost indices per activity for two systems","line":65,"tags":[]}],"source":"  Rule: When the client requests industry systems, the Industry client shall return each solar system with a cost index per industrial activity.\n    The system cost index is the other half of installation cost, and it is\n    per-activity — manufacturing, the two research lines, copying and invention\n    each carry their own index, and a system may publish indices for only some\n    of them.\n\n    Scenario: Cost indices per activity for two systems\n      Given solar systems with industry activity\n      When the client requests system indices\n      Then the client shall return cost index data per activity","sourceStart":59,"findings":[]},{"id":"0017-industry#R6","title":"When the client requests the mining ledger of a character, the Industry client shall return one entry per date, solar system, and ore type carrying the quantity extracted.","line":72,"pattern":"event-driven","exclusion":false,"verdict":"verified","evidence":"","charter":[],"tags":[],"scenarios":[{"title":"Two days of ore mined across two systems","line":77,"tags":[]}],"source":"  Rule: When the client requests the mining ledger of a character, the Industry client shall return one entry per date, solar system, and ore type carrying the quantity extracted.\n    The ledger is pre-aggregated by day rather than per mining cycle, so the\n    date, system and ore type together form the key of each row. That is what\n    lets a caller total a week's yield without deduplication.\n\n    Scenario: Two days of ore mined across two systems\n      Given a character who has been mining\n      When the client requests their mining ledger\n      Then the client shall return daily ore quantities","sourceStart":72,"findings":[]},{"id":"0017-industry#R7","title":"When the client requests the mining observers of a corporation, the Industry client shall return each observer with its identifier, type, and last updated timestamp.","line":82,"pattern":"event-driven","exclusion":false,"verdict":"verified","evidence":"","charter":[],"tags":[],"scenarios":[{"title":"Structure observers with last update times","line":87,"tags":[]}],"source":"  Rule: When the client requests the mining observers of a corporation, the Industry client shall return each observer with its identifier, type, and last updated timestamp.\n    An observer is a mining structure that records what is extracted at it. The\n    list is an index — identifier plus freshness — and the observer ID is the\n    handle for the per-observer detail call below.\n\n    Scenario: Structure observers with last update times\n      Given a corporation with mining observers\n      When the client requests the observer list\n      Then the client shall return observer details","sourceStart":82,"findings":[]},{"id":"0017-industry#R8","title":"When the client requests one mining observer, the Industry client shall return per-character entries carrying the recorded corporation, ore type, quantity, and last updated timestamp.","line":92,"pattern":"event-driven","exclusion":false,"verdict":"verified","evidence":"","charter":[],"tags":[],"scenarios":[{"title":"Observer breaks mining down per character","line":97,"tags":[]}],"source":"  Rule: When the client requests one mining observer, the Industry client shall return per-character entries carrying the recorded corporation, ore type, quantity, and last updated timestamp.\n    This is the payout ledger for a corporation-owned refinery: who mined what\n    at that structure. recorded_corporation_id is held per entry because a\n    pilot's corporation at the time of extraction is what determines the split.\n\n    Scenario: Observer breaks mining down per character\n      Given a valid mining observer\n      When the client requests the observer activity\n      Then the client shall return character mining entries","sourceStart":92,"findings":[]},{"id":"0017-industry#R9","title":"When character jobs, facilities, and system indices are requested together in one Promise.all, the Industry client shall resolve each request with its own response.","line":104,"pattern":"event-driven","exclusion":false,"verdict":"verified","evidence":"","charter":[],"tags":[],"scenarios":[{"title":"Jobs, facilities, and systems fetched in parallel","line":109,"tags":[]}],"source":"  Rule: When character jobs, facilities, and system indices are requested together in one Promise.all, the Industry client shall resolve each request with its own response.\n    An industry planner needs the queue and both cost inputs at once, and the\n    three reads are independent. The client keeps no per-instance request state\n    that concurrent calls could corrupt.\n\n    Scenario: Jobs, facilities, and systems fetched in parallel\n      Given an authenticated character for concurrent industry fetch\n      When the client fetches industry jobs, facilities, and systems in parallel\n      Then all three industry requests shall resolve successfully","sourceStart":104,"findings":[]},{"id":"0017-industry#R10","title":"If an authenticated industry request is answered with HTTP 403, then the Industry client shall reject with an EsiError.","line":116,"pattern":"unwanted-behaviour","exclusion":false,"verdict":"verified","evidence":"","charter":[],"tags":[],"scenarios":[{"title":"Character industry jobs with an expired token","line":122,"tags":[]},{"title":"Mining observers without the required corporation role","line":127,"tags":[]}],"source":"  Rule: If an authenticated industry request is answered with HTTP 403, then the Industry client shall reject with an EsiError.\n    Character job access needs a scope; corporation mining data needs a scope\n    and an in-game director role. ESI refuses both with 403, and the client\n    turns both into the same typed rejection so callers branch on error class\n    rather than on message text.\n\n    Scenario: Character industry jobs with an expired token\n      Given an invalid or expired token\n      When the client requests character industry jobs\n      Then the client shall return a 403 forbidden error for industry jobs\n\n    Scenario: Mining observers without the required corporation role\n      Given insufficient corporation roles\n      When the client requests mining observers\n      Then the client shall return a 403 forbidden error for mining observers","sourceStart":116,"findings":[]}],"noUnwantedBehaviour":false,"orphanScenarios":0},{"file":"tests/bdd/features/core/0018-insurance.feature","area":"core","name":"Insurance Management","tags":["@TEST-10"],"charter":["TEST-10"],"description":"Ship insurance in EVE is a fixed tariff table rather than a per-pilot policy: for every insurable hull the game publishes six levels, each a premium to pay now and a payout on loss. The Insurance client wraps the single unauthenticated endpoint that serves that table for every ship type at once.\n\nBecause the response is one large static-ish document, its internal shape — tier count, tier ordering, and the payout-over-cost invariant — is as much part of the contract as the transport behaviour around it.\n\nRetry, stale-on-error, circuit breaking and request deduplication apply to these calls as to every other; 0050-etag-caching.feature and 0051-resilience.feature specify them once. A failure Rule below states the outcome after they have run, which is why it names every attempt and the absence of a usable cached entry.","boundBy":["tests/bdd/specs/core/0018-insurance.spec.ts"],"rules":[{"id":"0018-insurance#R1","title":"When the client requests insurance prices, the Insurance client shall return one entry per insurable ship type carrying a levels list of cost, name, and payout.","line":20,"pattern":"event-driven","exclusion":false,"verdict":"verified","evidence":"","charter":[],"tags":[],"scenarios":[{"title":"Frigate and battleship prices with their level lists","line":25,"tags":[]}],"source":"  Rule: When the client requests insurance prices, the Insurance client shall return one entry per insurable ship type carrying a levels list of cost, name, and payout.\n    Insurance is quoted per hull type, so type_id is the join key back to the\n    rest of the type data. The three fields on a level are the whole of the\n    offer: what it costs, what it is called in the client UI, and what it pays.\n\n    Scenario: Frigate and battleship prices with their level lists\n      Given the insurance system is operational\n      When the client requests insurance prices\n      Then the client shall return pricing data for available ship types","sourceStart":20,"findings":[]},{"id":"0018-insurance#R2","title":"The Insurance client shall return exactly six insurance levels per ship type, named Basic, Standard, Bronze, Silver, Gold, and Platinum in that order.","line":32,"pattern":"ubiquitous","exclusion":false,"verdict":"verified","evidence":"","charter":[],"tags":[],"scenarios":[{"title":"Six named tiers per ship type","line":37,"tags":[]}],"source":"  Rule: The Insurance client shall return exactly six insurance levels per ship type, named Basic, Standard, Bronze, Silver, Gold, and Platinum in that order.\n    The six-tier ladder is fixed game design, identical for every hull, and the\n    names are what players recognise. Callers index the ladder positionally, so\n    both the count and the order are load-bearing.\n\n    Scenario: Six named tiers per ship type\n      Given insurance prices are available for tier count verification\n      When the client inspects each ship type\n      Then every entry shall contain six named tiers","sourceStart":32,"findings":[]},{"id":"0018-insurance#R3","title":"The Insurance client shall return insurance levels ordered so that each level's cost and payout exceed those of the level before it.","line":42,"pattern":"ubiquitous","exclusion":false,"verdict":"verified","evidence":"","charter":[],"tags":[],"scenarios":[{"title":"Costs and payouts rise with each tier","line":47,"tags":[]}],"source":"  Rule: The Insurance client shall return insurance levels ordered so that each level's cost and payout exceed those of the level before it.\n    The ladder is monotonic in both columns: paying more up front always buys a\n    larger payout. That is what makes \"the next tier up\" a meaningful phrase in\n    a UI built on positional indexing.\n\n    Scenario: Costs and payouts rise with each tier\n      Given insurance prices are available for tier verification\n      When the client examines the tiers for a ship type\n      Then higher tiers shall have increasing costs and payouts","sourceStart":42,"findings":[]},{"id":"0018-insurance#R4","title":"The Insurance client shall return a payout greater than the cost for every insurance level.","line":52,"pattern":"ubiquitous","exclusion":false,"verdict":"verified","evidence":"","charter":[],"tags":[],"scenarios":[{"title":"Payout exceeds cost at every tier","line":58,"tags":[]}],"source":"  Rule: The Insurance client shall return a payout greater than the cost for every insurance level.\n    An insurance level that paid out less than its premium would never be worth\n    buying, and no such level exists in the game data. Holding the invariant\n    here catches a malformed or mis-parsed response before a caller uses it for\n    loss calculations.\n\n    Scenario: Payout exceeds cost at every tier\n      Given insurance prices are available for payout verification\n      When the client checks each tier\n      Then the payout shall always be greater than the cost","sourceStart":52,"findings":[]},{"id":"0018-insurance#R5","title":"When an insurance price response covers 500 ship types, the Insurance client shall resolve the complete set within 1000 milliseconds.","line":65,"pattern":"event-driven","exclusion":false,"verdict":"verified","evidence":"","charter":[],"tags":[],"scenarios":[{"title":"Five hundred ship types in one response","line":70,"tags":[]}],"source":"  Rule: When an insurance price response covers 500 ship types, the Insurance client shall resolve the complete set within 1000 milliseconds.\n    The live endpoint returns the whole tariff table in one document — hundreds\n    of hulls, six levels each. This bound exists so the parsing and validation\n    path stays linear and does not quietly acquire per-element overhead.\n\n    Scenario: Five hundred ship types in one response\n      Given a large insurance dataset covering many ship types\n      When the client processes the large insurance response\n      Then the client shall handle the large insurance response efficiently","sourceStart":65,"findings":[]},{"id":"0018-insurance#R6","title":"If every attempt at an insurance price request is answered with HTTP 503 or HTTP 429 and no usable cached entry exists, then the Insurance client shall reject with an EsiError.","line":77,"pattern":"unwanted-behaviour","exclusion":false,"verdict":"verified","evidence":"","charter":[],"tags":[],"scenarios":[{"title":"ESI answering 503","line":86,"tags":[]},{"title":"ESI answering 429 after the error limit","line":91,"tags":[]}],"source":"  Rule: If every attempt at an insurance price request is answered with HTTP 503 or HTTP 429 and no usable cached entry exists, then the Insurance client shall reject with an EsiError.\n    503 covers the daily downtime window; 429 is ESI's answer once the caller\n    has burned through its error budget. Both arrive as the same typed\n    rejection, so a retry policy can inspect the status code on one error class\n    instead of unwrapping two. Both statuses are retried first. After a 429 a\n    default client's rate limiter also blocks the group for the Retry-After\n    period, or 60 seconds, before each retry, so the rejection arrives only\n    minutes later.\n\n    Scenario: ESI answering 503\n      Given the ESI service is temporarily unavailable\n      When the client requests insurance prices expecting an error\n      Then the client shall return a 503 service unavailable error for insurance prices\n\n    Scenario: ESI answering 429 after the error limit\n      Given the API rate limit has been exceeded\n      When the client requests insurance prices expecting rate limit error\n      Then the client shall return a 429 rate limit error","sourceStart":77,"findings":[]}],"noUnwantedBehaviour":false,"orphanScenarios":0},{"file":"tests/bdd/features/core/0019-killmails.feature","area":"core","name":"Killmails Management","tags":["@TEST-10"],"charter":["TEST-10"],"description":"A killmail is EVE's permanent record of a ship loss: who died, in what, where, and every pilot who contributed damage. ESI splits access in two — an authenticated feed of recent kills for a character or corporation that returns only ID and hash pairs, and an unauthenticated detail endpoint that takes that pair and returns the full report.\n\nThat two-step shape is the reason the hash matters: it is the capability token that makes an otherwise public killmail addressable.","boundBy":["tests/bdd/specs/core/0019-killmails.spec.ts"],"rules":[{"id":"0019-killmails#R1","title":"When the client requests the recent killmails of a character or of a corporation, the Killmails client shall return one summary per kill carrying a numeric killmail_id and a string killmail_hash.","line":14,"pattern":"event-driven","exclusion":false,"verdict":"verified","evidence":"","charter":[],"tags":[],"scenarios":[{"title":"Three recent kills for a character","line":21,"tags":[]},{"title":"Five recent kills for a corporation","line":26,"tags":[]}],"source":"  Rule: When the client requests the recent killmails of a character or of a corporation, the Killmails client shall return one summary per kill carrying a numeric killmail_id and a string killmail_hash.\n    The feed is deliberately thin — the pair is a reference, not a report. The\n    types matter because both values are substituted into the detail endpoint's\n    path, and a hash arriving as anything but a string would break that call.\n    The two scenarios cover the character and corporation feeds against the\n    same shape.\n\n    Scenario: Three recent kills for a character\n      Given an authenticated character with killmails\n      When the client requests their recent killmails\n      Then the client shall return a list of killmail summaries\n\n    Scenario: Five recent kills for a corporation\n      Given an authenticated corporation member\n      When the client requests corporation killmails\n      Then the client shall return the corporation kill feed","sourceStart":14,"findings":[]},{"id":"0019-killmails#R2","title":"While a character has no recent killmails, the Killmails client shall return an empty array.","line":31,"pattern":"state-driven","exclusion":false,"verdict":"verified","evidence":"","charter":[],"tags":[],"scenarios":[{"title":"Character with no recent PvP","line":36,"tags":[]}],"source":"  Rule: While a character has no recent killmails, the Killmails client shall return an empty array.\n    A pilot with no recent PvP is an ordinary state, so the feed answers with a\n    zero-length list rather than a 404. Callers can iterate the result without\n    a null check.\n\n    Scenario: Character with no recent PvP\n      Given an authenticated character with no recent PvP activity\n      When the client requests their killmails\n      Then the client shall return an empty killmail list","sourceStart":31,"findings":[]},{"id":"0019-killmails#R3","title":"When the client requests a killmail by identifier and hash, the Killmails client shall return the kill time, solar system, victim record, and attacker list.","line":43,"pattern":"event-driven","exclusion":false,"verdict":"verified","evidence":"","charter":[],"tags":[],"scenarios":[{"title":"Full kill report with victim and attackers","line":48,"tags":[]}],"source":"  Rule: When the client requests a killmail by identifier and hash, the Killmails client shall return the kill time, solar system, victim record, and attacker list.\n    This is the full report. The victim record carries the hull lost and the\n    fitted items destroyed or dropped; the attacker list carries everyone who\n    landed damage. Together they are what a killboard renders from one call.\n\n    Scenario: Full kill report with victim and attackers\n      Given a valid killmail ID and hash\n      When the client requests the killmail details\n      Then the client shall return the complete kill report","sourceStart":43,"findings":[]},{"id":"0019-killmails#R4","title":"When a killmail summary is used to fetch its detail, the Killmails client shall return a detail record whose killmail_id matches the summary it came from.","line":53,"pattern":"event-driven","exclusion":false,"verdict":"verified","evidence":"","charter":[],"tags":[],"scenarios":[{"title":"Summary hash feeds the detail lookup","line":59,"tags":[]}],"source":"  Rule: When a killmail summary is used to fetch its detail, the Killmails client shall return a detail record whose killmail_id matches the summary it came from.\n    The feed-then-detail chain is the normal way to consume this domain, and it\n    only works if the identifier survives the round trip. This is the seam\n    where a caller would otherwise have to trust that the hash and the ID\n    belong together.\n\n    Scenario: Summary hash feeds the detail lookup\n      Given a character with recent killmails for chaining\n      When the client fetches summaries and then look up details for the first kill\n      Then the client shall return the full kill chain","sourceStart":53,"findings":[]},{"id":"0019-killmails#R5","title":"When a killmail names multiple attackers, the Killmails client shall return each attacker with its damage_done and final_blow flag.","line":64,"pattern":"event-driven","exclusion":false,"verdict":"verified","evidence":"","charter":[],"tags":[],"scenarios":[{"title":"Final blow and damage totals across three attackers","line":70,"tags":[]}],"source":"  Rule: When a killmail names multiple attackers, the Killmails client shall return each attacker with its damage_done and final_blow flag.\n    Damage attribution is what killboards rank on, and the final blow is a\n    separate distinction from top damage — the scenario below has them held by\n    different pilots on purpose. Per-attacker damage summing to the victim's\n    damage_taken is what makes the report internally consistent.\n\n    Scenario: Final blow and damage totals across three attackers\n      Given a killmail with multiple attackers\n      When the client analyzes the attackers\n      Then I shall identify the final blow dealer and total damage","sourceStart":64,"findings":[]},{"id":"0019-killmails#R6","title":"If a killmail request is answered with HTTP 404 or HTTP 403, then the Killmails client shall reject with an EsiError.","line":77,"pattern":"unwanted-behaviour","exclusion":false,"verdict":"verified","evidence":"","charter":[],"tags":[],"scenarios":[{"title":"Killmail hash that does not match the ID","line":83,"tags":[]},{"title":"Character killmails without a token","line":88,"tags":[]}],"source":"  Rule: If a killmail request is answered with HTTP 404 or HTTP 403, then the Killmails client shall reject with an EsiError.\n    A hash that does not match its killmail ID is refused with 404 rather than\n    with an authorisation error, since the pair is the capability. The\n    authenticated feeds refuse a missing or wrong-scope token with 403. Both\n    surface as the same typed rejection.\n\n    Scenario: Killmail hash that does not match the ID\n      Given an invalid killmail hash\n      When the client requests the killmail details with invalid hash\n      Then the client shall return a 404 not found error for the killmail\n\n    Scenario: Character killmails without a token\n      Given an unauthenticated killmail request\n      When the client requests character killmails without auth\n      Then the client shall return a 403 forbidden error for killmails","sourceStart":77,"findings":[]}],"noUnwantedBehaviour":false,"orphanScenarios":0},{"file":"tests/bdd/features/core/0020-location.feature","area":"core","name":"Location Management","tags":["@TEST-10"],"charter":["TEST-10"],"description":"The Location client covers the three character-scoped endpoints that describe where a pilot is and what they are doing right now: current location, online status with login history, and the ship currently being flown. They are the most privacy-sensitive reads in ESI, which is why each carries its own scope and why a refusal is as much part of the contract as a success.\n\nThe location record is shape-variable — docked and undocked characters return different field sets — so both states are specified separately below.","boundBy":["tests/bdd/step-definitions/core/location.steps.ts"],"rules":[{"id":"0020-location#R1","title":"When the client requests the location of a docked character, the Location client shall return the solar system identifier together with the station identifier when present.","line":14,"pattern":"event-driven","exclusion":false,"verdict":"verified","evidence":"","charter":[],"tags":[],"scenarios":[{"title":"Character docked in Jita 4-4","line":19,"tags":[]}],"source":"  Rule: When the client requests the location of a docked character, the Location client shall return the solar system identifier together with the station identifier when present.\n    Docked is the case with the most detail available: the station ID pins the\n    character to a specific dockable structure inside the system, which is what\n    an asset or logistics tool needs to route against.\n\n    Scenario: Character docked in Jita 4-4\n      Given an authenticated character docked in a station\n      When the client requests their location\n      Then the client shall return the solar system and station information","sourceStart":14,"findings":[]},{"id":"0020-location#R2","title":"While a character is in space, the Location client shall return the solar system identifier with no station identifier and no structure identifier.","line":24,"pattern":"state-driven","exclusion":false,"verdict":"verified","evidence":"","charter":[],"tags":[],"scenarios":[{"title":"Character undocked in space","line":30,"tags":[]}],"source":"  Rule: While a character is in space, the Location client shall return the solar system identifier with no station identifier and no structure identifier.\n    Undocked, there is nothing finer-grained than the system to report, so both\n    docking fields are absent rather than null or zero. Callers therefore test\n    for presence to decide whether the pilot is docked, and this scenario pins\n    that both fields — station and player-owned structure — stay undefined.\n\n    Scenario: Character undocked in space\n      Given an authenticated character flying in space\n      When the client requests their location while in space\n      Then the client shall return only the solar system with no station","sourceStart":24,"findings":[]},{"id":"0020-location#R3","title":"When the client requests the online status of a character, the Location client shall return the online flag together with the last login timestamp, the last logout timestamp, and the cumulative login count when present.","line":37,"pattern":"event-driven","exclusion":false,"verdict":"verified","evidence":"","charter":[],"tags":[],"scenarios":[{"title":"Online character with login history","line":42,"tags":[]}],"source":"  Rule: When the client requests the online status of a character, the Location client shall return the online flag together with the last login timestamp, the last logout timestamp, and the cumulative login count when present.\n    The flag alone answers \"are they on now\"; the three history fields answer\n    \"when were they last around and how heavily is this character played\",\n    which is what corporation activity tracking is built on.\n\n    Scenario: Online character with login history\n      Given an authenticated character who is currently online\n      When the client checks their online status\n      Then the client shall report they are online with login timestamps","sourceStart":37,"findings":[]},{"id":"0020-location#R4","title":"While a character is logged out, the Location client shall report the online flag as false with a last logout timestamp later than the last login timestamp when both are present.","line":47,"pattern":"state-driven","exclusion":false,"verdict":"verified","evidence":"","charter":[],"tags":[],"scenarios":[{"title":"Offline character logged out after their last login","line":52,"tags":[]}],"source":"  Rule: While a character is logged out, the Location client shall report the online flag as false with a last logout timestamp later than the last login timestamp when both are present.\n    For an offline character the last session has both ends recorded, so logout\n    strictly follows login. That ordering is what lets a caller compute the\n    duration of the last session and the length of the current absence.\n\n    Scenario: Offline character logged out after their last login\n      Given an authenticated character who is currently offline\n      When the client checks their offline status\n      Then the client shall report they are offline","sourceStart":47,"findings":[]},{"id":"0020-location#R5","title":"When the client requests the current ship of a character, the Location client shall return the ship item identifier, the ship name, and the ship type identifier.","line":59,"pattern":"event-driven","exclusion":false,"verdict":"verified","evidence":"","charter":[],"tags":[],"scenarios":[{"title":"Pilot flying a named titan","line":65,"tags":[]}],"source":"  Rule: When the client requests the current ship of a character, the Location client shall return the ship item identifier, the ship name, and the ship type identifier.\n    The item ID identifies this one hull instance, the type ID identifies what\n    class it is, and the name is the pilot's own label for it. All three are\n    needed because two pilots in the same hull type are distinguished only by\n    item ID.\n\n    Scenario: Pilot flying a named titan\n      Given an authenticated character in a ship\n      When the client requests their current ship\n      Then the client shall return the ship details","sourceStart":59,"findings":[]},{"id":"0020-location#R6","title":"When location, online status, and ship are requested together in one Promise.all, the Location client shall resolve each request with its own response.","line":72,"pattern":"event-driven","exclusion":false,"verdict":"verified","evidence":"","charter":[],"tags":[],"scenarios":[{"title":"Location, online status, and ship fetched in parallel","line":77,"tags":[]}],"source":"  Rule: When location, online status, and ship are requested together in one Promise.all, the Location client shall resolve each request with its own response.\n    A presence panel wants all three at once and they are independent reads.\n    The client keeps no per-instance request state that concurrent calls could\n    corrupt, and this scenario holds that property in place.\n\n    Scenario: Location, online status, and ship fetched in parallel\n      Given an authenticated character for concurrent location fetch\n      When the client fetches location, online status, and ship concurrently\n      Then all three location requests shall resolve successfully","sourceStart":72,"findings":[]},{"id":"0020-location#R7","title":"If a character location or online status request is answered with HTTP 403, then the Location client shall reject with an EsiError.","line":84,"pattern":"unwanted-behaviour","exclusion":false,"verdict":"verified","evidence":"","charter":[],"tags":[],"scenarios":[{"title":"Location request without a token","line":90,"tags":[]},{"title":"Online status request without a token","line":95,"tags":[]}],"source":"  Rule: If a character location or online status request is answered with HTTP 403, then the Location client shall reject with an EsiError.\n    Each of these endpoints has its own ESI scope, so a token good enough for\n    one is not automatically good enough for another. Both refusals surface as\n    the same typed rejection, letting callers branch on error class rather than\n    on message text.\n\n    Scenario: Location request without a token\n      Given an unauthenticated location request\n      When the client requests a character location without auth\n      Then the client shall return a 403 forbidden error for location\n\n    Scenario: Online status request without a token\n      Given an unauthenticated online status request\n      When the client requests online status without auth\n      Then the client shall return a 403 forbidden error for online status","sourceStart":84,"findings":[]}],"noUnwantedBehaviour":false,"orphanScenarios":0},{"file":"tests/bdd/features/core/0021-loyalty.feature","area":"core","name":"Loyalty Management","tags":["@TEST-10"],"charter":["TEST-10"],"description":"The Loyalty client covers the two ESI loyalty endpoints: a character's loyalty point balances per NPC corporation, and the store offers an NPC corporation publishes. Between them they let a caller answer \"how much LP do I have and what can I spend it on\", which is why both sides expose the raw numeric costs rather than any pre-computed affordability verdict.\n\nStore offers carry trade-in requirements as well as LP and ISK costs, so the shape of an offer is part of the contract this feature pins down.\n\nRetry, stale-on-error, circuit breaking and request deduplication apply to these calls as to every other; 0050-etag-caching.feature and 0051-resilience.feature specify them once. A failure Rule below states the outcome after they have run, which is why it names every attempt and the absence of a usable cached entry.","boundBy":["tests/bdd/step-definitions/core/loyalty.steps.ts"],"rules":[{"id":"0021-loyalty#R1","title":"When a character's loyalty points are requested, the Loyalty client shall return one entry per corporation carrying a numeric corporation_id and a non-negative numeric loyalty_points balance.","line":20,"pattern":"event-driven","exclusion":false,"verdict":"verified","evidence":"","charter":[],"tags":[],"scenarios":[{"title":"Balances from three corporations are returned with typed fields","line":26,"tags":[]},{"title":"Four returned balances support maximum and total calculations","line":31,"tags":[]}],"source":"  Rule: When a character's loyalty points are requested, the Loyalty client shall return one entry per corporation carrying a numeric corporation_id and a non-negative numeric loyalty_points balance.\n    LP is held separately against each NPC corporation, so the response is a\n    list rather than a single total. Callers derive totals and rankings\n    themselves, which only works if every entry comes back with both fields\n    intact and typed as numbers.\n\n    Scenario: Balances from three corporations are returned with typed fields\n      Given an authenticated character with LP from multiple corporations\n      When the client requests their loyalty points\n      Then the client shall return LP balances per corporation\n\n    Scenario: Four returned balances support maximum and total calculations\n      Given a character with LP across multiple corps\n      When the client analyzes their LP balances\n      Then the client shall find the highest LP balance","sourceStart":20,"findings":[]},{"id":"0021-loyalty#R2","title":"If a character holds no loyalty points with any corporation, then the Loyalty client shall return an empty list.","line":36,"pattern":"unwanted-behaviour","exclusion":false,"verdict":"verified","evidence":"","charter":[],"tags":[],"scenarios":[{"title":"Character who has never run missions returns no balances","line":41,"tags":[]}],"source":"  Rule: If a character holds no loyalty points with any corporation, then the Loyalty client shall return an empty list.\n    A character who has never run missions has no LP rows at all. ESI answers\n    with an empty array rather than an error, and the client passes that\n    through so callers can branch on length instead of catching.\n\n    Scenario: Character who has never run missions returns no balances\n      Given an authenticated character who has never run missions\n      When the client requests their loyalty points expecting none\n      Then the client shall return an empty loyalty points list","sourceStart":36,"findings":[]},{"id":"0021-loyalty#R3","title":"When the loyalty store offers of an NPC corporation are requested, the Loyalty client shall return each offer with its offer_id, type_id, quantity, lp_cost, isk_cost, and required_items fields.","line":48,"pattern":"event-driven","exclusion":false,"verdict":"verified","evidence":"","charter":[],"tags":[],"scenarios":[{"title":"Store catalogue returns offers with LP and ISK costs","line":54,"tags":[]},{"title":"Offers priced above the character balance are excluded by an lp_cost filter","line":59,"tags":[]}],"source":"  Rule: When the loyalty store offers of an NPC corporation are requested, the Loyalty client shall return each offer with its offer_id, type_id, quantity, lp_cost, isk_cost, and required_items fields.\n    An offer is only actionable if the caller can see what is being sold, how\n    many units, and the full price in both LP and ISK. Returning lp_cost as a\n    raw number is what lets a caller filter the catalogue against a known\n    balance without a second round trip.\n\n    Scenario: Store catalogue returns offers with LP and ISK costs\n      Given a valid NPC corporation\n      When the client requests their LP store offers\n      Then the client shall return available items with costs\n\n    Scenario: Offers priced above the character balance are excluded by an lp_cost filter\n      Given a set of store offers and a character LP balance\n      When the client filters by what the character can afford\n      Then the client shall report only the affordable offers","sourceStart":48,"findings":[]},{"id":"0021-loyalty#R4","title":"The Loyalty client shall return each required_items entry of a store offer with a type_id and a quantity.","line":64,"pattern":"ubiquitous","exclusion":false,"verdict":"verified","evidence":"","charter":[],"tags":[],"scenarios":[{"title":"Offer requiring a hull and a mineral lists both trade-in items","line":70,"tags":[]}],"source":"  Rule: The Loyalty client shall return each required_items entry of a store offer with a type_id and a quantity.\n    Certain offers demand trade-in hulls or materials alongside the LP and ISK\n    cost. Without the type and count of each required item a caller cannot\n    tell whether the offer is redeemable, so these entries are preserved\n    verbatim.\n\n    Scenario: Offer requiring a hull and a mineral lists both trade-in items\n      Given store offers that require trade-in items\n      When the client inspects the offers with requirements\n      Then the client shall report the required items and quantities","sourceStart":64,"findings":[]},{"id":"0021-loyalty#R5","title":"If every attempt at a loyalty request is answered with an error status and no usable cached entry exists, then the Loyalty client shall raise an EsiError.","line":77,"pattern":"unwanted-behaviour","exclusion":false,"verdict":"verified","evidence":"","charter":[],"tags":[],"scenarios":[{"title":"Unauthenticated loyalty point request is rejected with 403","line":82,"tags":[]},{"title":"Store offer request fails with an upstream 500","line":87,"tags":[]}],"source":"  Rule: If every attempt at a loyalty request is answered with an error status and no usable cached entry exists, then the Loyalty client shall raise an EsiError.\n    Both loyalty endpoints surface failures the same way, so callers wrap one\n    try/catch around either call. The two scenarios cover the authorisation\n    boundary and the upstream failure boundary.\n\n    Scenario: Unauthenticated loyalty point request is rejected with 403\n      Given an unauthenticated loyalty request\n      When the client requests character loyalty points without auth\n      Then the client shall return a 403 forbidden error for loyalty\n\n    Scenario: Store offer request fails with an upstream 500\n      Given the ESI service encounters an internal error\n      When the client requests store offers expecting error\n      Then the client shall return a 500 server error","sourceStart":77,"findings":[]}],"noUnwantedBehaviour":false,"orphanScenarios":0},{"file":"tests/bdd/features/core/0022-mail.feature","area":"core","name":"Mail Management","tags":["@TEST-10"],"charter":["TEST-10"],"description":"The Mail client wraps the character mail endpoints: reading inbox headers and individual messages, managing labels and mailing-list subscriptions, and the write operations for sending, deleting, and re-labelling mail. It is the one domain in the library with a full create/read/update/delete surface, so both the returned payload shapes and the arguments forwarded to ESI matter.\n\nEvery operation is character-scoped and authenticated, which makes 403 the expected failure for an unauthenticated caller.\n\nRetry, stale-on-error, circuit breaking and request deduplication apply to these calls as to every other; 0050-etag-caching.feature and 0051-resilience.feature specify them once. A failure Rule below states the outcome after they have run, which is why it names every attempt and the absence of a usable cached entry.","boundBy":["tests/bdd/specs/core/0022-mail.spec.ts"],"rules":[{"id":"0022-mail#R1","title":"When the mail headers of a character are requested, the Mail client shall return one summary per message carrying mail_id, from, subject, timestamp, and is_read when present.","line":20,"pattern":"event-driven","exclusion":false,"verdict":"verified","evidence":"","charter":[],"tags":[],"scenarios":[{"title":"Inbox holding three messages returns a summary for each","line":26,"tags":[]}],"source":"  Rule: When the mail headers of a character are requested, the Mail client shall return one summary per message carrying mail_id, from, subject, timestamp, and is_read when present.\n    Headers are the cheap listing view — enough to render an inbox without\n    fetching a body per row. The read flag and timestamp are what let a caller\n    sort and badge the list, so both are part of the summary rather than the\n    full message.\n\n    Scenario: Inbox holding three messages returns a summary for each\n      Given an authenticated character with mail\n      When the client requests their inbox headers\n      Then the client shall return a list of mail summaries","sourceStart":20,"findings":[]},{"id":"0022-mail#R2","title":"If a character's inbox holds no messages, then the Mail client shall return an empty list.","line":31,"pattern":"unwanted-behaviour","exclusion":false,"verdict":"verified","evidence":"","charter":[],"tags":[],"scenarios":[{"title":"Character with no mail returns no summaries","line":36,"tags":[]}],"source":"  Rule: If a character's inbox holds no messages, then the Mail client shall return an empty list.\n    An empty inbox is a normal state, not a failure. ESI answers with an empty\n    array and the client passes it through, so callers branch on length rather\n    than catching.\n\n    Scenario: Character with no mail returns no summaries\n      Given an authenticated character with no mail\n      When the client requests their empty inbox headers\n      Then the client shall return an empty mail list","sourceStart":31,"findings":[]},{"id":"0022-mail#R3","title":"When a single message is requested by mail ID, the Mail client shall return that message with its subject, sender, read flag, and recipient list when present.","line":41,"pattern":"event-driven","exclusion":false,"verdict":"verified","evidence":"","charter":[],"tags":[],"scenarios":[{"title":"Requesting a mail by ID returns its sender and recipients","line":47,"tags":[]}],"source":"  Rule: When a single message is requested by mail ID, the Mail client shall return that message with its subject, sender, read flag, and recipient list when present.\n    The per-message endpoint is where the body appears, and the recipient list\n    tells a caller who else received it. ESI does not echo the mail_id here,\n    and names the read flag `read` rather than the header's `is_read`\n    (CharactersCharacterIdMailMailIdGet).\n\n    Scenario: Requesting a mail by ID returns its sender and recipients\n      Given a character with a specific mail\n      When the client requests the full mail\n      Then the client shall return the complete message with its recipients","sourceStart":41,"findings":[]},{"id":"0022-mail#R4","title":"When the mail labels of a character are requested, the Mail client shall return the label_id, name, and unread_count of each label, and the total unread count, when present.","line":54,"pattern":"event-driven","exclusion":false,"verdict":"verified","evidence":"","charter":[],"tags":[],"scenarios":[{"title":"Four labels are returned with unread counts and an inbox total","line":60,"tags":[]}],"source":"  Rule: When the mail labels of a character are requested, the Mail client shall return the label_id, name, and unread_count of each label, and the total unread count, when present.\n    A label is both a folder and a counter. The aggregate total is reported\n    separately from the per-label counts because a single unread message can\n    carry more than one label, making the per-label counts sum to at least the\n    total rather than exactly it.\n\n    Scenario: Four labels are returned with unread counts and an inbox total\n      Given an authenticated character with mail labels\n      When the client requests their mail labels\n      Then the client shall return labels with unread counts","sourceStart":54,"findings":[]},{"id":"0022-mail#R5","title":"When the mailing list subscriptions of a character are requested, the Mail client shall return each subscription with a numeric mailing_list_id and a string name.","line":65,"pattern":"event-driven","exclusion":false,"verdict":"verified","evidence":"","charter":[],"tags":[],"scenarios":[{"title":"Subscribed mailing lists return numeric IDs and names","line":69,"tags":[]}],"source":"  Rule: When the mailing list subscriptions of a character are requested, the Mail client shall return each subscription with a numeric mailing_list_id and a string name.\n    Mailing lists are addressable as mail recipients, so the numeric ID is the\n    part a caller needs when composing. The name exists only for display.\n\n    Scenario: Subscribed mailing lists return numeric IDs and names\n      Given an authenticated character subscribed to mailing lists\n      When the client requests their mailing lists\n      Then the client shall return the mailing list details","sourceStart":65,"findings":[]},{"id":"0022-mail#R6","title":"When a mail resource is created, the Mail client shall return the numeric identifier that ESI assigns to it.","line":76,"pattern":"event-driven","exclusion":false,"verdict":"verified","evidence":"","charter":[],"tags":[],"scenarios":[{"title":"Created label returns its assigned numeric ID","line":81,"tags":[]},{"title":"Sent mail returns its assigned numeric ID","line":86,"tags":[]}],"source":"  Rule: When a mail resource is created, the Mail client shall return the numeric identifier that ESI assigns to it.\n    Both creating a label and sending a message produce a new server-side\n    resource whose ID the caller has no way to predict. Returning it directly\n    saves a follow-up listing call to find what was created.\n\n    Scenario: Created label returns its assigned numeric ID\n      Given an authenticated character for label creation\n      When the client creates a new mail label\n      Then the client shall return the new label ID\n\n    Scenario: Sent mail returns its assigned numeric ID\n      Given an authenticated character for sending mail\n      When the client sends a mail to another character\n      Then the client shall return the new mail ID","sourceStart":76,"findings":[]},{"id":"0022-mail#R7","title":"When a mail deletion, a label deletion, or a metadata update is requested, the Mail client shall forward the character ID, the target resource ID, and any update payload unchanged to the corresponding ESI operation.","line":93,"pattern":"event-driven","exclusion":false,"verdict":"verified","evidence":"","charter":[],"tags":[],"scenarios":[{"title":"Deleting a custom label forwards the character and label IDs","line":99,"tags":[]},{"title":"Deleting a message forwards the character and mail IDs","line":104,"tags":[]},{"title":"Marking a mail as read forwards the metadata payload","line":109,"tags":[]}],"source":"  Rule: When a mail deletion, a label deletion, or a metadata update is requested, the Mail client shall forward the character ID, the target resource ID, and any update payload unchanged to the corresponding ESI operation.\n    These three operations return no body, so the only observable contract is\n    what gets sent. Dropping or reordering an identifier would target the\n    wrong resource, and metadata updates carry a payload that has to survive\n    the call intact for a read flag or label change to land.\n\n    Scenario: Deleting a custom label forwards the character and label IDs\n      Given an authenticated character with a custom label\n      When the client deletes the mail label\n      Then the delete label operation shall complete without error\n\n    Scenario: Deleting a message forwards the character and mail IDs\n      Given an authenticated character with a mail to delete\n      When the client deletes the mail\n      Then the delete mail operation shall complete without error\n\n    Scenario: Marking a mail as read forwards the metadata payload\n      Given an unread mail\n      When the client updates its metadata to mark it as read\n      Then the update metadata operation shall complete without error","sourceStart":93,"findings":[]},{"id":"0022-mail#R8","title":"When header, label, and mailing-list requests are issued concurrently, the Mail client shall resolve each request with the payload of its own endpoint.","line":116,"pattern":"event-driven","exclusion":false,"verdict":"verified","evidence":"","charter":[],"tags":[],"scenarios":[{"title":"Headers, labels, and mailing lists fetched in parallel each resolve","line":121,"tags":[]}],"source":"  Rule: When header, label, and mailing-list requests are issued concurrently, the Mail client shall resolve each request with the payload of its own endpoint.\n    A mail UI opens all three views at once. Sharing one client across\n    in-flight requests has to keep the responses separate, so this scenario\n    checks that each promise settles with its own data and not another's.\n\n    Scenario: Headers, labels, and mailing lists fetched in parallel each resolve\n      Given an authenticated character for concurrent mail fetch\n      When the client fetches headers, labels, and lists concurrently\n      Then all three mail requests shall resolve successfully","sourceStart":116,"findings":[]},{"id":"0022-mail#R9","title":"If every attempt at a mail request is answered with an error status and no usable cached entry exists, then the Mail client shall raise an EsiError.","line":128,"pattern":"unwanted-behaviour","exclusion":false,"verdict":"verified","evidence":"","charter":[],"tags":[],"scenarios":[{"title":"Unauthenticated header request is rejected with 403","line":133,"tags":[]},{"title":"Unknown mail ID is rejected with 404","line":138,"tags":[]}],"source":"  Rule: If every attempt at a mail request is answered with an error status and no usable cached entry exists, then the Mail client shall raise an EsiError.\n    Every mail endpoint reports failure the same way so a caller can wrap the\n    whole surface in one try/catch. The two scenarios cover the authorisation\n    boundary and a missing resource.\n\n    Scenario: Unauthenticated header request is rejected with 403\n      Given an unauthenticated mail request\n      When the client requests mail headers without auth\n      Then the client shall return a 403 forbidden error for mail\n\n    Scenario: Unknown mail ID is rejected with 404\n      Given a mail ID that does not exist\n      When the client requests the non-existent mail\n      Then the client shall return a 404 not found error for mail","sourceStart":128,"findings":[]}],"noUnwantedBehaviour":false,"orphanScenarios":0},{"file":"tests/bdd/features/core/0023-market.feature","area":"core","name":"Market Management","tags":["@TEST-10"],"charter":["TEST-10"],"description":"The Market client covers the four market surfaces ESI exposes: the global price list, the live order book of a region, the daily history of a type in a region, and a character's own open and historical orders. Together they are the raw material for price analysis, so the client returns records verbatim and leaves aggregation, filtering, and trend detection to the caller.\n\nMarket endpoints are the highest-volume ones in the library — a single region order book runs to thousands of rows — so payload size and concurrent use are part of the contract rather than an afterthought.\n\nRetry, stale-on-error, circuit breaking and request deduplication apply to these calls as to every other; 0050-etag-caching.feature and 0051-resilience.feature specify them once. A failure Rule below states the outcome after they have run, which is why it names every attempt and the absence of a usable cached entry.","boundBy":["tests/bdd/specs/core/0023-market.spec.ts"],"rules":[{"id":"0023-market#R1","title":"When current market prices are requested, the Market client shall return each entry with a type_id, and a numeric average_price and an adjusted_price when present.","line":21,"pattern":"event-driven","exclusion":false,"verdict":"verified","evidence":"","charter":[],"tags":[],"scenarios":[{"title":"Price list returns average and adjusted prices per type","line":27,"tags":[]}],"source":"  Rule: When current market prices are requested, the Market client shall return each entry with a type_id, and a numeric average_price and an adjusted_price when present.\n    The price endpoint is the cheapest way to value an arbitrary item. The two\n    prices differ in meaning — average_price tracks recent trades, while\n    adjusted_price feeds industry cost calculations — so both are carried\n    through rather than collapsed into one figure.\n\n    Scenario: Price list returns average and adjusted prices per type\n      Given the market system is operational\n      When the client requests current market prices\n      Then the client shall return price data for all tradeable items","sourceStart":21,"findings":[]},{"id":"0023-market#R2","title":"If the ESI market price endpoint answers every attempt with an error status and no usable cached entry exists, then the Market client shall raise an EsiError.","line":32,"pattern":"unwanted-behaviour","exclusion":false,"verdict":"verified","evidence":"","charter":[],"tags":[],"scenarios":[{"title":"Price request during a market data outage is rejected with 503","line":37,"tags":[]}],"source":"  Rule: If the ESI market price endpoint answers every attempt with an error status and no usable cached entry exists, then the Market client shall raise an EsiError.\n    Market data is served from a cache that can be unavailable while the\n    market endpoint itself is up, which surfaces as a 503. The caller sees the\n    same EsiError type as for any other market failure.\n\n    Scenario: Price request during a market data outage is rejected with 503\n      Given market data is temporarily unavailable\n      When the client requests market prices expecting error\n      Then the client shall return a market service error","sourceStart":32,"findings":[]},{"id":"0023-market#R3","title":"When the market orders of a region are requested, the Market client shall return each order with an order_id, a type_id, a price, and a boolean is_buy_order.","line":44,"pattern":"event-driven","exclusion":false,"verdict":"verified","evidence":"","charter":[],"tags":[],"scenarios":[{"title":"Region order book returns buy and sell orders for one type","line":50,"tags":[]},{"title":"Mixed order book splits into bid and ask sides by is_buy_order","line":55,"tags":[]}],"source":"  Rule: When the market orders of a region are requested, the Market client shall return each order with an order_id, a type_id, a price, and a boolean is_buy_order.\n    Buy and sell orders share one endpoint and one payload shape, separated\n    only by the is_buy_order flag. Keeping that flag boolean is what lets a\n    caller split the book into bid and ask sides, which is the first step of\n    any spread or margin calculation.\n\n    Scenario: Region order book returns buy and sell orders for one type\n      Given a valid region ID\n      When the client requests market orders for the region\n      Then the client shall return current buy and sell orders\n\n    Scenario: Mixed order book splits into bid and ask sides by is_buy_order\n      Given market orders with mixed buy and sell types\n      When the client analyzes the market orders\n      Then the client shall distinguish between buy and sell orders","sourceStart":44,"findings":[]},{"id":"0023-market#R4","title":"When the market history of a region and type is requested, the Market client shall return each daily record with its date, volume, order_count, lowest, highest, and average values in the order ESI supplies them.","line":62,"pattern":"event-driven","exclusion":false,"verdict":"verified","evidence":"","charter":[],"tags":[],"scenarios":[{"title":"Two days of history return traded volume and price bounds","line":67,"tags":[]},{"title":"Five consecutive daily averages expose a rising price series","line":72,"tags":[]}],"source":"  Rule: When the market history of a region and type is requested, the Market client shall return each daily record with its date, volume, order_count, lowest, highest, and average values in the order ESI supplies them.\n    History is a time series, so both the per-day fields and their ordering\n    carry meaning. Preserving the sequence is what makes day-over-day\n    differencing possible without the caller re-sorting by date first.\n\n    Scenario: Two days of history return traded volume and price bounds\n      Given a valid region and item type\n      When the client requests market history\n      Then the client shall return historical price and volume data\n\n    Scenario: Five consecutive daily averages expose a rising price series\n      Given historical market data with trending prices\n      When the client analyzes price trends\n      Then the client shall identify market patterns","sourceStart":62,"findings":[]},{"id":"0023-market#R5","title":"When the open market orders of a character are requested, the Market client shall return each order with an order_id, a type_id, a price, a region_id, and an is_corporation flag.","line":79,"pattern":"event-driven","exclusion":false,"verdict":"verified","evidence":"","charter":[],"tags":[],"scenarios":[{"title":"Character open orders carry region and corporation attribution","line":85,"tags":[]}],"source":"  Rule: When the open market orders of a character are requested, the Market client shall return each order with an order_id, a type_id, a price, a region_id, and an is_corporation flag.\n    A character's own orders carry two fields the public book omits: the\n    region they sit in, and whether the order was placed on the corporation's\n    behalf. The second decides whose wallet the ISK moves through, so it is\n    part of the minimum payload.\n\n    Scenario: Character open orders carry region and corporation attribution\n      Given an authenticated character with market orders\n      When the client requests their market orders\n      Then the client shall return their active orders","sourceStart":79,"findings":[]},{"id":"0023-market#R6","title":"When the market order history of a character is requested, the Market client shall return each order with a state of cancelled or expired and a volume_remain no greater than its volume_total.","line":90,"pattern":"event-driven","exclusion":false,"verdict":"verified","evidence":"","charter":[],"tags":[],"scenarios":[{"title":"Closed order reports a terminal state and its filled volume","line":97,"tags":[]}],"source":"  Rule: When the market order history of a character is requested, the Market client shall return each order with a state of cancelled or expired and a volume_remain no greater than its volume_total.\n    Order history is the terminal state of an order, so state is constrained\n    to the two values ESI and the order history schema name: cancelled and\n    expired. A filled order leaves the history as expired with no volume\n    remaining; there is no closed state. The volume relationship distinguishes\n    a fully filled order from one that expired part-traded.\n\n    Scenario: Closed order reports a terminal state and its filled volume\n      Given an authenticated character with order history\n      When the client requests their order history\n      Then the client shall return completed and cancelled orders","sourceStart":90,"findings":[]},{"id":"0023-market#R7","title":"When order book requests for three regions are issued concurrently, the Market client shall resolve each request with the orders of its own region.","line":104,"pattern":"event-driven","exclusion":false,"verdict":"verified","evidence":"","charter":[],"tags":[],"scenarios":[{"title":"Three region order books requested in parallel each resolve with their own orders","line":110,"tags":[]}],"source":"  Rule: When order book requests for three regions are issued concurrently, the Market client shall resolve each request with the orders of its own region.\n    Cross-region arbitrage means fanning out the same call over several\n    regions at once. Sharing one client instance across those in-flight\n    requests has to keep the responses distinct, so each promise settles with\n    the book of the region it asked for.\n\n    Scenario: Three region order books requested in parallel each resolve with their own orders\n      Given multiple concurrent market data requests\n      When the client makes them simultaneously\n      Then all market requests shall complete successfully","sourceStart":104,"findings":[]},{"id":"0023-market#R8","title":"When a region order book of 5000 orders is returned, the Market client shall deliver every order within 1000 milliseconds.","line":115,"pattern":"event-driven","exclusion":false,"verdict":"verified","evidence":"","charter":[],"tags":[],"scenarios":[{"title":"Order book of 5000 entries is returned intact inside the time budget","line":121,"tags":[]}],"source":"  Rule: When a region order book of 5000 orders is returned, the Market client shall deliver every order within 1000 milliseconds.\n    A busy trade hub returns thousands of rows per type. The client does no\n    per-row transformation on the way out, and this bound is what pins that\n    down: an implementation that copied or re-validated each order in a loop\n    would breach it long before 5000 entries.\n\n    Scenario: Order book of 5000 entries is returned intact inside the time budget\n      Given a request for market data with many orders\n      When the client processes the large market data\n      Then the client shall handle large market datasets efficiently","sourceStart":115,"findings":[]},{"id":"0023-market#R9","title":"When price, order book, and history requests are issued concurrently, the Market client shall resolve each request with the payload of its own endpoint.","line":126,"pattern":"event-driven","exclusion":false,"verdict":"verified","evidence":"","charter":[],"tags":[],"scenarios":[{"title":"Price, order book, and history lookups combine into one analysis pass","line":132,"tags":[]}],"source":"  Rule: When price, order book, and history requests are issued concurrently, the Market client shall resolve each request with the payload of its own endpoint.\n    Valuing a trade needs all three views at once: the reference price, the\n    live spread, and the recent trend. Issuing them in parallel is the normal\n    access pattern, and each promise has to settle with its own endpoint's\n    data for the resulting analysis to mean anything.\n\n    Scenario: Price, order book, and history lookups combine into one analysis pass\n      Given a market analysis requirement\n      When the client gathers comprehensive market data\n      Then the client shall successfully retrieve all market information","sourceStart":126,"findings":[]}],"noUnwantedBehaviour":false,"orphanScenarios":0},{"file":"tests/bdd/features/core/0024-mercenary.feature","area":"core","name":"Mercenary Operations","tags":["@TEST-10"],"charter":["TEST-10"],"description":"The Mercenary client covers mercenary dens and the tactical operations that spawn from them. A den is a persistent structure with development and anarchy levels that evolve over time; a mercenary tactical operation (MTO) is a short-lived site, identified by a UUID, tied back to its parent den by mercenary_den_id.\n\nEach concept has a list endpoint that locates what a character owns and a detail endpoint for the state, evolution and expiry data the list view omits.\n\nRetry, stale-on-error, circuit breaking and request deduplication apply to these calls as to every other; 0050-etag-caching.feature and 0051-resilience.feature specify them once. A failure Rule below states the outcome after they have run, which is why it names every attempt and the absence of a usable cached entry.","boundBy":["tests/bdd/step-definitions/core/mercenary.steps.ts"],"rules":[{"id":"0024-mercenary#R1","title":"When the mercenary dens of a character are requested, the Mercenary client shall return the response's mercenary_dens list, each entry with its den id and planet.","line":20,"pattern":"event-driven","exclusion":false,"verdict":"verified","evidence":"","charter":[],"tags":[],"scenarios":[{"title":"Two dens return their ids and planets","line":26,"tags":[]}],"source":"  Rule: When the mercenary dens of a character are requested, the Mercenary client shall return the response's mercenary_dens list, each entry with its den id and planet.\n    ESI wraps the list in an object ({ mercenary_dens: [...] }), and the\n    client returns that object as sent. The listing only locates each den: its\n    id and the planet_id it sits on. State, infomorphs and the development and\n    anarchy evolution come from the per-den detail endpoint.\n\n    Scenario: Two dens return their ids and planets\n      Given mercenary dens exist\n      When the client requests dens\n      Then the client shall return the mercenary_dens list with ids and planets","sourceStart":20,"findings":[]},{"id":"0024-mercenary#R2","title":"If a character owns no mercenary den
