ing match is what lets a\n    user find one without knowing its casing. The limit is 25 when the\n    caller gives none.\n\n    Scenario: Fragment HP matches the hp attribute\n      Given a static data provider with the extended universe data set\n      When the user searches for dogma attributes matching \"HP\"\n      Then the provider shall return dogma attributes whose names contain \"HP\"\n      And the result should contain exactly 1 records","sourceStart":15,"findings":[]},{"id":"0012-sde-dogma-definitions#R2","title":"When a name fragment is searched for among dogma effects, the SDE provider shall return the loaded dogma effects whose names contain that fragment, ignoring letter case, up to the requested limit.","line":27,"pattern":"event-driven","exclusion":false,"verdict":"verified","evidence":"","charter":[],"tags":[],"scenarios":[{"title":"Fragment slot matches both slot modifier effects","line":32,"tags":[]}],"source":"  Rule: When a name fragment is searched for among dogma effects, the SDE provider shall return the loaded dogma effects whose names contain that fragment, ignoring letter case, up to the requested limit.\n    Effect names follow the same identifier style as attributes, and both\n    slot modifiers share the fragment \"slot\", which is why that fragment\n    returns two records here.\n\n    Scenario: Fragment slot matches both slot modifier effects\n      Given a static data provider with the extended universe data set\n      When the user searches for dogma effects matching \"slot\"\n      Then the provider shall return dogma effects whose names contain \"slot\"\n      And the result should contain exactly 2 records","sourceStart":27,"findings":[]},{"id":"0012-sde-dogma-definitions#R3","title":"When a dogma effect ID present in the loaded data set is looked up, the SDE provider shall return the effect record carrying its name and its effect category ID.","line":40,"pattern":"event-driven","exclusion":false,"verdict":"verified","evidence":"","charter":[],"tags":[],"scenarios":[{"title":"Effect 11 resolves to lowSlotModifier","line":45,"tags":[]}],"source":"  Rule: When a dogma effect ID present in the loaded data set is looked up, the SDE provider shall return the effect record carrying its name and its effect category ID.\n    A type's dogma lists effect IDs; the effect record is what tells a\n    fitting tool what the module does and, through the category, whether it\n    is passive, active or overloaded.\n\n    Scenario: Effect 11 resolves to lowSlotModifier\n      Given a static data provider with the extended universe data set\n      When I look up dogma effect 11\n      Then the provider shall return the dogma effect named \"lowSlotModifier\"\n      And the returned record shall carry effect category 0","sourceStart":40,"findings":[]},{"id":"0012-sde-dogma-definitions#R4","title":"When a dogma attribute category ID present in the loaded data set is looked up, the SDE provider shall return the category record carrying its name.","line":51,"pattern":"event-driven","exclusion":false,"verdict":"verified","evidence":"","charter":[],"tags":[],"scenarios":[{"title":"Attribute category 1 resolves to Fitting","line":55,"tags":[]}],"source":"  Rule: When a dogma attribute category ID present in the loaded data set is looked up, the SDE provider shall return the category record carrying its name.\n    Attribute categories are the headings a fitting window groups attributes\n    under — Fitting, Shield, Armor — so the name is the field a caller needs.\n\n    Scenario: Attribute category 1 resolves to Fitting\n      Given a static data provider with the extended universe data set\n      When I look up dogma attribute category 1\n      Then the provider shall return the dogma attribute category named \"Fitting\"","sourceStart":51,"findings":[]},{"id":"0012-sde-dogma-definitions#R5","title":"When a dogma unit ID present in the loaded data set is looked up, the SDE provider shall return the unit record carrying its name and its display name.","line":60,"pattern":"event-driven","exclusion":false,"verdict":"verified","evidence":"","charter":[],"tags":[],"scenarios":[{"title":"Unit 1 resolves to Length displayed as m","line":64,"tags":[]}],"source":"  Rule: When a dogma unit ID present in the loaded data set is looked up, the SDE provider shall return the unit record carrying its name and its display name.\n    An attribute value is meaningless without its unit. The display name is\n    the short form a caller prints after the value, such as m or s.\n\n    Scenario: Unit 1 resolves to Length displayed as m\n      Given a static data provider with the extended universe data set\n      When I look up dogma unit 1\n      Then the provider shall return the dogma unit named \"Length\"\n      And the returned unit shall be displayed as \"m\"","sourceStart":60,"findings":[]},{"id":"0012-sde-dogma-definitions#R6","title":"If a dogma effect, attribute category or unit ID is absent from the loaded data set, then the SDE provider shall return null.","line":70,"pattern":"unwanted-behaviour","exclusion":false,"verdict":"verified","evidence":"","charter":[],"tags":[],"scenarios":[{"title":"Unknown dogma effect 99999 resolves to null","line":74,"tags":[]},{"title":"Unknown dogma attribute category 99999 resolves to null","line":79,"tags":[]},{"title":"Unknown dogma unit 99999 resolves to null","line":84,"tags":[]}],"source":"  Rule: If a dogma effect, attribute category or unit ID is absent from the loaded data set, then the SDE provider shall return null.\n    Dogma reference IDs on a type may point past a partial extract; the miss\n    is an ordinary outcome answered with null.\n\n    Scenario: Unknown dogma effect 99999 resolves to null\n      Given a static data provider with the extended universe data set\n      When I look up dogma effect 99999\n      Then the provider shall return null\n\n    Scenario: Unknown dogma attribute category 99999 resolves to null\n      Given a static data provider with the extended universe data set\n      When I look up dogma attribute category 99999\n      Then the provider shall return null\n\n    Scenario: Unknown dogma unit 99999 resolves to null\n      Given a static data provider with the extended universe data set\n      When I look up dogma unit 99999\n      Then the provider shall return null","sourceStart":70,"findings":[]},{"id":"0012-sde-dogma-definitions#R7","title":"When every dogma attribute category is requested, the SDE provider shall return one record for each loaded attribute category.","line":91,"pattern":"event-driven","exclusion":false,"verdict":"verified","evidence":"","charter":[],"tags":[],"scenarios":[{"title":"The two loaded attribute categories are both returned","line":95,"tags":[]}],"source":"  Rule: When every dogma attribute category is requested, the SDE provider shall return one record for each loaded attribute category.\n    A fitting window builds its section headings from the whole table, so\n    each loaded category appears once.\n\n    Scenario: The two loaded attribute categories are both returned\n      Given a static data provider with the extended universe data set\n      When I look up every dogma attribute category\n      Then the result should contain exactly 2 records\n      And the result shall be the records named \"Fitting, Shield\"","sourceStart":91,"findings":[]},{"id":"0012-sde-dogma-definitions#R8","title":"When every dogma unit is requested, the SDE provider shall return one record for each loaded unit.","line":101,"pattern":"event-driven","exclusion":false,"verdict":"verified","evidence":"","charter":[],"tags":[],"scenarios":[{"title":"The two loaded units are both returned","line":105,"tags":[]}],"source":"  Rule: When every dogma unit is requested, the SDE provider shall return one record for each loaded unit.\n    Units are resolved by ID at display time, so a caller loads the table\n    once and indexes it; each loaded unit appears once.\n\n    Scenario: The two loaded units are both returned\n      Given a static data provider with the extended universe data set\n      When I look up every dogma unit\n      Then the result should contain exactly 2 records\n      And the result shall be the records named \"Length, Time\"","sourceStart":101,"findings":[]}],"noUnwantedBehaviour":false,"orphanScenarios":0},{"file":"tests/bdd/features/sde/0013-sde-character-reference.feature","area":"sde","name":"Character Reference Tables","tags":["@TEST-10"],"charter":["TEST-10"],"description":"Feature 0005 walks the character origin chain from a race down to its ancestries and looks one faction up by ID. This feature covers the rest of the character reference data: the faction and race tables read whole, a bloodline or ancestry looked up by its own ID, and the three small tables a character sheet draws on — character attributes, clone grades and schools.\n\nA character tool holds these IDs from live API responses (a public character record names its race, bloodline and ancestry) and turns them into names and descriptions through these lookups.","boundBy":["tests/bdd/specs/sde/0013-sde-character-reference.spec.ts"],"rules":[{"id":"0013-sde-character-reference#R1","title":"When every faction is requested, the SDE provider shall return one record for each loaded faction.","line":15,"pattern":"event-driven","exclusion":false,"verdict":"verified","evidence":"","charter":[],"tags":[],"scenarios":[{"title":"The two loaded factions are both returned","line":20,"tags":[]}],"source":"  Rule: When every faction is requested, the SDE provider shall return one record for each loaded faction.\n    The faction table is small and is read whole to label sovereignty,\n    militias and NPC corporations. Each loaded faction appears once, whether\n    or not any NPC corporation of it is loaded.\n\n    Scenario: The two loaded factions are both returned\n      Given a static data provider with the reference data set\n      When I look up every faction\n      Then the result should contain exactly 2 records\n      And the result shall be the records named \"Caldari State, Gallente Federation\"","sourceStart":15,"findings":[]},{"id":"0013-sde-character-reference#R2","title":"When every race is requested, the SDE provider shall return one record for each loaded race.","line":26,"pattern":"event-driven","exclusion":false,"verdict":"verified","evidence":"","charter":[],"tags":[],"scenarios":[{"title":"The two loaded races are both returned","line":30,"tags":[]}],"source":"  Rule: When every race is requested, the SDE provider shall return one record for each loaded race.\n    The four playable races are the first choice a character makes, and a\n    character creator or a filter reads the table whole.\n\n    Scenario: The two loaded races are both returned\n      Given a static data provider with the reference data set\n      When I look up every race\n      Then the result should contain exactly 2 records\n      And the result shall be the records named \"Caldari, Gallente\"","sourceStart":26,"findings":[]},{"id":"0013-sde-character-reference#R3","title":"When every character attribute is requested, the SDE provider shall return one record for each loaded attribute.","line":36,"pattern":"event-driven","exclusion":false,"verdict":"verified","evidence":"","charter":[],"tags":[],"scenarios":[{"title":"The two loaded character attributes are both returned","line":40,"tags":[]}],"source":"  Rule: When every character attribute is requested, the SDE provider shall return one record for each loaded attribute.\n    The five character attributes govern skill training speed; a skill\n    planner reads the table whole to label them.\n\n    Scenario: The two loaded character attributes are both returned\n      Given a static data provider with the reference data set\n      When I look up every character attribute\n      Then the result should contain exactly 2 records\n      And the result shall be the records named \"Charisma, Intelligence\"","sourceStart":36,"findings":[]},{"id":"0013-sde-character-reference#R4","title":"When every clone grade is requested, the SDE provider shall return one record for each loaded clone grade.","line":46,"pattern":"event-driven","exclusion":false,"verdict":"verified","evidence":"","charter":[],"tags":[],"scenarios":[{"title":"The two loaded clone grades are both returned","line":50,"tags":[]}],"source":"  Rule: When every clone grade is requested, the SDE provider shall return one record for each loaded clone grade.\n    Clone grades decide which skills a character may train; the table is\n    read whole to explain an account state.\n\n    Scenario: The two loaded clone grades are both returned\n      Given a static data provider with the reference data set\n      When I look up every clone grade\n      Then the result should contain exactly 2 records\n      And the result shall be the records named \"Alpha Clone, Omega Clone\"","sourceStart":46,"findings":[]},{"id":"0013-sde-character-reference#R5","title":"When every school is requested, the SDE provider shall return one record for each loaded school.","line":56,"pattern":"event-driven","exclusion":false,"verdict":"verified","evidence":"","charter":[],"tags":[],"scenarios":[{"title":"The two loaded schools are both returned","line":60,"tags":[]}],"source":"  Rule: When every school is requested, the SDE provider shall return one record for each loaded school.\n    Schools are the starting corporations of new characters and are read\n    whole for a character creator's picker.\n\n    Scenario: The two loaded schools are both returned\n      Given a static data provider with the reference data set\n      When I look up every school\n      Then the result should contain exactly 2 records\n      And the result shall be the records named \"School of Applied Knowledge, Science and Trade Institute\"","sourceStart":56,"findings":[]},{"id":"0013-sde-character-reference#R6","title":"When a bloodline ID present in the loaded data set is looked up, the SDE provider shall return the bloodline record carrying its name and its race ID.","line":68,"pattern":"event-driven","exclusion":false,"verdict":"verified","evidence":"","charter":[],"tags":[],"scenarios":[{"title":"Bloodline 1 resolves to Deteis","line":73,"tags":[]}],"source":"  Rule: When a bloodline ID present in the loaded data set is looked up, the SDE provider shall return the bloodline record carrying its name and its race ID.\n    Feature 0005 lists the bloodlines of a race; this lookup answers for one\n    bloodline by its own ID, which is what a character record carries. The\n    race ID on the record walks back up the origin chain.\n\n    Scenario: Bloodline 1 resolves to Deteis\n      Given a static data provider with the reference data set\n      When I look up bloodline 1\n      Then the returned record shall be named \"Deteis\"\n      And the returned record shall carry race 1","sourceStart":68,"findings":[]},{"id":"0013-sde-character-reference#R7","title":"When an ancestry ID present in the loaded data set is looked up, the SDE provider shall return the ancestry record carrying its name and its bloodline ID.","line":79,"pattern":"event-driven","exclusion":false,"verdict":"verified","evidence":"","charter":[],"tags":[],"scenarios":[{"title":"Ancestry 1 resolves to Tube Child","line":83,"tags":[]}],"source":"  Rule: When an ancestry ID present in the loaded data set is looked up, the SDE provider shall return the ancestry record carrying its name and its bloodline ID.\n    An ancestry is the leaf of the origin chain and the ID a character\n    record carries; the bloodline ID links it back to its bloodline.\n\n    Scenario: Ancestry 1 resolves to Tube Child\n      Given a static data provider with the reference data set\n      When I look up ancestry 1\n      Then the returned record shall be named \"Tube Child\"\n      And the returned record shall carry bloodline 1","sourceStart":79,"findings":[]},{"id":"0013-sde-character-reference#R8","title":"When a character attribute ID present in the loaded data set is looked up, the SDE provider shall return the attribute record carrying its name.","line":89,"pattern":"event-driven","exclusion":false,"verdict":"verified","evidence":"","charter":[],"tags":[],"scenarios":[{"title":"Character attribute 1 resolves to Intelligence","line":93,"tags":[]}],"source":"  Rule: When a character attribute ID present in the loaded data set is looked up, the SDE provider shall return the attribute record carrying its name.\n    A skill names its primary and secondary attribute by ID; the record\n    gives the name a skill planner displays.\n\n    Scenario: Character attribute 1 resolves to Intelligence\n      Given a static data provider with the reference data set\n      When I look up character attribute 1\n      Then the returned record shall be named \"Intelligence\"","sourceStart":89,"findings":[]},{"id":"0013-sde-character-reference#R9","title":"When a clone grade ID present in the loaded data set is looked up, the SDE provider shall return the clone grade record carrying its name.","line":98,"pattern":"event-driven","exclusion":false,"verdict":"verified","evidence":"","charter":[],"tags":[],"scenarios":[{"title":"Clone grade 2 resolves to Omega Clone","line":102,"tags":[]}],"source":"  Rule: When a clone grade ID present in the loaded data set is looked up, the SDE provider shall return the clone grade record carrying its name.\n    An account state names its clone grade by ID; the record gives the name\n    to display and the skill limits to apply.\n\n    Scenario: Clone grade 2 resolves to Omega Clone\n      Given a static data provider with the reference data set\n      When I look up clone grade 2\n      Then the returned record shall be named \"Omega Clone\"","sourceStart":98,"findings":[]},{"id":"0013-sde-character-reference#R10","title":"When a school ID present in the loaded data set is looked up, the SDE provider shall return the school record carrying its name and its corporation ID.","line":107,"pattern":"event-driven","exclusion":false,"verdict":"verified","evidence":"","charter":[],"tags":[],"scenarios":[{"title":"School 1 resolves to the School of Applied Knowledge","line":111,"tags":[]}],"source":"  Rule: When a school ID present in the loaded data set is looked up, the SDE provider shall return the school record carrying its name and its corporation ID.\n    A character record names its school by ID; the corporation ID is the\n    NPC corporation the character started in.\n\n    Scenario: School 1 resolves to the School of Applied Knowledge\n      Given a static data provider with the reference data set\n      When I look up school 1\n      Then the returned record shall be named \"School of Applied Knowledge\"\n      And the returned record shall carry corporation 1000044","sourceStart":107,"findings":[]},{"id":"0013-sde-character-reference#R11","title":"If a bloodline, ancestry, character attribute, clone grade or school ID is absent from the loaded data set, then the SDE provider shall return null.","line":119,"pattern":"unwanted-behaviour","exclusion":false,"verdict":"verified","evidence":"","charter":[],"tags":[],"scenarios":[{"title":"Unknown bloodline 99 resolves to null","line":124,"tags":[]},{"title":"Unknown ancestry 99 resolves to null","line":129,"tags":[]},{"title":"Unknown character attribute 99 resolves to null","line":134,"tags":[]},{"title":"Unknown clone grade 99 resolves to null","line":139,"tags":[]},{"title":"Unknown school 99 resolves to null","line":144,"tags":[]}],"source":"  Rule: If a bloodline, ancestry, character attribute, clone grade or school ID is absent from the loaded data set, then the SDE provider shall return null.\n    These tables are small and stable, but a partial extract may omit any\n    of them, and null rather than an exception is the answer for a record\n    that is not loaded.\n\n    Scenario: Unknown bloodline 99 resolves to null\n      Given a static data provider with the reference data set\n      When I look up bloodline 99\n      Then the provider shall return null\n\n    Scenario: Unknown ancestry 99 resolves to null\n      Given a static data provider with the reference data set\n      When I look up ancestry 99\n      Then the provider shall return null\n\n    Scenario: Unknown character attribute 99 resolves to null\n      Given a static data provider with the reference data set\n      When I look up character attribute 99\n      Then the provider shall return null\n\n    Scenario: Unknown clone grade 99 resolves to null\n      Given a static data provider with the reference data set\n      When I look up clone grade 99\n      Then the provider shall return null\n\n    Scenario: Unknown school 99 resolves to null\n      Given a static data provider with the reference data set\n      When I look up school 99\n      Then the provider shall return null","sourceStart":119,"findings":[]}],"noUnwantedBehaviour":false,"orphanScenarios":0},{"file":"tests/bdd/features/sde/0014-sde-npc-organisations.feature","area":"sde","name":"NPC Organisations","tags":["@TEST-10"],"charter":["TEST-10"],"description":"New Eden's NPC corporations, their stations, their named characters and their agents are reference data a mission tool, a standings tracker or a station browser reads constantly. Feature 0005 looks one NPC station up by ID; this feature covers the corporation itself, the corporations of a faction, the stations of a system or an owner, NPC characters by ID, by corporation and by name, and the tables that describe corporations and agents: activities, divisions, agent types and agents in space.\n\nEvery record here is keyed by the same ID the live API uses for the corporation, character or station, so live responses join to it directly.","boundBy":["tests/bdd/specs/sde/0014-sde-npc-organisations.spec.ts"],"rules":[{"id":"0014-sde-npc-organisations#R1","title":"When an NPC corporation ID present in the loaded data set is looked up, the SDE provider shall return the corporation record carrying its name, its faction ID and its ticker.","line":16,"pattern":"event-driven","exclusion":false,"verdict":"verified","evidence":"","charter":[],"tags":[],"scenarios":[{"title":"NPC corporation 1000035 resolves to the Caldari Navy","line":21,"tags":[]}],"source":"  Rule: When an NPC corporation ID present in the loaded data set is looked up, the SDE provider shall return the corporation record carrying its name, its faction ID and its ticker.\n    A corporation ID appears on stations, agents, characters and standings.\n    The faction ID places it in a faction and the ticker is the short label\n    the game shows.\n\n    Scenario: NPC corporation 1000035 resolves to the Caldari Navy\n      Given a static data provider with the reference data set\n      When I look up NPC corporation 1000035\n      Then the returned record shall be named \"Caldari Navy\"\n      And the returned record shall carry faction 500001\n      And the returned record shall carry the ticker \"CN\"","sourceStart":16,"findings":[]},{"id":"0014-sde-npc-organisations#R2","title":"When the NPC corporations of a faction are requested, the SDE provider shall return every loaded corporation whose faction ID equals that faction, and an empty list for a faction with none loaded.","line":28,"pattern":"event-driven","exclusion":false,"verdict":"verified","evidence":"","charter":[],"tags":[],"scenarios":[{"title":"Faction 500001 has two corporations","line":32,"tags":[]},{"title":"Faction 500004 has no corporations loaded","line":38,"tags":[]}],"source":"  Rule: When the NPC corporations of a faction are requested, the SDE provider shall return every loaded corporation whose faction ID equals that faction, and an empty list for a faction with none loaded.\n    A faction's corporations are the ones its standings flow to. A faction\n    with no corporations loaded answers with an empty list, not null.\n\n    Scenario: Faction 500001 has two corporations\n      Given a static data provider with the reference data set\n      When I look up NPC corporations of faction 500001\n      Then the result should contain exactly 2 records\n      And each returned record shall carry faction 500001\n\n    Scenario: Faction 500004 has no corporations loaded\n      Given a static data provider with the reference data set\n      When I look up NPC corporations of faction 500004\n      Then the provider shall return an empty list","sourceStart":28,"findings":[]},{"id":"0014-sde-npc-organisations#R3","title":"When the NPC stations of a solar system are requested, the SDE provider shall return every loaded station whose solar system ID equals that system, and an empty list for a system with none loaded.","line":45,"pattern":"event-driven","exclusion":false,"verdict":"verified","evidence":"","charter":[],"tags":[],"scenarios":[{"title":"Jita has one station loaded","line":49,"tags":[]},{"title":"Maurasi has no stations loaded","line":55,"tags":[]}],"source":"  Rule: When the NPC stations of a solar system are requested, the SDE provider shall return every loaded station whose solar system ID equals that system, and an empty list for a system with none loaded.\n    A station browser lists the stations of the system a character is in.\n    A system with no stations loaded answers with an empty list.\n\n    Scenario: Jita has one station loaded\n      Given a static data provider with the reference data set\n      When I look up NPC stations in system 30000142\n      Then the result should contain exactly 1 record\n      And each returned record shall carry solar system 30000142\n\n    Scenario: Maurasi has no stations loaded\n      Given a static data provider with the reference data set\n      When I look up NPC stations in system 30000148\n      Then the provider shall return an empty list","sourceStart":45,"findings":[]},{"id":"0014-sde-npc-organisations#R4","title":"When the NPC stations of an owner are requested, the SDE provider shall return every loaded station whose owner ID equals that corporation.","line":60,"pattern":"event-driven","exclusion":false,"verdict":"verified","evidence":"","charter":[],"tags":[],"scenarios":[{"title":"Caldari Provisions owns the Perimeter station","line":64,"tags":[]}],"source":"  Rule: When the NPC stations of an owner are requested, the SDE provider shall return every loaded station whose owner ID equals that corporation.\n    A corporation's stations are where its agents and its loyalty point\n    store live; the owner ID is the corporation ID.\n\n    Scenario: Caldari Provisions owns the Perimeter station\n      Given a static data provider with the reference data set\n      When I look up NPC stations owned by 1000009\n      Then the result should contain exactly 1 record\n      And each returned record shall carry owner 1000009","sourceStart":60,"findings":[]},{"id":"0014-sde-npc-organisations#R5","title":"When an NPC character ID present in the loaded data set is looked up, the SDE provider shall return the character record carrying its name and its corporation ID.","line":72,"pattern":"event-driven","exclusion":false,"verdict":"verified","evidence":"","charter":[],"tags":[],"scenarios":[{"title":"NPC character 3004451 resolves to Aakiro Tenaka","line":76,"tags":[]}],"source":"  Rule: When an NPC character ID present in the loaded data set is looked up, the SDE provider shall return the character record carrying its name and its corporation ID.\n    Agents and corporation CEOs are NPC characters; a live response names\n    them by character ID and the record gives the name and employer.\n\n    Scenario: NPC character 3004451 resolves to Aakiro Tenaka\n      Given a static data provider with the reference data set\n      When I look up NPC character 3004451\n      Then the returned record shall be named \"Aakiro Tenaka\"\n      And the returned record shall carry corporation 1000035","sourceStart":72,"findings":[]},{"id":"0014-sde-npc-organisations#R6","title":"When the NPC characters of a corporation are requested, the SDE provider shall return every loaded character whose corporation ID equals that corporation.","line":82,"pattern":"event-driven","exclusion":false,"verdict":"verified","evidence":"","charter":[],"tags":[],"scenarios":[{"title":"The Caldari Navy employs two loaded characters","line":86,"tags":[]}],"source":"  Rule: When the NPC characters of a corporation are requested, the SDE provider shall return every loaded character whose corporation ID equals that corporation.\n    A corporation's characters are its agents and officers; the list is what\n    an agent finder filters by corporation.\n\n    Scenario: The Caldari Navy employs two loaded characters\n      Given a static data provider with the reference data set\n      When I look up NPC characters of corporation 1000035\n      Then the result should contain exactly 2 records\n      And each returned record shall carry corporation 1000035","sourceStart":82,"findings":[]},{"id":"0014-sde-npc-organisations#R7","title":"When a name fragment is searched for among NPC characters, the SDE provider shall return the loaded NPC characters whose names contain that fragment, ignoring letter case, up to the requested limit.","line":92,"pattern":"event-driven","exclusion":false,"verdict":"verified","evidence":"","charter":[],"tags":[],"scenarios":[{"title":"Fragment AAK matches both Caldari Navy characters","line":97,"tags":[]},{"title":"A limit of 1 cuts the two matches to one","line":103,"tags":[]}],"source":"  Rule: When a name fragment is searched for among NPC characters, the SDE provider shall return the loaded NPC characters whose names contain that fragment, ignoring letter case, up to the requested limit.\n    An agent finder takes a typed name; a case-insensitive substring match\n    is what lets a user find an agent without the exact spelling. The limit\n    is 25 when the caller gives none.\n\n    Scenario: Fragment AAK matches both Caldari Navy characters\n      Given a static data provider with the reference data set\n      When the user searches for NPC characters matching \"AAK\"\n      Then the provider shall return NPC characters whose names contain \"AAK\"\n      And the result should contain exactly 2 records\n\n    Scenario: A limit of 1 cuts the two matches to one\n      Given a static data provider with the reference data set\n      When the user searches for NPC characters matching \"aak\" with a limit of 1\n      Then the provider shall return NPC characters whose names contain \"aak\"\n      And the result should contain exactly 1 record","sourceStart":92,"findings":[]},{"id":"0014-sde-npc-organisations#R8","title":"When a corporation activity ID present in the loaded data set is looked up, the SDE provider shall return the activity record carrying its name.","line":111,"pattern":"event-driven","exclusion":false,"verdict":"verified","evidence":"","charter":[],"tags":[],"scenarios":[{"title":"Corporation activity 1 resolves to Warfare","line":115,"tags":[]}],"source":"  Rule: When a corporation activity ID present in the loaded data set is looked up, the SDE provider shall return the activity record carrying its name.\n    An NPC corporation names its main activity by ID; the record gives the\n    label a corporation page shows.\n\n    Scenario: Corporation activity 1 resolves to Warfare\n      Given a static data provider with the reference data set\n      When I look up corporation activity 1\n      Then the returned record shall be named \"Warfare\"","sourceStart":111,"findings":[]},{"id":"0014-sde-npc-organisations#R9","title":"When every corporation activity is requested, the SDE provider shall return one record for each loaded activity.","line":120,"pattern":"event-driven","exclusion":false,"verdict":"verified","evidence":"","charter":[],"tags":[],"scenarios":[{"title":"The two loaded corporation activities are both returned","line":123,"tags":[]}],"source":"  Rule: When every corporation activity is requested, the SDE provider shall return one record for each loaded activity.\n    The activity table is small and read whole to build a filter.\n\n    Scenario: The two loaded corporation activities are both returned\n      Given a static data provider with the reference data set\n      When I look up every corporation activity\n      Then the result should contain exactly 2 records\n      And the result shall be the records named \"Security, Warfare\"","sourceStart":120,"findings":[]},{"id":"0014-sde-npc-organisations#R10","title":"When an NPC corporation division ID present in the loaded data set is looked up, the SDE provider shall return the division record carrying its name and its internal name.","line":129,"pattern":"event-driven","exclusion":false,"verdict":"verified","evidence":"","charter":[],"tags":[],"scenarios":[{"title":"NPC corporation division 1 resolves to Accounting","line":133,"tags":[]}],"source":"  Rule: When an NPC corporation division ID present in the loaded data set is looked up, the SDE provider shall return the division record carrying its name and its internal name.\n    Agents belong to a division of their corporation; the record gives the\n    division's display name and the internal name the client code uses.\n\n    Scenario: NPC corporation division 1 resolves to Accounting\n      Given a static data provider with the reference data set\n      When I look up NPC corporation division 1\n      Then the returned record shall be named \"Accounting\"\n      And the returned record shall carry the internal name \"accounting\"","sourceStart":129,"findings":[]},{"id":"0014-sde-npc-organisations#R11","title":"When every NPC corporation division is requested, the SDE provider shall return one record for each loaded division.","line":139,"pattern":"event-driven","exclusion":false,"verdict":"verified","evidence":"","charter":[],"tags":[],"scenarios":[{"title":"The two loaded divisions are both returned","line":143,"tags":[]}],"source":"  Rule: When every NPC corporation division is requested, the SDE provider shall return one record for each loaded division.\n    The division table is read whole to label the agents of a corporation\n    by division.\n\n    Scenario: The two loaded divisions are both returned\n      Given a static data provider with the reference data set\n      When I look up every NPC corporation division\n      Then the result should contain exactly 2 records\n      And the result shall be the records named \"Accounting, Administration\"","sourceStart":139,"findings":[]},{"id":"0014-sde-npc-organisations#R12","title":"When an agent type ID present in the loaded data set is looked up, the SDE provider shall return the agent type record carrying its name.","line":151,"pattern":"event-driven","exclusion":false,"verdict":"verified","evidence":"","charter":[],"tags":[],"scenarios":[{"title":"Agent type 2 resolves to BasicAgent","line":155,"tags":[]}],"source":"  Rule: When an agent type ID present in the loaded data set is looked up, the SDE provider shall return the agent type record carrying its name.\n    An agent names its type by ID; the type separates mission agents from\n    tutorial, research and storyline agents.\n\n    Scenario: Agent type 2 resolves to BasicAgent\n      Given a static data provider with the reference data set\n      When I look up agent type 2\n      Then the returned record shall be named \"BasicAgent\"","sourceStart":151,"findings":[]},{"id":"0014-sde-npc-organisations#R13","title":"When every agent type is requested, the SDE provider shall return one record for each loaded agent type.","line":160,"pattern":"event-driven","exclusion":false,"verdict":"verified","evidence":"","charter":[],"tags":[],"scenarios":[{"title":"The two loaded agent types are both returned","line":163,"tags":[]}],"source":"  Rule: When every agent type is requested, the SDE provider shall return one record for each loaded agent type.\n    The agent type table is read whole to build an agent finder's filter.\n\n    Scenario: The two loaded agent types are both returned\n      Given a static data provider with the reference data set\n      When I look up every agent type\n      Then the result should contain exactly 2 records\n      And the result shall be the records named \"BasicAgent, TutorialAgent\"","sourceStart":160,"findings":[]},{"id":"0014-sde-npc-organisations#R14","title":"When the character ID of an agent in space present in the loaded data set is looked up, the SDE provider shall return the record carrying its solar system ID and its dungeon ID.","line":169,"pattern":"event-driven","exclusion":false,"verdict":"verified","evidence":"","charter":[],"tags":[],"scenarios":[{"title":"Agent in space 3018681 sits in Jita","line":173,"tags":[]}],"source":"  Rule: When the character ID of an agent in space present in the loaded data set is looked up, the SDE provider shall return the record carrying its solar system ID and its dungeon ID.\n    Agents in space sit in a deadspace pocket rather than a station; the\n    record says which system and which dungeon holds them.\n\n    Scenario: Agent in space 3018681 sits in Jita\n      Given a static data provider with the reference data set\n      When I look up agent in space 3018681\n      Then the returned record shall carry solar system 30000142\n      And the returned record shall carry dungeon 1","sourceStart":169,"findings":[]},{"id":"0014-sde-npc-organisations#R15","title":"When the agents in space of a solar system are requested, the SDE provider shall return every loaded agent in space whose solar system ID equals that system, and an empty list for a system with none loaded.","line":179,"pattern":"event-driven","exclusion":false,"verdict":"verified","evidence":"","charter":[],"tags":[],"scenarios":[{"title":"Jita has one agent in space","line":183,"tags":[]},{"title":"Maurasi has no agents in space","line":189,"tags":[]}],"source":"  Rule: When the agents in space of a solar system are requested, the SDE provider shall return every loaded agent in space whose solar system ID equals that system, and an empty list for a system with none loaded.\n    A system overview lists the agents in space a pilot can visit there. A\n    system with none loaded answers with an empty list.\n\n    Scenario: Jita has one agent in space\n      Given a static data provider with the reference data set\n      When I look up agents in space in system 30000142\n      Then the result should contain exactly 1 record\n      And each returned record shall carry solar system 30000142\n\n    Scenario: Maurasi has no agents in space\n      Given a static data provider with the reference data set\n      When I look up agents in space in system 30000148\n      Then the provider shall return an empty list","sourceStart":179,"findings":[]},{"id":"0014-sde-npc-organisations#R16","title":"If an NPC corporation, NPC character, corporation activity, NPC corporation division, agent type or agent-in-space ID is absent from the loaded data set, then the SDE provider shall return null.","line":196,"pattern":"unwanted-behaviour","exclusion":false,"verdict":"verified","evidence":"","charter":[],"tags":[],"scenarios":[{"title":"Unknown NPC corporation 1 resolves to null","line":201,"tags":[]},{"title":"A player character ID resolves to no NPC character","line":206,"tags":[]},{"title":"Unknown corporation activity 99 resolves to null","line":211,"tags":[]},{"title":"Unknown NPC corporation division 99 resolves to null","line":216,"tags":[]},{"title":"Unknown agent type 99 resolves to null","line":221,"tags":[]},{"title":"A station agent's character ID resolves to no agent in space","line":226,"tags":[]}],"source":"  Rule: If an NPC corporation, NPC character, corporation activity, NPC corporation division, agent type or agent-in-space ID is absent from the loaded data set, then the SDE provider shall return null.\n    A partial extract may omit any of these tables, and a character ID from\n    a live response may be a player rather than an NPC; null is the answer\n    for a record that is not loaded.\n\n    Scenario: Unknown NPC corporation 1 resolves to null\n      Given a static data provider with the reference data set\n      When I look up NPC corporation 1\n      Then the provider shall return null\n\n    Scenario: A player character ID resolves to no NPC character\n      Given a static data provider with the reference data set\n      When I look up NPC character 90000001\n      Then the provider shall return null\n\n    Scenario: Unknown corporation activity 99 resolves to null\n      Given a static data provider with the reference data set\n      When I look up corporation activity 99\n      Then the provider shall return null\n\n    Scenario: Unknown NPC corporation division 99 resolves to null\n      Given a static data provider with the reference data set\n      When I look up NPC corporation division 99\n      Then the provider shall return null\n\n    Scenario: Unknown agent type 99 resolves to null\n      Given a static data provider with the reference data set\n      When I look up agent type 99\n      Then the provider shall return null\n\n    Scenario: A station agent's character ID resolves to no agent in space\n      Given a static data provider with the reference data set\n      When I look up agent in space 3004451\n      Then the provider shall return null","sourceStart":196,"findings":[]}],"noUnwantedBehaviour":false,"orphanScenarios":0},{"file":"tests/bdd/features/sde/0015-sde-presentation-tables.feature","area":"sde","name":"Presentation Tables","tags":["@TEST-10"],"charter":["TEST-10"],"description":"Several SDE tables exist so a client can draw things: meta groups label a type's tech level, icons and graphics name the image and model files a type points at, skins and skin licences describe ship paint jobs, and notification types name the kinds of in-game notification. This feature covers those lookups.\n\nA fitting tool or an inventory viewer holds these IDs from a type record or a live notification and resolves them here.","boundBy":["tests/bdd/specs/sde/0015-sde-presentation-tables.spec.ts"],"rules":[{"id":"0015-sde-presentation-tables#R1","title":"When a meta group ID present in the loaded data set is looked up, the SDE provider shall return the meta group record carrying its name.","line":14,"pattern":"event-driven","exclusion":false,"verdict":"verified","evidence":"","charter":[],"tags":[],"scenarios":[{"title":"Meta group 2 resolves to Tech II","line":18,"tags":[]}],"source":"  Rule: When a meta group ID present in the loaded data set is looked up, the SDE provider shall return the meta group record carrying its name.\n    A type's meta group is its tech level — Tech I, Tech II, Faction — and\n    the name is what an item list shows beside the type.\n\n    Scenario: Meta group 2 resolves to Tech II\n      Given a static data provider with the reference data set\n      When I look up meta group 2\n      Then the returned record shall be named \"Tech II\"","sourceStart":14,"findings":[]},{"id":"0015-sde-presentation-tables#R2","title":"When every meta group is requested, the SDE provider shall return one record for each loaded meta group.","line":23,"pattern":"event-driven","exclusion":false,"verdict":"verified","evidence":"","charter":[],"tags":[],"scenarios":[{"title":"The two loaded meta groups are both returned","line":27,"tags":[]}],"source":"  Rule: When every meta group is requested, the SDE provider shall return one record for each loaded meta group.\n    The meta group table is small and read whole to build a tech level\n    filter.\n\n    Scenario: The two loaded meta groups are both returned\n      Given a static data provider with the reference data set\n      When I look up every meta group\n      Then the result should contain exactly 2 records\n      And the result shall be the records named \"Tech I, Tech II\"","sourceStart":23,"findings":[]},{"id":"0015-sde-presentation-tables#R3","title":"When an icon ID present in the loaded data set is looked up, the SDE provider shall return the icon record carrying its icon file path.","line":35,"pattern":"event-driven","exclusion":false,"verdict":"verified","evidence":"","charter":[],"tags":[],"scenarios":[{"title":"Icon 22 resolves to its image file","line":39,"tags":[]}],"source":"  Rule: When an icon ID present in the loaded data set is looked up, the SDE provider shall return the icon record carrying its icon file path.\n    Types, groups and market groups name an icon by ID; the record gives\n    the resource path of the image to draw.\n\n    Scenario: Icon 22 resolves to its image file\n      Given a static data provider with the reference data set\n      When I look up icon 22\n      Then the returned record shall carry the icon file \"res:/UI/Texture/Icons/22_32_2.png\"","sourceStart":35,"findings":[]},{"id":"0015-sde-presentation-tables#R4","title":"When a graphic ID present in the loaded data set is looked up, the SDE provider shall return the graphic record carrying its graphic file path.","line":44,"pattern":"event-driven","exclusion":false,"verdict":"verified","evidence":"","charter":[],"tags":[],"scenarios":[{"title":"Graphic 20 resolves to its model file","line":48,"tags":[]}],"source":"  Rule: When a graphic ID present in the loaded data set is looked up, the SDE provider shall return the graphic record carrying its graphic file path.\n    A type names its 3D model by graphic ID; the record gives the resource\n    path of the model.\n\n    Scenario: Graphic 20 resolves to its model file\n      Given a static data provider with the reference data set\n      When I look up graphic 20\n      Then the returned record shall carry the graphic file \"res:/dx9/model/worldobject/asteroid/oreveld001.red\"","sourceStart":44,"findings":[]},{"id":"0015-sde-presentation-tables#R5","title":"When a skin ID present in the loaded data set is looked up, the SDE provider shall return the skin record carrying its internal name.","line":55,"pattern":"event-driven","exclusion":false,"verdict":"verified","evidence":"","charter":[],"tags":[],"scenarios":[{"title":"Skin 1 resolves to Tristan Sanctuary","line":59,"tags":[]}],"source":"  Rule: When a skin ID present in the loaded data set is looked up, the SDE provider shall return the skin record carrying its internal name.\n    A skin is a paint job for one or more hulls; the internal name is the\n    label the SDE gives it.\n\n    Scenario: Skin 1 resolves to Tristan Sanctuary\n      Given a static data provider with the reference data set\n      When I look up skin 1\n      Then the returned record shall carry the internal name \"Tristan Sanctuary\"","sourceStart":55,"findings":[]},{"id":"0015-sde-presentation-tables#R6","title":"When a skin licence type ID present in the loaded data set is looked up, the SDE provider shall return the licence record carrying its skin ID and its duration.","line":64,"pattern":"event-driven","exclusion":false,"verdict":"verified","evidence":"","charter":[],"tags":[],"scenarios":[{"title":"Licence 34599 grants skin 1 permanently","line":68,"tags":[]}],"source":"  Rule: When a skin licence type ID present in the loaded data set is looked up, the SDE provider shall return the licence record carrying its skin ID and its duration.\n    The licence is the market item that grants a skin; its type ID is what a\n    market order carries, and the duration says whether it is permanent.\n\n    Scenario: Licence 34599 grants skin 1 permanently\n      Given a static data provider with the reference data set\n      When I look up skin license 34599\n      Then the returned record shall carry skin 1\n      And the returned record shall carry duration -1","sourceStart":64,"findings":[]},{"id":"0015-sde-presentation-tables#R7","title":"When the skin licences of a skin are requested, the SDE provider shall return every loaded licence whose skin ID equals that skin, and an empty list for a skin with none loaded.","line":74,"pattern":"event-driven","exclusion":false,"verdict":"verified","evidence":"","charter":[],"tags":[],"scenarios":[{"title":"Skin 1 has two licences","line":78,"tags":[]},{"title":"Skin 2 has no licences loaded","line":84,"tags":[]}],"source":"  Rule: When the skin licences of a skin are requested, the SDE provider shall return every loaded licence whose skin ID equals that skin, and an empty list for a skin with none loaded.\n    A skin page lists the licences that grant it; a skin with no licence\n    loaded answers with an empty list.\n\n    Scenario: Skin 1 has two licences\n      Given a static data provider with the reference data set\n      When I look up skin licenses of skin 1\n      Then the result should contain exactly 2 records\n      And each returned record shall carry skin 1\n\n    Scenario: Skin 2 has no licences loaded\n      Given a static data provider with the reference data set\n      When I look up skin licenses of skin 2\n      Then the provider shall return an empty list","sourceStart":74,"findings":[]},{"id":"0015-sde-presentation-tables#R8","title":"When a notification type ID present in the loaded data set is looked up, the SDE provider shall return the notification type record carrying its display name and its internal name.","line":91,"pattern":"event-driven","exclusion":false,"verdict":"verified","evidence":"","charter":[],"tags":[],"scenarios":[{"title":"Notification type 1 resolves to Old Notification","line":95,"tags":[]}],"source":"  Rule: When a notification type ID present in the loaded data set is looked up, the SDE provider shall return the notification type record carrying its display name and its internal name.\n    A live notification carries a type ID; the record gives the display name\n    a client shows and the internal name the game code uses.\n\n    Scenario: Notification type 1 resolves to Old Notification\n      Given a static data provider with the reference data set\n      When I look up notification type 1\n      Then the returned record shall carry the display name \"Old Notification\"\n      And the returned record shall carry the internal name \"notificationTypeOldNotification\"","sourceStart":91,"findings":[]},{"id":"0015-sde-presentation-tables#R9","title":"If a meta group, icon, graphic, skin, skin licence or notification type ID is absent from the loaded data set, then the SDE provider shall return null.","line":103,"pattern":"unwanted-behaviour","exclusion":false,"verdict":"verified","evidence":"","charter":[],"tags":[],"scenarios":[{"title":"Unknown meta group 99 resolves to null","line":108,"tags":[]},{"title":"Unknown icon 99 resolves to null","line":113,"tags":[]},{"title":"Unknown graphic 99 resolves to null","line":118,"tags":[]},{"title":"Unknown skin 99 resolves to null","line":123,"tags":[]},{"title":"Unknown skin licence 99 resolves to null","line":128,"tags":[]},{"title":"Unknown notification type 99 resolves to null","line":133,"tags":[]}],"source":"  Rule: If a meta group, icon, graphic, skin, skin licence or notification type ID is absent from the loaded data set, then the SDE provider shall return null.\n    Icon and graphic IDs on a type record may be null or point at a\n    resource an extract left out; null is the answer for a record that is\n    not loaded.\n\n    Scenario: Unknown meta group 99 resolves to null\n      Given a static data provider with the reference data set\n      When I look up meta group 99\n      Then the provider shall return null\n\n    Scenario: Unknown icon 99 resolves to null\n      Given a static data provider with the reference data set\n      When I look up icon 99\n      Then the provider shall return null\n\n    Scenario: Unknown graphic 99 resolves to null\n      Given a static data provider with the reference data set\n      When I look up graphic 99\n      Then the provider shall return null\n\n    Scenario: Unknown skin 99 resolves to null\n      Given a static data provider with the reference data set\n      When I look up skin 99\n      Then the provider shall return null\n\n    Scenario: Unknown skin licence 99 resolves to null\n      Given a static data provider with the reference data set\n      When I look up skin license 99\n      Then the provider shall return null\n\n    Scenario: Unknown notification type 99 resolves to null\n      Given a static data provider with the reference data set\n      When I look up notification type 99\n      Then the provider shall return null","sourceStart":103,"findings":[]}],"noUnwantedBehaviour":false,"orphanScenarios":0},{"file":"tests/bdd/features/sde/0016-sde-universe-reference.feature","area":"sde","name":"Universe Reference Tables","tags":["@TEST-10"],"charter":["TEST-10"],"description":"Beside the map itself, the SDE carries reference tables about places: landmarks with a position in space, secondary suns placed in some systems, and the operations and services an NPC station offers. This feature covers those lookups.\n\nA map tool draws landmarks and secondary suns; a station browser turns a station's operation ID and service IDs into labels.","boundBy":["tests/bdd/specs/sde/0016-sde-universe-reference.spec.ts"],"rules":[{"id":"0016-sde-universe-reference#R1","title":"When a landmark ID present in the loaded data set is looked up, the SDE provider shall return the landmark record carrying its name.","line":13,"pattern":"event-driven","exclusion":false,"verdict":"verified","evidence":"","charter":[],"tags":[],"scenarios":[{"title":"Landmark 1 resolves to the EVE Gate","line":17,"tags":[]}],"source":"  Rule: When a landmark ID present in the loaded data set is looked up, the SDE provider shall return the landmark record carrying its name.\n    Landmarks are named points of interest in space; the name is what a map\n    draws at the position.\n\n    Scenario: Landmark 1 resolves to the EVE Gate\n      Given a static data provider with the reference data set\n      When I look up landmark 1\n      Then the returned record shall be named \"EVE Gate\"","sourceStart":13,"findings":[]},{"id":"0016-sde-universe-reference#R2","title":"When every landmark is requested, the SDE provider shall return one record for each loaded landmark.","line":22,"pattern":"event-driven","exclusion":false,"verdict":"verified","evidence":"","charter":[],"tags":[],"scenarios":[{"title":"The two loaded landmarks are both returned","line":25,"tags":[]}],"source":"  Rule: When every landmark is requested, the SDE provider shall return one record for each loaded landmark.\n    A map draws every landmark, so the table is read whole.\n\n    Scenario: The two loaded landmarks are both returned\n      Given a static data provider with the reference data set\n      When I look up every landmark\n      Then the result should contain exactly 2 records\n      And the result shall be the records named \"EVE Gate, Jita 4-4\"","sourceStart":22,"findings":[]},{"id":"0016-sde-universe-reference#R3","title":"When a secondary sun ID present in the loaded data set is looked up, the SDE provider shall return the record carrying its solar system ID and its type ID.","line":33,"pattern":"event-driven","exclusion":false,"verdict":"verified","evidence":"","charter":[],"tags":[],"scenarios":[{"title":"Secondary sun 1 sits in Jita","line":37,"tags":[]}],"source":"  Rule: When a secondary sun ID present in the loaded data set is looked up, the SDE provider shall return the record carrying its solar system ID and its type ID.\n    A secondary sun is an object placed in a system with a system-wide\n    effect; the record says which system holds it and which type it is.\n\n    Scenario: Secondary sun 1 sits in Jita\n      Given a static data provider with the reference data set\n      When I look up secondary sun 1\n      Then the returned record shall carry solar system 30000142\n      And the returned record shall carry type 46764","sourceStart":33,"findings":[]},{"id":"0016-sde-universe-reference#R4","title":"When the secondary suns of a solar system are requested, the SDE provider shall return every loaded secondary sun whose solar system ID equals that system, and an empty list for a system with none.","line":43,"pattern":"event-driven","exclusion":false,"verdict":"verified","evidence":"","charter":[],"tags":[],"scenarios":[{"title":"Jita has one secondary sun","line":47,"tags":[]},{"title":"Maurasi has no secondary sun","line":53,"tags":[]}],"source":"  Rule: When the secondary suns of a solar system are requested, the SDE provider shall return every loaded secondary sun whose solar system ID equals that system, and an empty list for a system with none.\n    Most systems have no secondary sun, and a system overview asks for\n    them by system; an empty list is the ordinary answer.\n\n    Scenario: Jita has one secondary sun\n      Given a static data provider with the reference data set\n      When I look up secondary suns in system 30000142\n      Then the result should contain exactly 1 record\n      And each returned record shall carry solar system 30000142\n\n    Scenario: Maurasi has no secondary sun\n      Given a static data provider with the reference data set\n      When I look up secondary suns in system 30000148\n      Then the provider shall return an empty list","sourceStart":43,"findings":[]},{"id":"0016-sde-universe-reference#R5","title":"When a station operation ID present in the loaded data set is looked up, the SDE provider shall return the operation record carrying its operation name.","line":60,"pattern":"event-driven","exclusion":false,"verdict":"verified","evidence":"","charter":[],"tags":[],"scenarios":[{"title":"Station operation 2 resolves to Refinery","line":65,"tags":[]}],"source":"  Rule: When a station operation ID present in the loaded data set is looked up, the SDE provider shall return the operation record carrying its operation name.\n    An NPC station names its operation by ID; the operation name is the\n    station's purpose — Manufacturing, Refinery — as a station browser\n    labels it.\n\n    Scenario: Station operation 2 resolves to Refinery\n      Given a static data provider with the reference data set\n      When I look up station operation 2\n      Then the returned record shall carry the operation name \"Refinery\"","sourceStart":60,"findings":[]},{"id":"0016-sde-universe-reference#R6","title":"When every station operation is requested, the SDE provider shall return one record for each loaded operation.","line":70,"pattern":"event-driven","exclusion":false,"verdict":"verified","evidence":"","charter":[],"tags":[],"scenarios":[{"title":"The two loaded station operations are both returned","line":73,"tags":[]}],"source":"  Rule: When every station operation is requested, the SDE provider shall return one record for each loaded operation.\n    The operation table is small and read whole to build a station filter.\n\n    Scenario: The two loaded station operations are both returned\n      Given a static data provider with the reference data set\n      When I look up every station operation\n      Then the result should contain exactly 2 records\n      And the result shall be the records with operation names \"Manufacturing, Refinery\"","sourceStart":70,"findings":[]},{"id":"0016-sde-universe-reference#R7","title":"When a station service ID present in the loaded data set is looked up, the SDE provider shall return the service record carrying its service name.","line":79,"pattern":"event-driven","exclusion":false,"verdict":"verified","evidence":"","charter":[],"tags":[],"scenarios":[{"title":"Station service 1 resolves to Bounty Missions","line":83,"tags":[]}],"source":"  Rule: When a station service ID present in the loaded data set is looked up, the SDE provider shall return the service record carrying its service name.\n    A station's services are what a pilot can do there; the service name is\n    the label a station browser shows for each.\n\n    Scenario: Station service 1 resolves to Bounty Missions\n      Given a static data provider with the reference data set\n      When I look up station service 1\n      Then the returned record shall carry the service name \"Bounty Missions\"","sourceStart":79,"findings":[]},{"id":"0016-sde-universe-reference#R8","title":"When every station service is requested, the SDE provider shall return one record for each loaded service.","line":88,"pattern":"event-driven","exclusion":false,"verdict":"verified","evidence":"","charter":[],"tags":[],"scenarios":[{"title":"The two loaded station services are both returned","line":91,"tags":[]}],"source":"  Rule: When every station service is requested, the SDE provider shall return one record for each loaded service.\n    The service table is small and read whole to build a station filter.\n\n    Scenario: The two loaded station services are both returned\n      Given a static data provider with the reference data set\n      When I look up every station service\n      Then the result should contain exactly 2 records\n      And the result shall be the records with service names \"Assassination Missions, Bounty Missions\"","sourceStart":88,"findings":[]},{"id":"0016-sde-universe-reference#R9","title":"If a landmark, secondary sun, station operation or station service ID is absent from the loaded data set, then the SDE provider shall return null.","line":99,"pattern":"unwanted-behaviour","exclusion":false,"verdict":"verified","evidence":"","charter":[],"tags":[],"scenarios":[{"title":"Unknown landmark 99 resolves to null","line":103,"tags":[]},{"title":"Unknown secondary sun 99 resolves to null","line":108,"tags":[]},{"title":"Unknown station operation 99 resolves to null","line":113,"tags":[]},{"title":"Unknown station service 99 resolves to null","line":118,"tags":[]}],"source":"  Rule: If a landmark, secondary sun, station operation or station service ID is absent from the loaded data set, then the SDE provider shall return null.\n    A partial extract may omit any of these tables; null is the answer for\n    a record that is not loaded.\n\n    Scenario: Unknown landmark 99 resolves to null\n      Given a static data provider with the reference data set\n      When I look up landmark 99\n      Then the provider shall return null\n\n    Scenario: Unknown secondary sun 99 resolves to null\n      Given a static data provider with the reference data set\n      When I look up secondary sun 99\n      Then the provider shall return null\n\n    Scenario: Unknown station operation 99 resolves to null\n      Given a static data provider with the reference data set\n      When I look up station operation 99\n      Then the provider shall return null\n\n    Scenario: Unknown station service 99 resolves to null\n      Given a static data provider with the reference data set\n      When I look up station service 99\n      Then the provider shall return null","sourceStart":99,"findings":[]}],"noUnwantedBehaviour":false,"orphanScenarios":0},{"file":"tests/bdd/features/sde/0017-sde-industry-reference.feature","area":"sde","name":"Industry Reference Tables","tags":["@TEST-10"],"charter":["TEST-10"],"description":"Feature 0004 looks up one blueprint and one planetary schematic. Industry also needs the schematic table whole, the industry activities a job can run, the certificates that recommend skills for a hull, and the three per-type extension tables: a type's dogma attributes and effects, its reprocessing materials, and a ship's role bonuses. This feature covers those lookups.\n\nAn industry tool joins a live job's activity ID to a name here, and a fitting tool reads a type's dogma and bonuses before it can evaluate a fit.","boundBy":["tests/bdd/specs/sde/0017-sde-industry-reference.spec.ts"],"rules":[{"id":"0017-sde-industry-reference#R1","title":"When every planetary schematic is requested, the SDE provider shall return one record for each loaded schematic.","line":15,"pattern":"event-driven","exclusion":false,"verdict":"verified","evidence":"","charter":[],"tags":[],"scenarios":[{"title":"The two loaded schematics are both returned","line":19,"tags":[]}],"source":"  Rule: When every planetary schematic is requested, the SDE provider shall return one record for each loaded schematic.\n    A planetary industry planner reads the schematic table whole to lay out\n    a production chain.\n\n    Scenario: The two loaded schematics are both returned\n      Given a static data provider with the reference data set\n      When I look up every planet schematic\n      Then the result should contain exactly 2 records\n      And the result shall be the records named \"Bacteria, Biofuels\"","sourceStart":15,"findings":[]},{"id":"0017-sde-industry-reference#R2","title":"When an industry activity ID present in the loaded data set is looked up, the SDE provider shall return the activity record carrying its name.","line":25,"pattern":"event-driven","exclusion":false,"verdict":"verified","evidence":"","charter":[],"tags":[],"scenarios":[{"title":"Industry activity 3 resolves to Time Efficiency Research","line":29,"tags":[]}],"source":"  Rule: When an industry activity ID present in the loaded data set is looked up, the SDE provider shall return the activity record carrying its name.\n    A live industry job names its activity by ID; the record gives the name\n    an industry tool shows — Manufacturing, Time Efficiency Research.\n\n    Scenario: Industry activity 3 resolves to Time Efficiency Research\n      Given a static data provider with the reference data set\n      When I look up industry activity 3\n      Then the returned record shall be named \"Time Efficiency Research\"","sourceStart":25,"findings":[]},{"id":"0017-sde-industry-reference#R3","title":"When every industry activity is requested, the SDE provider shall return one record for each loaded activity.","line":34,"pattern":"event-driven","exclusion":false,"verdict":"verified","evidence":"","charter":[],"tags":[],"scenarios":[{"title":"The two loaded industry activities are both returned","line":37,"tags":[]}],"source":"  Rule: When every industry activity is requested, the SDE provider shall return one record for each loaded activity.\n    The activity table is small and read whole to build a job filter.\n\n    Scenario: The two loaded industry activities are both returned\n      Given a static data provider with the reference data set\n      When I look up every industry activity\n      Then the result should contain exactly 2 records\n      And the result shall be the records named \"Manufacturing, Time Efficiency Research\"","sourceStart":34,"findings":[]},{"id":"0017-sde-industry-reference#R4","title":"When a certificate ID present in the loaded data set is looked up, the SDE provider shall return the certificate record carrying its name.","line":45,"pattern":"event-driven","exclusion":false,"verdict":"verified","evidence":"","charter":[],"tags":[],"scenarios":[{"title":"Certificate 50 resolves to Core Fitting","line":49,"tags":[]}],"source":"  Rule: When a certificate ID present in the loaded data set is looked up, the SDE provider shall return the certificate record carrying its name.\n    A certificate groups the skills recommended for a hull at each mastery\n    level; the name is what a ship page shows.\n\n    Scenario: Certificate 50 resolves to Core Fitting\n      Given a static data provider with the reference data set\n      When I look up certificate 50\n      Then the returned record shall be named \"Core Fitting\"","sourceStart":45,"findings":[]},{"id":"0017-sde-industry-reference#R5","title":"When every certificate is requested, the SDE provider shall return one record for each loaded certificate.","line":54,"pattern":"event-driven","exclusion":false,"verdict":"verified","evidence":"","charter":[],"tags":[],"scenarios":[{"title":"The two loaded certificates are both returned","line":58,"tags":[]}],"source":"  Rule: When every certificate is requested, the SDE provider shall return one record for each loaded certificate.\n    A skill planner reads the certificate table whole to score a character\n    against every one.\n\n    Scenario: The two loaded certificates are both returned\n      Given a static data provider with the reference data set\n      When I look up every certificate\n      Then the result should contain exactly 2 records\n      And the result shall be the records named \"Core Fitting, Core Navigation\"","sourceStart":54,"findings":[]},{"id":"0017-sde-industry-reference#R6","title":"When the dogma of a type ID present in the loaded data set is looked up, the SDE provider shall return the type dogma record carrying its type ID and its dogma attributes.","line":66,"pattern":"event-driven","exclusion":false,"verdict":"verified","evidence":"","charter":[],"tags":[],"scenarios":[{"title":"Type 34 has a dogma record","line":70,"tags":[]}],"source":"  Rule: When the dogma of a type ID present in the loaded data set is looked up, the SDE provider shall return the type dogma record carrying its type ID and its dogma attributes.\n    A type's attribute values live in this table rather than on the type\n    record; a fitting tool reads them to evaluate a fit.\n\n    Scenario: Type 34 has a dogma record\n      Given a static data provider with the reference data set\n      When I look up type dogma 34\n      Then the returned record shall carry type 34\n      And the returned record shall list 1 dogma attribute","sourceStart":66,"findings":[]},{"id":"0017-sde-industry-reference#R7","title":"When the materials of a type ID present in the loaded data set is looked up, the SDE provider shall return the type material record carrying its type ID and its materials.","line":76,"pattern":"event-driven","exclusion":false,"verdict":"verified","evidence":"","charter":[],"tags":[],"scenarios":[{"title":"Type 34 has a material record","line":80,"tags":[]}],"source":"  Rule: When the materials of a type ID present in the loaded data set is looked up, the SDE provider shall return the type material record carrying its type ID and its materials.\n    Reprocessing yields are the materials on this record; a reprocessing\n    calculator reads them by type.\n\n    Scenario: Type 34 has a material record\n      Given a static data provider with the reference data set\n      When I look up type material 34\n      Then the returned record shall carry type 34\n      And the returned record shall list 1 material","sourceStart":76,"findings":[]},{"id":"0017-sde-industry-reference#R8","title":"When the bonuses of a type ID present in the loaded data set is looked up, the SDE provider shall return the type bonus record carrying its type ID and its role bonuses.","line":86,"pattern":"event-driven","exclusion":false,"verdict":"verified","evidence":"","charter":[],"tags":[],"scenarios":[{"title":"Type 601 has a bonus record","line":90,"tags":[]}],"source":"  Rule: When the bonuses of a type ID present in the loaded data set is looked up, the SDE provider shall return the type bonus record carrying its type ID and its role bonuses.\n    A ship's role bonuses are the text a ship page shows under its traits;\n    they live in this table, keyed by the hull's type ID.\n\n    Scenario: Type 601 has a bonus record\n      Given a static data provider with the reference data set\n      When I look up type bonus 601\n      Then the returned record shall carry type 601\n      And the returned record shall list 1 role bonus","sourceStart":86,"findings":[]},{"id":"0017-sde-industry-reference#R9","title":"If an industry activity or certificate ID is absent, or a type has no dogma, material or bonus record in the loaded data set, then the SDE provider shall return null.","line":98,"pattern":"unwanted-behaviour","exclusion":false,"verdict":"verified","evidence":"","charter":[],"tags":[],"scenarios":[{"title":"Unknown industry activity 99 resolves to null","line":102,"tags":[]},{"title":"Unknown certificate 99 resolves to null","line":107,"tags":[]},{"title":"Type 35 has no dogma record","line":112,"tags":[]},{"title":"Type 35 has no material record","line":117,"tags":[]},{"title":"Type 34 has no bonus record","line":122,"tags":[]}],"source":"  Rule: If an industry activity or certificate ID is absent, or a type has no dogma, material or bonus record in the loaded data set, then the SDE provider shall return null.\n    Most types have no bonus record and many have no material record, so\n    a null answer is ordinary, not a fault.\n\n    Scenario: Unknown industry activity 99 resolves to null\n      Given a static data provider with the reference data set\n      When I look up industry activity 99\n      Then the provider shall return null\n\n    Scenario: Unknown certificate 99 resolves to null\n      Given a static data provider with the reference data set\n      When I look up certificate 99\n      Then the provider shall return null\n\n    Scenario: Type 35 has no dogma record\n      Given a static data provider with the reference data set\n      When I look up type dogma 35\n      Then the provider shall return null\n\n    Scenario: Type 35 has no material record\n      Given a static data provider with the reference data set\n      When I look up type material 35\n      Then the provider shall return null\n\n    Scenario: Type 34 has no bonus record\n      Given a static data provider with the reference data set\n      When I look up type bonus 34\n      Then the provider shall return null","sourceStart":98,"findings":[]}],"noUnwantedBehaviour":false,"orphanScenarios":0},{"file":"tests/bdd/features/sde/0018-sde-mission-content.feature","area":"sde","name":"Mission Content","tags":["@TEST-10"],"charter":["TEST-10"],"description":"The SDE describes the content agents hand out: missions, the dungeons — deadspace pockets — those missions send a pilot into, and the epic arcs that chain missions into a story. This feature covers those lookups.\n\nA mission tool joins a live agent offer to the mission record and shows the epic arc it belongs to.","boundBy":["tests/bdd/specs/sde/0018-sde-mission-content.spec.ts"],"rules":[{"id":"0018-sde-mission-content#R1","title":"When a mission ID present in the loaded data set is looked up, the SDE provider shall return the mission record carrying its name.","line":12,"pattern":"event-driven","exclusion":false,"verdict":"verified","evidence":"","charter":[],"tags":[],"scenarios":[{"title":"Mission 1 resolves to Cash Flow for Capsuleers","line":16,"tags":[]}],"source":"  Rule: When a mission ID present in the loaded data set is looked up, the SDE provider shall return the mission record carrying its name.\n    A mission offer names its mission by ID; the record gives the title a\n    mission tool shows.\n\n    Scenario: Mission 1 resolves to Cash Flow for Capsuleers\n      Given a static data provider with the reference data set\n      When I look up mission 1\n      Then the returned record shall be named \"Cash Flow for Capsuleers\"","sourceStart":12,"findings":[]},{"id":"0018-sde-mission-content#R2","title":"When a dungeon ID present in the loaded data set is looked up, the SDE provider shall return the dungeon record carrying its name and its faction ID.","line":21,"pattern":"event-driven","exclusion":false,"verdict":"verified","evidence":"","charter":[],"tags":[],"scenarios":[{"title":"Dungeon 1 resolves to its name and faction","line":25,"tags":[]}],"source":"  Rule: When a dungeon ID present in the loaded data set is looked up, the SDE provider shall return the dungeon record carrying its name and its faction ID.\n    A dungeon is the pocket a mission or an agent in space uses; the faction\n    ID says whose ships spawn in it.\n\n    Scenario: Dungeon 1 resolves to its name and faction\n      Given a static data provider with the reference data set\n      When I look up dungeon 1\n      Then the returned record shall be named \"Cash Flow Dungeon\"\n      And the returned record shall carry faction 500004","sourceStart":21,"findings":[]},{"id":"0018-sde-mission-content#R3","title":"When an epic arc ID present in the loaded data set is looked up, the SDE provider shall return the epic arc record carrying its name and its faction ID.","line":31,"pattern":"event-driven","exclusion":false,"verdict":"verified","evidence":"","charter":[],"tags":[],"scenarios":[{"title":"Epic arc 1 resolves to The Blood-Stained Stars","line":35,"tags":[]}],"source":"  Rule: When an epic arc ID present in the loaded data set is looked up, the SDE provider shall return the epic arc record carrying its name and its faction ID.\n    An epic arc is a story of chained missions offered by one faction; the\n    record gives its title and the faction that runs it.\n\n    Scenario: Epic arc 1 resolves to The Blood-Stained Stars\n      Given a static data provider with the reference data set\n      When I look up epic arc 1\n      Then the returned record shall be named \"The Blood-Stained Stars\"\n      And the returned record shall carry faction 500001","sourceStart":31,"findings":[]},{"id":"0018-sde-mission-content#R4","title":"When every epic arc is requested, the SDE provider shall return one record for each loaded epic arc.","line":41,"pattern":"event-driven","exclusion":false,"verdict":"verified","evidence":"","charter":[],"tags":[],"scenarios":[{"title":"The two loaded epic arcs are both returned","line":44,"tags":[]}],"source":"  Rule: When every epic arc is requested, the SDE provider shall return one record for each loaded epic arc.\n    There are few epic arcs and a mission tool lists them all.\n\n    Scenario: The two loaded epic arcs are both returned\n      Given a static data provider with the reference data set\n      When I look up every epic arc\n      Then the result should contain exactly 2 records\n      And the result shall be the records named \"Penumbra, The Blood-Stained Stars\"","sourceStart":41,"findings":[]},{"id":"0018-sde-mission-content#R5","title":"If a mission, dungeon or epic arc ID is absent from the loaded data set, then the SDE provider shall return null.","line":52,"pattern":"unwanted-behaviour","exclusion":false,"verdict":"verified","evidence":"","charter":[],"tags":[],"scenarios":[{"title":"Unknown mission 99 resolves to null","line":56,"tags":[]},{"title":"Unknown dungeon 99 resolves to null","line":61,"tags":[]},{"title":"Unknown epic arc 99 resolves to null","line":66,"tags":[]}],"source":"  Rule: If a mission, dungeon or epic arc ID is absent from the loaded data set, then the SDE provider shall return null.\n    Content tables are large and an extract may carry only some of them;\n    null is the answer for a record that is not loaded.\n\n    Scenario: Unknown mission 99 resolves to null\n      Given a static data provider with the reference data set\n      When I look up mission 99\n      Then the provider shall return null\n\n    Scenario: Unknown dungeon 99 resolves to null\n      Given a static data provider with the reference data set\n      When I look up dungeon 99\n      Then the provider shall return null\n\n    Scenario: Unknown epic arc 99 resolves to null\n      Given a static data provider with the reference data set\n      When I look up epic arc 99\n      Then the provider shall return null","sourceStart":52,"findings":[]}],"noUnwantedBehaviour":false,"orphanScenarios":0},{"file":"tests/bdd/features/sde/0019-sde-generic-access.feature","area":"sde","name":"Generic Entity Access","tags":["@TEST-10"],"charter":["TEST-10"],"description":"The SDE has more tables than the provider has typed lookups for. The two generic accessors reach any loaded table by its table name — the name the ingestion registry gives it, such as eve_types — so a caller can read a niche table without waiting for a typed method.\n\nThe records come back untyped; the caller knows the table's shape.","boundBy":["tests/bdd/specs/sde/0019-sde-generic-access.spec.ts"],"rules":[{"id":"0019-sde-generic-access#R1","title":"When an entity is looked up by a loaded t
