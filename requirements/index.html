lones client shall reject with an error whose message carries the reason reported by ESI.","line":58,"pattern":"unwanted-behaviour","exclusion":false,"verdict":"verified","evidence":"","charter":[],"tags":[],"scenarios":[{"title":"Expired token rejects with the reason reported by ESI","line":63,"tags":[]}],"source":"  Rule: If a clone request is rejected, then the Clones client shall reject with an error whose message carries the reason reported by ESI.\n    Clone endpoints are token-scoped and tokens expire mid-session. Preserving\n    the server's own wording is what lets a caller tell an expired token from\n    a missing scope without inspecting the status code.\n\n    Scenario: Expired token rejects with the reason reported by ESI\n      Given an invalid access token for clones\n      When the client requests clone information without authorization\n      Then the client shall return an authentication error for clones","sourceStart":58,"findings":[]}],"noUnwantedBehaviour":false,"orphanScenarios":0},{"file":"tests/bdd/features/core/0008-contacts.feature","area":"core","name":"Contact Management","tags":["@TEST-10"],"charter":["TEST-10"],"description":"The Contacts client covers the contact lists a character or a corporation keeps, together with the labels used to group them. Standings on these lists drive who a consuming application treats as friendly and who it flags, so the entry shape and the sign of the standing both matter. The character list is writable: contacts can be added at a chosen standing and removed by ID.","boundBy":["tests/bdd/step-definitions/core/contacts.steps.ts"],"rules":[{"id":"0008-contacts#R1","title":"When a contact list is requested for a character ID or a corporation ID, the Contacts client shall return an array whose entries each carry contact_id, contact_type, and standing, and label_ids when present.","line":11,"pattern":"event-driven","exclusion":false,"verdict":"verified","evidence":"","charter":[],"tags":[],"scenarios":[{"title":"Character contact list spanning character, corporation, and alliance entries","line":17,"tags":[]},{"title":"Corporation contact list holding an allied alliance and a hostile character","line":22,"tags":[]}],"source":"  Rule: When a contact list is requested for a character ID or a corporation ID, the Contacts client shall return an array whose entries each carry contact_id, contact_type, and standing, and label_ids when present.\n    The contact_type discriminates a character from a corporation from an\n    alliance, which is what tells the caller which domain to resolve the ID\n    against. Standings run negative as well as positive, and the sign is the\n    whole point of the entry, so it survives the round trip untouched.\n\n    Scenario: Character contact list spanning character, corporation, and alliance entries\n      Given a character with contacts\n      When the client requests character contacts\n      Then the client shall return a list of contacts with standings\n\n    Scenario: Corporation contact list holding an allied alliance and a hostile character\n      Given a valid corporation ID for contacts\n      When the client requests corporation contacts\n      Then the client shall return the corporation contact list","sourceStart":11,"findings":[]},{"id":"0008-contacts#R2","title":"If a character has no contacts, then the Contacts client shall return an empty array.","line":27,"pattern":"unwanted-behaviour","exclusion":false,"verdict":"verified","evidence":"","charter":[],"tags":[],"scenarios":[{"title":"Character with an empty contact list","line":32,"tags":[]}],"source":"  Rule: If a character has no contacts, then the Contacts client shall return an empty array.\n    An empty contact list is an ordinary state, not an error. Returning an\n    empty array rather than null keeps the call site free of a special case\n    before iterating.\n\n    Scenario: Character with an empty contact list\n      Given a character with no contacts\n      When the client requests character contacts for the empty list\n      Then the client shall return an empty array","sourceStart":27,"findings":[]},{"id":"0008-contacts#R3","title":"When contact labels are requested, the Contacts client shall return an array whose entries each carry label_id and label_name.","line":37,"pattern":"event-driven","exclusion":false,"verdict":"verified","evidence":"","charter":[],"tags":[],"scenarios":[{"title":"Character labels naming friendly, hostile, and neutral","line":43,"tags":[]},{"title":"Corporation labels naming war targets and allies","line":48,"tags":[]}],"source":"  Rule: When contact labels are requested, the Contacts client shall return an array whose entries each carry label_id and label_name.\n    Contact entries reference labels only by ID, so the label endpoint is what\n    turns those IDs into text a person can read. Character labels and\n    corporation labels are separate endpoints with the same entry shape, which\n    is why both scenarios sit here.\n\n    Scenario: Character labels naming friendly, hostile, and neutral\n      Given a character with custom labels\n      When the client requests contact labels\n      Then the client shall return the label definitions\n\n    Scenario: Corporation labels naming war targets and allies\n      Given a corporation with custom labels\n      When the client requests corporation contact labels\n      Then the client shall return the corporation label definitions","sourceStart":37,"findings":[]},{"id":"0008-contacts#R4","title":"When contacts are added for a character ID, the Contacts client shall return the contact IDs accepted by ESI.","line":55,"pattern":"event-driven","exclusion":false,"verdict":"verified","evidence":"","charter":[],"tags":[],"scenarios":[{"title":"Two contacts added at standing five","line":60,"tags":[]}],"source":"  Rule: When contacts are added for a character ID, the Contacts client shall return the contact IDs accepted by ESI.\n    The add call answers with the IDs that were actually created, which is not\n    always the full set submitted — an ID already on the list is not added\n    twice. Returning that answer is what lets a caller reconcile its own view.\n\n    Scenario: Two contacts added at standing five\n      Given contact data with standings\n      When the client adds contacts\n      Then the client shall return the IDs of the added contacts","sourceStart":55,"findings":[]},{"id":"0008-contacts#R5","title":"When contacts are deleted for a character ID, the Contacts client shall pass the character ID and the contact ID list through to the delete call unchanged.","line":65,"pattern":"event-driven","exclusion":false,"verdict":"verified","evidence":"","charter":[],"tags":[],"scenarios":[{"title":"Two contacts deleted by ID","line":70,"tags":[]}],"source":"  Rule: When contacts are deleted for a character ID, the Contacts client shall pass the character ID and the contact ID list through to the delete call unchanged.\n    Deletion carries no response body, so the only observable is what was\n    sent. Sending the ID list as given is what keeps a caller from silently\n    removing a contact it did not name.\n\n    Scenario: Two contacts deleted by ID\n      Given existing contact IDs\n      When the client deletes those contacts\n      Then the deletion shall complete successfully","sourceStart":65,"findings":[]},{"id":"0008-contacts#R6","title":"When a contact list read is followed by an add and a second read, the Contacts client shall return the added contact in the result of the second read.","line":75,"pattern":"event-driven","exclusion":false,"verdict":"verified","evidence":"","charter":[],"tags":[],"scenarios":[{"title":"List, add, and re-read showing the new contact","line":80,"tags":[]}],"source":"  Rule: When a contact list read is followed by an add and a second read, the Contacts client shall return the added contact in the result of the second read.\n    This is the ordinary edit path: see what is there, add, confirm. The\n    second read has to reflect the write rather than answer from a cached copy\n    of the first, which is what makes the sequence worth stating.\n\n    Scenario: List, add, and re-read showing the new contact\n      Given a character managing contacts\n      When the client lists contacts then add new ones and verify\n      Then the full workflow shall succeed","sourceStart":75,"findings":[]},{"id":"0008-contacts#R7","title":"If a contact request is rejected for lack of authorization, then the Contacts client shall reject with an EsiError.","line":87,"pattern":"unwanted-behaviour","exclusion":false,"verdict":"verified","evidence":"","charter":[],"tags":[],"scenarios":[{"title":"Expired token on the character contacts endpoint rejects the request","line":92,"tags":[]}],"source":"  Rule: If a contact request is rejected for lack of authorization, then the Contacts client shall reject with an EsiError.\n    Contact endpoints are token-scoped and tokens expire mid-session.\n    Surfacing the refusal as the domain error type puts it on the same\n    handling path as any other failure rather than as an empty contact list.\n\n    Scenario: Expired token on the character contacts endpoint rejects the request\n      Given an invalid or expired token for contacts\n      When the client requests character contacts without authorization\n      Then the client shall return a 403 forbidden error","sourceStart":87,"findings":[]}],"noUnwantedBehaviour":false,"orphanScenarios":0},{"file":"tests/bdd/features/core/0009-contracts.feature","area":"core","name":"Contract Management","tags":["@TEST-10"],"charter":["TEST-10"],"description":"The Contracts client covers the contract endpoints of ESI: the contracts a character or a corporation is party to, the public contracts listed in a region, and the two follow-up reads that open a contract up — the bids placed on an auction and the item lines being exchanged. A contract header carries no items and no bids of its own, so inspecting one always means a list read followed by the detail reads.","boundBy":["tests/bdd/step-definitions/core/contracts.steps.ts"],"rules":[{"id":"0009-contracts#R1","title":"When character contracts are requested for a character ID, the Contracts client shall return an array whose entries each carry contract_id, type, issuer_id, and status, and price when present.","line":12,"pattern":"event-driven","exclusion":false,"verdict":"verified","evidence":"","charter":[],"tags":[],"scenarios":[{"title":"Contract list holding a courier contract and an item exchange contract","line":18,"tags":[]},{"title":"Mixed contract list filtered by the caller on the type field","line":23,"tags":[]}],"source":"  Rule: When character contracts are requested for a character ID, the Contracts client shall return an array whose entries each carry contract_id, type, issuer_id, and status, and price when present.\n    The type separates a courier run from an item exchange from an auction,\n    and the status separates live contracts from settled ones. Both scenarios\n    below read those fields: the first on a two-entry list, the second by\n    filtering a mixed list down to one type at the call site.\n\n    Scenario: Contract list holding a courier contract and an item exchange contract\n      Given a character with contracts\n      When the client requests character contracts\n      Then the client shall return a list of contracts\n\n    Scenario: Mixed contract list filtered by the caller on the type field\n      Given a character with mixed contract types\n      When the client retrieves and filter by courier type\n      Then the client shall return only courier contracts","sourceStart":12,"findings":[]},{"id":"0009-contracts#R2","title":"If a character has no contracts, then the Contracts client shall return an empty array.","line":28,"pattern":"unwanted-behaviour","exclusion":false,"verdict":"verified","evidence":"","charter":[],"tags":[],"scenarios":[{"title":"Character with an empty contract list","line":33,"tags":[]}],"source":"  Rule: If a character has no contracts, then the Contracts client shall return an empty array.\n    A character who has never issued or accepted a contract is an ordinary\n    case. Returning an empty array rather than null keeps the call site free\n    of a special case before iterating.\n\n    Scenario: Character with an empty contract list\n      Given a character with no contracts\n      When the client requests character contracts for the empty list\n      Then the client shall return an empty array","sourceStart":28,"findings":[]},{"id":"0009-contracts#R3","title":"When character contracts and corporation contracts are requested concurrently, the Contracts client shall resolve each call with the list belonging to its own holder.","line":38,"pattern":"event-driven","exclusion":false,"verdict":"verified","evidence":"","charter":[],"tags":[],"scenarios":[{"title":"Character list and corporation list fetched at once","line":44,"tags":[]}],"source":"  Rule: When character contracts and corporation contracts are requested concurrently, the Contracts client shall resolve each call with the list belonging to its own holder.\n    A character can issue contracts on their own behalf and on their\n    corporation's, and the two lists overlap in issuer but not in scope. The\n    for_corporation flag is what tells them apart, so neither call may answer\n    the other.\n\n    Scenario: Character list and corporation list fetched at once\n      Given a character in a corporation\n      When the client fetches both sets of contracts concurrently\n      Then the client shall return independent results","sourceStart":38,"findings":[]},{"id":"0009-contracts#R4","title":"When public contracts are requested for a region ID, the Contracts client shall return an array whose entries each carry contract_id, type, issuer_id, date_issued, and date_expired.","line":51,"pattern":"event-driven","exclusion":false,"verdict":"verified","evidence":"","charter":[],"tags":[],"scenarios":[{"title":"Public contracts outstanding in a region","line":57,"tags":[]}],"source":"  Rule: When public contracts are requested for a region ID, the Contracts client shall return an array whose entries each carry contract_id, type, issuer_id, date_issued, and date_expired.\n    The public listing is the region-wide market in contracts and needs no\n    token. ESI sends no availability or status on these entries, because\n    every contract it lists is public and outstanding; the character and\n    corporation lists are where those two fields appear.\n\n    Scenario: Public contracts outstanding in a region\n      Given a valid region ID\n      When the client requests public contracts\n      Then the client shall return contracts available in that region","sourceStart":51,"findings":[]},{"id":"0009-contracts#R5","title":"When bids are requested for a character auction contract, the Contracts client shall return an array whose entries each carry bid_id, bidder_id, and amount.","line":64,"pattern":"event-driven","exclusion":false,"verdict":"verified","evidence":"","charter":[],"tags":[],"scenarios":[{"title":"Bid history on a character auction contract","line":69,"tags":[]}],"source":"  Rule: When bids are requested for a character auction contract, the Contracts client shall return an array whose entries each carry bid_id, bidder_id, and amount.\n    Bids decide who wins an auction, so the amount and the bidder are the\n    whole content of an entry. The token scopes the read to a contract the\n    character is party to, which is why ESI names the bidder here.\n\n    Scenario: Bid history on a character auction contract\n      Given an auction contract with bids\n      When the client requests contract bids\n      Then the client shall return a list of bids","sourceStart":64,"findings":[]},{"id":"0009-contracts#R6","title":"When bids are requested for a public auction contract, the Contracts client shall return an array whose entries each carry bid_id, date_bid, and amount.","line":74,"pattern":"event-driven","exclusion":false,"verdict":"verified","evidence":"","charter":[],"tags":[],"scenarios":[{"title":"Bid history on a public auction contract","line":79,"tags":[]}],"source":"  Rule: When bids are requested for a public auction contract, the Contracts client shall return an array whose entries each carry bid_id, date_bid, and amount.\n    The public read needs no token and ESI does not name the bidder on it\n    (ContractsPublicBidsContractIdGet has no bidder_id), so the public entry\n    shape differs from the character one.\n\n    Scenario: Bid history on a public auction contract\n      Given a public auction contract\n      When the client requests public contract bids\n      Then the client shall return the bid history","sourceStart":74,"findings":[]},{"id":"0009-contracts#R7","title":"When items are requested for a character contract, the Contracts client shall return an array whose entries each carry type_id, quantity, and is_included.","line":84,"pattern":"event-driven","exclusion":false,"verdict":"verified","evidence":"","charter":[],"tags":[],"scenarios":[{"title":"Item lines on an item exchange contract","line":89,"tags":[]}],"source":"  Rule: When items are requested for a character contract, the Contracts client shall return an array whose entries each carry type_id, quantity, and is_included.\n    The is_included flag separates what the issuer is offering from what they\n    are asking for in return, so reading an item line without it inverts the\n    meaning of the contract.\n\n    Scenario: Item lines on an item exchange contract\n      Given an item exchange contract\n      When the client requests contract items\n      Then the client shall return the list of items","sourceStart":84,"findings":[]},{"id":"0009-contracts#R8","title":"When items are requested for a public contract, the Contracts client shall return an array whose entries each carry type_id, quantity, and is_included, and material_efficiency when present.","line":94,"pattern":"event-driven","exclusion":false,"verdict":"verified","evidence":"","charter":[],"tags":[],"scenarios":[{"title":"Item lines on a public contract selling minerals and a blueprint copy","line":100,"tags":[]}],"source":"  Rule: When items are requested for a public contract, the Contracts client shall return an array whose entries each carry type_id, quantity, and is_included, and material_efficiency when present.\n    ESI sends no is_singleton on a public item line\n    (ContractsPublicItemsContractIdGet). A blueprint line carries its item_id,\n    copy flag, efficiencies and runs instead, which is what a buyer needs to\n    price it.\n\n    Scenario: Item lines on a public contract selling minerals and a blueprint copy\n      Given a public item exchange contract with a blueprint copy\n      When the client requests public contract items\n      Then the client shall return the public item lines","sourceStart":94,"findings":[]},{"id":"0009-contracts#R9","title":"If ESI answers a public contract items or bids request with no content, then the Contracts client shall resolve with an empty array.","line":105,"pattern":"unwanted-behaviour","exclusion":false,"verdict":"verified","evidence":"","charter":[],"tags":[],"scenarios":[{"title":"Items read on a contract that expired after the listing","line":113,"tags":[]},{"title":"Items read answered with 204 No Content","line":118,"tags":[]},{"title":"Bids read on an auction accepted after the listing","line":123,"tags":[]}],"source":"  Rule: If ESI answers a public contract items or bids request with no content, then the Contracts client shall resolve with an empty array.\n    A public contract can expire or be accepted between the region listing\n    and the detail read. ESI documents a 204 for that case on both routes\n    (\"Contract expired or recently accepted by player\"), and in practice\n    sends a 200 with Content-Length 0. Either way the contract has nothing\n    left to show, so the caller gets an empty list rather than a parse or\n    validation error. Other endpoints keep rejecting an empty 200 body.\n\n    Scenario: Items read on a contract that expired after the listing\n      Given a public contract that ESI answers with an empty 200 response\n      When the client requests the items of the expired public contract\n      Then the client shall return no public item lines\n\n    Scenario: Items read answered with 204 No Content\n      Given a public contract that ESI answers with 204 No Content\n      When the client requests the items of the public contract answered with no content\n      Then the client shall return no item lines for the contract answered with no content\n\n    Scenario: Bids read on an auction accepted after the listing\n      Given a public auction that ESI answers with an empty 200 response\n      When the client requests the bids of the accepted public auction\n      Then the client shall return no public bids","sourceStart":105,"findings":[]},{"id":"0009-contracts#R10","title":"If ESI answers a public contract's bids or items with no content while the Contracts client streams or collects their pages, then the Contracts client shall yield no entries.","line":128,"pattern":"unwanted-behaviour","exclusion":false,"verdict":"verified","evidence":"","charter":[],"tags":[],"scenarios":[{"title":"Bids streamed on an auction accepted after the listing","line":135,"tags":[]},{"title":"Items collected on a contract answered with 204 No Content","line":140,"tags":[]}],"source":"  Rule: If ESI answers a public contract's bids or items with no content while the Contracts client streams or collects their pages, then the Contracts client shall yield no entries.\n    The page helpers read the same emptyWhenNoContent flag on the endpoint\n    definition as the direct calls above, and as createEsi's generated\n    operations, so a contract that expired or was accepted between the\n    listing and the read ends the walk with nothing rather than a parse or\n    validation error.\n\n    Scenario: Bids streamed on an auction accepted after the listing\n      Given a public auction that ESI answers with an empty 200 response while its bids are streamed\n      When the client streams the bids of the accepted public auction\n      Then the stream shall yield no bids after one request\n\n    Scenario: Items collected on a contract answered with 204 No Content\n      Given a public contract that ESI answers with 204 No Content while its items are collected\n      When the client collects every page of the items of the contract answered with no content\n      Then the collection shall hold no item lines after one request","sourceStart":128,"findings":[]},{"id":"0009-contracts#R11","title":"When the bids or items of a public contract are collected or streamed page by page, the Contracts client shall return every entry from every page in page order.","line":145,"pattern":"event-driven","exclusion":false,"verdict":"verified","evidence":"","charter":[],"tags":[],"scenarios":[{"title":"Bids on a busy auction collected across two pages","line":151,"tags":[]},{"title":"Items on a public contract streamed page by page","line":156,"tags":[]}],"source":"  Rule: When the bids or items of a public contract are collected or streamed page by page, the Contracts client shall return every entry from every page in page order.\n    fetchAllPublicContractBids and fetchAllPublicContractItems request the\n    pages after the first concurrently, and streamPublicContractBids and\n    streamPublicContractItems yield one validated page at a time, as the\n    other paged contract routes do.\n\n    Scenario: Bids on a busy auction collected across two pages\n      Given a public auction whose bids ESI splits across two pages\n      When the client collects every page of the bids of the busy public auction\n      Then the client shall return the bids from both pages in page order\n\n    Scenario: Items on a public contract streamed page by page\n      Given a public contract whose items ESI serves on one page\n      When the client streams the items of the public contract\n      Then the stream shall yield the contract's item lines on one page","sourceStart":145,"findings":[]},{"id":"0009-contracts#R12","title":"When a contract is located in the character list and its bids and items are then requested, the Contracts client shall resolve every call in the sequence.","line":161,"pattern":"event-driven","exclusion":false,"verdict":"verified","evidence":"","charter":[],"tags":[],"scenarios":[{"title":"Contract located in the list, then its bids and items","line":166,"tags":[]}],"source":"  Rule: When a contract is located in the character list and its bids and items are then requested, the Contracts client shall resolve every call in the sequence.\n    This is the ordinary inspection path: find the contract, then open it. The\n    contract ID feeding the two detail calls comes from the list response, so\n    the sequence is ordered rather than a plain fan-out.\n\n    Scenario: Contract located in the list, then its bids and items\n      Given an active auction contract\n      When the client retrieves the contract then fetch its bids and items\n      Then the client shall have full contract details","sourceStart":161,"findings":[]},{"id":"0009-contracts#R13","title":"If a contract request fails, then the Contracts client shall reject with an EsiError.","line":173,"pattern":"unwanted-behaviour","exclusion":false,"verdict":"verified","evidence":"","charter":[],"tags":[],"scenarios":[{"title":"Unknown character ID rejects the request","line":178,"tags":[]}],"source":"  Rule: If a contract request fails, then the Contracts client shall reject with an EsiError.\n    One error type across the domain keeps the call site to a single catch,\n    whether the failure came from an unknown character, an expired token, or a\n    contract that has already been settled and removed.\n\n    Scenario: Unknown character ID rejects the request\n      Given an invalid character ID for contracts\n      When the client requests character contracts for the invalid character\n      Then the client shall return a 404 not found error","sourceStart":173,"findings":[]}],"noUnwantedBehaviour":false,"orphanScenarios":0},{"file":"tests/bdd/features/core/0010-cosmetics.feature","area":"core","name":"Cosmetics SKINR","tags":["@TEST-10"],"charter":["TEST-10"],"description":"The Cosmetics client covers the SKINR endpoints, which describe ship paint rather than ship capability: the designs a character holds a licence for, the components — patterns, nanocoatings and the like — they can build designs from, and the public record of one design's appearance. Licences and components are token-scoped to a character; a design record is public and is keyed by a string ID rather than a numeric one.\n\nRetry, stale-on-error, circuit breaking and request deduplication apply to these calls as to every other; 0050-etag-caching.feature and 0051-resilience.feature specify them once. A failure Rule below states the outcome after they have run, which is why it names every attempt and the absence of a usable cached entry.","boundBy":["tests/bdd/specs/core/0010-cosmetics.spec.ts"],"rules":[{"id":"0010-cosmetics#R1","title":"When character SKINR licences are requested for a character ID, the Cosmetics client shall return a record whose licenses array holds one entry per owned design carrying skinr_id, activated, and unactivated.","line":18,"pattern":"event-driven","exclusion":false,"verdict":"verified","evidence":"","charter":[],"tags":[],"scenarios":[{"title":"Licence list holding an activated design and an unactivated one","line":24,"tags":[]}],"source":"  Rule: When character SKINR licences are requested for a character ID, the Cosmetics client shall return a record whose licenses array holds one entry per owned design carrying skinr_id, activated, and unactivated.\n    A licence entry says which design it covers and how many uses of it the\n    character has left — activated marks the design as already applied, and\n    unactivated counts the copies still in hand. The array sits inside an\n    enveloping record rather than being returned bare.\n\n    Scenario: Licence list holding an activated design and an unactivated one\n      Given the character owns SKINR licenses\n      When the client requests character SKINR\n      Then the client shall return the license data","sourceStart":18,"findings":[]},{"id":"0010-cosmetics#R2","title":"If a character owns no SKINR licences, then the Cosmetics client shall return a record whose licenses array is empty.","line":29,"pattern":"unwanted-behaviour","exclusion":false,"verdict":"verified","evidence":"","charter":[],"tags":[],"scenarios":[{"title":"Character owning no SKINR licences","line":34,"tags":[]}],"source":"  Rule: If a character owns no SKINR licences, then the Cosmetics client shall return a record whose licenses array is empty.\n    Owning no designs is the starting state for every character. The envelope\n    is still present with an empty array inside, so a caller reads the same\n    path whether or not anything is owned.\n\n    Scenario: Character owning no SKINR licences\n      Given the character has no SKINR licenses\n      When the client requests character SKINR\n      Then the client shall return an empty license list","sourceStart":29,"findings":[]},{"id":"0010-cosmetics#R3","title":"When SKINR components are requested for a character ID, the Cosmetics client shall return a record whose licenses array holds one entry per component carrying component_id, type, and runs.","line":39,"pattern":"event-driven","exclusion":false,"verdict":"verified","evidence":"","charter":[],"tags":[],"scenarios":[{"title":"Component list holding a limited-run nanocoating and an unlimited pattern","line":44,"tags":[]}],"source":"  Rule: When SKINR components are requested for a character ID, the Cosmetics client shall return a record whose licenses array holds one entry per component carrying component_id, type, and runs.\n    Components are the ingredients a design is assembled from, and the runs\n    field says how many applications are left — either a remaining count or an\n    unlimited marker. The type names which kind of ingredient the entry is.\n\n    Scenario: Component list holding a limited-run nanocoating and an unlimited pattern\n      Given the character owns SKINR components\n      When the client requests SKINR components\n      Then the client shall return component data with types","sourceStart":39,"findings":[]},{"id":"0010-cosmetics#R4","title":"When a SKINR design is requested by design ID, the Cosmetics client shall return a record carrying id, name, tier, and layout.","line":51,"pattern":"event-driven","exclusion":false,"verdict":"verified","evidence":"","charter":[],"tags":[],"scenarios":[{"title":"Public design record with tier level and layout slots","line":57,"tags":[]}],"source":"  Rule: When a SKINR design is requested by design ID, the Cosmetics client shall return a record carrying id, name, tier, and layout.\n    The design record is public, so a caller can render someone else's ship\n    without holding a licence for it. The layout holds the slots, each an id\n    and its nanocoating or pattern configuration, and the blend mode that\n    decide how the design is drawn, and the tier ranks it.\n\n    Scenario: Public design record with tier level and layout slots\n      Given a public SKINR design exists\n      When the client requests SKINR attributes\n      Then the client shall return the design layout and tier","sourceStart":51,"findings":[]},{"id":"0010-cosmetics#R5","title":"If every attempt at a cosmetics request fails and no usable cached entry exists, then the Cosmetics client shall reject with an EsiError.","line":64,"pattern":"unwanted-behaviour","exclusion":false,"verdict":"verified","evidence":"","charter":[],"tags":[],"scenarios":[{"title":"Service outage rejects the request","line":70,"tags":[]}],"source":"  Rule: If every attempt at a cosmetics request fails and no usable cached entry exists, then the Cosmetics client shall reject with an EsiError.\n    SKINR is a newer part of the API and its endpoints go out of service\n    independently of the rest. Surfacing the outage as the domain error type\n    keeps it on the same handling path as any other failure rather than as an\n    empty licence list.\n\n    Scenario: Service outage rejects the request\n      Given the SKINR service is down\n      When the client requests cosmetics data\n      Then the client shall return a 503 error for cosmetics","sourceStart":64,"findings":[]}],"noUnwantedBehaviour":false,"orphanScenarios":0},{"file":"tests/bdd/features/core/0011-dogma.feature","area":"core","name":"Dogma System","tags":["@TEST-10"],"charter":["TEST-10"],"description":"Dogma is EVE's attribute and effect engine: every module, ship and charge in the game is described by numeric attributes and the effects that consume them. The Dogma client exposes the three public views of that data — the attribute index, the effect index, and the per-record detail behind each ID — plus the dynamic (abyssal mutated) item endpoint, which reports the rolled attribute values for one specific item instance rather than for a type.\n\nAll four endpoints are unauthenticated reference data, so the only failure mode worth specifying here is the unknown-identifier case.","boundBy":["tests/bdd/specs/core/0011-dogma.spec.ts"],"rules":[{"id":"0011-dogma#R1","title":"When the client requests the dogma attribute index or the dogma effect index, the Dogma client shall return an array of numeric identifiers.","line":15,"pattern":"event-driven","exclusion":false,"verdict":"verified","evidence":"","charter":[],"tags":[],"scenarios":[{"title":"Attribute index returns numeric IDs","line":22,"tags":[]},{"title":"Effect index returns numeric IDs","line":27,"tags":[]}],"source":"  Rule: When the client requests the dogma attribute index or the dogma effect index, the Dogma client shall return an array of numeric identifiers.\n    Both indexes are flat ID lists rather than full records — the caller pairs\n    them with the detail endpoints below to hydrate what it needs. The element\n    type matters because these IDs are used directly as path parameters, so\n    the scenarios assert every element is a number rather than only checking\n    the array shape.\n\n    Scenario: Attribute index returns numeric IDs\n      Given the dogma API is available\n      When the client requests all attributes\n      Then the client shall return an array of attribute IDs\n\n    Scenario: Effect index returns numeric IDs\n      Given the dogma effects API is available\n      When the client requests all effects\n      Then the client shall return an array of effect IDs","sourceStart":15,"findings":[]},{"id":"0011-dogma#R2","title":"When the client requests a dogma attribute by identifier, the Dogma client shall return a record carrying attribute_id, and name, description, and published when present.","line":34,"pattern":"event-driven","exclusion":false,"verdict":"verified","evidence":"","charter":[],"tags":[],"scenarios":[{"title":"Attribute 20 resolves to the powerOutput record","line":40,"tags":[]}],"source":"  Rule: When the client requests a dogma attribute by identifier, the Dogma client shall return a record carrying attribute_id, and name, description, and published when present.\n    The attribute record is what turns an opaque ID into something displayable:\n    name and description for UI, published for whether the attribute is live in\n    the game, and attribute_id echoed back so a batch of parallel lookups can\n    be reassembled.\n\n    Scenario: Attribute 20 resolves to the powerOutput record\n      Given a valid attribute ID\n      When the client requests attribute details\n      Then the client shall return complete attribute information","sourceStart":34,"findings":[]},{"id":"0011-dogma#R3","title":"When the client requests a dogma effect by identifier, the Dogma client shall return a record carrying effect_id, and name, published, and is_warp_safe when present.","line":45,"pattern":"event-driven","exclusion":false,"verdict":"verified","evidence":"","charter":[],"tags":[],"scenarios":[{"title":"Effect 11 resolves to the lowPower record","line":50,"tags":[]}],"source":"  Rule: When the client requests a dogma effect by identifier, the Dogma client shall return a record carrying effect_id, and name, published, and is_warp_safe when present.\n    Effects carry behavioural flags in addition to naming — is_warp_safe in\n    particular decides whether activating the effect drops the ship out of\n    warp, so it is part of the minimum contract rather than an optional extra.\n\n    Scenario: Effect 11 resolves to the lowPower record\n      Given a valid effect ID\n      When the client requests effect details\n      Then the client shall return complete effect information","sourceStart":45,"findings":[]},{"id":"0011-dogma#R4","title":"When the client requests dynamic item dogma for a type and item pair, the Dogma client shall return the creator, mutator type, source type, and the rolled attribute and effect lists.","line":57,"pattern":"event-driven","exclusion":false,"verdict":"verified","evidence":"","charter":[],"tags":[],"scenarios":[{"title":"Abyssal module reports its provenance and rolled stats","line":63,"tags":[]}],"source":"  Rule: When the client requests dynamic item dogma for a type and item pair, the Dogma client shall return the creator, mutator type, source type, and the rolled attribute and effect lists.\n    An abyssal module is generated by applying a mutaplasmid to a base module,\n    so its stats exist only on that one item. The response therefore records\n    the provenance — who created it, from which source type, with which\n    mutator — alongside the resulting attribute and effect values.\n\n    Scenario: Abyssal module reports its provenance and rolled stats\n      Given a mutated item exists\n      When the client requests its dynamic dogma info\n      Then the client shall return modified attributes and effects","sourceStart":57,"findings":[]},{"id":"0011-dogma#R5","title":"If a dogma lookup is answered with HTTP 404, then the Dogma client shall reject with an EsiError carrying status code 404.","line":70,"pattern":"unwanted-behaviour","exclusion":false,"verdict":"verified","evidence":"","charter":[],"tags":[],"scenarios":[{"title":"Unknown attribute ID","line":77,"tags":[]},{"title":"Unknown effect ID","line":82,"tags":[]},{"title":"Unknown type and item ID pair","line":87,"tags":[]}],"source":"  Rule: If a dogma lookup is answered with HTTP 404, then the Dogma client shall reject with an EsiError carrying status code 404.\n    Dogma IDs are frequently supplied by callers from stale static data\n    exports, so a miss is an ordinary outcome rather than an exceptional one.\n    The rejection is typed and carries the status code, letting a caller\n    distinguish \"this ID no longer exists\" from a transport failure. The three\n    scenarios cover the same requirement across all three detail endpoints.\n\n    Scenario: Unknown attribute ID\n      Given an invalid attribute ID\n      When the client requests attribute details for the invalid ID\n      Then the client shall return a not found error for the attribute\n\n    Scenario: Unknown effect ID\n      Given an invalid effect ID\n      When the client requests effect details for the invalid ID\n      Then the client shall return a not found error for the effect\n\n    Scenario: Unknown type and item ID pair\n      Given an invalid type and item ID\n      When the client requests dynamic info for the invalid item\n      Then the client shall return a not found error for the dynamic item","sourceStart":70,"findings":[]}],"noUnwantedBehaviour":false,"orphanScenarios":0},{"file":"tests/bdd/features/core/0012-factions.feature","area":"core","name":"Faction Warfare Management","tags":["@TEST-10"],"charter":["TEST-10"],"description":"Faction warfare is EVE's persistent low-security conflict between the four empire militias. The Factions client covers the four views ESI publishes over it: aggregate statistics per faction, per-participant statistics for an enlisted character or corporation, the current occupancy and contest state of every faction warfare solar system, and the kill and victory-point leaderboards.\n\nThe participant endpoints are authenticated and scoped, so a stale or wrong-scope token is a first-class outcome rather than an edge case.","boundBy":["tests/bdd/step-definitions/core/factions.steps.ts"],"rules":[{"id":"0012-factions#R1","title":"When the client requests faction warfare statistics, the Factions client shall return one record per faction carrying pilots, systems_controlled, kills, and victory_points.","line":15,"pattern":"event-driven","exclusion":false,"verdict":"verified","evidence":"","charter":[],"tags":[],"scenarios":[{"title":"Every faction reports pilots, systems held, and score totals","line":22,"tags":[]}],"source":"  Rule: When the client requests faction warfare statistics, the Factions client shall return one record per faction carrying pilots, systems_controlled, kills, and victory_points.\n    This is the scoreboard for the whole conflict. Each faction's record\n    reports enlisted pilot count and systems held as instantaneous values,\n    while kills and victory points are broken into yesterday, last week and\n    running total so callers can render trends without keeping history\n    themselves.\n\n    Scenario: Every faction reports pilots, systems held, and score totals\n      Given the FW system is active\n      When the client requests faction warfare stats\n      Then the client shall return stats for all factions","sourceStart":15,"findings":[]},{"id":"0012-factions#R2","title":"When the client requests faction warfare statistics for an enlisted character or corporation, the Factions client shall return that participant's faction, enlistment date, and kill and victory-point totals.","line":29,"pattern":"event-driven","exclusion":false,"verdict":"verified","evidence":"","charter":[],"tags":[],"scenarios":[{"title":"Enlisted character reports rank and personal totals","line":36,"tags":[]},{"title":"Enlisted corporation reports pilot count and corporate totals","line":41,"tags":[]}],"source":"  Rule: When the client requests faction warfare statistics for an enlisted character or corporation, the Factions client shall return that participant's faction, enlistment date, and kill and victory-point totals.\n    Characters and corporations enlist separately and ESI exposes them as two\n    endpoints, but the payload shape is shared: which militia, since when, and\n    how the participant has scored. The character variant adds militia rank,\n    the corporation variant adds enlisted pilot count; the two scenarios below\n    exercise the same requirement from each side.\n\n    Scenario: Enlisted character reports rank and personal totals\n      Given a character enlisted in faction warfare\n      When the client requests character FW stats\n      Then the client shall return their personal statistics\n\n    Scenario: Enlisted corporation reports pilot count and corporate totals\n      Given a corporation enlisted in faction warfare\n      When the client requests corporation FW stats\n      Then the client shall return the corporation statistics","sourceStart":29,"findings":[]},{"id":"0012-factions#R3","title":"When the client requests faction warfare systems, the Factions client shall return each solar system with its owner faction, occupier faction, contested state, and victory point tally.","line":48,"pattern":"event-driven","exclusion":false,"verdict":"verified","evidence":"","charter":[],"tags":[],"scenarios":[{"title":"Contested and uncontested systems are distinguished","line":54,"tags":[]}],"source":"  Rule: When the client requests faction warfare systems, the Factions client shall return each solar system with its owner faction, occupier faction, contested state, and victory point tally.\n    Owner and occupier differ while a system is being flipped, which is exactly\n    the state a faction warfare tool needs to surface. The contested field is a\n    discrete state rather than a boolean, and the victory point tally against\n    its threshold is what drives progress display.\n\n    Scenario: Contested and uncontested systems are distinguished\n      Given active faction warfare systems\n      When the client requests FW systems\n      Then the client shall return system ownership and contested status","sourceStart":48,"findings":[]},{"id":"0012-factions#R4","title":"When the client requests faction warfare wars, the Factions client shall return each active conflict as a faction identifier paired with the faction it opposes.","line":59,"pattern":"event-driven","exclusion":false,"verdict":"verified","evidence":"","charter":[],"tags":[],"scenarios":[{"title":"Active conflicts list each faction and its opponent","line":64,"tags":[]}],"source":"  Rule: When the client requests faction warfare wars, the Factions client shall return each active conflict as a faction identifier paired with the faction it opposes.\n    The war list is the pairing table for the militias. It is deliberately\n    minimal — two IDs per entry — because everything else about a faction is\n    served by the statistics endpoints above.\n\n    Scenario: Active conflicts list each faction and its opponent\n      Given faction warfare is active\n      When the client requests FW wars\n      Then the client shall return the list of faction conflicts","sourceStart":59,"findings":[]},{"id":"0012-factions#R5","title":"When the client requests a faction warfare leaderboard, the Factions client shall return kill and victory-point rankings whose entries carry the ranked faction_id, character_id, or corporation_id when present, and the score amount when present.","line":71,"pattern":"event-driven","exclusion":false,"verdict":"verified","evidence":"","charter":[],"tags":[],"scenarios":[{"title":"Overall leaderboard ranks factions by kills and victory points","line":80,"tags":[]},{"title":"Character leaderboard ranks individual pilots","line":85,"tags":[]},{"title":"Corporation leaderboard ranks corporations","line":90,"tags":[]},{"title":"Leaderboard entry without a score amount","line":95,"tags":[]}],"source":"  Rule: When the client requests a faction warfare leaderboard, the Factions client shall return kill and victory-point rankings whose entries carry the ranked faction_id, character_id, or corporation_id when present, and the score amount when present.\n    The three leaderboard endpoints share one envelope: a kills block and a\n    victory_points block, each split into yesterday, last week and active\n    total. Only the identity key changes: faction_id on the overall board,\n    character_id on the character board, corporation_id on the corporation\n    board. The ESI spec marks both the identity key and amount optional on\n    every entry, so an entry without an amount is a valid response rather\n    than a validation failure.\n\n    Scenario: Overall leaderboard ranks factions by kills and victory points\n      Given faction warfare is active for leaderboard\n      When the client requests the overall leaderboard\n      Then the client shall return faction rankings\n\n    Scenario: Character leaderboard ranks individual pilots\n      Given faction warfare is active for character leaderboard\n      When the client requests the character leaderboard\n      Then the client shall return top character rankings\n\n    Scenario: Corporation leaderboard ranks corporations\n      Given faction warfare is active for corporation leaderboard\n      When the client requests the corporation leaderboard\n      Then the client shall return top corporation rankings\n\n    Scenario: Leaderboard entry without a score amount\n      Given a faction leaderboard entry that carries no amount\n      When the client requests the overall leaderboard with an unscored entry\n      Then the client shall return the unscored entry without an amount","sourceStart":71,"findings":[]},{"id":"0012-factions#R6","title":"When faction warfare lookups are issued together in one Promise.all, the Factions client shall resolve each lookup with its own response.","line":102,"pattern":"event-driven","exclusion":false,"verdict":"verified","evidence":"","charter":[],"tags":[],"scenarios":[{"title":"Overview gathers stats, systems, and wars in one pass","line":107,"tags":[]}],"source":"  Rule: When faction warfare lookups are issued together in one Promise.all, the Factions client shall resolve each lookup with its own response.\n    A dashboard needs the whole picture at once, and the client holds no\n    per-instance mutable request state that would make concurrent calls\n    interfere. This scenario pins that down across five endpoints at once.\n\n    Scenario: Overview gathers stats, systems, and wars in one pass\n      Given an enlisted character for overview\n      When the client gathers all FW data concurrently\n      Then the client shall have a complete faction warfare picture","sourceStart":102,"findings":[]},{"id":"0012-factions#R7","title":"If a faction warfare participant lookup is answered with HTTP 403, then the Factions client shall reject with an EsiError.","line":114,"pattern":"unwanted-behaviour","exclusion":false,"verdict":"verified","evidence":"","charter":[],"tags":[],"scenarios":[{"title":"Character statistics with an expired token","line":120,"tags":[]},{"title":"Corporation statistics with an expired token","line":125,"tags":[]}],"source":"  Rule: If a faction warfare participant lookup is answered with HTTP 403, then the Factions client shall reject with an EsiError.\n    The character and corporation statistics endpoints both require a scoped\n    token, and ESI answers a missing scope or an expired token with 403 rather\n    than 401. Both scenarios assert the same typed rejection so callers can\n    branch on error class instead of parsing a message.\n\n    Scenario: Character statistics with an expired token\n      Given an invalid or expired token for character stats\n      When the client requests character FW stats with invalid token\n      Then the client shall return a 403 forbidden error for character stats\n\n    Scenario: Corporation statistics with an expired token\n      Given an invalid or expired token for corporation stats\n      When the client requests corporation FW stats with invalid token\n      Then the client shall return a 403 forbidden error for corporation stats","sourceStart":114,"findings":[]}],"noUnwantedBehaviour":false,"orphanScenarios":0},{"file":"tests/bdd/features/core/0013-fittings.feature","area":"core","name":"Fittings Management","tags":["@TEST-10"],"charter":["TEST-10"],"description":"A fitting is a saved ship loadout belonging to one character: a hull type, a name and description, and a list of modules pinned to slot flags. The Fittings client covers the three operations ESI offers over them — list, create and delete. There is no update endpoint; changing a fitting means deleting it and saving a new one.\n\nEvery endpoint here is authenticated and character-scoped, so an absent or wrong-scope token is a specified outcome rather than an edge case.","boundBy":["tests/bdd/step-definitions/core/fittings.steps.ts"],"rules":[{"id":"0013-fittings#R1","title":"When the client requests the fittings of a character, the Fittings client shall return one entry per saved fitting carrying fitting_id, name, ship_type_id, and an item list of type_id, flag, and quantity triples.","line":14,"pattern":"event-driven","exclusion":false,"verdict":"verified","evidence":"","charter":[],"tags":[],"scenarios":[{"title":"Two saved fittings expand to full module lists","line":20,"tags":[]}],"source":"  Rule: When the client requests the fittings of a character, the Fittings client shall return one entry per saved fitting carrying fitting_id, name, ship_type_id, and an item list of type_id, flag, and quantity triples.\n    The slot flag is what makes the item list meaningful — the same module type\n    fitted high or mid is a different loadout — so the flag travels with every\n    item rather than being implied by list position. fitting_id is the handle\n    used for the delete call.\n\n    Scenario: Two saved fittings expand to full module lists\n      Given a character with saved fittings\n      When the client requests their fittings\n      Then the client shall return an array of fitting details","sourceStart":14,"findings":[]},{"id":"0013-fittings#R2","title":"While a character has no saved fittings, the Fittings client shall return an empty array.","line":25,"pattern":"state-driven","exclusion":false,"verdict":"verified","evidence":"","charter":[],"tags":[],"scenarios":[{"title":"Character who has saved no fittings","line":30,"tags":[]}],"source":"  Rule: While a character has no saved fittings, the Fittings client shall return an empty array.\n    An empty hangar of loadouts is an ordinary state, not an error, so it comes\n    back as a zero-length array rather than a 404 or a null. Callers can\n    iterate the result unconditionally.\n\n    Scenario: Character who has saved no fittings\n      Given a character with no saved fittings\n      When the client requests their fittings list\n      Then the client shall return an empty array","sourceStart":25,"findings":[]},{"id":"0013-fittings#R3","title":"When the client saves a fitting, the Fittings client shall return the fitting_id assigned by the server.","line":37,"pattern":"event-driven","exclusion":false,"verdict":"verified","evidence":"","charter":[],"tags":[],"scenarios":[{"title":"New fitting returns the assigned ID","line":44,"tags":[]},{"title":"Fully fitted battleship returns the assigned ID","line":49,"tags":[]}],"source":"  Rule: When the client saves a fitting, the Fittings client shall return the fitting_id assigned by the server.\n    The server owns identifier allocation, so the created ID is the only part\n    of the response that the caller cannot already predict — and it is what the\n    subsequent delete call needs. Loadout size does not change the contract:\n    the two scenarios save a three-module fit and an eight-module fit and both\n    get back nothing but the new ID.\n\n    Scenario: New fitting returns the assigned ID\n      Given valid fitting data\n      When the client creates a new fitting\n      Then the client shall return the new fitting ID\n\n    Scenario: Fully fitted battleship returns the assigned ID\n      Given a fully fitted ship\n      When the client saves the fitting\n      Then the fitting shall be created with all module slots populated","sourceStart":37,"findings":[]},{"id":"0013-fittings#R4","title":"When the client deletes a fitting, the Fittings client shall resolve with no response body.","line":56,"pattern":"event-driven","exclusion":false,"verdict":"verified","evidence":"","charter":[],"tags":[],"scenarios":[{"title":"Deleting a fitting resolves with no body","line":61,"tags":[]}],"source":"  Rule: When the client deletes a fitting, the Fittings client shall resolve with no response body.\n    ESI answers a successful delete with 204 No Content. The client surfaces\n    that as an undefined resolution rather than inventing a status object, so\n    the absence of a rejection is the success signal.\n\n    Scenario: Deleting a fitting resolves with no body\n      Given a valid fitting ID\n      When the client deletes the fitting\n      Then the operation shall complete without error","sourceStart":56,"findings":[]},{"id":"0013-fittings#R5","title":"When a create, list, and delete sequence is run against one character, the Fittings client shall forward the character ID to each call and the created fitting ID to the delete call.","line":68,"pattern":"event-driven","exclusion":false,"verdict":"verified","evidence":"","charter":[],"tags":[],"scenarios":[{"title":"Create, list, then delete for one character","line":73,"tags":[]}],"source":"  Rule: When a create, list, and delete sequence is run against one character, the Fittings client shall forward the character ID to each call and the created fitting ID to the delete call.\n    Fittings are addressed by a character and fitting ID pair, and the fitting\n    ID only exists once the create call has returned. This scenario checks the\n    handles are threaded through the sequence rather than defaulted or dropped.\n\n    Scenario: Create, list, then delete for one character\n      Given a character for fitting lifecycle\n      When the client creates a fitting then list fittings then delete it\n      Then each operation shall succeed in sequence","sourceStart":68,"findings":[]},{"id":"0013-fittings#R6","title":"If a fittings request is answered with HTTP 403, then the Fittings client shall reject with an EsiError.","line":80,"pattern":"unwanted-behaviour","exclusion":false,"verdict":"verified","evidence":"","charter":[],"tags":[],"scenarios":[{"title":"Listing fittings with an expired token","line":86,"tags":[]},{"title":"Creating a fitting without the write scope","line":91,"tags":[]}],"source":"  Rule: If a fittings request is answered with HTTP 403, then the Fittings client shall reject with an EsiError.\n    Read and write on fittings are separate ESI scopes, so a token good enough\n    to list is not necessarily good enough to create. Both paths surface the\n    refusal as the same typed rejection, letting callers branch on error class\n    rather than on message text.\n\n    Scenario: Listing fittings with an expired token\n      Given an invalid or expired token for fittings\n      When the client requests fittings with invalid token\n      Then the client shall return a 403 forbidden error for fittings\n\n    Scenario: Creating a fitting without the write scope\n      Given insufficient permissions for fitting creation\n      When the client attempts to create a fitting\n      Then the client shall return a 403 forbidden error for creation","sourceStart":80,"findings":[]}],"noUnwantedBehaviour":false,"orphanScenarios":0},{"file":"tests/bdd/features/core/0014-fleets.feature","area":"core","name":"Fleet Management","tags":["@TEST-10"],"charter":["TEST-10"],"description":"A fleet is a live, short-lived command structure: a boss, a message of the day, a tree of wings and squads, and the members assigned into them. The Fleet client covers reading that structure — the character's own membership, the fleet header, the member roster and the wing tree — and mutating it by updating settings, kicking or moving members, and creating wings and squads.\n\nFleet endpoints are authenticated and most writes are restricted to the fleet boss, so both the no-content success shape and the refusal shape are part of the specification.","boundBy":["tests/bdd/step-definitions/core/fleets.steps.ts"],"rules":[{"id":"0014-fleets#R1","title":"When the client requests the fleet information of a character, the Fleet client shall return the fleet_id and the role held in that fleet.","line":15,"pattern":"event-driven","exclusion":false,"verdict":"verified","evidence":"","charter":[],"tags":[],"scenarios":[{"title":"Fleet commander sees their fleet ID and role","line":20,"tags":[]}],"source":"  Rule: When the client requests the fleet information of a character, the Fleet client shall return the fleet_id and the role held in that fleet.\n    This is the entry point to every other call in this file: without the\n    fleet_id there is nothing to address. The role travels with it because it\n    determines which of the mutations below the caller is permitted to attempt.\n\n    Scenario: Fleet commander sees their fleet ID and role\n      Given a character that is in a fleet\n      When the client requests their fleet info\n      Then the client shall return their fleet assignment details","sourceStart":15,"findings":[]},{"id":"0014-fleets#R2","title":"If a character fleet lookup is answered with HTTP 404, then the Fleet client shall reject with an EsiError.","line":25,"pattern":"unwanted-behaviour","exclusion":false,"verdict":"verified","evidence":"","charter":[],"tags":[],"scenarios":[{"title":"Character who is not in any fleet","line":31,"tags":[]}],"source":"  Rule: If a character fleet lookup is answered with HTTP 404, then the Fleet client shall reject with an EsiError.\n    ESI reports \"not currently in a fleet\" as a 404 rather than as an empty\n    body, so the not-in-a-fleet case surfaces as a typed rejection. Callers\n    treating fleet membership as optional need to catch rather than test for a\n    null.\n\n    Scenario: Character who is not in any fleet\n      Given a character that is not in a fleet\n      When the client requests fleet info for the character not in a fleet\n      Then the client shall return a 404 error","sourceStart":25,"findings":[]},{"id":"0014-fleets#R3","title":"When the client requests fleet information, the Fleet client shall return the MOTD and the free-move setting.","line":38,"pattern":"event-driven","exclusion":false,"verdict":"verified","evidence":"","charter":[],"tags":[],"scenarios":[{"title":"Fleet details include the MOTD and free-move flag","line":44,"tags":[]}],"source":"  Rule: When the client requests fleet information, the Fleet client shall return the MOTD and the free-move setting.\n    The fleet header is the settings record: who is in charge, what the\n    broadcast message says, and whether members may reposition themselves in\n    the hierarchy without the boss. These are the same fields the update\n    endpoint writes.\n\n    Scenario: Fleet details include the MOTD and free-move flag\n      Given a valid fleet ID\n      When the client requests fleet details\n      Then the client shall return the fleet MOTD and settings","sourceStart":38,"findings":[]},{"id":"0014-fleets#R4","title":"When the client requests fleet members, the Fleet client shall return one entry per member carrying character_id, role, ship_type_id, and solar_system_id.","line":49,"pattern":"event-driven","exclusion":false,"verdict":"verified","evidence":"","charter":[],"tags":[],"scenarios":[{"title":"Member list covers commanders and squad members","line":55,"tags":[]}],"source":"  Rule: When the client requests fleet members, the Fleet client shall return one entry per member carrying character_id, role, ship_type_id, and solar_system_id.\n    The roster is what a fleet commander's tooling renders: who is present,\n    what they are flying, where they are, and what authority they hold. Ship\n    and system come from the same call rather than needing a separate location\n    lookup per member.\n\n    Scenario: Member list covers commanders and squad members\n      Given an active fleet with members\n      When the client requests the member list\n      Then the client shall return member details including ships and roles","sourceStart":49,"findings":[]},{"id":"0014-fleets#R5","title":"When the client requests fleet wings, the Fleet client shall return each wing with its identifier, name, and nested squad list.","line":60,"pattern":"event-driven","exclusion":false,"verdict":"verified","evidence":"","charter":[],"tags":[],"scenarios":[{"title":"Wings expose their nested squads","line":65,"tags":[]}],"source":"  Rule: When the client requests fleet wings, the Fleet client shall return each wing with its identifier, name, and nested squad list.\n    The wing tree is returned whole rather than as a flat list with parent\n    pointers, so a caller can render the hierarchy without a join. Wings with\n    differing squad counts are covered by the same shape.\n\n    Scenario: Wings expose their nested squads\n      Given an active fleet with wings\n      When the client requests the fleet wings\n      Then the client shall return wings with nested squads","sourceStart":60,"findings":[]},{"id":"0014-fleets#R6","title":"When the client creates a fleet wing, the Fleet client shall return the wing_id assigned by the server.","line":72,"pattern":"event-driven","exclusion":false,"verdict":"verified","evidence":"","charter":[],"tags":[],"scenarios":[{"title":"New wing returns the assigned wing ID","line":77,"tags":[]}],"source":"  Rule: When the client creates a fleet wing, the Fleet client shall return the wing_id assigned by the server.\n    Wing identifiers are allocated server-side, and the returned ID is the\n    handle needed to create squads underneath the new wing or to move members\n    into it.\n\n    Scenario: New wing returns the assigned wing ID\n      Given a fleet commander for wing creation\n      When the client creates a new wing\n      Then the client shall return the new wing ID","sourceStart":72,"findings":[]},{"id":"0014-fleets#R7","title":"When the client creates a fleet squad under a wing, the Fleet client shall return the squad_id assigned by the server.","line":82,"pattern":"event-driven","exclusion":false,"verdict":"verified","evidence":"","charter":[],"tags":[],"scenarios":[{"title":"New squad returns the assigned squad ID","line":87,"tags":[]}],"source":"  Rule: When the client creates a fleet squad under a wing, the Fleet client shall return the squad_id assigned by the server.\n    Squads hang off a wing, so creation takes the parent wing ID and answers\n    with the new squad's own identifier — the value a subsequent member move\n    targets.\n\n    Scenario: New squad returns the assigned squad ID\n      Given a fleet with a wing\n      When the client creates a squad under that wing\n      Then the client shall return the new squad ID","sourceStart":82,"findings":[]},{"id":"0014-fleets#R8","title":"When the client updates fleet settings, kicks a member, or moves a member, the Fleet client shall resolve with no response body.","line":94,"pattern":"event-driven","exclusion":false,"verdict":"verified","evidence":"","charter":[],"tags":[],"scenarios":[{"title":"Updating the MOTD and free-move flag","line":100,"tags":[]},{"title":"Kicking a member out of the fleet","line":105,"tags":[]},{"title":"Moving a member to another wing and squad","line":110,"tags":[]}],"source":"  Rule: When the client updates fleet settings, kicks a member, or moves a member, the Fleet client shall resolve with no response body.\n    All three mutations answer 204 No Content in ESI. The client surfaces that\n    as an undefined resolution rather than a synthesised status object, so the\n    absence of a rejection is the success signal. The three scenarios pin the\n    same shape across the three verbs.\n\n    Scenario: Updating the MOTD and free-move flag\n      Given a fleet boss\n      When the client updates the fleet MOTD and free-move setting\n      Then the fleet update shall complete without error\n\n    Scenario: Kicking a member out of the fleet\n      Given a fleet commander for kicking\n      When the client kicks a member from the fleet\n      Then the kick operation shall complete without error\n\n    Scenario: Moving a member to another wing and squad\n      Given a fleet commander and a member\n      When the client moves the member to a new wing and squad\n      Then the move operation shall complete without error","sourceStart":94,"findings":[]},{"id":"0014-fleets#R9","title":"When fleet information, members, and wings are requested together in one Promise.all, the Fleet client shall resolve each request with its own response.","line":117,"pattern":"event-driven","exclusion":false,"verdict":"verified","evidence":"","charter":[],"tags":[],"scenarios":[{"title":"Details, members, and wings fetched in parallel","line":122,"tags":[]}],"source":"  Rule: When fleet information, members, and wings are requested together in one Promise.all, the Fleet client shall resolve each request with its own response.\n    A fleet display needs all three views at once and they are independent\n    reads. The client keeps no per-instance request state that concurrent calls\n    could corrupt, and this scenario holds that property in place.\n\n    Scenario: Details, members, and wings fetched in parallel\n      Given a valid fleet for concurrent fetch\n      When the client fetches fleet details, members, and wings in parallel\n      Then all three requests shall resolve successfully","sourceStart":117,"findings":[]},{"id":"0014-fleets#R10","title":"If a fleet modification is answered with HTTP 403, then the Fleet client shall reject with an EsiError.","line":129,"pattern":"unwanted-behaviour","exclusion":false,"verdict":"verified","evidence":"","charter":[],"tags":[],"scenarios":[{"title":"Non-boss attempting to change fleet settings","line":134,"tags":[]}],"source":"  Rule: If a fleet modification is answered with HTTP 403, then the Fleet client shall reject with an EsiError.\n    Fleet writes are restricted to the boss, and ESI refuses everyone else with\n    403. Surfacing that as a typed rejection lets a caller distinguish \"you are\n    not the boss\" from a transport failure without parsing the body.\n\n    Scenario: Non-boss attempting to change fleet settings\n      Given a non-fleet-boss character\n      When the client attempts to modify fleet settings\n      Then the client shall return a 403 forbidden error for fleet","sourceStart":129,"findings":[]}],"noUnwantedBehaviour":false,"orphanScenarios":0},{"file":"tests/bdd/features/core/0015-freelance-jobs.feature","area":"core","name":"Freelance Jobs Management","tags":["@TEST-10"],"charter":["TEST-10"],"description":"Freelance jobs are player-published work contracts: a named objective with a progress target, an ISK reward that drains as contributions land, and a lifecycle state. The Freelance Jobs client covers the public listing, the per-job detail record, the character and corporation views of jobs an owner is involved in, a character's own participation record for one job, and the participant roll a corporation sees for one of its jobs.\n\nUnlike most of ESI these endpoints paginate with opaque before/after cursors rather than page numbers, so cursor handling is part of the contract.","boundBy":["tests/bdd/step-definitions/core/freelance-jobs.steps.ts"],"rules":[{"id":"0015-freelance-jobs#R1","title":"When the client requests the freelance job listing, the Freelance Jobs client shall return each job with its id, name, state, and progress, alongside a cursor carrying before and after tokens when present.","line":15,"pattern":"event-driven","exclusion":false,"verdict":"verified","evidence":"","charter":[],"tags":[],"scenarios":[{"title":"Open and in-progress jobs with a forward cursor","line":20,"tags":[]}],"source":"  Rule: When the client requests the freelance job listing, the Freelance Jobs client shall return each job with its id, name, state, and progress, alongside a cursor carrying before and after tokens when present.\n    The listing is a summary view — enough to render a board row without a\n    detail fetch per job. The cursor travels in the same envelope as the rows\n    rather than in headers, so a caller holds one object to page with.\n\n    Scenario: Open and in-progress jobs with a forward cursor\n      Given publicly available freelance jobs exist\n      When the client requests the job listing\n      Then the client shall return jobs with pagination cursors","sourceStart":15,"findings":[]},{"id":"0015-freelance-jobs#R2","title":"While no freelance jobs are published, the Freelance Jobs client shall return an empty job array, with no before or after token in its cursor when present.","line":25,"pattern":"state-driven","exclusion":false,"verdict":"verified","evidence":"","charter":[],"tags":[],"scenarios":[{"title":"No jobs published","line":31,"tags":[]}],"source":"  Rule: While no freelance jobs are published, the Freelance Jobs client shall return an empty job array, with no before or after token in its cursor when present.\n    An empty board is an ordinary state. ESI's Cursor defines both tokens as\n    optional strings, never null: an absent token is what tells a caller there\n    is nothing to page towards in that direction, which a zero-length array\n    alone would not.\n\n    Scenario: No jobs published\n      Given no freelance jobs exist\n      When the client requests the empty job listing\n      Then the client shall return an empty listing","sourceStart":25,"findings":[]},{"id":"0015-freelance-jobs#R3","title":"When the client requests a freelance job by identifier, the Freelance Jobs client shall return the job together with its details block carrying the description and career.","line":38,"pattern":"event-driven","exclusion":false,"verdict":"verified","evidence":"","charter":[],"tags":[],"scenarios":[{"title":"Hauling contract exposes its description and career","line":44,"tags":[]}],"source":"  Rule: When the client requests a freelance job by identifier, the Freelance Jobs client shall return the job together with its details block carrying the description and career.\n    The detail record adds everything the board row omits: the prose brief, the\n    career the job is aimed at, creator identity, and the contribution and\n    visibility configuration. Career in particular is how a caller filters jobs\n    a given pilot can usefully take.\n\n    Scenario: Hauling contract exposes its description and career\n      Given a valid job ID\n      When the client requests the job details\n      Then the client shall return the full job information","sourceStart":38,"findings":[]},{"id":"0015-freelance-jobs#R4","title":"If a freelance job detail record omits its contribution block, expiry, and broadcast locations, then the Freelance Jobs client shall return the job with those three fields undefined.","line":49,"pattern":"unwanted-behaviour","exclusion":false,"verdict":"verified","evidence":"","charter":[],"tags":[],"scenarios":[{"title":"Completed job with no contribution rules, expiry or broadcast","line":56,"tags":[]}],"source":"  Rule: If a freelance job detail record omits its contribution block, expiry, and broadcast locations, then the Freelance Jobs client shall return the job with those three fields undefined.\n    FreelanceJobsDetail marks contribution, details.expires and\n    access_and_visibility.broadcast_locations optional: a finished job carries\n    details.finished instead of an expiry, and a job need not be broadcast\n    anywhere. A detail read of such a job is an ordinary answer, not a\n    malformed one.\n\n    Scenario: Completed job with no contribution rules, expiry or broadcast\n      Given a completed job without optional detail blocks\n      When the client requests the completed job details\n      Then the client shall return the job without those optional fields","sourceStart":49,"findings":[]},{"id":"0015-freelance-jobs#R5","title":"When the client requests the freelance jobs of a character or of a corporation, the Freelance Jobs client shall return that owner's jobs in the same envelope as the public listing, including its cursor when present.","line":63,"pattern":"event-driven","exclusion":false,"verdict":"verified","evidence":"","charter":[],"tags":[],"scenarios":[{"title":"Character's own jobs","line":68,"tags":[]},{"title":"Corporation's own jobs","line":73,"tags":[]}],"source":"  Rule: When the client requests the freelance jobs of a character or of a corporation, the Freelance Jobs client shall return that owner's jobs in the same envelope as the public listing, including its cursor when present.\n    Both authenticated views reuse the public listing's shape so a caller can\n    render \"all jobs\" and \"my jobs\" through one code path. The two scenarios\n    exercise the character and corporation endpoints against that one shape.\n\n    Scenario: Character's own jobs\n      Given an authenticated character with freelance jobs\n      When the client requests their job listing\n      Then the client shall return the character jobs\n\n    Scenario: Corporation's own jobs\n      Given an authenticated corporation for freelance jobs\n      When the client requests their freelance jobs\n      Then the client shall return the corporation jobs listing","sourceStart":63,"findings":[]},{"id":"0015-freelance-jobs#R6","title":"When the client requests a character's participation in a freelance job, the Freelance Jobs client shall return the participation state, the contributed total, and the last_modified timestamp.","line":78,"pattern":"event-driven","exclusion":false,"verdict":"verified","evidence":"","charter":[],"tags":[],"scenarios":[{"title":"Character contribution to a mining job","line":85,"tags":[]}],"source":"  Rule: When the client requests a character's participation in a freelance job, the Freelance Jobs client shall return the participation state, the contributed total, and the last_modified timestamp.\n    Participation is a separate record from the job because a job has many\n    contributors and each sees only their own tally. The state separates a\n    committed participant from one who resigned or was kicked, and the\n    timestamp is what lets a caller show whether a commitment has gone stale.\n    ESI sends all three (CharactersFreelanceJobsParticipation).\n\n    Scenario: Character contribution to a mining job\n      Given a character participating in a job\n      When the client requests their participation details\n      Then the client shall return contribution data","sourceStart":78,"findings":[]},{"id":"0015-freelance-jobs#R7","title":"When the client requests the participants of a corporation freelance job, the Freelance Jobs client shall return a page whose participants each carry id, name, state, and contributed.","line":90,"pattern":"event-driven","exclusion":false,"verdict":"verified","evidence":"","charter":[],"tags":[],"scenarios":[{"title":"Participant roll for a corporation job with two contributors","line":95,"tags":[]}],"source":"  Rule: When the client requests the participants of a corporation freelance job, the Freelance Jobs client shall return a page whose participants each carry id, name, state, and contributed.\n    The corporation view lists everyone working the job, so a director can see\n    who contributed what. ESI wraps the roll in an object with an optional\n    cursor (CorporationsFreelanceJobsParticipants) rather than a bare array.\n\n    Scenario: Participant roll for a corporation job with two contributors\n      Given a corporation job with two participants\n      When the client requests the job participants\n      Then the client shall return the participant roll","sourceStart":90,"findings":[]},{"id":"0015-freelance-jobs#R8","title":"When the client supplies an after token, the Freelance Jobs client shall return the following page, whose cursor carries that token as its before value when present.","line":102,"pattern":"event-driven","exclusion":false,"verdict":"verified","evidence":"","charter":[],"tags":[],"scenarios":[{"title":"Following the after token to page two","line":107,"tags":[]}],"source":"  Rule: When the client supplies an after token, the Freelance Jobs client shall return the following page, whose cursor carries that token as its before value when present.\n    Cursor tokens are opaque and directional. The returned page echoes the\n    token it was reached by in its before slot, which is what makes paging back\n    the exact inverse of paging forward.\n\n    Scenario: Following the after token to page two\n      Given a first page with an after cursor\n      When the client requests the next page using the after token\n      Then the client shall return the second page of results","sourceStart":102,"findings":[]},{"id":"0015-freelance-jobs#R9","title":"When the client supplies a before token, the Freelance Jobs client shall return the preceding page, whose cursor,
