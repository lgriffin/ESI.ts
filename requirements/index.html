nt shall be low\n\n    Scenario: Open login reports the VIP flag clear with a full player count\n      Given the server is operating normally\n      When the client requests the status for VIP check\n      Then the VIP flag shall be false","sourceStart":42,"findings":[]},{"id":"0034-status#R3","title":"If ESI answers every attempt at a status request with a 5xx status and no usable cached entry exists, then the Status client shall reject the request with an EsiError.","line":60,"pattern":"unwanted-behaviour","exclusion":false,"verdict":"verified","evidence":"","charter":[],"tags":[],"scenarios":[{"title":"Service unavailable rejects the status request with an EsiError","line":66,"tags":[]},{"title":"Internal server error rejects the status request with an EsiError","line":71,"tags":[]}],"source":"  Rule: If ESI answers every attempt at a status request with a 5xx status and no usable cached entry exists, then the Status client shall reject the request with an EsiError.\n    Both the outage code and the internal error code arrive as failures rather\n    than as a status payload with a flag set, so the client raises a typed\n    EsiError. A caller polling for availability treats either as \"cluster not\n    reachable\".\n\n    Scenario: Service unavailable rejects the status request with an EsiError\n      Given the ESI API is unavailable\n      When the client requests the server status\n      Then the client shall return a 503 service unavailable error\n\n    Scenario: Internal server error rejects the status request with an EsiError\n      Given the ESI API encounters an internal error\n      When the client requests the server status for error check\n      Then the client shall return a 500 error","sourceStart":60,"findings":[]},{"id":"0034-status#R4","title":"While no unexpired cached entry exists for the status endpoint, the Status client shall return the payload of the current response on each successive status request.","line":78,"pattern":"state-driven","exclusion":false,"verdict":"verified","evidence":"","charter":[],"tags":[],"scenarios":[{"title":"Three successive polls track a changing player count under one server version","line":87,"tags":[]}],"source":"  Rule: While no unexpired cached entry exists for the status endpoint, the Status client shall return the payload of the current response on each successive status request.\n    Applications poll this endpoint on a timer. A poll that reaches the server\n    resolves against whatever the server returned for that call, so a changing\n    player count is observed across polls while a constant server version and\n    start time stay constant. ESI sends GET status with an ETag, and the spec\n    gives it a 30-second cache TTL. A poll inside that window is answered from\n    the ETag cache without a request, so polling faster than every 30 seconds\n    sees repeated payloads.\n\n    Scenario: Three successive polls track a changing player count under one server version\n      Given the server is online with gradually changing player counts\n      When the client checks the status multiple times\n      Then each check shall return valid data with consistent server version","sourceStart":78,"findings":[]}],"noUnwantedBehaviour":false,"orphanScenarios":0},{"file":"tests/bdd/features/core/0035-ui.feature","area":"core","name":"In-Game UI Control","tags":["@TEST-10"],"charter":["TEST-10"],"description":"The UI client drives the EVE client of the authenticated character: it sets autopilot waypoints and opens contract, information, market details, and new mail windows. Every one of these endpoints is a write with no response body, so the observable contract is which arguments reach the endpoint and that the call resolves without a payload. All of them need a character token, and a request made without one comes back as a forbidden error.","boundBy":["tests/bdd/step-definitions/core/ui.steps.ts"],"rules":[{"id":"0035-ui#R1","title":"When an autopilot waypoint is set, the UI client shall submit the destination identifier together with the add-to-beginning and clear-other-waypoints flags.","line":12,"pattern":"event-driven","exclusion":false,"verdict":"verified","evidence":"","charter":[],"tags":[],"scenarios":[{"title":"Waypoint appended to the existing route","line":18,"tags":[]},{"title":"Waypoint set with the clear-other-waypoints flag","line":23,"tags":[]}],"source":"  Rule: When an autopilot waypoint is set, the UI client shall submit the destination identifier together with the add-to-beginning and clear-other-waypoints flags.\n    The two boolean flags decide whether the destination is appended, put\n    first, or replaces the route entirely, so they travel with every waypoint\n    call rather than defaulting server-side. Route clearing is the flag with\n    destructive effect, so it is exercised on its own.\n\n    Scenario: Waypoint appended to the existing route\n      Given an authenticated character for waypoint\n      When the client sets an autopilot waypoint to a solar system\n      Then the waypoint shall be set successfully\n\n    Scenario: Waypoint set with the clear-other-waypoints flag\n      Given an authenticated character with existing waypoints\n      When the client sets a waypoint with clear flag\n      Then existing waypoints shall be cleared","sourceStart":12,"findings":[]},{"id":"0035-ui#R2","title":"When an identifier-addressed window is opened, the UI client shall submit that identifier and resolve with no response body.","line":30,"pattern":"event-driven","exclusion":false,"verdict":"verified","evidence":"","charter":[],"tags":[],"scenarios":[{"title":"Contract window opened for a contract identifier","line":36,"tags":[]},{"title":"Information window opened for a character identifier","line":41,"tags":[]},{"title":"Market details window opened for a type identifier","line":46,"tags":[]}],"source":"  Rule: When an identifier-addressed window is opened, the UI client shall submit that identifier and resolve with no response body.\n    The contract, information, and market details windows each take a single\n    identifier and return 204 with an empty body. Resolving to undefined\n    rather than to a parsed object is what tells a caller the request was\n    accepted, since there is nothing else to inspect.\n\n    Scenario: Contract window opened for a contract identifier\n      Given an authenticated character for contracts\n      When the client opens a contract window for a specific contract\n      Then the contract window shall open successfully\n\n    Scenario: Information window opened for a character identifier\n      Given an authenticated character for info window\n      When the client opens an info window for another character\n      Then the information window shall display successfully\n\n    Scenario: Market details window opened for a type identifier\n      Given an authenticated character for market\n      When the client opens the market details for an item type\n      Then the market window shall display successfully","sourceStart":30,"findings":[]},{"id":"0035-ui#R3","title":"When a new mail window is opened, the UI client shall submit the recipient list, subject, and body as the request payload.","line":51,"pattern":"event-driven","exclusion":false,"verdict":"verified","evidence":"","charter":[],"tags":[],"scenarios":[{"title":"Mail window opened with recipients, subject, and body","line":56,"tags":[]}],"source":"  Rule: When a new mail window is opened, the UI client shall submit the recipient list, subject, and body as the request payload.\n    Unlike the other window endpoints this one carries a composed draft rather\n    than an identifier, so the whole body is forwarded and the in-game\n    composer opens pre-filled. Nothing comes back to confirm the contents.\n\n    Scenario: Mail window opened with recipients, subject, and body\n      Given an authenticated character for mail\n      When the client opens a new mail window with recipients and content\n      Then the mail window shall display with pre-filled data","sourceStart":51,"findings":[]},{"id":"0035-ui#R4","title":"If a UI request is made without a token granting the openwindow scope, then the UI client shall reject the request with an EsiError.","line":63,"pattern":"unwanted-behaviour","exclusion":false,"verdict":"verified","evidence":"","charter":[],"tags":[],"scenarios":[{"title":"Unauthenticated waypoint request rejects with an EsiError","line":69,"tags":[]},{"title":"Unauthenticated contract window request rejects with an EsiError","line":74,"tags":[]}],"source":"  Rule: If a UI request is made without a token granting the openwindow scope, then the UI client shall reject the request with an EsiError.\n    These endpoints act on a running game client, so ESI refuses them outright\n    without the character scope. Both a waypoint write and a window open are\n    covered, because the rejection comes from the shared request path rather\n    than from either method.\n\n    Scenario: Unauthenticated waypoint request rejects with an EsiError\n      Given an unauthenticated user for waypoint\n      When the client attempts to set a waypoint\n      Then the client shall return a 403 forbidden error for waypoint\n\n    Scenario: Unauthenticated contract window request rejects with an EsiError\n      Given an unauthenticated user for contracts\n      When the client attempts to open a contract window\n      Then the client shall return a 403 forbidden error for contract","sourceStart":63,"findings":[]},{"id":"0035-ui#R5","title":"The UI client shall issue one request per call when five UI operations are invoked concurrently.","line":81,"pattern":"ubiquitous","exclusion":false,"verdict":"verified","evidence":"","charter":[],"tags":[],"scenarios":[{"title":"Five concurrent UI operations each issue exactly one request","line":86,"tags":[]}],"source":"  Rule: The UI client shall issue one request per call when five UI operations are invoked concurrently.\n    A tooling integration can fire several UI commands off one user action.\n    The client holds no shared per-request state, so each concurrent call\n    reaches its own endpoint exactly once and resolves independently.\n\n    Scenario: Five concurrent UI operations each issue exactly one request\n      Given an authenticated character for concurrent operations\n      When the client performs multiple UI operations concurrently\n      Then all operations shall complete successfully","sourceStart":81,"findings":[]}],"noUnwantedBehaviour":false,"orphanScenarios":0},{"file":"tests/bdd/features/core/0036-universe.feature","area":"core","name":"Universe Information","tags":["@TEST-10"],"charter":["TEST-10"],"description":"The Universe client covers the static map and item database: solar systems and the celestials inside them, stations and player structures, item types and the groups they belong to, plus the bulk identifier-to-name resolution endpoint. Most of these are public, cached for a long time, and reached by identifier, so the client is largely a typed read layer over identifiers a caller already holds.","boundBy":["tests/bdd/specs/core/0036-universe.spec.ts"],"rules":[{"id":"0036-universe#R1","title":"When a solar system is requested by identifier, the Universe client shall return its name and security status, and its stargate, station, and planet identifier arrays when present.","line":12,"pattern":"event-driven","exclusion":false,"verdict":"verified","evidence":"","charter":[],"tags":[],"scenarios":[{"title":"Jita returns its name, security status, and celestial identifier arrays","line":18,"tags":[]}],"source":"  Rule: When a solar system is requested by identifier, the Universe client shall return its name and security status, and its stargate, station, and planet identifier arrays when present.\n    A system record is the hub of the map graph: the stargate list gives the\n    edges, and the station and planet lists give the celestials a caller can\n    then look up individually. Security status is returned as the raw float\n    rather than the rounded value shown in the game client.\n\n    Scenario: Jita returns its name, security status, and celestial identifier arrays\n      Given a valid solar system ID\n      When the client requests system information\n      Then the client shall return complete system details","sourceStart":12,"findings":[]},{"id":"0036-universe#R2","title":"If ESI does not recognise the requested solar system identifier, then the Universe client shall reject the request with an EsiError.","line":23,"pattern":"unwanted-behaviour","exclusion":false,"verdict":"verified","evidence":"","charter":[],"tags":[],"scenarios":[{"title":"Unknown system identifier rejects with an EsiError","line":28,"tags":[]}],"source":"  Rule: If ESI does not recognise the requested solar system identifier, then the Universe client shall reject the request with an EsiError.\n    Map identifiers are frequently derived from user input or stale exports, so\n    a lookup miss is expected traffic. It arrives as a 404 and is surfaced as a\n    typed EsiError rather than as an empty system record.\n\n    Scenario: Unknown system identifier rejects with an EsiError\n      Given an invalid solar system ID\n      When the client requests invalid system information\n      Then the client shall return a not found error","sourceStart":23,"findings":[]},{"id":"0036-universe#R3","title":"When an identifier index is requested, the Universe client shall return an array of numeric identifiers.","line":35,"pattern":"event-driven","exclusion":false,"verdict":"verified","evidence":"","charter":[],"tags":[],"scenarios":[{"title":"System index returns numeric system identifiers","line":41,"tags":[]},{"title":"Item group index returns numeric group identifiers","line":46,"tags":[]}],"source":"  Rule: When an identifier index is requested, the Universe client shall return an array of numeric identifiers.\n    The index endpoints return bare identifier arrays with no accompanying\n    detail, and callers page through them to build a local mirror of the\n    static data. Systems and item groups are both exercised because they share\n    one response shape.\n\n    Scenario: System index returns numeric system identifiers\n      Given the universe data is available\n      When the client requests all systems\n      Then the client shall return a list of all system IDs\n\n    Scenario: Item group index returns numeric group identifiers\n      Given the universe data is available for groups\n      When the client requests all item groups\n      Then the client shall return a list of all group IDs","sourceStart":35,"findings":[]},{"id":"0036-universe#R4","title":"When an index response carries 8000 identifiers, the Universe client shall resolve the array within 1000 milliseconds.","line":51,"pattern":"event-driven","exclusion":false,"verdict":"verified","evidence":"","charter":[],"tags":[],"scenarios":[{"title":"Index of 8000 systems resolves within the time bound","line":56,"tags":[]}],"source":"  Rule: When an index response carries 8000 identifiers, the Universe client shall resolve the array within 1000 milliseconds.\n    The real system index is several thousand entries and the type index is\n    larger still, so the client does no per-element work that would turn a\n    large index into a stall for the calling application.\n\n    Scenario: Index of 8000 systems resolves within the time bound\n      Given a request for all systems with large dataset\n      When the client processes the large dataset\n      Then the client shall handle it efficiently","sourceStart":51,"findings":[]},{"id":"0036-universe#R5","title":"When a station is requested by identifier, the Universe client shall return its name, host solar system identifier, service list, and maximum dockable ship volume.","line":63,"pattern":"event-driven","exclusion":false,"verdict":"verified","evidence":"","charter":[],"tags":[],"scenarios":[{"title":"Station returns its host system and service list","line":69,"tags":[]}],"source":"  Rule: When a station is requested by identifier, the Universe client shall return its name, host solar system identifier, service list, and maximum dockable ship volume.\n    NPC stations differ from each other mainly in what they let a pilot do, so\n    the service list is the field callers branch on when deciding where to\n    reprocess, trade, or fit. Dockable volume decides whether a capital can\n    enter at all.\n\n    Scenario: Station returns its host system and service list\n      Given a valid station ID\n      When the client requests station information\n      Then the client shall return complete station details","sourceStart":63,"findings":[]},{"id":"0036-universe#R6","title":"When a structure is requested by identifier, the Universe client shall return its name and host solar system identifier, and its position vector when present.","line":74,"pattern":"event-driven","exclusion":false,"verdict":"verified","evidence":"","charter":[],"tags":[],"scenarios":[{"title":"Structure returns its host system and position vector","line":79,"tags":[]}],"source":"  Rule: When a structure is requested by identifier, the Universe client shall return its name and host solar system identifier, and its position vector when present.\n    Player structures are placed at arbitrary coordinates rather than at a\n    fixed celestial, so the position vector is what locates them on the system\n    map. This endpoint needs a docking-access token, unlike the station one.\n\n    Scenario: Structure returns its host system and position vector\n      Given a valid structure ID\n      When the client requests structure information\n      Then the client shall return structure details","sourceStart":74,"findings":[]},{"id":"0036-universe#R7","title":"When a star is requested by identifier, the Universe client shall return its name, host solar system identifier, spectral class, temperature, and radius.","line":86,"pattern":"event-driven","exclusion":false,"verdict":"verified","evidence":"","charter":[],"tags":[],"scenarios":[{"title":"Star returns its spectral class, temperature, and radius","line":91,"tags":[]}],"source":"  Rule: When a star is requested by identifier, the Universe client shall return its name, host solar system identifier, spectral class, temperature, and radius.\n    Star attributes drive both the visual rendering of a system and the\n    industrial output of anything anchored around it, so the physical values\n    come back alongside the identity fields.\n\n    Scenario: Star returns its spectral class, temperature, and radius\n      Given a valid star ID\n      When the client requests star information\n      Then the client shall return star details","sourceStart":86,"findings":[]},{"id":"0036-universe#R8","title":"When a planet is requested by identifier, the Universe client shall return its name, host solar system identifier, and position vector.","line":96,"pattern":"event-driven","exclusion":false,"verdict":"verified","evidence":"","charter":[],"tags":[],"scenarios":[{"title":"Planet returns its host system and position","line":101,"tags":[]}],"source":"  Rule: When a planet is requested by identifier, the Universe client shall return its name, host solar system identifier, and position vector.\n    Planets are addressed by the identifiers listed on the parent system\n    record, and the position vector is what places them relative to the star\n    for distance and travel-time calculations.\n\n    Scenario: Planet returns its host system and position\n      Given a valid planet ID\n      When the client requests planet information\n      Then the client shall return planet details","sourceStart":96,"findings":[]},{"id":"0036-universe#R9","title":"When an item type is requested by identifier, the Universe client shall return its name, description, group identifier, and published flag, and its volume when present.","line":108,"pattern":"event-driven","exclusion":false,"verdict":"verified","evidence":"","charter":[],"tags":[],"scenarios":[{"title":"Tritanium returns its group, volume, and published flag","line":113,"tags":[]}],"source":"  Rule: When an item type is requested by identifier, the Universe client shall return its name, description, group identifier, and published flag, and its volume when present.\n    Volume is what every hauling and fitting calculation starts from, and the\n    published flag marks types that exist in the database but are not\n    obtainable in game, which a caller filters out before showing them.\n\n    Scenario: Tritanium returns its group, volume, and published flag\n      Given a valid type ID\n      When the client requests type information\n      Then the client shall return complete item details","sourceStart":108,"findings":[]},{"id":"0036-universe#R10","title":"When an item group is requested by identifier, the Universe client shall return its name, category identifier, and the identifiers of the types it contains.","line":118,"pattern":"event-driven","exclusion":false,"verdict":"verified","evidence":"","charter":[],"tags":[],"scenarios":[{"title":"Mineral group returns its category and contained type identifiers","line":123,"tags":[]}],"source":"  Rule: When an item group is requested by identifier, the Universe client shall return its name, category identifier, and the identifiers of the types it contains.\n    Groups are the middle tier between category and type. Returning the\n    contained type identifiers inline means a caller can walk category to\n    group to type without a separate index call at each level.\n\n    Scenario: Mineral group returns its category and contained type identifiers\n      Given a valid group ID\n      When the client requests group information\n      Then the client shall return group details and contained types","sourceStart":118,"findings":[]},{"id":"0036-universe#R11","title":"When a list of entity identifiers is posted for resolution, the Universe client shall return one entry per identifier carrying its name and category.","line":130,"pattern":"event-driven","exclusion":false,"verdict":"verified","evidence":"","charter":[],"tags":[],"scenarios":[{"title":"Mixed identifier list resolves to names with categories","line":136,"tags":[]}],"source":"  Rule: When a list of entity identifiers is posted for resolution, the Universe client shall return one entry per identifier carrying its name and category.\n    This endpoint is the general escape hatch for turning identifiers found in\n    killmails, contracts, or wallet journals into something displayable. The\n    category field is what tells the caller which typed endpoint to follow up\n    with, since the identifiers themselves are not self-describing.\n\n    Scenario: Mixed identifier list resolves to names with categories\n      Given a list of entity IDs\n      When the client requests name resolution\n      Then the client shall return entity names and categories","sourceStart":130,"findings":[]},{"id":"0036-universe#R12","title":"When a universe search is performed for a term, the Search client shall return the matching identifiers grouped by entity category.","line":141,"pattern":"event-driven","exclusion":false,"verdict":"verified","evidence":"","charter":[],"tags":[],"scenarios":[{"title":"Search for Jita returns matching system and station identifiers","line":147,"tags":[]}],"source":"  Rule: When a universe search is performed for a term, the Search client shall return the matching identifiers grouped by entity category.\n    Searching is the inverse of name resolution and lives on the authenticated\n    character search endpoint. Results arrive keyed by category, so a term\n    matching both a system and its stations produces populated arrays under\n    each and empty arrays elsewhere.\n\n    Scenario: Search for Jita returns matching system and station identifiers\n      Given a search term for the universe\n      When the client searches the universe\n      Then the client shall return matching entities","sourceStart":141,"findings":[]},{"id":"0036-universe#R13","title":"The Universe client shall return the record matching each requested identifier when system lookups are issued concurrently.","line":154,"pattern":"ubiquitous","exclusion":false,"verdict":"verified","evidence":"","charter":[],"tags":[],"scenarios":[{"title":"Three concurrent system lookups each return their own system","line":159,"tags":[]}],"source":"  Rule: The Universe client shall return the record matching each requested identifier when system lookups are issued concurrently.\n    Map tooling fans out over a set of systems at once. The client keeps no\n    per-instance request state, so responses stay bound to the identifier that\n    asked for them rather than to arrival order.\n\n    Scenario: Three concurrent system lookups each return their own system\n      Given multiple concurrent universe data requests are prepared\n      When the client requests the prepared systems simultaneously\n      Then all system requests shall complete successfully","sourceStart":154,"findings":[]},{"id":"0036-universe#R14","title":"When identifiers taken from a system record are used to look up its star, station, and planet, the Universe client shall return bodies reporting that same solar system as their host.","line":164,"pattern":"event-driven","exclusion":false,"verdict":"verified","evidence":"","charter":[],"tags":[],"scenarios":[{"title":"System lookup chained into star, station, and planet lookups","line":170,"tags":[]}],"source":"  Rule: When identifiers taken from a system record are used to look up its star, station, and planet, the Universe client shall return bodies reporting that same solar system as their host.\n    This is the composition the map graph is built on: one system read yields\n    the identifiers for its celestials, and each celestial read points back at\n    the system. The round trip is what makes the identifier arrays on the\n    system record usable without a separate lookup table.\n\n    Scenario: System lookup chained into star, station, and planet lookups\n      Given a system ID for exploration\n      When the client gathers complete system information\n      Then the client shall successfully retrieve all system data","sourceStart":164,"findings":[]}],"noUnwantedBehaviour":false,"orphanScenarios":0},{"file":"tests/bdd/features/core/0037-wallet.feature","area":"core","name":"Wallets","tags":["@TEST-10"],"charter":["TEST-10"],"description":"The Wallet client covers the money endpoints for both a character and a corporation: the current ISK balance, the journal of every movement with its reference type and running balance, and the market transaction records behind those movements. Corporation wallets are split across seven divisions, each addressed separately. Everything here is authenticated, and the corporation endpoints additionally need director-level roles.","boundBy":["tests/bdd/specs/core/0037-wallet.spec.ts"],"rules":[{"id":"0037-wallet#R1","title":"When a character wallet balance is requested, the Wallet client shall return the balance as a number.","line":12,"pattern":"event-driven","exclusion":false,"verdict":"verified","evidence":"","charter":[],"tags":[],"scenarios":[{"title":"Funded wallet returns the ISK amount as a number","line":18,"tags":[]},{"title":"Empty wallet returns zero","line":23,"tags":[]}],"source":"  Rule: When a character wallet balance is requested, the Wallet client shall return the balance as a number.\n    The endpoint returns a bare JSON number rather than an object, so the\n    client passes it through as a number instead of wrapping it. A wallet with\n    nothing in it returns zero, which is a value a caller has to be able to\n    tell apart from a missing response.\n\n    Scenario: Funded wallet returns the ISK amount as a number\n      Given an authenticated character for wallet\n      When the client requests their wallet balance\n      Then the client shall return the ISK amount\n\n    Scenario: Empty wallet returns zero\n      Given a character with no ISK\n      When the client requests the zero balance\n      Then the client shall return zero","sourceStart":12,"findings":[]},{"id":"0037-wallet#R2","title":"When a character wallet journal is requested, the Wallet client shall return one entry per movement carrying its identifier, date, and reference type, and its amount and resulting balance when present.","line":30,"pattern":"event-driven","exclusion":false,"verdict":"verified","evidence":"","charter":[],"tags":[],"scenarios":[{"title":"Journal returns identifier, date, reference type, amount, and balance per entry","line":36,"tags":[]}],"source":"  Rule: When a character wallet journal is requested, the Wallet client shall return one entry per movement carrying its identifier, date, and reference type, and its amount and resulting balance when present.\n    The reference type is what classifies a movement as a bounty, a market\n    trade, or a transfer, and the running balance lets a caller reconstruct\n    the account history without re-adding the amounts. Amounts are signed, so\n    income and expenditure share one field.\n\n    Scenario: Journal returns identifier, date, reference type, amount, and balance per entry\n      Given an authenticated character with transaction history\n      When the client requests their wallet journal\n      Then the client shall return journal entries","sourceStart":30,"findings":[]},{"id":"0037-wallet#R3","title":"If a character has recorded no wallet movements, then the Wallet client shall return an empty array.","line":41,"pattern":"unwanted-behaviour","exclusion":false,"verdict":"verified","evidence":"","charter":[],"tags":[],"scenarios":[{"title":"New character with no movements returns an empty journal array","line":46,"tags":[]}],"source":"  Rule: If a character has recorded no wallet movements, then the Wallet client shall return an empty array.\n    A newly created character has an empty journal rather than a missing one.\n    Returning an empty array keeps the response shape stable so callers can\n    iterate without a null check.\n\n    Scenario: New character with no movements returns an empty journal array\n      Given a new character with no activity\n      When the client requests the new character wallet journal\n      Then the client shall return an empty journal array","sourceStart":41,"findings":[]},{"id":"0037-wallet#R4","title":"When character wallet transactions are requested, the Wallet client shall return one record per trade carrying its transaction identifier, type identifier, unit price, quantity, and buy flag.","line":51,"pattern":"event-driven","exclusion":false,"verdict":"verified","evidence":"","charter":[],"tags":[],"scenarios":[{"title":"Transactions return unit price, quantity, and buy flag per record","line":56,"tags":[]}],"source":"  Rule: When character wallet transactions are requested, the Wallet client shall return one record per trade carrying its transaction identifier, type identifier, unit price, quantity, and buy flag.\n    Transactions are the market-side detail behind the market_transaction\n    journal entries. Unit price and quantity are separate numbers rather than\n    a pre-multiplied total, and the buy flag gives the direction of the trade.\n\n    Scenario: Transactions return unit price, quantity, and buy flag per record\n      Given an authenticated character with market activity\n      When the client requests their transactions\n      Then the client shall return transaction records","sourceStart":51,"findings":[]},{"id":"0037-wallet#R5","title":"When corporation wallets are requested, the Wallet client shall return one entry per division carrying the division number and its balance.","line":63,"pattern":"event-driven","exclusion":false,"verdict":"verified","evidence":"","charter":[],"tags":[],"scenarios":[{"title":"Seven corporation divisions return their division numbers and balances","line":68,"tags":[]}],"source":"  Rule: When corporation wallets are requested, the Wallet client shall return one entry per division carrying the division number and its balance.\n    A corporation has seven wallet divisions and the listing returns all of\n    them in division order, including any left at zero. That ordering is what\n    lets a caller map a division number straight onto a display row.\n\n    Scenario: Seven corporation divisions return their division numbers and balances\n      Given an authenticated director\n      When the client requests corporation wallets\n      Then the client shall return all wallet divisions","sourceStart":63,"findings":[]},{"id":"0037-wallet#R6","title":"When a corporation wallet history is requested with a division number, the Wallet client shall return the records booked to that division.","line":73,"pattern":"event-driven","exclusion":false,"verdict":"verified","evidence":"","charter":[],"tags":[],"scenarios":[{"title":"Division 1 journal returns entries booked to that division","line":78,"tags":[]},{"title":"Division 1 transactions return records booked to that division","line":83,"tags":[]}],"source":"  Rule: When a corporation wallet history is requested with a division number, the Wallet client shall return the records booked to that division.\n    Journal and transaction history are per-division, not per-corporation, so\n    the division number is part of the path rather than a filter applied after\n    the fact. Both histories are exercised because they share that addressing.\n\n    Scenario: Division 1 journal returns entries booked to that division\n      Given an authenticated director for journal\n      When the client requests the journal for division 1\n      Then the client shall return journal entries for that division\n\n    Scenario: Division 1 transactions return records booked to that division\n      Given an authenticated director for transactions\n      When the client requests transactions for division 1\n      Then the client shall return corporation transaction records","sourceStart":73,"findings":[]},{"id":"0037-wallet#R7","title":"If a wallet request is made without the scope or corporation role it needs, then the Wallet client shall reject the request with an EsiError.","line":90,"pattern":"unwanted-behaviour","exclusion":false,"verdict":"verified","evidence":"","charter":[],"tags":[],"scenarios":[{"title":"Character wallet request without a token rejects with an EsiError","line":98,"tags":[]},{"title":"Corporation wallet request without director rights rejects with an EsiError","line":103,"tags":[]}],"source":"  Rule: If a wallet request is made without the scope or corporation role it needs, then the Wallet client shall reject the request with an EsiError.\n    Wallet data is the most sensitive thing ESI exposes, so both a token\n    without the wallet scope and a member without director rights are refused\n    by ESI with a 403. The client raises a typed EsiError in either case rather\n    than returning a zero balance. A client with no token at all never reaches\n    ESI: it throws a NO_AUTH_TOKEN error, which is not an EsiError, before\n    sending the request.\n\n    Scenario: Character wallet request without a token rejects with an EsiError\n      Given an unauthenticated user for character wallet\n      When the client requests a character wallet balance without auth\n      Then the client shall return a 403 forbidden error for character wallet\n\n    Scenario: Corporation wallet request without director rights rejects with an EsiError\n      Given a non-director character for corporation wallet\n      When the client requests corporation wallets without auth\n      Then the client shall return a 403 forbidden error for corporation wallet","sourceStart":90,"findings":[]},{"id":"0037-wallet#R8","title":"The Wallet client shall return the balance, journal, and transaction payloads independently when all three are requested concurrently.","line":110,"pattern":"ubiquitous","exclusion":false,"verdict":"verified","evidence":"","charter":[],"tags":[],"scenarios":[{"title":"Concurrent balance, journal, and transaction calls each resolve independently","line":115,"tags":[]}],"source":"  Rule: The Wallet client shall return the balance, journal, and transaction payloads independently when all three are requested concurrently.\n    A financial view needs all three at once, and the balance endpoint returns\n    a number while the other two return arrays. The three in-flight calls\n    resolve to their own payloads with their own shapes.\n\n    Scenario: Concurrent balance, journal, and transaction calls each resolve independently\n      Given an authenticated character for concurrent wallet ops\n      When the client fetches balance, journal, and transactions concurrently\n      Then all wallet data shall complete successfully","sourceStart":110,"findings":[]},{"id":"0037-wallet#R9","title":"When journal and transaction payloads are combined, the Wallet client shall return signed journal amounts and transaction buy flags that total into income, expenditure, and trade direction counts.","line":120,"pattern":"event-driven","exclusion":false,"verdict":"verified","evidence":"","charter":[],"tags":[],"scenarios":[{"title":"Journal amounts and buy flags total into income, expenditure, and trade counts","line":126,"tags":[]}],"source":"  Rule: When journal and transaction payloads are combined, the Wallet client shall return signed journal amounts and transaction buy flags that total into income, expenditure, and trade direction counts.\n    Nothing in ESI reports income and expenditure separately, so a caller\n    derives them by partitioning the journal on the sign of the amount and the\n    transactions on the buy flag. That arithmetic only holds if amounts keep\n    their sign and the flag is a real boolean.\n\n    Scenario: Journal amounts and buy flags total into income, expenditure, and trade counts\n      Given an authenticated character with financial history\n      When the client gathers all financial data\n      Then the client shall compute a financial summary","sourceStart":120,"findings":[]}],"noUnwantedBehaviour":false,"orphanScenarios":0},{"file":"tests/bdd/features/core/0038-wars.feature","area":"core","name":"Wars","tags":["@TEST-10"],"charter":["TEST-10"],"description":"The Wars client covers the public war register: the index of declared wars, the detail record for one war with its aggressor and defender statistics and its declaration, start, and finish timestamps, and the killmail summaries attributed to it. None of it needs a token, and the identifiers are handed out in declaration order, which is what makes the index usable as a feed.","boundBy":["tests/bdd/specs/core/0038-wars.spec.ts"],"rules":[{"id":"0038-wars#R1","title":"When the war list is requested, the Wars client shall return an array of positive numeric war identifiers.","line":11,"pattern":"event-driven","exclusion":false,"verdict":"verified","evidence":"","charter":[],"tags":[],"scenarios":[{"title":"War list returns positive numeric identifiers","line":16,"tags":[]}],"source":"  Rule: When the war list is requested, the Wars client shall return an array of positive numeric war identifiers.\n    The index carries identifiers only, with no detail attached, so a caller\n    walks it and fetches the wars it cares about. Identifiers are plain\n    positive numbers rather than strings or objects.\n\n    Scenario: War list returns positive numeric identifiers\n      Given wars exist in the system\n      When the client requests the list of wars\n      Then the client shall return an array of war IDs","sourceStart":11,"findings":[]},{"id":"0038-wars#R2","title":"When the war list is requested, the Wars client shall return the identifiers in descending numeric order.","line":21,"pattern":"event-driven","exclusion":false,"verdict":"verified","evidence":"","charter":[],"tags":[],"scenarios":[{"title":"War list identifiers descend from newest to oldest","line":26,"tags":[]}],"source":"  Rule: When the war list is requested, the Wars client shall return the identifiers in descending numeric order.\n    War identifiers increase with each declaration, so descending order puts\n    the newest war first. A caller polling for new declarations reads from the\n    head of the array and stops at the last identifier it already saw.\n\n    Scenario: War list identifiers descend from newest to oldest\n      Given multiple wars exist in descending order\n      When the client requests the war list\n      Then war IDs shall be in descending order","sourceStart":21,"findings":[]},{"id":"0038-wars#R3","title":"When a war is requested by identifier, the Wars client shall return aggressor and defender blocks carrying ISK destroyed and ships killed, and the declared timestamp, along with each block's alliance identifier and the started timestamp when present.","line":33,"pattern":"event-driven","exclusion":false,"verdict":"verified","evidence":"","charter":[],"tags":[],"scenarios":[{"title":"Active war returns both combatant blocks and its declaration timestamps","line":39,"tags":[]}],"source":"  Rule: When a war is requested by identifier, the Wars client shall return aggressor and defender blocks carrying ISK destroyed and ships killed, and the declared timestamp, along with each block's alliance identifier and the started timestamp when present.\n    The two combatant blocks are symmetric, which is what lets a caller render\n    either side with one code path. Declared and started differ because a war\n    declaration takes 24 hours to come into effect, and a war still running\n    reports no finish timestamp.\n\n    Scenario: Active war returns both combatant blocks and its declaration timestamps\n      Given an active war exists\n      When the client requests the war details\n      Then the client shall return complete war information","sourceStart":33,"findings":[]},{"id":"0038-wars#R4","title":"When a war has concluded, the Wars client shall return a finished timestamp ordered after its declared timestamp and after its started timestamp when present.","line":44,"pattern":"event-driven","exclusion":false,"verdict":"verified","evidence":"","charter":[],"tags":[],"scenarios":[{"title":"Concluded war returns a finished timestamp after its start","line":49,"tags":[]}],"source":"  Rule: When a war has concluded, the Wars client shall return a finished timestamp ordered after its declared timestamp and after its started timestamp when present.\n    The finish timestamp is the field that distinguishes a historical war from\n    a live one. Its ordering against the other two is what a caller uses to\n    compute how long the conflict actually ran.\n\n    Scenario: Concluded war returns a finished timestamp after its start\n      Given a finished war exists\n      When the client requests the finished war details\n      Then the finished timestamp shall be populated","sourceStart":44,"findings":[]},{"id":"0038-wars#R5","title":"When a war is requested by identifier, the Wars client shall return the mutual flag as a boolean.","line":54,"pattern":"event-driven","exclusion":false,"verdict":"verified","evidence":"","charter":[],"tags":[],"scenarios":[{"title":"Mutually agreed war reports the mutual flag set","line":59,"tags":[]}],"source":"  Rule: When a war is requested by identifier, the Wars client shall return the mutual flag as a boolean.\n    A mutual war has been agreed by both parties, which removes the surrender\n    mechanic and changes who can join. Callers branch on the flag directly, so\n    it arrives as a boolean rather than as a string or a presence marker.\n\n    Scenario: Mutually agreed war reports the mutual flag set\n      Given a mutual war exists\n      When the client requests the mutual war details\n      Then the mutual flag shall be true","sourceStart":54,"findings":[]},{"id":"0038-wars#R6","title":"When war killmails are requested, the Wars client shall return one summary per kill carrying a numeric killmail identifier and a string hash.","line":66,"pattern":"event-driven","exclusion":false,"verdict":"verified","evidence":"","charter":[],"tags":[],"scenarios":[{"title":"War with three kills returns an identifier and hash per summary","line":71,"tags":[]}],"source":"  Rule: When war killmails are requested, the Wars client shall return one summary per kill carrying a numeric killmail identifier and a string hash.\n    The summaries are references, not killmails: the identifier and hash pair\n    is what the Killmails client needs to fetch the full record. Both fields\n    are required for that follow-up call, so both are always present.\n\n    Scenario: War with three kills returns an identifier and hash per summary\n      Given a war with killmails exists\n      When the client requests the war killmails\n      Then the client shall return killmail summaries","sourceStart":66,"findings":[]},{"id":"0038-wars#R7","title":"If a war has no killmails attributed to it, then the Wars client shall return an empty array.","line":76,"pattern":"unwanted-behaviour","exclusion":false,"verdict":"verified","evidence":"","charter":[],"tags":[],"scenarios":[{"title":"War with no kills returns an empty killmail array","line":81,"tags":[]}],"source":"  Rule: If a war has no killmails attributed to it, then the Wars client shall return an empty array.\n    A war that was declared but never fought still exists in the register. Its\n    killmail list is empty rather than absent, so a caller iterates the result\n    without a null check.\n\n    Scenario: War with no kills returns an empty killmail array\n      Given a war with no killmails exists\n      When the client requests the war killmails for empty war\n      Then the client shall return an empty killmail array","sourceStart":76,"findings":[]},{"id":"0038-wars#R8","title":"If ESI does not recognise the requested war identifier, then the Wars client shall reject the request with an EsiError.","line":88,"pattern":"unwanted-behaviour","exclusion":false,"verdict":"verified","evidence":"","charter":[],"tags":[],"scenarios":[{"title":"Unknown war identifier rejects the detail request with an EsiError","line":93,"tags":[]},{"title":"Unknown war identifier rejects the killmail request with an EsiError","line":98,"tags":[]}],"source":"  Rule: If ESI does not recognise the requested war identifier, then the Wars client shall reject the request with an EsiError.\n    War identifiers come from the index or from user input, and both can point\n    at a war that never existed. Detail and killmail lookups are covered\n    together because the 404 is raised on the shared request path.\n\n    Scenario: Unknown war identifier rejects the detail request with an EsiError\n      Given an invalid war ID for details\n      When the client requests the invalid war details\n      Then the client shall return a 404 not found error for war details\n\n    Scenario: Unknown war identifier rejects the killmail request with an EsiError\n      Given an invalid war ID for killmails\n      When the client requests killmails for invalid war\n      Then the client shall return a 404 not found error for killmails","sourceStart":88,"findings":[]},{"id":"0038-wars#R9","title":"When one side of a war is compared against the other, the Wars client shall return per-side ISK destroyed and ships killed values as numbers that can be ordered and summed.","line":105,"pattern":"event-driven","exclusion":false,"verdict":"verified","evidence":"","charter":[],"tags":[],"scenarios":[{"title":"Aggressor outscores the defender on ISK destroyed and ships killed","line":110,"tags":[]}],"source":"  Rule: When one side of a war is compared against the other, the Wars client shall return per-side ISK destroyed and ships killed values as numbers that can be ordered and summed.\n    ESI states no winner. A caller derives dominance by comparing the two\n    sides and dividing one side of ISK destroyed by the combined total, which\n    only works if both figures are plain numbers on both blocks.\n\n    Scenario: Aggressor outscores the defender on ISK destroyed and ships killed\n      Given a war with combat data exists\n      When the client analyzes the war stats\n      Then the client shall determine the dominant side","sourceStart":105,"findings":[]},{"id":"0038-wars#R10","title":"When war detail and war killmails are gathered concurrently for one identifier, the Wars client shall return a detail record and a killmail array for that same war.","line":115,"pattern":"event-driven","exclusion":false,"verdict":"verified","evidence":"","charter":[],"tags":[],"scenarios":[{"title":"War detail and killmails gathered for the same war identifier","line":120,"tags":[]}],"source":"  Rule: When war detail and war killmails are gathered concurrently for one identifier, the Wars client shall return a detail record and a killmail array for that same war.\n    A conflict report needs the aggregate statistics and the individual kills\n    side by side. The two endpoints are independent, so they are fetched\n    together and joined on the war identifier the caller already holds.\n\n    Scenario: War detail and killmails gathered for the same war identifier\n      Given a war ID to investigate\n      When the client gathers full war data including details and killmails\n      Then the client shall build a complete picture of the conflict","sourceStart":115,"findings":[]}],"noUnwantedBehaviour":false,"orphanScenarios":0},{"file":"tests/bdd/features/core/0039-access-lists.feature","area":"core","name":"Access Lists","tags":["@TEST-10"],"charter":["TEST-10"],"description":"The Access Lists client reads the named permission lists a character owns, the ones that decide who may dock at a structure, use a service, or refuel a sovereignty hub. A list is an identifier, a name and a description plus its membership: whether everyone is allowed, and the alliances, corporations and characters it names, each with an access level of Allowed, Blocked, Manager or Admin. The endpoint is character-scoped and token-gated.","boundBy":["tests/bdd/specs/core/0039-access-lists.spec.ts"],"rules":[{"id":"0039-access-lists#R1","title":"When an access list is requested, the Access Lists client shall return its id, name, description and membership, with one entry per listed alliance, corporation and character carrying that member's access level.","line":12,"pattern":"event-driven","exclusion":false,"verdict":"verified","evidence":"","charter":[],"tags":[],"scenarios":[{"title":"List with alliance, corporation, and character members returns each access level","line":18,"tags":[]}],"source":"  Rule: When an access list is requested, the Access Lists client shall return its id, name, description and membership, with one entry per listed alliance, corporation and character carrying that member's access level.\n    ESI groups the membership by entity kind, so an alliance block and a\n    character admin sit in separate arrays of the same record. The access\n    level is per member rather than per list, which is what lets one list\n    express an allow set, a deny set and its managers together.\n\n    Scenario: List with alliance, corporation, and character members returns each access level\n      Given an access list exists with characters, corporations, and alliances\n      When the client requests the access list\n      Then the client shall return every member with its access level","sourceStart":12,"findings":[]},{"id":"0039-access-lists#R2","title":"If an access list has no members, then the Access Lists client shall return the list record with empty alliances, corporations and characters arrays.","line":23,"pattern":"unwanted-behaviour","exclusion":false,"verdict":"verified","evidence":"","charter":[],"tags":[],"scenarios":[{"title":"Empty list returns its identifier with zero-length membership arrays","line":28,"tags":[]}],"source":"  Rule: If an access list has no members, then the Access Lists client shall return the list record with empty alliances, corporations and characters arrays.\n    A list created but not yet populated still has an identifier and a name.\n    Returning the record with empty membership arrays rather than a 404 keeps\n    the difference between \"list not created\" and \"list is empty\" visible.\n\n    Scenario: Empty list returns its identifier with zero-length membership arrays\n      Given an empty access list exists\n      When the client requests the empty access list\n      Then the client shall return the list with empty membership arrays","sourceStart":23,"findings":[]},{"id":"0039-access-lists#R3","title":"If ESI refuses an access list request or cannot find the list it names, then the Access Lists client shall reject the request with an EsiError.","line":35,"pattern":"unwanted-behaviour","exclusion":false,"verdict":"verified","evidence":"","charter":[],"tags":[],"scenarios":[{"title":"Expired token rejects the access list request with an EsiError","line":43,"tags":[]},{"title":"Unknown list identifier rejects the request with an EsiError","line":48,"tags":[]}],"source":"  Rule: If ESI refuses an access list request or cannot find the list it names, then the Access Lists client shall reject the request with an EsiError.\n    Access lists are private to their owner, so ESI answers a token it does not\n    accept with a 401 and an unknown list identifier with a 404. Both surface\n    as a typed EsiError rather than as an empty list, so a caller never\n    mistakes a refusal for an unrestricted list. A client with no token at all\n    never reaches ESI: it throws a NO_AUTH_TOKEN error, which is not an\n    EsiError, before sending the request.\n\n    Scenario: Expired token rejects the access list request with an EsiError\n      Given ESI rejects the access token as expired\n      When the client requests an access list with that token\n      Then the client shall return a 401 error\n\n    Scenario: Unknown list identifier rejects the request with an EsiError\n      Given an access list does not exist\n      When the client requests a non-existent access list\n      Then the client shall return a 404 error for the access list","sourceStart":35,"findings":[]}],"noUnwantedBehaviour":false,"orphanScenarios":0},{"file":"tests/bdd/features/core/0050-etag-caching.feature","area":"core","name":"ETag Caching","tags":["@ARCH-04"],"charter":["ARCH-04","TEST-11","SEC-10","SEC-02"],"description":"The EsiClient caches GET responses that carry an ETag header, keyed by endpoint. Each entry takes its freshness TTL from the endpoint's cache metadata in the ESI spec where there is one, so a repeat request inside that window is answered from memory with no HTTP call at all. Otherwise the TTL comes from the Cache-Control max-age, and a repeat request is sent with If-None-Match. An entry is kept for an hour past its freshness TTL, or for the configured default when the response gave none, so a request after the TTL still revalidates. Entries are only created for responses that actually carry an ETag. The cache is on by default; enableETagCache: false turns it off.\n\nThe cache is also what lets a request survive a server error: a 5xx answered while an unexpired entry exists is served from that entry and flagged stale. Those Rules are the single statement of stale-on-error, and domain features point here rather than restating it. Retry, circuit breaking and deduplication are specified in 0051-resilience.feature.\n\nCaching is bounded by a configured maximum entry count and is observable through getCacheStats, so callers can reason about memory use and hit rates at runtime.","boundBy":["tests/bdd/step-definitions/core/etag-caching.steps.ts"],"rules":[{"id":"0050-etag-caching#R1","title":"When a response carrying an ETag header is received, the ETag cache shall store the response body against the requested endpoint.","line":26,"pattern":"event-driven","exclusion":false,"verdict":"verified","evidence":"","charter":[],"tags":[],"scenarios":[{"title":"First response carrying an ETag is stored in the cache","line":32,"tags":[]}],"source":"  Rule: When a response carrying an ETag header is received, the ETag cache shall store the response body against the requested endpoint.\n    The ETag is the server's own identity for a representation, so its\n    presence is what marks a response as re-usable. Storage is keyed by\n    endpoint rather than by ETag, because lookup happens before the client\n    knows what the current ETag is.\n\n    Scenario: First response carrying an ETag is stored in the cache\n      Given a fresh client with no cached data\n      When the client makes an API request that returns an ETag\n      Then the response shall be cached for future use","sourceStart":26,"findings":[]},{"id":"0050-etag-caching#R2","title":"If a response omits the ETag header, then the ETag cache shall store no entry for that request.","line":37,"pattern":"unwanted-behaviour","exclusion":false,"verdict":"verified","evidence":"","charter":[],"tags":[],"scenarios":[{"title":"Response without an ETag header is not cached","line":42,"tags":[]}],"source":"  Rule: If a response omits the ETag header, then the ETag cache shall store no entry for that request.\n    Without an ETag there is nothing to revalidate against later, so caching\n    the body would risk serving data the client has no way to check. These\n    responses pass straight through to the caller.\n\n    Scenario: Response without an ETag header is not cached\n      Given a server response without ETag headers\n      When the client makes requests without ETag\n      Then the client shall work normally without caching","sourceStart":37,"findings":[]},{"id":"0050-etag-caching#R3","title":"While a cached entry is within its spec-aware TTL, the ETag cache shall serve the stored body without issuing an HTTP request.","line":49,"pattern":"state-driven","exclusion":false,"verdict":"verified","evidence":"","charter":[],"tags":[],"scenarios":[{"title":"Repeat request inside the TTL window is served from the cache","line":57,"tags":[]},{"title":"Repeat request inside the TTL window does not observe changed server data","line":62,"tags":[]},{"title":"Repeat request inside the TTL window does not observe a server error","line":67,"tags":[]}],"source":"  Rule: While a cached entry is within its spec-aware TTL, the ETag cache shall serve the stored body without issuing an HTTP request.\n    Inside the TTL window the client does not contact the server at all — not\n    even a conditional request. This is the behaviour that makes the cache\n    worth having, and it is also what the three scenarios below all exercise\n    from different angles: a plain repeat, a repeat where the server would\n    have returned different data, and a repeat where the server would have\n    returned an error. In every case no request leaves the client.\n\n    Scenario: Repeat request inside the TTL window is served from the cache\n      Given cached data with an ETag\n      When the client repeats the same request inside the TTL window\n      Then the client shall return the cached data without a new download\n\n    Scenario: Repeat request inside the TTL window does not observe changed server data\n      Given cached data with an ETag for update\n      When the server would return new data with a different ETag\n      Then the client shall return the originally cached data\n\n    Scenario: Repeat request inside the TTL window does not observe a server error\n      Given a cached response exists\n      When the server would return an error\n      Then the client shall return the originally cached data","sourceStart":49,"findings":[]},{"id":"0050-etag-caching#R4","title":"If a response carries an Expires header, then the ETag cache shall not take the entry's freshness from it.","line":73,"pattern":"unwanted-behaviour","exclusion":true,"verdict":"verified","evidence":"","charter":["TEST-11"],"tags":["@TEST-11"],"scenarios":[{"title":"A server status whose Expires has passed is still served inside its spec TTL","line":79,"tags":[]},{"title":"A server status whose Expires lies a day ahead is revalidated after its spec TTL","line":85,"tags":[]}],"source":"  @TEST-11\n  Rule: If a response carries an Expires header, then the ETag cache shall not take the entry's freshness from it.\n    Freshness comes from the endpoint's spec cache metadata, or from\n    Cache-Control max-age where the spec gives none. Expires is exposed on\n    withMetadata as meta.expires, but an Expires already past, or a day\n    ahead, changes nothing about when the entry is revalidated.\n\n    Scenario: A server status whose Expires has passed is still served inside its spec TTL\n      Given a client whose ETag cache holds the server status from a response whose Expires header had already passed\n      When the client requests the server status 10 seconds later\n      Then the client resolves with the cached server status\n      And the client sent 1 request\n\n    Scenario: A server status whose Expires lies a day ahead is revalidated after its spec TTL\n      Given a client whose ETag cache holds the server status from a response whose Expires header lies a day ahead\n      And the 30 second spec cache TTL of the server status has elapsed\n      And ESI answers the revalidation of the server status with HTTP 304\n      When the client requests the server status\n      Then the client resolves with the cached server status\n      And the client sent 2 requests","sourceStart":72,"findings":[]},{"id":"0050-etag-caching#R5","title":"When an authenticated paginated GET has resolved with every page, the ETag cache shall answer a repeat call inside the spec TTL with every page.","line":93,"pattern":"event-driven","exclusion":false,"verdict":"verified","evidence":"","charter":[],"tags":[],"scenarios":[{"title":"A repeat character assets call inside the TTL returns both pages","line":99,"tags":[]}],"source":"  Rule: When an authenticated paginated GET has resolved with every page, the ETag cache shall answer a repeat call inside the spec TTL with every page.\n    The combined array is what the caller received, so it is what a cached\n    answer must return. Entries for authenticated endpoints are keyed by the\n    access token; the combined array has to be stored under that same key, or\n    the lookup finds the first page alone.\n\n    Scenario: A repeat character assets call inside the TTL returns both pages\n      Given a client with an access token and an empty cache\n      And ESI answers the character assets request with 2 pages\n      When the client requests the character assets twice\n      Then both calls resolve with the assets from both pages\n      And the client sent 2 requests","sourceStart":93,"findings":[]},{"id":"0050-etag-caching#R6","title":"If a paginated call requests a page after the first while the ETag cache holds an entry for that page's URL, then the EsiClient shall not send an If-None-Match header for that page.","line":107,"pattern":"unwanted-behaviour","exclusion":true,"verdict":"verified","evidence":"","charter":["TEST-11"],"tags":["@TEST-11"],"scenarios":[{"title":"Page 2 of the market types is asked unconditionally despite an entry for its URL","line":113,"tags":[]}],"source":"  @TEST-11\n  Rule: If a paginated call requests a page after the first while the ETag cache holds an entry for that page's URL, then the EsiClient shall not send an If-None-Match header for that page.\n    Pages 2 to N are fetched unconditionally (PAGINATION.md). A 304 on one\n    page would stand for a slice of an older snapshot, and only page 1's\n    ETag names the combined array the cache keeps. The entry in the scenario\n    is seeded by hand, since no call of the client stores one.\n\n    Scenario: Page 2 of the market types is asked unconditionally despite an entry for its URL\n      Given a client whose ETag cache holds an entry for page 2 of the market types\n      And ESI answers the market types with 2 pages\n      When the client requests the market types for The Forge\n      Then the client resolves with the market types of both pages\n      And the page 2 request carried no If-None-Match header","sourceStart":106,"findings":[]},{"id":"0050-etag-caching#R7","title":"If a paginated call receives a page after the first, then the ETag cache shall not store that page under its own URL.","line":121,"pattern":"unwanted-behaviour","exclusion":true,"verdict":"verified","evidence":"","charter":["TEST-11"],"tags":["@TEST-11"],"scenarios":[{"title":"A two-page market types call leaves one cache entry","line":126,"tags":[]}],"source":"  @TEST-11\n  Rule: If a paginated call receives a page after the first, then the ETag cache shall not store that page under its own URL.\n    The combined array is stored once, under page 1's URL with page 1's\n    ETag, after every page is in. An entry per page would be one nobody\n    reads, and each would take a slot from the configured maximum.\n\n    Scenario: A two-page market types call leaves one cache entry\n      Given a client with an empty cache\n      And ESI answers the market types with 2 pages\n      When the client requests the market types for The Forge\n      Then the client resolves with the market types of both pages\n      And the ETag cache holds 1 entry","sourceStart":120,"findings":[]},{"id":"0050-etag-caching#R8","title":"If a stream or fetch-all helper requests a page, then the EsiClient shall not send an If-None-Match header.","line":134,"pattern":"unwanted-behaviour","exclusion":true,"verdict":"verified","evidence":"","charter":["TEST-11"],"tags":["@TEST-11"],"scenarios":[{"title":"Reading market types through the stream helper after an ordinary market types call","line":141,"tags":[]},{"title":"Reading market types through the fetch-all helper after an ordinary market types call","line":141,"tags":[]}],"source":"  @TEST-11\n  Rule: If a stream or fetch-all helper requests a page, then the EsiClient shall not send an If-None-Match header.\n    The stream* and fetchAll* helpers read every page afresh and keep no\n    cache of their own, so a 304 would leave them with no body to return.\n    An ordinary call to the same URL stores an ETag, and sending it from a\n    streamed page turned the next 304 into an EsiError. The stream* helpers\n    and fetchAll* (fetchAllEndpoint) are separate flows, so both are driven.\n\n    Scenario Outline: Reading market types through the \u003chelper> helper after an ordinary market types call\n      Given a client with an empty cache\n      And the client has fetched the market types for The Forge\n      When the client reads the market types for The Forge through the \u003chelper> helper\n      Then the helper yields every market type\n      And the helper's request carried no If-None-Match header\n\n      Examples:\n        | helper    |\n        | stream    |\n        | fetch-all |","sourceStart":133,"findings":[]},{"id":"0050-etag-caching#R9","title":"If a stream or fetch-all helper requests a page while the ETag cache holds an entry inside its spec TTL, then the EsiClient shall not answer the page from that entry.","line":154,"pattern":"unwanted-behaviour","exclusion":true,"verdict":"verified","evidence":"","charter":["TEST-11"],"tags":["@TEST-11"],"scenarios":[{"title":"Reading market types through the stream helper inside their 600 second spec TTL sends a request","line":160,"tags":[]},{"title":"Reading market types through the fetch-all helper inside their 600 second spec TTL sends a request","line":160,"tags":[]}],"source":"  @TEST-11\n  Rule: If a stream or fetch-all helper requests a page while the ETag cache holds an entry inside its spec TTL, then the EsiClient shall not answer the page from that entry.\n    The helpers take the lighter single-page path, which has no spec-TTL\n    lookup (PAGINATION.md, \"What stream* and fetchAll* skip\"). A cached\n    combined array is not a page, so serving it page by page would repeat\n    or drop items.\n\n    Scenario Outline: Reading market types through the \u003chelper> helper inside their 600 second spec TTL sends a request\n      Given a client with an empty cache\n      And the client has fetched the market types for The Forge\n      When the client reads the market types for The Forge through the \u003chelper> helper\n      Then the helper yields every market type\n      And the client sent a request for the helper's page\n\n      Examples:\n        | helper    |\n        | stream    |\n        | fetch-all |","sourceStart":153,"findings":[]},{"id":"0050-etag-caching#R10","title":"If a stream or fetch-all helper receives a page, then the EsiClient shall not store that page in the ETag cache.","line":173,"pattern":"unwanted-behaviour","exclusion":true,"verdict":"verified","evidence":"","charter":["TEST-11"],"tags":["@TEST-11"],"scenarios":[{"title":"An ordinary market types call after reading them through the stream helper fetches afresh","line":178,"tags":[]},{"title":"An ordinary market types call after reading them through the fetch-all helper fetches afresh","line":178,"tags":[]}],"source":"  @TEST-11\n  Rule: If a stream or fetch-all helper receives a page, then the EsiClient shall not store that page in the ETag cache.\n    A page is part of a resource, not the resource an ordinary call caches\n    under the same URL. Storing it would let a later ordinary call be\n    answered with one page of a multi-page result.\n\n    Scenario Outline: An ordinary market types call after reading them through the \u003chelper> helper fetches afresh\n      Given a client with an empty cache\n      And the client has read the market types for The Forge through the \u003chelper> helper\n      When the client requests the market types for The Forge\n      Then the client resolves with every market type\n      And the ordinary request carried no If-None-Match header\n\n      Examples:\n        | helper    |\n        | stream    |\n        | fetch-all |","sourceStart":172,"findings":[]},{"id":"0050-etag-caching#R11","title":"If a page requested by a stream or fetch-all helper is answered with a 5xx status while the ETag cache holds an entry for its URL, then the EsiClient shall not serve that entry in place of the page.","line":191,"pattern":"unwanted-behaviour","exclusion":true,"verdict":"verified","evidence":"","charter":["TEST-11"],"tags":["@TEST-11"],"scenarios":[{"title":"Market types read through the stream helper and answered with HTTP 500 reject despite the cached entry","line":196,"tags":[]},{"title":"Market types read through the fetch-all helper and answered with HTTP 500 reject despite the cached entry","line":196,"tags":[]}],"source":"  @TEST-11\n  Rule: If a page requested by a stream or fetch-all helper is answered with a 5xx status while the ETag cache holds an entry for its URL, then the EsiClient shall not serve that entry in place of the page.\n    Stale-on-error belongs to the eager path. The helper's page is not the\n    combined array the entry holds, so the failure reaches the caller as an\n    EsiError.\n\n    Scenario Outline: Market types read through the \u003chelper> helper and answered with HTTP 500 reject despite the cached entry\n      Given a client with an empty cache\n      And the client has fetched the market types for The Forge\n      And ESI answers the helper's market types page with HTTP 500\n      When the client reads the market types for The Forge through the \u003chelper> helper expecting a failure\n      Then the helper rejects with an EsiError carrying status 500\n\n      Examples:\n        | helper    |\n        | stream    |\n        | fetch-all |","sourceStart":190,"findings":[]},{"id":"0050-etag-caching#R12","title":"If a GET request is answered with a 5xx status while the ETag cache holds an unexpired entry for it, then the EsiClient shall resolve with the cached body and flag the response as stale.","line":210,"pattern":"unwanted-behaviour","exclusion":false,"verdict":"verified","evidence":"","charter":[],"tags":[],"scenarios":[{"title":"HTTP 500 on a revalidation is answered from the cache","line":220,"tags":[]},{"title":"HTTP 503 on a revalidation is answered from the cache","line":220,"tags":[]}],"source":"  Rule: If a GET request is answered with a 5xx status while the ETag cache holds an unexpired entry for it, then the EsiClient shall resolve with the cached body and flag the response as stale.\n    A server error on a resource the client already holds is better answered\n    with the last good copy than with a failure. The entry has to be unexpired:\n    the cache evicts an expired entry on lookup, so there is nothing to serve.\n    An entry expires an hour after its freshness TTL, so for an endpoint with a\n    spec cache TTL this path serves the requests made after that TTL. The\n    revalidation request goes out with If-None-Match. The stale body is\n    returned without retrying, and withMetadata reports stale as true and\n    cacheHitType as stale-on-error.\n\n    Scenario Outline: HTTP \u003cstatus> on a revalidation is answered from the cache\n      Given a client whose ETag cache holds the dogma attribute index\n      And ESI answers the revalidation of the dogma attribute index with HTTP \u003cstatus>\n      When the client requests the dogma attribute index with metadata\n      Then the client resolves with the cached attribute identifiers flagged as stale\n      And the revalidation request carried the cached ETag in If-None-Match\n      And the client sent 2 requests\n\n      Examples:\n        | status |\n        | 500    |\n        | 503    |","sourceStart":210,"findings":[]},{"id":"0050-etag-caching#R13","title":"If a GET request is answered with a 5xx status while the ETag cache holds an unexpired entry for it, then the EsiClient shall not send the request again.","line":234,"pattern":"unwanted-behaviour","exclusion":true,"verdict":"verified","evidence":"","charter":["TEST-11"],"tags":["@TEST-11"],"scenarios":[{"title":"A 503 on the server status revalidation is not sent again","line":240,"tags":[]}],"source":"  @TEST-11\n  Rule: If a GET request is answered with a 5xx status while the ETag cache holds an unexpired entry for it, then the EsiClient shall not send the request again.\n    The stale entry is the answer, so nothing is thrown and the retry\n    strategy has nothing to retry, even for 502, 503 and 504, which it would\n    otherwise repeat. A caller who wants the current value despite a stale\n    answer checks meta.stale and asks again later.\n\n    Scenario: A 503 on the server status revalidation is not sent again\n      Given a client whose ETag cache holds the server status\n      And the 30 second spec cache TTL of the server status has elapsed\n      And ESI answers the server status request with HTTP 503 on every attempt\n      When the client requests the server status\n      Then the client resolves with the cached server status\n      And the client sent 2 requests","sourceStart":233,"findings":[]},{"id":"0050-etag-caching#R14","title":"If a GET request is answered with a 5xx status and the ETag cache holds no entry for it, then the EsiClient shall reject with an EsiError carrying that status.","line":248,"pattern":"unwanted-behaviour","exclusion":false,"verdict":"verified","evidence":"","charter":[],"tags":[],"scenarios":[{"title":"HTTP 500 with nothing cached rejects after one request","line":253,"tags":[]},{"title":"HTTP 503 on every attempt with nothing cached rejects once retries are spent","line":260,"tags":[]}],"source":"  Rule: If a GET request is answered with a 5xx status and the ETag cache holds no entry for it, then the EsiClient shall reject with an EsiError carrying that status.\n    With nothing cached there is no fallback, so the failure reaches the caller\n    once the retries its status allows are spent: none for 500, and every\n    configured retry for 502, 503 and 504.\n\n    Scenario: HTTP 500 with nothing cached rejects after one request\n      Given a client with an empty ETag cache\n      And ESI answers the dogma attribute index request with HTTP 500 1 times\n      When the client requests the dogma attribute index\n      Then the client rejects with an EsiError carrying status 500\n      And the client sent 1 requests\n\n    Scenario: HTTP 503 on every attempt with nothing cached rejects once retries are spent\n      Given a client with an empty ETag cache\n      And ESI answers the dogma attribute index request with HTTP 503 4 times\n      When the client requests the dogma attribute index\n      Then the client rejects with an EsiError carrying status 503\n      And the client sent 4 requests","sourceStart":248,"findings":[]},{"id":"0050-etag-caching#R15","title":"If a GET request is answered with a 4xx status, then the EsiClient shall reject with an EsiError even while the ETag cache holds an entry for it.","line":267,"pattern":"unwanted-behaviour","exclusion":false,"verdict":"verified","evidence":"","charter":[],"tags":[],"scenarios":[{"title":"HTTP 404 on a revalidation rejects despite the cached entry","line":272,"tags":[]}],"source":"  Rule: If a GET request is answered with a 4xx status, then the EsiClient shall reject with an EsiError even while the ETag cache holds an entry for it.\n    Stale-on-error covers server faults only. A 404 or a 403 says the resource\n    is gone or no longer visible to this caller, and serving the old copy would\n    hide exactly that.\n\n    Scenario: HTTP 404 on a revalidation rejects despite the cached entry\n      Given a client whose ETag cache holds the dogma attribute index\n      And ESI answers the revalidation of the dogma attribute index with HTTP 404\n      When the client requests the dogma attribute index\n      Then the client rejects with an EsiError carrying status 404\n      And the client sent 2 requests","sourceStart":267,"findings":[]},{"id":"0050-etag-caching#R16","title":"When the freshness TTL of a cached entry elapses, the ETag cache shall keep that entry for one further hour before discarding it.","line":281,"pattern":"event-driven","exclusion":false,"verdict":"verified","evidence":"","charter":[],"tags":[],"scenarios":[{"title":"HTTP 503 after the server status TTL has elapsed is answered from the cache","line":291,"tags":[]},{"title":"Revalidation after the server status TTL has elapsed is answered by a 304","line":299,"tags":[]},{"title":"HTTP 503 more than an hour after the server status TTL has elapsed rejects","line":307,"tags":[]}],"source":"  Rule: When the freshness TTL of a cached entry elapses, the ETag cache shall keep that entry for one further hour before discarding it.\n    The freshness TTL, from the spec cache metadata or Cache-Control max-age,\n    decides how long an entry is served without contacting ESI. It does not\n    decide how long the entry is useful: past it the entry still carries the\n    ETag for a conditional request, and it is the last good copy if ESI fails.\n    One hour spans ESI's daily downtime. The configured maximum entry count\n    still evicts the oldest entry first, so retention does not raise the memory\n    bound. An entry whose response gave no freshness TTL keeps the configured\n    defaultTtl.\n\n    Scenario: HTTP 503 after the server status TTL has elapsed is answered from the cache\n      Given a client whose ETag cache holds the server status\n      And the 30 second spec cache TTL of the server status has elapsed\n      And ESI answers the server status request with HTTP 503 on every attempt\n      When the client requests the server status with metadata\n      Then the client resolves with the cached server status flagged as stale\n      And the client sent 2 requests\n\n    Scenario: Revalidation after the server status TTL has elapsed is answered by a 304\n      Given a client whose ETag cache holds t
