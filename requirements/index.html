 shall issue one HTTP request per identity.","line":718,"pattern":"event-driven","exclusion":false,"verdict":"verified","evidence":"","charter":["SEC-10"],"tags":["@sec-P4","@SEC-10"],"scenarios":[{"title":"A concurrent online request under a new access token is not coalesced","line":730,"tags":[]},{"title":"A concurrent online request under a refreshed token ESI has not yet accepted is not coalesced","line":737,"tags":[]},{"title":"A concurrent online request under two accepted tokens for one character is coalesced","line":744,"tags":[]}],"source":"  @sec-P4 @SEC-10\n  Rule: When concurrent GET requests to one authenticated endpoint carry access tokens for different identities, the EsiClient shall issue one HTTP request per identity.\n    Deduplication keys on the request path, and a path says nothing about whose\n    data comes back: characters/{character_id}/online answers differently for\n    every token that asks it. The ETag cache keys authenticated entries by the\n    character an SSO token names, or by a hash of a token that names none, and\n    coalescing draws the same line. A caller that changes character while a\n    call is in flight would otherwise receive the previous identity's response.\n    A refreshed token for the same character shares the request once ESI has\n    accepted it; until then the character it names is a claim, and a request\n    under it goes out on its own rather than being answered from another\n    token's.\n\n    Scenario: A concurrent online request under a new access token is not coalesced\n      Given a client with request deduplication and no ETag cache\n      And ESI answers the character online request after 20 milliseconds with a payload 2 times\n      When the client requests the character online status, changes its access token, and requests it again before the first resolves\n      Then both calls resolve with the online payload\n      And the client sent 2 requests\n\n    Scenario: A concurrent online request under a refreshed token ESI has not yet accepted is not coalesced\n      Given a client with request deduplication and no ETag cache\n      And ESI answers the character online request after 20 milliseconds with a payload 2 times\n      When the client requests the character online status under an SSO token for character 90000001, replaces it with a new SSO token for that character, and requests it again before the first resolves\n      Then both calls resolve with the online payload\n      And the client sent 2 requests\n\n    Scenario: A concurrent online request under two accepted tokens for one character is coalesced\n      Given a client with request deduplication and no ETag cache\n      And ESI has answered one character online request under each of two SSO tokens for character 90000001\n      And ESI answers the character online request after 20 milliseconds with a payload 1 times\n      When the client requests the character online status under the first of those tokens, switches to the second, and requests it again before the first resolves\n      Then both calls resolve with the online payload\n      And the client sent 3 requests","sourceStart":717,"findings":[]},{"id":"0051-resilience#R47","title":"If a shared in-flight GET request fails, then the EsiClient shall reject every caller that joined it.","line":752,"pattern":"unwanted-behaviour","exclusion":false,"verdict":"verified","evidence":"","charter":[],"tags":[],"scenarios":[{"title":"Two concurrent callers of a failing request both reject","line":756,"tags":[]}],"source":"  Rule: If a shared in-flight GET request fails, then the EsiClient shall reject every caller that joined it.\n    Callers that joined an in-flight request share its outcome, failure\n    included. None of them receives a result the others did not.\n\n    Scenario: Two concurrent callers of a failing request both reject\n      Given a client with request deduplication and no ETag cache\n      And ESI answers the server status request after 20 milliseconds with HTTP 404\n      When the client requests the server status twice at once\n      Then both calls reject with an EsiError carrying status 404\n      And the client sent 1 request","sourceStart":752,"findings":[]},{"id":"0051-resilience#R48","title":"When a write to a path succeeds, the EsiClient shall answer a read of that path started afterwards with a new HTTP request rather than one already in flight.","line":763,"pattern":"event-driven","exclusion":false,"verdict":"verified","evidence":"","charter":[],"tags":[],"scenarios":[{"title":"A contact list read started after a delete does not join one in flight","line":771,"tags":[]}],"source":"  Rule: When a write to a path succeeds, the EsiClient shall answer a read of that path started afterwards with a new HTTP request rather than one already in flight.\n    Deduplication keys on the path, and a write does not change the path. A\n    caller that deletes a contact and then re-reads the list is asking about\n    the world after the delete; joining a read sent before it answers with the\n    list as it was. Callers that had already joined keep that answer, because\n    they asked first — the request in flight is left running and only detached\n    from callers yet to arrive.\n\n    Scenario: A contact list read started after a delete does not join one in flight\n      Given a client with request deduplication and no ETag cache\n      And ESI answers the character contact list after 60 milliseconds with 2 contacts\n      And ESI answers the character contact delete after 0 milliseconds\n      And ESI answers the character contact list after 0 milliseconds with 1 contact\n      When the client reads the contact list, deletes a contact once that read is in flight, then reads the list again\n      Then the read after the delete resolves with 1 contact\n      And the client sent 3 requests","sourceStart":763,"findings":[]},{"id":"0051-resilience#R49","title":"When an identical GET request is issued after the first has settled, the EsiClient shall issue a new HTTP request.","line":780,"pattern":"event-driven","exclusion":false,"verdict":"verified","evidence":"","charter":[],"tags":[],"scenarios":[{"title":"A second server status request after the first resolves issues its own request","line":785,"tags":[]}],"source":"  Rule: When an identical GET request is issued after the first has settled, the EsiClient shall issue a new HTTP request.\n    Deduplication covers only requests in flight together. It is not a cache:\n    once a request settles, the next identical one goes to the network unless\n    the ETag cache answers it.\n\n    Scenario: A second server status request after the first resolves issues its own request\n      Given a client with request deduplication and no ETag cache\n      And ESI answers the server status request after 0 milliseconds with a payload 2 times\n      When the client requests the server status 2 times\n      Then the client sent 2 requests","sourceStart":780,"findings":[]},{"id":"0051-resilience#R50","title":"Where request deduplication is disabled, the EsiClient shall issue one HTTP request per concurrent call.","line":791,"pattern":"optional-feature","exclusion":false,"verdict":"verified","evidence":"","charter":[],"tags":[],"scenarios":[{"title":"Two concurrent server status requests without deduplication issue two requests","line":795,"tags":[]}],"source":"  Rule: Where request deduplication is disabled, the EsiClient shall issue one HTTP request per concurrent call.\n    Setting enableRequestDeduplication to false restores one request per call\n    for a caller that needs every response fetched independently.\n\n    Scenario: Two concurrent server status requests without deduplication issue two requests\n      Given a client without request deduplication or an ETag cache\n      And ESI answers the server status request after 20 milliseconds with a payload 2 times\n      When the client requests the server status twice at once\n      Then both calls resolve with the payload\n      And the client sent 2 requests","sourceStart":791,"findings":[]},{"id":"0051-resilience#R51","title":"When identical non-GET requests are issued concurrently, the EsiClient shall issue one HTTP request per call.","line":802,"pattern":"event-driven","exclusion":false,"verdict":"verified","evidence":"","charter":[],"tags":[],"scenarios":[{"title":"Two concurrent name resolution POSTs issue two requests","line":806,"tags":[]}],"source":"  Rule: When identical non-GET requests are issued concurrently, the EsiClient shall issue one HTTP request per call.\n    Only bodiless GET requests are coalesced. Two identical writes are two\n    intended writes, and merging them would drop one.\n\n    Scenario: Two concurrent name resolution POSTs issue two requests\n      Given a client with request deduplication and no ETag cache\n      And ESI answers the name resolution request after 20 milliseconds with names 2 times\n      When the client posts identifiers for name resolution twice at once\n      Then the client sent 2 requests","sourceStart":802,"findings":[]}],"noUnwantedBehaviour":false,"orphanScenarios":0},{"file":"tests/bdd/features/core/0052-response-headers.feature","area":"core","name":"ESI Response Header Best Practices","tags":[],"charter":["TEST-11"],"description":"ESI carries operational signal in response headers rather than in the body: route deprecation and upgrade notices arrive as RFC 7234 Warning headers, and every response is stamped with a request identifier CCP support asks for when investigating a fault. Callers that opt in with withMetadata receive those headers alongside the parsed body instead of losing them at the transport seam.\n\nThese scenarios drive the real fetch layer through jest-fetch-mock, so header parsing, warning-code extraction and metadata assembly all execute.","boundBy":["tests/bdd/step-definitions/core/response-headers.steps.ts"],"rules":[{"id":"0052-response-headers#R1","title":"When a response carries a Warning header, the metadata-wrapped client shall expose its numeric code and its quoted text as meta.warning.","line":14,"pattern":"event-driven","exclusion":false,"verdict":"verified","evidence":"","charter":[],"tags":[],"scenarios":[{"title":"Deprecation notice arrives as warning code 299","line":21,"tags":[]},{"title":"Upgrade notice arrives as warning code 199","line":26,"tags":[]}],"source":"  Rule: When a response carries a Warning header, the metadata-wrapped client shall expose its numeric code and its quoted text as meta.warning.\n    ESI uses 299 for a deprecated route and 199 for a route with a newer\n    version available. Splitting the header into a code and a message lets a\n    caller branch on the code and log the text, rather than pattern-matching\n    the raw header itself. Both codes are parsed by the same path, which is why\n    the two scenarios below share this requirement.\n\n    Scenario: Deprecation notice arrives as warning code 299\n      Given a deprecated endpoint that returns a 299 warning header\n      When the client calls it with metadata\n      Then the meta shall contain the deprecation warning with code 299\n\n    Scenario: Upgrade notice arrives as warning code 199\n      Given an endpoint that returns a 199 upgrade warning header\n      When the client calls it with metadata\n      Then the meta shall contain the upgrade warning with code 199","sourceStart":14,"findings":[]},{"id":"0052-response-headers#R2","title":"If a response carries no Warning header, then the metadata-wrapped client shall leave meta.warning undefined.","line":31,"pattern":"unwanted-behaviour","exclusion":false,"verdict":"verified","evidence":"","charter":[],"tags":[],"scenarios":[{"title":"Response without a Warning header leaves meta.warning undefined","line":36,"tags":[]}],"source":"  Rule: If a response carries no Warning header, then the metadata-wrapped client shall leave meta.warning undefined.\n    The absence of a warning is the normal case, and it has to be\n    distinguishable from a warning that failed to parse. An undefined value\n    lets a caller test for a notice with a plain truthiness check.\n\n    Scenario: Response without a Warning header leaves meta.warning undefined\n      Given a normal endpoint with no warning header\n      When the client calls it with metadata\n      Then the meta shall not contain a warning","sourceStart":31,"findings":[]},{"id":"0052-response-headers#R3","title":"When a response carries the x-esi-request-id header, the metadata-wrapped client shall expose its value as meta.requestId.","line":43,"pattern":"event-driven","exclusion":false,"verdict":"verified","evidence":"","charter":[],"tags":[],"scenarios":[{"title":"Request identifier header is exposed as meta.requestId","line":48,"tags":[]}],"source":"  Rule: When a response carries the x-esi-request-id header, the metadata-wrapped client shall expose its value as meta.requestId.\n    The request identifier is what CCP support correlates against their own\n    logs, so it has to survive as far as the caller's log line. It is exposed\n    on successful responses here and on EsiError for failures.\n\n    Scenario: Request identifier header is exposed as meta.requestId\n      Given an API response with x-esi-request-id header\n      When the client calls it with metadata\n      Then the meta shall contain the request ID","sourceStart":43,"findings":[]},{"id":"0052-response-headers#R4","title":"When a response carries the Date header, the metadata-wrapped client shall expose its value as meta.date.","line":53,"pattern":"event-driven","exclusion":false,"verdict":"verified","evidence":"","charter":[],"tags":[],"scenarios":[{"title":"Date header is exposed as meta.date","line":58,"tags":[]}],"source":"  Rule: When a response carries the Date header, the metadata-wrapped client shall expose its value as meta.date.\n    The server clock is the reference point for reasoning about cache age and\n    about the expiry times ESI returns, both of which are meaningless against a\n    local clock that has drifted.\n\n    Scenario: Date header is exposed as meta.date\n      Given an API response with a Date header\n      When the client calls it with metadata\n      Then the meta shall contain the date","sourceStart":53,"findings":[]},{"id":"0052-response-headers#R5","title":"When a response carries the Content-Language header, the metadata-wrapped client shall expose its value as meta.contentLanguage.","line":63,"pattern":"event-driven","exclusion":false,"verdict":"verified","evidence":"","charter":[],"tags":[],"scenarios":[{"title":"Content-Language header is exposed as meta.contentLanguage","line":68,"tags":[]}],"source":"  Rule: When a response carries the Content-Language header, the metadata-wrapped client shall expose its value as meta.contentLanguage.\n    ESI honours a language preference but is free to serve a different\n    localisation than the one asked for, so the caller needs the language it\n    actually received before caching or displaying the text.\n\n    Scenario: Content-Language header is exposed as meta.contentLanguage\n      Given an API response with a Content-Language header\n      When the client calls it with metadata\n      Then the meta shall contain the language","sourceStart":63,"findings":[]},{"id":"0052-response-headers#R6","title":"If a response body is valid JSON under a Content-Type other than application/json, then the EsiClient shall not reject the response.","line":76,"pattern":"unwanted-behaviour","exclusion":true,"verdict":"verified","evidence":"","charter":["TEST-11"],"tags":["@TEST-11"],"scenarios":[{"title":"A server status served as text/plain resolves with its fields","line":82,"tags":[]}],"source":"  @TEST-11\n  Rule: If a response body is valid JSON under a Content-Type other than application/json, then the EsiClient shall not reject the response.\n    The body decides, not the label on it. ESI's edge has served JSON under\n    text/plain, and a body that is not JSON is refused as a parse error\n    whatever its Content-Type says (ERRORS.md, EsiFaultError), so trusting the\n    header would only add a way to fail a good response.\n\n    Scenario: A server status served as text/plain resolves with its fields\n      Given an API response whose JSON body is labelled text/plain\n      When the client calls it with metadata\n      Then the meta shall carry the server status from the body","sourceStart":75,"findings":[]},{"id":"0052-response-headers#R7","title":"If a page after the first carries an X-Pages count that differs from page 1's, then the EsiClient shall not change the number of pages it requests.","line":88,"pattern":"unwanted-behaviour","exclusion":true,"verdict":"verified","evidence":"","charter":["TEST-11"],"tags":["@TEST-11"],"scenarios":[{"title":"Page 2 announcing a third page is the last page requested","line":96,"tags":[]}],"source":"  @TEST-11\n  Rule: If a page after the first carries an X-Pages count that differs from page 1's, then the EsiClient shall not change the number of pages it requests.\n    Page 1's X-Pages is authoritative (PAGINATION.md). A count that grows\n    while the pages are walked describes a different snapshot of the\n    resource, so following it would stitch two snapshots together. A count\n    that shrinks shows up as an empty or missing page: a missing page\n    rejects, and an empty one ends the walk or, with incompletePages set to\n    throw, rejects it (0051-resilience.feature).\n\n    Scenario: Page 2 announcing a third page is the last page requested\n      Given ESI answers the market types with page 1 announcing 2 pages and page 2 announcing 3\n      When the client requests the market types for The Forge\n      Then the client resolves with the market types of pages 1 and 2\n      And the client requested 2 pages","sourceStart":87,"findings":[]},{"id":"0052-response-headers#R8","title":"If page 1 announces more than 1000 pages, then the EsiClient shall not request a page past page 1000.","line":103,"pattern":"unwanted-behaviour","exclusion":true,"verdict":"verified","evidence":"","charter":["TEST-11"],"tags":["@TEST-11"],"scenarios":[{"title":"X-Pages of 1001 is walked as far as page 1000","line":111,"tags":[]},{"title":"X-Pages of 1001 with incompletePages set to throw stops the walk after page 1","line":117,"tags":[]}],"source":"  @TEST-11\n  Rule: If page 1 announces more than 1000 pages, then the EsiClient shall not request a page past page 1000.\n    The cap bounds how long one call can run and how much of the error\n    budget a misreported X-Pages can spend. No ESI resource comes near it.\n    Every pagination path applies it (security model P8). A count above it\n    cannot be walked in full: by default the walk stops at page 1000 with a\n    warning, and with incompletePages set to throw it is refused after\n    page 1 (0051-resilience.feature).\n\n    Scenario: X-Pages of 1001 is walked as far as page 1000\n      Given ESI answers the market types with page 1 announcing 1001 pages and a type on every page\n      When the client requests the market types for The Forge\n      Then the client resolves with 1000 market types\n      And the client requested 1000 pages\n\n    Scenario: X-Pages of 1001 with incompletePages set to throw stops the walk after page 1\n      Given a client with incompletePages set to throw\n      And ESI answers the market types with page 1 announcing 1001 pages and a type on every page\n      When the client tries to request the market types for The Forge\n      Then the client rejects the walk as incomplete\n      And the client requested 1 page","sourceStart":102,"findings":[]},{"id":"0052-response-headers#R9","title":"The EsiError shall expose the status code, request URL, and request identifier supplied at construction.","line":126,"pattern":"ubiquitous","exclusion":false,"verdict":"verified","evidence":"","charter":[],"tags":[],"scenarios":[{"title":"EsiError retains the request ID, status code, and URL given at construction","line":131,"tags":[]}],"source":"  Rule: The EsiError shall expose the status code, request URL, and request identifier supplied at construction.\n    A failure is where provenance matters most, and an exception that carries\n    only a message forces the caller to reconstruct the context by hand. These\n    three fields are what a bug report to CCP needs.\n\n    Scenario: EsiError retains the request ID, status code, and URL given at construction\n      Given an EsiError created with a request ID\n      Then the EsiError shall contain the request ID and status code and url","sourceStart":126,"findings":[]}],"noUnwantedBehaviour":false,"orphanScenarios":0},{"file":"tests/bdd/features/core/0053-runtime-validation.feature","area":"core","name":"Runtime Response Validation","tags":[],"charter":["DES-01","SEC-10","TEST-11","ARCH-07"],"description":"TypeScript types vanish at runtime, so a response that does not match the ESI spec would otherwise reach application code as a silently wrong object. Each endpoint definition carries a Zod schema that parses the body before it is returned, turning a shape mismatch into a typed EsiValidationError at the point of the call.\n\nThe schemas are deliberately permissive in one direction: they are built with z.looseObject so fields CCP adds after this library was published survive parsing, and enum-typed fields accept values outside the known set. Callers that would rather trust ESI can switch parsing off with validateResponse.","boundBy":["tests/bdd/step-definitions/core/runtime-validation.steps.ts"],"rules":[{"id":"0053-runtime-validation#R1","title":"When a response satisfies the endpoint schema, the EsiClient shall return the parsed object with every field the schema declares.","line":15,"pattern":"event-driven","exclusion":false,"verdict":"verified","evidence":"","charter":[],"tags":[],"scenarios":[{"title":"Valid alliance response returns the declared fields","line":20,"tags":[]}],"source":"  Rule: When a response satisfies the endpoint schema, the EsiClient shall return the parsed object with every field the schema declares.\n    The parsed value, not the raw body, is what reaches the caller, so the\n    declared fields are guaranteed to be present and of the declared type by\n    the time application code touches them.\n\n    Scenario: Valid alliance response returns the declared fields\n      Given an ESI client with response validation enabled\n      When I receive a valid alliance response from ESI\n      Then the response shall be parsed successfully\n      And the response data shall contain the expected fields","sourceStart":15,"findings":[]},{"id":"0053-runtime-validation#R2","title":"When a response carries fields the endpoint schema does not declare, the EsiClient shall include those fields in the returned object.","line":27,"pattern":"event-driven","exclusion":false,"verdict":"verified","evidence":"","charter":["DES-01"],"tags":["@DES-01"],"scenarios":[{"title":"Unknown fields added by ESI survive parsing","line":33,"tags":[]}],"source":"  @DES-01\n  Rule: When a response carries fields the endpoint schema does not declare, the EsiClient shall include those fields in the returned object.\n    CCP adds fields to live routes without a version bump. Stripping unknown\n    keys would make this library lose data a caller already depends on,\n    and would force a release of ESI.ts before anyone could read that field.\n    This is why every schema uses z.looseObject rather than z.object.\n\n    Scenario: Unknown fields added by ESI survive parsing\n      Given an ESI client with response validation enabled\n      When I receive a response with additional unknown fields\n      Then the response shall be parsed successfully\n      And the extra fields shall be present in the result","sourceStart":26,"findings":[]},{"id":"0053-runtime-validation#R3","title":"If a response fails schema validation, then the EsiClient shall reject the call with an EsiValidationError carrying the underlying Zod issues.","line":42,"pattern":"unwanted-behaviour","exclusion":false,"verdict":"verified","evidence":"","charter":["SEC-10"],"tags":["@sec-P7","@SEC-10"],"scenarios":[{"title":"Response with a mistyped field rejects with the Zod issue list","line":47,"tags":[]}],"source":"  @sec-P7 @SEC-10\n  Rule: If a response fails schema validation, then the EsiClient shall reject the call with an EsiValidationError carrying the underlying Zod issues.\n    A mismatch between the spec and the live API is a fault the caller has to\n    be able to diagnose, which takes more than a message: the issue list names\n    the field and the expectation that was violated.\n\n    Scenario: Response with a mistyped field rejects with the Zod issue list\n      Given an ESI client with response validation enabled\n      When I receive a response with an invalid field type\n      Then an EsiValidationError shall be thrown\n      And the error shall contain validation details","sourceStart":41,"findings":[]},{"id":"0053-runtime-validation#R4","title":"If a response fails schema validation, then the EsiClient shall send a new request without an If-None-Match header on the next call to that endpoint.","line":53,"pattern":"unwanted-behaviour","exclusion":false,"verdict":"verified","evidence":"","charter":[],"tags":[],"scenarios":[{"title":"Alliance lookup after a rejected body refetches and returns the corrected record","line":60,"tags":[]}],"source":"  Rule: If a response fails schema validation, then the EsiClient shall send a new request without an If-None-Match header on the next call to that endpoint.\n    ESI sends an ETag with almost every GET, and the pipeline caches the body\n    before createClient parses it. A rejected body left in that cache would be\n    served again for the whole spec TTL (86400 seconds for character records),\n    and a conditional request would earn a 304 that points back at it, so the\n    caller could not recover until the entry expired.\n\n    Scenario: Alliance lookup after a rejected body refetches and returns the corrected record\n      Given an ESI client with response validation enabled\n      And ESI serves a cacheable alliance body that fails validation, then a valid one\n      When I request the same alliance twice\n      Then the first call shall reject with an EsiValidationError\n      And the second call shall send an unconditional request and return the valid alliance","sourceStart":53,"findings":[]},{"id":"0053-runtime-validation#R5","title":"If a response fails schema validation, then the EsiClient shall not send the request again within that call.","line":68,"pattern":"unwanted-behaviour","exclusion":true,"verdict":"verified","evidence":"","charter":["TEST-11"],"tags":["@TEST-11"],"scenarios":[{"title":"A mistyped alliance body is fetched once","line":74,"tags":[]}],"source":"  @TEST-11\n  Rule: If a response fails schema validation, then the EsiClient shall not send the request again within that call.\n    Validation runs in createClient after the retry loop has returned, so the\n    failure is not a transient one the retry strategy may repeat: ESI would\n    send the same body. The next call refetches it without If-None-Match\n    (above).\n\n    Scenario: A mistyped alliance body is fetched once\n      Given ESI answers the alliance request with a mistyped body\n      When the client requests the alliance and validation fails\n      Then the client sent exactly one alliance request","sourceStart":67,"findings":[]},{"id":"0053-runtime-validation#R6","title":"If a response field holds a value its schema type accepts but the game cannot produce, then the EsiClient shall not reject the response or change the value.","line":80,"pattern":"unwanted-behaviour","exclusion":true,"verdict":"verified","evidence":"","charter":["TEST-11"],"tags":["@TEST-11"],"scenarios":[{"title":"A market order with a negative volume_remain is returned as ESI sent it","line":86,"tags":[]}],"source":"  @TEST-11\n  Rule: If a response field holds a value its schema type accepts but the game cannot produce, then the EsiClient shall not reject the response or change the value.\n    Schemas check shape, and ESI is the source of truth for values. A\n    negative volume_remain is a number like any other to the schema, so it\n    reaches the caller as ESI sent it, with nothing logged. Guessing at\n    plausible ranges would reject a value the next game patch makes legal.\n\n    Scenario: A market order with a negative volume_remain is returned as ESI sent it\n      Given ESI answers the region market orders with an order whose volume_remain is -5\n      When the client requests the region market orders\n      Then the client resolves with that order's volume_remain of -5\n      And nothing was logged at warn level or above","sourceStart":79,"findings":[]},{"id":"0053-runtime-validation#R7","title":"The EsiValidationError shall be an instance of EsiError that satisfies the isValidationError type guard.","line":93,"pattern":"ubiquitous","exclusion":false,"verdict":"verified","evidence":"","charter":["ARCH-07"],"tags":["@ARCH-07"],"scenarios":[{"title":"Validation error is catchable as EsiError and narrowed by the guard","line":99,"tags":[]}],"source":"  @ARCH-07\n  Rule: The EsiValidationError shall be an instance of EsiError that satisfies the isValidationError type guard.\n    Callers already wrap ESI calls in a catch for EsiError; a validation\n    failure that sat outside that hierarchy would escape those handlers. The\n    type guard is what lets a caller narrow to the validation case when it\n    wants to treat a spec drift differently from a transport failure.\n\n    Scenario: Validation error is catchable as EsiError and narrowed by the guard\n      Given an ESI client with response validation enabled\n      When I receive a response that fails validation\n      Then the error shall be an instance of EsiError\n      And the error shall be identifiable via isValidationError","sourceStart":92,"findings":[]},{"id":"0053-runtime-validation#R8","title":"Where the validateResponse option is set to false, the EsiClient shall return the response body without schema parsing.","line":105,"pattern":"optional-feature","exclusion":false,"verdict":"verified","evidence":"","charter":[],"tags":[],"scenarios":[{"title":"Client with validateResponse disabled returns a mistyped field untouched","line":110,"tags":[]}],"source":"  Rule: Where the validateResponse option is set to false, the EsiClient shall return the response body without schema parsing.\n    Parsing costs time on large payloads, and an application already\n    validating downstream has no use for it. With the option off a body that\n    contradicts the schema is handed back untouched rather than rejected.\n\n    Scenario: Client with validateResponse disabled returns a mistyped field untouched\n      Given an ESI client with response validation disabled\n      When I receive a response with an invalid field type\n      Then the response shall be returned without validation error","sourceStart":105,"findings":[]},{"id":"0053-runtime-validation#R9","title":"If a field the schema marks as required is absent, then the schema shall report an issue whose path names that field.","line":117,"pattern":"unwanted-behaviour","exclusion":false,"verdict":"verified","evidence":"","charter":[],"tags":[],"scenarios":[{"title":"Character info missing corporation_id names that field in the issue path","line":122,"tags":[]}],"source":"  Rule: If a field the schema marks as required is absent, then the schema shall report an issue whose path names that field.\n    Naming the field is the whole value of the failure. The scenario below\n    removes corporation_id from an otherwise valid character record and\n    expects that key in the issue path, not a generic parse failure.\n\n    Scenario: Character info missing corporation_id names that field in the issue path\n      Given a Zod schema for character information\n      When I validate data with a missing required field\n      Then schema validation shall fail\n      And the error shall identify the missing field","sourceStart":117,"findings":[]},{"id":"0053-runtime-validation#R10","title":"When only the fields the schema marks as required are present, the schema shall parse the object successfully.","line":128,"pattern":"event-driven","exclusion":false,"verdict":"verified","evidence":"","charter":[],"tags":[],"scenarios":[{"title":"Character info with only the required fields parses","line":133,"tags":[]}],"source":"  Rule: When only the fields the schema marks as required are present, the schema shall parse the object successfully.\n    Optional fields on ESI routes are genuinely optional — alliance_id is\n    absent for a character in an unaffiliated corporation, for instance — so a\n    minimal record is a valid record and cannot be treated as a failure.\n\n    Scenario: Character info with only the required fields parses\n      Given a Zod schema for character information\n      When I validate data with only required fields\n      Then schema validation shall succeed","sourceStart":128,"findings":[]},{"id":"0053-runtime-validation#R11","title":"When a field holds an array of nested objects, the schema shall parse each element into the returned structure.","line":138,"pattern":"event-driven","exclusion":false,"verdict":"verified","evidence":"","charter":[],"tags":[],"scenarios":[{"title":"Fleet wing with two nested squads parses both squads","line":143,"tags":[]}],"source":"  Rule: When a field holds an array of nested objects, the schema shall parse each element into the returned structure.\n    Fleet, market and industry payloads nest one or two levels deep. Validating\n    only the outer object would leave the nested elements unchecked and\n    untyped, which is where a spec drift is hardest to spot.\n\n    Scenario: Fleet wing with two nested squads parses both squads\n      Given a Zod schema for complex nested data\n      When I validate data with valid nested objects\n      Then schema validation shall succeed for the entire structure","sourceStart":138,"findings":[]},{"id":"0053-runtime-validation#R12","title":"If an enum-typed field holds a value outside the declared set, then the schema shall not reject the object or replace the received value.","line":149,"pattern":"unwanted-behaviour","exclusion":true,"verdict":"verified","evidence":"","charter":["TEST-11"],"tags":["@TEST-11"],"scenarios":[{"title":"Alliance contact with an unrecognised contact_type keeps the raw value","line":155,"tags":[]}],"source":"  @TEST-11\n  Rule: If an enum-typed field holds a value outside the declared set, then the schema shall not reject the object or replace the received value.\n    CCP introduces new contact types, order states and job statuses without\n    warning. Rejecting an unrecognised value would break every caller on the\n    day of the change, so esiEnum widens to the raw string and passes it\n    through for the caller to handle.\n\n    Scenario: Alliance contact with an unrecognised contact_type keeps the raw value\n      Given a Zod schema with enum constraints\n      When I validate data with an unknown enum value\n      Then schema validation shall succeed with the unknown value preserved","sourceStart":148,"findings":[]}],"noUnwantedBehaviour":false,"orphanScenarios":0},{"file":"tests/bdd/features/core/0054-token-management.feature","area":"core","name":"Token Management","tags":[],"charter":["TEST-11","SEC-10"],"description":"EVE SSO access tokens live for twenty minutes and every authenticated ESI call needs a current one. Before this feature, each consumer wrote the same code: exchange an authorization code, store the refresh token, notice expiry, call the SSO token endpoint, persist the rotated refresh token, and repeat for every character. This file specifies the library's replacement for that boilerplate: an EveSsoClient that speaks to login.eveonline.com, an ITokenStorage contract with in-memory and file-backed adapters, and an EsiTokenManager that keeps one valid token per character, refreshes in bulk with a concurrency cap, and hands a ready-made EsiClient to callers.\n\nAll SSO traffic is mocked at the fetch seam, so the EveSsoClient, the EsiTokenManager, and the storage adapters all execute for real.","boundBy":["tests/bdd/step-definitions/core/token-management.steps.ts"],"rules":[{"id":"0054-token-management#R1","title":"When an authorization code is exchanged, the SSO client shall POST a grant_type=authorization_code request to the token endpoint and return the access token, refresh token and expiry from the response.","line":17,"pattern":"event-driven","exclusion":false,"verdict":"verified","evidence":"","charter":[],"tags":[],"scenarios":[{"title":"Confidential client exchanges a code using HTTP Basic credentials","line":23,"tags":[]}],"source":"  Rule: When an authorization code is exchanged, the SSO client shall POST a grant_type=authorization_code request to the token endpoint and return the access token, refresh token and expiry from the response.\n    The token endpoint is https://login.eveonline.com/v2/oauth/token and it\n    only accepts form-encoded bodies. The expiry is returned by SSO as a\n    lifetime in seconds; the client passes it through unchanged so the caller\n    decides how to anchor it to wall-clock time.\n\n    Scenario: Confidential client exchanges a code using HTTP Basic credentials\n      Given an SSO client configured with a client id and client secret\n      And the SSO token endpoint returns a token response\n      When the client exchanges the authorization code \"abc123\"\n      Then the request shall be a form-encoded POST to the SSO token endpoint\n      And the request shall carry an HTTP Basic Authorization header for the client id and secret\n      And the result shall contain the access token, refresh token and expiry from the response","sourceStart":17,"findings":[]},{"id":"0054-token-management#R2","title":"Where no client secret is configured, the SSO client shall authenticate token requests with the client_id and code_verifier form fields instead of an Authorization header.","line":31,"pattern":"optional-feature","exclusion":false,"verdict":"verified","evidence":"","charter":[],"tags":[],"scenarios":[{"title":"Public client exchanges a code using PKCE","line":37,"tags":[]}],"source":"  Rule: Where no client secret is configured, the SSO client shall authenticate token requests with the client_id and code_verifier form fields instead of an Authorization header.\n    Desktop and CLI applications cannot keep a secret, so EVE SSO supports\n    PKCE for them. The token request then identifies the application by\n    client_id in the body and proves possession of the code with the PKCE\n    verifier that generated the challenge in the authorization URL.\n\n    Scenario: Public client exchanges a code using PKCE\n      Given an SSO client configured with a client id only\n      And the SSO token endpoint returns a token response\n      When the client exchanges the authorization code \"abc123\" with a PKCE verifier\n      Then the request shall carry no Authorization header\n      And the request body shall include the client_id and the code_verifier","sourceStart":31,"findings":[]},{"id":"0054-token-management#R3","title":"When an authorization code is exchanged, the SSO client shall send the redirect URI that obtained the code as the redirect_uri form field.","line":44,"pattern":"event-driven","exclusion":false,"verdict":"verified","evidence":"","charter":[],"tags":[],"scenarios":[{"title":"Code exchange sends the configured callback as redirect_uri","line":51,"tags":[]},{"title":"Per-request redirect URI overrides the configured callback","line":57,"tags":[]}],"source":"  Rule: When an authorization code is exchanged, the SSO client shall send the redirect URI that obtained the code as the redirect_uri form field.\n    OAuth2 requires the token request to repeat the redirect_uri from the\n    authorization request when one was sent, and every login URL this client\n    builds sends one. The configured callbackUrl is the default and a\n    per-request override wins, matching getAuthorizationUrl. When neither is\n    set the field is omitted, because EVE SSO does not demand it.\n\n    Scenario: Code exchange sends the configured callback as redirect_uri\n      Given an SSO client configured with a client id, client secret and a callback URL\n      And the SSO token endpoint returns a token response\n      When the client exchanges the authorization code \"abc123\"\n      Then the request body shall carry the redirect_uri \"https://app.example/callback\"\n\n    Scenario: Per-request redirect URI overrides the configured callback\n      Given an SSO client configured with a client id, client secret and a callback URL\n      And the SSO token endpoint returns a token response\n      When the client exchanges the authorization code \"abc123\" with the redirect URI \"https://app.example/other\"\n      Then the request body shall carry the redirect_uri \"https://app.example/other\"","sourceStart":44,"findings":[]},{"id":"0054-token-management#R4","title":"If the SSO token endpoint responds to a refresh with the error code invalid_grant, then the SSO client shall throw TokenRevokedError.","line":63,"pattern":"unwanted-behaviour","exclusion":false,"verdict":"verified","evidence":"","charter":[],"tags":[],"scenarios":[{"title":"Refreshing a revoked refresh token throws TokenRevokedError","line":70,"tags":[]}],"source":"  Rule: If the SSO token endpoint responds to a refresh with the error code invalid_grant, then the SSO client shall throw TokenRevokedError.\n    invalid_grant is how SSO reports a refresh token that has been revoked by\n    the player, expired through disuse, or superseded by a rotation the\n    application failed to persist. Retrying cannot help; the character has to\n    log in again. A dedicated error type lets callers route to that outcome\n    without parsing the response body.\n\n    Scenario: Refreshing a revoked refresh token throws TokenRevokedError\n      Given an SSO client configured with a client id and client secret\n      And the SSO token endpoint responds 400 with error code \"invalid_grant\"\n      When the client refreshes the refresh token \"stale-refresh\"\n      Then the client shall throw TokenRevokedError","sourceStart":63,"findings":[]},{"id":"0054-token-management#R5","title":"If the SSO token endpoint responds to an authorization-code exchange with the error code invalid_grant, then the SSO client shall throw SsoError carrying that error code rather than TokenRevokedError.","line":76,"pattern":"unwanted-behaviour","exclusion":false,"verdict":"verified","evidence":"","charter":[],"tags":[],"scenarios":[{"title":"Expired login code is reported as SsoError with code invalid_grant","line":82,"tags":[]}],"source":"  Rule: If the SSO token endpoint responds to an authorization-code exchange with the error code invalid_grant, then the SSO client shall throw SsoError carrying that error code rather than TokenRevokedError.\n    On a code exchange, invalid_grant means the login code expired, was\n    already used, or was issued for a different redirect URI. No stored\n    refresh token was involved, so reporting it as a revocation would send\n    the caller down the re-authentication path for the wrong reason.\n\n    Scenario: Expired login code is reported as SsoError with code invalid_grant\n      Given an SSO client configured with a client id and client secret\n      And the SSO token endpoint responds 400 with error code \"invalid_grant\"\n      When the client exchanges the authorization code \"expired\" and the error is captured\n      Then the client shall throw SsoError with status 400 and error code \"invalid_grant\"","sourceStart":76,"findings":[]},{"id":"0054-token-management#R6","title":"If the SSO token endpoint responds 2xx with a body that is not a JSON object holding access_token and refresh_token, then the SSO client shall throw SsoError with error code invalid_response.","line":88,"pattern":"unwanted-behaviour","exclusion":false,"verdict":"verified","evidence":"","charter":[],"tags":[],"scenarios":[{"title":"HTML success body is reported as SsoError with code invalid_response","line":95,"tags":[]},{"title":"JSON null success body is reported as SsoError with code invalid_response","line":101,"tags":[]}],"source":"  Rule: If the SSO token endpoint responds 2xx with a body that is not a JSON object holding access_token and refresh_token, then the SSO client shall throw SsoError with error code invalid_response.\n    A proxy or an outage page can answer the token endpoint with HTML, an\n    empty body, or a JSON value that is not an object. Those failures belong\n    to the same error family as any other SSO fault so that a caller\n    catching SsoError sees them, instead of a raw SyntaxError or TypeError\n    escaping from the JSON parser.\n\n    Scenario: HTML success body is reported as SsoError with code invalid_response\n      Given an SSO client configured with a client id and client secret\n      And the SSO token endpoint responds 200 with the body \"\u003chtml>ok\u003c/html>\"\n      When the client refreshes the refresh token \"any-refresh\"\n      Then the client shall throw SsoError with status 200 and error code \"invalid_response\"\n\n    Scenario: JSON null success body is reported as SsoError with code invalid_response\n      Given an SSO client configured with a client id and client secret\n      And the SSO token endpoint responds 200 with the body \"null\"\n      When the client refreshes the refresh token \"any-refresh\"\n      Then the client shall throw SsoError with status 200 and error code \"invalid_response\"","sourceStart":88,"findings":[]},{"id":"0054-token-management#R7","title":"If the SSO token endpoint responds with a non-2xx status other than invalid_grant, then the SSO client shall throw SsoError carrying that status code and the SSO error code.","line":107,"pattern":"unwanted-behaviour","exclusion":false,"verdict":"verified","evidence":"","charter":[],"tags":[],"scenarios":[{"title":"SSO rate limit response is surfaced with status 429","line":112,"tags":[]}],"source":"  Rule: If the SSO token endpoint responds with a non-2xx status other than invalid_grant, then the SSO client shall throw SsoError carrying that status code and the SSO error code.\n    Everything else the token endpoint can say — invalid_client, a 429 from\n    SSO's own rate limiter, a 5xx outage — is surfaced with enough detail to\n    decide between fixing configuration and trying again later.\n\n    Scenario: SSO rate limit response is surfaced with status 429\n      Given an SSO client configured with a client id and client secret\n      And the SSO token endpoint responds 429 with error code \"rate_limited\"\n      When the client refreshes the refresh token \"any-refresh\"\n      Then the client shall throw SsoError with status 429 and error code \"rate_limited\"","sourceStart":107,"findings":[]},{"id":"0054-token-management#R8","title":"Where a request timeout is configured, if SSO does not respond within it, then the SSO client shall reject with a retryable SsoError.","line":118,"pattern":"complex","exclusion":false,"verdict":"verified","evidence":"","charter":[],"tags":[],"scenarios":[{"title":"Refresh that SSO never answers is rejected as a retryable timeout","line":125,"tags":[]}],"source":"  Rule: Where a request timeout is configured, if SSO does not respond within it, then the SSO client shall reject with a retryable SsoError.\n    A request that SSO never answers would otherwise keep a refresh pending\n    for as long as the connection stays open. Under a locking store the hung\n    refresh holds the character's lock, so a waiter breaks it after staleMs\n    and spends a refresh token SSO may already have rotated. Status 0 means\n    no HTTP status arrived; the error code is timeout.\n\n    Scenario: Refresh that SSO never answers is rejected as a retryable timeout\n      Given an SSO client configured with a request timeout of 50 ms\n      And the SSO token endpoint never responds\n      When the client refreshes the refresh token \"any-refresh\"\n      Then the client shall throw SsoError with status 0 and error code \"timeout\"\n      And the error shall be retryable","sourceStart":118,"findings":[]},{"id":"0054-token-management#R9","title":"Where a request timeout is configured, if SSO answers a token request with a 2xx status but the body does not arrive within the timeout, then the SSO client shall reject with a non-retryable SsoError carrying that status and the error code timeout.","line":132,"pattern":"complex","exclusion":false,"verdict":"verified","evidence":"","charter":[],"tags":[],"scenarios":[{"title":"Token response whose body stalls is rejected as a timeout that is not retryable","line":138,"tags":[]}],"source":"  Rule: Where a request timeout is configured, if SSO answers a token request with a 2xx status but the body does not arrive within the timeout, then the SSO client shall reject with a non-retryable SsoError carrying that status and the error code timeout.\n    A 2xx status means SSO accepted the request, so a refresh has most likely\n    rotated the refresh token already. Sending the old one again would be\n    refused as invalid_grant and mark the character revoked, so the late body\n    is reported with the status that arrived and is not offered as retryable.\n\n    Scenario: Token response whose body stalls is rejected as a timeout that is not retryable\n      Given an SSO client configured with a request timeout of 50 ms\n      And the SSO token endpoint responds 200 but never finishes the body\n      When the client refreshes the refresh token \"any-refresh\"\n      Then the client shall throw SsoError with status 200 and error code \"timeout\"\n      And the error shall not be retryable","sourceStart":132,"findings":[]},{"id":"0054-token-management#R10","title":"Where no request timeout is configured, the SSO client shall send token requests without an abort signal.","line":145,"pattern":"optional-feature","exclusion":false,"verdict":"verified","evidence":"","charter":[],"tags":[],"scenarios":[{"title":"Refresh without a configured timeout carries no abort signal","line":149,"tags":[]}],"source":"  Rule: Where no request timeout is configured, the SSO client shall send token requests without an abort signal.\n    The timeout is opt-in so that existing callers see no change: a slow SSO\n    is waited for exactly as before.\n\n    Scenario: Refresh without a configured timeout carries no abort signal\n      Given an SSO client configured with a client id and client secret\n      And the SSO token endpoint returns a token\n      When the client refreshes the refresh token \"any-refresh\"\n      Then the token request shall carry no abort signal","sourceStart":145,"findings":[]},{"id":"0054-token-management#R11","title":"If the configured request timeout is not a positive, finite number, then the SSO client shall throw RangeError when constructed.","line":155,"pattern":"unwanted-behaviour","exclusion":false,"verdict":"verified","evidence":"","charter":[],"tags":[],"scenarios":[{"title":"Zero request timeout is rejected at construction","line":159,"tags":[]}],"source":"  Rule: If the configured request timeout is not a positive, finite number, then the SSO client shall throw RangeError when constructed.\n    A zero, negative or NaN timeout would abort every request at once or\n    never; both are configuration mistakes better reported up front.\n\n    Scenario: Zero request timeout is rejected at construction\n      When an SSO client is constructed with a request timeout of 0 ms\n      Then construction shall throw RangeError naming timeoutMs","sourceStart":155,"findings":[]},{"id":"0054-token-management#R12","title":"When a character is added from an authorization code, the token manager shall decode the character id, name and scopes from the access token and persist the token under that character id.","line":165,"pattern":"event-driven","exclusion":false,"verdict":"verified","evidence":"","charter":[],"tags":[],"scenarios":[{"title":"Adding a character stores its decoded identity and scopes","line":172,"tags":[]}],"source":"  Rule: When a character is added from an authorization code, the token manager shall decode the character id, name and scopes from the access token and persist the token under that character id.\n    The access token is a JWT whose sub claim is CHARACTER:EVE:\u003cid>, whose\n    name claim is the character name, and whose scp claim lists the granted\n    scopes. Reading these from the token avoids a round trip to the\n    deprecated verify endpoint and means the caller never has to say which\n    character just logged in.\n\n    Scenario: Adding a character stores its decoded identity and scopes\n      Given a token manager backed by in-memory storage\n      And the SSO token endpoint returns a token for character 2114794365 \"Aurora Vale\" with scopes \"esi-wallet.read_character_wallet.v1 esi-assets.read_assets.v1\"\n      When the character is added from the authorization code \"abc123\"\n      Then the storage shall hold a token for character 2114794365 named \"Aurora Vale\"\n      And the stored scopes shall be \"esi-wallet.read_character_wallet.v1 esi-assets.read_assets.v1\"","sourceStart":165,"findings":[]},{"id":"0054-token-management#R13","title":"If token verification is not enabled and an access token from SSO carries a signature that EVE SSO's published keys do not verify, then the token manager shall not reject the token.","line":180,"pattern":"unwanted-behaviour","exclusion":true,"verdict":"verified","evidence":"","charter":["TEST-11"],"tags":["@TEST-11"],"scenarios":[{"title":"A token whose signature SSO never made is stored under its character","line":187,"tags":[]}],"source":"  @TEST-11\n  Rule: If token verification is not enabled and an access token from SSO carries a signature that EVE SSO's published keys do not verify, then the token manager shall not reject the token.\n    By default the token manager decodes the claims without verifying the\n    signature: the token arrives straight from SSO's token endpoint over TLS,\n    which is what vouches for it (AUTHENTICATION.md, \"Guarantees and limits\").\n    Verification is opt-in through verifyTokens, so the default path never\n    fetches keys when a character is added.\n\n    Scenario: A token whose signature SSO never made is stored under its character\n      Given a token manager backed by in-memory storage\n      And the SSO token endpoint returns a token for character 2114794365 \"Aurora Vale\" whose signature SSO never made\n      When the character is added from the authorization code \"abc123\"\n      Then the storage shall hold a token for character 2114794365 named \"Aurora Vale\"\n      And the token manager sent the token exchange request alone","sourceStart":179,"findings":[]},{"id":"0054-token-management#R14","title":"Where token verification is enabled, the token manager shall store a character whose access token signature verifies against a key in EVE SSO's published key set.","line":197,"pattern":"optional-feature","exclusion":false,"verdict":"verified","evidence":"","charter":["SEC-10"],"tags":["@sec-P5","@SEC-10"],"scenarios":[{"title":"A token signed by SSO's published key is stored","line":204,"tags":[]}],"source":"  @sec-P5 @SEC-10\n  Rule: Where token verification is enabled, the token manager shall store a character whose access token signature verifies against a key in EVE SSO's published key set.\n    Applications that accept tokens from a third party (a proxy, a browser\n    login handing the token to a backend) cannot rely on TLS to SSO, so they\n    turn on verifyTokens. The manager fetches the key set from\n    login.eveonline.com/oauth/jwks and checks the RS256 signature before it\n    trusts the sub, name, scp and owner claims.\n\n    Scenario: A token signed by SSO's published key is stored\n      Given a token manager with token verification enabled\n      And EVE SSO publishes its current signing key\n      And the SSO token endpoint returns a token for character 2114794365 \"Aurora Vale\" signed by SSO's current key\n      When the character is added from the authorization code \"abc123\"\n      Then the storage shall hold a token for character 2114794365 named \"Aurora Vale\"\n      And the token manager fetched EVE SSO's key set once","sourceStart":196,"findings":[]},{"id":"0054-token-management#R15","title":"If token verification is enabled and an imported access token's signature does not match its header and payload, then the token manager shall reject the import with TokenVerificationError and store nothing.","line":213,"pattern":"unwanted-behaviour","exclusion":false,"verdict":"verified","evidence":"","charter":["SEC-10"],"tags":["@sec-P5","@SEC-10"],"scenarios":[{"title":"An imported token whose payload was edited after signing is rejected","line":219,"tags":[]}],"source":"  @sec-P5 @SEC-10\n  Rule: If token verification is enabled and an imported access token's signature does not match its header and payload, then the token manager shall reject the import with TokenVerificationError and store nothing.\n    A tampered payload is the attack verification exists for: someone edits\n    the sub claim to claim another character and keeps the original\n    signature. The signature no longer covers the bytes, so the import fails\n    before anything reaches storage.\n\n    Scenario: An imported token whose payload was edited after signing is rejected\n      Given a token manager with token verification enabled\n      And EVE SSO publishes its current signing key\n      When a token signed by SSO's current key is imported with its character id changed to 90000001\n      Then the import shall be rejected with TokenVerificationError for reason \"signature\"\n      And the storage shall hold no tokens","sourceStart":212,"findings":[]},{"id":"0054-token-management#R16","title":"When token verification is enabled and an access token names a key id absent from the cached key set, the token manager shall fetch EVE SSO's key set again before verifying the token.","line":226,"pattern":"event-driven","exclusion":false,"verdict":"verified","evidence":"","charter":[],"tags":[],"scenarios":[{"title":"A token signed by a rotated key is accepted after a refetch","line":232,"tags":[]}],"source":"  Rule: When token verification is enabled and an access token names a key id absent from the cached key set, the token manager shall fetch EVE SSO's key set again before verifying the token.\n    SSO rotates its signing key. A cached key set that predates the rotation\n    does not hold the new key id, so the manager refetches once instead of\n    rejecting a token SSO signed legitimately. Refetches are limited to one\n    per minute so a stream of made-up key ids cannot hammer the endpoint.\n\n    Scenario: A token signed by a rotated key is accepted after a refetch\n      Given a token manager with token verification enabled\n      And the token manager cached EVE SSO's key set before SSO rotated its signing key\n      And the SSO token endpoint returns a token for character 2114794365 \"Aurora Vale\" signed by SSO's rotated key\n      When the character is added from the authorization code \"abc123\"\n      Then the storage shall hold a token for character 2114794365 named \"Aurora Vale\"\n      And the token manager fetched EVE SSO's key set twice","sourceStart":226,"findings":[]},{"id":"0054-token-management#R17","title":"If token verification is enabled and an imported access token's exp claim is in the past, then the token manager shall reject the import with TokenVerificationError and store nothing.","line":241,"pattern":"unwanted-behaviour","exclusion":false,"verdict":"verified","evidence":"","charter":["SEC-10"],"tags":["@sec-P5","@SEC-10"],"scenarios":[{"title":"An imported token that expired is rejected","line":247,"tags":[]}],"source":"  @sec-P5 @SEC-10\n  Rule: If token verification is enabled and an imported access token's exp claim is in the past, then the token manager shall reject the import with TokenVerificationError and store nothing.\n    A validly signed token stops being evidence of a login once it expires,\n    so it cannot vouch for the refresh token handed over with it. Callers\n    migrating stale tokens from another tool leave verification off for the\n    import, or refresh first.\n\n    Scenario: An imported token that expired is rejected\n      Given a token manager with token verification enabled\n      And EVE SSO publishes its current signing key\n      When a token signed by SSO's current key that expired 300 seconds ago is imported\n      Then the import shall be rejected with TokenVerificationError for reason \"expired\"\n      And the storage shall hold no tokens","sourceStart":240,"findings":[]},{"id":"0054-token-management#R18","title":"If token verification is enabled and an imported access token's aud claim does not name the configured client id, then the token manager shall reject the import with TokenVerificationError.","line":255,"pattern":"unwanted-behaviour","exclusion":false,"verdict":"verified","evidence":"","charter":["SEC-10"],"tags":["@sec-P5","@SEC-10"],"scenarios":[{"title":"A token issued to another application is rejected","line":261,"tags":[]}],"source":"  @sec-P5 @SEC-10\n  Rule: If token verification is enabled and an imported access token's aud claim does not name the configured client id, then the token manager shall reject the import with TokenVerificationError.\n    SSO signs tokens for every application with the same key, so a valid\n    signature alone does not show the token was issued to this application.\n    A token issued to another client id is the case a backend accepting\n    third-party tokens has to refuse.\n\n    Scenario: A token issued to another application is rejected\n      Given a token manager with token verification enabled\n      And EVE SSO publishes its current signing key\n      When a token signed by SSO's current key for the client id \"someone-elses-app\" is imported\n      Then the import shall be rejected with TokenVerificationError for reason \"audience\"\n      And the storage shall hold no tokens","sourceStart":254,"findings":[]},{"id":"0054-token-management#R19","title":"When a character that already has a stored token is added again, the token manager shall replace the stored token rather than storing a second entry.","line":268,"pattern":"event-driven","exclusion":false,"verdict":"verified","evidence":"","charter":[],"tags":[],"scenarios":[{"title":"Re-authorizing a character replaces the previous token","line":274,"tags":[]}],"source":"  Rule: When a character that already has a stored token is added again, the token manager shall replace the stored token rather than storing a second entry.\n    Storage is keyed by character id, so a re-authorization never accumulates\n    duplicate rows the way an append-only token table can. The newest consent\n    wins even when it grants fewer scopes, because it reflects what the player\n    most recently agreed to.\n\n    Scenario: Re-authorizing a character replaces the previous token\n      Given a token manager backed by in-memory storage\n      And character 2114794365 is already stored with refresh token \"old-refresh\"\n      And the SSO token endpoint returns a token for character 2114794365 \"Aurora Vale\" with refresh token \"new-refresh\"\n      When the character is added from the authorization code \"abc123\"\n      Then the storage shall hold exactly one token\n      And the stored refresh token for character 2114794365 shall be \"new-refresh\"","sourceStart":268,"findings":[]},{"id":"0054-token-management#R20","title":"When a token is requested for a character whose access token expires within the refresh skew, the token manager shall refresh it through SSO before returning.","line":284,"pattern":"event-driven","exclusion":false,"verdict":"verified","evidence":"","charter":[],"tags":[],"scenarios":[{"title":"Token within the skew window is refreshed before it is returned","line":290,"tags":[]},{"title":"Token outside the skew window is returned without contacting SSO","line":298,"tags":[]}],"source":"  Rule: When a token is requested for a character whose access token expires within the refresh skew, the token manager shall refresh it through SSO before returning.\n    A token that expires in the next few seconds will fail by the time the\n    request reaches ESI, costing a 401 against the error budget. Refreshing\n    ahead of expiry, by a configurable skew that defaults to sixty seconds,\n    means the token handed to the caller is usable for the whole request.\n\n    Scenario: Token within the skew window is refreshed before it is returned\n      Given a token manager backed by in-memory storage with a refresh skew of 60 seconds\n      And character 2114794365 is stored with an access token expiring in 30 seconds\n      And the SSO token endpoint returns a token for character 2114794365 with access token \"fresh-access\"\n      When a token is requested for character 2114794365\n      Then the returned access token shall be \"fresh-access\"\n      And the SSO token endpoint shall have been called 1 time\n\n    Scenario: Token outside the skew window is returned without contacting SSO\n      Given a token manager backed by in-memory storage with a refresh skew of 60 seconds\n      And character 2114794365 is stored with an access token expiring in 600 seconds\n      When a token is requested for character 2114794365\n      Then the returned access token shall be the stored access token\n      And the SSO token endpoint shall have been called 0 times","sourceStart":284,"findings":[]},{"id":"0054-token-management#R21","title":"While a refresh is in flight for a character, the token manager shall return the same pending refresh to every concurrent caller for that character.","line":305,"pattern":"state-driven","exclusion":false,"verdict":"verified","evidence":"","charter":[],"tags":[],"scenarios":[{"title":"Five concurrent token requests produce a single SSO call","line":312,"tags":[]}],"source":"  Rule: While a refresh is in flight for a character, the token manager shall return the same pending refresh to every concurrent caller for that character.\n    EVE SSO rotates the refresh token on every use, so two overlapping\n    refreshes of the same character would each receive a different rotation\n    and whichever is persisted second invalidates the other. Coalescing\n    concurrent callers onto a single SSO call removes that race inside one\n    process.\n\n    Scenario: Five concurrent token requests produce a single SSO call\n      Given a token manager backed by in-memory storage with a refresh skew of 60 seconds\n      And character 2114794365 is stored with an access token expiring in 30 seconds\n      And the SSO token endpoint returns a token for character 2114794365 with access token \"fresh-access\"\n      When 5 tokens are requested concurrently for character 2114794365\n      Then every returned access token shall be \"fresh-access\"\n      And the SSO token endpoint shall have been called 1 time","sourceStart":305,"findings":[]},{"id":"0054-token-management#R22","title":"When a refresh succeeds, the token manager shall persist the rotated refresh token before returning the new access token.","line":320,"pattern":"event-driven","exclusion":false,"verdict":"verified","evidence":"","charter":[],"tags":[],"scenarios":[{"title":"Rotated refresh token is in storage when the refresh resolves","line":326,"tags":[]}],"source":"  Rule: When a refresh succeeds, the token manager shall persist the rotated refresh token before returning the new access token.\n    The rotated refresh token is the only credential that can obtain the next\n    access token. Persisting it before the caller regains control means a\n    crash after the refresh cannot leave storage holding a refresh token SSO\n    has already invalidated.\n\n    Scenario: Rotated refresh token is in storage when the refresh resolves\n      Given a token manager backed by in-memory storage with a refresh skew of 60 seconds\n      And character 2114794365 is stored with an access token expiring in 30 seconds\n      And the SSO token endpoint returns a token for character 2114794365 with refresh token \"rotated-refresh\"\n      When a token is requested for character 2114794365\n      Then the stored refresh token for character 2114794365 shall be \"rotated-refresh\"","sourceStart":320,"findings":[]},{"id":"0054-token-management#R23","title":"If SSO reports the refresh token as invalid, then the token manager shall mark the character as revoked and reject later token requests for that character without calling SSO.","line":333,"pattern":"unwanted-behaviour","exclusion":false,"verdict":"verified","evidence":"","charter":[],"tags":[],"scenarios":[{"title":"Revoked character is rejected locally on the next request","line":339,"tags":[]}],"source":"  Rule: If SSO reports the refresh token as invalid, then the token manager shall mark the character as revoked and reject later token requests for that character without calling SSO.\n    Once SSO has rejected a refresh token, every further attempt with it will\n    fail the same way and each one counts against SSO's rate limit. Recording\n    the revocation turns the failure into a fast local error until the\n    character is added again.\n\n    Scenario: Revoked character is rejected locally on the next request\n      Given a token manager backed by in-memory storage with a refresh skew of 60 seconds\n      And character 2114794365 is stored with an access token expiring in 30 seconds\n      And the SSO token endpoint responds 400 with error code \"invalid_grant\"\n      When a token is requested for character 2114794365 and the error is captured\n      And a token is requested again for character 2114794365 and the error is captured\n      Then both requests shall have thrown TokenRevokedError\n      And the SSO token endpoint shall have been called 1 time","sourceStart":333,"findings":[]},{"id":"0054-token-management#R24","title":"If a character is removed while its refresh is in flight, then the token manager shall discard the refresh result and reject the refresh with CharacterNotFoundError.","line":348,"pattern":"unwanted-behaviour","exclusion":false,"verdict":"verified","evidence":"","charter":[],"tags":[],"scenarios":[{"title":"Refresh completing after removal leaves storage empty","line":354,"tags":[]}],"source":"  Rule: If a character is removed while its refresh is in flight, then the token manager shall discard the refresh result and reject the refresh with CharacterNotFoundError.\n    A refresh holds the SSO round trip open for hundreds of milliseconds.\n    Deleting the character in that window is a deliberate act, and the\n    late-arriving token must not resurrect the record; it would hold a\n    rotated refresh token the operator believes is gone.\n\n    Scenario: Refresh completing after removal leaves storage empty\n      Given a token manager backed by in-memory storage with a refresh skew of 60 seconds\n      And character 2114794365 is stored with an access token expiring in 30 seconds\n      And the SSO token endpoint returns a token for character 2114794365 after the removal completes\n      When a refresh is started for character 2114794365 and the character is removed before SSO responds\n      Then the refresh shall reject with CharacterNotFoundError\n      And the storage shall hold no token for character 2114794365","sourceStart":348,"findings":[]},{"id":"0054-token-management#R25","title":"If a character is added again while its refresh is in flight, then the token manager shall keep the newly stored token rather than overwriting it with the refresh result.","line":362,"pattern":"unwanted-behaviour","exclusion":false,"verdict":"verified","evidence":"","charter":[],"tags":[],"scenarios":[{"title":"Refresh completing after re-authorization keeps the new refresh token","line":368,"tags":[]}],"source":"  Rule: If a character is added again while its refresh is in flight, then the token manager shall keep the newly stored token rather than overwriting it with the refresh result.\n    A player re-authorizing during a refresh produces two rotations: the\n    refresh's and the new login's. The login is the newer consent and the\n    only one whose refresh token SSO still honours, so the stale refresh\n    yields to it and hands its caller the current record.\n\n    Scenario: Refresh completing after re-authorization keeps the new refresh token\n      Given a token manager backed by in-memory storage with a refresh skew of 60 seconds\n      And character 2114794365 is stored with an access token expiring in 30 seconds\n      And the SSO token endpoint returns refresh token \"rotated-old\" to the refresh and \"new-login\" to the code exchange\n      When a refresh is started for character 2114794365 and the character is added again before SSO responds\n      Then the stored refresh token for character 2114794365 shall be \"new-login\"\n      And the refresh shall resolve with the refresh token \"new-login\"","sourceStart":362,"findings":[]},{"id":"0054-token-management#R26","title":"Where the storage adapter provides a lock, when a refresh acquires the lock after another holder has rotated the stored refresh token, the token manager shall return the stored token without calling SSO.","line":376,"pattern":"complex","exclusion":false,"verdict":"verified","evidence":"","charter":[],"tags":[],"scenarios":[{"title":"Two managers on one locked file store produce a single SSO call","line":383,"tags":[]}],"source":"  Rule: Where the storage adapter provides a lock, when a refresh acquires the lock after another holder has rotated the stored refresh token, the token manager shall return the stored token without calling SSO.\n    Coalescing only reaches callers inside one manager. Two processes on one\n    store each have their own manager, and whichever persisted its rotation\n    second would leave the other holding a refresh token SSO has already\n    spent. Under the lock the second refresh reads the store again, sees the\n    rotation and hands out that token instead of spending it.\n\n    Scenario: Two managers on one locked file store produce a single SSO call\n      Given two token managers each opening the same file token storage with locking enabled\n      And character 2114794365 is stored with an access token expiring in 30 seconds\n      And the SSO token endpoint returns a token for character 2114794365 with access token \"fresh-access\" after a delay\n      When both managers request a token for character 2114794365 at the same time\n      Then both managers shall return the access token \"fresh-access\"\n      And the SSO token endpoint shall have been called 1 time","sourceStart":376,"findings":[]},{"id":"0054-token-management#R27","title":"Where the storage adapter provides no lock, the token manager shall refresh through SSO without reading the stored token a second time.","line":391,"pattern":"optional-feature","exclusion":false,"verdict":"verified","evidence":"","charter":[],"tags":[],"scenarios":[{"title":"Refresh on a storage without a lock reads the token once","line":395,"tags":[]}],"source":"  Rule: Where the storage adapter provides no lock, the token manager shall refresh through SSO without reading the stored token a second time.\n    The lock is an optional part of the storage contract. Adapters written\n    before it existed keep their behaviour and their number of storage reads.\n\n    Scenario: Refresh on a storage without a lock reads the token once\n      Given a token manager backed by storage without a lock that counts reads\n      And character 2114794365 is stored with an access token expiring in 30 seconds\n      And the SSO token endpoint returns a token for character 2114794365 with access token \"fresh-access\"\n      When the token manager refreshes character 2114794365\n      Then the storage shall have been read 1 time\n      And the SSO token endpoint shall have been called 1 time","sourceStart":391,"findings":[]},{"id":"0054-token-management#R28","title":"When a client is created for a character, the token manager shall configure that client with the character's current access token and a refresh provider bound to that character.","line":405,"pattern":"event-driven","exclusion":false,"verdict":"verified","evidence":"","charter":[],"tags":[],"scenarios":[{"title":"Client created by the manager refreshes through the manager on a 401","line":411,"tags":[]}],"source":"  Rule: When a client is created for a character, the token manager shall configure that client with the character's current access token and a refresh provider bound to that character.\n    The manager is the source of truth for tokens; the EsiClient stays\n    unaware of storage or SSO. Binding the refresh provider to the character\n    means the existing 401-refresh-retry path in the request pipeline\n    replays a request with a token the manager just obtained and persisted.\n\n    Scenario: Client created by the manager refreshes through the manager on a 401\n      Given a token manager backed by in-memory storage with a refresh skew of 60 seconds\n      And character 2114794365 is stored with an access token expiring in 600 seconds\n      And the SSO token endpoint returns a token for character 2114794365 with access token \"fresh-access\"\n      And the ESI endpoint responds 401 to the stored access token and 200 to \"fresh-access\"\n      When a client is created for character 2114794365 and it fetches the character's wallet\n      Then the wallet request shall succeed\n      And the stored access token for character 2114794365 shall be \"fresh-access\"","sourceStart":405,"findings":[]},{"id":"0054-token-management#R29","title":"When a bulk refresh runs with a concurrency limit, the token manager shall keep the number of simultaneous SSO refresh requests at or below that limit.","line":422,"pattern":"event-driven","exclusion":false,"verdict":"verified","evidence":"","charter":[],"tags":[],"scenarios":[{"title":"Twenty tokens refreshed with a limit of three never exceed three in flight","line":428,"tags":[]}],"source":"  Rule: When a bulk refresh runs with a concurrency limit, the token manager shall keep the number of simultaneous SSO refresh requests at or below that limit.\n    SSO applies its own rate limit that is not part of the ESI error budget\n    and is not published in the OpenAPI spec. A corporation tool holding\n    hundreds of tokens needs to bound how hard it hits the token endpoint;\n    the default limit is five.\n\n    Scenario: Twenty tokens refreshed with a limit of three never exceed three in flight\n      Given a token manager backed by in-memory storage\n      And 20 characters are stored with access tokens expiring in 30 seconds\n      And the SSO token endpoint returns a token for each refresh after a short delay\n      When refreshAll runs with a concurrency of 3\n      Then the peak number of simultaneous SSO requests shall be at most 3\n      And every result shall have status \"refreshed\"","sourceStart":422,"findings":[]},{"id":"0054-token-management#R30","title":"If one token fails to refresh during a bulk refresh, then the token manager shall report that failure in its result and continue refreshing the remaining tokens.","line":436,"pattern":"unwanted-behaviour","exclusion":false,"verdict":"verified","evidence":"","charter":[],"tags":[],"scenarios":[{"title":"One revoked token among three is reported while the other two r
