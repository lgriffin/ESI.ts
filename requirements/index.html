able name and an ID present in that table, the SDE provider shall return the record the typed lookup for that table returns.","line":12,"pattern":"event-driven","exclusion":false,"verdict":"verified","evidence":"","charter":[],"tags":[],"scenarios":[{"title":"Entity 34 of eve_types is the Tritanium record","line":16,"tags":[]}],"source":"  Rule: When an entity is looked up by a loaded table name and an ID present in that table, the SDE provider shall return the record the typed lookup for that table returns.\n    The generic accessor reads the same store as the typed lookups, so the\n    record is the same object with the same fields.\n\n    Scenario: Entity 34 of eve_types is the Tritanium record\n      Given a static data provider with the reference data set\n      When I look up entity 34 in table \"eve_types\"\n      Then the returned record shall be named \"Tritanium\"\n      And the returned record shall carry group 18","sourceStart":12,"findings":[]},{"id":"0019-sde-generic-access#R2","title":"If an entity is looked up by a table name that is not loaded, or by an ID absent from that table, then the SDE provider shall return null.","line":22,"pattern":"unwanted-behaviour","exclusion":false,"verdict":"verified","evidence":"","charter":[],"tags":[],"scenarios":[{"title":"An unknown table name resolves to null","line":26,"tags":[]},{"title":"An absent ID in a loaded table resolves to null","line":31,"tags":[]}],"source":"  Rule: If an entity is looked up by a table name that is not loaded, or by an ID absent from that table, then the SDE provider shall return null.\n    A wrong table name is the likeliest mistake with an untyped accessor,\n    and it answers the same way an absent ID does: null, not an exception.\n\n    Scenario: An unknown table name resolves to null\n      Given a static data provider with the reference data set\n      When I look up entity 34 in table \"eve_nothing\"\n      Then the provider shall return null\n\n    Scenario: An absent ID in a loaded table resolves to null\n      Given a static data provider with the reference data set\n      When I look up entity 999999 in table \"eve_types\"\n      Then the provider shall return null","sourceStart":22,"findings":[]},{"id":"0019-sde-generic-access#R3","title":"When every entity of a loaded table name is requested, the SDE provider shall return one record for each loaded record of that table.","line":38,"pattern":"event-driven","exclusion":false,"verdict":"verified","evidence":"","charter":[],"tags":[],"scenarios":[{"title":"Every entity of eve_types is the three loaded types","line":42,"tags":[]}],"source":"  Rule: When every entity of a loaded table name is requested, the SDE provider shall return one record for each loaded record of that table.\n    Reading a niche table whole is the generic accessor's main use: a\n    caller iterates it once and builds its own index.\n\n    Scenario: Every entity of eve_types is the three loaded types\n      Given a static data provider with the reference data set\n      When I look up every entity in table \"eve_types\"\n      Then the result should contain exactly 3 records\n      And the result shall be the records named \"Mexallon, Pyerite, Tritanium\"","sourceStart":38,"findings":[]},{"id":"0019-sde-generic-access#R4","title":"If every entity of a table name that is not loaded is requested, then the SDE provider shall return an empty list.","line":48,"pattern":"unwanted-behaviour","exclusion":false,"verdict":"verified","evidence":"","charter":[],"tags":[],"scenarios":[{"title":"Every entity of an unknown table is an empty list","line":52,"tags":[]}],"source":"  Rule: If every entity of a table name that is not loaded is requested, then the SDE provider shall return an empty list.\n    An unloaded table reads as empty rather than failing, so a caller can\n    iterate it without first asking whether the extract carried it.\n\n    Scenario: Every entity of an unknown table is an empty list\n      Given a static data provider with the reference data set\n      When I look up every entity in table \"eve_nothing\"\n      Then the provider shall return an empty list","sourceStart":48,"findings":[]}],"noUnwantedBehaviour":false,"orphanScenarios":0},{"file":"tests/bdd/features/sde/0020-sde-loading.feature","area":"sde","name":"Loading the Static Data Export","tags":["@TEST-10"],"charter":["TEST-10","TEST-11"],"description":"CCP publishes the Static Data Export as a ZIP archive of YAML files, one per table, with a _sde.yaml naming the build. SdeDataProvider reads that archive, or a directory it was extracted to, straight into memory: the build becomes the version record, each file becomes a table, and every record is reshaped from CCP's form — localised names as maps, foreign keys with an ID suffix — into the form every lookup in features 0001 to 0019 serves. Closing a provider empties it.\n\nThe scenarios write a minimal export to a temporary directory: two types with localised names, their group, and the build metadata.","boundBy":["tests/bdd/specs/sde/0020-sde-loading.spec.ts"],"rules":[{"id":"0020-sde-loading#R1","title":"When the SDE is opened from a directory whose _sde.yaml nests the build under an sde key, the SdeDataProvider shall report that build number as its version, that release date as its build date, and the clock's instant as its import date.","line":16,"pattern":"event-driven","exclusion":false,"verdict":"verified","evidence":"","charter":[],"tags":[],"scenarios":[{"title":"The build nested under sde becomes the version record","line":21,"tags":[]}],"source":"  Rule: When the SDE is opened from a directory whose _sde.yaml nests the build under an sde key, the SdeDataProvider shall report that build number as its version, that release date as its build date, and the clock's instant as its import date.\n    CCP's _sde.yaml nests both values under sde. The import date comes from\n    the clock the caller passes, so a test can fix it and a consumer can\n    tell two imports of the same build apart.\n\n    Scenario: The build nested under sde becomes the version record\n      Given an SDE directory holding the raw export files\n      When I open the SDE from the directory\n      And the user queries the SDE version\n      Then the version shall be \"2026-09-15.1\" built on \"2026-09-15\" and imported at \"2026-09-28T12:00:00.000Z\"","sourceStart":16,"findings":[]},{"id":"0020-sde-loading#R2","title":"If the directory holds no _sde.yaml, then the SdeDataProvider shall report the version and the build date as unknown.","line":27,"pattern":"unwanted-behaviour","exclusion":false,"verdict":"verified","evidence":"","charter":[],"tags":[],"scenarios":[{"title":"A directory without metadata reports unknown","line":32,"tags":[]}],"source":"  Rule: If the directory holds no _sde.yaml, then the SdeDataProvider shall report the version and the build date as unknown.\n    A hand-assembled directory may carry no metadata file. The provider\n    still opens, with placeholder values a caller can recognise, rather\n    than refusing the data.\n\n    Scenario: A directory without metadata reports unknown\n      Given an SDE directory holding the raw export files without _sde.yaml\n      When I open the SDE from the directory\n      And the user queries the SDE version\n      Then the version shall be \"unknown\" built on \"unknown\" and imported at \"2026-09-28T12:00:00.000Z\"","sourceStart":27,"findings":[]},{"id":"0020-sde-loading#R3","title":"If a file the registry names is absent from the directory, then the SdeDataProvider shall not refuse to open the directory.","line":41,"pattern":"unwanted-behaviour","exclusion":true,"verdict":"verified","evidence":"","charter":["TEST-11"],"tags":["@TEST-11"],"scenarios":[{"title":"A directory holding only the types file opens and serves Tritanium","line":46,"tags":[]}],"source":"  @TEST-11\n  Rule: If a file the registry names is absent from the directory, then the SdeDataProvider shall not refuse to open the directory.\n    The registry lists every table the provider knows. A partial extract, or\n    a build from before CCP added a file, loads the tables it has; a lookup\n    in a missing table answers null or an empty list like any other miss.\n\n    Scenario: A directory holding only the types file opens and serves Tritanium\n      Given an SDE directory holding only the types file\n      When I open the SDE from the directory\n      And the user looks up type ID 34\n      Then the returned record shall be named \"Tritanium\"","sourceStart":40,"findings":[]},{"id":"0020-sde-loading#R4","title":"If the directory holds a YAML file the registry does not name, then the SdeDataProvider shall not read that file.","line":53,"pattern":"unwanted-behaviour","exclusion":true,"verdict":"verified","evidence":"","charter":["TEST-11"],"tags":["@TEST-11"],"scenarios":[{"title":"An unregistered file that is not YAML leaves the load unaffected","line":59,"tags":[]}],"source":"  @TEST-11\n  Rule: If the directory holds a YAML file the registry does not name, then the SdeDataProvider shall not read that file.\n    Loading walks the registry, not the directory, so a file CCP ships\n    before the registry learns of it is passed over rather than guessed at.\n    The scenario's extra file is not even valid YAML: reading it would fail\n    the load.\n\n    Scenario: An unregistered file that is not YAML leaves the load unaffected\n      Given an SDE directory holding the raw export files and an unregistered file that is not valid YAML\n      When I open the SDE from the directory\n      And the user looks up type ID 34\n      Then the returned record shall be named \"Tritanium\"","sourceStart":52,"findings":[]},{"id":"0020-sde-loading#R5","title":"When a record whose name is a locale map is loaded, the SdeDataProvider shall serve the record with the English text as its name.","line":67,"pattern":"event-driven","exclusion":false,"verdict":"verified","evidence":"","charter":[],"tags":[],"scenarios":[{"title":"The English name of type 34 is Tritanium","line":72,"tags":[]}],"source":"  Rule: When a record whose name is a locale map is loaded, the SdeDataProvider shall serve the record with the English text as its name.\n    CCP localises names as a map from language code to text. The provider\n    keeps English only, so a name is a plain string wherever a lookup\n    returns it.\n\n    Scenario: The English name of type 34 is Tritanium\n      Given an SDE directory holding the raw export files\n      When I open the SDE from the directory\n      And the user looks up type ID 34\n      Then the returned record shall be named \"Tritanium\"","sourceStart":67,"findings":[]},{"id":"0020-sde-loading#R6","title":"When a record whose field names carry CCP's ID suffix is loaded, the SdeDataProvider shall serve the record with those fields renamed to the Id suffix.","line":78,"pattern":"event-driven","exclusion":false,"verdict":"verified","evidence":"","charter":[],"tags":[],"scenarios":[{"title":"groupID becomes groupId on type 34","line":82,"tags":[]}],"source":"  Rule: When a record whose field names carry CCP's ID suffix is loaded, the SdeDataProvider shall serve the record with those fields renamed to the Id suffix.\n    CCP writes groupID and categoryID; the typed records read groupId and\n    categoryId. The rename happens at load, so no lookup sees both forms.\n\n    Scenario: groupID becomes groupId on type 34\n      Given an SDE directory holding the raw export files\n      When I open the SDE from the directory\n      And the user looks up type ID 34\n      Then the returned record shall carry group 18\n      And the returned record shall have no field \"groupID\"","sourceStart":78,"findings":[]},{"id":"0020-sde-loading#R7","title":"When records of a loaded table are looked up by a foreign key, the SdeDataProvider shall return every record whose key equals that value, on the first lookup and on every later one.","line":89,"pattern":"event-driven","exclusion":false,"verdict":"verified","evidence":"","charter":[],"tags":[],"scenarios":[{"title":"The types of group 18 are the same on the first and second lookup","line":93,"tags":[]}],"source":"  Rule: When records of a loaded table are looked up by a foreign key, the SdeDataProvider shall return every record whose key equals that value, on the first lookup and on every later one.\n    The provider builds the index for a foreign key the first time that key\n    is asked for, so the first answer and the later ones must agree.\n\n    Scenario: The types of group 18 are the same on the first and second lookup\n      Given an SDE directory holding the raw export files\n      When I open the SDE from the directory\n      And I look up types in group 18\n      Then the result should contain exactly 2 records\n      When I look up types in group 18\n      Then the result should contain exactly 2 records","sourceStart":89,"findings":[]},{"id":"0020-sde-loading#R8","title":"If an entry of a loaded file is null or is not a mapping, then the SdeDataProvider shall serve no record for that entry's ID.","line":101,"pattern":"unwanted-behaviour","exclusion":false,"verdict":"verified","evidence":"","charter":[],"tags":[],"scenarios":[{"title":"A null entry and a bare number in the types file are passed over","line":106,"tags":[]}],"source":"  Rule: If an entry of a loaded file is null or is not a mapping, then the SdeDataProvider shall serve no record for that entry's ID.\n    An entry written with no value (YAML null), or a bare value where a\n    record belongs, carries nothing a typed record could be built from.\n    Loading passes over it and keeps the entries around it.\n\n    Scenario: A null entry and a bare number in the types file are passed over\n      Given an SDE directory whose types file also holds a null entry and a number\n      When I open the SDE from the directory\n      And the user looks up type ID 37\n      Then the provider shall return null\n      When the user looks up type ID 36\n      Then the provider shall return null\n      When the user looks up type ID 34\n      Then the returned record shall be named \"Tritanium\"","sourceStart":101,"findings":[]},{"id":"0020-sde-loading#R9","title":"When a table whose IDs are strings is loaded, the SdeDataProvider shall key its records by the ID string and serve the whole table in ascending order of ID.","line":116,"pattern":"event-driven","exclusion":false,"verdict":"verified","evidence":"","charter":[],"tags":[],"scenarios":[{"title":"Languages listed ru, fr, zh, de, en are served in code order","line":121,"tags":[]}],"source":"  Rule: When a table whose IDs are strings is loaded, the SdeDataProvider shall key its records by the ID string and serve the whole table in ascending order of ID.\n    Translation languages, character titles and military campaigns are keyed\n    by codes, not numbers. The codes stay strings, and a whole-table read\n    sorts them, whatever order the file listed them in.\n\n    Scenario: Languages listed ru, fr, zh, de, en are served in code order\n      Given an SDE directory holding the raw export files, market groups and translation languages\n      When I open the SDE from the directory\n      And I look up every entity in table \"eve_translation_languages\"\n      Then the returned records shall have \"translationLanguageId\" values \"de, en, fr, ru, zh\" in that order","sourceStart":116,"findings":[]},{"id":"0020-sde-loading#R10","title":"When the user searches a loaded table by name, the SdeDataProvider shall return, in ascending order of ID and no more than the limit, the records whose English name contains the search text in any letter case.","line":129,"pattern":"event-driven","exclusion":false,"verdict":"verified","evidence":"","charter":[],"tags":[],"scenarios":[{"title":"An upper-case fragment finds Tritanium only","line":134,"tags":[]},{"title":"A fragment both minerals share returns both under the default limit","line":140,"tags":[]},{"title":"A limit of one returns the first match only","line":146,"tags":[]}],"source":"  Rule: When the user searches a loaded table by name, the SdeDataProvider shall return, in ascending order of ID and no more than the limit, the records whose English name contains the search text in any letter case.\n    The search compares lower case with lower case, so a caller need not\n    know how CCP capitalised a name. The default limit is 25; the provider\n    stops at the limit rather than reading the rest of the table.\n\n    Scenario: An upper-case fragment finds Tritanium only\n      Given an SDE directory holding the raw export files\n      When I open the SDE from the directory\n      And the user searches for types matching \"TRIT\"\n      Then the returned records shall have \"name\" values \"Tritanium\" in that order\n\n    Scenario: A fragment both minerals share returns both under the default limit\n      Given an SDE directory holding the raw export files\n      When I open the SDE from the directory\n      And the user searches for types matching \"rI\"\n      Then the returned records shall have \"name\" values \"Tritanium, Pyerite\" in that order\n\n    Scenario: A limit of one returns the first match only\n      Given an SDE directory holding the raw export files\n      When I open the SDE from the directory\n      And the user searches for types matching \"ri\" with a limit of 1\n      Then the returned records shall have \"name\" values \"Tritanium\" in that order","sourceStart":129,"findings":[]},{"id":"0020-sde-loading#R11","title":"When the user asks a loaded provider for the root market groups, the SdeDataProvider shall return the market groups that have no parent group.","line":152,"pattern":"event-driven","exclusion":false,"verdict":"verified","evidence":"","charter":[],"tags":[],"scenarios":[{"title":"Groups 2 and 4 are roots and group 9 under 4 is not","line":156,"tags":[]}],"source":"  Rule: When the user asks a loaded provider for the root market groups, the SdeDataProvider shall return the market groups that have no parent group.\n    The market browser starts from the groups with no parent; a group with\n    a parentGroupID sits under one of them and is not a root.\n\n    Scenario: Groups 2 and 4 are roots and group 9 under 4 is not\n      Given an SDE directory holding the raw export files, market groups and translation languages\n      When I open the SDE from the directory\n      And I look up root market groups\n      Then the returned records shall have \"marketGroupId\" values \"2, 4\" in that order","sourceStart":152,"findings":[]},{"id":"0020-sde-loading#R12","title":"When the SDE is opened from a ZIP archive, the SdeDataProvider shall serve the records and the version record that opening the directory the archive was made from serves.","line":164,"pattern":"event-driven","exclusion":false,"verdict":"verified","evidence":"","charter":[],"tags":[],"scenarios":[{"title":"The archive gives the same version and records as the directory","line":168,"tags":[]}],"source":"  Rule: When the SDE is opened from a ZIP archive, the SdeDataProvider shall serve the records and the version record that opening the directory the archive was made from serves.\n    The archive is what CCP publishes and the directory is what a consumer\n    extracts; both routes go through the same reshaping and metadata parse.\n\n    Scenario: The archive gives the same version and records as the directory\n      Given an SDE directory holding the raw export files\n      And a ZIP archive of that SDE directory\n      When I open the SDE from the ZIP archive\n      And the user queries the SDE version\n      Then the version shall be \"2026-09-15.1\" built on \"2026-09-15\" and imported at \"2026-09-28T12:00:00.000Z\"\n      When the user looks up type ID 34\n      Then the returned record shall be named \"Tritanium\"\n      And the returned record shall carry group 18","sourceStart":164,"findings":[]},{"id":"0020-sde-loading#R13","title":"If the directory or the archive path does not exist, then the SdeDataProvider shall throw an SdeError naming the path.","line":178,"pattern":"unwanted-behaviour","exclusion":false,"verdict":"verified","evidence":"","charter":[],"tags":[],"scenarios":[{"title":"A missing directory is refused","line":182,"tags":[]},{"title":"A missing archive is refused","line":188,"tags":[]}],"source":"  Rule: If the directory or the archive path does not exist, then the SdeDataProvider shall throw an SdeError naming the path.\n    A wrong path is the commonest set-up mistake and the error says which\n    path was tried, so it can be corrected without a debugger.\n\n    Scenario: A missing directory is refused\n      Given a path where no SDE directory or archive exists\n      When I open the SDE from the directory\n      Then the call shall fail with an SDE error naming \"SDE directory not found\"\n      And the error shall name the attempted path\n\n    Scenario: A missing archive is refused\n      Given a path where no SDE directory or archive exists\n      When I open the SDE from the ZIP archive\n      Then the call shall fail with an SDE error naming \"SDE ZIP file not found\"\n      And the error shall name the attempted path","sourceStart":178,"findings":[]},{"id":"0020-sde-loading#R14","title":"When a provider is closed, the SDE provider shall answer every later lookup with null or an empty list.","line":196,"pattern":"event-driven","exclusion":false,"verdict":"verified","evidence":"","charter":[],"tags":[],"scenarios":[{"title":"A closed in-memory provider answers null and empty","line":201,"tags":[]},{"title":"A closed file-backed provider answers null","line":209,"tags":[]},{"title":"A closed file-backed provider forgets the foreign-key lookups it answered","line":216,"tags":[]}],"source":"  Rule: When a provider is closed, the SDE provider shall answer every later lookup with null or an empty list.\n    Closing releases the loaded tables. A lookup after close is a\n    programming error the provider answers as an empty data set rather\n    than by throwing, for both providers.\n\n    Scenario: A closed in-memory provider answers null and empty\n      Given a static data provider with the reference data set\n      When I close the provider\n      And the user looks up type ID 34\n      Then the provider shall return null\n      When I look up every faction\n      Then the provider shall return an empty list\n\n    Scenario: A closed file-backed provider answers null\n      Given an SDE directory holding the raw export files\n      When I open the SDE from the directory\n      And I close the provider\n      And the user looks up type ID 34\n      Then the provider shall return null\n\n    Scenario: A closed file-backed provider forgets the foreign-key lookups it answered\n      Given an SDE directory holding the raw export files\n      When I open the SDE from the directory\n      And I look up types in group 18\n      Then the result should contain exactly 2 records\n      When I close the provider\n      And I look up types in group 18\n      Then the provider shall return an empty list","sourceStart":196,"findings":[]}],"noUnwantedBehaviour":false,"orphanScenarios":0},{"file":"tests/bdd/features/sde/0021-sde-optional-peers.feature","area":"sde","name":"Optional Peer Dependencies","tags":[],"charter":["TEST-11"],"description":"Reading CCP's export needs js-yaml for the YAML files and adm-zip for the archive. Both are optional peer dependencies of the package: an install that only ever uses MemorySdeProvider need not carry them, so the ./sde entry point loads them on first use, not at import time. When one is missing, the failure must say which package and how to install it.\n\nThe scenarios make a peer unresolvable the way an install without it behaves and open the export anyway.","boundBy":["tests/bdd/specs/sde/0021-sde-optional-peers.spec.ts"],"rules":[{"id":"0021-sde-optional-peers#R1","title":"If js-yaml is not installed when the SDE is opened from a directory, then the SdeDataProvider shall throw an SdeError naming the package, what it is needed for, and the command that installs it.","line":13,"pattern":"unwanted-behaviour","exclusion":false,"verdict":"verified","evidence":"","charter":[],"tags":[],"scenarios":[{"title":"Opening a directory without js-yaml names the install command","line":18,"tags":[]},{"title":"js-yaml missing under ES module resolution names the install command","line":25,"tags":[]}],"source":"  Rule: If js-yaml is not installed when the SDE is opened from a directory, then the SdeDataProvider shall throw an SdeError naming the package, what it is needed for, and the command that installs it.\n    The directory route parses YAML before it touches an archive, so\n    js-yaml is the peer it fails on. The message carries the install\n    command so the fix is one paste away.\n\n    Scenario: Opening a directory without js-yaml names the install command\n      Given an SDE directory holding the raw export files\n      And the js-yaml package is not installed\n      When I open the SDE from the directory\n      Then the call shall fail with an SDE error naming \"js-yaml is required to parse SDE YAML files\"\n      And the call shall fail with an SDE error naming \"npm install js-yaml\"\n\n    Scenario: js-yaml missing under ES module resolution names the install command\n      Given an SDE directory holding the raw export files\n      And the js-yaml package fails to load with the \"missing as an ES module\" failure\n      When I open the SDE from the directory\n      Then the call shall fail with an SDE error naming \"js-yaml is required to parse SDE YAML files\"\n      And the call shall fail with an SDE error naming \"npm install js-yaml\"","sourceStart":13,"findings":[]},{"id":"0021-sde-optional-peers#R2","title":"If adm-zip is not installed when the SDE is opened from a ZIP archive, then the SdeDataProvider shall throw an SdeError naming the package, what it is needed for, and the command that installs it.","line":32,"pattern":"unwanted-behaviour","exclusion":false,"verdict":"verified","evidence":"","charter":[],"tags":[],"scenarios":[{"title":"Opening an archive without adm-zip names the install command","line":36,"tags":[]}],"source":"  Rule: If adm-zip is not installed when the SDE is opened from a ZIP archive, then the SdeDataProvider shall throw an SdeError naming the package, what it is needed for, and the command that installs it.\n    The archive route opens the ZIP before it parses anything, so adm-zip is\n    the peer it fails on.\n\n    Scenario: Opening an archive without adm-zip names the install command\n      Given an SDE directory holding the raw export files\n      And a ZIP archive of that SDE directory\n      And the adm-zip package is not installed\n      When I open the SDE from the ZIP archive\n      Then the call shall fail with an SDE error naming \"adm-zip is required to read SDE ZIP archives\"\n      And the call shall fail with an SDE error naming \"npm install adm-zip\"","sourceStart":32,"findings":[]},{"id":"0021-sde-optional-peers#R3","title":"If an installed optional peer fails while it loads, then the SdeDataProvider shall rethrow what the peer threw, unchanged.","line":46,"pattern":"unwanted-behaviour","exclusion":false,"verdict":"verified","evidence":"","charter":[],"tags":[],"scenarios":[{"title":"js-yaml that cannot find a module of its own fails with that error","line":51,"tags":[]},{"title":"An error that names js-yaml without a missing-module code is rethrown","line":57,"tags":[]},{"title":"A string js-yaml throws is rethrown","line":63,"tags":[]}],"source":"  Rule: If an installed optional peer fails while it loads, then the SdeDataProvider shall rethrow what the peer threw, unchanged.\n    Only the peer's own absence gets the install message. A peer that is\n    present but broken, or that cannot find a module of its own, needs a\n    different fix, and the original failure is what names it.\n\n    Scenario: js-yaml that cannot find a module of its own fails with that error\n      Given an SDE directory holding the raw export files\n      And the js-yaml package fails to load with the \"missing a module of its own\" failure\n      When I open the SDE from the directory\n      Then the call shall fail with what the peer threw\n\n    Scenario: An error that names js-yaml without a missing-module code is rethrown\n      Given an SDE directory holding the raw export files\n      And the js-yaml package fails to load with the \"an error naming it\" failure\n      When I open the SDE from the directory\n      Then the call shall fail with what the peer threw\n\n    Scenario: A string js-yaml throws is rethrown\n      Given an SDE directory holding the raw export files\n      And the js-yaml package fails to load with the \"a thrown string\" failure\n      When I open the SDE from the directory\n      Then the call shall fail with what the peer threw","sourceStart":46,"findings":[]},{"id":"0021-sde-optional-peers#R4","title":"If neither js-yaml nor adm-zip is installed, then the ./sde entry point shall not require either package to load or to serve a MemorySdeProvider.","line":72,"pattern":"unwanted-behaviour","exclusion":true,"verdict":"verified","evidence":"","charter":["TEST-11"],"tags":["@TEST-11"],"scenarios":[{"title":"A memory provider is built and queried with both peers missing","line":77,"tags":[]}],"source":"  @TEST-11\n  Rule: If neither js-yaml nor adm-zip is installed, then the ./sde entry point shall not require either package to load or to serve a MemorySdeProvider.\n    The peers are loaded on the first read of a YAML file or an archive,\n    never at import. An application that builds its provider from records it\n    already holds, as tests and browser bundles do, installs neither.\n\n    Scenario: A memory provider is built and queried with both peers missing\n      Given the js-yaml package is not installed\n      And the adm-zip package is not installed\n      When a MemorySdeProvider holding Tritanium is built from a fresh load of the SDE entry point\n      And the user looks up type ID 34\n      Then the returned record shall be named \"Tritanium\"","sourceStart":71,"findings":[]}],"noUnwantedBehaviour":false,"orphanScenarios":0},{"file":"tests/bdd/features/sde/0022-sde-memory-entry.feature","area":"sde","name":"The Memory Entry Point","tags":["@ARCH-10"],"charter":["ARCH-10"],"description":"The package exposes the SDE twice: ./sde carries everything, including the file-backed SdeDataProvider and, through it, the optional peers; ./sde/memory carries the in-memory provider and the same types, errors and test factory without reaching any file, YAML or ZIP code, for consumers who bring their own data. The two must stay in step: everything ./sde exports at run time is available from ./sde/memory, except the file-backed provider.\n\nThe scenarios compare the two modules' runtime exports.","boundBy":["tests/bdd/specs/sde/0022-sde-memory-entry.spec.ts"],"rules":[{"id":"0022-sde-memory-entry#R1","title":"The ./sde/memory entry point shall export every runtime export of ./sde except SdeDataProvider.","line":14,"pattern":"ubiquitous","exclusion":false,"verdict":"verified","evidence":"","charter":[],"tags":[],"scenarios":[{"title":"No export of ./sde other than SdeDataProvider is missing","line":19,"tags":[]}],"source":"  Rule: The ./sde/memory entry point shall export every runtime export of ./sde except SdeDataProvider.\n    A consumer switching from ./sde to ./sde/memory should change one\n    import path and nothing else: the errors, guards, in-memory provider\n    and test factory are all there.\n\n    Scenario: No export of ./sde other than SdeDataProvider is missing\n      When the runtime exports of the two SDE entry points are compared\n      Then no export of the full SDE entry point other than SdeDataProvider shall be missing from the memory entry point","sourceStart":14,"findings":[]},{"id":"0022-sde-memory-entry#R2","title":"The ./sde/memory entry point shall not export SdeDataProvider.","line":23,"pattern":"ubiquitous","exclusion":false,"verdict":"verified","evidence":"","charter":[],"tags":[],"scenarios":[{"title":"SdeDataProvider is absent from the memory entry point","line":27,"tags":[]}],"source":"  Rule: The ./sde/memory entry point shall not export SdeDataProvider.\n    The file-backed provider is what pulls the peers in; exporting it from\n    the memory entry point would defeat the split.\n\n    Scenario: SdeDataProvider is absent from the memory entry point\n      When the runtime exports of the two SDE entry points are compared\n      Then the memory entry point shall not export SdeDataProvider","sourceStart":23,"findings":[]}],"noUnwantedBehaviour":true,"orphanScenarios":0},{"file":"tests/bdd/features/sde/0023-sde-ingestion.feature","area":"sde","name":"SDE Ingestion","tags":["@ARCH-12"],"charter":["ARCH-12","ARCH-13"],"description":"The ingestion pipeline turns CCP's published export into what the provider loads: the downloader finds the latest build and fetches the archive, the extractor reads the archive's metadata and files, and the transforms reshape each record on the way — English text out of a locale map, Id in place of CCP's ID suffix, the build out of a nested metadata block.\n\nNothing here reaches the network: the downloader's fetch is answered at the transport seam, and the files live in a temporary directory.","boundBy":["tests/bdd/specs/sde/0023-sde-ingestion.spec.ts"],"rules":[{"id":"0023-sde-ingestion#R1","title":"When the latest build is requested, the SdeDownloader shall return the build number and release date on the last line of the latest-build feed.","line":14,"pattern":"event-driven","exclusion":false,"verdict":"verified","evidence":"","charter":[],"tags":[],"scenarios":[{"title":"The newest line of the feed is the latest build","line":18,"tags":[]},{"title":"A line of spaces after the newest build is passed over","line":24,"tags":[]}],"source":"  Rule: When the latest build is requested, the SdeDownloader shall return the build number and release date on the last line of the latest-build feed.\n    CCP's feed is JSON lines, one per published build, newest last. The\n    last line is the current build.\n\n    Scenario: The newest line of the feed is the latest build\n      Given the latest-build feed lists build \"2026-09-08.1\" then build \"2026-09-15.1\" released \"2026-09-15\"\n      When I ask the downloader for the latest build\n      Then the build number shall be \"2026-09-15.1\"\n      And the release date shall be \"2026-09-15\"\n\n    Scenario: A line of spaces after the newest build is passed over\n      Given the latest-build feed lists build \"2026-09-15.1\" released \"2026-09-15\" then a line of spaces\n      When I ask the downloader for the latest build\n      Then the build number shall be \"2026-09-15.1\"","sourceStart":14,"findings":[]},{"id":"0023-sde-ingestion#R2","title":"If the latest-build feed holds no line with text on it, then the SdeDownloader shall throw an SdeError saying the response held no data.","line":30,"pattern":"unwanted-behaviour","exclusion":false,"verdict":"verified","evidence":"","charter":["ARCH-13"],"tags":["@ARCH-13"],"scenarios":[{"title":"A feed of blank lines is an SDE error","line":34,"tags":[]}],"source":"  @ARCH-13\n  Rule: If the latest-build feed holds no line with text on it, then the SdeDownloader shall throw an SdeError saying the response held no data.\n    An empty feed names no build at all. Reading it as one would hand a\n    caller a build number of \"undefined\" to compare against.\n\n    Scenario: A feed of blank lines is an SDE error\n      Given the latest-build feed holds only blank lines\n      When I ask the downloader for the latest build\n      Then the call shall fail with an SDE error naming \"SDE build info response contained no data\"","sourceStart":29,"findings":[]},{"id":"0023-sde-ingestion#R3","title":"If the latest-build feed answers with an HTTP error status, then the SdeDownloader shall throw an SdeError naming the status.","line":40,"pattern":"unwanted-behaviour","exclusion":false,"verdict":"verified","evidence":"","charter":["ARCH-13"],"tags":["@ARCH-13"],"scenarios":[{"title":"A 503 from the feed is an SDE error","line":44,"tags":[]}],"source":"  @ARCH-13\n  Rule: If the latest-build feed answers with an HTTP error status, then the SdeDownloader shall throw an SdeError naming the status.\n    A feed outage must not read as \"no new build\"; the error names the\n    status so an operator can tell a CCP outage from a bug.\n\n    Scenario: A 503 from the feed is an SDE error\n      Given the latest-build feed answers with HTTP 503\n      When I ask the downloader for the latest build\n      Then the call shall fail with an SDE error naming \"HTTP 503\"","sourceStart":39,"findings":[]},{"id":"0023-sde-ingestion#R4","title":"When the archive is downloaded, the SdeDownloader shall write every byte of the response to the output path and report progress up to the content length.","line":49,"pattern":"event-driven","exclusion":false,"verdict":"verified","evidence":"","charter":[],"tags":[],"scenarios":[{"title":"A 4096-byte archive lands on disk with progress reported","line":53,"tags":[]}],"source":"  Rule: When the archive is downloaded, the SdeDownloader shall write every byte of the response to the output path and report progress up to the content length.\n    The archive is hundreds of megabytes, so it is streamed to disk and the\n    caller can show progress against the content length.\n\n    Scenario: A 4096-byte archive lands on disk with progress reported\n      Given the archive download serves 4096 bytes\n      When I download the archive to a temporary file\n      Then the downloaded file shall hold 4096 bytes\n      And the downloaded file shall hold the bytes that were served\n      And the last progress report shall be 4096 of 4096 bytes","sourceStart":49,"findings":[]},{"id":"0023-sde-ingestion#R5","title":"If the archive download answers with an HTTP error status, then the SdeDownloader shall throw an SdeError naming the status.","line":61,"pattern":"unwanted-behaviour","exclusion":false,"verdict":"verified","evidence":"","charter":["ARCH-13"],"tags":["@ARCH-13"],"scenarios":[{"title":"A 404 from the download is an SDE error","line":65,"tags":[]}],"source":"  @ARCH-13\n  Rule: If the archive download answers with an HTTP error status, then the SdeDownloader shall throw an SdeError naming the status.\n    A failed download leaves no partial archive behind that a later step\n    might try to read; the error names the status.\n\n    Scenario: A 404 from the download is an SDE error\n      Given the archive download answers with HTTP 404\n      When I download the archive to a temporary file\n      Then the call shall fail with an SDE error naming \"HTTP 404\"","sourceStart":60,"findings":[]},{"id":"0023-sde-ingestion#R6","title":"If the archive download answers with no body, then the SdeDownloader shall throw an SdeError saying the response body is empty.","line":71,"pattern":"unwanted-behaviour","exclusion":false,"verdict":"verified","evidence":"","charter":["ARCH-13"],"tags":["@ARCH-13"],"scenarios":[{"title":"A 204 from the download is an SDE error","line":75,"tags":[]}],"source":"  @ARCH-13\n  Rule: If the archive download answers with no body, then the SdeDownloader shall throw an SdeError saying the response body is empty.\n    A success status with nothing to stream would otherwise leave an empty\n    file where the archive should be.\n\n    Scenario: A 204 from the download is an SDE error\n      Given the archive download answers with HTTP 204\n      When I download the archive to a temporary file\n      Then the call shall fail with an SDE error naming \"response body is empty\"","sourceStart":70,"findings":[]},{"id":"0023-sde-ingestion#R7","title":"While the archive download carries no content length, the SdeDownloader shall make no progress report.","line":80,"pattern":"state-driven","exclusion":false,"verdict":"verified","evidence":"","charter":[],"tags":[],"scenarios":[{"title":"A download with no content length reports no progress","line":84,"tags":[]}],"source":"  Rule: While the archive download carries no content length, the SdeDownloader shall make no progress report.\n    Progress is a share of a known total. Without one there is nothing to\n    report against, so the download goes ahead silently.\n\n    Scenario: A download with no content length reports no progress\n      Given the archive download serves 4096 bytes with no content length\n      When I download the archive to a temporary file\n      Then the downloaded file shall hold 4096 bytes\n      And no progress report shall have been made","sourceStart":80,"findings":[]},{"id":"0023-sde-ingestion#R8","title":"If the caller aborts the archive download, then the SdeDownloader shall throw an SdeError naming the abort.","line":91,"pattern":"unwanted-behaviour","exclusion":false,"verdict":"verified","evidence":"","charter":["ARCH-13"],"tags":["@ARCH-13"],"scenarios":[{"title":"Aborting while the response is delayed fails the download","line":95,"tags":[]}],"source":"  @ARCH-13\n  Rule: If the caller aborts the archive download, then the SdeDownloader shall throw an SdeError naming the abort.\n    The archive is large, so a caller passes an AbortSignal to give up on a\n    slow download. The signal reaches the request itself.\n\n    Scenario: Aborting while the response is delayed fails the download\n      Given the archive download serves 4096 bytes after 1000 ms\n      When I download the archive and abort it after 20 ms\n      Then the call shall fail with an SDE error naming \"This operation was aborted\"","sourceStart":90,"findings":[]},{"id":"0023-sde-ingestion#R9","title":"If the archive cannot be written to the output path, then the SdeDownloader shall throw an SdeError naming the write failure.","line":101,"pattern":"unwanted-behaviour","exclusion":false,"verdict":"verified","evidence":"","charter":["ARCH-13"],"tags":["@ARCH-13"],"scenarios":[{"title":"A download into a missing directory is an SDE error","line":105,"tags":[]}],"source":"  @ARCH-13\n  Rule: If the archive cannot be written to the output path, then the SdeDownloader shall throw an SdeError naming the write failure.\n    A missing or read-only directory is found only when the first byte is\n    written. The error says it was the write that failed, not the download.\n\n    Scenario: A download into a missing directory is an SDE error\n      Given the archive download serves 4096 bytes\n      When I download the archive into a directory that does not exist\n      Then the call shall fail with an SDE error naming \"Failed to write SDE file\"","sourceStart":100,"findings":[]},{"id":"0023-sde-ingestion#R10","title":"If the caller sets a byte limit that is not a finite, non-negative number, then the SdeDownloader shall throw an SdeError naming the limit and send no request.","line":111,"pattern":"unwanted-behaviour","exclusion":false,"verdict":"verified","evidence":"","charter":["ARCH-13"],"tags":["@ARCH-13"],"scenarios":[{"title":"A byte limit of -1 is refused before the download","line":116,"tags":[]},{"title":"A byte limit of NaN is refused before the download","line":116,"tags":[]},{"title":"A byte limit of Infinity is refused before the download","line":116,"tags":[]}],"source":"  @ARCH-13\n  Rule: If the caller sets a byte limit that is not a finite, non-negative number, then the SdeDownloader shall throw an SdeError naming the limit and send no request.\n    The limit bounds how much of a remote archive is written to disk. A\n    limit of NaN or Infinity would bound nothing, so it is refused before\n    the download starts rather than read as no limit.\n\n    Scenario Outline: A byte limit of \u003climit> is refused before the download\n      When I download the archive with a byte limit of \"\u003climit>\"\n      Then the call shall fail with an SDE error naming \"maxBytes must be a finite, non-negative number, not \u003climit>\"\n      And no request shall have been sent\n\n      Examples:\n        | limit    |\n        | -1       |\n        | NaN      |\n        | Infinity |","sourceStart":110,"findings":[]},{"id":"0023-sde-ingestion#R11","title":"If the archive's content length is over the byte limit, then the SdeDownloader shall throw an SdeError naming the size and the limit.","line":128,"pattern":"unwanted-behaviour","exclusion":false,"verdict":"verified","evidence":"","charter":["ARCH-13"],"tags":["@ARCH-13"],"scenarios":[{"title":"A 4096-byte archive is refused under a 4095-byte limit","line":132,"tags":[]},{"title":"A limit of zero bytes refuses any archive with content","line":138,"tags":[]}],"source":"  @ARCH-13\n  Rule: If the archive's content length is over the byte limit, then the SdeDownloader shall throw an SdeError naming the size and the limit.\n    The default limit is 2 GiB. An export that declares itself larger is\n    refused before a byte is written.\n\n    Scenario: A 4096-byte archive is refused under a 4095-byte limit\n      Given the archive download serves 4096 bytes\n      When I download the archive with a byte limit of \"4095\"\n      Then the call shall fail with an SDE error naming \"the export is 4096 bytes, over the 4095-byte limit\"\n      And no file shall remain at the download path\n\n    Scenario: A limit of zero bytes refuses any archive with content\n      Given the archive download serves 4096 bytes\n      When I download the archive with a byte limit of \"0\"\n      Then the call shall fail with an SDE error naming \"the export is 4096 bytes, over the 0-byte limit\"\n      And no file shall remain at the download path","sourceStart":127,"findings":[]},{"id":"0023-sde-ingestion#R12","title":"If an archive with no content length passes the byte limit while it streams, then the SdeDownloader shall throw an SdeError naming the limit.","line":145,"pattern":"unwanted-behaviour","exclusion":false,"verdict":"verified","evidence":"","charter":["ARCH-13"],"tags":["@ARCH-13"],"scenarios":[{"title":"An archive of unknown length is stopped at a 4095-byte limit","line":149,"tags":[]}],"source":"  @ARCH-13\n  Rule: If an archive with no content length passes the byte limit while it streams, then the SdeDownloader shall throw an SdeError naming the limit.\n    A response can leave out its length, or state a false one. The bytes\n    are counted as they arrive, so the limit holds either way.\n\n    Scenario: An archive of unknown length is stopped at a 4095-byte limit\n      Given the archive download serves 4096 bytes with no content length\n      When I download the archive with a byte limit of \"4095\"\n      Then the call shall fail with an SDE error naming \"the download passed the 4095-byte limit before it ended\"\n      And no file shall remain at the download path","sourceStart":144,"findings":[]},{"id":"0023-sde-ingestion#R13","title":"When the archive is no larger than the byte limit, the SdeDownloader shall write all of it.","line":155,"pattern":"event-driven","exclusion":false,"verdict":"verified","evidence":"","charter":[],"tags":[],"scenarios":[{"title":"A 4096-byte archive is written under a 4096-byte limit","line":158,"tags":[]},{"title":"A 4096-byte archive of unknown length is written under a 4096-byte limit","line":163,"tags":[]}],"source":"  Rule: When the archive is no larger than the byte limit, the SdeDownloader shall write all of it.\n    The limit is the largest archive allowed, not the first size refused.\n\n    Scenario: A 4096-byte archive is written under a 4096-byte limit\n      Given the archive download serves 4096 bytes\n      When I download the archive with a byte limit of \"4096\"\n      Then the downloaded file shall hold 4096 bytes\n\n    Scenario: A 4096-byte archive of unknown length is written under a 4096-byte limit\n      Given the archive download serves 4096 bytes with no content length\n      When I download the archive with a byte limit of \"4096\"\n      Then the downloaded file shall hold 4096 bytes","sourceStart":155,"findings":[]},{"id":"0023-sde-ingestion#R14","title":"When an archive's metadata is read, the SdeExtractor shall return the build number and release date from the _sde.yaml inside it.","line":170,"pattern":"event-driven","exclusion":false,"verdict":"verified","evidence":"","charter":[],"tags":[],"scenarios":[{"title":"The archive's _sde.yaml gives the build","line":174,"tags":[]}],"source":"  Rule: When an archive's metadata is read, the SdeExtractor shall return the build number and release date from the _sde.yaml inside it.\n    The build is what a cache key and a version record are made of, so it\n    is read before any table is parsed.\n\n    Scenario: The archive's _sde.yaml gives the build\n      Given an SDE directory holding the raw export files\n      And a ZIP archive of that SDE directory\n      When I read the archive metadata\n      Then the build number shall be \"2026-09-15.1\"\n      And the release date shall be \"2026-09-15\"","sourceStart":170,"findings":[]},{"id":"0023-sde-ingestion#R15","title":"If an archive holds no _sde.yaml, then the SdeExtractor shall throw an SdeError naming the file.","line":182,"pattern":"unwanted-behaviour","exclusion":false,"verdict":"verified","evidence":"","charter":["ARCH-13"],"tags":["@ARCH-13"],"scenarios":[{"title":"An archive without metadata is refused","line":186,"tags":[]}],"source":"  @ARCH-13\n  Rule: If an archive holds no _sde.yaml, then the SdeExtractor shall throw an SdeError naming the file.\n    An archive without metadata is not CCP's export; refusing it early\n    beats loading tables with no build to attribute them to.\n\n    Scenario: An archive without metadata is refused\n      Given an SDE directory holding the raw export files without _sde.yaml\n      And a ZIP archive of that SDE directory\n      When I read the archive metadata\n      Then the call shall fail with an SDE error naming \"_sde.yaml\"","sourceStart":181,"findings":[]},{"id":"0023-sde-ingestion#R16","title":"When an archive's files are listed, the SdeExtractor shall return the name of every YAML entry in it.","line":192,"pattern":"event-driven","exclusion":false,"verdict":"verified","evidence":"","charter":[],"tags":[],"scenarios":[{"title":"Every YAML file in the archive is listed","line":196,"tags":[]},{"title":"A folder entry and a text file are left out of the listing","line":202,"tags":[]}],"source":"  Rule: When an archive's files are listed, the SdeExtractor shall return the name of every YAML entry in it.\n    The listing is what a drift check compares against the file registry,\n    so it must name every YAML file and nothing else.\n\n    Scenario: Every YAML file in the archive is listed\n      Given an SDE directory holding the raw export files\n      And a ZIP archive of that SDE directory\n      When I list the YAML files in the archive\n      Then the listed files shall be \"_sde.yaml, groups.yaml, types.yaml\"\n\n    Scenario: A folder entry and a text file are left out of the listing\n      Given an SDE directory holding the raw export files\n      And a ZIP archive of that SDE directory inside a folder, with a text file beside it\n      When I list the YAML files in the archive\n      Then the listed files shall be \"sde/_sde.yaml, sde/groups.yaml, sde/types.yaml\"","sourceStart":192,"findings":[]},{"id":"0023-sde-ingestion#R17","title":"When named files are parsed from an archive, the SdeExtractor shall return one parsed file per name the archive holds, its records keyed by ID, and skip a name the archive lacks.","line":208,"pattern":"event-driven","exclusion":false,"verdict":"verified","evidence":"","charter":[],"tags":[],"scenarios":[{"title":"Present files are parsed and an absent one is skipped","line":212,"tags":[]},{"title":"A file inside a folder of the archive is found by its name","line":219,"tags":[]}],"source":"  Rule: When named files are parsed from an archive, the SdeExtractor shall return one parsed file per name the archive holds, its records keyed by ID, and skip a name the archive lacks.\n    A build may lack a table the registry knows; parsing skips it so the\n    rest of the export still loads.\n\n    Scenario: Present files are parsed and an absent one is skipped\n      Given an SDE directory holding the raw export files\n      And a ZIP archive of that SDE directory\n      When I parse \"types.yaml, blueprints.yaml, groups.yaml\" from the archive\n      Then the parsed files shall be \"types.yaml, groups.yaml\"\n      And the parsed file \"types.yaml\" shall hold 2 records\n\n    Scenario: A file inside a folder of the archive is found by its name\n      Given an SDE directory holding the raw export files\n      And a ZIP archive of that SDE directory inside a folder, with a text file beside it\n      When I parse \"types.yaml\" from the archive\n      Then the parsed files shall be \"types.yaml\"\n      And the parsed file \"types.yaml\" shall hold 2 records","sourceStart":208,"findings":[]},{"id":"0023-sde-ingestion#R18","title":"When an archive is extracted to a directory, the SdeExtractor shall write every entry of the archive there, replacing a file of the same name.","line":226,"pattern":"event-driven","exclusion":false,"verdict":"verified","evidence":"","charter":[],"tags":[],"scenarios":[{"title":"An older types file is replaced by the archive's","line":230,"tags":[]}],"source":"  Rule: When an archive is extracted to a directory, the SdeExtractor shall write every entry of the archive there, replacing a file of the same name.\n    A consumer that keeps an extracted export refreshes it in place. An\n    older copy of a file must not survive the extraction of a newer one.\n\n    Scenario: An older types file is replaced by the archive's\n      Given an SDE directory holding the raw export files\n      And a ZIP archive of that SDE directory\n      And an extraction directory already holding \"types.yaml\" reading \"stale\"\n      When I extract the archive to that directory\n      Then the extracted \"types.yaml\" shall hold the bytes of the SDE directory's copy\n      And the extracted \"groups.yaml\" shall hold the bytes of the SDE directory's copy","sourceStart":226,"findings":[]},{"id":"0023-sde-ingestion#R19","title":"When an archive whose every entry lands inside the directory is extracted, the SdeExtractor shall write each of its files there.","line":238,"pattern":"event-driven","exclusion":false,"verdict":"verified","evidence":"","charter":[],"tags":[],"scenarios":[{"title":"An archive with its files in a folder is extracted with the folder","line":243,"tags":[]},{"title":"A name with a colon after its first character is extracted","line":250,"tags":[]}],"source":"  Rule: When an archive whose every entry lands inside the directory is extracted, the SdeExtractor shall write each of its files there.\n    The check that refuses an escaping name must not refuse a safe one: a\n    folder entry ends in a slash, and a colon past the first character is\n    an ordinary character in a Linux or macOS file name, not a drive letter.\n\n    Scenario: An archive with its files in a folder is extracted with the folder\n      Given an SDE directory holding the raw export files\n      And a ZIP archive of that SDE directory inside a folder, with a text file beside it\n      And an empty extraction directory\n      When I extract the archive to that directory\n      Then the extraction directory shall hold \"README.txt, sde/_sde.yaml, sde/groups.yaml, sde/types.yaml\"\n\n    Scenario: A name with a colon after its first character is extracted\n      Given a ZIP archive holding only the entries \"notes/C:types.yaml, types.yaml\"\n      And an empty extraction directory\n      When I extract the archive to that directory\n      Then the extraction directory shall hold \"notes/C:types.yaml, types.yaml\"","sourceStart":238,"findings":[]},{"id":"0023-sde-ingestion#R20","title":"If an archive is refused for entries that would land outside the directory, then the SdeExtractor shall name the count of those entries and the first of them.","line":257,"pattern":"unwanted-behaviour","exclusion":false,"verdict":"verified","evidence":"","charter":["ARCH-13"],"tags":["@ARCH-13"],"scenarios":[{"title":"One escaping entry is counted as one entry","line":261,"tags":[]},{"title":"Two escaping entries are counted as two entries","line":268,"tags":[]}],"source":"  @ARCH-13\n  Rule: If an archive is refused for entries that would land outside the directory, then the SdeExtractor shall name the count of those entries and the first of them.\n    One crafted name is enough to refuse the archive. The count tells an\n    operator whether it was a single bad entry or a pattern.\n\n    Scenario: One escaping entry is counted as one entry\n      Given a ZIP archive holding an entry named \"../escaped.yaml\" beside \"types.yaml\"\n      And an empty extraction directory beside that archive\n      When I try to extract the archive to that directory\n      Then the extraction shall be refused with an SdeError saying \"1 entry would land outside\"\n      And the extraction shall be refused with an SdeError saying \"../escaped.yaml\"\n\n    Scenario: Two escaping entries are counted as two entries\n      Given a ZIP archive holding entries named \"../escaped.yaml\" and \"../climbed.yaml\" beside \"types.yaml\"\n      And an empty extraction directory beside that archive\n      When I try to extract the archive to that directory\n      Then the extraction shall be refused with an SdeError saying \"2 entries would land outside\"\n      And the extraction shall be refused with an SdeError saying '(first: \"../escaped.yaml\")'","sourceStart":256,"findings":[]},{"id":"0023-sde-ingestion#R21","title":"When a field name is normalised, the SDE field-name transform shall replace an ID that ends the name or precedes a capital letter with Id, and leave every other name unchanged.","line":277,"pattern":"event-driven","exclusion":false,"verdict":"verified","evidence":"","charter":[],"tags":[],"scenarios":[{"title":"A trailing ID is renamed","line":281,"tags":[]},{"title":"An ID before a capital letter is renamed","line":285,"tags":[]},{"title":"A name already in Id form is unchanged","line":289,"tags":[]}],"source":"  Rule: When a field name is normalised, the SDE field-name transform shall replace an ID that ends the name or precedes a capital letter with Id, and leave every other name unchanged.\n    CCP's YAML writes groupID and blueprintTypeID; the typed records use\n    the Id suffix throughout.\n\n    Scenario: A trailing ID is renamed\n      When the field name \"groupID\" is normalised\n      Then the result shall be \"groupId\"\n\n    Scenario: An ID before a capital letter is renamed\n      When the field name \"typeIDList\" is normalised\n      Then the result shall be \"typeIdList\"\n\n    Scenario: A name already in Id form is unchanged\n      When the field name \"iconId\" is normalised\n      Then the result shall be \"iconId\"","sourceStart":277,"findings":[]},{"id":"0023-sde-ingestion#R22","title":"When English text is extracted from a field, the SDE locale transform shall return the en entry of a locale map, a plain string unchanged, and the fallback for a field that is neither.","line":293,"pattern":"event-driven","exclusion":false,"verdict":"verified","evidence":"","charter":[],"tags":[],"scenarios":[{"title":"The en entry of a locale map is returned","line":297,"tags":[]},{"title":"A plain string is returned unchanged","line":301,"tags":[]},{"title":"An empty field gives the fallback","line":305,"tags":[]}],"source":"  Rule: When English text is extracted from a field, the SDE locale transform shall return the en entry of a locale map, a plain string unchanged, and the fallback for a field that is neither.\n    Names are localised maps in most files and plain strings in a few; a\n    caller gets a string either way, and the fallback for a missing field.\n\n    Scenario: The en entry of a locale map is returned\n      When the English text is extracted from a field localised as en \"Tritanium\" and de \"Tritanium-de\"\n      Then the result shall be \"Tritanium\"\n\n    Scenario: A plain string is returned unchanged\n      When the English text is extracted from the plain string \"Pyerite\"\n      Then the result shall be \"Pyerite\"\n\n    Scenario: An empty field gives the fallback\n      When the English text is extracted from an empty field with fallback \"n/a\"\n      Then the result shall be \"n/a\"","sourceStart":293,"findings":[]},{"id":"0023-sde-ingestion#R23","title":"When _sde.yaml text is parsed, the SDE metadata parser shall read the build number and release date from the sde block when one is present, and from the top level otherwise.","line":309,"pattern":"event-driven","exclusion":false,"verdict":"verified","evidence":"","charter":[],"tags":[],"scenarios":[{"title":"The nested block wins over the top level","line":313,"tags":[]},{"title":"A top-level build is read when no block is present","line":317,"tags":[]}],"source":"  Rule: When _sde.yaml text is parsed, the SDE metadata parser shall read the build number and release date from the sde block when one is present, and from the top level otherwise.\n    CCP nests the fields under sde; older hand-written files put them at\n    the top level. The nested block wins when both are present.\n\n    Scenario: The nested block wins over the top level\n      When the metadata text with build \"2026-09-15.1\" nested under sde and build \"2020-01-01.1\" at the top level is parsed\n      Then the build number shall be \"2026-09-15.1\"\n\n    Scenario: A top-level build is read when no block is present\n      When the metadata text with build \"2020-01-01.1\" at the top level is parsed\n      Then the build number shall be \"2020-01-01.1\"","sourceStart":309,"findings":[]},{"id":"0023-sde-ingestion#R24","title":"When a build field of _sde.yaml is a number, the SDE metadata parser shall read it as its digits, and a field of any other type than text or a number as empty text.","line":321,"pattern":"event-driven","exclusion":false,"verdict":"verified","evidence":"","charter":[],"tags":[],"scenarios":[{"title":"A numeric build is read as digits and a boolean date as empty","line":326,"tags":[]}],"source":"  Rule: When a build field of _sde.yaml is a number, the SDE metadata parser shall read it as its digits, and a field of any other type than text or a number as empty text.\n    YAML reads an unquoted build such as 3141592 as a number. The version\n    record is text either way; a value that is neither, such as a stray\n    boolean, gives nothing rather than \"true\".\n\n    Scenario: A numeric build is read as digits and a boolean date as empty\n      When the metadata text with build number 3141592 and a release date of true is parsed\n      Then the build number shall be \"3141592\"\n      And the release date shall be \"\"","sourceStart":321,"findings":[]},{"id":"0023-sde-ingestion#R25","title":"When a raw record is transformed for a registry file that injects its ID, the SDE record transform shall set the ID attribute from the record's key, rename ID-suffixed fields, and extract English text.","line":331,"pattern":"event-driven","exclusion":false,"verdict":"verified","evidence":"","charter":[],"tags":[],"scenarios":[{"title":"Type 34 is reshaped for the provider","line":334,"tags":[]}],"source":"  Rule: When a raw record is transformed for a registry file that injects its ID, the SDE record transform shall set the ID attribute from the record's key, rename ID-suffixed fields, and extract English text.\n    The provider reshapes every record it loads through this transform.\n\n    Scenario: Type 34 is reshaped for the provider\n      When record 34 of the types file is transformed for the provider\n      Then the returned record shall carry type 34\n      And the returned record shall be named \"Tritanium\"\n      And the returned record shall carry group 18","sourceStart":331,"findings":[]},{"id":"0023-sde-ingestion#R26","title":"When a raw record is transformed for the provider, the SDE record transform shall reshape a nested field at every depth and keep a null field as null.","line":340,"pattern":"event-driven","exclusion":false,"verdict":"verified","evidence":"","charter":[],"tags":[],"scenarios":[{"title":"Type 34's nested traits and null base price are reshaped","line":345,"tags":[]}],"source":"  Rule: When a raw record is transformed for the provider, the SDE record transform shall reshape a nested field at every depth and keep a null field as null.\n    The provider serves nested values as objects, not JSON text, so the\n    renaming and the English text reach inside them: an iconID two levels\n    down reads iconId like a top-level one.\n\n    Scenario: Type 34's nested traits and null base price are reshaped\n      When record 34 of the schema export's types.yaml file is transformed for the provider\n      Then the returned record shall have traits equal to the JSON '{\"iconId\":7,\"roleBonuses\":[{\"bonus\":5}]}'\n      And the returned record shall have basePrice equal to the JSON 'null'","sourceStart":340,"findings":[]},{"id":"0023-sde-ingestion#R27","title":"When a raw record of a registry file whose records keep their own IDs is transformed, the SDE record transform shall add no ID attribute.","line":350,"pattern":"event-driven","exclusion":false,"verdict":"verified","evidence":"","charter":[],"tags":[],"scenarios":[{"title":"A character title is reshaped for the provider without its key","line":354,"tags":[]}],"source":"  Rule: When a raw record of a registry file whose records keep their own IDs is transformed, the SDE record transform shall add no ID attribute.\n    The registry marks a few files as not injecting the key. Their records\n    carry the fields CCP wrote and no ID field built from the key.\n\n    Scenario: A character title is reshaped for the provider without its key\n      When record captain of the schema export's characterTitles.yaml file is transformed for the provider\n      Then the returned record shall be named \"Captain\"\n      And the returned record shall have no field \"characterTitleId\"","sourceStart":350,"findings":[]}],"noUnwantedBehaviour":false,"orphanScenarios":0}]}</script>
<script>
const D = JSON.parse(document.getElementById("data").textContent);
const $ = (s, el = document) => el.querySelector(s);
const esc = (s) => String(s).replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" })[c]);
const blob = (file, line) => D.repoUrl + "/blob/" + D.ref + "/" + file + (line ? "#L" + line : "");
const link = (file, line, text) => '<a href="' + esc(blob(file, line)) + '" target="_blank" rel="noopener">' + esc(text || (file + (line ? ":" + line : ""))) + "</a>";
const pat = (p) => '<span class="pattern" style="background:var(--p-' + p + ')">' + p + "</span>";
const VERDICT = { verified: "PASS", failing: "FAIL", unverified: "NOT RUN", unknown: "no run" };
const pill = (v) => '<span class="pill ' + v + '">' + VERDICT[v] + "</span>";
const plural = (n, one, many) => n + " " + (n === 1 ? one : (many || one + "s"));
const rulesOf = () => D.features.flatMap((f) => f.rules.map((r) => ({ f, r })));
const hasRun = D.reportFrom !== null;

function highlight(source, start, file) {
  let inDoc = false;
  return source.split("\n").map((raw, i) => {
    const n = start + i;
    let h = esc(raw);
    const t = raw.trim();
    if (/^("""|```)/.test(t)) { inDoc = !inDoc; h = '<span class="s">' + h + "</span>"; }
    else if (inDoc) h = '<span class="s">' + h + "</span>";
    else if (t.startsWith("#")) h = '<span class="c">' + h + "</span>";
    else if (t.startsWith("@")) h = h.replace(/@[\w-]+/g, (m) => '<span class="t">' + m + "</span>");
    else h = h.replace(/^(\s*)(Feature|Rule|Background|Scenario Outline|Scenario Template|Scenario|Examples|Example|Given|When|Then|And|But)(:?)/, (_, sp, kw, colon) => sp + '<span class="k">' + kw + colon + "</span>").replace(/&quot;[^&]*?&quot;/g, (m) => '<span class="s">' + m + "</span>");
    const ln = file ? '<a href="' + esc(blob(file, n)) + '" target="_blank" rel="noopener">' + n + "</a>" : String(n);
    return '<span class="row"><span class="ln">' + ln + "</span>" + h + "</span>";
  }).join("");
}

/* ---------- overview ---------- */
function overview() {
  const all = rulesOf();
  const by = (test) => all.filter(({ r }) => test(r)).length;
  const scenarios = all.reduce((n, { r }) => n + r.scenarios.length, 0);
  const tile = (n, l, cls) => '<div class="tile ' + (cls || "") + '"><div class="n">' + n + '</div><div class="l">' + l + "</div></div>";
  const failing = by((r) => r.verdict === "failing"), notRun = by((r) => r.verdict === "unverified"), findings = by((r) => r.findings.length > 0);
  const counts = Object.fromEntries(D.patterns.map((p) => [p, by((r) => r.pattern === p)]));
  const max = Math.max(1, ...Object.values(counts));

  const areas = {};
  for (const f of D.features) {
    const a = (areas[f.area] ||= { features: 0, rules: 0, verified: 0, scenarios: 0, exclusions: 0 });
    a.features++; a.rules += f.rules.length; a.verified += f.rules.filter((r) => r.verdict === "verified").length;
    a.scenarios += f.rules.reduce((n, r) => n + r.scenarios.length, 0); a.exclusions += f.rules.filter((r) => r.exclusion).length;
  }

  const charter = {};
  for (const f of D.features) for (const id of f.charter) (charter[id] ||= new Set()).add(f.file);

  const attention = [];
  for (const { f, r } of all) {
    if (r.verdict === "failing" || r.verdict === "unverified") attention.push('<li class="' + (r.verdict === "failing" ? "v-bad" : "v-warn") + '">' + pill(r.verdict) + ' <a href="#req-' + esc(r.id) + '">' + esc(r.id) + "</a>: " + esc(r.evidence) + "</li>");
    if (r.findings.length) attention.push('<li class="v-bad"><a href="#req-' + esc(r.id) + '">' + esc(r.id) + "</a>: " + esc(r.findings.join(" ")) + "</li>");
  }
  for (const f of D.features) {
    if (!f.boundBy.length) attention.push('<li class="v-bad">' + link(f.file) + ": no spec entry or step file runs this feature.</li>");
    if (f.orphanScenarios) attention.push('<li class="v-bad">' + link(f.file) + ": " + plural(f.orphanScenarios, "scenario") + " outside a Rule.</li>");
  }
  const unwanted = D.features.filter((f) => f.noUnwantedBehaviour);

  let changed = "";
  if (D.since) {
    const rows = [];
    for (const { f, r } of all) if (r.change) rows.push('<tr><td class="rid"><a href="#req-' + esc(r.id) + '">' + esc(r.id) + "</a></td><td>" + r.change + "</td><td>" + pat(r.pattern) + "</td><td>" + pill(r.verdict) + "</td><td>" + esc(r.title) + "</td></tr>");
    for (const r of D.removed) rows.push('<tr><td class="mono">' + esc(r.file.split("/").pop()) + "</td><td>removed</td><td></td><td></td><td>" + esc(r.title) + "</td></tr>");
    changed = "<h2>Changed since " + esc(D.since) + "</h2>" + (rows.length ? '<div class="card scroll"><table><thead><tr><th>Requirement</th><th>Change</th><th>Pattern</th><th>Verdict</th><th>Title</th></tr></thead><tbody>' + rows.join("") + "</tbody></table></div>" : '<div class="card">No requirement was added, changed or removed.</div>');
  }

  const runNote = hasRun
    ? '<p class="meta">Verdicts from <code>npm run ears</code> at ' + esc(D.reportFrom.slice(0, 16).replace("T", " ")) + " UTC. Spec audit: <b>" + esc(D.audit) + "</b>.</p>"
    : '<p class="meta">No <code>npm run ears</code> report was found, so no verdicts are shown. Run <code>npm run ears</code>, then rebuild this page.</p>';

  $("#overview").innerHTML = runNote +
    '<div class="tiles">' + tile(D.features.length, "feature files") + tile(all.length, "requirements (Rules)") + tile(scenarios, "scenarios") +
    (hasRun ? tile(by((r) => r.verdict === "verified"), "verified (PASS)", "ok") + tile(failing, "failing", failing ? "bad" : "") + tile(notRun, "not run", notRun ? "warn" : "") : "") +
    tile(findings, "with audit findings", findings ? "bad" : "") + tile(by((r) => r.exclusion), "exclusions (shall not)") + tile(by((r) => r.scenarios.length === 1), "on a single scenario") + "</div>" +
    changed +
    '<h2>Requirements by EARS pattern</h2><div class="card bars">' + D.patterns.map((p) => '<div class="bar"><span><a href="#" data-pattern="' + p + '">' + pat(p) + '</a></span><div class="track"><div class="fill" style="width:' + (100 * counts[p] / max) + "%;background:var(--p-" + p + ')"></div></div><span class="v">' + counts[p] + "</span></div>").join("") + "</div>" +
    '<h2>By area</h2><div class="card scroll"><table><thead><tr><th>Area (tests/bdd/features/…)</th><th class="num">Features</th><th class="num">Requirements</th>' + (hasRun ? '<th class="num">Verified</th>' : "") + '<th class="num">Scenarios</th><th class="num">Exclusions</th></tr></thead><tbody>' +
    Object.entries(areas).sort().map(([a, v]) => '<tr><td><a href="#" data-area="' + esc(a) + '">' + esc(a) + '</a></td><td class="num">' + v.features + '</td><td class="num">' + v.rules + "</td>" + (hasRun ? '<td class="num">' + v.verified + "</td>" : "") + '<td class="num">' + v.scenarios + '</td><td class="num">' + v.exclusions + "</td></tr>").join("") + "</tbody></table></div>" +
    "<h2>Needs attention</h2>" + (attention.length ? '<div class="card"><ul class="plain">' + attention.join("") + "</ul></div>" : '<div class="card">Nothing: every requirement is well-formed' + (hasRun ? ", verified" : "") + ", and every feature is run by one spec entry or step file.</div>") +
    "<h2>Advisory</h2><div class=\"card\"><p>" + plural(unwanted.length, "feature states", "features state") + " no unwanted behaviour (no <code>If …, then … shall</code> requirement), so their failure paths are unspecified:</p>" +
    (unwanted.length ? '<ul class="plain">' + unwanted.map((f) => "<li>" + esc(f.name) + " (" + link(f.file) + ")</li>").join("") + "</ul>" : "") + "</div>" +
    '<h2>Charter requirements verified here</h2><div class="card"><div class="chips">' + Object.keys(charter).sort().map((id) => '<a class="chip mono" href="#" data-charter="' + esc(id) + '" title="' + charter[id].size + ' feature(s)">@' + esc(id) + " · " + charter[id].size + "</a>").join("") + '</div><p class="meta">Each feature names the <a href="' + esc(D.repoUrl + "/blob/" + D.ref + "/guides/CHARTER.md") + '" target="_blank" rel="noopener">guides/CHARTER.md</a> requirement it verifies; the count is features.</p></div>';

  const jump = (sel, set) => $("#overview").querySelectorAll(sel).forEach((a) => a.addEventListener("click", (e) => { e.preventDefault(); clearFilters(); set(a); show("rules"); render(); }));
  jump("[data-area]", (a) => ($("#f-area").value = a.dataset.area));
  jump("[data-pattern]", (a) => ($("#f-pattern").value = a.dataset.pattern));
  jump("[data-charter]", (a) => ($("#f-charter").value = a.dataset.charter));
}

/* ---------- requirements ---------- */
function ruleHtml(f, r) {
  const head = '<div class="rhead"><span class="rid">' + esc(r.id) + "</span>" + pat(r.pattern) + pill(r.verdict) +
    (r.exclusion ? '<span class="pill excl">exclusion</span>' : "") + (r.findings.length ? '<span class="pill finding">audit finding</span>' : "") +
    (r.change ? '<span class="pill change">' + r.change + "</span>" : "") + '<span class="meta" style="margin:0">' + plural(r.scenarios.length, "scenario") + "</span></div>";
  const proof = f.boundBy.length ? '<ul class="plain">' + f.boundBy.map((b) => "<li>Run by " + link(b) + "</li>").join("") + "</ul>" : '<p class="meta v-bad">No spec entry or step file runs this feature.</p>';
  const verdict = r.verdict === "unknown" ? "" : r.verdict === "verified" ? '<p class="meta">Every scenario under this Rule ran and passed.</p>' : '<p class="meta ' + (r.verdict === "failing" ? "v-bad" : "v-warn") + '">' + esc(r.evidence) + "</p>";
  const audit = r.findings.length ? '<h3>Audit</h3><ul class="plain">' + r.findings.map((m) => '<li class="v-bad">' + esc(m) + "</li>").join("") + "</ul>" : "";
  return '<details class="rule" id="req-' + esc(r.id) + '"><summary>' + head + "<span>" + esc(r.title) + "</span></summary>" +
    '<div class="rbody"><pre class="src">' + highlight(r.source, r.sourceStart, f.file) + "</pre><h3>Proof</h3>" + proof + verdict + audit + "</div></details>";
}

function featureHtml(f, rules, open) {
  const tags = f.tags.map((t) => '<span class="chip mono">' + esc(t) + "</span> ").join("");
  return '<details class="feature"' + (open ? " open" : "") + '><summary><span class="fname">' + esc(f.name) + '</span><span class="fpath">' + esc(f.file) + "</span>" +
    '<span class="meta" style="margin:0">' + plural(f.rules.length, "requirement") + (rules.length !== f.rules.length ? ", " + rules.length + " shown" : "") + "</span></summary>" +
    '<div class="fbody">' + (f.description ? '<p class="desc">' + esc(f.description) + "</p>" : "") + '<p class="meta">' + tags + link(f.file, 0, "view file") + "</p>" +
    rules.map((r) => ruleHtml(f, r)).join("") + "</div></details>";
}

function clearFilters() {
  $("#q").value = ""; $("#f-pattern").value = ""; $("#f-area").value = ""; $("#f-verdict").value = ""; $("#f-charter").value = ""; $("#f-changed").checked = false;
}

function render() {
  const q = $("#q").value.trim().toLowerCase(), p = $("#f-pattern").value, a = $("#f-area").value, v = $("#f-verdict").value, c = $("#f-charter").value, ch = $("#f-changed").checked;
  const filtering = q || p || v || c || ch;
  let nRules = 0, nFeatures = 0;
  const html = D.features.map((f) => {
    if (a && f.area !== a) return "";
    const rules = f.rules.filter((r) => (!p || r.pattern === p) && (!ch || r.change) &&
      (!c || f.tags.includes("@" + c) || r.tags.includes("@" + c)) &&
      (!v || (v === "exclusion" ? r.exclusion : v === "finding" ? r.findings.length > 0 : v === "single" ? r.scenarios.length === 1 : r.verdict === v)) &&
      (!q || (r.id + " " + r.title + " " + r.scenarios.map((x) => x.title).join(" ") + " " + f.file + " " + f.name + " " + r.tags.join(" ")).toLowerCase().includes(q)));
    if (!rules.length) return "";
    nRules += rules.length; nFeatures++;
    return featureHtml(f, rules, !!filtering);
  }).join("");
  $("#list").innerHTML = html || '<div class="empty">No requirement matches.</div>';
  $("#count").textContent = plural(nRules, "requirement") + " in " + plural(nFeatures, "feature file");
}

/* ---------- guide ---------- */
function guide() {
  const anatomy = [
    "@ARCH-04",
    "Feature: ETag Caching",
    "  The EsiClient can cache GET responses that carry an ETag header, keyed by",
    "  endpoint. Each entry has a TTL derived from the endpoint's cache metadata.",
    "",
    "  # ── Storing responses ─────────────────────────────",
    "",
    "  Rule: When a response carrying an ETag header is received, the ETag cache shall store the response body against the requested endpoint.",
    "    The ETag is the server's own identity for a representation, so its",
    "    presence is what marks a response as re-usable.",
    "",
    "    Scenario: First response carrying an ETag is stored in the cache",
    "      Given ETag caching is enabled",
    "      When the client requests an endpoint that answers with an ETag",
    "      Then the response is stored against that endpoint"
  ].join("\n");
  const ex = (p) => {
    const e = D.examples[p];
    if (!e) return '<p class="meta">No requirement of this pattern is clean and verified yet.</p>';
    const f = D.features[e.feature], r = f.rules[e.rule];
    return '<p class="meta">From ' + link(f.file, r.line) + ' (<a href="#req-' + esc(r.id) + '">' + esc(r.id) + "</a>)</p><pre class=\"src\">" + highlight(r.source, r.sourceStart, f.file) + "</pre>";
  };
  $("#guide").innerHTML =
