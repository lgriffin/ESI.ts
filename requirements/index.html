\n      When the character's view follows every page of the character's assets\n      Then the view shall receive two assets","sourceStart":28,"findings":[]},{"id":"0057-mock-transport#R2","title":"If a request matches no route, then the mock transport shall reject it with an EsiConfigurationError carrying the code CONFIGURATION_ERROR and naming the request's method and URL.","line":55,"pattern":"unwanted-behaviour","exclusion":false,"verdict":"verified","evidence":"","charter":[],"tags":[],"scenarios":[{"title":"An unrouted wallet request fails naming the request it could not answer","line":64,"tags":[]}],"source":"  Rule: If a request matches no route, then the mock transport shall reject it with an EsiConfigurationError carrying the code CONFIGURATION_ERROR and naming the request's method and URL.\n    A silent default, an empty 200 or an invented body, would let a test pass\n    without exercising anything. An HTTP error would be treated as one ESI\n    sent: a 5xx can be served from a stale cache entry and counts against the\n    circuit. A configuration error is the SDK's own word for a setup fault:\n    the pipeline raises it unchanged, without retrying, its message names the\n    request, and the transport lists the request under `unrouted` for a test\n    that checks the whole exchange.\n\n    Scenario: An unrouted wallet request fails naming the request it could not answer\n      Given a runtime over a mock transport\n      And a view for a character holding an access token\n      When the character's view requests the wallet balance\n      Then the call shall be rejected with a configuration error\n      And the rejection shall name the unanswered request \"GET https://esi.evetech.net/characters/2114794365/wallet\"\n      And the mock transport shall list the request \"GET https://esi.evetech.net/characters/2114794365/wallet\" as unrouted","sourceStart":55,"findings":[]},{"id":"0057-mock-transport#R3","title":"The mock transport shall record every request's method, URL, headers and body in the order they were sent.","line":74,"pattern":"ubiquitous","exclusion":false,"verdict":"verified","evidence":"","charter":[],"tags":[],"scenarios":[{"title":"The bearer token a character's view sent is readable from the record","line":80,"tags":[]},{"title":"A POST body is recorded as it was sent","line":87,"tags":[]}],"source":"  Rule: The mock transport shall record every request's method, URL, headers and body in the order they were sent.\n    What went over the wire is the evidence a test of the application has:\n    which token a view sent, which IDs a lookup posted. Header names are\n    recorded in lower case, as the Fetch API normalises them, and a request\n    with no body records `undefined`.\n\n    Scenario: The bearer token a character's view sent is readable from the record\n      Given a runtime over a mock transport\n      And the mock transport answers \"GET\" \"/characters/{character_id}/wallet\" with the wallet balance\n      And a view for a character holding an access token\n      When the character's view requests the wallet balance\n      Then the mock transport shall have recorded one request carrying the header \"authorization\" with the value \"Bearer raw-access-token\"\n\n    Scenario: A POST body is recorded as it was sent\n      Given a runtime over a mock transport\n      And the mock transport answers \"POST\" \"/universe/names\" with the names of the IDs\n      When the public view resolves the names of two IDs\n      Then the recorded request shall carry the body \"[1,2]\"","sourceStart":74,"findings":[]},{"id":"0057-mock-transport#R4","title":"When a route has answered the number of requests its times allows, the mock transport shall retire it.","line":95,"pattern":"event-driven","exclusion":false,"verdict":"verified","evidence":"","charter":[],"tags":[],"scenarios":[{"title":"A once-only route answers the first character and not the second","line":101,"tags":[]}],"source":"  Rule: When a route has answered the number of requests its times allows, the mock transport shall retire it.\n    A route with `times` answers that many matching requests and then no more,\n    so a test can script a sequence: one answer for the first call, another\n    for the second, or a single answer after which anything further is\n    unrouted. A route without `times` answers every matching request.\n\n    Scenario: A once-only route answers the first character and not the second\n      Given a runtime over a mock transport\n      And the mock transport answers \"GET\" \"/characters/{character_id}/wallet\" with the wallet balance once\n      And views for two characters of one corporation\n      When each character's view requests its own wallet balance\n      Then the first view shall receive the wallet balance\n      And the second call shall be rejected with a configuration error","sourceStart":95,"findings":[]},{"id":"0057-mock-transport#R5","title":"When it is reset, the mock transport shall forget its routes and its recorded requests.","line":109,"pattern":"event-driven","exclusion":false,"verdict":"verified","evidence":"","charter":[],"tags":[],"scenarios":[{"title":"A reset transport has no routes and no record","line":117,"tags":[]}],"source":"  Rule: When it is reset, the mock transport shall forget its routes and its recorded requests.\n    One transport can serve a whole test file: `reset()` between tests leaves\n    nothing of the previous exchange behind in the transport. The runtime's\n    own response cache is not the transport's to clear: once a route answered\n    with an ETag, the runtime can serve that request again without reaching\n    the transport, so a test that repeats a request across a reset builds a\n    runtime per test or disables the cache.\n\n    Scenario: A reset transport has no routes and no record\n      Given a runtime over a mock transport\n      And the mock transport answers \"GET\" \"/characters/{character_id}/wallet\" with the wallet balance\n      And a view for a character holding an access token\n      And the character's view has requested the wallet balance\n      When the mock transport is reset\n      Then the mock transport shall have no routes and no recorded requests","sourceStart":109,"findings":[]},{"id":"0057-mock-transport#R6","title":"Where a custom client is configured with a transport, the client shall send every request through that transport.","line":127,"pattern":"optional-feature","exclusion":false,"verdict":"verified","evidence":"","charter":[],"tags":[],"scenarios":[{"title":"A wallet client built by EsiClient reads the balance through the mock transport","line":134,"tags":[]},{"title":"A wallet client built by EsiClientBuilder reads the balance through the mock transport","line":134,"tags":[]},{"title":"A wallet client built by EsiApiFactory reads the balance through the mock transport","line":134,"tags":[]},{"title":"An unrouted request from a custom client fails without a retry","line":147,"tags":[]}],"source":"  Rule: Where a custom client is configured with a transport, the client shall send every request through that transport.\n    The custom clients are the product, so an application built on them gets\n    the same test double as one built on `createEsi()`: `transport` in\n    `EsiClientConfig` replaces `fetch` for the client and for every identity\n    view opened on it. The rest of the pipeline is unchanged, and a request\n    that reached `fetch` instead would fail the scenario at the seam.\n\n    Scenario Outline: A wallet client built by \u003csurface> reads the balance through the mock transport\n      Given a wallet client built by \"\u003csurface>\" over a mock transport\n      And the mock transport answers \"GET\" \"/characters/{character_id}/wallet\" with the wallet balance\n      When the wallet client requests the wallet balance\n      Then the wallet client shall receive the wallet balance\n      And the mock transport shall have recorded one request carrying the header \"authorization\" with the value \"Bearer raw-access-token\"\n\n      Examples:\n        | surface          |\n        | EsiClient        |\n        | EsiClientBuilder |\n        | EsiApiFactory    |\n\n    Scenario: An unrouted request from a custom client fails without a retry\n      Given a wallet client built by \"EsiClient\" over a mock transport\n      When the wallet client requests the wallet balance\n      Then the call shall be rejected with a configuration error\n      And the mock transport shall list the request \"GET https://esi.evetech.net/characters/2114794365/wallet\" as unrouted","sourceStart":127,"findings":[]}],"noUnwantedBehaviour":false,"orphanScenarios":0},{"file":"tests/bdd/features/core/0058-logging.feature","area":"core","name":"Log redaction","tags":["@ARCH-09","@SEC-02","@SEC-10"],"charter":["ARCH-09","SEC-02","SEC-10","TEST-11"],"description":"The pipeline writes the URL of each request to the logger an application configures, and an application may put a credential in a query string (an access token, an OAuth code, a client secret). Log lines travel further than the process: to files, aggregators and support tickets. Every line the per-client logger receives passes through the same redaction the error classes apply, at the logger boundary, so no call site can forget it.\n\nThese scenarios drive the real request pipeline to the transport seam with a recording logger configured on the client and read what reached it.\n\nThe console logger (`createConsoleLogger`) is the plain-text logger a script or an example configures instead of pino. Its scenarios capture what reaches console.log, console.warn and console.error, through a client or from the application's own log calls.","boundBy":["tests/bdd/specs/core/0058-logging.spec.ts"],"rules":[{"id":"0058-logging#R1","title":"When the client logs a request whose URL carries a sensitive query parameter, the client logger shall receive that parameter with its value replaced by [REDACTED].","line":19,"pattern":"event-driven","exclusion":false,"verdict":"verified","evidence":"","charter":[],"tags":["@sec-P3"],"scenarios":[{"title":"An access token in the query is logged redacted","line":25,"tags":[]},{"title":"A refresh token in the query is logged redacted","line":32,"tags":[]}],"source":"  @sec-P3\n  Rule: When the client logs a request whose URL carries a sensitive query parameter, the client logger shall receive that parameter with its value replaced by [REDACTED].\n    The sensitive names are the ones `sanitizeUrl` redacts in an EsiError's\n    url. The other parameters and the path are logged as sent, so a line still\n    says which request it was about. Only the value of a sensitive parameter is\n    withheld.\n\n    Scenario: An access token in the query is logged redacted\n      Given a client that logs to a recording logger and sends the query parameter \"token\" with the value \"s3cret\"\n      And ESI reports the server status\n      When the client requests the server status\n      Then the logged request URL shall carry \"token\" with the value \"[REDACTED]\"\n      And no logged line shall contain \"s3cret\"\n\n    Scenario: A refresh token in the query is logged redacted\n      Given a client that logs to a recording logger and sends the query parameter \"refresh_token\" with the value \"r-9f2c\"\n      And ESI reports the server status\n      When the client requests the server status\n      Then the logged request URL shall carry \"refresh_token\" with the value \"[REDACTED]\"\n      And no logged line shall contain \"r-9f2c\"","sourceStart":18,"findings":[]},{"id":"0058-logging#R2","title":"If a request carries an access token, then the client logger shall not receive that token.","line":40,"pattern":"unwanted-behaviour","exclusion":true,"verdict":"verified","evidence":"","charter":["TEST-11"],"tags":["@sec-P3","@TEST-11"],"scenarios":[{"title":"A wallet balance read leaves no token in the log","line":47,"tags":[]},{"title":"A wallet balance refused with HTTP 401 leaves no token in the log","line":53,"tags":[]}],"source":"  @sec-P3 @TEST-11\n  Rule: If a request carries an access token, then the client logger shall not receive that token.\n    The bearer token travels in the Authorization header, and no log call\n    includes request headers, so the token has no path to a log line whatever\n    the configured level. The scenarios record every level, on a call that\n    succeeds and on one ESI refuses, and look for the token in each message\n    and each string field of its context.\n\n    Scenario: A wallet balance read leaves no token in the log\n      Given a client that logs every level to a recording logger\n      And an authenticated character for wallet\n      When the client requests their wallet balance\n      Then no logged line shall contain \"bdd-access-token\"\n\n    Scenario: A wallet balance refused with HTTP 401 leaves no token in the log\n      Given a client that logs every level to a recording logger\n      And ESI rejects the character's token\n      When the client requests their wallet balance and ESI refuses it\n      Then no logged line shall contain \"bdd-access-token\"","sourceStart":39,"findings":[]},{"id":"0058-logging#R3","title":"Where an application builds the console logger with a level, the console logger shall write only the lines at or above that level.","line":59,"pattern":"optional-feature","exclusion":false,"verdict":"verified","evidence":"","charter":[],"tags":[],"scenarios":[{"title":"A console logger at info writes the client's request line","line":66,"tags":[]},{"title":"A console logger at warn leaves the request line out","line":72,"tags":[]},{"title":"A silent console logger writes not even a fatal line","line":78,"tags":[]}],"source":"  Rule: Where an application builds the console logger with a level, the console logger shall write only the lines at or above that level.\n    `createConsoleLogger` is the plain-text logger for scripts and the\n    examples. Its level is the only filter between a log call and the\n    console, so a line below it never appears and `silent` writes nothing at\n    all. The client is configured to pass every level to its logger, so what\n    reaches the console is the console logger's own decision.\n\n    Scenario: A console logger at info writes the client's request line\n      Given a client that logs to the console at level \"info\"\n      And ESI reports the server status\n      When the client requests the server status\n      Then standard output shall receive a line starting with \"Hitting endpoint: https://esi.evetech.net/status [method=GET]\"\n\n    Scenario: A console logger at warn leaves the request line out\n      Given a client that logs to the console at level \"warn\"\n      And ESI reports the server status\n      When the client requests the server status\n      Then the console shall receive no line\n\n    Scenario: A silent console logger writes not even a fatal line\n      Given a console logger at level \"silent\"\n      When the application logs \"disk full\" at level \"fatal\"\n      Then the console shall receive no line","sourceStart":59,"findings":[]},{"id":"0058-logging#R4","title":"When the console logger writes a line, the console logger shall send info and lower levels to standard output, warn to the warning stream, and error and fatal to the error stream, with every level but info prefixed by its name.","line":83,"pattern":"event-driven","exclusion":false,"verdict":"verified","evidence":"","charter":[],"tags":[],"scenarios":[{"title":"An info line goes to standard output as written","line":89,"tags":[]},{"title":"A debug line goes to standard output with its level","line":94,"tags":[]},{"title":"A warning goes to the warning stream","line":99,"tags":[]},{"title":"An error goes to the error stream","line":104,"tags":[]},{"title":"A fatal line goes to the error stream","line":109,"tags":[]}],"source":"  Rule: When the console logger writes a line, the console logger shall send info and lower levels to standard output, warn to the warning stream, and error and fatal to the error stream, with every level but info prefixed by its name.\n    A failure has to land on standard error, where a shell or a supervisor\n    looks for it, while the program's ordinary output stays on standard\n    output. The level prefix tells the lines apart once the streams are\n    merged; info carries none, so a script's own output reads as written.\n\n    Scenario: An info line goes to standard output as written\n      Given a console logger at level \"trace\"\n      When the application logs \"Players online: 21000\" at level \"info\"\n      Then standard output shall receive the line \"Players online: 21000\"\n\n    Scenario: A debug line goes to standard output with its level\n      Given a console logger at level \"trace\"\n      When the application logs \"cache miss\" at level \"debug\"\n      Then standard output shall receive the line \"debug: cache miss\"\n\n    Scenario: A warning goes to the warning stream\n      Given a console logger at level \"trace\"\n      When the application logs \"slow response\" at level \"warn\"\n      Then the warning stream shall receive the line \"warn: slow response\"\n\n    Scenario: An error goes to the error stream\n      Given a console logger at level \"trace\"\n      When the application logs \"request failed\" at level \"error\"\n      Then the error stream shall receive the line \"error: request failed\"\n\n    Scenario: A fatal line goes to the error stream\n      Given a console logger at level \"trace\"\n      When the application logs \"cannot start\" at level \"fatal\"\n      Then the error stream shall receive the line \"fatal: cannot start\"","sourceStart":83,"findings":[]},{"id":"0058-logging#R5","title":"When the console logger writes a line that carries context, the console logger shall append each context field as a [key=value] token, showing an error by its message and any other non-string value as JSON.","line":114,"pattern":"event-driven","exclusion":false,"verdict":"verified","evidence":"","charter":[],"tags":[],"scenarios":[{"title":"A failed request's context is appended as tokens","line":119,"tags":[]}],"source":"  Rule: When the console logger writes a line that carries context, the console logger shall append each context field as a [key=value] token, showing an error by its message and any other non-string value as JSON.\n    `LogContext` promises structured fields; on a console they become\n    plain-text tokens after the message, in the order the fields were given,\n    so a line stays one line and greppable.\n\n    Scenario: A failed request's context is appended as tokens\n      Given a console logger at level \"trace\"\n      When the application logs \"request failed\" with the status 503, the error \"ESI is down\" and the endpoints \"status\" and \"wars\"\n      Then the error stream shall receive the line 'error: request failed [status=503] [cause=ESI is down] [endpoints=[\"status\",\"wars\"]]'","sourceStart":114,"findings":[]},{"id":"0058-logging#R6","title":"Where the console logger is built without a level, the console logger shall take its level from ESI_LOG_LEVEL, or warn when that variable is unset or names no level.","line":124,"pattern":"optional-feature","exclusion":false,"verdict":"verified","evidence":"","charter":[],"tags":[],"scenarios":[{"title":"ESI_LOG_LEVEL at debug lets debug lines through","line":130,"tags":[]},{"title":"With ESI_LOG_LEVEL unset an info line is held back","line":135,"tags":[]},{"title":"With ESI_LOG_LEVEL unset a warning is written","line":140,"tags":[]},{"title":"An ESI_LOG_LEVEL that names no level falls back to warn","line":145,"tags":[]}],"source":"  Rule: Where the console logger is built without a level, the console logger shall take its level from ESI_LOG_LEVEL, or warn when that variable is unset or names no level.\n    This is the resolution `createDefaultLogger` uses, so switching an\n    application between the two loggers does not change which lines appear.\n    An unknown value falls back rather than throwing, because a logger must\n    not throw.\n\n    Scenario: ESI_LOG_LEVEL at debug lets debug lines through\n      Given a console logger built with no level while ESI_LOG_LEVEL is \"debug\"\n      When the application logs \"cache miss\" at level \"debug\"\n      Then standard output shall receive the line \"debug: cache miss\"\n\n    Scenario: With ESI_LOG_LEVEL unset an info line is held back\n      Given a console logger built with no level while ESI_LOG_LEVEL is unset\n      When the application logs \"Players online: 21000\" at level \"info\"\n      Then the console shall receive no line\n\n    Scenario: With ESI_LOG_LEVEL unset a warning is written\n      Given a console logger built with no level while ESI_LOG_LEVEL is unset\n      When the application logs \"slow response\" at level \"warn\"\n      Then the warning stream shall receive the line \"warn: slow response\"\n\n    Scenario: An ESI_LOG_LEVEL that names no level falls back to warn\n      Given a console logger built with no level while ESI_LOG_LEVEL is \"verbose\"\n      When the application logs \"Players online: 21000\" at level \"info\"\n      Then the console shall receive no line","sourceStart":124,"findings":[]}],"noUnwantedBehaviour":false,"orphanScenarios":0},{"file":"tests/bdd/features/core/0059-path-parameters.feature","area":"core","name":"Path parameter validation","tags":["@SEC-10"],"charter":["SEC-10"],"description":"Every ID a caller passes to an endpoint becomes a segment of the request path. A value that is empty, that holds a character with meaning in a URL, or that is a dot segment would change which route the request reaches: `characters/../assets/` resolves to `/assets/`, and `1/wallet` adds a segment the caller never asked for. The client checks each path parameter before it builds the URL, so a malformed ID fails at the call with a VALIDATION_ERROR and never reaches ESI.\n\nThese scenarios call a real client method and read what reached the transport seam.","boundBy":["tests/bdd/specs/core/0059-path-parameters.spec.ts"],"rules":[{"id":"0059-path-parameters#R1","title":"If a path parameter's string form is empty, then the client shall reject the call with a VALIDATION_ERROR and send no request.","line":15,"pattern":"unwanted-behaviour","exclusion":false,"verdict":"verified","evidence":"","charter":[],"tags":["@sec-P2"],"scenarios":[{"title":"An empty character ID is refused before the request","line":19,"tags":[]}],"source":"  @sec-P2\n  Rule: If a path parameter's string form is empty, then the client shall reject the call with a VALIDATION_ERROR and send no request.\n    An empty ID would leave an empty path segment, and ESI would answer a\n    different route.\n\n    Scenario: An empty character ID is refused before the request\n      When the client requests the public information of the character \"\"\n      Then the call shall be rejected with a VALIDATION_ERROR saying \"must not be empty\"\n      And no request shall have been sent","sourceStart":14,"findings":[]},{"id":"0059-path-parameters#R2","title":"If a path parameter holds a character that has meaning in a URL, then the client shall reject the call with a VALIDATION_ERROR and send no request.","line":25,"pattern":"unwanted-behaviour","exclusion":false,"verdict":"verified","evidence":"","charter":[],"tags":["@sec-P2"],"scenarios":[{"title":"A character ID holding a slash is refused before the request","line":29,"tags":[]},{"title":"A character ID holding a question mark is refused before the request","line":34,"tags":[]}],"source":"  @sec-P2\n  Rule: If a path parameter holds a character that has meaning in a URL, then the client shall reject the call with a VALIDATION_ERROR and send no request.\n    A slash adds a path segment, and a question mark or hash ends the path,\n    so the request would reach a route the caller did not name.\n\n    Scenario: A character ID holding a slash is refused before the request\n      When the client requests the public information of the character \"2112625428/wallet\"\n      Then the call shall be rejected with a VALIDATION_ERROR saying \"contains invalid characters\"\n      And no request shall have been sent\n\n    Scenario: A character ID holding a question mark is refused before the request\n      When the client requests the public information of the character \"2112625428?datasource=x\"\n      Then the call shall be rejected with a VALIDATION_ERROR saying \"contains invalid characters\"\n      And no request shall have been sent","sourceStart":24,"findings":[]},{"id":"0059-path-parameters#R3","title":"If a path parameter is a dot segment, then the client shall reject the call with a VALIDATION_ERROR and send no request.","line":40,"pattern":"unwanted-behaviour","exclusion":false,"verdict":"verified","evidence":"","charter":[],"tags":["@sec-P2"],"scenarios":[{"title":"A dot-dot character ID is refused before the request","line":44,"tags":[]},{"title":"A single-dot character ID is refused before the request","line":49,"tags":[]}],"source":"  @sec-P2\n  Rule: If a path parameter is a dot segment, then the client shall reject the call with a VALIDATION_ERROR and send no request.\n    `.` and `..` survive URL encoding and are collapsed when the URL is\n    resolved, so they would climb out of the route.\n\n    Scenario: A dot-dot character ID is refused before the request\n      When the client requests the public information of the character \"..\"\n      Then the call shall be rejected with a VALIDATION_ERROR saying \"must not be a dot segment\"\n      And no request shall have been sent\n\n    Scenario: A single-dot character ID is refused before the request\n      When the client requests the public information of the character \".\"\n      Then the call shall be rejected with a VALIDATION_ERROR saying \"must not be a dot segment\"\n      And no request shall have been sent","sourceStart":39,"findings":[]},{"id":"0059-path-parameters#R4","title":"If a numeric path parameter is not a finite number, then the client shall reject the call with a VALIDATION_ERROR and send no request.","line":55,"pattern":"unwanted-behaviour","exclusion":false,"verdict":"verified","evidence":"","charter":[],"tags":["@sec-P2"],"scenarios":[{"title":"A NaN character ID is refused before the request","line":58,"tags":[]},{"title":"An infinite character ID is refused before the request","line":63,"tags":[]}],"source":"  @sec-P2\n  Rule: If a numeric path parameter is not a finite number, then the client shall reject the call with a VALIDATION_ERROR and send no request.\n    NaN and Infinity stringify to words ESI reads as a malformed ID.\n\n    Scenario: A NaN character ID is refused before the request\n      When the client requests the public information of a character whose ID is NaN\n      Then the call shall be rejected with a VALIDATION_ERROR saying \"must be a finite number\"\n      And no request shall have been sent\n\n    Scenario: An infinite character ID is refused before the request\n      When the client requests the public information of a character whose ID is Infinity\n      Then the call shall be rejected with a VALIDATION_ERROR saying \"must be a finite number\"\n      And no request shall have been sent","sourceStart":54,"findings":[]}],"noUnwantedBehaviour":false,"orphanScenarios":0},{"file":"tests/bdd/features/core/0060-custom-client.feature","area":"core","name":"Custom client built from chosen API clients","tags":["@ARCH-08"],"charter":["ARCH-08","TEST-11"],"description":"EsiClientBuilder builds a CustomEsiClient that carries only the API clients an application names, so a tool that reads the market and the server status does not construct the other thirty-odd clients. The built client shares one request pipeline between the clients it holds, configured the same way as EsiClient.\n\nBoth custom-client surfaces take the middleware instances `createEsi` takes (a cache store, rate limiter, circuit breaker, deduplicator and clock), report and reset that middleware, and hand out every domain client's metadata and safe-mode views from one call (CLIENT-ARCHITECTURE.md, decision D).\n\nThese scenarios build a client through the builder, or an EsiClient, and read what reached the transport seam.","boundBy":["tests/bdd/specs/core/0060-custom-client.spec.ts"],"rules":[{"id":"0060-custom-client#R1","title":"When a custom client is built from a list of API clients, the CustomEsiClient shall expose exactly those clients.","line":18,"pattern":"event-driven","exclusion":false,"verdict":"verified","evidence":"","charter":[],"tags":[],"scenarios":[{"title":"A client built with market and status exposes those two alone","line":22,"tags":[]}],"source":"  Rule: When a custom client is built from a list of API clients, the CustomEsiClient shall expose exactly those clients.\n    A getter for a client the builder was not given returns undefined rather\n    than a client that was never configured.\n\n    Scenario: A client built with market and status exposes those two alone\n      When a custom client is built with the \"market\" and \"status\" clients\n      Then the custom client shall list \"market,status\" as its enabled clients\n      And the custom client shall expose the \"status\" client\n      And the custom client shall not expose the \"route\" client","sourceStart":18,"findings":[]},{"id":"0060-custom-client#R2","title":"When the same API client is added to the builder twice, the EsiClientBuilder shall enable it once.","line":28,"pattern":"event-driven","exclusion":false,"verdict":"verified","evidence":"","charter":[],"tags":[],"scenarios":[{"title":"Adding status twice enables it once","line":32,"tags":[]}],"source":"  Rule: When the same API client is added to the builder twice, the EsiClientBuilder shall enable it once.\n    Adding a client is idempotent, so code that composes a builder from\n    several feature flags cannot enable a client twice.\n\n    Scenario: Adding status twice enables it once\n      When a custom client is built with the \"status\" and \"status\" clients\n      Then the custom client shall list \"status\" as its enabled clients","sourceStart":28,"findings":[]},{"id":"0060-custom-client#R3","title":"If a custom client is built with no API clients, then the EsiClientBuilder shall throw an error naming the missing client type.","line":36,"pattern":"unwanted-behaviour","exclusion":false,"verdict":"verified","evidence":"","charter":[],"tags":[],"scenarios":[{"title":"Building with no clients is refused","line":40,"tags":[]}],"source":"  Rule: If a custom client is built with no API clients, then the EsiClientBuilder shall throw an error naming the missing client type.\n    A client with nothing to call is a configuration mistake worth catching at\n    startup.\n\n    Scenario: Building with no clients is refused\n      When a custom client is built with no clients\n      Then the builder shall throw \"At least one client type must be specified\"","sourceStart":36,"findings":[]},{"id":"0060-custom-client#R4","title":"When a custom client calls an endpoint, the CustomEsiClient shall identify itself with the configured client ID in the X-User-Agent header.","line":44,"pattern":"event-driven","exclusion":false,"verdict":"verified","evidence":"","charter":[],"tags":[],"scenarios":[{"title":"A custom client asks the server status as its own application","line":48,"tags":[]}],"source":"  Rule: When a custom client calls an endpoint, the CustomEsiClient shall identify itself with the configured client ID in the X-User-Agent header.\n    The built client runs the same pipeline as EsiClient, so CCP can reach\n    the application behind a request whichever surface built it.\n\n    Scenario: A custom client asks the server status as its own application\n      Given ESI reports the server status\n      When a custom client built with the \"status\" client and the client ID \"fleet-tool\" requests the server status\n      Then the request shall carry the header \"X-User-Agent\" with the value \"fleet-tool\"\n      And the custom client's result shall report the server status","sourceStart":44,"findings":[]},{"id":"0060-custom-client#R5","title":"Where a cache store is supplied in the configuration, the CustomEsiClient shall keep the response bodies it caches in that store.","line":56,"pattern":"optional-feature","exclusion":false,"verdict":"verified","evidence":"","charter":[],"tags":[],"scenarios":[{"title":"A custom client writes the server status to the supplied store and serves it from there","line":63,"tags":[]}],"source":"  Rule: Where a cache store is supplied in the configuration, the CustomEsiClient shall keep the response bodies it caches in that store.\n    The custom clients are the product (CLIENT-ARCHITECTURE.md), so the\n    middleware `createEsi` takes as instances reaches them through the same\n    `configureApiClient` path. A shared store (Redis, a file) implementing the\n    `CacheStore` port holds the conditional-request entries instead of the\n    client's own memory.\n\n    Scenario: A custom client writes the server status to the supplied store and serves it from there\n      Given a custom client built with the \"status\" client over a supplied cache store\n      And ESI reports the server status with an ETag\n      When the custom client requests the server status twice\n      Then the supplied cache store shall hold the server status with its ETag\n      And the client shall have sent 1 request","sourceStart":56,"findings":[]},{"id":"0060-custom-client#R6","title":"Where a rate limiter is supplied in the configuration, the EsiClient shall ask that rate limiter for clearance before each request it sends.","line":70,"pattern":"optional-feature","exclusion":false,"verdict":"verified","evidence":"","charter":[],"tags":[],"scenarios":[{"title":"Requests from two domain clients are cleared by the supplied rate limiter","line":74,"tags":[]}],"source":"  Rule: Where a rate limiter is supplied in the configuration, the EsiClient shall ask that rate limiter for clearance before each request it sends.\n    The supplied limiter replaces the one `rateLimiterConfig` would build, and\n    every domain client of the EsiClient draws on it.\n\n    Scenario: Requests from two domain clients are cleared by the supplied rate limiter\n      Given a client with a supplied rate limiter\n      And ESI reports the server status\n      And ESI reports the alliance list with an ETag\n      When the client requests the server status\n      And the client requests the alliance list\n      Then the supplied rate limiter shall have cleared 2 requests","sourceStart":70,"findings":[]},{"id":"0060-custom-client#R7","title":"Where a circuit breaker is supplied in the configuration, the CustomEsiClient shall record the failures its clients see in that circuit breaker.","line":82,"pattern":"optional-feature","exclusion":false,"verdict":"verified","evidence":"","charter":[],"tags":[],"scenarios":[{"title":"A supplied circuit breaker opens after the custom client's status requests fail","line":85,"tags":[]}],"source":"  Rule: Where a circuit breaker is supplied in the configuration, the CustomEsiClient shall record the failures its clients see in that circuit breaker.\n    Supplying a circuit breaker turns it on, as `enableCircuitBreaker` would.\n\n    Scenario: A supplied circuit breaker opens after the custom client's status requests fail\n      Given a custom client built with the \"status\" client and a supplied circuit breaker that opens after 2 failures\n      And ESI answers the server status with 500 until the circuit opens\n      When the custom client requests the server status until the circuit opens\n      Then the supplied circuit breaker shall report 1 open circuit","sourceStart":82,"findings":[]},{"id":"0060-custom-client#R8","title":"Where a deduplicator is supplied in the configuration, the EsiClient shall coalesce concurrent identical requests through that deduplicator.","line":91,"pattern":"optional-feature","exclusion":false,"verdict":"verified","evidence":"","charter":[],"tags":[],"scenarios":[{"title":"Two concurrent status requests are joined by the supplied deduplicator","line":95,"tags":[]}],"source":"  Rule: Where a deduplicator is supplied in the configuration, the EsiClient shall coalesce concurrent identical requests through that deduplicator.\n    Supplying a deduplicator turns deduplication on, whatever\n    `enableRequestDeduplication` says.\n\n    Scenario: Two concurrent status requests are joined by the supplied deduplicator\n      Given a client with a supplied deduplicator\n      And ESI reports the server status after a delay\n      When the client requests the server status twice at once\n      Then the client shall have sent 1 request\n      And the supplied deduplicator shall have been asked 2 times","sourceStart":91,"findings":[]},{"id":"0060-custom-client#R9","title":"Where a clock is supplied in the configuration, the EsiClient shall wait out the retry back-off on that clock.","line":102,"pattern":"optional-feature","exclusion":false,"verdict":"verified","evidence":"","charter":[],"tags":[],"scenarios":[{"title":"A retried server status waits on the supplied clock","line":107,"tags":[]}],"source":"  Rule: Where a clock is supplied in the configuration, the EsiClient shall wait out the retry back-off on that clock.\n    The clock is the `Clock` port; cache age, retry back-off, rate-limit waits\n    and the circuit reset timeout read it, so a test or a host with its own\n    scheduler decides how long a back-off takes.\n\n    Scenario: A retried server status waits on the supplied clock\n      Given a client with a supplied clock\n      And ESI answers the server status with 503 once and then reports it\n      When the client requests the server status\n      Then the call shall resolve with the server status\n      And the supplied clock shall have been asked to wait before the retry","sourceStart":102,"findings":[]},{"id":"0060-custom-client#R10","title":"If a custom client is shut down, then the CustomEsiClient shall not shut down a cache store it was supplied.","line":115,"pattern":"unwanted-behaviour","exclusion":true,"verdict":"verified","evidence":"","charter":["TEST-11"],"tags":["@TEST-11"],"scenarios":[{"title":"A supplied cache store stays open after the custom client is shut down","line":119,"tags":[]}],"source":"  @TEST-11\n  Rule: If a custom client is shut down, then the CustomEsiClient shall not shut down a cache store it was supplied.\n    The application owns what it hands in and may share one store between\n    clients or processes, so `shutdown()` releases only what the client built.\n\n    Scenario: A supplied cache store stays open after the custom client is shut down\n      Given a custom client built with the \"status\" client over a supplied cache store\n      When the custom client is shut down twice\n      Then the supplied cache store shall not have been shut down","sourceStart":114,"findings":[]},{"id":"0060-custom-client#R11","title":"When a custom client's cache statistics are requested, the CustomEsiClient shall count the entries and hits of the cache its clients share.","line":126,"pattern":"event-driven","exclusion":false,"verdict":"verified","evidence":"","charter":[],"tags":[],"scenarios":[{"title":"A status cached and then served from the cache counts one entry and one hit","line":131,"tags":[]}],"source":"  Rule: When a custom client's cache statistics are requested, the CustomEsiClient shall count the entries and hits of the cache its clients share.\n    EsiClient has had `getCacheStats()` and `diagnostics`; the built client\n    gets the same methods, backed by the same `EsiDiagnostics` the runtime\n    uses.\n\n    Scenario: A status cached and then served from the cache counts one entry and one hit\n      Given a custom client built with the \"status\" client\n      And ESI reports the server status with an ETag\n      When the custom client requests the server status twice\n      Then the custom client's cache statistics shall report 1 entry and 1 hit","sourceStart":126,"findings":[]},{"id":"0060-custom-client#R12","title":"When a custom client's circuit breaker is reset, the CustomEsiClient shall send the next request for an endpoint whose circuit was open to ESI.","line":137,"pattern":"event-driven","exclusion":false,"verdict":"verified","evidence":"","charter":[],"tags":[],"scenarios":[{"title":"The server status is requested again after its open circuit is reset","line":140,"tags":[]}],"source":"  Rule: When a custom client's circuit breaker is reset, the CustomEsiClient shall send the next request for an endpoint whose circuit was open to ESI.\n    An operator who knows ESI has recovered need not wait out the reset timeout.\n\n    Scenario: The server status is requested again after its open circuit is reset\n      Given a custom client built with the \"status\" client and a circuit breaker that opens after 2 failures\n      And ESI answers the server status with 500 until the circuit opens\n      And ESI reports the server status\n      When the custom client requests the server status until the circuit opens\n      And the custom client's circuit breaker is reset\n      And the custom client requests the server status\n      Then the call shall resolve with the server status\n      And the client shall have sent 3 requests","sourceStart":137,"findings":[]},{"id":"0060-custom-client#R13","title":"When a domain method of a client in metadata mode answers once, the EsiClient shall resolve with the body and the response metadata read from the ESI headers.","line":152,"pattern":"event-driven","exclusion":false,"verdict":"verified","evidence":"","charter":[],"tags":[],"scenarios":[{"title":"The client in metadata mode reports the server status with its headers","line":158,"tags":[]}],"source":"  Rule: When a domain method of a client in metadata mode answers once, the EsiClient shall resolve with the body and the response metadata read from the ESI headers.\n    `withMetadata()` on the client hands out every domain client's metadata\n    view from one object, so an application does not call it per domain. The\n    metadata is built by the same `buildResponseMeta` the runtime's metadata\n    views use.\n\n    Scenario: The client in metadata mode reports the server status with its headers\n      Given ESI reports the server status with response headers\n      When the client in metadata mode requests the server status\n      Then the result shall hold the server status as its data\n      And the result's metadata shall report the ETag, expiry, page count and error limit ESI sent","sourceStart":152,"findings":[]},{"id":"0060-custom-client#R14","title":"When a domain method of a custom client in metadata mode answers once, the CustomEsiClient shall resolve with the body and the response metadata read from the ESI headers.","line":164,"pattern":"event-driven","exclusion":false,"verdict":"verified","evidence":"","charter":[],"tags":[],"scenarios":[{"title":"A custom client in metadata mode reports the server status with its headers","line":168,"tags":[]}],"source":"  Rule: When a domain method of a custom client in metadata mode answers once, the CustomEsiClient shall resolve with the body and the response metadata read from the ESI headers.\n    The built client's view holds the domains it was built with; a domain it\n    was not given is undefined there too.\n\n    Scenario: A custom client in metadata mode reports the server status with its headers\n      Given a custom client built with the \"status\" client\n      And ESI reports the server status with response headers\n      When the custom client in metadata mode requests the server status\n      Then the result shall hold the server status as its data\n      And the result's metadata shall report the ETag, expiry, page count and error limit ESI sent","sourceStart":164,"findings":[]},{"id":"0060-custom-client#R15","title":"If ESI answers a domain method of a client in safe mode with an error status, then the EsiClient shall resolve with ok set to false and the EsiError instead of rejecting.","line":175,"pattern":"unwanted-behaviour","exclusion":false,"verdict":"verified","evidence":"","charter":[],"tags":[],"scenarios":[{"title":"A missing server status arrives as a failed result","line":179,"tags":[]}],"source":"  Rule: If ESI answers a domain method of a client in safe mode with an error status, then the EsiClient shall resolve with ok set to false and the EsiError instead of rejecting.\n    `withSafeMode()` on the client gives every domain the result envelope the\n    domain clients' own `withSafeMode()` returns.\n\n    Scenario: A missing server status arrives as a failed result\n      Given ESI answers the server status with 404\n      When the client in safe mode requests the server status\n      Then the result shall not be ok and carry an EsiError with status 404","sourceStart":175,"findings":[]},{"id":"0060-custom-client#R16","title":"When a custom client calls an endpoint whose definition is marked deprecated, the CustomEsiClient shall log one warning through the client's logger naming the endpoint, its replacement and its sunset date.","line":184,"pattern":"event-driven","exclusion":false,"verdict":"verified","evidence":"","charter":[],"tags":[],"scenarios":[{"title":"A deprecated endpoint called through a custom client warns once","line":195,"tags":[]},{"title":"An endpoint that is not deprecated logs no warning","line":201,"tags":[]}],"source":"  Rule: When a custom client calls an endpoint whose definition is marked deprecated, the CustomEsiClient shall log one warning through the client's logger naming the endpoint, its replacement and its sunset date.\n    The first step of the deprecation process in guides/SEMVER.md is a\n    warning on every call. An endpoint definition carries it as\n    DeprecationInfo, and the stream and fetchAll page helpers warn the same\n    way. createEsi's generated operations word theirs with\n    the same helper, from the same guidance in\n    scripts/spec/operation-overlay.json; a unit test fails when the two\n    disagree about which routes are deprecated. No endpoint is deprecated\n    today, so the scenario marks the server status endpoint deprecated for\n    its duration.\n\n    Scenario: A deprecated endpoint called through a custom client warns once\n      Given the server status endpoint is marked deprecated in favour of the route status\n      And ESI reports the server status\n      When a custom client built with the \"status\" client and a recording logger requests the server status\n      Then the custom client's logger shall receive one warning naming the server status endpoint, the route status and the sunset date\n\n    Scenario: An endpoint that is not deprecated logs no warning\n      Given ESI reports the server status\n      When a custom client built with the \"status\" client and a recording logger requests the server status\n      Then the custom client's logger shall receive no warning","sourceStart":184,"findings":[]},{"id":"0060-custom-client#R17","title":"When a domain client built by EsiApiFactory.createClient reads its diagnostics, the EsiApiFactory client shall report the entries and hits of the cache it owns.","line":208,"pattern":"event-driven","exclusion":false,"verdict":"verified","evidence":"","charter":[],"tags":[],"scenarios":[{"title":"A factory-built status client reports its own cache","line":212,"tags":[]}],"source":"  Rule: When a domain client built by EsiApiFactory.createClient reads its diagnostics, the EsiApiFactory client shall report the entries and hits of the cache it owns.\n    A client built by name owns its pipeline, so its diagnostics read that\n    pipeline, as EsiClient's and CustomEsiClient's read theirs.\n\n    Scenario: A factory-built status client reports its own cache\n      Given ESI reports the server status with an ETag\n      And a \"status\" client built by EsiApiFactory.createClient\n      When the factory client requests the server status twice\n      Then the factory client's cache statistics shall report 1 entry and 1 hit","sourceStart":208,"findings":[]},{"id":"0060-custom-client#R18","title":"When a domain client built by EsiApiFactory.createClient is shut down, the EsiApiFactory client shall keep answering requests.","line":218,"pattern":"event-driven","exclusion":false,"verdict":"verified","evidence":"","charter":[],"tags":[],"scenarios":[{"title":"A factory-built status client still answers after it is shut down","line":222,"tags":[]}],"source":"  Rule: When a domain client built by EsiApiFactory.createClient is shut down, the EsiApiFactory client shall keep answering requests.\n    Shutting down stops the cleanup timers of the cache and circuit breaker the\n    factory built; requests still go through the pipeline.\n\n    Scenario: A factory-built status client still answers after it is shut down\n      Given ESI reports the server status\n      And a \"status\" client built by EsiApiFactory.createClient\n      When the factory client is shut down and then requests the server status\n      Then the call shall resolve with the server status\n      And the runtime shall have sent 1 request","sourceStart":218,"findings":[]}],"noUnwantedBehaviour":false,"orphanScenarios":0},{"file":"tests/bdd/features/core/0061-rate-limit-status.feature","area":"core","name":"Rate-limit status","tags":["@ARCH-04"],"charter":["ARCH-04"],"description":"ESI meters most routes by rate-limit group: each response names its group and says how many tokens of the group's budget are left, and a 420 or 429 says how long the group is closed. The rate limiter keeps what the last response said per group, and an application reads it back to pace its own work or to show why calls are waiting.\n\nThese scenarios send requests through the real pipeline with a rate limiter attached, answer them at the transport seam, and read the limiter's status.","boundBy":["tests/bdd/specs/core/0061-rate-limit-status.spec.ts"],"rules":[{"id":"0061-rate-limit-status#R1","title":"When a response reports the tokens left in its rate-limit group, the RateLimiter shall report those counts for that group.","line":12,"pattern":"event-driven","exclusion":false,"verdict":"verified","evidence":"","charter":[],"tags":[],"scenarios":[{"title":"The status group's token counts come from the response headers","line":16,"tags":[]}],"source":"  Rule: When a response reports the tokens left in its rate-limit group, the RateLimiter shall report those counts for that group.\n    The status comes from the headers ESI sent, not from the limiter's own\n    estimate, so it matches what ESI will enforce on the next request.\n\n    Scenario: The status group's token counts come from the response headers\n      Given a request pipeline with a rate limiter and no retries\n      And ESI reports the server status with 140 of 150 tokens left in the \"status\" group\n      When the pipeline requests the server status\n      Then the rate limiter shall report 140 of 150 tokens left and 10 used in the \"status\" group\n      And the rate limiter shall report no rate-limit group blocked","sourceStart":12,"findings":[]},{"id":"0061-rate-limit-status#R2","title":"While a rate-limit group is closed by a Retry-After, the RateLimiter shall report that group and the limiter as blocked until the Retry-After ends.","line":23,"pattern":"state-driven","exclusion":false,"verdict":"verified","evidence":"","charter":[],"tags":[],"scenarios":[{"title":"A 429 with Retry-After closes the status group for 30 seconds","line":27,"tags":[]}],"source":"  Rule: While a rate-limit group is closed by a Retry-After, the RateLimiter shall report that group and the limiter as blocked until the Retry-After ends.\n    A caller that checks before calling can wait out the block instead of\n    queueing requests the limiter would only hold back.\n\n    Scenario: A 429 with Retry-After closes the status group for 30 seconds\n      Given a request pipeline with a rate limiter and no retries\n      And ESI answers the server status with HTTP 429 and a Retry-After of 30 seconds in the \"status\" group\n      When the pipeline requests the server status\n      Then the rate limiter shall report the \"status\" group blocked for 30 seconds","sourceStart":23,"findings":[]}],"noUnwantedBehaviour":true,"orphanScenarios":0},{"file":"tests/bdd/features/core/0062-security-boundary.feature","area":"core","name":"Security boundary","tags":["@SEC-10"],"charter":["SEC-10","TEST-11"],"description":"The library trusts the consumer's code and configuration, and nothing that arrives from the network. Each Rule here holds one claimed property of the security model (guides/SECURITY-MODEL.md) against a hostile value ESI, EVE SSO or the SDE host could send, and is tagged with that property's id so the security model audit can find it.\n\nA guard applied at one entry point and not at its sibling is a gap, so a property with several entry points is one Rule with a scenario outline that walks every one of them.","boundBy":["tests/bdd/specs/core/0062-security-boundary.spec.ts"],"rules":[{"id":"0062-security-boundary#R1","title":"If ESI reports more than 1000 pages, then the client shall request no more than 1000 pages.","line":14,"pattern":"unwanted-behaviour","exclusion":false,"verdict":"verified","evidence":"","charter":[],"tags":["@sec-P8"],"scenarios":[{"title":"Every pagination entry point applies the same cap in either incompletePages mode","line":22,"tags":[]},{"title":"Every pagination entry point applies the same cap in either incompletePages mode","line":22,"tags":[]},{"title":"Every pagination entry point applies the same cap in either incompletePages mode","line":22,"tags":[]},{"title":"Every pagination entry point applies the same cap in either incompletePages mode","line":22,"tags":[]},{"title":"Every pagination entry point applies the same cap in either incompletePages mode","line":22,"tags":[]},{"title":"Every pagination entry point applies the same cap in either incompletePages mode","line":22,"tags":[]}],"source":"  @sec-P8\n  Rule: If ESI reports more than 1000 pages, then the client shall request no more than 1000 pages.\n    X-Pages is a number the remote chooses. Without a bound, a response\n    reporting a hundred million pages would start that many requests, so\n    every pagination path checks it against the same page limit. Under the\n    default incompletePages mode the walk stops at the limit with a warning;\n    with incompletePages set to throw it stops after page 1 with an\n    EsiPaginationError (0051-resilience.feature). The bound holds either way.\n\n    Scenario Outline: Every pagination entry point applies the same cap in either incompletePages mode\n      Given a client whose incompletePages option is \"\u003cmode>\"\n      And ESI reports an \"X-Pages\" value of 100000000 for a paged route\n      When the consumer walks the route through \u003centry point>\n      Then no more than 1000 page requests shall reach the transport\n      And the walk shall be \u003coutcome>\n\n      Examples:\n        | entry point             | mode     | outcome                |\n        | a paged client method   | truncate | cut off at page 1000   |\n        | the collecting iterator | truncate | cut off at page 1000   |\n        | the async page iterator | truncate | cut off at page 1000   |\n        | a paged client method   | throw    | refused as incomplete  |\n        | the collecting iterator | throw    | refused as incomplete  |\n        | the async page iterator | throw    | refused as incomplete  |","sourceStart":13,"findings":[]},{"id":"0062-security-boundary#R2","title":"If ESI answers with a redirect to another host, then the client shall not send the request or the token to that host.","line":39,"pattern":"unwanted-behaviour","exclusion":true,"verdict":"verified","evidence":"","charter":["TEST-11"],"tags":["@sec-P6","@TEST-11"],"scenarios":[{"title":"A redirect on an authenticated request is refused, not followed","line":44,"tags":[]}],"source":"  @sec-P6 @TEST-11\n  Rule: If ESI answers with a redirect to another host, then the client shall not send the request or the token to that host.\n    The host allowlist is checked once, on the base URL, so a followed\n    redirect would carry the request to a host nothing checked. The client\n    asks fetch not to follow redirects and refuses the 3xx it gets back.\n\n    Scenario: A redirect on an authenticated request is refused, not followed\n      Given ESI answers the wallet balance request with a redirect to \"https://attacker.example/wallet\"\n      When the client tries to request their wallet balance\n      Then the call shall be rejected with an EsiError saying \"Redirect refused\"\n      And every request shall have asked the transport not to follow redirects\n      And only one request shall have reached the transport","sourceStart":38,"findings":[]},{"id":"0062-security-boundary#R3","title":"If an SDE archive holds an entry whose name resolves outside the output directory, then the SDE extractor shall refuse the archive and write no file.","line":52,"pattern":"unwanted-behaviour","exclusion":false,"verdict":"verified","evidence":"","charter":[],"tags":["@sec-P9"],"scenarios":[{"title":"An archive entry that climbs out of the output directory is refused","line":62,"tags":[]},{"title":"An archive entry that is an absolute path is refused","line":62,"tags":[]},{"title":"An archive entry that starts with a Windows drive letter is refused","line":62,"tags":[]}],"source":"  @sec-P9\n  Rule: If an SDE archive holds an entry whose name resolves outside the output directory, then the SDE extractor shall refuse the archive and write no file.\n    Entry names come from the downloaded archive. The extractor checks every\n    name against the directory the caller named before it writes anything,\n    rather than relying on the installed adm-zip to sanitise them.\n\n    A name can leave the directory three ways: by climbing out with \"..\",\n    by being absolute, or by starting with a Windows drive letter. A drive\n    letter resolves inside the directory on Linux and macOS, so only the\n    name check stops it there; the archive is refused on every platform.\n\n    Scenario Outline: An archive entry that \u003cescapes> is refused\n      Given a ZIP archive holding an entry named \"\u003centry>\" beside \"types.yaml\"\n      And an empty extraction directory beside that archive\n      When I try to extract the archive to that directory\n      Then the extraction shall be refused with an SdeError saying \"would land outside\"\n      And no file shall have been written in or beside the extraction directory\n\n      Examples:\n        | escapes                              | entry             |\n        | climbs out of the output directory   | ../escaped.yaml   |\n        | is an absolute path                  | /tmp/escaped.yaml |\n        | starts with a Windows drive letter   | C:escaped.yaml    |","sourceStart":51,"findings":[]}],"noUnwantedBehaviour":false,"orphanScenarios":0},{"file":"tests/bdd/features/core/0063-custom-client-identity-views.feature","area":"core","name":"Identity views of the custom clients","tags":["@ARCH-08"],"charter":["ARCH-08"],"description":"An application that acts for several characters used to build one custom client per character, each with its own rate limiter, error budget and cache, or swap the token on one client between calls. `EsiClient.as(identity)` and `CustomEsiClient.as(identity)` hand out a view per character: the same domain clients, sending as that identity, over the client's one cache, rate limiter, circuit breaker and deduplicator (option D step 4, guides/CLIENT-ARCHITECTURE.md). The identity is the one `createEsi`'s `esi.as(identity)` takes: an EsiTokenManager character, a raw access token or a TokenProvider.\n\nThese scenarios drive the custom domain clients through the real request pipeline to the transport seam and read what went over the wire.","boundBy":["tests/bdd/specs/core/0063-custom-client-identity-views.spec.ts"],"rules":[{"id":"0063-custom-client-identity-views#R1","title":"When an identity view of an EsiClient requests an authenticated method, the EsiClient shall send the identity's current access token as the bearer.","line":18,"pattern":"event-driven","exclusion":false,"verdict":"verified","evidence":"","charter":[],"tags":[],"scenarios":[{"title":"A raw access token is sent as given","line":22,"tags":[]},{"title":"A custom token provider is asked for the token on each request","line":29,"tags":[]}],"source":"  Rule: When an identity view of an EsiClient requests an authenticated method, the EsiClient shall send the identity's current access token as the bearer.\n    The client the view came from holds no token, so the bearer can only come\n    from the view's identity.\n\n    Scenario: A raw access token is sent as given\n      Given an EsiClient that holds no token\n      And an identity view of the EsiClient for a character holding an access token\n      And ESI reports the character's wallet balance\n      When the identity view requests the character's wallet balance\n      Then the request shall carry the header \"Authorization\" with the value \"Bearer raw-access-token\"\n\n    Scenario: A custom token provider is asked for the token on each request\n      Given an EsiClient that holds no token\n      And an identity view of the EsiClient whose provider hands out a new token on each call\n      And ESI reports the character's wallet balance twice\n      When the identity view requests the character's wallet balance twice\n      Then the two requests shall carry the provider's first and second tokens","sourceStart":18,"findings":[]},{"id":"0063-custom-client-identity-views#R2","title":"When an identity view of a CustomEsiClient requests an authenticated method, the CustomEsiClient shall send the identity's current access token as the bearer.","line":36,"pattern":"event-driven","exclusion":false,"verdict":"verified","evidence":"","charter":[],"tags":[],"scenarios":[{"title":"A custom client's view sends its identity's token","line":40,"tags":[]}],"source":"  Rule: When an identity view of a CustomEsiClient requests an authenticated method, the CustomEsiClient shall send the identity's current access token as the bearer.\n    The builder's client gets the same views as EsiClient, over the domains it\n    was built with.\n\n    Scenario: A custom client's view sends its identity's token\n      Given a custom client built with the \"wallet\" client\n      And an identity view of the custom client for a character holding an access token\n      And ESI reports the character's wallet balance\n      When the custom client's identity view requests the character's wallet balance\n      Then the request shall carry the header \"Authorization\" with the value \"Bearer raw-access-token\"","sourceStart":36,"findings":[]},{"id":"0063-custom-client-identity-views#R3","title":"When an identity view follows the pages of an authenticated method, the EsiClient shall ask the identity for its token before each page.","line":47,"pattern":"event-driven","exclusion":false,"verdict":"verified","evidence":"","charter":[],"tags":[],"scenarios":[{"title":"A provider's newer token is sent for the second page","line":51,"tags":[]}],"source":"  Rule: When an identity view follows the pages of an authenticated method, the EsiClient shall ask the identity for its token before each page.\n    A walk over many pages can outlast a token; asking before each page sends\n    whatever token the identity holds by then, as `createEsi` views do.\n\n    Scenario: A provider's newer token is sent for the second page\n      Given an EsiClient that holds no token\n      And an identity view of the EsiClient whose provider hands out a new token on each call\n      And ESI reports the character's assets on two pages\n      When the identity view follows every page of the character's assets\n      Then the two requests shall carry the provider's first and second tokens","sourceStart":47,"findings":[]},{"id":"0063-custom-client-identity-views#R4","title":"When ESI answers 401 to an identity view whose identity can refresh, the EsiClient shall retry the request once with the refreshed token.","line":58,"pattern":"event-driven","exclusion":false,"verdict":"verified","evidence":"","charter":[],"tags":[],"scenarios":[{"title":"A managed token rejected by ESI is refreshed through SSO and the request retried","line":62,"tags":[]}],"source":"  Rule: When ESI answers 401 to an identity view whose identity can refresh, the EsiClient shall retry the request once with the refreshed token.\n    A token manager refreshes through SSO; the view installs that refresh as\n    the token provider its retry strategy calls after a 401.\n\n    Scenario: A managed token rejected by ESI is refreshed through SSO and the request retried\n      Given an EsiClient that holds no token\n      And an identity view of the EsiClient for a character managed by a token manager\n      And ESI rejects the character's token once and then reports the wallet balance\n      And SSO issues the character a fresh token\n      When the identity view requests the character's wallet balance\n      Then the call shall resolve with the wallet balance after two requests\n      And the request shall carry the character's fresh access token as the bearer","sourceStart":58,"findings":[]},{"id":"0063-custom-client-identity-views#R5","title":"If ESI answers 401 to an identity view whose identity cannot refresh, then the EsiClient shall reject the call with the 401 after a single request.","line":71,"pattern":"unwanted-behaviour","exclusion":false,"verdict":"verified","evidence":"","charter":[],"tags":[],"scenarios":[{"title":"A raw token rejected by ESI is not retried","line":76,"tags":[]},{"title":"A raw token rejected by ESI is not retried with the client's own refresh","line":83,"tags":[]}],"source":"  Rule: If ESI answers 401 to an identity view whose identity cannot refresh, then the EsiClient shall reject the call with the 401 after a single request.\n    A raw access token has no refresh, and a 401 is not retryable, so the\n    retry strategy has nothing to try again with. The view does not borrow the\n    client's own `onTokenRefresh`: that would refresh some other identity.\n\n    Scenario: A raw token rejected by ESI is not retried\n      Given an EsiClient that holds no token\n      And an identity view of the EsiClient for a character holding an access token\n      And ESI rejects the character's token\n      When the identity view requests the character's wallet balance\n      Then the call shall be rejected with status 401 after a single request\n\n    Scenario: A raw token rejected by ESI is not retried with the client's own refresh\n      Given an EsiClient that holds no token and refreshes through onTokenRefresh\n      And an identity view of the EsiClient for a character holding an access token\n      And ESI rejects the character's token\n      When the identity view requests the character's wallet balance\n      Then the call shall be rejected with status 401 after a single request","sourceStart":71,"findings":[]},{"id":"0063-custom-client-identity-views#R6","title":"While an identity view shares an EsiClient, the EsiClient shall serve a public entry cached through the view to the client without a request.","line":92,"pattern":"state-driven","exclusion":false,"verdict":"verified","evidence":"","charter":[],"tags":[],"scenarios":[{"title":"The server status fetched through a view is served to the client from the cache","line":96,"tags":[]}],"source":"  Rule: While an identity view shares an EsiClient, the EsiClient shall serve a public entry cached through the view to the client without a request.\n    The view and the client it came from hold one ETag cache, so a public\n    answer fetched once is fetched once for every character.\n\n    Scenario: The server status fetched through a view is served to the client from the cache\n      Given an EsiClient that holds no token\n      And an identity view of the EsiClient for a character holding an access token\n      And ESI reports the server status with an ETag\n      When the identity view requests the server status\n      And the EsiClient requests the server status\n      Then the runtime shall have sent 1 request","sourceStart":92,"findings":[]},{"id":"0063-custom-client-identity-views#R7","title":"While two identity views share an EsiClient, the EsiClient shall keep each identity's authenticated entries apart.","line":104,"pattern":"state-driven","exclusion":false,"verdict":"verified","evidence":"","charter":[],"tags":[],"scenarios":[{"title":"A corporation wallet fetched by one character is not served to another","line":108,"tags":[]}],"source":"  Rule: While two identity views share an EsiClient, the EsiClient shall keep each identity's authenticated entries apart.\n    The cache keys an authenticated entry by the character the token names, so\n    one character's corporation wallets are never another's answer.\n\n    Scenario: A corporation wallet fetched by one character is not served to another\n      Given an EsiClient that holds no token\n      And identity views of the EsiClient for two characters of one corporation\n      And ESI reports the corporation wallets twice\n      When each identity view requests the corporation wallets\n      Then the runtime shall have sent 2 requests","sourceStart":104,"findings":[]},{"id":"0063-custom-client-identity-views#R8","title":"While the circuit for an endpoint is open, the EsiClient shall reject that endpoint from the client and every identity view without sending a request.","line":115,"pattern":"state-driven","exclusion":false,"verdict":"verified","evidence":"","charter":[],"tags":[],"scenarios":[{"title":"An endpoint that failed through a view is rejected for the client it came from","line":119,"tags":[]}],"source":"  Rule: While the circuit for an endpoint is open, the EsiClient shall reject that endpoint from the client and every identity view without sending a request.\n    A view shares the client's circuit breaker, so failures seen through one\n    character's view protect ESI from every other caller of the endpoint.\n\n    Scenario: An endpoint that failed through a view is rejected for the client it came from\n      Given an EsiClient that holds no token with a circuit breaker that opens after 2 failures\n      And an identity view of the EsiClient for a character holding an access token\n      And ESI answers the server status with 500 until the circuit opens\n      When the identity view requests the server status and the circuit opens\n      And the EsiClient requests the server status\n      Then the public request shall be rejected with CircuitOpenError\n      And the runtime shall have sent 2 requests","sourceStart":115,"findings":[]},{"id":"0063-custom-client-identity-views#R9","title":"If an access token is set on an identity view, then the EsiClient shall reject the call with a CONFIGURATION_ERROR.","line":130,"pattern":"unwanted-behaviour","exclusion":false,"verdict":"verified","evidence":"","charter":[],"tags":[],"scenarios":[{"title":"Setting an access token on a view is refused","line":134,"tags":[]}],"source":"  Rule: If an access token is set on an identity view, then the EsiClient shall reject the call with a CONFIGURATION_ERROR.\n    A view that could change its token would no longer be the identity it was\n    asked for; `as()` with another identity is the way to another character.\n\n    Scenario: Setting an access token on a view is refused\n      Given an EsiClient that holds no token\n      And an identity view of the EsiClient for a character holding an access token\n      When an access token is set on the identity view\n      Then the call shall be rejected with a configuration error","sourceStart":130,"findings":[]}],"noUnwantedBehaviour":false,"orphanScenarios":0},{"file":"tests/bdd/features/core/0064-public-custom-client.feature","area":"core","name":"Public custom client built from chosen API clients","tags":["@ARCH-08"],"charter":["ARCH-08","TEST-11"],"description":"`EsiClientBuilder.buildPublic()` builds the chosen domain clients as a public-only CustomEsiClient: its type leaves out every method that needs a token, so such a call does not compile. It is the custom-client counterpart of `createEsi()`'s `esi.public` (0056-shared-runtime.feature), for an application such as a price checker that must never put a character's token on the wire, whatever the environment or a shared builder configuration holds.\n\nThese scenarios build the client through the real builder and drive it through the real request pipeline to the transport seam, then read what went over the wire.","boundBy":["tests/bdd/specs/core/0064-public-custom-client.spec.ts"],"rules":[{"id":"0064-public-custom-client#R1","title":"If a configured request interceptor adds an Authorization header, then the public custom client shall not send an Authorization header.","line":18,"pattern":"unwanted-behaviour","exclusion":true,"verdict":"verified","evidence":"","charter":["TEST-11"],"tags":["@TEST-11"],"scenarios":[{"title":"A bearer added by a request interceptor is withheld from the server status request","line":24,"tags":[]}],"source":"  @TEST-11\n  Rule: If a configured request interceptor adds an Authorization header, then the public custom client shall not send an Authorization header.\n    An interceptor configured for every client, such as an auth middleware an\n    application installs once, would otherwise put a bearer back on a request\n    the public client sends. The builder withholds the header after every\n    interceptor has run.\n\n    Scenario: A bearer added by a request interceptor is withheld from the server status request\n      Given a public custom client built with the \"status\" client and a request interceptor that adds a bearer\n      And ESI reports the server status\n      When the public custom client requests the server status\n      Then the request shall not carry the header \"Authorization\"","sourceStart":17,"findings":[]},{"id":"0064-public-custom-client#R2","title":"If an access token is held by ESI_ACCESS_TOKEN or the builder, then the public custom client shall not send an Authorization header.","line":31,"pattern":"unwanted-behaviour","exclusion":true,"verdict":"verified","evidence":"","charter":["TEST-11"],"tags":["@TEST-11"],"scenarios":[{"title":"A token in ESI_ACCESS_TOKEN is not sent","line":36,"tags":[]},{"title":"A token given to the builder is not sent","line":43,"tags":[]}],"source":"  @TEST-11\n  Rule: If an access token is held by ESI_ACCESS_TOKEN or the builder, then the public custom client shall not send an Authorization header.\n    `build()` falls back to ESI_ACCESS_TOKEN and takes the builder's token;\n    `buildPublic()` ignores both, so a deployment that exports a token for\n    another tool does not leak it through a public client.\n\n    Scenario: A token in ESI_ACCESS_TOKEN is not sent\n      Given ESI_ACCESS_TOKEN holds an access token\n      And a public custom client built with the \"status\" client\n      And ESI reports the server status\n      When the public custom client requests the server status\n      Then the request shall not carry the header \"Authorization\"\n\n    Scenario: A token given to the builder is not sent\n      Given a public custom client built with the \"status\" client from a builder holding an access token\n      And ESI reports the server status\n      When the public custom client requests the server status\n      Then the request shall not carry the header \"Authorization\"","sourceStart":30,"findings":[]},{"id":"0064-public-custom-client#R3","title":"If an authenticated method is invoked on a public custom client, then the public custom client shall reject the call with NO_AUTH_TOKEN without sending a request.","line":51,"pattern":"unwanted-behaviour","exclusion":false,"verdict":"verified","evidence":"","charter":[],"tags":[],"scenarios":[{"title":"A wallet request forced through a public custom client is refused before the wire","line":56,"tags":[]},{"title":"A wallet request forced through a public custom client with a bearer interceptor is refused before the wire","line":62,"tags":[]}],"source":"  Rule: If an authenticated method is invoked on a public custom client, then the public custom client shall reject the call with NO_AUTH_TOKEN without sending a request.\n    The type forbids the call, so only a cast reaches it. The pipeline then\n    finds no token to attach and refuses before the request leaves, rather\n    than spending ESI's error budget on a certain 401.\n\n    Scenario: A wallet request forced through a public custom client is refused before the wire\n      Given ESI_ACCESS_TOKEN holds an access token\n      And a public custom client built with the \"wallet\" client from a builder holding an access token\n      When an authenticated wallet request is forced through the public custom client\n      Then the call shall be rejected with NO_AUTH_TOKEN and no request shall be sent\n\n    Scenario: A wallet request forced through a public custom client with a bearer interceptor is refused before the wire\n      Given a public custom client built with the \"wallet\" client and a request interceptor that adds a bearer\n      When an authenticated wallet request is forced through the public custom client\n      Then the call shall be rejected with NO_AUTH_TOKEN and no request shall be sent","sourceStart":51,"findings":[]}],"noUnwantedBehaviour":false,"orphanScenarios":0},{"file":"tests/bdd/features/core/0065-shared-cache-store.feature","area":"core","name":"Invalidation across clients sharing a cache store","tags":["@ARCH-04"],"charter":["ARCH-04","TEST-11"],"description":"A cache store given as the `cache` option can be shared by clients in several processes, as a Redis instance is. A write through one client invalidates the entries under the written path, but the store has no call that lists keys, so a client can drop only the entries it wrote itself. A store that also implements the optional `publishInvalidation` and `onInvalidate` pair (src/core/ports/CacheStore.ts) carries each invalidation to every other holder, which then drops the entries it wrote under that path.\n\nThese scenarios give two seam EsiClients, a reader and a writer, their own handles on one shared store, as two processes would hold, and count what reaches the transport seam.","boundBy":["tests/bdd/specs/core/0065-shared-cache-store.spec.ts"],"rules":[{"id":"0065-shared-cache-store#R1","title":"When an EsiClient writes to a path over a cache store that carries invalidations, every other EsiClient on that store shall send its next read of that path to ESI.","line":18,"pattern":"event-driven","exclusion":false,"verdict":"verified","evidence":"","charter":[],"tags":[],"scenarios":[{"title":"Contacts cached by the reader are fetched again after the writer adds a contact","line":23,"tags":[]}],"source":"  Rule: When an EsiClient writes to a path over a cache store that carries invalidations, every other EsiClient on that store shall send its next read of that path to ESI.\n    The reader cached the contact list before the writer added a contact; its\n    entry is still inside the spec TTL, so only the published invalidation\n    stops it serving the list without the new contact.\n\n    Scenario: Contacts cached by the reader are fetched again after the writer adds a contact\n      Given two EsiClients sharing a cache store that carries invalidations\n      And ESI reports the character's contac
