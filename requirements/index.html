he server status\n      And the 30 second spec cache TTL of the server status has elapsed\n      And ESI answers the revalidation of the server status with HTTP 304\n      When the client requests the server status with metadata\n      Then the client resolves with the cached server status from a 304 revalidation\n      And the revalidation request carried the cached server status ETag in If-None-Match\n\n    Scenario: HTTP 503 more than an hour after the server status TTL has elapsed rejects\n      Given a client whose ETag cache holds the server status\n      And more than one hour past the spec cache TTL of the server status has elapsed\n      And ESI answers the server status request with HTTP 503 on every attempt\n      When the client requests the server status\n      Then the client rejects with an EsiError carrying status 503\n      And the client sent 5 requests","sourceStart":281,"findings":[]},{"id":"0050-etag-caching#R17","title":"When a revalidation is answered with HTTP 304, the ETag cache shall restart the freshness TTL of the cached entry.","line":315,"pattern":"event-driven","exclusion":false,"verdict":"verified","evidence":"","charter":[],"tags":[],"scenarios":[{"title":"Server status revalidated by a 304 is served without a request 20 seconds later","line":321,"tags":[]}],"source":"  Rule: When a revalidation is answered with HTTP 304, the ETag cache shall restart the freshness TTL of the cached entry.\n    A 304 is ESI confirming that the stored body is still current, so the entry\n    is as fresh as a new 200 would have made it. Without the restart, every\n    request after the first TTL elapsed would go to ESI until the entry was\n    discarded.\n\n    Scenario: Server status revalidated by a 304 is served without a request 20 seconds later\n      Given a client whose ETag cache holds the server status\n      And the 30 second spec cache TTL of the server status has elapsed\n      And ESI answers the revalidation of the server status with HTTP 304\n      When the client requests the server status twice, 20 seconds apart\n      Then both calls resolve with the cached server status\n      And the client sent 2 requests","sourceStart":315,"findings":[]},{"id":"0050-etag-caching#R18","title":"The ETag cache shall report the stored entry count, the configured maximum entry count, and the timestamps of the oldest and newest entries.","line":331,"pattern":"ubiquitous","exclusion":false,"verdict":"verified","evidence":"","charter":[],"tags":[],"scenarios":[{"title":"Cache statistics report entry counts and age bounds","line":336,"tags":[]}],"source":"  Rule: The ETag cache shall report the stored entry count, the configured maximum entry count, and the timestamps of the oldest and newest entries.\n    Callers embedding this client in a long-running process need to see\n    whether the cache is filling up and how stale its contents are. These\n    four values are the minimum needed to answer both questions.\n\n    Scenario: Cache statistics report entry counts and age bounds\n      Given multiple cached responses exist\n      When the client requests cache statistics\n      Then the client shall return detailed information about cache usage","sourceStart":331,"findings":[]},{"id":"0050-etag-caching#R19","title":"When the cache is cleared, the ETag cache shall discard every stored entry.","line":341,"pattern":"event-driven","exclusion":false,"verdict":"verified","evidence":"","charter":[],"tags":[],"scenarios":[{"title":"Clearing the cache removes every stored entry","line":346,"tags":[]}],"source":"  Rule: When the cache is cleared, the ETag cache shall discard every stored entry.\n    Long-lived processes need a way to drop cached state — after a token\n    switch, for instance, where cached data may belong to a different\n    character.\n\n    Scenario: Clearing the cache removes every stored entry\n      Given a cache with stored responses\n      When the client clears the cache\n      Then all cached data shall be removed","sourceStart":341,"findings":[]},{"id":"0050-etag-caching#R20","title":"When the cache configuration is updated with a new maximum entry count, the ETag cache shall report the new limit in its statistics.","line":351,"pattern":"event-driven","exclusion":false,"verdict":"verified","evidence":"","charter":[],"tags":[],"scenarios":[{"title":"Updated maximum entry count is reflected in statistics","line":355,"tags":[]}],"source":"  Rule: When the cache configuration is updated with a new maximum entry count, the ETag cache shall report the new limit in its statistics.\n    The bound is adjustable at runtime so an embedding application can react\n    to memory pressure without rebuilding the client.\n\n    Scenario: Updated maximum entry count is reflected in statistics\n      Given a client with initial cache settings\n      When the client updates the cache configuration\n      Then the new settings shall take effect","sourceStart":351,"findings":[]},{"id":"0050-etag-caching#R21","title":"Where ETag caching is disabled, the EsiClient shall return null from getCacheStats.","line":360,"pattern":"optional-feature","exclusion":false,"verdict":"verified","evidence":"","charter":[],"tags":[],"scenarios":[{"title":"Cache statistics are unavailable when caching is disabled","line":366,"tags":[]}],"source":"  Rule: Where ETag caching is disabled, the EsiClient shall return null from getCacheStats.\n    Disabling the feature removes the cache entirely rather than leaving an\n    inert empty one, so getCacheStats returns null instead of a zeroed record.\n    That distinction lets callers tell \"caching is off\" from \"caching is on\n    and cold\".\n\n    Scenario: Cache statistics are unavailable when caching is disabled\n      Given a client with ETag caching disabled\n      When the client makes API requests without cache\n      Then responses shall be returned normally without caching","sourceStart":360,"findings":[]},{"id":"0050-etag-caching#R22","title":"When the access token is replaced by another EVE SSO token for the same character, the ETag cache shall serve that character's stored entries under the new token.","line":373,"pattern":"event-driven","exclusion":false,"verdict":"verified","evidence":"","charter":[],"tags":[],"scenarios":[{"title":"Structure orders revalidated by a 304 after the access token is replaced","line":383,"tags":[]},{"title":"Token refresh after a 401 keeps the character's cached entry","line":394,"tags":[]}],"source":"  Rule: When the access token is replaced by another EVE SSO token for the same character, the ETag cache shall serve that character's stored entries under the new token.\n    An EVE SSO access token is a JWT whose sub claim names the character, and\n    a refresh rotates the token without changing the character. The cache\n    keys authenticated entries by that character id rather than by the token,\n    so a refresh, whether the caller sets a new token or the 401 path obtains\n    one, keeps every ETag the character has earned. The character id is read\n    from the token without verifying its signature, so the new token sends\n    the character's ETag as If-None-Match and ESI's 304 is what serves the\n    entry: a 304 is ESI accepting the token and the entry in one answer.\n\n    Scenario: Structure orders revalidated by a 304 after the access token is replaced\n      Given a client holding an SSO access token for character 90000001\n      And ESI answers the structure orders request with an ETag\n      And the client has requested the structure orders\n      When the access token is replaced by a new SSO token for character 90000001\n      And the structure orders TTL has elapsed\n      And ESI answers the revalidation of the structure orders with HTTP 304\n      And the client requests the structure orders again\n      Then the client resolves with the cached structure orders from a 304 revalidation\n      And the revalidation request carried the cached structure orders ETag in If-None-Match\n\n    Scenario: Token refresh after a 401 keeps the character's cached entry\n      Given a client whose refresh provider issues a new SSO token for character 90000001\n      And ESI answers the structure orders request with an ETag\n      And the client has requested the structure orders\n      When the structure orders TTL has elapsed\n      And ESI answers the next structure orders request with HTTP 401 and the retry with HTTP 304\n      And the client requests the structure orders again\n      Then the client resolves with the cached structure orders from a 304 revalidation\n      And the client sent 3 requests, the last carrying the cached structure orders ETag in If-None-Match","sourceStart":373,"findings":[]},{"id":"0050-etag-caching#R23","title":"If two EVE SSO access tokens carry different character ids, then the ETag cache shall keep a separate entry for each character.","line":405,"pattern":"unwanted-behaviour","exclusion":false,"verdict":"verified","evidence":"","charter":["SEC-10"],"tags":["@sec-P4","@SEC-10"],"scenarios":[{"title":"A second character's structure orders are fetched rather than served from the first character's entry","line":411,"tags":[]}],"source":"  @sec-P4 @SEC-10\n  Rule: If two EVE SSO access tokens carry different character ids, then the ETag cache shall keep a separate entry for each character.\n    A structure's order book, a corporation's wallet or a character's own\n    location answer differently for every character that asks, so an entry\n    stored for one character is never an answer for another, whatever the\n    URL.\n\n    Scenario: A second character's structure orders are fetched rather than served from the first character's entry\n      Given a client holding an SSO access token for character 90000001\n      And ESI answers the structure orders request with an ETag\n      And the client has requested the structure orders\n      When the access token is replaced by an SSO token for character 90000002\n      And ESI answers the structure orders request with an ETag\n      And the client requests the structure orders again\n      Then the second structure orders request carried no If-None-Match header\n      And the cache holds 2 entries","sourceStart":404,"findings":[]},{"id":"0050-etag-caching#R24","title":"If an access token is not an EVE SSO JWT, then the ETag cache shall scope that token's entries by a hash of the token.","line":422,"pattern":"unwanted-behaviour","exclusion":false,"verdict":"verified","evidence":"","charter":["SEC-02"],"tags":["@SEC-02"],"scenarios":[{"title":"An opaque token replaced by another opaque token fetches the structure orders afresh","line":428,"tags":[]}],"source":"  @SEC-02\n  Rule: If an access token is not an EVE SSO JWT, then the ETag cache shall scope that token's entries by a hash of the token.\n    A token that names no character (a raw string in a test, a token from\n    another issuer) has no identity to key by except itself. The hash keeps\n    the token out of cache keys, which reach logs and statistics, and two\n    such tokens never share an entry even when they belong to one person.\n\n    Scenario: An opaque token replaced by another opaque token fetches the structure orders afresh\n      Given a client holding an opaque access token\n      And ESI answers the structure orders request with an ETag\n      And the client has requested the structure orders\n      When the access token is replaced by a different opaque token\n      And ESI answers the structure orders request with an ETag\n      And the client requests the structure orders again\n      Then the second structure orders request carried no If-None-Match header\n      And the cache holds 2 entries","sourceStart":421,"findings":[]},{"id":"0050-etag-caching#R25","title":"If the current access token is one ESI has not yet answered, then the ETag cache shall serve no stored entry for it without a request.","line":439,"pattern":"unwanted-behaviour","exclusion":false,"verdict":"verified","evidence":"","charter":["SEC-10"],"tags":["@sec-P4","@SEC-10"],"scenarios":[{"title":"A replaced token that ESI rejects is served nothing from the character's entry","line":448,"tags":[]},{"title":"A replaced token is served from the spec TTL only after ESI has answered it","line":458,"tags":[]}],"source":"  @sec-P4 @SEC-10\n  Rule: If the current access token is one ESI has not yet answered, then the ETag cache shall serve no stored entry for it without a request.\n    The character a token names is read without verifying the token, so it is\n    a claim until ESI has answered a request under that token with 2xx or\n    304. A forged token naming a character, set on a client that holds that\n    character's entries, would otherwise be served them from the spec TTL or\n    on a server error before ESI ever saw it. Until ESI accepts a token the\n    client keys it by a hash of the token itself, and the character's entry\n    is reached only through a conditional request that ESI answers.\n\n    Scenario: A replaced token that ESI rejects is served nothing from the character's entry\n      Given a client holding an SSO access token for character 90000001\n      And ESI answers the structure orders request with an ETag\n      And the client has requested the structure orders\n      When the access token is replaced by a new SSO token for character 90000001\n      And ESI answers the next structure orders request with HTTP 401\n      And the client requests the structure orders again\n      Then the client rejects with an EsiError carrying status 401\n      And the client sent 2 requests\n\n    Scenario: A replaced token is served from the spec TTL only after ESI has answered it\n      Given a client holding an SSO access token for character 90000001\n      And ESI answers the structure orders request with an ETag\n      And the client has requested the structure orders\n      When the access token is replaced by a new SSO token for character 90000001\n      And ESI answers the revalidation of the structure orders with HTTP 304\n      And the client requests the structure orders twice more\n      Then the client sent 2 requests","sourceStart":438,"findings":[]}],"noUnwantedBehaviour":false,"orphanScenarios":0},{"file":"tests/bdd/features/core/0051-resilience.feature","area":"core","name":"Resilience and Error Recovery","tags":["@ARCH-04"],"charter":["ARCH-04","TEST-11","DES-08","SEC-10"],"description":"Every request leaving this library passes through a retry strategy and, where enabled, a per-endpoint circuit breaker before it reaches the transport, and every failure comes back to the caller as a typed error. This file pins down that behaviour: when an attempt is repeated, when it is not, when the circuit stops attempting altogether, and which error type surfaces for a 401, a 429, a timeout and a non-retryable status.\n\nThe first Rules exercise the circuit breaker and retry strategy directly, because both are swappable strategies with their own contracts (ICircuitBreaker, RetryStrategy) that any replacement has to meet. The Rules from \"Retry classes\" on drive a real EsiClient against HTTP responses. They are the single statement of which failures are retried, how the circuit moves between states, and when identical requests share one HTTP call. Domain features point here rather than restating them. Serving a cached body when ESI fails is an ETag cache behaviour, specified in 0050-etag-caching.feature.","boundBy":["tests/bdd/step-definitions/core/resilience.steps.ts"],"rules":[{"id":"0051-resilience#R1","title":"When recorded consecutive failures for an endpoint reach the configured failure threshold, the circuit breaker shall move that endpoint to the open state and reject further calls to it with CircuitOpenError.","line":23,"pattern":"event-driven","exclusion":false,"verdict":"verified","evidence":"","charter":[],"tags":[],"scenarios":[{"title":"Third consecutive 503 opens a circuit with a threshold of three","line":29,"tags":[]}],"source":"  Rule: When recorded consecutive failures for an endpoint reach the configured failure threshold, the circuit breaker shall move that endpoint to the open state and reject further calls to it with CircuitOpenError.\n    The breaker exists to stop a failing endpoint from consuming the shared ESI\n    error budget. State is tracked per endpoint, so one dead route does not\n    stop traffic to healthy ones. Once open, checkCircuit refuses the call\n    before any HTTP request is built.\n\n    Scenario: Third consecutive 503 opens a circuit with a threshold of three\n      Given a client with circuit breaker enabled\n      And the endpoint fails with 503 errors\n      When the client makes requests until the circuit opens\n      Then the circuit breaker shall be in the open state","sourceStart":23,"findings":[]},{"id":"0051-resilience#R2","title":"When the reset timeout has elapsed and the probe call that follows succeeds, the circuit breaker shall return the endpoint to the closed state.","line":35,"pattern":"event-driven","exclusion":false,"verdict":"verified","evidence":"","charter":[],"tags":[],"scenarios":[{"title":"Probe succeeding after the reset timeout closes the circuit","line":40,"tags":[]}],"source":"  Rule: When the reset timeout has elapsed and the probe call that follows succeeds, the circuit breaker shall return the endpoint to the closed state.\n    An open circuit is a temporary state, not a permanent one. After the reset\n    timeout the next checkCircuit lets a single probe through; a success on\n    that probe clears the failure count and traffic resumes at full rate.\n\n    Scenario: Probe succeeding after the reset timeout closes the circuit\n      Given a client with circuit breaker in open state\n      When the cooldown period expires and a probe request succeeds\n      Then the circuit breaker shall transition to closed state","sourceStart":35,"findings":[]},{"id":"0051-resilience#R3","title":"When an attempt fails with a retryable error and a later attempt succeeds, the retry strategy shall return the successful result to the caller.","line":47,"pattern":"event-driven","exclusion":false,"verdict":"verified","evidence":"","charter":[],"tags":[],"scenarios":[{"title":"Second attempt succeeds after a 503 on the first","line":52,"tags":[]}],"source":"  Rule: When an attempt fails with a retryable error and a later attempt succeeds, the retry strategy shall return the successful result to the caller.\n    Transient 5xx responses are common on ESI and are the reason retry exists.\n    The caller sees only the eventual success — the intermediate failure is not\n    surfaced as an error or as a partial result.\n\n    Scenario: Second attempt succeeds after a 503 on the first\n      Given a client with retry configured for 2 attempts\n      And the endpoint fails once then succeeds\n      When the client makes a request\n      Then the client shall return the successful response","sourceStart":47,"findings":[]},{"id":"0051-resilience#R4","title":"If every attempt fails with a retryable error, then the retry strategy shall invoke the operation once more than the configured maxRetries and rethrow the last error unchanged.","line":58,"pattern":"unwanted-behaviour","exclusion":false,"verdict":"verified","evidence":"","charter":[],"tags":[],"scenarios":[{"title":"Persistent 503 runs three attempts and rethrows the 503","line":64,"tags":[]}],"source":"  Rule: If every attempt fails with a retryable error, then the retry strategy shall invoke the operation once more than the configured maxRetries and rethrow the last error unchanged.\n    Retry has to terminate. With maxRetries set to 2 the operation runs three\n    times in total — the initial attempt plus two retries — and the error from\n    the final attempt is the one the caller receives, with its status code\n    intact.\n\n    Scenario: Persistent 503 runs three attempts and rethrows the 503\n      Given a client with retry configured for 2 attempts\n      And the endpoint always returns 503\n      When the client makes a request\n      Then the client shall throw a 503 error after all retries","sourceStart":58,"findings":[]},{"id":"0051-resilience#R5","title":"If an error is classified as non-retryable, then the retry strategy shall invoke the operation exactly once and rethrow that error.","line":70,"pattern":"unwanted-behaviour","exclusion":false,"verdict":"verified","evidence":"","charter":[],"tags":[],"scenarios":[{"title":"404 is rethrown after a single attempt despite maxRetries of three","line":76,"tags":[]}],"source":"  Rule: If an error is classified as non-retryable, then the retry strategy shall invoke the operation exactly once and rethrow that error.\n    A 404 means the resource is absent, not that the server is struggling, so\n    repeating the call cannot change the outcome. Bypassing retry for these\n    statuses keeps latency low and protects the ESI error budget, and it holds\n    regardless of how high maxRetries is configured.\n\n    Scenario: 404 is rethrown after a single attempt despite maxRetries of three\n      Given a client with retry configured for 3 attempts\n      And the endpoint returns 404\n      When the client makes a request\n      Then the client shall throw a 404 error without retrying","sourceStart":70,"findings":[]},{"id":"0051-resilience#R6","title":"When an authenticated request fails with 401, the retry strategy shall invoke the refreshToken callback and return the result of the retried attempt.","line":84,"pattern":"event-driven","exclusion":false,"verdict":"verified","evidence":"","charter":[],"tags":[],"scenarios":[{"title":"401 on an authenticated endpoint is replayed after refreshing","line":90,"tags":[]}],"source":"  Rule: When an authenticated request fails with 401, the retry strategy shall invoke the refreshToken callback and return the result of the retried attempt.\n    Access tokens expire mid-session, and the 401 is the first the client hears\n    of it. Refreshing and replaying the request keeps that invisible to the\n    caller. This path applies only where the request context is marked\n    requiresAuth.\n\n    Scenario: 401 on an authenticated endpoint is replayed after refreshing\n      Given a client with a token provider\n      And the endpoint returns 401 then succeeds after token refresh\n      When the client makes an authenticated request\n      Then the client shall return the response after token refresh","sourceStart":84,"findings":[]},{"id":"0051-resilience#R7","title":"If a request answered with 401 is replayed after a token refresh, then the retry strategy shall not count the replay against maxRetries.","line":97,"pattern":"unwanted-behaviour","exclusion":true,"verdict":"verified","evidence":"","charter":["TEST-11"],"tags":["@TEST-11"],"scenarios":[{"title":"A strategy allowed no retries still replays a request after a refresh","line":102,"tags":[]}],"source":"  @TEST-11\n  Rule: If a request answered with 401 is replayed after a token refresh, then the retry strategy shall not count the replay against maxRetries.\n    The refresh is a separate budget of one per call (ERRORS.md, \"The 401\n    refresh path\"). Counting the replay would leave a client configured with\n    no retries unable to recover from an expired token at all.\n\n    Scenario: A strategy allowed no retries still replays a request after a refresh\n      Given a retry strategy allowed no retries, with a token refresh callback\n      And the endpoint returns 401 then succeeds after token refresh\n      When the client makes an authenticated request\n      Then the client shall return the response after token refresh\n      And the operation ran twice with one refresh between the attempts","sourceStart":96,"findings":[]},{"id":"0051-resilience#R8","title":"If the refreshToken callback rejects, then the retry strategy shall throw an EsiTokenRefreshError whose cause is the rejection.","line":109,"pattern":"unwanted-behaviour","exclusion":false,"verdict":"verified","evidence":"","charter":[],"tags":[],"scenarios":[{"title":"Rejecting refresh callback surfaces a token refresh failure","line":116,"tags":[]}],"source":"  Rule: If the refreshToken callback rejects, then the retry strategy shall throw an EsiTokenRefreshError whose cause is the rejection.\n    A refresh failure is a credential problem, not a transport problem, and the\n    caller needs to be able to tell the two apart to decide whether to\n    re-authenticate the user. The original 401 is replaced by an error naming\n    the refresh, and what the callback threw, such as a TokenRevokedError, stays\n    reachable on cause instead of being flattened into the message.\n\n    Scenario: Rejecting refresh callback surfaces a token refresh failure\n      Given a client with a failing token provider\n      And the endpoint returns 401\n      When the client makes an authenticated request\n      Then the client shall throw a token refresh failed error\n      And the error's cause is the TokenRevokedError the token provider threw","sourceStart":109,"findings":[]},{"id":"0051-resilience#R9","title":"If every attempt at a request is answered with 429, then the EsiClient shall reject the call with an EsiError carrying status code 429.","line":125,"pattern":"unwanted-behaviour","exclusion":false,"verdict":"verified","evidence":"","charter":[],"tags":[],"scenarios":[{"title":"429 response reaches the caller as an EsiError with status 429","line":132,"tags":[]}],"source":"  Rule: If every attempt at a request is answered with 429, then the EsiClient shall reject the call with an EsiError carrying status code 429.\n    ESI signals error-limit exhaustion with 429. Surfacing it as an EsiError\n    with the status code preserved lets a caller distinguish backpressure from\n    a genuine failure. A 429 is retryable, so the rejection comes only once the\n    retry budget is spent; this scenario's client has no retries, so its one\n    attempt is every attempt.\n\n    Scenario: 429 response reaches the caller as an EsiError with status 429\n      Given a client configured for the status endpoint\n      And the server returns 429 Too Many Requests\n      When the client requests the server status\n      Then the client shall throw a 429 rate limit error","sourceStart":125,"findings":[]},{"id":"0051-resilience#R10","title":"If a request is answered with an error status that carries no reason phrase, then the EsiClient shall reject with an EsiError whose message names that status.","line":138,"pattern":"unwanted-behaviour","exclusion":false,"verdict":"verified","evidence":"","charter":[],"tags":[],"scenarios":[{"title":"HTTP 502 without a reason phrase is named in the error","line":144,"tags":[]},{"title":"HTTP 418 without a reason phrase is named in the error","line":144,"tags":[]}],"source":"  Rule: If a request is answered with an error status that carries no reason phrase, then the EsiClient shall reject with an EsiError whose message names that status.\n    HTTP/2 has no reason phrase, so a status the client keeps no text of its\n    own for would otherwise reach the caller with an empty message. Known\n    statuses keep their usual text; any other status reads HTTP followed by its\n    code. An HTML error page from a proxy adds nothing to the message.\n\n    Scenario Outline: HTTP \u003cstatus> without a reason phrase is named in the error\n      Given a client configured for the status endpoint\n      And ESI answers the server status request with HTTP \u003cstatus>, no reason phrase and an HTML page\n      When the client requests the server status\n      Then the client rejects with an EsiError carrying status \u003cstatus> and the message \"\u003cmessage>\"\n\n      Examples:\n        | status | message     |\n        | 502    | Bad Gateway |\n        | 418    | HTTP 418    |","sourceStart":138,"findings":[]},{"id":"0051-resilience#R11","title":"If every attempt at a request exceeds the configured timeout, then the EsiClient shall reject the call with a TimeoutError.","line":155,"pattern":"unwanted-behaviour","exclusion":false,"verdict":"verified","evidence":"","charter":[],"tags":[],"scenarios":[{"title":"Unresponsive endpoint reaches the caller as a TimeoutError","line":161,"tags":[]},{"title":"A body that stops arriving after the headers reaches the caller as a TimeoutError","line":167,"tags":[]}],"source":"  Rule: If every attempt at a request exceeds the configured timeout, then the EsiClient shall reject the call with a TimeoutError.\n    A distinct error type matters here because a timeout carries no HTTP status\n    and no response body. TimeoutError extends EsiError with status code 0, and\n    status 0 is retryable, so a timed-out attempt is repeated while retries\n    remain; this scenario's client has none.\n\n    Scenario: Unresponsive endpoint reaches the caller as a TimeoutError\n      Given a client configured with a short timeout\n      And the endpoint does not respond in time\n      When the client makes a request\n      Then the client shall throw a timeout error\n\n    Scenario: A body that stops arriving after the headers reaches the caller as a TimeoutError\n      Given a client configured with a short timeout\n      And the endpoint sends its headers and then stops sending the body\n      When the client makes a request\n      Then the client shall throw a timeout error","sourceStart":155,"findings":[]},{"id":"0051-resilience#R12","title":"If every attempt at a request fails before a response arrives for a reason other than the timeout, then the EsiClient shall reject the call with an EsiNetworkError.","line":173,"pattern":"unwanted-behaviour","exclusion":false,"verdict":"verified","evidence":"","charter":[],"tags":[],"scenarios":[{"title":"A refused connection on every attempt reaches the caller as an EsiNetworkError","line":179,"tags":[]}],"source":"  Rule: If every attempt at a request fails before a response arrives for a reason other than the timeout, then the EsiClient shall reject the call with an EsiNetworkError.\n    A refused connection, a failed DNS lookup or a reset carries no HTTP\n    status. EsiNetworkError extends EsiError with status code 0 and is\n    retryable, like a timeout, but it is a class of its own so a caller can\n    tell a network fault from a slow server. The socket error is on cause.\n\n    Scenario: A refused connection on every attempt reaches the caller as an EsiNetworkError\n      Given a client configured for the status endpoint\n      And ESI refuses the connection for the server status request\n      When the client requests the server status\n      Then the client rejects with an EsiNetworkError that is retryable and is not a TimeoutError","sourceStart":173,"findings":[]},{"id":"0051-resilience#R13","title":"If the transport rejects a request with an EsiError, then the EsiClient shall reject the call with that error unchanged.","line":185,"pattern":"unwanted-behaviour","exclusion":false,"verdict":"verified","evidence":"","charter":[],"tags":[],"scenarios":[{"title":"A configuration error thrown by the transport reaches the caller as itself","line":192,"tags":[]}],"source":"  Rule: If the transport rejects a request with an EsiError, then the EsiClient shall reject the call with that error unchanged.\n    A transport is normally fetch, whose rejections are network faults. A\n    transport that already speaks the SDK's errors, such as a test double\n    refusing a request it has no answer for, means what it throws: wrapping it\n    as an EsiNetworkError would rename the fault and retry it with the\n    caller's backoff.\n\n    Scenario: A configuration error thrown by the transport reaches the caller as itself\n      Given a client configured for the status endpoint\n      And the transport rejects the server status request with a configuration error\n      When the client requests the server status\n      Then the client rejects with that same configuration error\n      And the client sent 1 request","sourceStart":185,"findings":[]},{"id":"0051-resilience#R14","title":"If an authenticated endpoint is called while no access token is configured, then the EsiClient shall reject the call with an EsiConfigurationError carrying the code NO_AUTH_TOKEN without issuing an HTTP request.","line":199,"pattern":"unwanted-behaviour","exclusion":false,"verdict":"verified","evidence":"","charter":[],"tags":[],"scenarios":[{"title":"Online status requested without an access token is refused as a configuration fault","line":205,"tags":[]}],"source":"  Rule: If an authenticated endpoint is called while no access token is configured, then the EsiClient shall reject the call with an EsiConfigurationError carrying the code NO_AUTH_TOKEN without issuing an HTTP request.\n    A missing token is a setup fault the caller fixes in code. It arrives as an\n    EsiError subclass with a code, so instanceof and safe mode both keep it,\n    and its message carries the code once rather than behind a second\n    ESIJS_ERROR prefix.\n\n    Scenario: Online status requested without an access token is refused as a configuration fault\n      Given a client configured with no access token\n      When the client requests a character's online status\n      Then the client rejects with an EsiConfigurationError carrying the code NO_AUTH_TOKEN\n      And the client sent 0 requests","sourceStart":199,"findings":[]},{"id":"0051-resilience#R15","title":"If ESI answers a request with a body that is not valid JSON, then the EsiClient shall reject the call with an EsiParseError that is not retryable.","line":211,"pattern":"unwanted-behaviour","exclusion":false,"verdict":"verified","evidence":"","charter":[],"tags":[],"scenarios":[{"title":"A server status answered with an HTML page is rejected as a parse error","line":216,"tags":[]}],"source":"  Rule: If ESI answers a request with a body that is not valid JSON, then the EsiClient shall reject the call with an EsiParseError that is not retryable.\n    A 200 whose body does not parse is a broken response, not a transient\n    fault, so it is not repeated. EsiParseError carries the code\n    JSON_PARSE_ERROR and the parser's error on cause.\n\n    Scenario: A server status answered with an HTML page is rejected as a parse error\n      Given a client configured for the status endpoint\n      And ESI answers the server status request with HTTP 200 and an HTML page\n      When the client requests the server status\n      Then the client rejects with an EsiParseError that is not retryable\n      And the client sent 1 request","sourceStart":211,"findings":[]},{"id":"0051-resilience#R16","title":"If ESI answers a GET request with a body that is not valid JSON, then the EsiClient shall not send the request again.","line":224,"pattern":"unwanted-behaviour","exclusion":true,"verdict":"verified","evidence":"","charter":["TEST-11"],"tags":["@TEST-11"],"scenarios":[{"title":"A server status answered with an HTML page is requested once","line":229,"tags":[]}],"source":"  @TEST-11\n  Rule: If ESI answers a GET request with a body that is not valid JSON, then the EsiClient shall not send the request again.\n    A body that does not parse is a broken response, and ESI's edge serves\n    the same HTML error page on the next attempt. The call rejects with the\n    EsiParseError above instead of spending the retry budget.\n\n    Scenario: A server status answered with an HTML page is requested once\n      Given a client configured for the status endpoint\n      And ESI answers the server status request with HTTP 200 and an HTML page\n      When the client requests the server status\n      Then the client sent 1 request","sourceStart":223,"findings":[]},{"id":"0051-resilience#R17","title":"While the circuit for an endpoint is open, the EsiClient shall resolve a safe-mode call to that endpoint with a failed result whose error is the CircuitOpenError.","line":235,"pattern":"state-driven","exclusion":false,"verdict":"verified","evidence":"","charter":[],"tags":[],"scenarios":[{"title":"A safe-mode call refused by an open circuit carries the CircuitOpenError","line":240,"tags":[]}],"source":"  Rule: While the circuit for an endpoint is open, the EsiClient shall resolve a safe-mode call to that endpoint with a failed result whose error is the CircuitOpenError.\n    Safe mode delivers every failure as a value typed EsiError. CircuitOpenError\n    extends EsiError, so the breaker's own error, with retryAfterMs, reaches the\n    caller instead of a status-0 copy that reports itself as retryable.\n\n    Scenario: A safe-mode call refused by an open circuit carries the CircuitOpenError\n      Given a client whose circuit breaker opens after 1 failure, with no retries\n      And ESI answers the server status request with HTTP 503 1 time\n      When the client requests the server status 2 times in safe mode\n      Then the last result has failed with a CircuitOpenError that is not retryable\n      And the client sent 1 request","sourceStart":235,"findings":[]},{"id":"0051-resilience#R18","title":"If a GET request is answered with HTTP 502, 503, or 504 while retries remain, then the EsiClient shall issue the same request again and resolve with the response to the retry.","line":249,"pattern":"unwanted-behaviour","exclusion":false,"verdict":"verified","evidence":"","charter":[],"tags":[],"scenarios":[{"title":"HTTP 502 on the first attempt is retried","line":256,"tags":[]},{"title":"HTTP 503 on the first attempt is retried","line":256,"tags":[]},{"title":"HTTP 504 on the first attempt is retried","line":256,"tags":[]}],"source":"  Rule: If a GET request is answered with HTTP 502, 503, or 504 while retries remain, then the EsiClient shall issue the same request again and resolve with the response to the retry.\n    These are the gateway and availability failures ESI returns around\n    downtime and under load, and an attempt moments later often succeeds. The\n    delay between attempts is exponential with jitter; the scenarios shrink it\n    to milliseconds. HTTP 500 is not in this class, as the non-retryable Rule\n    below states.\n\n    Scenario Outline: HTTP \u003cstatus> on the first attempt is retried\n      Given a client with retries enabled\n      And ESI answers the first server status request with HTTP \u003cstatus> and the retry with a payload\n      When the client requests the server status\n      Then the client resolves with the payload from the retry\n      And the client sent 2 requests\n\n      Examples:\n        | status |\n        | 502    |\n        | 503    |\n        | 504    |","sourceStart":249,"findings":[]},{"id":"0051-resilience#R19","title":"If a GET request is answered with HTTP 420 or 429 while retries remain, then the request pipeline shall issue the same request again.","line":269,"pattern":"unwanted-behaviour","exclusion":false,"verdict":"verified","evidence":"","charter":[],"tags":[],"scenarios":[{"title":"HTTP 420 on the first attempt is retried once the rate limiter allows it","line":277,"tags":[]},{"title":"HTTP 429 on the first attempt is retried once the rate limiter allows it","line":277,"tags":[]}],"source":"  Rule: If a GET request is answered with HTTP 420 or 429 while retries remain, then the request pipeline shall issue the same request again.\n    Both statuses mean the caller is being throttled, not that the request is\n    wrong. In production the rate limiter first blocks the whole rate-limit\n    group, for the Retry-After period or 60 seconds when none is given, so the\n    retry leaves only after that wait. These scenarios run the rate limiter in\n    test mode, as the unit suite does, so they pin the decision to retry and\n    not the wait.\n\n    Scenario Outline: HTTP \u003cstatus> on the first attempt is retried once the rate limiter allows it\n      Given a request pipeline with retries enabled and its rate limiter in test mode\n      And ESI answers the first server status request with HTTP \u003cstatus> and the retry with a payload\n      When the client requests the server status\n      Then the client resolves with the payload from the retry\n      And the client sent 2 requests\n\n      Examples:\n        | status |\n        | 420    |\n        | 429    |","sourceStart":269,"findings":[]},{"id":"0051-resilience#R20","title":"When a 420 or 429 response carries a Retry-After header in HTTP-date form, the rate limiter shall block the rate-limit group of the request until that date.","line":289,"pattern":"event-driven","exclusion":false,"verdict":"verified","evidence":"","charter":[],"tags":[],"scenarios":[{"title":"A 429 whose Retry-After is a date 30 seconds ahead blocks the group until then","line":295,"tags":[]}],"source":"  Rule: When a 420 or 429 response carries a Retry-After header in HTTP-date form, the rate limiter shall block the rate-limit group of the request until that date.\n    RFC 9110 lets Retry-After be a number of seconds or an HTTP date. Read as a\n    number of seconds, a date is not a number, and a block that ends at no\n    point in time never clears: every later request in the group went through\n    the limiter's ten re-checks and logged a warning at each one.\n\n    Scenario: A 429 whose Retry-After is a date 30 seconds ahead blocks the group until then\n      Given a request pipeline without retries\n      And ESI answers the server status request with HTTP 429 and a Retry-After date 30 seconds ahead\n      When the client requests the server status\n      Then the status rate-limit group is blocked until the Retry-After date","sourceStart":289,"findings":[]},{"id":"0051-resilience#R21","title":"If a GET request exceeds the configured timeout while retries remain, then the EsiClient shall issue the same request again.","line":301,"pattern":"unwanted-behaviour","exclusion":false,"verdict":"verified","evidence":"","charter":[],"tags":[],"scenarios":[{"title":"A timed-out first attempt is retried","line":306,"tags":[]}],"source":"  Rule: If a GET request exceeds the configured timeout while retries remain, then the EsiClient shall issue the same request again.\n    A timeout reaches the retry strategy as a TimeoutError with status code 0,\n    which it treats as transient: the server may only have been slow. A caller\n    that needs a hard deadline sets retries to 0.\n\n    Scenario: A timed-out first attempt is retried\n      Given a client with retries enabled and a 50 millisecond timeout\n      And ESI holds the first server status request past the timeout and answers the retry at once\n      When the client requests the server status\n      Then the client resolves with the payload from the retry\n      And the client sent 2 requests","sourceStart":301,"findings":[]},{"id":"0051-resilience#R22","title":"If the connection of a GET request drops before the response body is complete while retries remain, then the EsiClient shall issue the same request again.","line":313,"pattern":"unwanted-behaviour","exclusion":false,"verdict":"verified","evidence":"","charter":[],"tags":[],"scenarios":[{"title":"A connection reset part way through the body is retried","line":320,"tags":[]}],"source":"  Rule: If the connection of a GET request drops before the response body is complete while retries remain, then the EsiClient shall issue the same request again.\n    A reset part way through the body is a network failure, like a reset before\n    the headers: the attempt fails with an EsiError of status code 0 whose\n    message starts Network request failed, and the retry strategy treats it as\n    transient. It is not a malformed body, so it is not reported as a JSON\n    parse error, which is never retried.\n\n    Scenario: A connection reset part way through the body is retried\n      Given a client with retries enabled\n      And ESI resets the connection part way through the first server status body and answers the retry with a payload\n      When the client requests the server status\n      Then the client resolves with the payload from the retry\n      And the client sent 2 requests","sourceStart":313,"findings":[]},{"id":"0051-resilience#R23","title":"If a GET request is answered with HTTP 400, 401, 403, 404, or 500, then the EsiClient shall not send the request again.","line":328,"pattern":"unwanted-behaviour","exclusion":true,"verdict":"verified","evidence":"","charter":["TEST-11"],"tags":["@TEST-11"],"scenarios":[{"title":"HTTP 400 is rejected without a retry","line":335,"tags":[]},{"title":"HTTP 401 is rejected without a retry","line":335,"tags":[]},{"title":"HTTP 403 is rejected without a retry","line":335,"tags":[]},{"title":"HTTP 404 is rejected without a retry","line":335,"tags":[]},{"title":"HTTP 500 is rejected without a retry","line":335,"tags":[]}],"source":"  @TEST-11\n  Rule: If a GET request is answered with HTTP 400, 401, 403, 404, or 500, then the EsiClient shall not send the request again.\n    These statuses describe the request or a fault the retry strategy does not\n    classify as transient, and repeating the call spends the ESI error budget\n    for the same answer. The call rejects with an EsiError carrying the status. The retryable classes are exactly 0 (timeout), 420,\n    429, 502, 503 and 504. A 401 is replayed once after a token refresh, and\n    only where a refresh callback is configured; this client has none.\n\n    Scenario Outline: HTTP \u003cstatus> is rejected without a retry\n      Given a client with retries enabled\n      And ESI answers the server status request with HTTP \u003cstatus>\n      When the client requests the server status\n      Then the client rejects with an EsiError carrying status \u003cstatus>\n      And the client sent 1 request\n\n      Examples:\n        | status |\n        | 400    |\n        | 401    |\n        | 403    |\n        | 404    |\n        | 500    |","sourceStart":327,"findings":[]},{"id":"0051-resilience#R24","title":"If a non-GET request is answered with HTTP 503, then the EsiClient shall not send the request again.","line":351,"pattern":"unwanted-behaviour","exclusion":true,"verdict":"verified","evidence":"","charter":["TEST-11"],"tags":["@TEST-11"],"scenarios":[{"title":"A name resolution POST answered with 503 is not retried","line":356,"tags":[]}],"source":"  @TEST-11\n  Rule: If a non-GET request is answered with HTTP 503, then the EsiClient shall not send the request again.\n    A POST, PUT or DELETE may already have taken effect when the error comes\n    back, and repeating it could apply it twice. The call rejects with the\n    503's EsiError unless retryMutations is set, below.\n\n    Scenario: A name resolution POST answered with 503 is not retried\n      Given a client with retries enabled\n      And ESI answers the name resolution request with HTTP 503\n      When the client posts identifiers for name resolution\n      Then the client rejects with an EsiError carrying status 503\n      And the client sent 1 request","sourceStart":350,"findings":[]},{"id":"0051-resilience#R25","title":"Where retryMutations is enabled, the EsiClient shall issue a non-GET request answered with HTTP 503 again.","line":363,"pattern":"optional-feature","exclusion":false,"verdict":"verified","evidence":"","charter":[],"tags":[],"scenarios":[{"title":"A name resolution POST answered with 503 is retried when mutations may be retried","line":367,"tags":[]}],"source":"  Rule: Where retryMutations is enabled, the EsiClient shall issue a non-GET request answered with HTTP 503 again.\n    For endpoints the caller knows to be idempotent, such as name resolution,\n    opting in restores the same retry behaviour GET requests have.\n\n    Scenario: A name resolution POST answered with 503 is retried when mutations may be retried\n      Given a client with retries enabled for mutations\n      And ESI answers the first name resolution request with HTTP 503 and the retry with names\n      When the client posts identifiers for name resolution\n      Then the client resolves with the names from the retry\n      And the client sent 2 requests","sourceStart":363,"findings":[]},{"id":"0051-resilience#R26","title":"If a non-GET request issued by a stream or fetch-all helper is answered with HTTP 503, then the EsiClient shall not send the request again.","line":375,"pattern":"unwanted-behaviour","exclusion":true,"verdict":"verified","evidence":"","charter":["DES-08","TEST-11"],"tags":["@DES-08","@TEST-11"],"scenarios":[{"title":"Streaming name resolution answered with 503 is not retried","line":380,"tags":[]}],"source":"  @DES-08 @TEST-11\n  Rule: If a non-GET request issued by a stream or fetch-all helper is answered with HTTP 503, then the EsiClient shall not send the request again.\n    The stream and fetch-all helpers take the endpoint's method from its\n    definition. The retry decision must see that method too, or a mutation\n    requested through a helper is retried as if it were a GET.\n\n    Scenario: Streaming name resolution answered with 503 is not retried\n      Given a client with retries enabled\n      And ESI answers the name resolution request with HTTP 503\n      When the client streams name resolution for one identifier\n      Then the client rejects with an EsiError carrying status 503\n      And the client sent 1 POST request","sourceStart":374,"findings":[]},{"id":"0051-resilience#R27","title":"While the circuit for an endpoint is open, the EsiClient shall reject calls to that endpoint with CircuitOpenError without issuing an HTTP request.","line":389,"pattern":"state-driven","exclusion":false,"verdict":"verified","evidence":"","charter":[],"tags":[],"scenarios":[{"title":"A call after the failure threshold is refused without a request","line":394,"tags":[]}],"source":"  Rule: While the circuit for an endpoint is open, the EsiClient shall reject calls to that endpoint with CircuitOpenError without issuing an HTTP request.\n    The breaker exists to stop spending the error budget on an endpoint that is\n    failing, so the refusal comes before the rate limiter and before fetch. The\n    circuit breaker is opt-in through enableCircuitBreaker.\n\n    Scenario: A call after the failure threshold is refused without a request\n      Given a client whose circuit breaker opens after 2 failures, with no retries\n      And ESI answers the server status request with HTTP 503 2 times\n      When the client requests the server status 3 times\n      Then the first 2 calls reject with an EsiError carrying status 503\n      And the last call rejects with CircuitOpenError\n      And the client sent 2 requests","sourceStart":389,"findings":[]},{"id":"0051-resilience#R28","title":"While the circuit for one endpoint is open, the EsiClient shall continue to issue requests to other endpoints.","line":402,"pattern":"state-driven","exclusion":false,"verdict":"verified","evidence":"","charter":[],"tags":[],"scenarios":[{"title":"An open server status circuit leaves the dogma attribute index reachable","line":406,"tags":[]}],"source":"  Rule: While the circuit for one endpoint is open, the EsiClient shall continue to issue requests to other endpoints.\n    Circuits are keyed by the resolved request path, so an outage on one\n    endpoint does not cut the client off from the rest of ESI.\n\n    Scenario: An open server status circuit leaves the dogma attribute index reachable\n      Given a client whose circuit breaker opens after 1 failure, with no retries\n      And the circuit for the server status endpoint has opened\n      And ESI answers the dogma attribute index request with a payload\n      When the client requests the dogma attribute index\n      Then the client resolves with the dogma attribute identifiers\n      And the circuit for the server status endpoint is open\n      And the client sent 2 requests","sourceStart":402,"findings":[]},{"id":"0051-resilience#R29","title":"If an endpoint answers with a 4xx status other than 420 or 429, then the circuit breaker shall not count the response towards opening the circuit.","line":416,"pattern":"unwanted-behaviour","exclusion":true,"verdict":"verified","evidence":"","charter":["TEST-11"],"tags":["@TEST-11"],"scenarios":[{"title":"Repeated 404s leave the circuit closed","line":422,"tags":[]}],"source":"  @TEST-11\n  Rule: If an endpoint answers with a 4xx status other than 420 or 429, then the circuit breaker shall not count the response towards opening the circuit.\n    A 404 or a 403 describes the request, not the health of the endpoint.\n    Counting them would let one caller's unknown identifiers shut an endpoint\n    for every other call sharing the client. Status 420 and 429, 5xx, and\n    transport failures all count.\n\n    Scenario: Repeated 404s leave the circuit closed\n      Given a client whose circuit breaker opens after 2 failures, with no retries\n      And ESI answers the server status request with HTTP 404 3 times\n      When the client requests the server status 3 times\n      Then the first 3 calls reject with an EsiError carrying status 404\n      And the circuit for the server status endpoint is closed\n      And the client sent 3 requests","sourceStart":415,"findings":[]},{"id":"0051-resilience#R30","title":"If the probe request issued after the reset timeout fails, then the circuit breaker shall return the endpoint to the open state.","line":430,"pattern":"unwanted-behaviour","exclusion":false,"verdict":"verified","evidence":"","charter":[],"tags":[],"scenarios":[{"title":"A failed probe reopens the circuit","line":434,"tags":[]}],"source":"  Rule: If the probe request issued after the reset timeout fails, then the circuit breaker shall return the endpoint to the open state.\n    A failed probe is evidence the endpoint is still down, so the circuit\n    reopens and the reset timeout starts again from the probe's failure.\n\n    Scenario: A failed probe reopens the circuit\n      Given a client whose circuit breaker opens after 1 failure and resets after 50 milliseconds, with no retries or deduplication\n      And the circuit for the server status endpoint has opened\n      And the reset timeout has elapsed\n      And ESI answers the server status probe with HTTP 503\n      When the client requests the server status 2 times\n      Then the first call rejects with an EsiError carrying status 503\n      And the last call rejects with CircuitOpenError\n      And the client sent 2 requests","sourceStart":430,"findings":[]},{"id":"0051-resilience#R31","title":"While the probe for a half-open circuit is in flight, the EsiClient shall reject further calls to that endpoint with CircuitOpenError without issuing an HTTP request.","line":444,"pattern":"state-driven","exclusion":false,"verdict":"verified","evidence":"","charter":[],"tags":[],"scenarios":[{"title":"A second call while the probe is in flight is refused without a request","line":450,"tags":[]}],"source":"  Rule: While the probe for a half-open circuit is in flight, the EsiClient shall reject further calls to that endpoint with CircuitOpenError without issuing an HTTP request.\n    halfOpenMaxAttempts, default 1, is the number of probes a half-open circuit\n    admits. The call that moves the circuit from open to half-open is the\n    first of them; counting from the call after it would let one probe more\n    than configured reach an endpoint that has just been failing.\n\n    Scenario: A second call while the probe is in flight is refused without a request\n      Given a client whose circuit breaker opens after 1 failure and resets after 50 milliseconds, with no retries or deduplication\n      And the circuit for the server status endpoint has opened\n      And the reset timeout has elapsed\n      And ESI answers the server status probe with a payload after 100 milliseconds\n      When the client requests the server status twice at once\n      Then the first call resolves with the server status\n      And the last call rejects with CircuitOpenError\n      And the client sent 2 requests","sourceStart":444,"findings":[]},{"id":"0051-resilience#R32","title":"If a call admitted before the circuit opened succeeds while the circuit is open, then the circuit breaker shall keep the circuit open.","line":460,"pattern":"unwanted-behaviour","exclusion":false,"verdict":"verified","evidence":"","charter":[],"tags":[],"scenarios":[{"title":"A slow success that lands after the circuit opened leaves it open","line":466,"tags":[]}],"source":"  Rule: If a call admitted before the circuit opened succeeds while the circuit is open, then the circuit breaker shall keep the circuit open.\n    Calls already in flight when the threshold is reached still complete. Only\n    the probe issued after the reset timeout may close an open circuit; a late\n    success from an earlier call would otherwise close it at once, and under\n    concurrent traffic the breaker would never stay open.\n\n    Scenario: A slow success that lands after the circuit opened leaves it open\n      Given a client whose circuit breaker opens after 1 failure, with no retries or deduplication\n      And ESI answers the first server status request with a payload after 100 milliseconds\n      And ESI answers the second server status request with HTTP 503\n      When the client requests the server status twice at once\n      Then the first call resolves with the server status\n      And the last call rejects with an EsiError carrying status 503\n      And the circuit for the server status endpoint is open","sourceStart":460,"findings":[]},{"id":"0051-resilience#R33","title":"If the circuit opens while a call is still retrying, then the EsiClient shall reject that call with CircuitOpenError and issue no further attempt.","line":475,"pattern":"unwanted-behaviour","exclusion":false,"verdict":"verified","evidence":"","charter":[],"tags":[],"scenarios":[{"title":"The second of four attempts opens the circuit and ends the call","line":482,"tags":[]}],"source":"  Rule: If the circuit opens while a call is still retrying, then the EsiClient shall reject that call with CircuitOpenError and issue no further attempt.\n    Retry and circuit breaking compose: each failed attempt counts towards the\n    threshold, and the retry strategy passes CircuitOpenError straight through\n    rather than retrying it. A caller with both enabled can therefore receive\n    CircuitOpenError, not the last 5xx, from a call whose own attempts opened\n    the circuit.\n\n    Scenario: The second of four attempts opens the circuit and ends the call\n      Given a client whose circuit breaker opens after 2 failures, with retries enabled\n      And ESI answers the server status request with HTTP 503 2 times\n      When the client requests the server status\n      Then the client rejects with CircuitOpenError\n      And the client sent 2 requests","sourceStart":475,"findings":[]},{"id":"0051-resilience#R34","title":"If a page after the first exhausts its retries and nothing is cached for the resource, then the EsiClient shall repeat page 1 without an If-None-Match header.","line":489,"pattern":"unwanted-behaviour","exclusion":false,"verdict":"verified","evidence":"","charter":[],"tags":[],"scenarios":[{"title":"Market orders whose second page fails four times are fetched again from page 1","line":496,"tags":[]}],"source":"  Rule: If a page after the first exhausts its retries and nothing is cached for the resource, then the EsiClient shall repeat page 1 without an If-None-Match header.\n    The retry strategy repeats a failed paginated call from page 1. Page 1's\n    ETag names page 1 alone, so revalidating with it would let a 304 be\n    answered from a cache entry holding one page, and the call would resolve\n    with a prefix of the dataset. The first page is cached only once every\n    page has been fetched.\n\n    Scenario: Market orders whose second page fails four times are fetched again from page 1\n      Given a client with retries enabled\n      And ESI answers the market orders request with 2 pages, failing page 2 with HTTP 503 4 times\n      When the client requests the market orders\n      Then the client resolves with the orders from both pages\n      And the repeated page 1 request carried no If-None-Match header\n      And the client sent 7 requests","sourceStart":489,"findings":[]},{"id":"0051-resilience#R35","title":"If three consecutive cursor pages fail, then the cursor pagination handler shall reject with the error of the last failed page instead of returning the items fetched so far.","line":505,"pattern":"unwanted-behaviour","exclusion":false,"verdict":"verified","evidence":"","charter":["DES-08"],"tags":["@DES-08"],"scenarios":[{"title":"Corporation projects whose next page fails three times are not returned in part","line":509,"tags":[]}],"source":"  @DES-08\n  Rule: If three consecutive cursor pages fail, then the cursor pagination handler shall reject with the error of the last failed page instead of returning the items fetched so far.\n    A cursor walk that stops part way cannot tell the caller how much is\n    missing, so a partial result is an error rather than a short list.\n\n    Scenario: Corporation projects whose next page fails three times are not returned in part\n      Given a cursor pagination client without retries\n      And ESI answers every corporation projects page after the first with HTTP 503\n      When the handler fetches every corporation project after a first page of 1 project\n      Then the handler rejects with an EsiError carrying status 503\n      And the handler sent 3 requests","sourceStart":504,"findings":[]},{"id":"0051-resilience#R36","title":"When page 1 reports N pages and pages 2 to N each carry items, the EsiClient shall resolve with the items of pages 1 to N in page order.","line":526,"pattern":"event-driven","exclusion":false,"verdict":"verified","evidence":"","charter":["DES-08"],"tags":["@DES-08"],"scenarios":[{"title":"Market orders reported as exactly 1000 pages resolve with every page","line":533,"tags":[]},{"title":"A single empty page of market orders resolves with no orders","line":540,"tags":[]}],"source":"  @DES-08\n  Rule: When page 1 reports N pages and pages 2 to N each carry items, the EsiClient shall resolve with the items of pages 1 to N in page order.\n    Reaching the page count page 1 reported is the only evidence a walk has\n    that it holds the whole collection. A count of exactly 1000, the most any\n    path requests, is still a complete walk, and a single page with no items\n    is an empty collection rather than a short one. Either incompletePages\n    mode resolves it.\n\n    Scenario: Market orders reported as exactly 1000 pages resolve with every page\n      Given a client with retries enabled\n      And ESI answers the market orders request with 1000 pages of one order each\n      When the client requests the market orders\n      Then the client resolves with 1000 orders in page order\n      And the client sent 1000 requests\n\n    Scenario: A single empty page of market orders resolves with no orders\n      Given a client with retries enabled and incompletePages set to throw\n      And ESI answers the market orders request with one empty page\n      When the client requests the market orders\n      Then the client resolves with no orders\n      And the client sent 1 request","sourceStart":525,"findings":[]},{"id":"0051-resilience#R37","title":"Where incompletePages is left at its default, if a page after the first comes back empty, then the EsiClient shall stop the eager method and the stream helper at that page with the items of the pages before it.","line":548,"pattern":"complex","exclusion":false,"verdict":"verified","evidence":"","charter":["DES-08"],"tags":["@DES-08"],"scenarios":[{"title":"Market orders whose page 2 of 3 is empty resolve with page 1 through \u003centry point>","line":553,"tags":[]},{"title":"Market orders whose page 2 of 3 is empty resolve with page 1 through \u003centry point>","line":553,"tags":[]}],"source":"  @DES-08\n  Rule: Where incompletePages is left at its default, if a page after the first comes back empty, then the EsiClient shall stop the eager method and the stream helper at that page with the items of the pages before it.\n    This is the 12.x default, unchanged from earlier releases: an empty\n    page ends the walk and the pages before it are the result. Pages after\n    the empty one are not requested.\n\n    Scenario Outline: Market orders whose page 2 of 3 is empty resolve with page 1 through \u003centry point>\n      Given a client with retries enabled\n      And ESI answers the market orders request with 3 pages, page 2 empty\n      When the client collects the market orders through \u003centry point>\n      Then the client resolves with the orders before page 2\n      And the client sent 2 requests\n\n      Examples:\n        | entry point       |\n        | the eager method  |\n        | the stream helper |","sourceStart":547,"findings":[]},{"id":"0051-resilience#R38","title":"Where incompletePages is left at its default, if a page after the first comes back empty, then the fetch-all helper shall resolve with the items of every page that is not empty.","line":566,"pattern":"complex","exclusion":false,"verdict":"verified","evidence":"","charter":["DES-08"],"tags":["@DES-08"],"scenarios":[{"title":"Market orders whose page 2 of 3 is empty are collected around it by the fetch-all helper","line":572,"tags":[]}],"source":"  @DES-08\n  Rule: Where incompletePages is left at its default, if a page after the first comes back empty, then the fetch-all helper shall resolve with the items of every page that is not empty.\n    The fetch-all helper requests pages in concurrent waves, so it has\n    already asked for the pages after an empty one. Under the default it\n    keeps their items, as earlier releases did, rather than stopping where\n    the eager method stops.\n\n    Scenario: Market orders whose page 2 of 3 is empty are collected around it by the fetch-all helper\n      Given a client with retries enabled\n      And ESI answers the market orders request with 3 pages, page 2 empty and page 3 holding orders\n      When the client collects the market orders through the fetch-all helper\n      Then the client resolves with the orders of pages 1 and 3\n      And the client sent 3 requests","sourceStart":565,"findings":[]},{"id":"0051-resilience#R39","title":"Where incompletePages is left at its default, if a walk stops short of the pages page 1 reported, then the EsiClient shall log one warning that names the incompletePages option.","line":580,"pattern":"complex","exclusion":false,"verdict":"verified","evidence":"","charter":["DES-08"],"tags":["@DES-08"],"scenarios":[{"title":"A walk of market orders that stops at an empty page warns once","line":586,"tags":[]},{"title":"A walk of market orders reported as 1001 pages warns once at page 1000","line":592,"tags":[]}],"source":"  @DES-08\n  Rule: Where incompletePages is left at its default, if a walk stops short of the pages page 1 reported, then the EsiClient shall log one warning that names the incompletePages option.\n    A truncated result looks like a complete one, so the warning is the\n    only sign the caller gets. It names the option that turns the\n    truncation into an error, and carries the reason, the page count and\n    the pages fetched as context.\n\n    Scenario: A walk of market orders that stops at an empty page warns once\n      Given a client with retries enabled and a recording logger\n      And ESI answers the market orders request with 3 pages, page 2 empty\n      When the client collects the market orders through the eager method\n      Then the logger received one warning naming incompletePages for reason \"empty-page\"\n\n    Scenario: A walk of market orders reported as 1001 pages warns once at page 1000\n      Given a client with retries enabled and a recording logger\n      And ESI answers the market orders request with 1001 pages reported and 1000 pages of one order each\n      When the client collects the market orders through the eager method\n      Then the logger received one warning naming incompletePages for reason \"page-cap\"\n      And the client sent 1000 requests","sourceStart":579,"findings":[]},{"id":"0051-resilience#R40","title":"Where incompletePages is set to throw, if page 1 reports more than 1000 pages, then the EsiClient shall reject the walk with an EsiPaginationError whose reason is page-cap.","line":600,"pattern":"complex","exclusion":false,"verdict":"verified","evidence":"","charter":["DES-08"],"tags":["@DES-08"],"scenarios":[{"title":"Market orders reported as 1001 pages are refused after page 1 through \u003centry point>","line":606,"tags":[]},{"title":"Market orders reported as 1001 pages are refused after page 1 through \u003centry point>","line":606,"tags":[]},{"title":"Market orders reported as 1001 pages are refused after page 1 through \u003centry point>","line":606,"tags":[]}],"source":"  @DES-08\n  Rule: Where incompletePages is set to throw, if page 1 reports more than 1000 pages, then the EsiClient shall reject the walk with an EsiPaginationError whose reason is page-cap.\n    The client never requests past page 1000 (security model P8), so a count\n    above it can only end in a short list. The walk stops after page 1:\n    fetching 999 more pages only to reject would spend the error budget for\n    nothing. Page 1's items travel on the error as its partial result.\n\n    Scenario Outline: Market orders reported as 1001 pages are refused after page 1 through \u003centry point>\n      Given a client with retries enabled and incompletePages set to throw\n      And ESI answers the market orders request with page 1 reporting 1001 pages\n      When the client collects the market orders through \u003centry point>\n      Then the walk rejects with an EsiPaginationError whose reason is \"page-cap\"\n      And the error reports 1 fetched page of 1001 with the orders of page 1 as its partial result\n      And the client sent 1 request\n\n      Examples:\n        | entry point          |\n        | the eager method     |\n        | the fetch-all helper |\n        | the stream helper    |","sourceStart":599,"findings":[]},{"id":"0051-resilience#R41","title":"Where incompletePages is set to throw, if a page after the first that page 1 reported comes back empty, then the EsiClient shall reject the walk with an EsiPaginationError whose reason is empty-page.","line":621,"pattern":"complex","exclusion":false,"verdict":"verified","evidence":"","charter":["DES-08"],"tags":["@DES-08"],"scenarios":[{"title":"Market orders whose page \u003cempty page> of 3 is empty are refused through \u003centry point>","line":630,"tags":[]},{"title":"Market orders whose page \u003cempty page> of 3 is empty are refused through \u003centry point>","line":630,"tags":[]},{"title":"Market orders whose page \u003cempty page> of 3 is empty are refused through \u003centry point>","line":630,"tags":[]},{"title":"A stream of market orders whose page 2 of 3 is empty is refused after yielding page 1","line":644,"tags":[]}],"source":"  @DES-08\n  Rule: Where incompletePages is set to throw, if a page after the first that page 1 reported comes back empty, then the EsiClient shall reject the walk with an EsiPaginationError whose reason is empty-page.\n    ESI derives X-Pages from the item count, so in one snapshot every\n    reported page holds at least one item. An empty page means the\n    collection shrank while it was walked: later items moved onto pages\n    already read and were skipped. The last page is no exception, because a\n    page that no longer exists is answered with 404, which already rejects.\n    A stream has handed its pages over already, so its error counts them\n    rather than carrying them.\n\n    Scenario Outline: Market orders whose page \u003cempty page> of 3 is empty are refused through \u003centry point>\n      Given a client with retries enabled and incompletePages set to throw\n      And ESI answers the market orders request with 3 pages, page \u003cempty page> empty\n      When the client collects the market orders through \u003centry point>\n      Then the walk rejects with an EsiPaginationError whose reason is \"empty-page\"\n      And the error reports \u003cempty page> fetched pages of 3 with the orders before page \u003cempty page> as its partial result\n      And the client sent \u003crequests> requests\n\n      Examples:\n        | entry point          | empty page | requests |\n        | the eager method     | 2          | 2        |\n        | the eager method     | 3          | 3        |\n        | the fetch-all helper | 3          | 3        |\n\n    Scenario: A stream of market orders whose page 2 of 3 is empty is refused after yielding page 1\n      Given a client with retries enabled and incompletePages set to throw\n      And ESI answers the market orders request with 3 pages, page 2 empty\n      When the client streams the market orders\n      Then the walk rejects with an EsiPaginationError whose reason is \"empty-page\"\n      And the stream yielded the orders of page 1 before the error\n      And the error counts the orders of page 1 without carrying them\n      And the client sent 2 requests","sourceStart":620,"findings":[]},{"id":"0051-resilience#R42","title":"Where incompletePages is left at its default, if the cursor pagination handler reaches its page limit while the last page still carries an after cursor, then the cursor pagination handler shall resolve with the items of the pages fetched.","line":654,"pattern":"complex","exclusion":false,"verdict":"verified","evidence":"","charter":["DES-08"],"tags":["@DES-08"],"scenarios":[{"title":"Corporation projects that still have a next page at the limit resolve with the pages fetched","line":659,"tags":[]}],"source":"  @DES-08\n  Rule: Where incompletePages is left at its default, if the cursor pagination handler reaches its page limit while the last page still carries an after cursor, then the cursor pagination handler shall resolve with the items of the pages fetched.\n    This is the 12.x default, unchanged from earlier releases: the page\n    limit ends the walk and the pages fetched are the result, with the\n    warning the default logs for any walk it cuts short.\n\n    Scenario: Corporation projects that still have a next page at the limit resolve with the pages fetched\n      Given a cursor pagination client without retries\n      And ESI answers every corporation projects page with 1 project and an after cursor\n      When the handler fetches every corporation project after a first page of 1 project, at most 3 pages\n      Then the handler resolves with 3 projects\n      And the handler sent 2 requests","sourceStart":653,"findings":[]},{"id":"0051-resilience#R43","title":"Where incompletePages is set to throw, if the cursor pagination handler reaches its page limit while the last page still carries an after cursor, then the cursor pagination handler shall reject with an EsiPaginationError whose reason is cursor-cap.","line":667,"pattern":"complex","exclusion":false,"verdict":"verified","evidence":"","charter":["DES-08"],"tags":["@DES-08"],"scenarios":[{"title":"Corporation projects that still have a next page at the limit are not returned in part","line":672,"tags":[]}],"source":"  @DES-08\n  Rule: Where incompletePages is set to throw, if the cursor pagination handler reaches its page limit while the last page still carries an after cursor, then the cursor pagination handler shall reject with an EsiPaginationError whose reason is cursor-cap.\n    A cursor route reports no page count, so the after cursor is the only\n    sign that more data exists. Stopping at the limit with one in hand is a\n    short list, and the items fetched so far travel on the error.\n\n    Scenario: Corporation projects that still have a next page at the limit are not returned in part\n      Given a cursor pagination client without retries and incompletePages set to throw\n      And ESI answers every corporation projects page with 1 project and an after cursor\n      When the handler fetches every corporation project after a first page of 1 project, at most 3 pages\n      Then the handler rejects with an EsiPaginationError whose reason is \"cursor-cap\"\n      And the error reports 3 fetched pages with 3 projects as its partial result\n      And the handler sent 2 requests","sourceStart":666,"findings":[]},{"id":"0051-resilience#R44","title":"When a cursor page comes back empty or without an after cursor, the cursor pagination handler shall resolve with the items of every page fetched.","line":681,"pattern":"event-driven","exclusion":false,"verdict":"verified","evidence":"","charter":["DES-08"],"tags":["@DES-08"],"scenarios":[{"title":"Corporation projects ending in an empty page resolve in full","line":687,"tags":[]},{"title":"Corporation projects whose page at the limit has no after cursor resolve in full","line":694,"tags":[]}],"source":"  @DES-08\n  Rule: When a cursor page comes back empty or without an after cursor, the cursor pagination handler shall resolve with the items of every page fetched.\n    ESI marks the end of a cursor dataset with an empty page, and a page with\n    no after cursor has nothing after it. Either one proves the walk\n    complete, also on the last page the limit allows, under either\n    incompletePages mode.\n\n    Scenario: Corporation projects ending in an empty page resolve in full\n      Given a cursor pagination client without retries and incompletePages set to throw\n      And ESI answers the next corporation projects page with 1 project and then an empty page with an after cursor\n      When the handler fetches every corporation project after a first page of 1 project, at most 3 pages\n      Then the handler resolves with 2 projects\n      And the handler sent 2 requests\n\n    Scenario: Corporation projects whose page at the limit has no after cursor resolve in full\n      Given a cursor pagination client without retries and incompletePages set to throw\n      And ESI answers the next corporation projects page with 1 project and an after cursor, then 1 project without one\n      When the handler fetches every corporation project after a first page of 1 project, at most 3 pages\n      Then the handler resolves with 3 projects\n      And the handler sent 2 requests","sourceStart":680,"findings":[]},{"id":"0051-resilience#R45","title":"When identical GET requests are issued while the first is still in flight, the EsiClient shall issue one HTTP request and resolve every caller with its response.","line":703,"pattern":"event-driven","exclusion":false,"verdict":"verified","evidence":"","charter":[],"tags":[],"scenarios":[{"title":"Two concurrent server status requests share one HTTP request","line":710,"tags":[]}],"source":"  Rule: When identical GET requests are issued while the first is still in flight, the EsiClient shall issue one HTTP request and resolve every caller with its response.\n    Dashboards and fan-out code often ask for one resource from several places\n    at once. Coalescing the calls keeps duplicates off the ESI rate limit. The\n    key is the resolved request path, query string included, so requests that\n    differ by a path parameter or a page stay separate. Deduplication is on by\n    default.\n\n    Scenario: Two concurrent server status requests share one HTTP request\n      Given a client with request deduplication and no ETag cache\n      And ESI answers the server status request after 20 milliseconds with a payload\n      When the client requests the server status twice at once\n      Then both calls resolve with the payload\n      And the client sent 1 request","sourceStart":703,"findings":[]},{"id":"0051-resilience#R46","title":"When concurrent GET requests to one authenticated endpoint carry access tokens for different identities, the EsiClient
