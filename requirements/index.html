efresh","line":441,"tags":[]}],"source":"  Rule: If one token fails to refresh during a bulk refresh, then the token manager shall report that failure in its result and continue refreshing the remaining tokens.\n    A single revoked or broken token must not abort a scheduled bulk refresh\n    for an alliance's worth of characters. The method never rejects; each\n    character gets its own result with a status and, on failure, the error.\n\n    Scenario: One revoked token among three is reported while the other two refresh\n      Given a token manager backed by in-memory storage\n      And 3 characters are stored with access tokens expiring in 30 seconds\n      And the SSO token endpoint responds invalid_grant for the second character's refresh token\n      When refreshAll runs with a concurrency of 3\n      Then the result for the second character shall have status \"revoked\"\n      And the results for the other characters shall have status \"refreshed\"","sourceStart":436,"findings":[]},{"id":"0054-token-management#R31","title":"If a refresh during a bulk refresh fails with an SSO 429 or 5xx status, then the token manager shall flag that result as retryable.","line":449,"pattern":"unwanted-behaviour","exclusion":false,"verdict":"verified","evidence":"","charter":[],"tags":[],"scenarios":[{"title":"SSO 429 during bulk refresh yields a retryable failure","line":454,"tags":[]}],"source":"  Rule: If a refresh during a bulk refresh fails with an SSO 429 or 5xx status, then the token manager shall flag that result as retryable.\n    A rate-limited or outage response says nothing about the token itself.\n    Marking those failures retryable lets a scheduler pick them up on its\n    next pass while leaving revoked tokens for re-authentication.\n\n    Scenario: SSO 429 during bulk refresh yields a retryable failure\n      Given a token manager backed by in-memory storage\n      And 1 character is stored with an access token expiring in 30 seconds\n      And the SSO token endpoint responds 429 with error code \"rate_limited\"\n      When refreshAll runs with a concurrency of 3\n      Then the result for the first character shall have status \"failed\" and be retryable","sourceStart":449,"findings":[]},{"id":"0054-token-management#R32","title":"Where an SSO timeout is configured on the token manager, if SSO does not answer a refresh within it during a bulk refresh, then the token manager shall flag that result as retryable.","line":461,"pattern":"complex","exclusion":false,"verdict":"verified","evidence":"","charter":[],"tags":[],"scenarios":[{"title":"SSO that never answers during bulk refresh yields a retryable failure","line":466,"tags":[]}],"source":"  Rule: Where an SSO timeout is configured on the token manager, if SSO does not answer a refresh within it during a bulk refresh, then the token manager shall flag that result as retryable.\n    The manager passes ssoTimeoutMs to the SSO client it builds, so a hung\n    refresh ends and is reported like an SSO outage: the caller can retry the\n    character later.\n\n    Scenario: SSO that never answers during bulk refresh yields a retryable failure\n      Given a token manager backed by in-memory storage with an SSO timeout of 50 ms\n      And 1 character is stored with an access token expiring in 30 seconds\n      And the SSO token endpoint never responds\n      When refreshAll runs with a concurrency of 3\n      Then the result for the first character shall have status \"failed\" and be retryable\n      And the failure shall be an SsoError with error code \"timeout\"","sourceStart":461,"findings":[]},{"id":"0054-token-management#R33","title":"Where an expiringWithinMs threshold is given, the token manager shall refresh only tokens whose expiry falls within that window and report the others as skipped.","line":474,"pattern":"optional-feature","exclusion":false,"verdict":"verified","evidence":"","charter":[],"tags":[],"scenarios":[{"title":"Only the token inside the five-minute window is refreshed","line":479,"tags":[]}],"source":"  Rule: Where an expiringWithinMs threshold is given, the token manager shall refresh only tokens whose expiry falls within that window and report the others as skipped.\n    Refreshing a token that has fifteen minutes left wastes an SSO call and a\n    rotation. A staleness window lets a scheduler that runs every five\n    minutes refresh only what will expire before its next run.\n\n    Scenario: Only the token inside the five-minute window is refreshed\n      Given a token manager backed by in-memory storage\n      And character 2114794365 is stored with an access token expiring in 120 seconds\n      And character 95465499 is stored with an access token expiring in 1200 seconds\n      And the SSO token endpoint returns a token for each refresh after a short delay\n      When refreshAll runs with an expiringWithinMs of 300000\n      Then the result for character 2114794365 shall have status \"refreshed\"\n      And the result for character 95465499 shall have status \"skipped\"\n      And the SSO token endpoint shall have been called 1 time","sourceStart":474,"findings":[]},{"id":"0054-token-management#R34","title":"If a progress callback throws during a bulk refresh, then the token manager shall continue refreshing the remaining tokens and resolve with a result for every character.","line":489,"pattern":"unwanted-behaviour","exclusion":false,"verdict":"verified","evidence":"","charter":[],"tags":[],"scenarios":[{"title":"Throwing progress callback does not stop the run","line":494,"tags":[]}],"source":"  Rule: If a progress callback throws during a bulk refresh, then the token manager shall continue refreshing the remaining tokens and resolve with a result for every character.\n    Progress reporting is a courtesy to the caller, not part of the refresh.\n    A bug in a progress bar must not strand characters without a result or\n    turn a bulk operation that isolates failures into a rejection.\n\n    Scenario: Throwing progress callback does not stop the run\n      Given a token manager backed by in-memory storage\n      And 3 characters are stored with access tokens expiring in 30 seconds\n      And the SSO token endpoint returns a token for each refresh after a short delay\n      When refreshAll runs with a progress callback that throws\n      Then the run shall resolve with 3 results of status \"refreshed\"","sourceStart":489,"findings":[]},{"id":"0054-token-management#R35","title":"If a bulk refresh is given a concurrency that is not a finite number, then the token manager shall run with the default concurrency of five and report every character.","line":501,"pattern":"unwanted-behaviour","exclusion":false,"verdict":"verified","evidence":"","charter":[],"tags":[],"scenarios":[{"title":"NaN concurrency refreshes every character","line":507,"tags":[]}],"source":"  Rule: If a bulk refresh is given a concurrency that is not a finite number, then the token manager shall run with the default concurrency of five and report every character.\n    concurrency is a public option that can arrive from configuration files\n    and environment variables, where NaN and Infinity are one typo away.\n    Zero workers would return sparse results and an infinite worker array\n    would throw. Falling back to the default keeps the run's contract intact.\n\n    Scenario: NaN concurrency refreshes every character\n      Given a token manager backed by in-memory storage\n      And 3 characters are stored with access tokens expiring in 30 seconds\n      And the SSO token endpoint returns a token for each refresh after a short delay\n      When refreshAll runs with a concurrency of NaN\n      Then the run shall resolve with 3 results of status \"refreshed\"","sourceStart":501,"findings":[]},{"id":"0054-token-management#R36","title":"If the storage adapter fails to list tokens, then a bulk refresh shall reject with that storage error.","line":514,"pattern":"unwanted-behaviour","exclusion":false,"verdict":"verified","evidence":"","charter":[],"tags":[],"scenarios":[{"title":"Failing storage list rejects the bulk refresh with the storage error","line":521,"tags":[]}],"source":"  Rule: If the storage adapter fails to list tokens, then a bulk refresh shall reject with that storage error.\n    Per-character failures are isolated because every character still gets\n    a result. A storage that cannot be enumerated yields no characters to\n    report on, and swallowing a disk or database fault would make a\n    scheduler believe an empty run succeeded. This is the one rejection the\n    bulk refresh makes, and its documentation says so.\n\n    Scenario: Failing storage list rejects the bulk refresh with the storage error\n      Given a token manager whose storage fails to list tokens with \"disk unavailable\"\n      When refreshAll runs and the error is captured\n      Then the bulk refresh shall have rejected with the message \"disk unavailable\"","sourceStart":514,"findings":[]},{"id":"0054-token-management#R37","title":"The file token storage shall return from a new instance on the same path every token written by a previous instance.","line":528,"pattern":"ubiquitous","exclusion":false,"verdict":"verified","evidence":"","charter":[],"tags":[],"scenarios":[{"title":"Tokens written by one instance are read back by another","line":533,"tags":[]}],"source":"  Rule: The file token storage shall return from a new instance on the same path every token written by a previous instance.\n    Persistence across process restarts is the whole point of a file adapter.\n    Writes go to a temporary file that is renamed into place, so a crash\n    mid-write leaves the previous file intact rather than a truncated one.\n\n    Scenario: Tokens written by one instance are read back by another\n      Given a file token storage on a temporary path\n      And a token for character 2114794365 is written to it\n      When a second file token storage is opened on the same path\n      Then the second storage shall return the token for character 2114794365\n      And the second storage shall list exactly 1 token","sourceStart":528,"findings":[]},{"id":"0054-token-management#R38","title":"If the token file holds an entry that lacks a required field, then the file token storage shall ignore that entry and return the remaining tokens.","line":540,"pattern":"unwanted-behaviour","exclusion":false,"verdict":"verified","evidence":"","charter":[],"tags":[],"scenarios":[{"title":"Entry without scopes is skipped while the valid token is returned","line":547,"tags":[]}],"source":"  Rule: If the token file holds an entry that lacks a required field, then the file token storage shall ignore that entry and return the remaining tokens.\n    Only entries with the full StoredToken shape can be handed to the\n    manager; a record with a numeric id but no scopes array would crash the\n    first get() or list() that copies it. Skipping the malformed entry keeps\n    the healthy tokens usable and leaves the file untouched until the next\n    write.\n\n    Scenario: Entry without scopes is skipped while the valid token is returned\n      Given a token file holding a valid token for character 2114794365 and an entry for character 95465499 without scopes\n      When a file token storage is opened on that file\n      Then the storage shall list exactly 1 token\n      And the storage shall return the token for character 2114794365","sourceStart":540,"findings":[]},{"id":"0054-token-management#R39","title":"If the file token storage is invalidated while a read is in progress, then the storage shall serve the next request from a fresh read of the file.","line":553,"pattern":"unwanted-behaviour","exclusion":false,"verdict":"verified","evidence":"","charter":[],"tags":[],"scenarios":[{"title":"Read started before invalidate does not repopulate the cache","line":559,"tags":[]}],"source":"  Rule: If the file token storage is invalidated while a read is in progress, then the storage shall serve the next request from a fresh read of the file.\n    invalidate() exists so an operator can pick up an external edit. A read\n    that started before the call must not reinstate its stale map after the\n    call, or the next caller sees the very data invalidate() was asked to\n    drop.\n\n    Scenario: Read started before invalidate does not repopulate the cache\n      Given a file token storage on a temporary path holding a token for character 2114794365\n      And the file read is delayed\n      When a list is started, the storage is invalidated and the file gains a token for character 95465499 before the read finishes\n      Then the next list shall return 2 tokens","sourceStart":553,"findings":[]},{"id":"0054-token-management#R40","title":"Where locking is enabled, the file token storage shall keep every token that another instance on the same path wrote when it writes a different character.","line":565,"pattern":"optional-feature","exclusion":false,"verdict":"verified","evidence":"","charter":[],"tags":[],"scenarios":[{"title":"Locked instances writing different characters keep both tokens","line":570,"tags":[]}],"source":"  Rule: Where locking is enabled, the file token storage shall keep every token that another instance on the same path wrote when it writes a different character.\n    A process that wrote from its own copy of the file would put back the\n    refresh token another process had just rotated. With locking on, each\n    write reads the file under the lock and changes only its own entry.\n\n    Scenario: Locked instances writing different characters keep both tokens\n      Given two file token storages on the same temporary path with locking enabled\n      When the first storage writes character 2114794365 and the second writes character 95465499 at the same time\n      Then a new file token storage on that path shall list 2 tokens","sourceStart":565,"findings":[]},{"id":"0054-token-management#R41","title":"If the lock file is older than the stale timeout, then the file token storage shall break the lock and complete the write.","line":575,"pattern":"unwanted-behaviour","exclusion":false,"verdict":"verified","evidence":"","charter":[],"tags":[],"scenarios":[{"title":"Lock left by a crashed holder is broken","line":580,"tags":[]}],"source":"  Rule: If the lock file is older than the stale timeout, then the file token storage shall break the lock and complete the write.\n    A process that crashes while holding the lock leaves the lock file\n    behind. Without a timeout every other process would wait on it forever;\n    the timeout must exceed the longest time a live holder keeps the lock.\n\n    Scenario: Lock left by a crashed holder is broken\n      Given a file token storage on a temporary path with locking enabled and a stale timeout of 1000 ms\n      And a lock file acquired 5000 ms ago is present\n      When a token for character 2114794365 is written to the locked storage\n      Then the locked storage shall return the token for character 2114794365\n      And no lock file shall remain","sourceStart":575,"findings":[]},{"id":"0054-token-management#R42","title":"If the lock is held by a live holder for longer than the lock timeout, then the file token storage shall reject the write with an error naming the lock file.","line":587,"pattern":"unwanted-behaviour","exclusion":false,"verdict":"verified","evidence":"","charter":[],"tags":[],"scenarios":[{"title":"Write gives up on a lock that stays held","line":592,"tags":[]}],"source":"  Rule: If the lock is held by a live holder for longer than the lock timeout, then the file token storage shall reject the write with an error naming the lock file.\n    A caller blocked indefinitely on a lock cannot report anything. Failing\n    after the timeout surfaces the stuck holder, and the token file is left\n    as it was.\n\n    Scenario: Write gives up on a lock that stays held\n      Given a file token storage on a temporary path with locking enabled and a lock timeout of 100 ms\n      And a lock file acquired just now is present\n      When a token for character 2114794365 is written to the locked storage and the error is captured\n      Then the write shall have rejected with a message naming the lock file\n      And the token file shall not exist","sourceStart":587,"findings":[]}],"noUnwantedBehaviour":false,"orphanScenarios":0},{"file":"tests/bdd/features/core/0055-request-headers.feature","area":"core","name":"Per-client tenant and user agent","tags":[],"charter":["TEST-11","DES-04","SEC-10"],"description":"ESI serves more than one tenant (Tranquility, the live server, and Singularity, the test server) and picks one per request from the X-Tenant header, defaulting to Tranquility when the header is absent. CCP also asks every caller to identify itself, so a misbehaving application can be contacted rather than blocked. Both belong to the client, not to a call: two clients in one process can talk to different tenants as different applications.\n\nThese scenarios drive the real request pipeline to the transport seam and read the headers the request carried.","boundBy":["tests/bdd/specs/core/0055-request-headers.spec.ts"],"rules":[{"id":"0055-request-headers#R1","title":"Where a tenant is configured, the client shall send it as the X-Tenant header on every request.","line":13,"pattern":"optional-feature","exclusion":false,"verdict":"verified","evidence":"","charter":[],"tags":[],"scenarios":[{"title":"A client configured for Singularity names it on a public request","line":17,"tags":[]},{"title":"The tenant also goes on an authenticated request","line":23,"tags":[]},{"title":"The tenant also goes on a YAML specification request","line":29,"tags":[]}],"source":"  Rule: Where a tenant is configured, the client shall send it as the X-Tenant header on every request.\n    The tenant goes on public and authenticated routes alike, since ESI reads it\n    before routing.\n\n    Scenario: A client configured for Singularity names it on a public request\n      Given a client configured for the \"singularity\" tenant\n      And ESI reports the server status\n      When the client requests the server status\n      Then the request shall carry the header \"X-Tenant\" with the value \"singularity\"\n\n    Scenario: The tenant also goes on an authenticated request\n      Given a client configured for the \"singularity\" tenant\n      And an authenticated character for wallet\n      When the client requests their wallet balance\n      Then the request shall carry the header \"X-Tenant\" with the value \"singularity\"\n\n    Scenario: The tenant also goes on a YAML specification request\n      Given a client configured for the \"singularity\" tenant\n      And the ESI API is available for YAML\n      When the client requests the OpenAPI YAML specification\n      Then the request shall carry the header \"X-Tenant\" with the value \"singularity\"","sourceStart":13,"findings":[]},{"id":"0055-request-headers#R2","title":"If no tenant is configured, then the client shall not send an X-Tenant header.","line":36,"pattern":"unwanted-behaviour","exclusion":true,"verdict":"verified","evidence":"","charter":["TEST-11"],"tags":["@TEST-11"],"scenarios":[{"title":"A default client leaves the tenant to ESI","line":40,"tags":[]}],"source":"  @TEST-11\n  Rule: If no tenant is configured, then the client shall not send an X-Tenant header.\n    ESI's own default applies, so an existing client keeps talking to\n    Tranquility without sending anything new.\n\n    Scenario: A default client leaves the tenant to ESI\n      Given a client with no tenant configured\n      And ESI reports the server status\n      When the client requests the server status\n      Then the request shall not carry the header \"X-Tenant\"","sourceStart":35,"findings":[]},{"id":"0055-request-headers#R3","title":"Where a user agent is configured, the client shall send it as the X-User-Agent header and at the start of the User-Agent header.","line":46,"pattern":"optional-feature","exclusion":false,"verdict":"verified","evidence":"","charter":[],"tags":[],"scenarios":[{"title":"A named application identifies itself on both headers","line":51,"tags":[]}],"source":"  Rule: Where a user agent is configured, the client shall send it as the X-User-Agent header and at the start of the User-Agent header.\n    The configured value replaces the client ID in X-User-Agent, which browsers\n    send in place of the User-Agent they may not set. The library's own\n    identifier stays at the end of User-Agent.\n\n    Scenario: A named application identifies itself on both headers\n      Given a client configured with the user agent \"fleet-tool/2.1 (ops@example.com)\"\n      And ESI reports the server status\n      When the client requests the server status\n      Then the request shall carry the header \"X-User-Agent\" with the value \"fleet-tool/2.1 (ops@example.com)\"\n      And the request's User-Agent header shall start with \"fleet-tool/2.1 (ops@example.com) \"","sourceStart":46,"findings":[]},{"id":"0055-request-headers#R4","title":"If a configured tenant or user agent is not a legal HTTP header value, then the client constructor shall throw a VALIDATION_ERROR naming the option.","line":58,"pattern":"unwanted-behaviour","exclusion":false,"verdict":"verified","evidence":"","charter":[],"tags":[],"scenarios":[{"title":"A tenant holding a line break is refused at construction","line":62,"tags":[]},{"title":"A user agent holding a control character is refused at construction","line":66,"tags":[]}],"source":"  Rule: If a configured tenant or user agent is not a legal HTTP header value, then the client constructor shall throw a VALIDATION_ERROR naming the option.\n    fetch rejects a header value holding a control character on every request,\n    so the client refuses the value once, where it was given.\n\n    Scenario: A tenant holding a line break is refused at construction\n      When a client is created with a tenant holding a line break\n      Then the client constructor shall throw a VALIDATION_ERROR naming the option\n\n    Scenario: A user agent holding a control character is refused at construction\n      When a client is created with a user agent holding a NUL character\n      Then the client constructor shall throw a VALIDATION_ERROR naming the option","sourceStart":58,"findings":[]},{"id":"0055-request-headers#R5","title":"If a client holding an access token calls an endpoint that declares no scope, then the client shall not send an Authorization header.","line":73,"pattern":"unwanted-behaviour","exclusion":true,"verdict":"verified","evidence":"","charter":["DES-04","SEC-10","TEST-11"],"tags":["@sec-P1","@DES-04","@SEC-10","@TEST-11"],"scenarios":[{"title":"The server status is asked without the token the client holds","line":79,"tags":[]}],"source":"  @sec-P1 @DES-04 @SEC-10 @TEST-11\n  Rule: If a client holding an access token calls an endpoint that declares no scope, then the client shall not send an Authorization header.\n    The bearer token goes only where the endpoint definition sets requiresAuth.\n    A public route has no use for it, and sending it anyway would hand the\n    token to every public call and every proxy log along the way (SECURITY.md,\n    \"Tokens\").\n\n    Scenario: The server status is asked without the token the client holds\n      Given ESI reports the server status\n      When the client requests the server status\n      Then the request shall not carry the header \"Authorization\"","sourceStart":72,"findings":[]},{"id":"0055-request-headers#R6","title":"If an endpoint that declares a scope is called, then the client shall not put the access token in the request URL.","line":85,"pattern":"unwanted-behaviour","exclusion":true,"verdict":"verified","evidence":"","charter":["SEC-10","TEST-11"],"tags":["@sec-P3","@SEC-10","@TEST-11"],"scenarios":[{"title":"The wallet balance carries its token in the header alone","line":90,"tags":[]}],"source":"  @sec-P3 @SEC-10 @TEST-11\n  Rule: If an endpoint that declares a scope is called, then the client shall not put the access token in the request URL.\n    ESI accepts a token as a query parameter, but a URL is logged by proxies,\n    servers and error reports where a header is not. The token travels only in\n    the Authorization header.\n\n    Scenario: The wallet balance carries its token in the header alone\n      Given an authenticated character for wallet\n      When the client requests their wallet balance\n      Then the request URL shall not contain the access token\n      And the request shall carry the header \"Authorization\" with the value \"Bearer bdd-access-token\"","sourceStart":84,"findings":[]}],"noUnwantedBehaviour":false,"orphanScenarios":0},{"file":"tests/bdd/features/core/0056-shared-runtime.feature","area":"core","name":"One runtime, many identities","tags":["@ARCH-08"],"charter":["ARCH-08","TEST-11","SEC-10"],"description":"An application that acts for more than one character used to build one EsiClient per character, each with its own rate limiter, error budget and cache, although ESI meters all of them as one caller. The `./client` entry builds one runtime and hands out views over it: `esi.public` reaches only the operations that need no scope, and `esi.as(identity)` reaches every operation as one character, with the token supplied by an EsiTokenManager, a raw access token or a custom TokenProvider. The views share the rate limiter, the circuit breaker, the deduplicator and the ETag cache, and the cache keeps each identity's authenticated entries apart.\n\nThese scenarios drive the generated operations through the real request pipeline to the transport seam and read what went over the wire.","boundBy":["tests/bdd/specs/core/0056-shared-runtime.spec.ts"],"rules":[{"id":"0056-shared-runtime#R1","title":"If the runtime is created without a legal user agent, then the runtime constructor shall throw a VALIDATION_ERROR naming the userAgent option.","line":18,"pattern":"unwanted-behaviour","exclusion":false,"verdict":"verified","evidence":"","charter":[],"tags":[],"scenarios":[{"title":"A runtime built without a user agent is refused","line":23,"tags":[]},{"title":"A runtime built with an empty user agent is refused","line":27,"tags":[]},{"title":"A runtime built with a user agent holding a line break is refused","line":31,"tags":[]}],"source":"  Rule: If the runtime is created without a legal user agent, then the runtime constructor shall throw a VALIDATION_ERROR naming the userAgent option.\n    CCP asks every caller to identify itself. The legacy client left the user\n    agent optional for compatibility; the new surface has no such debt, so it\n    refuses to exist without one, at construction rather than on every request.\n\n    Scenario: A runtime built without a user agent is refused\n      When a runtime is created without a user agent\n      Then the client constructor shall throw a VALIDATION_ERROR naming the option\n\n    Scenario: A runtime built with an empty user agent is refused\n      When a runtime is created with an empty user agent\n      Then the client constructor shall throw a VALIDATION_ERROR naming the option\n\n    Scenario: A runtime built with a user agent holding a line break is refused\n      When a runtime is created with a user agent holding a line break\n      Then the client constructor shall throw a VALIDATION_ERROR naming the option","sourceStart":18,"findings":[]},{"id":"0056-shared-runtime#R2","title":"The runtime shall send the configured user agent as the X-User-Agent header on every request.","line":35,"pattern":"ubiquitous","exclusion":false,"verdict":"verified","evidence":"","charter":[],"tags":[],"scenarios":[{"title":"The public view identifies the application","line":39,"tags":[]},{"title":"A character's view identifies the application","line":45,"tags":[]}],"source":"  Rule: The runtime shall send the configured user agent as the X-User-Agent header on every request.\n    The same value goes out whichever view sent the request: the identity\n    changes the token, not who the application is.\n\n    Scenario: The public view identifies the application\n      Given a runtime for the application \"fleet-tool/2.1 (ops@example.com)\"\n      And ESI reports the server status\n      When the public view requests the server status\n      Then the request shall carry the header \"X-User-Agent\" with the value \"fleet-tool/2.1 (ops@example.com)\"\n\n    Scenario: A character's view identifies the application\n      Given a runtime for the application \"fleet-tool/2.1 (ops@example.com)\"\n      And a view for a character holding an access token\n      And ESI reports the character's wallet balance\n      When the character's view requests the wallet balance\n      Then the request shall carry the header \"X-User-Agent\" with the value \"fleet-tool/2.1 (ops@example.com)\"","sourceStart":35,"findings":[]},{"id":"0056-shared-runtime#R3","title":"If the public view requests an operation while another view holds a token, then the runtime shall not send an Authorization header.","line":55,"pattern":"unwanted-behaviour","exclusion":true,"verdict":"verified","evidence":"","charter":["TEST-11"],"tags":["@TEST-11"],"scenarios":[{"title":"A public request from a runtime that also serves a character carries no token","line":59,"tags":[]}],"source":"  @TEST-11\n  Rule: If the public view requests an operation while another view holds a token, then the runtime shall not send an Authorization header.\n    The public view holds no token, so nothing it sends can be attributed to a\n    character, whatever tokens the runtime's other views hold.\n\n    Scenario: A public request from a runtime that also serves a character carries no token\n      Given a runtime for the application \"fleet-tool/2.1 (ops@example.com)\"\n      And a view for a character holding an access token\n      And ESI reports the server status\n      When the public view requests the server status\n      Then the request shall not carry the header \"Authorization\"","sourceStart":54,"findings":[]},{"id":"0056-shared-runtime#R4","title":"If an authenticated operation is invoked on the public view, then the runtime shall reject the call with NO_AUTH_TOKEN without sending a request.","line":66,"pattern":"unwanted-behaviour","exclusion":false,"verdict":"verified","evidence":"","charter":[],"tags":[],"scenarios":[{"title":"A wallet request forced through the public view is refused before the wire","line":70,"tags":[]}],"source":"  Rule: If an authenticated operation is invoked on the public view, then the runtime shall reject the call with NO_AUTH_TOKEN without sending a request.\n    The type of the public view leaves the authenticated operations out, so the\n    call does not compile; this is the guard for a caller who casts past it.\n\n    Scenario: A wallet request forced through the public view is refused before the wire\n      Given a runtime for the application \"fleet-tool/2.1 (ops@example.com)\"\n      When an authenticated wallet request is forced through the public view\n      Then the call shall be rejected with NO_AUTH_TOKEN and no request shall be sent","sourceStart":66,"findings":[]},{"id":"0056-shared-runtime#R5","title":"When a view requests an authenticated operation, the runtime shall send the identity's current access token as the bearer.","line":77,"pattern":"event-driven","exclusion":false,"verdict":"verified","evidence":"","charter":[],"tags":[],"scenarios":[{"title":"A raw access token is sent as given","line":82,"tags":[]},{"title":"A token manager's stored token is sent","line":89,"tags":[]},{"title":"A stale managed token is refreshed before the request","line":96,"tags":[]},{"title":"A custom token provider is asked for the token on each request","line":104,"tags":[]}],"source":"  Rule: When a view requests an authenticated operation, the runtime shall send the identity's current access token as the bearer.\n    The identity decides what \"current\" means: a raw token is itself, a token\n    manager returns the stored token and refreshes it first when stale, and a\n    custom provider is asked each time.\n\n    Scenario: A raw access token is sent as given\n      Given a runtime for the application \"fleet-tool/2.1 (ops@example.com)\"\n      And a view for a character holding an access token\n      And ESI reports the character's wallet balance\n      When the character's view requests the wallet balance\n      Then the request shall carry the header \"Authorization\" with the value \"Bearer raw-access-token\"\n\n    Scenario: A token manager's stored token is sent\n      Given a runtime for the application \"fleet-tool/2.1 (ops@example.com)\"\n      And a view for a character managed by a token manager\n      And ESI reports the character's wallet balance\n      When the character's view requests the wallet balance\n      Then the request shall carry the character's stored access token as the bearer\n\n    Scenario: A stale managed token is refreshed before the request\n      Given a runtime for the application \"fleet-tool/2.1 (ops@example.com)\"\n      And a view for a character whose managed token is stale\n      And SSO issues the character a fresh token\n      And ESI reports the character's wallet balance\n      When the character's view requests the wallet balance\n      Then the request shall carry the character's fresh access token as the bearer\n\n    Scenario: A custom token provider is asked for the token on each request\n      Given a runtime for the application \"fleet-tool/2.1 (ops@example.com)\"\n      And a view for a character whose provider hands out a new token on each call\n      And ESI reports the character's wallet balance twice\n      When the character's view requests the wallet balance twice\n      Then the two requests shall carry the provider's first and second tokens","sourceStart":77,"findings":[]},{"id":"0056-shared-runtime#R6","title":"When a view follows the pages of an authenticated operation, the runtime shall ask the identity for its token before each page.","line":111,"pattern":"event-driven","exclusion":false,"verdict":"verified","evidence":"","charter":[],"tags":[],"scenarios":[{"title":"A provider's newer token is sent for the second page","line":115,"tags":[]}],"source":"  Rule: When a view follows the pages of an authenticated operation, the runtime shall ask the identity for its token before each page.\n    Each page is its own request, and a consumer may hold the iterator across\n    a token rotation, so the token is not taken once for the whole collection.\n\n    Scenario: A provider's newer token is sent for the second page\n      Given a runtime for the application \"fleet-tool/2.1 (ops@example.com)\"\n      And a view for a character whose provider hands out a new token on each call\n      And ESI reports the character's assets on two pages\n      When the character's view follows every page of the character's assets\n      Then the two requests shall carry the provider's first and second tokens","sourceStart":111,"findings":[]},{"id":"0056-shared-runtime#R7","title":"When ESI answers 401 to a view whose identity can refresh, the runtime shall retry the request once with the refreshed token.","line":122,"pattern":"event-driven","exclusion":false,"verdict":"verified","evidence":"","charter":[],"tags":[],"scenarios":[{"title":"A managed token rejected by ESI is refreshed through SSO and the request retried","line":126,"tags":[]}],"source":"  Rule: When ESI answers 401 to a view whose identity can refresh, the runtime shall retry the request once with the refreshed token.\n    A managed character refreshes through SSO; a provider identity asks its\n    provider again. Either way the caller sees the retried answer, not the 401.\n\n    Scenario: A managed token rejected by ESI is refreshed through SSO and the request retried\n      Given a runtime for the application \"fleet-tool/2.1 (ops@example.com)\"\n      And a view for a character managed by a token manager\n      And ESI rejects the character's token once and then reports the wallet balance\n      And SSO issues the character a fresh token\n      When the character's view requests the wallet balance\n      Then the call shall resolve with the wallet balance after two requests\n      And the request shall carry the character's fresh access token as the bearer","sourceStart":122,"findings":[]},{"id":"0056-shared-runtime#R8","title":"If ESI answers 401 to a view whose identity cannot refresh, then the runtime shall reject the call with the 401 after a single request.","line":135,"pattern":"unwanted-behaviour","exclusion":false,"verdict":"verified","evidence":"","charter":[],"tags":[],"scenarios":[{"title":"A raw token rejected by ESI is not retried","line":139,"tags":[]}],"source":"  Rule: If ESI answers 401 to a view whose identity cannot refresh, then the runtime shall reject the call with the 401 after a single request.\n    A raw access token has nowhere to turn. Retrying it would be a second\n    rejection and a spent error-budget point, so the view reports the 401.\n\n    Scenario: A raw token rejected by ESI is not retried\n      Given a runtime for the application \"fleet-tool/2.1 (ops@example.com)\"\n      And a view for a character holding an access token\n      And ESI rejects the character's token\n      When the character's view requests the wallet balance\n      Then the call shall be rejected with status 401 after a single request","sourceStart":135,"findings":[]},{"id":"0056-shared-runtime#R9","title":"While two views share one runtime, the runtime shall serve a public entry cached through one view to the other without a request.","line":148,"pattern":"state-driven","exclusion":false,"verdict":"verified","evidence":"","charter":[],"tags":[],"scenarios":[{"title":"The server status fetched by a character's view is served to the public view from the cache","line":152,"tags":[]}],"source":"  Rule: While two views share one runtime, the runtime shall serve a public entry cached through one view to the other without a request.\n    Public data is the same whoever asked for it, and the spec TTL says how\n    long it holds, so the second view reads the first view's entry.\n\n    Scenario: The server status fetched by a character's view is served to the public view from the cache\n      Given a runtime for the application \"fleet-tool/2.1 (ops@example.com)\"\n      And a view for a character holding an access token\n      And ESI reports the server status with an ETag\n      When the character's view requests the server status\n      And the public view requests the server status\n      Then the runtime shall have sent 1 request","sourceStart":148,"findings":[]},{"id":"0056-shared-runtime#R10","title":"While two views share one runtime, the runtime shall keep each identity's authenticated entries apart.","line":161,"pattern":"state-driven","exclusion":false,"verdict":"verified","evidence":"","charter":["SEC-10"],"tags":["@sec-P4","@SEC-10"],"scenarios":[{"title":"A corporation wallet fetched by one character is not served to another","line":167,"tags":[]}],"source":"  @sec-P4 @SEC-10\n  Rule: While two views share one runtime, the runtime shall keep each identity's authenticated entries apart.\n    Two characters in one corporation ask the same URL and get answers scoped\n    to their own roles. Sharing the cached body would show one character the\n    other's answer, so each identity has its own entry, keyed by the character\n    the token names.\n\n    Scenario: A corporation wallet fetched by one character is not served to another\n      Given a runtime for the application \"fleet-tool/2.1 (ops@example.com)\"\n      And views for two characters of one corporation\n      And ESI reports the corporation wallets twice\n      When each character's view requests the corporation wallets\n      Then the runtime shall have sent 2 requests","sourceStart":160,"findings":[]},{"id":"0056-shared-runtime#R11","title":"While the circuit for an endpoint is open, the runtime shall reject that endpoint from every view without sending a request.","line":174,"pattern":"state-driven","exclusion":false,"verdict":"verified","evidence":"","charter":[],"tags":[],"scenarios":[{"title":"An endpoint that failed through a character's view is rejected for the public view","line":178,"tags":[]}],"source":"  Rule: While the circuit for an endpoint is open, the runtime shall reject that endpoint from every view without sending a request.\n    The circuit breaker guards ESI, not a character. Failures seen through one\n    view open the circuit for the public view and every other view alike.\n\n    Scenario: An endpoint that failed through a character's view is rejected for the public view\n      Given a runtime for the application \"fleet-tool/2.1 (ops@example.com)\" with a circuit breaker that opens after 2 failures\n      And a view for a character holding an access token\n      And ESI answers the server status with 500 until the circuit opens\n      When the character's view requests the server status and the circuit opens\n      And the public view requests the server status\n      Then the public request shall be rejected with CircuitOpenError\n      And the runtime shall have sent 2 requests","sourceStart":174,"findings":[]},{"id":"0056-shared-runtime#R12","title":"When the runtime is shut down, the runtime shall stop its cleanup timers and keep every view usable.","line":187,"pattern":"event-driven","exclusion":false,"verdict":"verified","evidence":"","charter":[],"tags":[],"scenarios":[{"title":"A character's view still answers after the runtime is shut down","line":193,"tags":[]}],"source":"  Rule: When the runtime is shut down, the runtime shall stop its cleanup timers and keep every view usable.\n    The shared cache and circuit breaker each run a cleanup timer. Shutdown\n    releases them, once or many times over, so an application that replaces\n    a runtime holds nothing of the old one; a view still answers afterwards,\n    as the legacy client does, because a request needs no timer.\n\n    Scenario: A character's view still answers after the runtime is shut down\n      Given a runtime for the application \"fleet-tool/2.1 (ops@example.com)\"\n      And a view for a character holding an access token\n      And ESI reports the character's wallet balance\n      When the runtime is shut down twice\n      And the character's view requests the wallet balance\n      Then the call shall resolve with the wallet balance after one request","sourceStart":187,"findings":[]},{"id":"0056-shared-runtime#R13","title":"When a view in metadata mode requests an operation that answers once, the runtime shall resolve with the body and the response metadata read from the ESI headers.","line":203,"pattern":"event-driven","exclusion":false,"verdict":"verified","evidence":"","charter":[],"tags":[],"scenarios":[{"title":"The public view in metadata mode reports the server status with its headers","line":210,"tags":[]},{"title":"A character's view in metadata mode reports the wallet balance with its headers","line":217,"tags":[]},{"title":"An answer served from the shared cache is reported as cached","line":225,"tags":[]}],"source":"  Rule: When a view in metadata mode requests an operation that answers once, the runtime shall resolve with the body and the response metadata read from the ESI headers.\n    The legacy `withMetadata()` answered `{ data, meta }`. `esi.withMetadata()`\n    hands out the same two views over the same runtime, and each operation\n    resolves with the body ESI sent and the metadata the legacy clients built\n    from its headers: the ETag, `Expires`, `X-Pages` and the error-limit\n    counters, and whether the shared cache answered.\n\n    Scenario: The public view in metadata mode reports the server status with its headers\n      Given a runtime for the application \"fleet-tool/2.1 (ops@example.com)\"\n      And ESI reports the server status with response headers\n      When the public view in metadata mode requests the server status\n      Then the result shall hold the server status as its data\n      And the result's metadata shall report the ETag, expiry, page count and error limit ESI sent\n\n    Scenario: A character's view in metadata mode reports the wallet balance with its headers\n      Given a runtime for the application \"fleet-tool/2.1 (ops@example.com)\"\n      And a view for a character holding an access token\n      And ESI reports the character's wallet balance with response headers\n      When the character's view in metadata mode requests the wallet balance\n      Then the result shall hold the wallet balance as its data\n      And the result's metadata shall report the ETag, expiry, page count and error limit ESI sent\n\n    Scenario: An answer served from the shared cache is reported as cached\n      Given a runtime for the application \"fleet-tool/2.1 (ops@example.com)\"\n      And ESI reports the server status with an ETag\n      When the public view requests the server status\n      And the public view in metadata mode requests the server status\n      Then the result's metadata shall report an answer from the cache\n      And the runtime shall have sent 1 request","sourceStart":203,"findings":[]},{"id":"0056-shared-runtime#R14","title":"When a view in safe mode requests an operation that ESI answers, the runtime shall resolve with ok set to true, the body and the response metadata.","line":233,"pattern":"event-driven","exclusion":false,"verdict":"verified","evidence":"","charter":[],"tags":[],"scenarios":[{"title":"The public view in safe mode reports the server status","line":238,"tags":[]}],"source":"  Rule: When a view in safe mode requests an operation that ESI answers, the runtime shall resolve with ok set to true, the body and the response metadata.\n    The legacy `withSafeMode()` resolved every call with a result object\n    instead of throwing. `esi.withSafeMode()` does the same for both views; a\n    success carries the metadata a metadata-mode view would report.\n\n    Scenario: The public view in safe mode reports the server status\n      Given a runtime for the application \"fleet-tool/2.1 (ops@example.com)\"\n      And ESI reports the server status with response headers\n      When the public view in safe mode requests the server status\n      Then the result shall be ok and hold the server status as its data\n      And the result's metadata shall report the ETag, expiry, page count and error limit ESI sent","sourceStart":233,"findings":[]},{"id":"0056-shared-runtime#R15","title":"If an operation fails on a view in safe mode, then the runtime shall resolve with ok set to false and the EsiError instead of rejecting.","line":245,"pattern":"unwanted-behaviour","exclusion":false,"verdict":"verified","evidence":"","charter":[],"tags":[],"scenarios":[{"title":"A wallet request ESI answers with 404 resolves as a failure","line":250,"tags":[]},{"title":"A wallet request forced through the public view in safe mode fails before the wire","line":257,"tags":[]}],"source":"  Rule: If an operation fails on a view in safe mode, then the runtime shall resolve with ok set to false and the EsiError instead of rejecting.\n    Every failure the plain view would throw becomes the result's error, the\n    refusal of an authenticated operation on the public view included, so a\n    caller in safe mode handles one shape and never a rejection.\n\n    Scenario: A wallet request ESI answers with 404 resolves as a failure\n      Given a runtime for the application \"fleet-tool/2.1 (ops@example.com)\"\n      And a view for a character holding an access token\n      And ESI answers the character's wallet balance with 404\n      When the character's view in safe mode requests the wallet balance\n      Then the result shall not be ok and carry an EsiError with status 404\n\n    Scenario: A wallet request forced through the public view in safe mode fails before the wire\n      Given a runtime for the application \"fleet-tool/2.1 (ops@example.com)\"\n      When an authenticated wallet request is forced through the public view in safe mode\n      Then the result shall not be ok and carry an EsiError coded NO_AUTH_TOKEN\n      And the runtime shall have sent 0 requests","sourceStart":245,"findings":[]},{"id":"0056-shared-runtime#R16","title":"If a view in metadata or safe mode follows the pages of an operation, then the runtime shall not wrap the items the pages yield.","line":264,"pattern":"unwanted-behaviour","exclusion":true,"verdict":"verified","evidence":"","charter":["TEST-11"],"tags":["@TEST-11"],"scenarios":[{"title":"A character's assets followed in safe mode arrive as plain items","line":270,"tags":[]}],"source":"  @TEST-11\n  Rule: If a view in metadata or safe mode follows the pages of an operation, then the runtime shall not wrap the items the pages yield.\n    A paginated operation yields items across several responses, each with its\n    own headers, so there is no one answer to attach metadata to. The items\n    arrive as the plain view yields them, and a failing page rejects the\n    iteration in either mode.\n\n    Scenario: A character's assets followed in safe mode arrive as plain items\n      Given a runtime for the application \"fleet-tool/2.1 (ops@example.com)\"\n      And a view for a character holding an access token\n      And ESI reports the character's assets on two pages\n      When the character's safe-mode view follows every page of its assets\n      Then the items shall be the character's two assets as ESI sent them","sourceStart":263,"findings":[]},{"id":"0056-shared-runtime#R17","title":"When the runtime's cache statistics are requested, the runtime shall count the entries and hits of the cache every view shares.","line":279,"pattern":"event-driven","exclusion":false,"verdict":"verified","evidence":"","charter":[],"tags":[],"scenarios":[{"title":"A status cached by a character's view and served to the public view counts one entry and one hit","line":283,"tags":[]}],"source":"  Rule: When the runtime's cache statistics are requested, the runtime shall count the entries and hits of the cache every view shares.\n    One cache serves every view, so one set of statistics describes it,\n    whichever view wrote an entry or read it back.\n\n    Scenario: A status cached by a character's view and served to the public view counts one entry and one hit\n      Given a runtime for the application \"fleet-tool/2.1 (ops@example.com)\"\n      And a view for a character holding an access token\n      And ESI reports the server status with an ETag\n      When the character's view requests the server status\n      And the public view requests the server status\n      Then the runtime's cache statistics shall report 1 entry and 1 hit","sourceStart":279,"findings":[]},{"id":"0056-shared-runtime#R18","title":"If the ETag cache is disabled, then the runtime shall report its cache statistics as null.","line":291,"pattern":"unwanted-behaviour","exclusion":false,"verdict":"verified","evidence":"","charter":[],"tags":[],"scenarios":[{"title":"A runtime without the ETag cache has no statistics","line":295,"tags":[]}],"source":"  Rule: If the ETag cache is disabled, then the runtime shall report its cache statistics as null.\n    Nothing is cached, so there is nothing to count; null tells that apart\n    from an empty cache.\n\n    Scenario: A runtime without the ETag cache has no statistics\n      Given a runtime for the application \"fleet-tool/2.1 (ops@example.com)\" without the ETag cache\n      When the runtime's cache statistics are read\n      Then the cache statistics shall be null","sourceStart":291,"findings":[]},{"id":"0056-shared-runtime#R19","title":"When the runtime's cache is cleared, the runtime shall send the next request for a cached entry to ESI.","line":300,"pattern":"event-driven","exclusion":false,"verdict":"verified","evidence":"","charter":[],"tags":[],"scenarios":[{"title":"The server status is fetched again after the cache is cleared","line":303,"tags":[]}],"source":"  Rule: When the runtime's cache is cleared, the runtime shall send the next request for a cached entry to ESI.\n    Clearing drops every view's entries at once, since they share one cache.\n\n    Scenario: The server status is fetched again after the cache is cleared\n      Given a runtime for the application \"fleet-tool/2.1 (ops@example.com)\"\n      And ESI reports the server status twice\n      When the public view requests the server status\n      And the runtime's cache is cleared\n      And the public view requests the server status\n      Then the runtime shall have sent 2 requests","sourceStart":300,"findings":[]},{"id":"0056-shared-runtime#R20","title":"When the runtime's cache configuration is updated, the runtime shall limit its entries to the updated maxEntries.","line":311,"pattern":"event-driven","exclusion":false,"verdict":"verified","evidence":"","charter":[],"tags":[],"scenarios":[{"title":"A cache limited to one entry keeps only the newest response","line":314,"tags":[]}],"source":"  Rule: When the runtime's cache configuration is updated, the runtime shall limit its entries to the updated maxEntries.\n    The configuration changes in place, so the views keep the cache they share.\n\n    Scenario: A cache limited to one entry keeps only the newest response\n      Given a runtime for the application \"fleet-tool/2.1 (ops@example.com)\"\n      And ESI reports the server status with an ETag\n      And ESI reports the alliance list with an ETag\n      When the runtime's cache is limited to 1 entry\n      And the public view requests the server status\n      And the public view requests the alliance list\n      Then the runtime's cache statistics shall report 1 entry","sourceStart":311,"findings":[]},{"id":"0056-shared-runtime#R21","title":"While the circuit breaker is enabled, the runtime shall report the state and failure count of each endpoint's circuit.","line":323,"pattern":"state-driven","exclusion":false,"verdict":"verified","evidence":"","charter":[],"tags":[],"scenarios":[{"title":"An endpoint whose circuit opened through a character's view is reported open","line":327,"tags":[]}],"source":"  Rule: While the circuit breaker is enabled, the runtime shall report the state and failure count of each endpoint's circuit.\n    The circuits are shared by every view, so the statistics show failures\n    whichever view saw them.\n\n    Scenario: An endpoint whose circuit opened through a character's view is reported open\n      Given a runtime for the application \"fleet-tool/2.1 (ops@example.com)\" with a circuit breaker that opens after 2 failures\n      And a view for a character holding an access token\n      And ESI answers the server status with 500 until the circuit opens\n      When the character's view requests the server status and the circuit opens\n      Then the runtime's circuit breaker statistics shall report 1 open circuit with 2 failures","sourceStart":323,"findings":[]},{"id":"0056-shared-runtime#R22","title":"When the runtime's circuit breaker is reset, the runtime shall send the next request for an endpoint whose circuit was open to ESI.","line":334,"pattern":"event-driven","exclusion":false,"verdict":"verified","evidence":"","charter":[],"tags":[],"scenarios":[{"title":"The server status is requested again after its open circuit is reset","line":337,"tags":[]}],"source":"  Rule: When the runtime's circuit breaker is reset, the runtime shall send the next request for an endpoint whose circuit was open to ESI.\n    An operator who knows ESI has recovered need not wait out the reset timeout.\n\n    Scenario: The server status is requested again after its open circuit is reset\n      Given a runtime for the application \"fleet-tool/2.1 (ops@example.com)\" with a circuit breaker that opens after 2 failures\n      And a view for a character holding an access token\n      And ESI answers the server status with 500 until the circuit opens\n      And ESI reports the server status\n      When the character's view requests the server status and the circuit opens\n      And the runtime's circuit breaker is reset\n      And the public view requests the server status\n      Then the call shall resolve with the server status\n      And the runtime shall have sent 3 requests","sourceStart":334,"findings":[]},{"id":"0056-shared-runtime#R23","title":"Where a cache store is supplied, the runtime shall keep the response bodies it caches in that store.","line":350,"pattern":"optional-feature","exclusion":false,"verdict":"verified","evidence":"","charter":[],"tags":[],"scenarios":[{"title":"The server status is written to the supplied store and served from it","line":355,"tags":[]}],"source":"  Rule: Where a cache store is supplied, the runtime shall keep the response bodies it caches in that store.\n    The `CacheStore` port is the five calls a shared store, a Redis client or a\n    file, implements. The runtime keeps its conditional-request entries there\n    instead of in its own memory, and reads them back for every view.\n\n    Scenario: The server status is written to the supplied store and served from it\n      Given a runtime for the application \"fleet-tool/2.1 (ops@example.com)\" over a supplied cache store\n      And ESI reports the server status with an ETag\n      When the public view requests the server status\n      And the public view requests the server status\n      Then the supplied cache store shall hold the server status with its ETag\n      And the runtime shall have sent 1 request","sourceStart":350,"findings":[]},{"id":"0056-shared-runtime#R24","title":"Where a rate limiter is supplied, the runtime shall ask that rate limiter for clearance before each request it sends.","line":363,"pattern":"optional-feature","exclusion":false,"verdict":"verified","evidence":"","charter":[],"tags":[],"scenarios":[{"title":"Each view's request is cleared by the supplied rate limiter","line":367,"tags":[]}],"source":"  Rule: Where a rate limiter is supplied, the runtime shall ask that rate limiter for clearance before each request it sends.\n    The supplied limiter replaces the one `rateLimiterConfig` would build, and\n    every view draws on it.\n\n    Scenario: Each view's request is cleared by the supplied rate limiter\n      Given a runtime for the application \"fleet-tool/2.1 (ops@example.com)\" with a supplied rate limiter\n      And a view for a character holding an access token\n      And ESI reports the server status\n      And ESI reports the character's wallet balance\n      When the public view requests the server status\n      And the character's view requests the wallet balance\n      Then the supplied rate limiter shall have cleared 2 requests","sourceStart":363,"findings":[]},{"id":"0056-shared-runtime#R25","title":"Where a circuit breaker is supplied, the runtime shall record the failures every view sees in that circuit breaker.","line":376,"pattern":"optional-feature","exclusion":false,"verdict":"verified","evidence":"","charter":[],"tags":[],"scenarios":[{"title":"A supplied circuit breaker opened through a character's view rejects the public view","line":379,"tags":[]}],"source":"  Rule: Where a circuit breaker is supplied, the runtime shall record the failures every view sees in that circuit breaker.\n    Supplying a circuit breaker turns it on, as `enableCircuitBreaker` would.\n\n    Scenario: A supplied circuit breaker opened through a character's view rejects the public view\n      Given a runtime for the application \"fleet-tool/2.1 (ops@example.com)\" with a supplied circuit breaker that opens after 2 failures\n      And a view for a character holding an access token\n      And ESI answers the server status with 500 until the circuit opens\n      When the character's view requests the server status and the circuit opens\n      And the public view requests the server status\n      Then the public request shall be rejected with CircuitOpenError\n      And the supplied circuit breaker shall report 1 open circuit","sourceStart":376,"findings":[]},{"id":"0056-shared-runtime#R26","title":"Where a deduplicator is supplied, the runtime shall coalesce concurrent identical requests through that deduplicator.","line":388,"pattern":"optional-feature","exclusion":false,"verdict":"verified","evidence":"","charter":[],"tags":[],"scenarios":[{"title":"Two concurrent status requests are joined by the supplied deduplicator","line":392,"tags":[]}],"source":"  Rule: Where a deduplicator is supplied, the runtime shall coalesce concurrent identical requests through that deduplicator.\n    Supplying a deduplicator turns deduplication on, whatever\n    `enableRequestDeduplication` says.\n\n    Scenario: Two concurrent status requests are joined by the supplied deduplicator\n      Given a runtime for the application \"fleet-tool/2.1 (ops@example.com)\" with a supplied deduplicator\n      And ESI reports the server status after a delay\n      When the public view requests the server status twice at once\n      Then the runtime shall have sent 1 request\n      And the supplied deduplicator shall have been asked 2 times","sourceStart":388,"findings":[]},{"id":"0056-shared-runtime#R27","title":"Where a clock is supplied, the runtime shall age cached entries by that clock.","line":399,"pattern":"optional-feature","exclusion":false,"verdict":"verified","evidence":"","charter":[],"tags":[],"scenarios":[{"title":"A status older than its spec TTL by the supplied clock is revalidated","line":404,"tags":[]},{"title":"A status younger than its spec TTL by the supplied clock is served from the cache","line":414,"tags":[]}],"source":"  Rule: Where a clock is supplied, the runtime shall age cached entries by that clock.\n    The spec TTL of the server status is 30 seconds. Read by the supplied\n    clock, an entry older than that is revalidated with its ETag, and a\n    younger one answers without a request, whatever the wall clock says.\n\n    Scenario: A status older than its spec TTL by the supplied clock is revalidated\n      Given a runtime for the application \"fleet-tool/2.1 (ops@example.com)\" with a supplied clock\n      And ESI reports the server status with an ETag\n      And ESI confirms the server status is unchanged\n      When the public view requests the server status\n      And the supplied clock advances 31 seconds\n      And the public view requests the server status\n      Then the runtime shall have sent 2 requests\n      And the second request shall revalidate the cached ETag\n\n    Scenario: A status younger than its spec TTL by the supplied clock is served from the cache\n      Given a runtime for the application \"fleet-tool/2.1 (ops@example.com)\" with a supplied clock\n      And ESI reports the server status with an ETag\n      When the public view requests the server status\n      And the supplied clock advances 10 seconds\n      And the public view requests the server status\n      Then the runtime shall have sent 1 request","sourceStart":399,"findings":[]},{"id":"0056-shared-runtime#R28","title":"Where a clock is supplied, the runtime shall wait out the retry back-off on that clock.","line":422,"pattern":"optional-feature","exclusion":false,"verdict":"verified","evidence":"","charter":[],"tags":[],"scenarios":[{"title":"A retried server status waits on the supplied clock","line":426,"tags":[]}],"source":"  Rule: Where a clock is supplied, the runtime shall wait out the retry back-off on that clock.\n    A test, or a host with its own scheduler, then decides how long a back-off\n    takes.\n\n    Scenario: A retried server status waits on the supplied clock\n      Given a runtime for the application \"fleet-tool/2.1 (ops@example.com)\" with a supplied clock\n      And ESI answers the server status with 503 once and then reports it\n      When the public view requests the server status\n      Then the call shall resolve with the server status\n      And the supplied clock shall have been asked to wait before the retry","sourceStart":422,"findings":[]},{"id":"0056-shared-runtime#R29","title":"If the runtime is shut down, then the runtime shall not shut down a cache store or circuit breaker it was supplied.","line":434,"pattern":"unwanted-behaviour","exclusion":true,"verdict":"verified","evidence":"","charter":["TEST-11"],"tags":["@TEST-11"],"scenarios":[{"title":"A supplied cache store stays open after the runtime is shut down","line":439,"tags":[]}],"source":"  @TEST-11\n  Rule: If the runtime is shut down, then the runtime shall not shut down a cache store or circuit breaker it was supplied.\n    The application owns what it hands in, and may share one store between\n    runtimes or processes, so `shutdown()` releases only what the runtime\n    built itself.\n\n    Scenario: A supplied cache store stays open after the runtime is shut down\n      Given a runtime for the application \"fleet-tool/2.1 (ops@example.com)\" over a supplied cache store\n      When the runtime is shut down twice\n      Then the supplied cache store shall not have been shut down","sourceStart":433,"findings":[]},{"id":"0056-shared-runtime#R30","title":"When a view invokes an operation the spec marks deprecated, the runtime shall log one warning through the runtime's logger naming the operation, its replacement and its sunset date.","line":446,"pattern":"event-driven","exclusion":false,"verdict":"verified","evidence":"","charter":[],"tags":[],"scenarios":[{"title":"A deprecated operation called through the public view warns once","line":456,"tags":[]},{"title":"An operation the spec does not deprecate logs no warning","line":463,"tags":[]}],"source":"  Rule: When a view invokes an operation the spec marks deprecated, the runtime shall log one warning through the runtime's logger naming the operation, its replacement and its sunset date.\n    The first step of the deprecation process in guides/SEMVER.md is a\n    warning on every call, which the custom endpoint definitions give through\n    DeprecationInfo (0060-custom-client.feature), worded by the same helper.\n    The generator carries the spec's deprecated flag and the message,\n    replacement and sunset date from scripts/spec/operation-overlay.json into\n    the operation's metadata. No operation in the vendored spec is\n    deprecated today, so the scenario marks the server status metadata\n    deprecated for its duration.\n\n    Scenario: A deprecated operation called through the public view warns once\n      Given a runtime for the application \"fleet-tool/2.1 (ops@example.com)\" that logs to a recording logger\n      And the server status operation is marked deprecated in favour of the route status\n      And ESI reports the server status\n      When the public view requests the server status\n      Then the runtime's logger shall receive one warning naming the server status operation, the route status and the sunset date\n\n    Scenario: An operation the spec does not deprecate logs no warning\n      Given a runtime for the application \"fleet-tool/2.1 (ops@example.com)\" that logs to a recording logger\n      And ESI reports the server status\n      When the public view requests the server status\n      Then the runtime's logger shall receive no warning","sourceStart":446,"findings":[]},{"id":"0056-shared-runtime#R31","title":"When the public view requests the OpenAPI document in JSON form, the runtime shall resolve with the parsed document.","line":469,"pattern":"event-driven","exclusion":false,"verdict":"verified","evidence":"","charter":[],"tags":[],"scenarios":[{"title":"The JSON specification reaches the public view parsed","line":475,"tags":[]}],"source":"  Rule: When the public view requests the OpenAPI document in JSON form, the runtime shall resolve with the parsed document.\n    ESI serves its specification under meta/ without listing those paths in\n    the specification itself, so nothing is generated from the spec for them.\n    The generator adds both from scripts/spec/operation-overlay.json, as the\n    custom Meta client's endpoint map lists them.\n\n    Scenario: The JSON specification reaches the public view parsed\n      Given a runtime for the application \"fleet-tool/2.1 (ops@example.com)\"\n      And ESI serves its specification in JSON form\n      When the public view requests the OpenAPI document in JSON form\n      Then the view shall receive the parsed JSON specification","sourceStart":469,"findings":[]},{"id":"0056-shared-runtime#R32","title":"When the public view requests the OpenAPI document in YAML form, the runtime shall ask for YAML in the Accept header and resolve with the document as unparsed text.","line":481,"pattern":"event-driven","exclusion":false,"verdict":"verified","evidence":"","charter":[],"tags":[],"scenarios":[{"title":"The YAML specification reaches the public view as text","line":486,"tags":[]}],"source":"  Rule: When the public view requests the OpenAPI document in YAML form, the runtime shall ask for YAML in the Accept header and resolve with the document as unparsed text.\n    The YAML document is not JSON, so the overlay marks the operation as a\n    text response with the Accept header the custom Meta client sends, and\n    the transport hands the body back verbatim.\n\n    Scenario: The YAML specification reaches the public view as text\n      Given a runtime for the application \"fleet-tool/2.1 (ops@example.com)\"\n      And ESI serves its specification in YAML form\n      When the public view requests the OpenAPI document in YAML form\n      Then the view shall receive the YAML specification as text\n      And the request shall carry the header \"Accept\" with the value \"application/yaml, text/yaml, text/plain\"","sourceStart":481,"findings":[]},{"id":"0056-shared-runtime#R33","title":"If ESI answers a request for a public contract's bids or items with no content, then the runtime shall yield no entries.","line":493,"pattern":"unwanted-behaviour","exclusion":false,"verdict":"verified","evidence":"","charter":[],"tags":[],"scenarios":[{"title":"Bids on an auction accepted after the listing","line":502,"tags":[]},{"title":"Items on a contract answered with 204 No Content","line":508,"tags":[]}],"source":"  Rule: If ESI answers a request for a public contract's bids or items with no content, then the runtime shall yield no entries.\n    A public contract can expire or be accepted between the region listing\n    and the detail read. The spec documents a 204 beside the 200 on both\n    routes, and ESI in practice sends a 200 with Content-Length 0. The\n    generator marks every GET whose spec pairs a JSON 200 holding an array\n    with a 204, and the runtime reads either answer as an empty list, as the custom\n    Contracts client does. Every other operation keeps rejecting an empty\n    200 body.\n\n    Scenario: Bids on an auction accepted after the listing\n      Given a runtime for the application \"fleet-tool/2.1 (ops@example.com)\"\n      And ESI answers the public contract's bids with an empty 200 response\n      When the public view follows every page of the public contract's bids\n      Then the view shall receive no entries after one request\n\n    Scenario: Items on a contract answered with 204 No Content\n      Given a runtime for the application \"fleet-tool/2.1 (ops@example.com)\"\n      And ESI answers the public contract's items with 204 No Content\n      When the public view follows every page of the public contract's items\n      Then the view shall receive no entries after one request","sourceStart":493,"findings":[]},{"id":"0056-shared-runtime#R34","title":"While the validateResponse option is unset, the runtime shall return a generated operation's body as ESI sent it.","line":516,"pattern":"state-driven","exclusion":false,"verdict":"verified","evidence":"","charter":[],"tags":[],"scenarios":[{"title":"A server status without its player count is returned when validation is left unset","line":523,"tags":[]}],"source":"  Rule: While the validateResponse option is unset, the runtime shall return a generated operation's body as ESI sent it.\n    Generated operations have returned ESI's body unchecked since the runtime\n    shipped, so validating them by default would turn bodies applications\n    already accept into errors within a minor release. Validation is opt-in\n    until a future major makes it the default. The hand-written EsiClient\n    keeps validating by default; this concerns the generated operations only.\n\n    Scenario: A server status without its player count is returned when validation is left unset\n      Given a runtime for the application \"fleet-tool/2.1 (ops@example.com)\"\n      And ESI reports the server status without its player count\n      When the public view requests the server status\n      Then the call shall resolve with the server status as ESI sent it","sourceStart":516,"findings":[]},{"id":"0056-shared-runtime#R35","title":"Where response validation is turned on, if ESI answers a generated operation with a JSON body that does not match the operation's generated response schema, then the runtime shall reject the call with an EsiValidationError naming the request URL.","line":529,"pattern":"complex","exclusion":false,"verdict":"verified","evidence":"","charter":[],"tags":[],"scenarios":[{"title":"A server status without its player count is rejected when validation is on","line":536,"tags":[]},{"title":"A server status with a field the document does not name is accepted with that field when validation is on","line":542,"tags":[]}],"source":"  Rule: Where response validation is turned on, if ESI answers a generated operation with a JSON body that does not match the operation's generated response schema, then the runtime shall reject the call with an EsiValidationError naming the request URL.\n    `validateResponse: true` checks a generated operation's body against a Zod\n    schema generated from the OpenAPI document beside its type, as the\n    hand-written clients check theirs. A body that breaks the type the caller\n    compiled against fails at the call, not three functions later. Fields ESI\n    adds are kept, and so is a new enum member.\n\n    Scenario: A server status without its player count is rejected when validation is on\n      Given a runtime for the application \"fleet-tool/2.1 (ops@example.com)\" with response validation on\n      And ESI reports the server status without its player count\n      When the public view requests the server status\n      Then the call shall be rejected with an EsiValidationError naming \"/status\"\n\n    Scenario: A server status with a field the document does not name is accepted with that field when validation is on\n      Given a runtime for the application \"fleet-tool/2.1 (ops@example.com)\" with response validation on\n      And ESI reports the server status with an extra field \"shard\"\n      When the public view requests the server status\n      Then the call shall resolve with the server status as ESI sent it","sourceStart":529,"findings":[]},{"id":"0056-shared-runtime#R36","title":"Where response validation is turned off, the runtime shall return a generated operation's body as ESI sent it.","line":548,"pattern":"optional-feature","exclusion":false,"verdict":"verified","evidence":"","charter":[],"tags":[],"scenarios":[{"title":"A server status without its player count is returned when validation is off","line":552,"tags":[]}],"source":"  Rule: Where response validation is turned off, the runtime shall return a generated operation's body as ESI sent it.\n    `validateResponse: false` states the unvalidated behaviour explicitly, and\n    keeps it once a future major turns validation on by default.\n\n    Scenario: A server status without its player count is returned when validation is off\n      Given a runtime for the application \"fleet-tool/2.1 (ops@example.com)\" with response validation off\n      And ESI reports the server status without its player count\n      When the public view requests the server status\n      Then the call shall resolve with the server status as ESI sent it","sourceStart":548,"findings":[]}],"noUnwantedBehaviour":false,"orphanScenarios":0},{"file":"tests/bdd/features/core/0057-mock-transport.feature","area":"core","name":"A mock transport for an application's own tests","tags":["@ARCH-04"],"charter":["ARCH-04"],"description":"An application that uses the SDK needs its own tests to run without ESI. Until now it replaced `globalThis.fetch` by hand and rebuilt, in every project, the same routing table and the same record of what went over the wire. `createMockTransport()` in the `./testing` entry is an `HttpTransport`: it is passed as `transport` to `createEsi()` or to a custom client (`new EsiClient()`, `EsiClientBuilder`, `EsiApiFactory.createClient`), answers the requests the application's code sends from a table of routes, and keeps every request it saw so a test can assert on the method, the URL, the headers and the body.\n\nA route names a method and a path. The path is the ESI path template as the spec writes it, so `{character_id}` stands for one path segment, or a regular expression tested against the whole URL. Routes are tried in the order they were added and the first match answers. Everything between the application's call and the transport is the SDK's real pipeline: URL building, headers, retries, the cache, pagination and response validation all execute, so a test written against the mock can fail for a bug in the SDK as well as in the application.\n\nMost scenarios drive the generated operations through a runtime built over the mock transport; the last Rule drives the custom clients. All of them read the transport's own record of the exchange.","boundBy":["tests/bdd/specs/core/0057-mock-transport.spec.ts"],"rules":[{"id":"0057-mock-transport#R1","title":"When a request matches a route, the mock transport shall answer it with the route's status, headers and body.","line":28,"pattern":"event-driven","exclusion":false,"verdict":"verified","evidence":"","charter":[],"tags":[],"scenarios":[{"title":"A wallet balance routed by path template reaches a character's view","line":34,"tags":[]},{"title":"A routed 404 is raised as the not-found error ESI would cause","line":41,"tags":[]},{"title":"A route's X-Pages header drives pagination","line":48,"tags":[]}],"source":"  Rule: When a request matches a route, the mock transport shall answer it with the route's status, headers and body.\n    The route describes what ESI would send back; the pipeline treats the\n    answer as it would a real one. An object or array body is JSON-encoded\n    with `content-type: application/json`; a string body is sent verbatim.\n    The status defaults to 200 and headers are optional.\n\n    Scenario: A wallet balance routed by path template reaches a character's view\n      Given a runtime over a mock transport\n      And the mock transport answers \"GET\" \"/characters/{character_id}/wallet\" with the wallet balance\n      And a view for a character holding an access token\n      When the character's view requests the wallet balance\n      Then the view shall receive the wallet balance\n\n    Scenario: A routed 404 is raised as the not-found error ESI would cause\n      Given a runtime over a mock transport\n      And the mock transport answers \"GET\" \"/characters/{character_id}/wallet\" with status 404\n      And a view for a character holding an access token\n      When the character's view requests the wallet balance\n      Then the call shall be rejected with status 404\n\n    Scenario: A route's X-Pages header drives pagination\n      Given a runtime over a mock transport\n      And the mock transport answers \"GET\" \"/characters/{character_id}/assets\" with one asset on each of two pages\n      And a view for a character holding an access token
