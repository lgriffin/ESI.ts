# Dependency cool-off (R13). A version must have been public for the number
# of days below before Dependabot proposes it, so a compromised or broken
# release has time to be caught and yanked upstream before it reaches a PR
# here. Cooldown applies to version updates only: Dependabot security updates
# are not delayed.
#
# npm-side counterpart: none, deliberately. The npm equivalent is
# `min-release-age` in .npmrc, which needs npm >= 11.10. CI installs with the
# npm bundled with Node 20 (npm 10), which accepts the key without a warning
# and ignores it, so adding it would only look like a control. Add it to
# .npmrc, with a comment pointing back here, once CI runs npm 11.10 or later.
version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
      day: monday
    target-branch: master
    commit-message:
      prefix: 'chore(deps):'
    labels:
      - dependencies
    open-pull-requests-limit: 5
    cooldown:
      default-days: 7
      semver-major-days: 14
      semver-minor-days: 7
      semver-patch-days: 3
    groups:
      minor-and-patch:
        update-types:
          - minor
          - patch
      eslint:
        patterns:
          - 'eslint'
          - 'eslint-*'
          - '@typescript-eslint/*'
        update-types:
          - major
      # size-limit pins its plugins as exact peers, so a major bump of one
      # package without the others fails npm ci with ERESOLVE.
      size-limit:
        patterns:
          - 'size-limit'
          - '@size-limit/*'
      testing:
        patterns:
          - 'jest'
          - 'jest-*'
          - '@types/jest'
          - 'ts-jest'
        update-types:
          - major
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: wednesday
    commit-message:
      prefix: 'chore(ci):'
    labels:
      - dependencies
    open-pull-requests-limit: 5
    # github-actions has no semver-* cooldown keys; default-days covers every
    # update, including digest bumps of the SHA-pinned actions.
    cooldown:
      default-days: 7
    groups:
      codeql:
        patterns:
          - 'github/codeql-action'
