name: Skill Eval

# R14: skills are versioned, evaluated and gated. A change to a skill, its
# eval suite, or the eval runner runs the deterministic judges offline against
# each case's recorded outputs. There is no live, LLM-judged tier in CI: no
# model calls and no API key; `skill-eval.ts --live` remains a local option.

on:
  pull_request:
    branches: [master, main, develop]
    paths:
      - '.claude/skills/**'
      - 'scripts/quality/skill-eval.ts'
      - 'scripts/quality/skill-eval-judges.ts'
      - 'tests/tdd/scripts/skill-eval-judges.test.ts'
      - '.github/workflows/skill-eval.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: skill-eval-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  deterministic:
    name: Skill eval (deterministic)
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Unit-test the judges
        run: npx jest --config config/jest/unit.config.cjs --testPathPatterns=skill-eval-judges

      - name: Skill version bumped with SKILL.md
        if: github.event_name == 'pull_request'
        env:
          BASE_REF: ${{ github.base_ref }}
        run: npx ts-node scripts/quality/skill-eval.ts --check-version "origin/${BASE_REF}"

      - name: Judge recorded outputs (offline)
        run: npx ts-node scripts/quality/skill-eval.ts --json skill-eval-offline.json

      - name: Upload offline report
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: skill-eval-offline
          path: skill-eval-offline.json
          if-no-files-found: ignore
