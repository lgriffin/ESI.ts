name: Nightly Benchmarks and Heap Soak

# Tier L (performance and memory), the half that does not run on pull requests.
#
# benchmarks: builds master and a pinned reference commit on the same runner,
#   runs them in alternating processes (npm run bench:ab) and compares them
#   (npm run bench:compare). Pull requests only catch a regression against
#   their own base, so a run of small slowdowns, each under the threshold, would
#   pass one at a time; comparing against a fixed reference catches the sum.
# soak: first proves the soak still flags a deliberately leaky client, then
#   drives 100 000 requests through the real pipeline and fails on heap growth,
#   a cache above its bound, or timers and listeners left after shutdown.
# publish: appends the night's medians to history.jsonl on the `bench-data`
#   branch and moves the reference (reference.json) forward only when the run
#   was a bootstrap, found an improvement and no regression, or a maintainer
#   dispatched it with accept_reference after reviewing an accepted slowdown.
#   The reference therefore only ratchets towards faster code unless someone
#   says otherwise.
# report: keeps one open issue labelled `performance-nightly`, commenting on it
#   while either job fails and closing it when both pass.

on:
  schedule:
    - cron: '30 4 * * *'
  workflow_dispatch:
    inputs:
      accept_reference:
        description: "Make this run's commit the benchmark reference (after reviewing an accepted slowdown)"
        required: false
        default: false
        type: boolean

permissions:
  contents: read

concurrency:
  group: nightly-benchmarks
  cancel-in-progress: false

jobs:
  benchmarks:
    name: Benchmarks against the reference commit
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci --ignore-scripts

      # Exit code 2 from ls-remote means the branch does not exist: the first
      # run, which measures and records a reference. Any other failure, or a
      # branch without reference.json, fails closed.
      - name: Read the reference commit
        id: reference
        run: |
          set +e
          git ls-remote --exit-code --heads origin bench-data > /dev/null
          status=$?
          set -e
          if [ "$status" -eq 2 ]; then
            echo "bootstrap=true" >> "$GITHUB_OUTPUT"
            echo "::notice title=Benchmark bootstrap::No bench-data branch yet; this run measures master and records it as the reference."
            exit 0
          elif [ "$status" -ne 0 ]; then
            echo "::error::Could not read the bench-data branch (git ls-remote exited $status)."
            exit 1
          fi
          git fetch --no-tags --depth=1 origin bench-data
          sha=$(git show FETCH_HEAD:reference.json | jq -er '.sha')
          if ! [[ "$sha" =~ ^[0-9a-f]{40}$ ]]; then
            echo "::error::bench-data/reference.json does not hold a commit SHA."
            exit 1
          fi
          echo "bootstrap=false" >> "$GITHUB_OUTPUT"
          echo "sha=$sha" >> "$GITHUB_OUTPUT"

      - name: Check out the reference
        if: steps.reference.outputs.bootstrap == 'false'
        env:
          REFERENCE_SHA: ${{ steps.reference.outputs.sha }}
        run: |
          git fetch --no-tags --depth=1 origin "$REFERENCE_SHA"
          git worktree add --detach "$RUNNER_TEMP/reference" "$REFERENCE_SHA"
          (cd "$RUNNER_TEMP/reference" && npm ci --ignore-scripts)

      - name: Run reference and master in alternating processes
        if: steps.reference.outputs.bootstrap == 'false'
        run: npm run bench:ab -- --base "$RUNNER_TEMP/reference" --head . --out reports/bench --rounds 15 --min-cpu-ms 300

      - name: Measure master (bootstrap)
        if: steps.reference.outputs.bootstrap == 'true'
        run: npm run benchmark -- --out reports/bench --rounds 15 --min-cpu-ms 300

      - name: Compare with the reference
        if: steps.reference.outputs.bootstrap == 'false'
        env:
          REFERENCE_SHA: ${{ steps.reference.outputs.sha }}
        run: |
          npm run bench:compare -- --dir reports/bench --title "Nightly benchmarks, master against reference ${REFERENCE_SHA:0:12}"

      - name: Record the trend entry
        if: always() && (steps.reference.outputs.bootstrap == 'true' || steps.reference.outputs.bootstrap == 'false')
        env:
          REFERENCE_SHA: ${{ steps.reference.outputs.sha }}
        run: |
          if compgen -G "reports/bench/head-*.json" > /dev/null; then
            npm run --silent bench:trend -- --dir reports/bench --sha "$GITHUB_SHA" --reference "$REFERENCE_SHA" --out reports/bench/trend.json
          fi

      - name: Upload benchmark results
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: nightly-benchmarks
          path: reports/bench/
          retention-days: 90

  soak:
    name: Heap soak
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci --ignore-scripts

      # The soak's own signal: if it cannot see a client that keeps every
      # response, a green soak below means nothing.
      - name: The soak flags an injected leak
        run: npm run soak -- --inject-leak --expect-fail --requests 20000

      - name: Soak 100 000 requests through the pipeline
        run: npm run soak

      - name: Upload soak results
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: nightly-soak
          path: reports/soak/
          retention-days: 90

  publish:
    name: Publish trend data
    runs-on: ubuntu-latest
    needs: [benchmarks, soak]
    if: always() && needs.benchmarks.result != 'cancelled'
    timeout-minutes: 10
    permissions:
      contents: write # push history.jsonl and reference.json to bench-data

    steps:
      - name: Download benchmark results
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: nightly-benchmarks
          path: bench

      - name: Append to history and move the reference
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          ACCEPT_REFERENCE: ${{ inputs.accept_reference }}
          BENCHMARKS_RESULT: ${{ needs.benchmarks.result }}
        run: |
          if [ "$GITHUB_REF" != "refs/heads/master" ]; then
            echo "::notice::Not on master; trend data is not published."
            exit 0
          fi
          if [ ! -f bench/trend.json ]; then
            echo "::error::The benchmark job produced no trend entry to publish."
            exit 1
          fi

          # The token reaches git through environment configuration only, so
          # it is never written to disk or placed on a command line.
          export GIT_CONFIG_COUNT=1
          export GIT_CONFIG_KEY_0="http.https://github.com/.extraheader"
          GIT_CONFIG_VALUE_0="AUTHORIZATION: basic $(printf 'x-access-token:%s' "$GH_TOKEN" | base64 -w0)"
          export GIT_CONFIG_VALUE_0

          git init -q data && cd data
          git remote add origin "https://github.com/${GITHUB_REPOSITORY}.git"
          if git ls-remote --exit-code --heads origin bench-data > /dev/null; then
            git fetch -q --depth=1 origin bench-data
            git checkout -q -b bench-data FETCH_HEAD
          else
            git checkout -q --orphan bench-data
            printf '# bench-data\n\nNightly benchmark history written by .github/workflows/nightly-benchmarks.yml. history.jsonl holds one record per run; reference.json names the commit nightly runs compare against.\n' > README.md
          fi

          cat ../bench/trend.json >> history.jsonl
          verdict=$(jq -r '.verdict' ../bench/trend.json)
          improvements=$(jq -r '.improvements | length' ../bench/trend.json)

          reason=""
          if [ "$verdict" = "bootstrap" ]; then
            reason="bootstrap"
          elif [ "$ACCEPT_REFERENCE" = "true" ]; then
            reason="accepted by ${GITHUB_ACTOR} in run ${GITHUB_RUN_ID}"
          elif [ "$BENCHMARKS_RESULT" = "success" ] && [ "$verdict" = "pass" ] && [ "$improvements" -gt 0 ]; then
            reason="improved ${improvements} task(s) with no regression"
          fi
          if [ -n "$reason" ]; then
            jq -n --arg sha "$GITHUB_SHA" --arg reason "$reason" --arg date "$(date -u +%Y-%m-%dT%H:%M:%SZ)" \
              '{sha: $sha, reason: $reason, date: $date}' > reference.json
            echo "Reference moved to ${GITHUB_SHA} (${reason})." >> "$GITHUB_STEP_SUMMARY"
          fi

          git add -A
          git -c user.name='github-actions[bot]' -c user.email='41898282+github-actions[bot]@users.noreply.github.com' \
            commit -q -m "bench: nightly ${GITHUB_SHA:0:12} (${verdict})"
          git push -q origin bench-data

  report:
    name: File or update the performance issue
    runs-on: ubuntu-latest
    needs: [benchmarks, soak]
    if: always()
    timeout-minutes: 10
    permissions:
      issues: write # create, comment on and close the performance-nightly issue

    steps:
      - name: Download results
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        continue-on-error: true
        with:
          path: results

      - name: Create, update or close the issue
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          BENCHMARKS_RESULT: ${{ needs.benchmarks.result }}
          SOAK_RESULT: ${{ needs.soak.result }}
        run: |
          RUN_URL="${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"
          TITLE="performance-nightly: benchmark regression or heap soak failure"
          existing=$(gh issue list --label performance-nightly --state open --json number --jq '.[0].number // empty')

          if [ "$BENCHMARKS_RESULT" = "success" ] && [ "$SOAK_RESULT" = "success" ]; then
            if [ -n "$existing" ]; then
              gh issue close "$existing" --comment "Benchmarks and soak passed on $(date -u +%Y-%m-%d) ([run](${RUN_URL})). Closing automatically."
            fi
            exit 0
          fi

          {
            echo "## Nightly performance run — $(date -u +%Y-%m-%d)"
            echo ""
            echo "- Benchmarks: **${BENCHMARKS_RESULT}**"
            echo "- Heap soak: **${SOAK_RESULT}**"
            echo "- Run: ${RUN_URL}"
            echo ""
            for f in results/nightly-benchmarks/comparison.md; do
              [ -f "$f" ] && cat "$f"
            done
            echo ""
            echo "See tests/benchmark/AGENTS.md for how to reproduce a regression locally (npm run bench:ab), and how to accept a reviewed slowdown by dispatching this workflow with accept_reference."
          } > body.md

          gh label create performance-nightly --color D93F0B \
            --description "Automated: nightly benchmark regression or heap soak failure" 2>/dev/null || true
          if [ -n "$existing" ]; then
            gh issue comment "$existing" --body-file body.md
          else
            gh issue create --title "$TITLE" --label performance-nightly --body-file body.md
          fi
