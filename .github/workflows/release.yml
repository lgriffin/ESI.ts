name: Release Pipeline

on:
  push:
    tags:
      - 'v*.*.*'
  release:
    types: [published]
  # release-please creates the tag and release with GITHUB_TOKEN, and events
  # raised by GITHUB_TOKEN start no other workflow. Publish such a release by
  # dispatching this workflow on its tag:
  #   gh workflow run release.yml --ref vX.Y.Z
  workflow_dispatch:

permissions:
  contents: read

jobs:
  # Job 1: Validate Release
  validate-release:
    name: 🔍 Validate Release
    runs-on: ubuntu-latest

    steps:
      - name: 🏷️ Require a version tag
        env:
          REF_TYPE: ${{ github.ref_type }}
          REF_NAME: ${{ github.ref_name }}
        run: |
          if [ "$REF_TYPE" != "tag" ] || ! [[ "$REF_NAME" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::Run the release pipeline on a vX.Y.Z tag (gh workflow run release.yml --ref vX.Y.Z), not on $REF_TYPE '$REF_NAME'"
            exit 1
          fi

      - name: 📥 Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: 📦 Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: '20'
          package-manager-cache: false

      - name: 📋 Install dependencies
        run: npm ci

      - name: 🏷️ Tag matches package version
        env:
          REF_NAME: ${{ github.ref_name }}
        run: |
          VERSION=$(node -p "require('./package.json').version")
          if [ "v${VERSION}" != "$REF_NAME" ]; then
            echo "::error::Tag $REF_NAME does not match package.json version $VERSION"
            exit 1
          fi
          npm run validate:versions

      - name: 🔍 Run linting
        run: npm run lint

      - name: 🔍 Check formatting
        run: npm run format:check

      - name: 🔍 Dead code detection
        run: npx knip --no-exit-code

      # Unlike the PR path, a release is exactly where a state-of-the-world audit
      # belongs — we are about to ship to consumers, so a newly disclosed high
      # should stop the publish. The allowlist keeps reviewed, accepted risks
      # from blocking it; anything else has to be fixed or explicitly accepted.
      - name: 🔒 Security audit
        run: npm run audit:check

      - name: 📋 Verify changelog
        run: |
          VERSION=$(node -p "require('./package.json').version")
          grep -q "## \[${VERSION}\]" CHANGELOG.md || (echo "CHANGELOG.md missing entry for v${VERSION}" && exit 1)

      - name: 🏗️ Build project
        run: npm run build

      # Fails on drift not in scripts/schema-drift-baseline.json and on stale
      # entries. The shrink-only half of the ratchet is enforced on pull
      # requests; here the tag is its own base, so a master that has since
      # pruned the baseline cannot block releasing an earlier commit.
      - name: 🔍 Schema drift check
        env:
          SCHEMA_DRIFT_BASE_REF: HEAD
        run: npm run schema:drift:ci

      - name: 🔍 Verify generated types are fresh
        run: |
          npm run generate:types
          git diff --exit-code src/types/generated/ src/core/endpoints/esi-cache-ttls.generated.ts || {
            echo "Generated types are stale — run 'npm run generate:types' and commit the result"
            exit 1
          }

      - name: 🧪 Run full test suite
        run: npm run test:all

      - name: 📚 Generate documentation
        run: npm run docs

  # Job 2: Publish to NPM
  # Publishes the tarball create-assets packed — the same bytes the consumer
  # matrix installed and cosign signed. It used to check out and rebuild, so
  # npm served an artefact nothing had tested and nothing had signed, differing
  # from the GitHub Release asset of the same version by whatever the second
  # build did differently (esi-23g.42).
  publish-npm:
    name: 📦 Publish to NPM
    runs-on: ubuntu-latest
    needs: [validate-release, create-assets, consumer-contract]
    if: github.event_name == 'workflow_dispatch' || (github.event_name == 'release' && github.event.action == 'published')
    permissions:
      contents: read
      id-token: write

    steps:
      - name: 📦 Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: '20'
          package-manager-cache: false
          registry-url: 'https://registry.npmjs.org'

      - name: ⬇️ Download the packed tarball
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: release-artifacts

      # The checksums create-assets recorded, re-checked here over every file
      # in the artifact. If the bytes changed between packing and publishing,
      # the thing cosign signs and the thing npm serves are already different
      # and the run must stop.
      - name: 🔢 Verify the artifacts against their checksums
        run: sha256sum --check --strict checksums.txt

      - name: 📦 Publish to NPM
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
          TARBALL: ${{ needs.create-assets.outputs.tarball }}
        run: npm publish "$TARBALL" --provenance

  # Job 3: Publish to GitHub Packages
  # Same tarball as publish-npm, for the same reason: the two registries should
  # not be serving different bytes under one version.
  publish-github:
    name: 📦 Publish to GitHub Packages
    runs-on: ubuntu-latest
    needs: [validate-release, create-assets, consumer-contract]
    if: github.event_name == 'workflow_dispatch' || (github.event_name == 'release' && github.event.action == 'published')
    permissions:
      packages: write
      id-token: write # npm provenance attestation

    steps:
      - name: 📦 Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: '20'
          package-manager-cache: false
          registry-url: 'https://npm.pkg.github.com'

      - name: ⬇️ Download the packed tarball
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: release-artifacts

      - name: 🔢 Verify the artifacts against their checksums
        run: sha256sum --check --strict checksums.txt

      - name: 📦 Publish to GitHub Packages
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TARBALL: ${{ needs.create-assets.outputs.tarball }}
        run: npm publish "$TARBALL" --provenance

  # Job 4: Deploy Documentation
  deploy-docs:
    name: 📚 Deploy Documentation
    runs-on: ubuntu-latest
    needs: validate-release
    permissions:
      contents: write

    steps:
      - name: 📥 Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: 📦 Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: '20'
          package-manager-cache: false

      - name: 📋 Install dependencies
        run: npm ci

      - name: 📚 Generate documentation
        run: npm run docs

      - name: 🚀 Deploy to GitHub Pages
        uses: peaceiris/actions-gh-pages@84c30a85c19949d7eee79c4ff27748b70285e453 # v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./docs-site/public/api

  # Job 4: Create Release Assets (no OIDC — build only, hands off to sign-and-publish)
  create-assets:
    name: 📎 Create Release Assets
    runs-on: ubuntu-latest
    needs: validate-release
    permissions:
      contents: read

    outputs:
      tarball: ${{ steps.pack.outputs.tarball }}
      sbom: ${{ steps.sbom.outputs.sbom }}

    steps:
      - name: 📥 Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: 📦 Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: '20'
          package-manager-cache: false

      - name: 📋 Install dependencies
        run: npm ci

      - name: 🏗️ Build project
        run: npm run build

      - name: 📚 Generate documentation
        run: npm run docs

      - name: 📦 Create distribution package
        id: pack
        run: |
          npm pack
          count=$(ls -1 *.tgz | wc -l)
          if [ "$count" -ne 1 ]; then
            echo "Expected exactly one tarball, found $count:" >&2
            ls -1 *.tgz >&2
            exit 1
          fi
          echo "tarball=$(ls -1 *.tgz)" >> "$GITHUB_OUTPUT"

      # SEC-06. The CycloneDX bill of materials for the tarball just packed:
      # its own package.json, versions pinned by package-lock.json, dev
      # dependencies left out. The script fails the release if the SBOM does
      # not name this package at this version or misses a runtime dependency;
      # scripts/release-sbom-core.ts says why it does not run
      # `npm sbom --omit dev` on the checkout.
      - name: 📋 Generate the SBOM
        id: sbom
        env:
          TARBALL: ${{ steps.pack.outputs.tarball }}
        run: npm run release:sbom -- --tarball "$TARBALL"

      - name: 🗜️ Create documentation archive
        run: tar -czf docs.tar.gz -C docs-site/public api

      - name: 🔢 Generate SHA256 checksums
        env:
          TARBALL: ${{ steps.pack.outputs.tarball }}
          SBOM: ${{ steps.sbom.outputs.sbom }}
        run: sha256sum "$TARBALL" "$SBOM" docs.tar.gz > checksums.txt

      - name: ⬆️ Upload build artifacts for signing
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: release-artifacts
          path: |
            ${{ steps.pack.outputs.tarball }}
            ${{ steps.sbom.outputs.sbom }}
            docs.tar.gz
            checksums.txt
          retention-days: 1
          if-no-files-found: error

  # Job 4a: The consumer contract against the tarball create-assets packed,
  # the file that is signed and attached to the GitHub Release. Same rows as
  # the consumer-contract job in ci.yml. Publishing waits for it.
  consumer-contract:
    name: 🧪 Consumer Contract (Node ${{ matrix.node-version }}, TypeScript ${{ matrix.typescript }})
    runs-on: ubuntu-latest
    needs: create-assets
    permissions:
      contents: read

    strategy:
      fail-fast: false
      matrix:
        include:
          - node-version: 18
            typescript: oldest
          - node-version: 20
            typescript: repo
          - node-version: 22
            typescript: latest
          - node-version: 24
            typescript: repo

    steps:
      - name: 📥 Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: 📦 Setup Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: ${{ matrix.node-version }}
          package-manager-cache: false

      # --ignore-scripts skips `prepare`: the runner only needs ts-node, and the
      # tarball under test is the downloaded one, not a fresh build.
      - name: 📋 Install dependencies
        run: npm ci --ignore-scripts

      - name: ⬇️ Download the release tarball
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: release-artifacts
          path: release-artifacts/

      - name: 🧪 Run the consumer contract
        env:
          TARBALL: ${{ needs.create-assets.outputs.tarball }}
          TYPESCRIPT: ${{ matrix.typescript }}
        run: npm run test:consumer -- --tarball "release-artifacts/$TARBALL" --typescript "$TYPESCRIPT"

  # Job 4b: Sign & publish release assets (isolated so only this job can mint OIDC tokens)
  sign-and-publish-assets:
    name: 🔏 Sign & Publish Release Assets
    runs-on: ubuntu-latest
    needs: [create-assets, consumer-contract]
    if: github.event_name == 'workflow_dispatch' || (github.event_name == 'release' && github.event.action == 'published')
    permissions:
      contents: write # upload assets to the GitHub Release
      id-token: write # keyless cosign signing (OIDC → Fulcio)

    steps:
      - name: 📥 Checkout code # for README.md / LICENSE
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: ⬇️ Download build artifacts
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: release-artifacts

      - name: 🔏 Install Cosign
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2

      # cosign 3 writes the signature, certificate and transparency-log entry
      # into one Sigstore bundle, and refuses sign-blob without --bundle.
      - name: 🔏 Sign release artifacts (keyless)
        env:
          TARBALL: ${{ needs.create-assets.outputs.tarball }}
          SBOM: ${{ needs.create-assets.outputs.sbom }}
        run: |
          for artifact in "$TARBALL" "$SBOM" docs.tar.gz; do
            cosign sign-blob --yes \
              --bundle "${artifact}.sigstore.json" \
              "$artifact"
          done

      - name: 📎 Upload release assets
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TARBALL: ${{ needs.create-assets.outputs.tarball }}
          SBOM: ${{ needs.create-assets.outputs.sbom }}
        run: |
          gh release upload "$GITHUB_REF_NAME" --clobber \
            "$TARBALL" \
            "${TARBALL}.sigstore.json" \
            "$SBOM" \
            "${SBOM}.sigstore.json" \
            docs.tar.gz \
            docs.tar.gz.sigstore.json \
            checksums.txt \
            README.md \
            LICENSE

  # Job 5: Notify Success
  notify-success:
    name: 🎉 Notify Success
    runs-on: ubuntu-latest
    needs:
      [
        publish-npm,
        publish-github,
        deploy-docs,
        create-assets,
        sign-and-publish-assets,
      ]
    if: always() && needs.publish-npm.result == 'success'

    steps:
      - name: 🎉 Release Success
        run: |
          echo "🚀 Release completed successfully!"
          echo "✅ NPM package published"
          echo "✅ Documentation deployed"
          echo "✅ Release assets created"
