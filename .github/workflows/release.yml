name: Release Pipeline

on:
  push:
    tags:
      - 'v*.*.*'
  release:
    types: [published]

permissions:
  contents: read

jobs:
  # Job 1: Validate Release
  validate-release:
    name: 🔍 Validate Release
    runs-on: ubuntu-latest

    steps:
      - name: 📥 Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: 📦 Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: '20'
          cache: 'npm'

      - name: 📋 Install dependencies
        run: npm ci

      - name: 🔍 Run linting
        run: npm run lint

      - name: 🔍 Check formatting
        run: npm run format:check

      - name: 🔍 Dead code detection
        run: npx knip --no-exit-code

      - name: 🔒 Security audit
        run: npm audit --audit-level=high

      - name: 📋 Verify changelog
        run: |
          VERSION=$(node -p "require('./package.json').version")
          grep -q "## \[${VERSION}\]" CHANGELOG.md || (echo "CHANGELOG.md missing entry for v${VERSION}" && exit 1)

      - name: 🏗️ Build project
        run: npm run build

      - name: 🔍 Schema drift check
        run: npm run schema:drift:ci

      - name: 🔍 Verify generated types are fresh
        run: |
          npm run generate:types
          git diff --exit-code src/types/generated/ src/core/endpoints/esi-cache-ttls.generated.ts || {
            echo "Generated types are stale — run 'npm run generate:types' and commit the result"
            exit 1
          }

      - name: 🧪 Run full test suite
        run: npm run test:all

      - name: 📚 Generate documentation
        run: npm run docs

  # Job 2: Publish to NPM
  publish-npm:
    name: 📦 Publish to NPM
    runs-on: ubuntu-latest
    needs: validate-release
    if: github.event_name == 'release' && github.event.action == 'published'
    permissions:
      contents: read
      id-token: write

    steps:
      - name: 📥 Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: 📦 Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: '20'
          cache: 'npm'
          registry-url: 'https://registry.npmjs.org'

      - name: 📋 Install dependencies
        run: npm ci

      - name: 🏗️ Build project
        run: npm run build

      - name: 📦 Publish to NPM
        run: npm publish --provenance
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

  # Job 3: Publish to GitHub Packages
  publish-github:
    name: 📦 Publish to GitHub Packages
    runs-on: ubuntu-latest
    needs: validate-release
    if: github.event_name == 'release' && github.event.action == 'published'
    permissions:
      packages: write

    steps:
      - name: 📥 Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: 📦 Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: '20'
          cache: 'npm'
          registry-url: 'https://npm.pkg.github.com'

      - name: 📋 Install dependencies
        run: npm ci

      - name: 🏗️ Build project
        run: npm run build

      - name: 📦 Publish to GitHub Packages
        run: npm publish
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # Job 4: Deploy Documentation
  deploy-docs:
    name: 📚 Deploy Documentation
    runs-on: ubuntu-latest
    needs: validate-release
    permissions:
      contents: write

    steps:
      - name: 📥 Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: 📦 Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: '20'
          cache: 'npm'

      - name: 📋 Install dependencies
        run: npm ci

      - name: 📚 Generate documentation
        run: npm run docs

      - name: 🚀 Deploy to GitHub Pages
        uses: peaceiris/actions-gh-pages@84c30a85c19949d7eee79c4ff27748b70285e453 # v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./docs

  # Job 4: Create Release Assets (no OIDC — build only, hands off to sign-and-publish)
  create-assets:
    name: 📎 Create Release Assets
    runs-on: ubuntu-latest
    needs: validate-release
    permissions:
      contents: read

    outputs:
      tarball: ${{ steps.pack.outputs.tarball }}

    steps:
      - name: 📥 Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: 📦 Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: '20'
          cache: 'npm'

      - name: 📋 Install dependencies
        run: npm ci

      - name: 🏗️ Build project
        run: npm run build

      - name: 📚 Generate documentation
        run: npm run docs

      - name: 📦 Create distribution package
        id: pack
        run: |
          npm pack
          count=$(ls -1 *.tgz | wc -l)
          if [ "$count" -ne 1 ]; then
            echo "Expected exactly one tarball, found $count:" >&2
            ls -1 *.tgz >&2
            exit 1
          fi
          echo "tarball=$(ls -1 *.tgz)" >> "$GITHUB_OUTPUT"

      - name: 🗜️ Create documentation archive
        run: tar -czf docs.tar.gz docs/

      - name: 🔢 Generate SHA256 checksums
        env:
          TARBALL: ${{ steps.pack.outputs.tarball }}
        run: sha256sum "$TARBALL" docs.tar.gz > checksums.txt

      - name: ⬆️ Upload build artifacts for signing
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: release-artifacts
          path: |
            ${{ steps.pack.outputs.tarball }}
            docs.tar.gz
            checksums.txt
          retention-days: 1
          if-no-files-found: error

  # Job 4b: Sign & publish release assets (isolated so only this job can mint OIDC tokens)
  sign-and-publish-assets:
    name: 🔏 Sign & Publish Release Assets
    runs-on: ubuntu-latest
    needs: create-assets
    permissions:
      contents: write # upload assets to the GitHub Release
      id-token: write # keyless cosign signing (OIDC → Fulcio)

    steps:
      - name: 📥 Checkout code # for README.md / LICENSE
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: ⬇️ Download build artifacts
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: release-artifacts

      - name: 🔏 Install Cosign
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2

      - name: 🔏 Sign release artifacts (keyless)
        env:
          TARBALL: ${{ needs.create-assets.outputs.tarball }}
        run: |
          for artifact in "$TARBALL" docs.tar.gz; do
            cosign sign-blob --yes \
              --output-signature "${artifact}.sig" \
              --output-certificate "${artifact}.pem" \
              "$artifact"
          done

      - name: 📎 Upload release assets
        uses: softprops/action-gh-release@3d0d9888cb7fd7b750713d6e236d1fcb99157228 # v3
        with:
          files: |
            ${{ needs.create-assets.outputs.tarball }}
            ${{ needs.create-assets.outputs.tarball }}.sig
            ${{ needs.create-assets.outputs.tarball }}.pem
            docs.tar.gz
            docs.tar.gz.sig
            docs.tar.gz.pem
            checksums.txt
            README.md
            LICENSE
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # Job 5: Notify Success
  notify-success:
    name: 🎉 Notify Success
    runs-on: ubuntu-latest
    needs:
      [
        publish-npm,
        publish-github,
        deploy-docs,
        create-assets,
        sign-and-publish-assets,
      ]
    if: always() && needs.publish-npm.result == 'success'

    steps:
      - name: 🎉 Release Success
        run: |
          echo "🚀 Release completed successfully!"
          echo "✅ NPM package published"
          echo "✅ Documentation deployed"
          echo "✅ Release assets created"
