name: Nightly No-Retry Test Run

# Runs the full unit + BDD suite (jest.unit.config.cjs, the same suite as
# `npm test`) once a night with Jest retries disabled, to surface flaky tests
# that a retry would otherwise hide.
#
# Nothing in the repository configures Jest retries today (no jest.retryTimes
# in src/, tests/ or any jest config), so there is no switch to turn off.
# Instead this run proves it: Jest records how many times each test was
# invoked, and the job fails if any test needed more than one attempt. If
# someone later adds jest.retryTimes, a test that only passes on retry turns
# this run red and names the test, even while the PR suites stay green.
#
# Order is not randomised. With --randomize, 80 tests in 20 client suites
# under tests/tdd/ time out: the describeClientErrors HTTP 429 case blocks the
# endpoint's rate-limit group for 60s on the suite's shared ApiClient (built
# without a test-mode rate limiter), so every test that runs after it in the
# file waits past the 5s timeout. In declaration order the 429 case runs last.
# Until that order dependence is fixed, a randomised run would be red every
# night and bury the flake signal this workflow exists for.

on:
  schedule:
    - cron: '0 3 * * *'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: nightly-no-retry
  cancel-in-progress: false

jobs:
  no-retry:
    name: Unit + BDD, no retries
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run unit and BDD tests
        id: jest
        run: |
          mkdir -p reports/no-retry
          npx jest --config jest.unit.config.cjs --ci \
            --json --outputFile=reports/no-retry/jest-results.json

      - name: Fail if any test needed a retry
        if: always() && steps.jest.outcome != 'skipped'
        run: |
          REPORT=reports/no-retry/jest-results.json
          if ! jq -e . "$REPORT" > /dev/null 2>&1; then
            echo "::error::$REPORT is missing or not valid JSON; Jest did not produce a report"
            exit 1
          fi
          RETRIED=$(jq -r '
            .testResults[] as $file
            | $file.assertionResults[]
            | select((.invocations // 1) > 1)
            | "\($file.name): \(.fullName) (\(.invocations) attempts, final: \(.status))"
          ' "$REPORT")
          if [ -n "$RETRIED" ]; then
            echo "::error::Tests were retried. Retries hide flakiness; remove jest.retryTimes and fix these tests:"
            echo "$RETRIED"
            exit 1
          fi
          echo "No test was retried."

      - name: Upload Jest report
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        if: always()
        with:
          name: no-retry-report
          path: reports/no-retry/
          retention-days: 30

      - name: Summary
        if: always()
        env:
          JEST_OUTCOME: ${{ steps.jest.outcome }}
        run: |
          REPORT=reports/no-retry/jest-results.json
          {
            echo "## Nightly No-Retry Test Run"
            echo ""
            echo "- **Date:** $(date -u +%Y-%m-%dT%H:%M:%SZ)"
            echo "- **Jest outcome:** $JEST_OUTCOME"
            if jq -e . "$REPORT" > /dev/null 2>&1; then
              echo "- **Tests:** $(jq '.numPassedTests' "$REPORT") passed, $(jq '.numFailedTests' "$REPORT") failed, $(jq '.numPendingTests' "$REPORT") skipped"
              FAILED=$(jq -r '.testResults[] as $f | $f.assertionResults[] | select(.status == "failed") | "- `\($f.name | sub(".*/tests/"; "tests/"))`: \(.fullName)"' "$REPORT" | head -50)
              if [ -n "$FAILED" ]; then
                echo ""
                echo "### Failed tests"
                echo "$FAILED"
              fi
            fi
          } >> "$GITHUB_STEP_SUMMARY"
