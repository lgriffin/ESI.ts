name: Release Please

on:
  push:
    branches: [master]
  # Ship a patch-only release on purpose (an urgent fix): run this workflow
  # with force-release ticked and it opens the release PR anyway.
  workflow_dispatch:
    inputs:
      force-release:
        description: Open a release PR even if only fixes landed since the last release
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  release-please:
    name: Release Please
    runs-on: ubuntu-latest
    env:
      # Secrets cannot appear in an if:, so the mint step reads this instead.
      HAS_APP_KEY: ${{ secrets.RELEASE_APP_PRIVATE_KEY != '' }}
    permissions:
      contents: write # create release commits/tags
      pull-requests: write # open/update the release PR

    outputs:
      app_token: ${{ steps.app-token.outcome == 'success' }}
      release_created: ${{ steps.release.outputs.release_created }}
      tag_name: ${{ steps.release.outputs.tag_name }}
      version: ${{ steps.release.outputs.version }}

    steps:
      # Releases are cut for new features (minor) and breaking changes
      # (major) only. Fixes, chores and dependency bumps accumulate and ship
      # in the next minor, so no release PR is opened until a feat, a
      # breaking change or a Release-As footer lands. Merging an existing
      # release PR still tags and publishes, because only the PR step is
      # skipped.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Decide whether a release is due
        id: gate
        env:
          FORCE: ${{ inputs.force-release }}
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        run: |
          if [ "$FORCE" = "true" ]; then
            echo "Forced by workflow_dispatch"
            echo "skip-pr=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          # An open release PR (for example a forced patch) keeps updating
          # with every later fix, so its changelog stays complete.
          open_prs=$(gh pr list --repo "$REPO" --state open --label 'autorelease: pending' --json number --jq length)
          if [ "$open_prs" -gt 0 ]; then
            echo "A release PR is already open; keeping it up to date"
            echo "skip-pr=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          last=$(git describe --tags --abbrev=0 --match 'v[0-9]*.[0-9]*.[0-9]*' 2>/dev/null || true)
          range=${last:+$last..}HEAD
          if git log "$range" --format=%B | grep -E '^(feat(\([^)]*\))?!?|[a-z]+(\([^)]*\))?!): |^BREAKING[ -]CHANGE: |^Release-As: ' >/dev/null; then
            echo "Release-worthy commits since ${last:-the start}"
            echo "skip-pr=false" >> "$GITHUB_OUTPUT"
          else
            echo "Only fixes/chores since $last; not opening a release PR"
            echo "skip-pr=true" >> "$GITHUB_OUTPUT"
          fi

      # Events raised with GITHUB_TOKEN start no other workflow, so a release
      # PR opened with it waits for someone to approve its CI (#378) and the
      # tag it creates never starts release.yml (#383). A GitHub App token
      # has neither problem. The app is configured by the RELEASE_APP_CLIENT_ID
      # variable and the RELEASE_APP_PRIVATE_KEY secret (guides/RELEASE.md);
      # without both it falls back to GITHUB_TOKEN and the dispatch below.
      - name: Mint release token
        id: app-token
        if: vars.RELEASE_APP_CLIENT_ID != '' && env.HAS_APP_KEY == 'true'
        # A bad key or a missing installation must not stop releases: the
        # release step falls back to GITHUB_TOKEN and dispatch-release runs.
        continue-on-error: true
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          client-id: ${{ vars.RELEASE_APP_CLIENT_ID }}
          private-key: ${{ secrets.RELEASE_APP_PRIVATE_KEY }}
          permission-contents: write
          permission-pull-requests: write
          permission-issues: write

      - name: Warn when the release token could not be minted
        if: steps.app-token.outcome == 'failure'
        run: echo "::warning title=Release app token::Minting failed, so this run uses GITHUB_TOKEN. Check the app is installed on this repository and RELEASE_APP_PRIVATE_KEY is current (guides/RELEASE.md)."

      - uses: googleapis/release-please-action@45996ed1f6d02564a971a2fa1b5860e934307cf7 # v5
        id: release
        with:
          token: ${{ steps.app-token.outputs.token || github.token }}
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json
          skip-github-pull-request: ${{ steps.gate.outputs.skip-pr }}

      # A merge commit's body repeats its pull request's title, so
      # release-please lists every change merged that way twice (#377). This
      # drops the merge's line from the open release PR's CHANGELOG.md and
      # body (the body becomes the GitHub release), keeping the commit's own
      # line, which carries its `closes` links. release-please rewrites the
      # branch on every push to master, so this runs after each rewrite.
      - name: Setup Node.js
        if: steps.gate.outputs.skip-pr != 'true' && steps.release.outputs.release_created != 'true'
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: '22'
          # No npm cache: a cache restored into a release job could be poisoned.

      - name: Drop release-note lines a merge commit repeats
        if: steps.gate.outputs.skip-pr != 'true' && steps.release.outputs.release_created != 'true'
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token || github.token }}
          REPO: ${{ github.repository }}
        run: |
          pr=$(gh pr list --repo "$REPO" --state open --label 'autorelease: pending' \
            --json number,headRefName --jq '.[0] | select(.) | "\(.number) \(.headRefName)"')
          if [ -z "$pr" ]; then
            echo "No open release PR"
            exit 0
          fi
          read -r number branch <<< "$pr"
          npm ci --ignore-scripts
          git fetch --no-tags origin "$branch"
          git checkout -B "$branch" FETCH_HEAD
          gh pr view "$number" --repo "$REPO" --json body --jq .body > "$RUNNER_TEMP/body.md"
          npm run release:dedupe-changelog -- --changelog CHANGELOG.md --body "$RUNNER_TEMP/body.md"
          if ! git diff --quiet -- CHANGELOG.md; then
            git -c user.name='github-actions[bot]' \
              -c user.email='41898282+github-actions[bot]@users.noreply.github.com' \
              commit -m 'ci(release): drop changelog lines a merge commit repeats' -- CHANGELOG.md
            git push "https://x-access-token:${GH_TOKEN}@github.com/${REPO}.git" "HEAD:refs/heads/$branch"
          fi
          gh pr edit "$number" --repo "$REPO" --body-file "$RUNNER_TEMP/body.md"

  # Fallback for when no release app token was used: the tag and release came
  # from GITHUB_TOKEN, so nothing else started. workflow_dispatch is exempt
  # from that rule, so start the publish here (#383); release.yml then
  # dispatches the canary once npm has the version. A re-run of this job does
  # not dispatch a second publish for the same tag.
  dispatch-release:
    name: Dispatch release pipeline
    needs: release-please
    if: needs.release-please.outputs.release_created == 'true' && needs.release-please.outputs.app_token != 'true'
    runs-on: ubuntu-latest
    permissions:
      actions: write # workflow_dispatch release.yml

    steps:
      - name: Dispatch release.yml on the new tag
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          TAG: ${{ needs.release-please.outputs.tag_name }}
        run: |
          existing=$(gh run list --repo "$REPO" --workflow release.yml --event workflow_dispatch \
            --branch "$TAG" --json databaseId --jq length)
          if [ "$existing" -gt 0 ]; then
            echo "release.yml has already been dispatched on $TAG; not dispatching again"
            exit 0
          fi
          gh workflow run release.yml --repo "$REPO" --ref "$TAG"
