name: Nightly Consumer Matrix

# The consumer contract (scripts/quality/consumer-contract.ts) on the part of the
# matrix pull requests do not run: TypeScript's nightly `next` build and its
# `latest` release, on the current Node release and the active LTS, plus the
# oldest supported TypeScript on current Node. A failure here is a
# compatibility break coming from a toolchain release rather than from a pull
# request; it names the cell in the job title and the step summary.
#
# Pull requests run four rows of the matrix in ci.yml (`consumer-contract`).

on:
  schedule:
    - cron: '45 4 * * *'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: consumer-matrix-nightly
  cancel-in-progress: false

jobs:
  tarball:
    name: Build and pack
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: '22'
          cache: 'npm'

      # `prepare` builds dist/.
      - name: Install dependencies and build
        run: npm ci

      # npm 10, the version Node 22 bundles, runs `prepare` on `npm pack` even
      # with --ignore-scripts (fixed in npm 11), which would build dist/ a
      # second time. npm 11 packs the one the install above built.
      - name: Pack
        run: |
          mkdir -p consumer-tarball
          npx --yes npm@11.17.0 pack --ignore-scripts --pack-destination consumer-tarball

      - name: Upload the tarball
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: consumer-tarball
          path: consumer-tarball/*.tgz
          retention-days: 1
          if-no-files-found: error

  consumer-contract:
    name: Consumer Contract (Node ${{ matrix.node-version }}, TypeScript ${{ matrix.typescript }})
    runs-on: ubuntu-latest
    needs: tarball
    timeout-minutes: 20

    strategy:
      fail-fast: false
      matrix:
        node-version: ['lts/*', 'current']
        typescript: [next, latest]
        include:
          - node-version: 'current'
            typescript: oldest

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Setup Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: ${{ matrix.node-version }}
          cache: 'npm'

      - name: Install dependencies
        run: npm ci --ignore-scripts

      - name: Download the tarball
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: consumer-tarball
          path: consumer-tarball/

      - name: Run the consumer contract
        env:
          TYPESCRIPT: ${{ matrix.typescript }}
        run: npm run test:consumer -- --tarball "$(ls consumer-tarball/*.tgz)" --typescript "$TYPESCRIPT"

  report:
    name: Open or close the consumer-matrix issue
    runs-on: ubuntu-latest
    needs: [tarball, consumer-contract]
    # Scheduled runs only: a manual run is a diagnosis, not the next
    # night, so it neither opens nor closes the issue.
    if: ${{ !cancelled() && github.event_name == 'schedule' && github.ref == 'refs/heads/master' }}
    # One report at a time, so two overlapping runs cannot both find no issue
    # and both create one. A running report is never cancelled.
    concurrency:
      group: consumer-matrix-nightly-report
      cancel-in-progress: false
    permissions:
      issues: write # create, comment on and close the nightly consumer-matrix issue

    steps:
      - name: Open, update or close the consumer-matrix issue
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          RESULT: ${{ (needs.tarball.result == 'success' && needs.consumer-contract.result) || needs.tarball.result }}
          TARBALL: ${{ needs.tarball.result }}
        run: |
          TITLE="consumer-matrix: nightly consumer contract failed"
          LABEL="consumer-matrix"
          RUN_URL="${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"
          TODAY=$(date -u +%Y-%m-%d)

          open_issue() {
            # Every page of the label's open issues, so the match is exhaustive.
            gh api --paginate "repos/${GH_REPO}/issues?state=open&labels=${LABEL}&per_page=100" \
              | jq -rs --arg t "$TITLE" 'add // [] | map(select(.title == $t and (.pull_request | not))) | .[0].number // empty'
          }

          if [ "$RESULT" = "success" ]; then
            ISSUE=$(open_issue)
            if [ -n "$ISSUE" ]; then
              gh issue close "$ISSUE" \
                --comment "The nightly consumer matrix passed on ${TODAY}: ${RUN_URL}. Closing automatically."
            fi
            exit 0
          fi

          if [ "$TARBALL" = "success" ]; then
            CAUSE=$(cat <<EOF
          The packed tarball failed the consumer contract on a Node or TypeScript
          release that pull requests do not run (TypeScript \`next\`, \`latest\` or
          the oldest supported). The failing cell is in the job title; reproduce with
          \`npm run test:consumer -- --typescript <version>\`. A failure here is
          usually a toolchain release, not a pull request.
          EOF
            )
          else
            CAUSE="Building or packing the tarball ended with \`${TARBALL}\`, so no consumer contract cell ran. The \`tarball\` job's log shows the failing step."
          fi

          BODY=$(cat <<EOF
          ## Nightly consumer matrix failed — ${TODAY}

          The run ended with \`${RESULT}\`: ${RUN_URL}

          ${CAUSE}

          This issue closes itself on the next green night.

          ---
          *Auto-generated by the nightly consumer matrix workflow*
          EOF
          )

          gh label create "$LABEL" \
            --description "Automated: the nightly consumer contract matrix failed" \
            --color "B60205" 2>/dev/null || true

          ISSUE=$(open_issue)
          if [ -n "$ISSUE" ]; then
            gh issue comment "$ISSUE" --body "$BODY"
          else
            gh issue create --title "$TITLE" --label "$LABEL" --body "$BODY"
          fi
