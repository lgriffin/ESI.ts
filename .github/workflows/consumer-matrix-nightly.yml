name: Nightly Consumer Matrix

# The consumer contract (scripts/consumer-contract.ts) on the part of the
# matrix pull requests do not run: TypeScript's nightly `next` build and its
# `latest` release, on the current Node release and the active LTS, plus the
# oldest supported TypeScript on current Node. A failure here is a
# compatibility break coming from a toolchain release rather than from a pull
# request; it names the cell in the job title and the step summary.
#
# Pull requests run four rows of the matrix in ci.yml (`consumer-contract`).

on:
  schedule:
    - cron: '30 4 * * *'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: consumer-matrix-nightly
  cancel-in-progress: false

jobs:
  tarball:
    name: Build and pack
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: '20'
          cache: 'npm'

      # `prepare` builds dist/.
      - name: Install dependencies and build
        run: npm ci

      - name: Pack
        run: |
          mkdir -p consumer-tarball
          npm pack --ignore-scripts --pack-destination consumer-tarball

      - name: Upload the tarball
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: consumer-tarball
          path: consumer-tarball/*.tgz
          retention-days: 1
          if-no-files-found: error

  consumer-contract:
    name: Consumer Contract (Node ${{ matrix.node-version }}, TypeScript ${{ matrix.typescript }})
    runs-on: ubuntu-latest
    needs: tarball
    timeout-minutes: 20

    strategy:
      fail-fast: false
      matrix:
        node-version: ['lts/*', 'current']
        typescript: [next, latest]
        include:
          - node-version: 'current'
            typescript: oldest

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Setup Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: ${{ matrix.node-version }}
          cache: 'npm'

      - name: Install dependencies
        run: npm ci --ignore-scripts

      - name: Download the tarball
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: consumer-tarball
          path: consumer-tarball/

      - name: Run the consumer contract
        env:
          TYPESCRIPT: ${{ matrix.typescript }}
        run: npm run test:consumer -- --tarball "$(ls consumer-tarball/*.tgz)" --typescript "$TYPESCRIPT"
