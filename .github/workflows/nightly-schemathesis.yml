name: Nightly Schemathesis API Fuzz

on:
  schedule:
    - cron: '0 1 * * *'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  schemathesis:
    name: Schemathesis API Fuzz
    runs-on: ubuntu-latest
    timeout-minutes: 40

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Pull Schemathesis Docker image
        run: |
          docker pull schemathesis/schemathesis@sha256:9f55988d210ac6bea43088b9839ffb9db6f7224398882eb098cdbc718d4c7a59
          docker tag schemathesis/schemathesis@sha256:9f55988d210ac6bea43088b9839ffb9db6f7224398882eb098cdbc718d4c7a59 schemathesis/schemathesis

      - name: Run Schemathesis
        run: bash scripts/run-schemathesis.sh ./reports/schemathesis

      - name: Upload Schemathesis report
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        if: always()
        with:
          name: schemathesis-report
          path: reports/schemathesis/
          retention-days: 30

      - name: Summary
        if: always()
        run: |
          echo "## Nightly Schemathesis API Fuzz" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "- **Date:** $(date -u +%Y-%m-%dT%H:%M:%SZ)" >> $GITHUB_STEP_SUMMARY
          if [ -f reports/schemathesis/junit.xml ]; then
            echo "- **JUnit report:** uploaded as artifact" >> $GITHUB_STEP_SUMMARY
          else
            echo "- **JUnit report:** not produced (job did not reach the fuzz step)" >> $GITHUB_STEP_SUMMARY
          fi

  # A red scheduled run notifies nobody, so the run keeps one open issue
  # labelled `api-fuzz` and titled "api-fuzz: nightly Schemathesis run failed":
  # it creates it, or comments on it when it is already open, and closes it on
  # the next green night (GATE-05, #277). Only runs on master, so a manual
  # dispatch from a branch neither opens nor closes the issue; `!cancelled()`
  # so a run someone stopped files nothing.
  report:
    name: Open or close the api-fuzz issue
    runs-on: ubuntu-latest
    needs: schemathesis
    if: ${{ !cancelled() && github.ref == 'refs/heads/master' }}
    permissions:
      issues: write # create, comment on and close the nightly api-fuzz issue

    steps:
      - name: Open, update or close the api-fuzz issue
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          RESULT: ${{ needs.schemathesis.result }}
        run: |
          TITLE="api-fuzz: nightly Schemathesis run failed"
          LABEL="api-fuzz"
          RUN_URL="${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"
          TODAY=$(date -u +%Y-%m-%d)

          open_issue() {
            gh issue list --label "$LABEL" --state open --json number,title \
              | jq -r --arg t "$TITLE" 'map(select(.title == $t)) | .[0].number // empty'
          }

          if [ "$RESULT" = "success" ]; then
            ISSUE=$(open_issue)
            if [ -n "$ISSUE" ]; then
              gh issue close "$ISSUE" \
                --comment "The nightly Schemathesis run passed on ${TODAY}: ${RUN_URL}. Closing automatically."
            fi
            exit 0
          fi

          BODY=$(cat <<EOF
          ## Nightly Schemathesis run failed — ${TODAY}

          The \`schemathesis\` job ended with \`${RESULT}\`: ${RUN_URL}

          \`scripts/run-schemathesis.sh\` fails when the JUnit report records real
          failures, or when it cannot fetch the spec, start the Prism mock or pull
          the image. The \`schemathesis-report\` artifact holds the JUnit report;
          reproduce locally with \`npm run fuzz:api\` (Docker).

          The fuzz runs against a mock generated from the spec, so a failure is a
          contradiction inside the ESI spec or in the runner, not a bug in this
          client.

          This issue closes itself on the next green night.

          ---
          *Auto-generated by the nightly Schemathesis workflow*
          EOF
          )

          gh label create "$LABEL" \
            --description "Automated: the nightly Schemathesis API fuzz failed" \
            --color "B60205" 2>/dev/null || true

          ISSUE=$(open_issue)
          if [ -n "$ISSUE" ]; then
            gh issue comment "$ISSUE" --body "$BODY"
          else
            gh issue create --title "$TITLE" --label "$LABEL" --body "$BODY"
          fi
