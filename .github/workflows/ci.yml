name: CI/CD Pipeline

on:
  pull_request:
    branches: [master, main, develop]

permissions:
  contents: read
  pull-requests: write

jobs:
  pr-info:
    name: PR Information
    runs-on: ubuntu-latest
    if: github.event.pull_request.draft == false

    steps:
      - name: PR Details
        run: |
          echo "## Pull Request Information" >> $GITHUB_STEP_SUMMARY
          echo "- **Title:** ${{ github.event.pull_request.title }}" >> $GITHUB_STEP_SUMMARY
          echo "- **Author:** @${{ github.event.pull_request.user.login }}" >> $GITHUB_STEP_SUMMARY
          echo "- **Base:** ${{ github.event.pull_request.base.ref }}" >> $GITHUB_STEP_SUMMARY
          echo "- **Head:** ${{ github.event.pull_request.head.ref }}" >> $GITHUB_STEP_SUMMARY
          echo "- **Files Changed:** ${{ github.event.pull_request.changed_files }}" >> $GITHUB_STEP_SUMMARY
          echo "- **Additions:** +${{ github.event.pull_request.additions }}" >> $GITHUB_STEP_SUMMARY
          echo "- **Deletions:** -${{ github.event.pull_request.deletions }}" >> $GITHUB_STEP_SUMMARY

  lint-and-build:
    name: Lint & Build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run ESLint
        run: npm run lint

      - name: Check formatting
        run: npm run format:check

      - name: Build project
        run: npm run build

      - name: Type check
        run: npm run typecheck

      - name: Upload build artifacts
        uses: actions/upload-artifact@v7
        with:
          name: build-files
          path: dist/
          retention-days: 1

  static-analysis:
    name: Static Analysis
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Verify generated types are up to date
        run: |
          if npm run generate:types 2>&1 | tee /tmp/gen-types.log; then
            git diff --exit-code src/types/generated/ src/core/endpoints/esi-cache-ttls.generated.ts || {
              echo "Generated types are stale — run 'npm run generate:types' and commit the result"
              exit 1
            }
          elif grep -q "HTTP 503" /tmp/gen-types.log; then
            echo "::warning::ESI API returned 503 — skipping generated types freshness check"
          else
            cat /tmp/gen-types.log
            exit 1
          fi

      - name: Run dead code detection (knip)
        run: npx knip --no-exit-code

      - name: Security audit
        run: npm audit --audit-level=high

      - name: Check schema drift
        run: |
          if npm run schema:drift:ci 2>&1 | tee /tmp/schema-drift.log; then
            true
          elif grep -q "HTTP 503" /tmp/schema-drift.log; then
            echo "::warning::ESI API returned 503 — skipping schema drift check"
          else
            cat /tmp/schema-drift.log
            exit 1
          fi

      - name: Validate auth/scope alignment
        run: npm run validate:auth-scopes

  unit-tests:
    name: Unit Tests (Node ${{ matrix.node-version }})
    runs-on: ubuntu-latest
    needs: lint-and-build

    strategy:
      matrix:
        node-version: [18, 20, 22]

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Setup Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node-version }}
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run unit tests
        run: npm test

  coverage:
    name: Test Coverage
    runs-on: ubuntu-latest
    needs: lint-and-build

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run tests with coverage
        run: npm run coverage

      - name: Post coverage comment
        if: github.event_name == 'pull_request'
        uses: MishaKav/jest-coverage-comment@v1.0.36
        with:
          coverage-summary-path: coverage/unit/coverage-summary.json
          title: Test Coverage
          badge-title: Coverage

      - name: Upload coverage report
        uses: actions/upload-artifact@v7
        with:
          name: coverage-report
          path: coverage/
          retention-days: 30

  bdd-tests:
    name: BDD Scenarios
    runs-on: ubuntu-latest
    needs: lint-and-build

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run all BDD tests
        run: npm run bdd

  contract-tests:
    name: Contract Tests
    runs-on: ubuntu-latest
    needs: lint-and-build

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run contract tests
        run: |
          if npm run contract 2>&1 | tee /tmp/contract.log; then
            true
          elif grep -q "HTTP 503" /tmp/contract.log; then
            echo "::warning::ESI API returned 503 — skipping contract tests"
          else
            cat /tmp/contract.log
            exit 1
          fi
        env:
          ESI_LIVE_TESTS: 'true'

  fuzz-tests:
    name: Fuzz Tests
    runs-on: ubuntu-latest
    needs: lint-and-build

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run fuzz tests
        run: npm run fuzz

  full-test-suite:
    name: Complete Test Suite
    runs-on: ubuntu-latest
    needs: lint-and-build

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run all tests
        run: npm run test:all

  api-surface:
    name: API Surface Check
    runs-on: ubuntu-latest
    needs: lint-and-build

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build project
        run: npm run build

      - name: Check API report is up to date
        run: |
          npm run api-report
          # Normalize CRLF→LF and sort to ignore line-ending and enum-ordering
          # differences across Windows (dev) and Linux (CI) platforms
          if ! diff <(git show HEAD:etc/esi.ts.api.md | tr -d '\r' | sort) <(tr -d '\r' < etc/esi.ts.api.md | sort) > /dev/null 2>&1; then
            echo "API surface report is out of date. Run 'npm run api-report' locally and commit."
            git diff etc/esi.ts.api.md
            exit 1
          fi

  schemathesis:
    name: Schemathesis API Fuzz
    runs-on: ubuntu-latest
    needs: lint-and-build

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Pull Schemathesis Docker image
        run: docker pull schemathesis/schemathesis

      - name: Run Schemathesis
        run: bash scripts/run-schemathesis.sh ./reports/schemathesis
        timeout-minutes: 20

      - name: Upload Schemathesis report
        uses: actions/upload-artifact@v7
        if: always()
        with:
          name: schemathesis-report
          path: reports/schemathesis/
          retention-days: 30

  documentation:
    name: Generate Documentation
    runs-on: ubuntu-latest
    needs: lint-and-build
    if: github.ref == 'refs/heads/master' || github.ref == 'refs/heads/main'

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Generate documentation
        run: npm run docs

      - name: Upload documentation
        uses: actions/upload-artifact@v7
        with:
          name: documentation
          path: docs/
          retention-days: 30

  quality-gate:
    name: Quality Gate
    runs-on: ubuntu-latest
    needs:
      [
        unit-tests,
        bdd-tests,
        full-test-suite,
        coverage,
        static-analysis,
        contract-tests,
        fuzz-tests,
      ]
    if: always()

    steps:
      - name: Check job results
        run: |
          echo "Unit Tests: ${{ needs.unit-tests.result }}"
          echo "BDD Tests: ${{ needs.bdd-tests.result }}"
          echo "Full Test Suite: ${{ needs.full-test-suite.result }}"
          echo "Coverage: ${{ needs.coverage.result }}"
          echo "Static Analysis: ${{ needs.static-analysis.result }}"
          echo "Contract Tests: ${{ needs.contract-tests.result }}"
          echo "Fuzz Tests: ${{ needs.fuzz-tests.result }}"

      - name: Quality Gate
        if: >-
          needs.unit-tests.result != 'success' ||
          needs.bdd-tests.result != 'success' ||
          needs.full-test-suite.result != 'success' ||
          needs.coverage.result != 'success' ||
          needs.static-analysis.result != 'success' ||
          needs.contract-tests.result != 'success' ||
          needs.fuzz-tests.result != 'success'
        run: |
          echo "Quality gate failed!"
          exit 1

      - name: Quality Gate Passed
        if: >-
          needs.unit-tests.result == 'success' &&
          needs.bdd-tests.result == 'success' &&
          needs.full-test-suite.result == 'success' &&
          needs.coverage.result == 'success' &&
          needs.static-analysis.result == 'success' &&
          needs.contract-tests.result == 'success' &&
          needs.fuzz-tests.result == 'success'
        run: echo "All quality checks passed!"
