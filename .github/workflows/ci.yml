name: CI/CD Pipeline

on:
  pull_request:
    branches: [master, main, develop]

permissions:
  contents: read

jobs:
  pr-info:
    name: PR Information
    runs-on: ubuntu-latest
    # No job-level `if:` anywhere in this workflow: ci-success treats a skipped
    # job as a failed one. This job used to skip drafts; it is a few seconds of
    # echo, so it now always runs rather than needing a gate exception.

    steps:
      - name: PR Details
        env:
          PR_TITLE: ${{ github.event.pull_request.title }}
          PR_AUTHOR: ${{ github.event.pull_request.user.login }}
          PR_BASE: ${{ github.event.pull_request.base.ref }}
          PR_HEAD: ${{ github.event.pull_request.head.ref }}
          PR_FILES: ${{ github.event.pull_request.changed_files }}
          PR_ADDS: ${{ github.event.pull_request.additions }}
          PR_DELS: ${{ github.event.pull_request.deletions }}
        run: |
          echo "## Pull Request Information" >> $GITHUB_STEP_SUMMARY
          echo "- **Title:** $PR_TITLE" >> $GITHUB_STEP_SUMMARY
          echo "- **Author:** @$PR_AUTHOR" >> $GITHUB_STEP_SUMMARY
          echo "- **Base:** $PR_BASE" >> $GITHUB_STEP_SUMMARY
          echo "- **Head:** $PR_HEAD" >> $GITHUB_STEP_SUMMARY
          echo "- **Files Changed:** $PR_FILES" >> $GITHUB_STEP_SUMMARY
          echo "- **Additions:** +$PR_ADDS" >> $GITHUB_STEP_SUMMARY
          echo "- **Deletions:** -$PR_DELS" >> $GITHUB_STEP_SUMMARY

  lint-and-build:
    name: Lint & Build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run ESLint
        run: npm run lint

      # The determinism baseline only shrinks against master's copy; without
      # the ref the lint fails closed.
      - name: Fetch the determinism baseline
        run: git fetch --no-tags --depth=1 origin +refs/heads/master:refs/remotes/origin/master

      - name: Time and randomness only through the clock module
        run: npm run lint:determinism

      - name: Check formatting
        run: npm run format:check

      - name: Build project
        run: npm run build

      - name: Type check
        run: npm run typecheck

      - name: Upload build artifacts
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: build-files
          path: dist/
          retention-days: 1

  static-analysis:
    name: Static Analysis
    runs-on: ubuntu-latest
    # The generated-types and schema-drift checks compare the repository with
    # the live ESI spec, so, like `npm audit`, they can go red on a pull
    # request that changed nothing they read. Each one blocks only when the
    # pull request touches its inputs. Otherwise a failure is drift that
    # already exists on the base branch: it is downgraded to a warning, and
    # nightly-spec-drift.yml files it as a `spec-drift` issue.

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
          fetch-depth: 2 # HEAD^1 is the base tip of the pull request merge commit

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Check which spec-derived inputs this pull request touches
        id: spec-inputs
        run: |
          touches() {
            if git diff --quiet HEAD^1 HEAD -- "$@"; then echo false; else echo true; fi
          }
          {
            echo "types=$(touches scripts/generate-esi-types.ts src/types/generated/ src/core/endpoints/esi-cache-ttls.generated.ts)"
            echo "schemas=$(touches scripts/generate-schema-drift-report.ts scripts/schema-drift-core.ts scripts/schema-drift-baseline.json scripts/schema-drift-exceptions.json src/schemas/ src/core/endpoints/ package-lock.json)"
          } | tee -a "$GITHUB_OUTPUT"

      - name: Verify generated types are up to date
        env:
          TOUCHES_INPUTS: ${{ steps.spec-inputs.outputs.types }}
        run: |
          set -o pipefail
          problem=""
          if npm run generate:types 2>&1 | tee /tmp/gen-types.log; then
            if ! git diff --exit-code src/types/generated/ src/core/endpoints/esi-cache-ttls.generated.ts; then
              problem="Generated types are stale — run 'npm run generate:types' and commit the result"
            fi
          elif grep -q "HTTP 503" /tmp/gen-types.log; then
            echo "::warning::ESI API returned 503 — skipping generated types freshness check"
          else
            problem="Type generation failed — see the log above"
          fi

          if [ -z "$problem" ]; then exit 0; fi
          if [ "$TOUCHES_INPUTS" = "true" ]; then
            echo "::error::$problem"
            exit 1
          fi
          echo "::warning::$problem. This pull request does not touch the generator or the generated files, so the drift is already on the base branch; nightly-spec-drift.yml files it as a spec-drift issue."
          echo "Generated types differ from the live ESI spec (pre-existing drift, not blocking)." >> "$GITHUB_STEP_SUMMARY"

      - name: Run dead code detection (knip)
        run: npx knip --no-exit-code

      # Every public export must be referenced by a test, or listed in
      # scripts/export-coverage-baseline.json. The baseline only shrinks
      # relative to the base tip, HEAD^1 (fetch-depth 2 above); without a base
      # ref the check fails closed.
      - name: Check every public export is referenced by a test
        env:
          EXPORT_COVERAGE_BASE_REF: HEAD^1
        run: npm run test:export-coverage -- --ci

      # Drift listed in scripts/schema-drift-baseline.json passes; the baseline
      # may only shrink relative to the base tip, which fetch-depth 2 provides
      # as HEAD^1 (a pull request checkout has no origin/master).
      - name: Check schema drift
        env:
          TOUCHES_INPUTS: ${{ steps.spec-inputs.outputs.schemas }}
          SCHEMA_DRIFT_BASE_REF: HEAD^1
        run: |
          set -o pipefail
          problem=""
          if npm run schema:drift:ci 2>&1 | tee /tmp/schema-drift.log; then
            true
          elif grep -q "HTTP 503" /tmp/schema-drift.log; then
            echo "::warning::ESI API returned 503 — skipping schema drift check"
          else
            problem="Zod schemas diverge from the ESI spec beyond scripts/schema-drift-baseline.json, the baseline is stale or grew, or the check is broken — run 'npm run schema:drift' to review"
          fi

          if [ -z "$problem" ]; then exit 0; fi
          if [ "$TOUCHES_INPUTS" = "true" ]; then
            echo "::error::$problem"
            exit 1
          fi
          echo "::warning::$problem. This pull request does not touch the schemas, endpoint definitions, drift script, its baseline or its exceptions, so the drift is already on the base branch; nightly-spec-drift.yml files it as a spec-drift issue."
          echo "Zod schemas diverge from the live ESI spec (pre-existing drift, not blocking)." >> "$GITHUB_STEP_SUMMARY"

      - name: Validate auth/scope alignment
        run: npm run validate:auth-scopes

  unit-tests:
    name: Unit Tests (Node ${{ matrix.node-version }})
    runs-on: ubuntu-latest
    needs: lint-and-build

    strategy:
      matrix:
        node-version: [18, 20, 22]

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Setup Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: ${{ matrix.node-version }}
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run unit tests
        run: npm test

  coverage:
    name: Test Coverage
    runs-on: ubuntu-latest
    needs: lint-and-build
    permissions:
      contents: read
      pull-requests: write # post/update the coverage comment

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run tests with coverage
        run: npm run coverage

      - name: Post coverage comment
        if: github.event_name == 'pull_request'
        uses: MishaKav/jest-coverage-comment@642ef024cc554a34b7082cea12c7bf63575ae151 # v1.0.36
        with:
          coverage-summary-path: coverage/unit/coverage-summary.json
          title: Test Coverage
          badge-title: Coverage

      - name: Upload coverage report
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: coverage-report
          path: coverage/
          retention-days: 30

  bdd-tests:
    name: BDD Scenarios
    runs-on: ubuntu-latest
    needs: lint-and-build

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      # --json records every test Jest ran, so the report below can prove each
      # scenario in the feature files executed, not only that those that ran
      # passed. Jest does not create the output file's directory.
      - name: Run all BDD tests
        run: |
          mkdir -p reports/bdd
          npm run bdd -- --json --outputFile=reports/bdd/jest-results.json

      # Runs after a failing suite too, so the summary names the Rules that
      # broke. Fails when a scenario stated in a feature file did not execute.
      - name: Report scenarios by Rule and check each one executed
        if: ${{ !cancelled() }}
        run: npm run bdd:report

      - name: Upload the JUnit report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: bdd-junit
          path: reports/bdd/
          if-no-files-found: error
          retention-days: 30

  spec-audit:
    name: EARS Spec Audit
    runs-on: ubuntu-latest
    needs: lint-and-build

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      # The legacyStepFiles ratchet compares against master's copy of the
      # exception list; without the ref the audit fails closed.
      - name: Fetch the ratchet baseline
        run: git fetch --no-tags --depth=1 origin +refs/heads/master:refs/remotes/origin/master

      - name: Audit EARS requirements and Gherkin structure
        run: npm run spec:audit

      - name: Rule titles agree with response schemas
        run: npm run validate:spec-consistency

      - name: Scenarios mock at the transport seam
        run: npm run lint:bdd-seam

      - name: No focused, skipped, assertion-free or silenced tests
        run: npm run lint:suite-health

  contract-tests:
    name: Contract Tests
    runs-on: ubuntu-latest
    needs: lint-and-build

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      # contract:live, not contract: if ESI_LIVE_TESTS were dropped from env below,
      # `contract` would skip every suite and pass. contract:live throws instead.
      - name: Run contract tests
        run: |
          if npm run contract:live 2>&1 | tee /tmp/contract.log; then
            true
          elif grep -q "HTTP 503" /tmp/contract.log; then
            echo "::warning::ESI API returned 503 — skipping contract tests"
          else
            cat /tmp/contract.log
            exit 1
          fi
        env:
          ESI_LIVE_TESTS: 'true'

  # Recorded ESI payloads replayed through the full client pipeline at the
  # transport seam, with no network (tests/contract/AGENTS.md). Separate from
  # contract-tests, which talks to live ESI and soft-skips on a 503.
  contract-replay:
    name: Contract Replay (recorded payloads)
    runs-on: ubuntu-latest
    needs: lint-and-build

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      # unrecordable.json and known-mismatches.json only shrink against
      # master's copy; without the ref the coverage test fails closed.
      - name: Fetch the ratchet baseline
        run: git fetch --no-tags --depth=1 origin +refs/heads/master:refs/remotes/origin/master

      - name: Replay recorded payloads
        run: npm run contract:replay

  fuzz-tests:
    name: Fuzz Tests
    runs-on: ubuntu-latest
    needs: lint-and-build

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run fuzz tests
        run: npm run fuzz

  full-test-suite:
    name: Complete Test Suite
    runs-on: ubuntu-latest
    needs: lint-and-build

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run all tests
        run: npm run test:all

  api-surface:
    name: API Surface Check
    runs-on: ubuntu-latest
    needs: lint-and-build

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build project
        run: npm run build

      - name: Check API report is up to date
        run: |
          npm run api-report
          # Normalize CRLF→LF and sort to ignore line-ending and enum-ordering
          # differences across Windows (dev) and Linux (CI) platforms
          if ! diff <(git show HEAD:etc/esi.ts.api.md | tr -d '\r' | sort) <(tr -d '\r' < etc/esi.ts.api.md | sort) > /dev/null 2>&1; then
            echo "API surface report is out of date. Run 'npm run api-report' locally and commit."
            git diff etc/esi.ts.api.md
            exit 1
          fi

  consumer-contract:
    name: Consumer Contract (Node ${{ matrix.node-version }})
    runs-on: ubuntu-latest
    needs: lint-and-build
    # Packs the library, installs the tarball into tests/consumer/ copied to a
    # temporary directory, type-checks it under nodenext (CJS and ESM) and
    # bundler resolution, runs the CJS and ESM consumers, and checks every
    # sub-path in `exports` loads with the same names under require and import.
    # Node 18 has no require(esm), so it is the line that catches a `require`
    # condition resolving to an ES module.

    strategy:
      matrix:
        node-version: [18, 20, 22]

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Setup Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: ${{ matrix.node-version }}
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run the consumer contract test
        run: npm run test:consumer

  doc-examples:
    name: Documentation Examples
    runs-on: ubuntu-latest
    needs: lint-and-build
    # Type-checks every ts block in README.md, guides/ and the SDE docs against
    # the packed tarball (nodenext and bundler resolution), runs the blocks
    # marked runnable against a stubbed fetch, and checks the negative fixtures
    # are still rejected. See guides/DOCUMENTATION.md.

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      # The known-broken baseline ratchet compares against master's copy;
      # without the ref the check fails closed.
      - name: Fetch the ratchet baseline
        run: git fetch --no-tags --depth=1 origin +refs/heads/master:refs/remotes/origin/master

      # npm ci ran `prepare`, which builds dist/; pack that rather than
      # building twice. A missing dist/ fails every import, not silently.
      - name: Check the documentation examples
        run: npm run test:docs-examples -- --skip-build

  api-semver:
    name: API SemVer Gate
    runs-on: ubuntu-latest
    # api-surface proves the committed etc/esi.ts.api.md matches the code; this
    # job asks whether the pull request's commits declare what that report
    # change does. A line the report loses (a removal or a signature change)
    # needs a `type!:` commit or a `BREAKING CHANGE:` footer, so release-please
    # cannot cut a minor for a breaking change. Pure additions pass. A removal
    # that breaks nobody can say so with an `API-Compatible: <why>` trailer.
    #
    # HEAD is GitHub's merge commit for the pull request, so the script
    # compares the report at HEAD^1 (base tip) and HEAD, and reads the commits
    # in HEAD^1..HEAD^2 — the ones this pull request adds. Merge commits land
    # on master as they are, which is what release-please reads. A squash
    # merge of several commits takes the pull request title instead, so a
    # declared break also needs `type!:` in the title; the script reads the
    # current title through the API so a re-run after editing it passes.
    permissions:
      contents: read
      pull-requests: read

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
          fetch-depth: 0 # need both parents of the merge commit and the PR's commits

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: '20'
          cache: 'npm'

      # --ignore-scripts skips `prepare` (a full build); the gate only needs ts-node.
      - name: Install dependencies
        run: npm ci --ignore-scripts

      - name: Check breaking API changes are declared
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: npm run api-report:semver

  documentation:
    name: Generate Documentation
    runs-on: ubuntu-latest
    needs: lint-and-build
    # This job was conditional on github.ref being master/main, which is never
    # true for a pull_request event, so it never ran. It now runs on every PR:
    # release.yml's validate-release runs `npm run docs`, so a TypeDoc break
    # should be caught here rather than at release time.

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Generate documentation
        run: npm run docs

      - name: Upload documentation
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: documentation
          path: docs-site/public/api/
          retention-days: 30

  lockfile:
    name: Lockfile Consistency
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: '20'

      - name: Check lockfile is up to date
        env:
          PR_ACTOR: ${{ github.actor }}
        run: |
          if [ "$PR_ACTOR" = "dependabot[bot]" ]; then
            echo "::notice::Skipping byte-for-byte lockfile check for Dependabot (npm version mismatch is expected)"
            exit 0
          fi
          npm install --package-lock-only --ignore-scripts
          if ! git diff --exit-code package-lock.json; then
            echo "::error::package-lock.json is out of sync with package.json. Run 'npm install' and commit the updated lockfile."
            exit 1
          fi

  dependency-audit:
    name: Dependency Audit
    runs-on: ubuntu-latest

    # `npm audit` reports the state of the world, not the state of the diff: an
    # unchanged commit passes before an advisory is published and fails after,
    # which turns every open PR red for something its author did not do. Those
    # pre-existing advisories belong to nightly-audit.yml, which files an issue.
    # This job asks the only question the merge path can answer deterministically
    # — does *this PR* add an advisory the base branch did not already have?
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
          fetch-depth: 0 # need the base commit to audit it

      - name: Check whether dependencies changed
        id: deps
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          if git diff --quiet "$BASE_SHA" HEAD -- package.json package-lock.json; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "No dependency changes — head advisories are identical to base by construction." >> "$GITHUB_STEP_SUMMARY"
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Setup Node.js
        if: steps.deps.outputs.changed == 'true'
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: '20'
          cache: 'npm'

      # --ignore-scripts skips `prepare` (which runs a full tsup build). The only
      # thing this job needs from node_modules is ts-node for the comparison.
      - name: Install dependencies
        if: steps.deps.outputs.changed == 'true'
        run: npm ci --ignore-scripts

      - name: Audit base and head
        if: steps.deps.outputs.changed == 'true'
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          # Audit both sides the same way — from the manifest and lockfile alone,
          # in a bare directory. npm audit resolves from the lockfile, so neither
          # side needs an install, and neither side can differ because of how its
          # node_modules happened to be materialised. The two runs also hit the
          # same advisory-DB snapshot, so any difference is a real difference
          # between the trees, not a disclosure that landed between two runs.
          audit_tree() {
            local sha_or_worktree=$1 dir=$2 out=$3
            mkdir -p "$dir"
            if [ "$sha_or_worktree" = "worktree" ]; then
              cp package.json package-lock.json "$dir/"
            else
              git show "$sha_or_worktree:package.json" > "$dir/package.json"
              git show "$sha_or_worktree:package-lock.json" > "$dir/package-lock.json"
            fi
            # npm audit exits non-zero whenever it finds anything; the report is
            # still on stdout, and audit-check.ts fails loudly on an unusable file.
            (cd "$dir" && npm audit --json) > "$out" || true
          }

          audit_tree "$BASE_SHA" /tmp/base-tree /tmp/base-audit.json
          audit_tree worktree /tmp/head-tree /tmp/head-audit.json

      - name: Compare base against head
        if: steps.deps.outputs.changed == 'true'
        run: npm run audit:diff -- --base /tmp/base-audit.json --head /tmp/head-audit.json

  zizmor:
    name: Workflow Security (zizmor)
    runs-on: ubuntu-latest
    # Runs on every PR, not only when .github/ changes: a path-filtered job
    # cannot sit behind ci-success without being skipped, and the audit takes
    # seconds. Ignores live in .zizmor.yml, each with a justification.

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Install uv
        uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1

      - name: Run zizmor
        run: uvx zizmor@1.25.2 --config .zizmor.yml .github/

  # ci-success is the single required status check for this workflow (R10).
  #
  # Semantics:
  # - It `needs` every other job in this file, and the first step fails if a
  #   job is added without being listed, so nothing can run outside the gate.
  # - `if: always()` makes it report even when an upstream job fails, is
  #   skipped or is cancelled. Without it, a failure upstream would skip this
  #   job, and GitHub counts a skipped required check as passing.
  # - Every needed job must finish with result `success`. `skipped`,
  #   `cancelled` and `failure` all fail the gate. There is no allow-list.
  # - No job here has a job-level `if:`. A job that sometimes has nothing to
  #   do runs anyway and decides that in a step, with a notice or summary line
  #   (see `lockfile` and `dependency-audit`), so the job still reports
  #   `success` and the decision is visible in the log. Adding a job-level
  #   `if:` will fail the gate whenever it evaluates false; that is intended.
  ci-success:
    name: ci-success
    runs-on: ubuntu-latest
    needs:
      [
        pr-info,
        lint-and-build,
        static-analysis,
        unit-tests,
        coverage,
        bdd-tests,
        spec-audit,
        contract-tests,
        contract-replay,
        fuzz-tests,
        full-test-suite,
        api-surface,
        consumer-contract,
        doc-examples,
        api-semver,
        documentation,
        lockfile,
        dependency-audit,
        zizmor,
      ]
    if: always()

    steps:
      - name: Checkout workflow definition
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
          sparse-checkout: .github/workflows/ci.yml
          sparse-checkout-cone-mode: false

      - name: Verify the gate needs every job
        env:
          NEEDS_JSON: ${{ toJSON(needs) }}
        run: |
          command -v yq >/dev/null || { echo "::error::yq is not installed on this runner"; exit 1; }
          declared=$(yq -r '.jobs | keys | .[]' .github/workflows/ci.yml | grep -vx 'ci-success' | sort)
          needed=$(jq -r 'keys[]' <<<"$NEEDS_JSON" | sort)
          if [[ -z "$declared" ]]; then
            echo "::error::Could not read job ids from ci.yml"
            exit 1
          fi
          missing=$(comm -23 <(echo "$declared") <(echo "$needed"))
          if [[ -n "$missing" ]]; then
            echo "::error::ci-success does not need these jobs, so they cannot block a merge: $(paste -sd' ' <<<"$missing")"
            exit 1
          fi

      - name: Check every needed job succeeded
        env:
          NEEDS_JSON: ${{ toJSON(needs) }}
        run: |
          echo "## ci-success" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "| Job | Result |" >> "$GITHUB_STEP_SUMMARY"
          echo "| --- | ------ |" >> "$GITHUB_STEP_SUMMARY"
          jq -r 'to_entries[] | "| \(.key) | \(.value.result) |"' <<<"$NEEDS_JSON" >> "$GITHUB_STEP_SUMMARY"

          not_green=$(jq -r 'to_entries[] | select(.value.result != "success") | "\(.key) (\(.value.result))"' <<<"$NEEDS_JSON")
          if [[ -n "$not_green" ]]; then
            echo "::error::ci-success failed. A skipped or cancelled job counts as failed. Not green: $(paste -sd' ' <<<"$not_green")"
            exit 1
          fi
          echo "Every job in ci.yml succeeded."
