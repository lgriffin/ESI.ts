name: CI/CD Pipeline

on:
  pull_request:
    branches: [master, main, develop]

permissions:
  contents: read

jobs:
  pr-info:
    name: PR Information
    runs-on: ubuntu-latest
    if: github.event.pull_request.draft == false

    steps:
      - name: PR Details
        env:
          PR_TITLE: ${{ github.event.pull_request.title }}
          PR_AUTHOR: ${{ github.event.pull_request.user.login }}
          PR_BASE: ${{ github.event.pull_request.base.ref }}
          PR_HEAD: ${{ github.event.pull_request.head.ref }}
          PR_FILES: ${{ github.event.pull_request.changed_files }}
          PR_ADDS: ${{ github.event.pull_request.additions }}
          PR_DELS: ${{ github.event.pull_request.deletions }}
        run: |
          echo "## Pull Request Information" >> $GITHUB_STEP_SUMMARY
          echo "- **Title:** $PR_TITLE" >> $GITHUB_STEP_SUMMARY
          echo "- **Author:** @$PR_AUTHOR" >> $GITHUB_STEP_SUMMARY
          echo "- **Base:** $PR_BASE" >> $GITHUB_STEP_SUMMARY
          echo "- **Head:** $PR_HEAD" >> $GITHUB_STEP_SUMMARY
          echo "- **Files Changed:** $PR_FILES" >> $GITHUB_STEP_SUMMARY
          echo "- **Additions:** +$PR_ADDS" >> $GITHUB_STEP_SUMMARY
          echo "- **Deletions:** -$PR_DELS" >> $GITHUB_STEP_SUMMARY

  lint-and-build:
    name: Lint & Build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run ESLint
        run: npm run lint

      - name: Check formatting
        run: npm run format:check

      - name: Build project
        run: npm run build

      - name: Type check
        run: npm run typecheck

      - name: Upload build artifacts
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: build-files
          path: dist/
          retention-days: 1

  static-analysis:
    name: Static Analysis
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Verify generated types are up to date
        run: |
          if npm run generate:types 2>&1 | tee /tmp/gen-types.log; then
            git diff --exit-code src/types/generated/ src/core/endpoints/esi-cache-ttls.generated.ts || {
              echo "Generated types are stale — run 'npm run generate:types' and commit the result"
              exit 1
            }
          elif grep -q "HTTP 503" /tmp/gen-types.log; then
            echo "::warning::ESI API returned 503 — skipping generated types freshness check"
          else
            cat /tmp/gen-types.log
            exit 1
          fi

      - name: Run dead code detection (knip)
        run: npx knip --no-exit-code

      - name: Check schema drift
        run: |
          if npm run schema:drift:ci 2>&1 | tee /tmp/schema-drift.log; then
            true
          elif grep -q "HTTP 503" /tmp/schema-drift.log; then
            echo "::warning::ESI API returned 503 — skipping schema drift check"
          else
            cat /tmp/schema-drift.log
            exit 1
          fi

      - name: Validate auth/scope alignment
        run: npm run validate:auth-scopes

  unit-tests:
    name: Unit Tests (Node ${{ matrix.node-version }})
    runs-on: ubuntu-latest
    needs: lint-and-build

    strategy:
      matrix:
        node-version: [18, 20, 22]

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Setup Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: ${{ matrix.node-version }}
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run unit tests
        run: npm test

  coverage:
    name: Test Coverage
    runs-on: ubuntu-latest
    needs: lint-and-build
    permissions:
      contents: read
      pull-requests: write # post/update the coverage comment

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run tests with coverage
        run: npm run coverage

      - name: Post coverage comment
        if: github.event_name == 'pull_request'
        uses: MishaKav/jest-coverage-comment@642ef024cc554a34b7082cea12c7bf63575ae151 # v1.0.36
        with:
          coverage-summary-path: coverage/unit/coverage-summary.json
          title: Test Coverage
          badge-title: Coverage

      - name: Upload coverage report
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: coverage-report
          path: coverage/
          retention-days: 30

  bdd-tests:
    name: BDD Scenarios
    runs-on: ubuntu-latest
    needs: lint-and-build

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run all BDD tests
        run: npm run bdd

  contract-tests:
    name: Contract Tests
    runs-on: ubuntu-latest
    needs: lint-and-build

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run contract tests
        run: |
          if npm run contract 2>&1 | tee /tmp/contract.log; then
            true
          elif grep -q "HTTP 503" /tmp/contract.log; then
            echo "::warning::ESI API returned 503 — skipping contract tests"
          else
            cat /tmp/contract.log
            exit 1
          fi
        env:
          ESI_LIVE_TESTS: 'true'

  fuzz-tests:
    name: Fuzz Tests
    runs-on: ubuntu-latest
    needs: lint-and-build

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run fuzz tests
        run: npm run fuzz

  full-test-suite:
    name: Complete Test Suite
    runs-on: ubuntu-latest
    needs: lint-and-build

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run all tests
        run: npm run test:all

  api-surface:
    name: API Surface Check
    runs-on: ubuntu-latest
    needs: lint-and-build

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build project
        run: npm run build

      - name: Check API report is up to date
        run: |
          npm run api-report
          # Normalize CRLF→LF and sort to ignore line-ending and enum-ordering
          # differences across Windows (dev) and Linux (CI) platforms
          if ! diff <(git show HEAD:etc/esi.ts.api.md | tr -d '\r' | sort) <(tr -d '\r' < etc/esi.ts.api.md | sort) > /dev/null 2>&1; then
            echo "API surface report is out of date. Run 'npm run api-report' locally and commit."
            git diff etc/esi.ts.api.md
            exit 1
          fi

  documentation:
    name: Generate Documentation
    runs-on: ubuntu-latest
    needs: lint-and-build
    if: github.ref == 'refs/heads/master' || github.ref == 'refs/heads/main'

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Generate documentation
        run: npm run docs

      - name: Upload documentation
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: documentation
          path: docs/
          retention-days: 30

  lockfile:
    name: Lockfile Consistency
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: '20'

      - name: Check lockfile is up to date
        run: |
          npm install --package-lock-only --ignore-scripts
          if ! git diff --exit-code package-lock.json; then
            echo "::error::package-lock.json is out of sync with package.json. Run 'npm install' and commit the updated lockfile."
            exit 1
          fi

  dependency-audit:
    name: Dependency Audit
    runs-on: ubuntu-latest

    # `npm audit` reports the state of the world, not the state of the diff: an
    # unchanged commit passes before an advisory is published and fails after,
    # which turns every open PR red for something its author did not do. Those
    # pre-existing advisories belong to nightly-audit.yml, which files an issue.
    # This job asks the only question the merge path can answer deterministically
    # — does *this PR* add an advisory the base branch did not already have?
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
          fetch-depth: 0 # need the base commit to audit it

      - name: Check whether dependencies changed
        id: deps
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          if git diff --quiet "$BASE_SHA" HEAD -- package.json package-lock.json; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "No dependency changes — head advisories are identical to base by construction." >> "$GITHUB_STEP_SUMMARY"
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Setup Node.js
        if: steps.deps.outputs.changed == 'true'
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: '20'
          cache: 'npm'

      # --ignore-scripts skips `prepare` (which runs a full tsup build). The only
      # thing this job needs from node_modules is ts-node for the comparison.
      - name: Install dependencies
        if: steps.deps.outputs.changed == 'true'
        run: npm ci --ignore-scripts

      - name: Audit base and head
        if: steps.deps.outputs.changed == 'true'
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          # Audit both sides the same way — from the manifest and lockfile alone,
          # in a bare directory. npm audit resolves from the lockfile, so neither
          # side needs an install, and neither side can differ because of how its
          # node_modules happened to be materialised. The two runs also hit the
          # same advisory-DB snapshot, so any difference is a real difference
          # between the trees, not a disclosure that landed between two runs.
          audit_tree() {
            local sha_or_worktree=$1 dir=$2 out=$3
            mkdir -p "$dir"
            if [ "$sha_or_worktree" = "worktree" ]; then
              cp package.json package-lock.json "$dir/"
            else
              git show "$sha_or_worktree:package.json" > "$dir/package.json"
              git show "$sha_or_worktree:package-lock.json" > "$dir/package-lock.json"
            fi
            # npm audit exits non-zero whenever it finds anything; the report is
            # still on stdout, and audit-check.ts fails loudly on an unusable file.
            (cd "$dir" && npm audit --json) > "$out" || true
          }

          audit_tree "$BASE_SHA" /tmp/base-tree /tmp/base-audit.json
          audit_tree worktree /tmp/head-tree /tmp/head-audit.json

      - name: Compare base against head
        if: steps.deps.outputs.changed == 'true'
        run: npm run audit:diff -- --base /tmp/base-audit.json --head /tmp/head-audit.json

  quality-gate:
    name: Quality Gate
    runs-on: ubuntu-latest
    needs:
      [
        unit-tests,
        bdd-tests,
        full-test-suite,
        coverage,
        static-analysis,
        contract-tests,
        fuzz-tests,
        api-surface,
        lockfile,
        dependency-audit,
      ]
    if: always()

    steps:
      - name: Check all jobs
        env:
          UNIT_TESTS: ${{ needs.unit-tests.result }}
          BDD_TESTS: ${{ needs.bdd-tests.result }}
          FULL_TEST_SUITE: ${{ needs.full-test-suite.result }}
          COVERAGE: ${{ needs.coverage.result }}
          STATIC_ANALYSIS: ${{ needs.static-analysis.result }}
          CONTRACT_TESTS: ${{ needs.contract-tests.result }}
          FUZZ_TESTS: ${{ needs.fuzz-tests.result }}
          API_SURFACE: ${{ needs.api-surface.result }}
          LOCKFILE: ${{ needs.lockfile.result }}
          DEPENDENCY_AUDIT: ${{ needs.dependency-audit.result }}
        run: |
          FAILED=""
          for entry in \
            "Unit Tests=$UNIT_TESTS" \
            "BDD Scenarios=$BDD_TESTS" \
            "Complete Test Suite=$FULL_TEST_SUITE" \
            "Test Coverage=$COVERAGE" \
            "Static Analysis=$STATIC_ANALYSIS" \
            "Contract Tests=$CONTRACT_TESTS" \
            "Fuzz Tests=$FUZZ_TESTS" \
            "API Surface Check=$API_SURFACE" \
            "Lockfile Consistency=$LOCKFILE" \
            "Dependency Audit=$DEPENDENCY_AUDIT"
          do
            NAME="${entry%%=*}"
            RESULT="${entry#*=}"
            if [[ "$RESULT" != "success" ]]; then
              FAILED="$FAILED $NAME ($RESULT)"
            fi
          done
          if [[ -n "$FAILED" ]]; then
            echo "::error::Quality gate failed. Jobs not green:$FAILED"
            exit 1
          fi
          echo "All quality checks passed!"
