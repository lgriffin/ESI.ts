name: Nightly ESI Spec Drift

on:
  schedule:
    - cron: '0 6 * * *'
  workflow_dispatch:

permissions:
  contents: read
  issues: write

jobs:
  check-spec-drift:
    name: Check ESI Spec Drift
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Check for spec drift
        id: drift
        run: |
          set +e
          npx ts-node scripts/check-spec-drift.ts --latest > drift-report.json 2>drift-errors.txt
          EXIT_CODE=$?
          set -e

          if [ $EXIT_CODE -eq 0 ]; then
            echo "drift_found=false" >> "$GITHUB_OUTPUT"
          elif [ $EXIT_CODE -eq 1 ]; then
            echo "drift_found=true" >> "$GITHUB_OUTPUT"
          else
            echo "::error::Spec drift check failed with exit code $EXIT_CODE"
            cat drift-errors.txt
            exit $EXIT_CODE
          fi

          if ! jq -e . drift-report.json > /dev/null 2>&1; then
            echo "::error::drift-report.json is missing or invalid"
            cat drift-errors.txt
            exit 1
          fi

          COMPAT_DATE=$(jq -r '.compatibilityDate' drift-report.json)
          echo "compat_date=$COMPAT_DATE" >> "$GITHUB_OUTPUT"

          MISSING_COUNT=$(jq '.missing | length' drift-report.json)
          echo "missing_count=$MISSING_COUNT" >> "$GITHUB_OUTPUT"

      - name: Ensure spec-drift label exists
        if: steps.drift.outputs.drift_found == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh label create "spec-drift" \
            --description "Automated: ESI spec drift detected" \
            --color "D93F0B" 2>/dev/null || true

      - name: Check for existing drift issue
        if: steps.drift.outputs.drift_found == 'true'
        id: existing
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          EXISTING=$(gh issue list \
            --label "spec-drift" \
            --state open \
            --json number \
            --jq 'length')
          echo "open_issues=$EXISTING" >> "$GITHUB_OUTPUT"

      - name: Create drift issue
        if: steps.drift.outputs.drift_found == 'true' && steps.existing.outputs.open_issues == '0'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          COMPAT_DATE: ${{ steps.drift.outputs.compat_date }}
          MISSING_COUNT: ${{ steps.drift.outputs.missing_count }}
        run: |
          MISSING_TABLE=$(jq -r '.missing | group_by(.tag) | .[] | "### " + .[0].tag + "\n" + (map("| `" + .method + "` | `" + .path + "` |") | join("\n")) + "\n"' drift-report.json)

          gh issue create \
            --title "spec-drift: ${MISSING_COUNT} ESI endpoints missing (compat ${COMPAT_DATE})" \
            --label "spec-drift" \
            --body "$(cat <<EOF
          ## ESI Spec Drift Detected

          **Compatibility date:** \`${COMPAT_DATE}\`
          **Missing endpoints:** ${MISSING_COUNT}
          **Detected:** $(date -u +%Y-%m-%dT%H:%M:%SZ)

          ## Missing Endpoints

          | Method | Path |
          |--------|------|
          $(jq -r '.missing[] | "| \(.method) | \(.path) |"' drift-report.json)

          ### By Category

          ${MISSING_TABLE}

          ## How to Resolve

          1. Review the [ESI changelog](https://esi.evetech.net/meta/changelog) for details
          2. Run \`npx ts-node scripts/check-spec-drift.ts --latest\` locally to verify
          3. Implement missing endpoints following the patterns in CLAUDE.md
          4. Close this issue when all gaps are addressed or intentionally skipped

          ---
          *Auto-generated by the nightly spec drift workflow*
          EOF
          )"

      - name: Update existing drift issue
        if: steps.drift.outputs.drift_found == 'true' && steps.existing.outputs.open_issues != '0'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          COMPAT_DATE: ${{ steps.drift.outputs.compat_date }}
          MISSING_COUNT: ${{ steps.drift.outputs.missing_count }}
        run: |
          ISSUE_NUMBER=$(gh issue list \
            --label "spec-drift" \
            --state open \
            --json number \
            --jq '.[0].number')

          gh issue comment "$ISSUE_NUMBER" \
            --body "$(cat <<EOF
          ## Nightly Update — $(date -u +%Y-%m-%d)

          **Compatibility date:** \`${COMPAT_DATE}\`
          **Missing endpoints:** ${MISSING_COUNT}

          | Method | Path |
          |--------|------|
          $(jq -r '.missing[] | "| \(.method) | \(.path) |"' drift-report.json)
          EOF
          )"

      - name: Summary
        run: |
          echo "## ESI Spec Drift Check" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "- **Compatibility date:** ${{ steps.drift.outputs.compat_date }}" >> $GITHUB_STEP_SUMMARY
          echo "- **Drift found:** ${{ steps.drift.outputs.drift_found }}" >> $GITHUB_STEP_SUMMARY
          echo "- **Missing endpoints:** ${{ steps.drift.outputs.missing_count }}" >> $GITHUB_STEP_SUMMARY
          if [ -f drift-report.json ]; then
            echo "" >> $GITHUB_STEP_SUMMARY
            echo '```json' >> $GITHUB_STEP_SUMMARY
            cat drift-report.json >> $GITHUB_STEP_SUMMARY
            echo '```' >> $GITHUB_STEP_SUMMARY
          fi
