name: Nightly Mutation Testing

on:
  schedule:
    - cron: '0 2 * * *'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  mutation-testing:
    name: Mutation Testing
    runs-on: ubuntu-latest
    timeout-minutes: 240

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      # --incremental --force: every mutant runs, and Stryker also writes
      # reports/mutation/stryker-incremental.json for pull requests to reuse.
      - name: Run mutation testing
        run: npm run mutation -- --incremental --force

      # Pull requests (ci.yml mutation-pr) restore the newest entry by prefix.
      # Saved only after a complete run: Stryker also writes a partial
      # incremental file when interrupted, and a partial baseline would drop
      # results for the files a pull request does not re-mutate.
      - name: Publish the incremental report for pull requests
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: reports/mutation/stryker-incremental.json
          key: stryker-incremental-unit-${{ github.sha }}-${{ github.run_id }}

      # Every directory is scored against mutation-thresholds.json; pull
      # requests only check the directories they touch, so drift from merges
      # and test-only changes surfaces here.
      - name: Check per-directory ratchet
        run: npm run mutation:ratchet

      - name: Upload mutation report
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        if: always()
        with:
          name: mutation-report
          path: reports/mutation/
          retention-days: 30

      - name: Summary
        if: always()
        run: |
          echo "## Nightly Mutation Testing" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "- **Date:** $(date -u +%Y-%m-%dT%H:%M:%SZ)" >> $GITHUB_STEP_SUMMARY
          if [ -f reports/mutation/mutation.json ]; then
            echo "- **Report:** HTML, JSON and incremental report uploaded as artifact" >> $GITHUB_STEP_SUMMARY
          fi

  bdd-mutation-testing:
    name: BDD-only Mutation Testing
    runs-on: ubuntu-latest
    timeout-minutes: 300

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      # Only the BDD step definitions run, so a surviving mutant is a
      # behaviour no Rule protects.
      - name: Run BDD-only mutation testing
        run: npm run mutation:bdd

      - name: Check per-directory ratchet
        if: always()
        run: npm run mutation:bdd:ratchet

      - name: Upload BDD mutation report
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        if: always()
        with:
          name: bdd-mutation-report
          path: reports/mutation-bdd/
          retention-days: 30

  type-mutation-testing:
    name: Type Mutation Testing
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      # The ratchet compares scripts/type-mutation-thresholds.json with
      # master's copy so a floor cannot be lowered; without the ref it fails
      # closed.
      - name: Fetch the ratchet baseline
        run: git fetch --no-tags --depth=1 origin +refs/heads/master:refs/remotes/origin/master

      - name: Build declarations
        run: npm run build

      # Each mutant is one edit to dist/**/*.d.ts. A mutant the tsd suite
      # still passes against is a public type no type test pins down.
      - name: Run type mutation and check per-entry-point ratchet
        run: npm run test:type-mutation -- --ratchet

      - name: Upload type mutation report
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        if: always()
        with:
          name: type-mutation-report
          path: |
            reports/type-mutation/type-mutation.json
            reports/type-mutation/type-mutation.md
          retention-days: 30
