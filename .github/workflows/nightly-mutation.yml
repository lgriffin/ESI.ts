name: Nightly Mutation Testing

on:
  schedule:
    - cron: '0 2 * * *'
  workflow_dispatch:
    inputs:
      seed_bdd_thresholds:
        description: "Print mutation-bdd-thresholds.json raised to this run's BDD scores, and upload it, for a maintainer to review and commit"
        required: false
        default: false
        type: boolean

permissions:
  contents: read

jobs:
  # The shard names the unit matrix runs, read from mutation-unit-shards.json
  # so the list lives in one place. tests/tdd/mutation-ratchet/unitShards.test.ts
  # proves those shards partition src/core.
  unit-mutation-shards:
    name: Unit Mutation Shards
    runs-on: ubuntu-latest
    outputs:
      shards: ${{ steps.read.outputs.shards }}

    steps:
      - name: Checkout the shard list
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
          sparse-checkout: mutation-unit-shards.json
          sparse-checkout-cone-mode: false

      - name: Read the shard names
        id: read
        run: |
          shards=$(jq -c '[.shards[].name]' mutation-unit-shards.json)
          if [[ "$shards" == "[]" || -z "$shards" ]]; then
            echo "::error::mutation-unit-shards.json lists no shards"
            exit 1
          fi
          echo "shards=$shards" | tee -a "$GITHUB_OUTPUT"

  # One job per shard. A single job over all of src/core took almost exactly
  # two hours on 14, 15 and 16 September 2026 and then stopped finishing inside
  # this timeout at all: the unit suite grew past 6,000 tests, and with
  # coverageAnalysis perTest every added test slows every mutant. A nightly
  # that never completes never scores anything and never publishes a baseline.
  # fail-fast is off so one slow shard does not hide the others' scores.
  mutation-testing:
    name: Mutation (${{ matrix.shard }})
    runs-on: ubuntu-latest
    needs: unit-mutation-shards
    timeout-minutes: 240
    strategy:
      fail-fast: false
      matrix:
        shard: ${{ fromJSON(needs.unit-mutation-shards.outputs.shards) }}

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run mutation testing for this shard
        env:
          UNIT_MUTATION_SHARD: ${{ matrix.shard }}
        run: npm run mutation -- --incremental --force

      # Deliberately a different key prefix from the one ci.yml restores
      # (stryker-incremental-unit-). One shard's incremental file is a fifth of
      # a baseline, and a pull request that restored it would report a baseline
      # it does not have — which the gate reads as "a timeout here is broken,
      # not slow". Teaching mutation:pr to use these is esi-23g.55.
      - name: Publish this shard's incremental report
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: reports/mutation/shards/${{ matrix.shard }}/stryker-incremental.json
          key: stryker-unit-shard-${{ matrix.shard }}-${{ github.sha }}-${{ github.run_id }}

      - name: Upload this shard's report
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        if: always()
        with:
          name: mutation-shard-${{ matrix.shard }}
          path: reports/mutation/shards/${{ matrix.shard }}/
          retention-days: 30

  # The ratchet is per directory, so it has to see the whole run. The merge
  # refuses a shard that is missing, empty or overlapping another rather than
  # scoring a directory on the jobs that happened to survive
  # (scripts/mutation-merge-core.ts).
  mutation-ratchet:
    name: Unit Mutation Ratchet
    runs-on: ubuntu-latest
    needs: [unit-mutation-shards, mutation-testing]
    if: always() && needs.unit-mutation-shards.result == 'success'

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      # continue-on-error so a run where every shard died still reaches the
      # merge, which names the missing shards.
      - name: Download every shard's report
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        continue-on-error: true
        with:
          pattern: mutation-shard-*
          path: reports/mutation/shards
          merge-multiple: false

      - name: Name the directories after their shards
        run: |
          mkdir -p reports/mutation/shards
          cd reports/mutation/shards
          shopt -s nullglob
          for dir in mutation-shard-*; do
            [ -d "$dir" ] || continue
            mv "$dir" "${dir#mutation-shard-}"
          done
          ls -1

      - name: Merge the shard reports
        run: npm run mutation:unit:merge

      # Every directory is scored against mutation-thresholds.json; pull
      # requests only check the directories they touch, so drift from merges
      # and test-only changes surfaces here.
      - name: Check per-directory ratchet
        run: npm run mutation:ratchet

      - name: Upload the merged report
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        if: always()
        with:
          name: mutation-report
          path: reports/mutation/mutation.json
          retention-days: 30

      - name: Summary
        if: always()
        run: |
          echo "## Nightly Mutation Testing" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "- **Date:** $(date -u +%Y-%m-%dT%H:%M:%SZ)" >> $GITHUB_STEP_SUMMARY
          echo "- **Shards:** ${{ join(fromJSON(needs.unit-mutation-shards.outputs.shards), ', ') }}" >> $GITHUB_STEP_SUMMARY

  # The shard names the matrix runs, read from mutation-bdd-shards.json so the
  # list lives in one place. tests/tdd/mutation-ratchet/bddShards.test.ts
  # proves those shards partition src/, which is what makes a sharded run mean
  # the same thing as the single run it replaces.
  bdd-mutation-shards:
    name: BDD Mutation Shards
    runs-on: ubuntu-latest
    outputs:
      shards: ${{ steps.read.outputs.shards }}

    steps:
      - name: Checkout the shard list
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
          sparse-checkout: mutation-bdd-shards.json
          sparse-checkout-cone-mode: false

      - name: Read the shard names
        id: read
        run: |
          shards=$(jq -c '[.shards[].name]' mutation-bdd-shards.json)
          if [[ "$shards" == "[]" || -z "$shards" ]]; then
            echo "::error::mutation-bdd-shards.json lists no shards"
            exit 1
          fi
          echo "shards=$shards" | tee -a "$GITHUB_OUTPUT"

  # Only the BDD step definitions run, so a surviving mutant is a behaviour no
  # Rule protects. One job per shard: the unsharded run mutated all of src/
  # against the BDD suite alone and never finished — its one attempt was killed
  # at 30 minutes, which is why mutation-bdd-thresholds.json was still empty.
  # fail-fast is off so one slow shard does not hide the others' scores.
  bdd-mutation-testing:
    name: BDD Mutation (${{ matrix.shard }})
    runs-on: ubuntu-latest
    needs: bdd-mutation-shards
    timeout-minutes: 300
    strategy:
      fail-fast: false
      matrix:
        shard: ${{ fromJSON(needs.bdd-mutation-shards.outputs.shards) }}

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run BDD-only mutation testing for this shard
        env:
          BDD_MUTATION_SHARD: ${{ matrix.shard }}
        run: npm run mutation:bdd

      - name: Upload this shard's report
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        if: always()
        with:
          name: bdd-mutation-shard-${{ matrix.shard }}
          path: reports/mutation-bdd/shards/${{ matrix.shard }}/
          retention-days: 30

  # The ratchet is per directory, so it has to see the whole run. The merge
  # fails on a shard that is missing, empty or overlapping another rather than
  # scoring a directory on the jobs that happened to survive
  # (scripts/mutation-merge-core.ts). `if: always()` so a failed shard reaches
  # the merge and is named there instead of the gate being skipped.
  bdd-mutation-ratchet:
    name: BDD Mutation Ratchet
    runs-on: ubuntu-latest
    needs: [bdd-mutation-shards, bdd-mutation-testing]
    if: always() && needs.bdd-mutation-shards.result == 'success'

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      # continue-on-error so that a run where every shard died still reaches the
      # merge, which names the missing shards; a failed download would instead
      # end the job with nothing said about why.
      - name: Download every shard's report
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        continue-on-error: true
        with:
          pattern: bdd-mutation-shard-*
          path: reports/mutation-bdd/shards
          merge-multiple: false

      # download-artifact names each directory after the artifact, so strip the
      # prefix back to the shard name the merge expects.
      - name: Name the directories after their shards
        run: |
          mkdir -p reports/mutation-bdd/shards
          cd reports/mutation-bdd/shards
          shopt -s nullglob
          for dir in bdd-mutation-shard-*; do
            [ -d "$dir" ] || continue
            mv "$dir" "${dir#bdd-mutation-shard-}"
          done
          ls -1

      - name: Merge the shard reports
        run: npm run mutation:bdd:merge

      - name: Check per-directory ratchet
        run: npm run mutation:bdd:ratchet

      # mutation-bdd-thresholds.json starts empty, so the ratchet above fails
      # until a maintainer seeds it. This prints and uploads the file raised to
      # the run's own scores; it never lowers a floor and nothing commits it.
      - name: Raise the thresholds for review
        if: always() && inputs.seed_bdd_thresholds
        run: |
          if [ ! -f reports/mutation-bdd/mutation.json ]; then
            echo "::error::No merged report: the run has no scores to raise the thresholds to."
            exit 1
          fi
          npm run mutation:bdd:ratchet -- --update || true
          echo '## Proposed mutation-bdd-thresholds.json' >> "$GITHUB_STEP_SUMMARY"
          echo '```json' >> "$GITHUB_STEP_SUMMARY"
          cat mutation-bdd-thresholds.json >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"

      - name: Upload the merged report
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        if: always()
        with:
          name: bdd-mutation-report
          path: |
            reports/mutation-bdd/mutation.json
            mutation-bdd-thresholds.json
          retention-days: 30

  type-mutation-testing:
    name: Type Mutation Testing
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      # The ratchet compares scripts/type-mutation-thresholds.json with
      # master's copy so a floor cannot be lowered; without the ref it fails
      # closed.
      - name: Fetch the ratchet baseline
        run: git fetch --no-tags --depth=1 origin +refs/heads/master:refs/remotes/origin/master

      - name: Build declarations
        run: npm run build

      # Each mutant is one edit to dist/**/*.d.ts. A mutant the tsd suite
      # still passes against is a public type no type test pins down.
      - name: Run type mutation and check per-entry-point ratchet
        run: npm run test:type-mutation -- --ratchet

      - name: Upload type mutation report
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        if: always()
        with:
          name: type-mutation-report
          path: |
            reports/type-mutation/type-mutation.json
            reports/type-mutation/type-mutation.md
          retention-days: 30
