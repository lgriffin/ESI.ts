name: Nightly Security Audit

on:
  schedule:
    - cron: '0 5 * * *'
  workflow_dispatch:

permissions:
  contents: read
  issues: write

jobs:
  audit:
    name: npm Security Audit
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run npm audit
        id: audit
        run: |
          set +e
          npm audit --json > audit-report.json 2>&1
          EXIT_CODE=$?
          set -e

          if [ $EXIT_CODE -eq 0 ]; then
            echo "vuln_found=false" >> "$GITHUB_OUTPUT"
            echo "summary=No vulnerabilities found" >> "$GITHUB_OUTPUT"
          else
            echo "vuln_found=true" >> "$GITHUB_OUTPUT"
            CRITICAL=$(jq '[.vulnerabilities | to_entries[] | select(.value.severity == "critical")] | length' audit-report.json)
            HIGH=$(jq '[.vulnerabilities | to_entries[] | select(.value.severity == "high")] | length' audit-report.json)
            MODERATE=$(jq '[.vulnerabilities | to_entries[] | select(.value.severity == "moderate")] | length' audit-report.json)
            LOW=$(jq '[.vulnerabilities | to_entries[] | select(.value.severity == "low")] | length' audit-report.json)
            echo "critical=$CRITICAL" >> "$GITHUB_OUTPUT"
            echo "high=$HIGH" >> "$GITHUB_OUTPUT"
            echo "moderate=$MODERATE" >> "$GITHUB_OUTPUT"
            echo "low=$LOW" >> "$GITHUB_OUTPUT"
            TOTAL=$((CRITICAL + HIGH + MODERATE + LOW))
            echo "total=$TOTAL" >> "$GITHUB_OUTPUT"
          fi

      - name: Ensure security-audit label exists
        if: steps.audit.outputs.vuln_found == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh label create "security-audit" \
            --description "Automated: npm audit vulnerability detected" \
            --color "B60205" 2>/dev/null || true

      - name: Check for existing audit issue
        if: steps.audit.outputs.vuln_found == 'true'
        id: existing
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          EXISTING=$(gh issue list \
            --label "security-audit" \
            --state open \
            --json number \
            --jq 'length')
          echo "open_issues=$EXISTING" >> "$GITHUB_OUTPUT"

      - name: Build vulnerability table
        if: steps.audit.outputs.vuln_found == 'true'
        id: table
        run: |
          TABLE=$(jq -r '
            .vulnerabilities | to_entries[] |
            "| \(.key) | \(.value.severity) | \(.value.range // "n/a") | \(.value.fixAvailable | if type == "object" then .version else tostring end) |"
          ' audit-report.json | sort)

          {
            echo "table<<EOFTABLE"
            echo "$TABLE"
            echo "EOFTABLE"
          } >> "$GITHUB_OUTPUT"

      - name: Create audit issue
        if: steps.audit.outputs.vuln_found == 'true' && steps.existing.outputs.open_issues == '0'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TOTAL: ${{ steps.audit.outputs.total }}
          CRITICAL: ${{ steps.audit.outputs.critical }}
          HIGH: ${{ steps.audit.outputs.high }}
          MODERATE: ${{ steps.audit.outputs.moderate }}
          LOW: ${{ steps.audit.outputs.low }}
        run: |
          gh issue create \
            --title "security-audit: ${TOTAL} npm vulnerabilities detected" \
            --label "security-audit" \
            --body "$(cat <<EOF
          ## npm Security Audit — $(date -u +%Y-%m-%d)

          | Severity | Count |
          |----------|-------|
          | Critical | ${CRITICAL} |
          | High | ${HIGH} |
          | Moderate | ${MODERATE} |
          | Low | ${LOW} |
          | **Total** | **${TOTAL}** |

          ## Vulnerabilities

          | Package | Severity | Affected | Fix Available |
          |---------|----------|----------|---------------|
          ${{ steps.table.outputs.table }}

          ## How to Resolve

          1. Run \`npm audit\` locally to review details
          2. Run \`npm audit fix\` for automatic patches
          3. For breaking changes: \`npm audit fix --force\` (review carefully)
          4. Close this issue when all vulnerabilities are resolved or accepted

          ---
          *Auto-generated by the nightly security audit workflow*
          EOF
          )"

      - name: Update existing audit issue
        if: steps.audit.outputs.vuln_found == 'true' && steps.existing.outputs.open_issues != '0'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TOTAL: ${{ steps.audit.outputs.total }}
          CRITICAL: ${{ steps.audit.outputs.critical }}
          HIGH: ${{ steps.audit.outputs.high }}
          MODERATE: ${{ steps.audit.outputs.moderate }}
          LOW: ${{ steps.audit.outputs.low }}
        run: |
          ISSUE_NUMBER=$(gh issue list \
            --label "security-audit" \
            --state open \
            --json number \
            --jq '.[0].number')

          gh issue comment "$ISSUE_NUMBER" \
            --body "$(cat <<EOF
          ## Nightly Update — $(date -u +%Y-%m-%d)

          | Severity | Count |
          |----------|-------|
          | Critical | ${CRITICAL} |
          | High | ${HIGH} |
          | Moderate | ${MODERATE} |
          | Low | ${LOW} |

          | Package | Severity | Affected | Fix Available |
          |---------|----------|----------|---------------|
          ${{ steps.table.outputs.table }}
          EOF
          )"

      - name: Close issue if no vulnerabilities
        if: steps.audit.outputs.vuln_found == 'false'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          ISSUE_NUMBER=$(gh issue list \
            --label "security-audit" \
            --state open \
            --json number \
            --jq '.[0].number // empty')
          if [ -n "$ISSUE_NUMBER" ]; then
            gh issue close "$ISSUE_NUMBER" \
              --comment "All vulnerabilities resolved as of $(date -u +%Y-%m-%d). Closing automatically."
          fi

      - name: Summary
        run: |
          echo "## Nightly Security Audit" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "- **Vulnerabilities found:** ${{ steps.audit.outputs.vuln_found }}" >> $GITHUB_STEP_SUMMARY
          if [ "${{ steps.audit.outputs.vuln_found }}" == "true" ]; then
            echo "- **Critical:** ${{ steps.audit.outputs.critical }}" >> $GITHUB_STEP_SUMMARY
            echo "- **High:** ${{ steps.audit.outputs.high }}" >> $GITHUB_STEP_SUMMARY
            echo "- **Moderate:** ${{ steps.audit.outputs.moderate }}" >> $GITHUB_STEP_SUMMARY
            echo "- **Low:** ${{ steps.audit.outputs.low }}" >> $GITHUB_STEP_SUMMARY
          fi
