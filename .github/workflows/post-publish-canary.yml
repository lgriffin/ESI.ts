name: Post-publish Canary

# Tier P. Everything in release.yml checks what CI built; this checks what the
# registry serves. They are not the same artefact — publish-npm rebuilds rather
# than uploading the tarball the consumer matrix tested (esi-23g.42) — and a
# broken `exports` map is invisible until somebody installs it.
#
# The canary installs the published version into an empty directory with no
# repository on disk, then establishes four things: the registry serves the
# exact version, its signature and provenance verify, every documented
# sub-path loads under both require and import, and one real call to ESI
# returns data. scripts/release-canary-core.ts says why each one is there.
#
# A failure means consumers are broken right now, so it opens a high-severity
# issue rather than a nightly note. A published version cannot be replaced;
# guides/RELEASE.md holds the deprecate-and-fix-forward playbook.

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      version:
        description: 'Version to verify, e.g. 10.1.0 (defaults to the tag this ran on)'
        required: false
        type: string

permissions:
  contents: read

concurrency:
  group: post-publish-canary-${{ inputs.version || github.ref_name }}
  cancel-in-progress: false

jobs:
  canary:
    name: Verify what npm serves
    runs-on: ubuntu-latest
    timeout-minutes: 20
    outputs:
      verified: ${{ steps.canary.outputs.verified }}
      version: ${{ steps.canary.outputs.version }}

    steps:
      # The scripts only; the point is that nothing else from the repository is
      # on the consumer's disk. The canary builds its own project in a temp
      # directory and installs from the registry.
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: '20'
          cache: 'npm'
          registry-url: 'https://registry.npmjs.org'

      - name: Install dependencies
        run: npm ci

      # Publishing and the registry serving it are not the same instant, and
      # the release event fires on the first.
      - name: Install from the registry and verify
        id: canary
        env:
          CANARY_VERSION: ${{ inputs.version || github.ref_name }}
        run: npm run release:canary -- --wait 600

  report:
    name: File a high-severity issue
    runs-on: ubuntu-latest
    needs: canary
    if: always() && needs.canary.result != 'success'
    permissions:
      contents: read
      issues: write

    steps:
      # One issue per version, so a re-run updates rather than multiplies.
      - name: Open or update the issue
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          VERSION: ${{ needs.canary.outputs.version || inputs.version || github.ref_name }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          title="Post-publish canary failed for ${VERSION}"
          body=$(printf '%s\n' \
            "The published package did not verify. Consumers installing \`${VERSION}\` hit whatever this found." \
            "" \
            "Run: ${RUN_URL}" \
            "" \
            "A published version cannot be replaced. The playbook is in \`guides/RELEASE.md\`:" \
            "deprecate it, fix forward, publish the patch." \
            "" \
            "Re-run the canary alone with:" \
            "\`gh workflow run post-publish-canary.yml -f version=${VERSION}\`")

          existing=$(gh issue list --repo "$REPO" --state open \
            --label release-verification --search "$title in:title" \
            --json number --jq '.[0].number // empty')

          if [ -n "$existing" ]; then
            gh issue comment "$existing" --repo "$REPO" --body "$body"
          else
            gh issue create --repo "$REPO" --title "$title" --body "$body" \
              --label release-verification || \
            gh issue create --repo "$REPO" --title "$title" --body "$body"
          fi
