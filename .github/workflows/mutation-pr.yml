name: Mutation (changed files)

# The pull-request mutation gate, advisory during the 11.0.0 build-out.
#
# Until 2026-09-27 this job lived in ci.yml and ci-success needed it, so every
# pull request waited its full run (up to 37 minutes on a cold baseline) before
# it could merge. The maintainer took it out of the required check that day to
# shorten the pull-request wall clock while the roadmap's phases land, with the
# nightly (nightly-mutation.yml) still holding every floor. It runs on every
# pull request and reports its own check, so a regression is still visible on
# the pull request; it just no longer blocks the merge. ROADMAP.md's release
# gate carries the row that moves it back into ci.yml before 11.0.0 ships.

on:
  pull_request:
    branches: [master, main, develop]

permissions:
  contents: read

jobs:
  mutation-pr:
    name: Mutation (changed files)
    runs-on: ubuntu-latest
    timeout-minutes: 37
    # Runway tier K (bead esi-23g.12). Mutates only the src/ files this pull
    # request changes, reusing the nightly results for everything else, and
    # fails if a touched directory drops below its floor in
    # mutation-thresholds.json or if that file lowers a floor.
    #
    # A pull request that changes nothing in the unit mutation scope still
    # runs the job: the thresholds file is still checked, the known-weak
    # fixture still runs, and the mutation step exits 0 with a "Skipped" line
    # in the job summary.

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
          fetch-depth: 2 # HEAD^1 is the base tip of the pull request merge commit

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: '22' # Stryker 10 requires Node >= 22
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      # The nightly saves one incremental report per shard in
      # mutation-unit-shards.json (esi-23g.55). A shard's report is a whole
      # baseline for its own directories only, so this names the one shard
      # that covers every file the run may mutate, or none when the change
      # spans shards; none means a cold run, as a cache miss always did.
      - name: Choose the nightly shard baseline
        id: baseline-shard
        env:
          MUTATION_BASE_REF: HEAD^1
        run: npm run mutation:pr:shard

      # Restore only: a pull request never saves this cache. The path must be
      # the one nightly-mutation.yml saved, because it is part of the cache
      # version. A miss is not a pass: mutation:pr then mutates every file in
      # the touched directories from scratch, which may not fit the deadline
      # below — see the gate step for what that then means.
      - name: Restore the nightly incremental mutation report
        id: mutation-baseline
        if: steps.baseline-shard.outputs.shard != ''
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: reports/mutation/shards/${{ steps.baseline-shard.outputs.shard }}/stryker-incremental.json
          key: stryker-unit-shard-${{ steps.baseline-shard.outputs.shard }}-${{ github.event.pull_request.base.sha }}
          restore-keys: |
            stryker-unit-shard-${{ steps.baseline-shard.outputs.shard }}-${{ github.event.pull_request.base.sha }}-
            stryker-unit-shard-${{ steps.baseline-shard.outputs.shard }}-

      - name: Put the shard baseline where mutation:pr reads it
        if: steps.mutation-baseline.outputs.cache-matched-key != ''
        env:
          SHARD: ${{ steps.baseline-shard.outputs.shard }}
        run: cp "reports/mutation/shards/$SHARD/stryker-incremental.json" reports/mutation/stryker-incremental.json

      # The tier's signal on itself: a deliberately weak test must leave
      # surviving mutants that the ratchet fails.
      - name: Known-weak fixture leaves surviving mutants
        run: npm run mutation:fixture

      # A run that measures a regression blocks. A run that measures nothing,
      # because it had no baseline to build on and ran out of time, warns: an
      # absence of measurement is not evidence of a regression, and failing the
      # pull request for it teaches people to read a red mutation job as noise.
      # A timeout *with* the baseline restored still blocks — that run should
      # only have had the changed files to mutate. scripts/mutation-ratchet-core.ts
      # holds the policy, tests/tdd/mutation-ratchet/mutation-pr.test.ts pins it.
      #
      # The tier keeps a hard signal either way: the known-weak fixture above
      # must still leave surviving mutants, and it fails the job when it does not.
      - name: Mutate changed src/ files and check directory ratchets
        timeout-minutes: 32
        env:
          MUTATION_BASE_REF: HEAD^1
          MUTATION_BASELINE_RESTORED: ${{ steps.mutation-baseline.outputs.cache-matched-key != '' }}
          MUTATION_PR_TIMEOUT_SECONDS: '1800'
        run: npm run mutation:pr:gate -- --concurrency 4

      - name: Upload mutation report
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: mutation-pr-report
          path: |
            reports/mutation/mutation.html
            reports/mutation/mutation.json
          if-no-files-found: ignore
          retention-days: 7
