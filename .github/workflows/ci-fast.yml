name: CI Fast

on:
  push:
    branches: ['**']

permissions:
  contents: read

jobs:
  lint-build-test:
    name: Lint, Build & Test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run ESLint
        run: npm run lint

      - name: Imports point inward (layer rule)
        run: npm run lint:layers

      - name: Scenarios mock at the transport seam
        run: npm run lint:bdd-seam

      - name: No focused, skipped, assertion-free or silenced tests
        run: npm run lint:suite-health

      - name: Check formatting
        run: npm run format:check

      - name: Build project
        run: npm run build

      - name: Type check
        run: npm run typecheck

      - name: Type check the examples
        run: npm run typecheck:examples

      - name: Type check the repository scripts
        run: npm run typecheck:scripts

      - name: Type check isolatedDeclarations for the exposed layers
        run: npm run typecheck:isolated

      - name: Run unit tests
        run: npm test
